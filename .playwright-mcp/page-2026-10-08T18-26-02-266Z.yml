            - generic [ref=f55e110]: Giáo viên điểm danh, phát hiện trẻ không có mặt ở lớp nhưng không thông báo với gia đình. Trẻ bị bỏ quên nhiều giờ trên xe đưa đón, dẫn đến tử vong.
            - generic [ref=f55e111]:
              - paragraph [ref=f55e112]:
                - text: Liên quan vụ
                - link "trẻ mầm non bị bỏ quên trên xe đưa đón" [ref=f55e113] [cursor=pointer]:
                  - /url: https://vietnamnet.vn/tre-mam-non-tu-vong-do-bi-bo-quen-tren-xe-dua-don-o-thai-binh-2285808.html
                - text: của trường dẫn đến tử vong, cơ quan Công an tỉnh Thái Bình thông tin, khi vào lớp, giáo viên có chụp ảnh điểm danh học sinh gửi lên phần mềm của nhà trường để theo dõi.
              - paragraph [ref=f55e114]: Quản lý phát hiện vắng bé T.G.H (SN 20/9/2019), là học sinh lớp 4 tuổi của Trường Mầm non Hồng Nhung 2. Tuy nhiên, cả người quản lý lẫn cô giáo đứng lớp đã không kiểm tra và không thông báo cho gia đình.
              - figure "Chiếc xe đưa đón học sinh đến trường" [ref=f55e115]:
                - img "W-trẻ 5 tuổi 3.jpeg" [ref=f55e117]
              - paragraph [ref=f55e119]: Đến khoảng 17h cùng ngày, anh T.Đ.A (SN 2004, trú tại xã Dũng Nghĩa, huyện Vũ Thư) - là cậu ruột của bé H., đến đón và không thấy bé H. Anh và mọi người đi tìm, phát hiện H. bị bỏ quên trên xe đưa đón của trường. Cháu bé đã tử vong, sau nhiều giờ bị bỏ quên trên xe, trong thời tiết nắng nóng.
              - paragraph [ref=f55e120]: Khoảng 18h cùng ngày, Công an TP Thái Bình tiếp nhận tin báo của anh T.Đ.A về việc cháu H. tử vong do bị bỏ quên trên xe đưa đón.
              - paragraph [ref=f55e121]: Ngay sau khi xảy ra vụ việc, lãnh đạo Tỉnh ủy, UBND tỉnh, UBND TP, lãnh đạo Công an tỉnh đã trực tiếp chỉ đạo các đơn vị nghiệp vụ, Công an TP Thái Bình phối hợp Viện KSND tiến hành điều tra. Bước đầu cơ quan chức năng xác định, khoảng 6h20 ngày 29/5, anh N.V.L (SN 1965, trú tại phường Quang Trung, TP Thái Bình), điều khiển xe ô tô 29 chỗ cùng 1 giáo viên Trường Mầm non Hồng Nhung đón cháu H. và 9 học sinh khác đến trường.
              - paragraph [ref=f55e122]: Khi đến trường, anh L. mở cửa xe ô tô cho giáo viên và các học sinh tự đi vào lớp. Sau đó, người này điều khiển xe đỗ ở cổng trường rồi khoá cửa ra về. Khi vào lớp, giáo viên có chụp ảnh điểm danh học sinh gửi lên phần mềm của nhà trường và phát hiện vắng bé H.
              - figure "Trường Mầm non Hồng Nhung 2, nơi cháu bé theo học." [ref=f55e123]:
                - img "Tử vong 2.jpeg" [ref=f55e125]
              - paragraph [ref=f55e127]: Tuy nhiên, giáo viên này không thông báo cho gia đình để kiểm tra việc trẻ có đến lớp hay không. Bộ phận đưa đón học sinh và lái xe cũng đã không kiểm tra chéo, bàn giao để đảm bảo trẻ đã đến trường an toàn.
              - paragraph [ref=f55e128]: Đến khoảng 17h cùng ngày, anh T.Đ.A đến đón và phát hiện ra sự việc. Lúc này, H. đã bị bỏ quên trên xe đưa đón đã quá lâu, dẫn đến tử vong. Ngay trong đêm, Cơ quan Cảnh sát điều tra Công an TP Thái Bình đã ra quyết định khởi tố vụ án “Vô ý làm chết người”.
              - paragraph [ref=f55e129]: Lãnh đạo Tỉnh ủy, UBND tỉnh và các ngành chức năng đã phối hợp với cấp ủy, chính quyền cơ sở tổ chức thăm hỏi, động viên gia đình nạn nhân. Tỉnh Thái Bình cũng đã yêu cầu đơn vị chuyên môn sớm ban hành văn bản chỉ đạo, chấn chỉnh hoạt động đưa, đón, quản lý trẻ của các trường mầm non trên địa bàn.
              - figure "Thi thể cháu bé được đưa về Nhà tang lễ TP Thái Bình trong đêm." [ref=f55e130]:
                - img "W-xe llx.jpeg" [ref=f55e132]
              - paragraph [ref=f55e134]: Đến 23h đêm qua, công tác khám nghiệm hiện trường đã hoàn tất. Thi thể cháu bé đã được đưa từ Bệnh viện Đa khoa tỉnh Thái Bình về Nhà tang lễ TP Thái Bình để tổ chức tang lễ theo quy định.
              - paragraph [ref=f55e135]: Có mặt tại nhà tang lễ TP Thái Bình đêm muộn, một người thân của nạn nhân chia sẻ, hoàn cảnh của bé H. rất đáng thương khi không ở cùng bố mẹ. Bé sống với bà ở huyện Vũ Thư. "Sáng bé đi học còn vui vẻ. Chiều cậu đến đón, bé đã gặp nạn. Giá như cô giáo không thấy trẻ vào lớp, gọi báo cho gia đình để kịp thời phát hiện vụ việc thì nào đâu đến nỗi", người này nói.
