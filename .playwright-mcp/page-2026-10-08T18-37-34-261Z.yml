            - generic [ref=f296e242]:
              - generic [ref=f296e243]:
                - figure [ref=f296e244]:
                  - 'img "Chiếc xe trong vụ bỏ quên bé mầm non ở TP Thái Bình - Ảnh: KHÁNH LINH" [ref=f296e246]'
                  - paragraph [ref=f296e254]: "Chiếc xe trong vụ bỏ quên bé mầm non ở TP Thái Bình - Ảnh: KHÁNH LINH"
                - paragraph [ref=f296e255]: Thêm một đứa trẻ bị cướp đi cuộc sống chỉ vì sự vô trách nhiệm của người lớn. Vào ngày đi học cuối năm, những đứa trẻ háo hức đến trường dự liên hoan, chụp hình và bắt đầu kỳ nghỉ hè vui vẻ. Còn cậu bé ấy thì đã mãi mãi dừng lại chỉ vì một sai sót của người lớn.
                - paragraph [ref=f296e256]:
                  - text: Bé bị
                  - link "bỏ quên trên xe đưa đón" [ref=f296e257] [cursor=pointer]:
                    - /url: /mot-tre-mam-non-chet-nghi-bi-bo-quen-tren-xe-dua-don-20240529205214584.htm
                  - text: cả chục giờ đồng hồ dưới cái nóng gần 40 độ và người phát hiện ra điều này vẫn không phải lái xe, cô giáo phụ trách trên xe đưa đón, giáo viên chủ nhiệm. Người thân chỉ biết chuyện vào giờ đón cháu buổi chiều và anh cũng là người phá cửa xe, với hy vọng mong manh cứu được cháu mình.
                - paragraph [ref=f296e258]: "Niềm hy vọng đó đã tắt. Và điều đau đớn nhất của gia đình, của bất cứ ai chứng kiến, biết đến sự việc này là sự hình dung về những giây phút cuối cùng của bé: hoảng loạn, sợ hãi, có thể gào khóc tuyệt vọng trong sự đơn độc."
                - paragraph [ref=f296e259]:
                  - text: Câu chuyện đau lòng xảy ra tại Thái Bình vào ngày hôm qua gợi lại nỗi kinh hoàng hơn 4 năm về trước khi một học sinh lớp 1
                  - link "trường Gateway" [ref=f296e260] [cursor=pointer]:
                    - /url: /be-lop-1-tu-vong-tren-oto-truong-gateway-xac-nhan-chau-bi-bo-quen-tren-xe-20190806214141997.htm
                  - text: (Hà Nội) cũng bị bỏ quên trên ô tô gần 10 tiếng ngay trong ngày đầu tiên tựu trường khiến bé tử vong.
                - paragraph [ref=f296e264]: Diễn biến vụ bé 5 tuổi bị bỏ quên, tử vong trong ô tô đưa đón của trường
                - paragraph [ref=f296e265]: Sự việc kinh hoàng này đã khiến hầu hết các trường có dịch vụ xe đưa đón học sinh phải kiểm soát lại quy trình, siết chặt quản lý. Nhiều trường ở thời kỳ đó còn xây dựng thành văn bản giấy trắng mực đen quy định về việc kiểm soát, bàn giao học sinh, trách nhiệm của người phụ trách ở từng khâu đón, trả và quản lý học sinh tại trường. Có trường còn cài đặt app để lập tức báo cho phụ huynh khi trẻ vào lớp...
                - paragraph [ref=f296e266]: Nhưng chuyện "bỏ quên trẻ trên ô tô" vẫn diễn ra rải rác ở Hà Nội, Bắc Ninh… Chỉ có điều sự việc được phát hiện sớm nên trẻ đã được cứu. Không có thương vong, chuyện "bỏ quên" đã mờ nhạt. Người ta quên dần câu chuyện bỏ quên, chỉ có nỗi đau âm ỉ trong lòng những người đã mất đi người thân.
                - list [ref=f296e269]:
                  - listitem [ref=f296e270]:
                    - heading [level=4] [ref=f296e271]:
                      - 'link "Vụ trẻ 5 tuổi bị quên trên xe đưa đón: ''Cháu luôn ngồi đầu ngay sau tài xế''" [ref=f296e272] [cursor=pointer]':
                        - /url: /vu-tre-5-tuoi-bi-quen-tren-xe-dua-don-chau-luon-ngoi-dau-ngay-sau-tai-xe-20240530112528976.htm
                - paragraph [ref=f296e273]: Sự cẩn trọng, trách nhiệm của những người làm công việc liên quan tới trẻ em đã có bài học cũ, nhưng thật đáng tiếc, phải khi có thêm nỗi đau mới, nó mới được nhiều người nhìn nhận lại.
                - paragraph [ref=f296e274]:
                  - link "Truy cứu trách nhiệm" [ref=f296e275] [cursor=pointer]:
                    - /url: /khoi-to-vu-an-be-5-tuoi-bi-bo-quen-chet-trong-o-to-dua-don-cua-truong-mam-non-20240529233405663.htm
                  - text: của những người liên quan là việc phải làm bây giờ và có thể nhiều nhà trường sẽ lại kiểm tra nghiêm ngặt hơn, tăng cường trách nhiệm hơn trong việc đưa đón học sinh, bàn giao, quản lý học sinh.
                - paragraph [ref=f296e276]: Nhưng để bài học này chuyển hóa thành ý thức trách nhiệm của những người làm trong môi trường giáo dục và có liên quan tới môi trường giáo dục, trước hết, việc bảo vệ trẻ em phải trở thành nguyên tắc bắt buộc đặt lên hàng đầu trong tất cả các nhiệm vụ, ở tất cả mọi vị trí công việc và cần được kiểm soát thường xuyên, cần các bộ phận kiểm tra chéo, cần xử lý nghiêm khắc ngay với những sai phạm còn chưa để lại hậu quả lớn.
                - paragraph [ref=f296e277]: Những đứa trẻ cần ở người lớn một thứ trách nhiệm xuất phát từ nhận thức và trái tim chứ không phải những việc mang tính thời vụ, giải quyết tình thế như nhiều nhà trường đã làm. Vì nếu không như vậy, vẫn là bài học cũ nhưng sẽ còn có những nỗi đau mới…
                - figure [ref=f296e278]:
                  - 'img "Trẻ mầm non chết do bị bỏ quên trên xe: Bài học cũ, nỗi đau mới!- Ảnh 2." [ref=f296e280]'
