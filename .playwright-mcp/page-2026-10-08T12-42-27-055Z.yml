        - generic [ref=f33e397]:
          - generic [ref=f33e398]:
            - heading "Overview" [level=1] [ref=f33e399]
            - generic [ref=f33e400]:
              - heading "What is Prometheus?" [level=2] [ref=f33e401]:
                - text: What is Prometheus?
                - link [ref=f33e402] [cursor=pointer]:
                  - /url: "#what-is-prometheus"
              - paragraph [ref=f33e407]:
                - link "Prometheus" [ref=f33e408] [cursor=pointer]:
                  - /url: https://github.com/prometheus
                - text: is an open-source systems monitoring and alerting toolkit originally built at
                - link "SoundCloud" [ref=f33e414] [cursor=pointer]:
                  - /url: https://soundcloud.com
                - text: . Since its inception in 2012, many companies and organizations have adopted Prometheus, and the project has a very active developer and user
                - link "community" [ref=f33e420] [cursor=pointer]:
                  - /url: /community/
                - text: . It is now a standalone open source project and maintained independently of any company. To emphasize this, and to clarify the project's
                - link "governance" [ref=f33e421] [cursor=pointer]:
                  - /url: /governance/
                - text: structure, Prometheus joined the
                - link "Cloud Native Computing Foundation" [ref=f33e422] [cursor=pointer]:
                  - /url: https://cncf.io/
                - text: in 2016 as the second hosted project, after
                - link "Kubernetes" [ref=f33e428] [cursor=pointer]:
                  - /url: http://kubernetes.io/
                - text: .
              - paragraph [ref=f33e434]: Prometheus collects and stores its metrics as time series data, i.e. metrics information is stored with the timestamp at which it was recorded, alongside optional key-value pairs called labels.
              - paragraph [ref=f33e435]:
                - text: For more elaborate overviews of Prometheus, see the resources linked from the
                - link "media" [ref=f33e436] [cursor=pointer]:
                  - /url: /docs/introduction/media/
                - text: section.
              - heading "Features" [level=3] [ref=f33e437]:
                - text: Features
                - link [ref=f33e438] [cursor=pointer]:
                  - /url: "#features"
              - paragraph [ref=f33e443]: "Prometheus's main features are:"
              - list [ref=f33e444]:
                - listitem [ref=f33e445]:
                  - text: a multi-dimensional
                  - link "data model" [ref=f33e446] [cursor=pointer]:
                    - /url: /docs/concepts/data_model/
                  - text: with time series data identified by metric name and key/value pairs
                - listitem [ref=f33e447]:
                  - text: PromQL, a
                  - link "flexible query language" [ref=f33e448] [cursor=pointer]:
                    - /url: /docs/prometheus/latest/querying/basics/
                  - text: to leverage this dimensionality
                - listitem [ref=f33e449]: no reliance on distributed storage; single server nodes are autonomous
                - listitem [ref=f33e450]: time series collection happens via a pull model over HTTP
                - listitem [ref=f33e451]:
                  - link "pushing time series" [ref=f33e452] [cursor=pointer]:
                    - /url: /docs/instrumenting/pushing/
                  - text: is supported via an intermediary gateway
                - listitem [ref=f33e453]: targets are discovered via service discovery or static configuration
                - listitem [ref=f33e454]: multiple modes of graphing and dashboarding support
              - heading "What are metrics?" [level=3] [ref=f33e455]:
                - text: What are metrics?
                - link [ref=f33e456] [cursor=pointer]:
                  - /url: "#what-are-metrics"
              - paragraph [ref=f33e461]: Metrics are numerical measurements in layperson terms. The term time series refers to the recording of changes over time. What users want to measure differs from application to application. For a web server, it could be request times; for a database, it could be the number of active connections or active queries, and so on.
              - paragraph [ref=f33e462]: Metrics play an important role in understanding why your application is working in a certain way. Let's assume you are running a web application and discover that it is slow. To learn what is happening with your application, you will need some information. For example, when the number of requests is high, the application may become slow. If you have the request count metric, you can determine the cause and increase the number of servers to handle the load.
              - heading "Components" [level=3] [ref=f33e463]:
                - text: Components
                - link [ref=f33e464] [cursor=pointer]:
                  - /url: "#components"
              - paragraph [ref=f33e469]: "The Prometheus ecosystem consists of multiple components, many of which are optional:"
              - list [ref=f33e470]:
                - listitem [ref=f33e471]:
                  - text: the main
                  - link "Prometheus server" [ref=f33e472] [cursor=pointer]:
                    - /url: https://github.com/prometheus/prometheus
                  - text: which scrapes and stores time series data
                - listitem [ref=f33e478]:
                  - link "client libraries" [ref=f33e479] [cursor=pointer]:
                    - /url: /docs/instrumenting/clientlibs/
                  - text: for instrumenting application code
                - listitem [ref=f33e480]:
                  - text: a
                  - link "push gateway" [ref=f33e481] [cursor=pointer]:
                    - /url: https://github.com/prometheus/pushgateway
                  - text: for supporting short-lived jobs
                - listitem [ref=f33e487]:
                  - text: special-purpose
                  - link "exporters" [ref=f33e488] [cursor=pointer]:
                    - /url: /docs/instrumenting/exporters/
                  - text: for services like HAProxy, StatsD, Graphite, etc.
                - listitem [ref=f33e489]:
                  - text: an
                  - link "alertmanager" [ref=f33e490] [cursor=pointer]:
                    - /url: https://github.com/prometheus/alertmanager
                  - text: to handle alerts
                - listitem [ref=f33e496]: various support tools
              - paragraph [ref=f33e497]:
                - text: Most Prometheus components are written in
                - link "Go" [ref=f33e498] [cursor=pointer]:
                  - /url: https://go.dev/
                - text: ", making them easy to build and deploy as static binaries."
              - heading "Architecture" [level=3] [ref=f33e504]:
                - text: Architecture
                - link [ref=f33e505] [cursor=pointer]:
                  - /url: "#architecture"
              - paragraph [ref=f33e510]: "This diagram illustrates the architecture of Prometheus and some of its ecosystem components:"
              - paragraph [ref=f33e511]:
                - img "Prometheus architecture" [ref=f33e512]
              - paragraph [ref=f33e513]:
                - text: Prometheus scrapes metrics from instrumented jobs, either directly or via an intermediary push gateway for short-lived jobs. It stores all scraped samples locally and runs rules over this data to either aggregate and record new time series from existing data or generate alerts.
                - link "Grafana" [ref=f33e514] [cursor=pointer]:
                  - /url: https://grafana.com/
                - text: or other API consumers can be used to visualize the collected data.
              - heading "When does it fit?" [level=2] [ref=f33e520]:
                - text: When does it fit?
                - link [ref=f33e521] [cursor=pointer]:
                  - /url: "#when-does-it-fit"
              - paragraph [ref=f33e526]: Prometheus works well for recording any purely numeric time series. It fits both machine-centric monitoring as well as monitoring of highly dynamic service-oriented architectures. In a world of microservices, its support for multi-dimensional data collection and querying is a particular strength.
              - paragraph [ref=f33e527]: Prometheus is designed for reliability, to be the system you go to during an outage to allow you to quickly diagnose problems. Each Prometheus server is standalone, not depending on network storage or other remote services. You can rely on it when other parts of your infrastructure are broken, and you do not need to set up extensive infrastructure to use it.
              - heading "When does it not fit?" [level=2] [ref=f33e528]:
                - text: When does it not fit?
                - link [ref=f33e529] [cursor=pointer]:
                  - /url: "#when-does-it-not-fit"
              - paragraph [ref=f33e534]: Prometheus values reliability. You can always view what statistics are available about your system, even under failure conditions. If you need 100% accuracy, such as for per-request billing, Prometheus is not a good choice, as the collected data will likely not be detailed and complete enough. In such a case, you would be best off using some other system to collect and analyze the data for billing, and Prometheus for the rest of your monitoring.
