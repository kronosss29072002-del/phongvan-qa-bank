              - paragraph [ref=f87e386]:
                - generic [ref=f87e387]: Xử lý
                - text: "GET/HEAD = đọc (safe); POST = tạo/submit, không an toàn; PUT = thay thế toàn bộ resource (idempotent); DELETE = xóa (idempotent); PATCH = sửa một phần (không idempotent); OPTIONS = hỏi khả năng. Trả status code đúng ngữ nghĩa: 201 khi tạo, 204 khi xóa thành công."
