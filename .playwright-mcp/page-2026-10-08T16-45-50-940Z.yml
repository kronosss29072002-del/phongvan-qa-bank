              - paragraph [ref=f87e293]: Haychuỗi phân giải DNS · recursive resolver · stub resolver
              - paragraph [ref=f87e294]:
                - generic [ref=f87e295]: Vấn đề
                - text: Trước khi request HTTP đầu tiên rời khỏi máy, client phải dịch 'api.example.com' thành IP — nếu mỗi trình ứng dụng tự tra từ đầu (hỏi root → TLD → authoritative) thì mỗi lần mở trang mất thêm vài trăm ms độ trễ và Internet phải gánh lượng query khổng lồ lặp đi lặp lại. Chuỗi phân giải (stub → recursive resolver → root/TLD/authoritative) ra đời để gom việc tra cứu vào một chỗ.
              - paragraph [ref=f87e296]:
                - generic [ref=f87e297]: Nguồn gốc
                - text: Paul Mockapetris, 1983 (USC ISI); RFC 882/883 (11/1983), chuẩn hóa lại bởi RFC 1034/1035 (11/1987)
              - paragraph [ref=f87e298]:
                - generic [ref=f87e299]: Xử lý
                - text: Stub resolver cục bộ gửi 1 câu hỏi cho recursive resolver (thường của ISP); resolver này tự hỏi root, rồi server TLD (.com), rồi authoritative server của domain, trả lời cho client và cache kết quả theo TTL.
