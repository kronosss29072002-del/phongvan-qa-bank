              - generic [ref=f87e223]: B
              - generic [ref=f87e224]: Cơ bản
            - generic [ref=f87e225]:
              - generic [ref=f87e226]:
                - heading "ARP" [level=4] [ref=f87e227]
                - button "Liên kết tới ARP" [ref=f87e228] [cursor=pointer]: "#"
                - generic [ref=f87e229]: Mạng & Giao thức
              - paragraph [ref=f87e230]: HayAddress Resolution Protocol
              - paragraph [ref=f87e231]:
                - generic [ref=f87e232]: Vấn đề
                - text: Ethernet truyền frame dựa trên địa chỉ MAC (địa chỉ phần cứng), nhưng ứng dụng/stack chỉ biết địa chỉ IP — không có cơ chế nào dịch IP sang MAC nên gói không thể đi được trong cùng một LAN; mỗi hệ điều hành sẽ lại tự nghĩ ra cách khác nhau.
              - paragraph [ref=f87e233]:
                - generic [ref=f87e234]: Nguồn gốc
                - text: RFC 826, David C. Plummer, 11/1982.
              - paragraph [ref=f87e235]:
                - generic [ref=f87e236]: Xử lý
                - text: Máy broadcast ARP request 'ai có IP này báo lại địa chỉ MAC của mình', máy sở hữu trả lời, bảng ARP cache lại để các frame sau không phải hỏi lại.
              - paragraph [ref=f87e237]:
                - text: Liên quan
                - link "IP" [ref=f87e238] [cursor=pointer]:
                  - /url: "#e-ip"
                - text: · MAC address ·
                - link "TCP" [ref=f87e239] [cursor=pointer]:
                  - /url: "#e-tcp"
                - text: · Subnet · Proxy
          - article [ref=f87e240]:
            - generic [aria-hidden] [ref=f87e241]:
              - generic [ref=f87e242]: № 029
              - generic [ref=f87e243]: B
              - generic [ref=f87e244]: Cơ bản
            - generic [ref=f87e245]:
              - generic [ref=f87e246]:
                - heading "Context switch cost" [level=4] [ref=f87e247]
                - button "Liên kết tới Context switch cost" [ref=f87e248] [cursor=pointer]: "#"
                - generic [ref=f87e249]: Mạng & Giao thức
              - paragraph [ref=f87e250]: Haychi phí đổi ngữ cảnh · tốn kém context switch
              - paragraph [ref=f87e251]:
                - generic [ref=f87e252]: Vấn đề
                - text: Mỗi lần CPU chuyển từ tiến trình/thread này sang tiến trình khác, hệ điều phải lưu thanh ghi, cập nhật bảng bảng điều phối, và thường phải flush TLB + làm nhiễu cache CPU — sau đó gần như mọi tham chiếu bộ nhớ đều miss cho tới khi TLB nạp lại. Với 10.000 kết nối đang active, hàng nghìn context switch mỗi giây khiến phần lớn CPU mất vào 'việc nội bộ' thay vì phục vụ request; đây là lý do đo lường thực tế cho thấy thread-per-connection không scale dù RAM còn đủ.
              - paragraph [ref=f87e253]:
                - generic [ref=f87e254]: Nguồn gốc
                - text: không rõ (khái niệm tồn tại từ OS thời kỳ đầu; số liệu cụ thể tùy kiến trúc)
              - paragraph [ref=f87e255]:
                - generic [ref=f87e256]: Xử lý
                - text: "Giảm số lần phải đổi ngữ cảnh: gom nhiều kết nối vào ít thread (event loop), hoặc dùng user-space thread (goroutine) vốn switch gần như rẻ như một lời gọi hàm vì không cần flush TLB."
              - paragraph [ref=f87e257]:
                - text: Liên quanThread-per-connection ·
                - link "Non-blocking I/O" [ref=f87e258] [cursor=pointer]:
                  - /url: "#e-non-blocking-i-o"
                - text: ·
                - link "Event loop" [ref=f87e259] [cursor=pointer]:
