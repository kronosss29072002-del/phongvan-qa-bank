                - text: Mọi request tĩnh (HTML, ảnh, JS) đều phải bay tới origin server khiến origin bị overload và user ở xa chờ cả RTT lẫn thời gian server. Trước khi có Cache-Control, caches dùng Expires tuyệt đối — múi giờ lệch là cache sai vĩnh viễn; còn không có cache thì băng thông và độ trễ không cải thiện được.
              - paragraph [ref=f87e361]:
                - generic [ref=f87e362]: Nguồn gốc
                - text: RFC 2616 (HTTP/1.1, 6/1997) định nghĩa Cache-Control; RFC 7234 (2014); hiện hành RFC 9111 (6/2022)
              - paragraph [ref=f87e363]:
                - generic [ref=f87e364]: Xử lý
                - text: Server chỉ định max-age=N (đếm từ lúc sinh ra response, header Age tính nốt thời gian đã nằm ở cache trung gian); trong N giây cache dùng luôn không hỏi origin. no-cache = vẫn lưu nhưng phải revalidate mỗi lần, no-store = cấm lưu, private = chỉ browser được cache (chống rò rỉ data cá nhân ra shared cache).
