            - listitem [ref=f1e629]:
              - paragraph [ref=f1e630]: Đối tác gọi POST /payments, cổng thanh toán timeout sau 30 giây nên client retry ba lần cho cùng một đơn. Trong tuần có 1.200 đơn bị trừ tiền hai lần, lệch 49.000 đến 2 triệu đồng mỗi đơn; log ghi ba request với body giống hệt nhau.
              - heading "Em chặn double charge khi client retry thế nào, trong khi vẫn phải trả kết quả cũ cho các lần retry sau?" [level=4] [ref=f1e631]
              - list [ref=f1e632]:
                - listitem [ref=f1e633]: Tái hiện double charge bằng hai request song song cùng body, ghi lại cả hai giao dịch tiền trong DB.
                - listitem [ref=f1e634]: "Đối chiếu log: client giữ nguyên body nhưng không gửi Idempotency-Key, server không có gì để phân biệt hai lần gọi."
                - listitem [ref=f1e635]: Bắt buộc header Idempotency-Key cho POST /payments, trả 400 kèm hướng dẫn khi thiếu.
                - listitem [ref=f1e636]: Lưu key vào bảng riêng có unique index trên (key, merchant_id), kèm trạng thái xử lý và response đã ghi.
                - listitem [ref=f1e637]: Với request trùng, trả đúng response của lần đầu; hai request song song thì một thắng unique constraint, request kia chờ rồi đọc kết quả.
                - listitem [ref=f1e638]: Gắn TTL cho key theo dedup window 24 giờ và dọn key cũ bằng job riêng, không xóa trong lúc traffic đang chạy.
                - listitem [ref=f1e639]: "Viết regression test: 50 retry song song cùng key, assert chỉ một giao dịch được tạo và mọi response giống nhau."
