                  - text: Đổi mật khẩu DB một lần cho toàn bộ pod vào giờ thấp điểm rồi restart, không có đường lùi và không kiểm tra ai còn dùng.
        - generic [ref=f1e1454]:
          - heading "Vận hành & Ứng phó sự cố 8 câu" [level=3] [ref=f1e1455]:
            - text: Vận hành & Ứng phó sự cố
            - generic [ref=f1e1456]: 8 câu
          - paragraph [ref=f1e1457]: "8 câu phỏng vấn tình huống cho vòng senior backend: mở pager lúc 3h sáng, chọn giữa rollback và fix-forward, cứu service bị OOM killer, cắt đàn ong khi hệ thống phục hồi, chẩn đoán khi thiếu tín hiệu, xử lý sự cố phát sinh từ config, điều phối postmortem không đổ lỗi, và dọn hệ thống cảnh báo đang làm on-call mất cảnh giác. Mỗi câu có thứ tự điều tra trước can thiệp, thuật ngữ đối chiếu glossary, cùng tín hiệu tốt và tín hiệu xấu để chấm điểm."
          - list [ref=f1e1458]:
            - listitem [ref=f1e1459]:
              - paragraph [ref=f1e1460]: "03:12 pager reng: checkout-service 5xx tăng từ 0,1% lên 6,2% trong 3 phút, p99 từ 240ms lên 6,8s, các service khác vẫn xanh. Bạn là on-call duy nhất lúc đó."
              - heading "10 phút đầu của bạn trông ra sao, và mốc nào để bạn escalate thay vì tự xử lý?" [level=4] [ref=f1e1461]
              - list [ref=f1e1462]:
                - listitem [ref=f1e1463]: "Xác nhận cảnh báo là thật: mở RED của checkout, số 5xx ở LB, trạng thái downstream, loại alert flaky."
                - listitem [ref=f1e1464]: "Chốt mốc thời gian: 5xx đổi từ lúc nào, có trùng deploy, migration hay job định kỳ trong đêm."
                - listitem [ref=f1e1465]: Lấy 3-5 request lỗi theo correlation ID, đối chiếu log từng tầng để tìm đúng điểm gãy.
                - listitem [ref=f1e1466]: "Can thiệp mitigate theo bằng chứng: rollback, tắt feature flag hoặc tăng replica, không đoán nguyên nhân."
                - listitem [ref=f1e1467]: "Báo trạng thái lên kênh sự cố mỗi 10 phút: ảnh hưởng thực, action đã làm, bước tiếp theo."
                - listitem [ref=f1e1468]: Quá 15 phút chưa locate được hoặc lỗi vượt 5% request thì escalate, không kéo thêm.
                - listitem [ref=f1e1469]: Khi metric về baseline, giám sát 15 phút rồi gom dữ kiện cho postmortem.
