              - heading "Anh thiết kế lại canary thế nào để bắt được đúng loại lỗi này sớm hơn?" [level=4] [ref=f1e1703]
              - list [ref=f1e1704]:
                - listitem [ref=f1e1705]: "Chốt tín hiệu quyết định trước: tỉ lệ lỗi, p99 và chỉ số nghiệp vụ của luồng vừa thay đổi"
                - listitem [ref=f1e1706]: So metric theo phiên bản deploy để tách ảnh hưởng của bản mới khỏi nhiễu nền
                - listitem [ref=f1e1707]: "Kiểm phân bố nhóm canary có đại diện không: gói trả phí, region, thiết bị chứ không chỉ traffic tổng"
                - listitem [ref=f1e1708]: Đặt cửa sổ và ngưỡng tự động nâng traffic, có người xác nhận tại các mốc 5% và 50%
                - listitem [ref=f1e1709]: Chạy smoke test và bài kiểm nghiệp vụ trên chính nhóm canary trước khi nâng tiếp
