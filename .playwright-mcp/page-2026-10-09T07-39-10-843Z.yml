                - paragraph [ref=f1e1366]:
                  - generic [ref=f1e1367]: Tín hiệu tốt
                  - text: Khoanh vùng secret đã lộ, xoay trước khi dọn dẹp, đưa vào secret manager và giới hạn quyền đọc theo từng job.
                - paragraph [ref=f1e1368]:
                  - generic [ref=f1e1369]: Dấu hiệu sai
                  - text: Chỉ xóa giá trị khỏi file cấu hình và xóa log, giữ nguyên credential cũ, không kiểm tra ai đã đọc được.
            - listitem [ref=f1e1370]:
              - paragraph [ref=f1e1371]: App mobile dùng JWT hạn 24 giờ, không có cơ chế thu hồi trước hạn; tuần trước 3 máy của nhân viên bị mất và team an toàn yêu cầu khóa phiên ngay. API gateway chỉ xác minh chữ ký JWT, không có session store.
              - heading "Anh chọn session hay JWT cho mobile, dựa trên tiêu chí nào, và triển khai thu hồi ra sao?" [level=4] [ref=f1e1372]
              - list [ref=f1e1373]:
                - listitem [ref=f1e1374]: "Chốt yêu cầu trước: cần thu hồi tức thời trên thiết bị nào, trong bao lâu, có bắt buộc với mọi phiên không"
                - listitem [ref=f1e1375]: "Cân chi phí hai phương án: session store phải scale và thêm độ trễ, JWT cần tầng thu hồi bổ sung"
                - listitem [ref=f1e1376]: Chọn access token TTL ngắn, refresh token rotation giữ trạng thái phía server để có điểm revoke
                - listitem [ref=f1e1377]: Bắt buộc PKCE cho luồng login mobile, không nhúng client secret trong app, gắn token với thiết bị
                - listitem [ref=f1e1378]: "Triển khai revoke: đưa jti vào danh sách chặn tới hạn exp, xóa refresh token của thiết bị bị mất"
                - listitem [ref=f1e1379]: "Đo lại: xác nhận thiết bị mất bị chặn trong vòng một chu kỳ refresh, theo dõi tỉ lệ refresh lỗi sau rollout"
              - paragraph [ref=f1e1380]:
                - text: Thuật ngữ
                - link "Opaque token vs JWT (revocation trade-off)" [ref=f1e1381] [cursor=pointer]:
                  - /url: "#e-opaque-token-vs-jwt-revocation-trade-off"
