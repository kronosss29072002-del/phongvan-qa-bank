            - listitem [ref=f1e1260]:
              - paragraph [ref=f1e1261]: Đúng 14:02, fraud-service chết hoàn toàn, trong khi bình thường p99 của nó là 180ms còn client đang để timeout 3s. Checkout p99 leo từ 400ms lên 11s, thread pool cạn sau 90 giây, 62% request checkout fail dù phần còn lại của hệ thống vẫn chạy tốt.
              - heading "Dependency quan trọng chết giữa giờ cao điểm, em xử lý sự cố ngay lúc đó thế nào và thiết kế lại ra sao để lần sau không sập theo?" [level=4] [ref=f1e1262]
              - list [ref=f1e1263]:
                - listitem [ref=f1e1264]: "Xác định blast radius qua trace: request nào gọi fraud-service, tỉ lệ lỗi và latency theo từng endpoint."
                - listitem [ref=f1e1265]: Bật circuit breaker để fail fast, trả degraded response thay vì giữ thread chờ timeout 3s.
                - listitem [ref=f1e1266]: Chuyển kiểm tra gian lận sang bộ rule chạy offline, đánh dấu giao dịch bất thường chờ review thủ công.
                - listitem [ref=f1e1267]: Cắt tải các endpoint không critical, giữ checkout chạy ở chế độ degraded có kiểm soát thay vì từ chối hết.
                - listitem [ref=f1e1268]: Theo dõi thread pool và connection pool hồi phục, gỡ cảnh báo khi các metric về ngưỡng bình thường.
                - listitem [ref=f1e1269]: "Thiết kế lại: timeout 180ms, retry budget, bulkhead pool riêng cho dependency dễ hỏng, health check endpoint."
                - listitem [ref=f1e1270]: Viết postmortem có timeline và nguyên nhân, thêm chaos test kill fraud-service vào staging mỗi quý.
