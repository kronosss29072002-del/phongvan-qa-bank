              - generic [ref=f1e1054]:
                - paragraph [ref=f1e1055]:
                  - generic [ref=f1e1056]: Tín hiệu tốt
                  - text: Biết CREATE UNIQUE INDEX CONCURRENTLY không khóa bảng, và dọn dữ liệu trùng trước khi gắn constraint theo đúng thứ tự.
                - paragraph [ref=f1e1057]:
                  - generic [ref=f1e1058]: Dấu hiệu sai
                  - text: Chạy ALTER TABLE trực tiếp lên bảng 300 triệu dòng mà không kiểm tra dữ liệu trùng, hoặc không biết CONCURRENTLY tồn tại.
            - listitem [ref=f1e1059]:
              - paragraph [ref=f1e1060]: Backup hàng đêm chạy đều, status xanh suốt 14 tháng nhưng chưa ai restore thử. Tuần trước một dòng dữ liệu bị xóa nhầm, restore mất 9 tiếng và dữ liệu của 4 giờ cuối trước lúc backup không có. RPO đo được thực tế là 24 giờ thay vì con số trong tài liệu.
              - heading "Cậu tổ chức backup và restore thế nào để RPO/RTO cam kết là số thật, không phải số trên giấy?" [level=4] [ref=f1e1061]
              - list [ref=f1e1062]:
                - listitem [ref=f1e1063]: "Xác định cam kết thực: RPO, RTO và loại backup đang có, điểm phục hồi cuối của từng loại"
                - listitem [ref=f1e1064]: "Chạy restore test trên môi trường riêng: restore full rồi replay WAL, đo chính xác thời gian đạt điểm phục hồi"
                - listitem [ref=f1e1065]: Kiểm tra dữ liệu sau restore bằng checksum hoặc đối chiếu số dòng, không dừng ở việc file mở được
                - listitem [ref=f1e1066]: Bổ sung WAL lưu liên tục hoặc tăng tần suất full backup để kéo RPO từ 24 giờ về mức cam kết
                - listitem [ref=f1e1067]: Đặt lịch restore drill hằng tháng tự động, alert khi restore vượt RTO hoặc phát hiện mất dữ liệu
                - listitem [ref=f1e1068]: Viết runbook restore đủ chi tiết để người trực làm được trong RTO, thử với người không phải tác giả
