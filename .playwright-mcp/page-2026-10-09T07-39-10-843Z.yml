                - text: "Replicate state machine sang nhiều node để chịu lỗi crash: log thứ tự sai lệch giữa replica thì FSM phân kỳ (một node cộng tiền, node kia không) — cần thuật toán đồng thuận có chứng minh an toàn, thay vì tự nghĩ 'nhờ đa số confirm' rồi để lọt corner case khi acceptor chết giữa chừng."
              - paragraph [ref=f1e369]:
                - generic [ref=f1e370]: Nguồn gốc
                - text: Leslie Lamport — nộp 1989, xuất bản 'The Part-Time Parliament', ACM Transactions on Computer Systems, 1998.
              - paragraph [ref=f1e371]:
                - generic [ref=f1e372]: Xử lý
                - text: "Qua hai phase (prepare/accept): đa số acceptor chấp nhận một giá trị cho mỗi slot log; khi một giá trị đã được chọn thì mọi round sau phải re-propose đúng giá trị đó — an toàn dưới mọi kiểu crash, nhưng không guarantee terminate (theo FLP), nên thực tế dựa vào tiến trình mới."
