            - listitem [ref=f1e1349]:
              - paragraph [ref=f1e1350]: Log build trên CI in ra cấu hình có DB_PASSWORD production đặt qua biến môi trường; log lưu 90 ngày và mọi người trong org đều đọc được. Một người ngoài team đã tải log của lần build tháng trước.
              - heading "Anh chuyển toàn bộ secret khỏi CI sang quản lý tập trung thế nào mà pipeline không dừng?" [level=4] [ref=f1e1351]
              - list [ref=f1e1352]:
                - listitem [ref=f1e1353]: Liệt kê toàn bộ secret đang nằm trong CI config, biến môi trường và log build để biết chính xác cái gì đã lộ
                - listitem [ref=f1e1354]: "Xoay ngay các secret từng xuất hiện trong log: coi như đã lộ, đổi DB password và API key trước mọi việc khác"
                - listitem [ref=f1e1355]: "Che log build: mask biến nhạy cảm ở tầng runner, tắt in cấu hình, xử lý log cũ còn chứa giá trị"
                - listitem [ref=f1e1356]: Đưa secret vào secret manager, CI chỉ nhận tham chiếu lúc chạy thay vì giá trị nằm trong repo hay config
                - listitem [ref=f1e1357]: Phân quyền đọc theo job và theo môi trường, tách quyền truy cập production khỏi pipeline build thường
                - listitem [ref=f1e1358]: Gắn scanner chặn commit chứa secret và kiểm tra định kỳ để secret không quay lại mã nguồn
              - paragraph [ref=f1e1359]:
