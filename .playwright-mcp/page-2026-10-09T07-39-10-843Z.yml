        - generic [ref=f1e1282]:
          - heading "Bảo mật & Xác thực 8 câu" [level=3] [ref=f1e1283]:
            - text: Bảo mật & Xác thực
            - generic [ref=f1e1284]: 8 câu
          - paragraph [ref=f1e1285]: "Tám tình huống bảo mật cho vòng phỏng vấn senior backend: token lọt vào log tập trung, IDOR phát hiện khi review code, SSRF từ URL do người dùng nhập, secret production nằm trong CI, chọn session hay JWT cho mobile, CORS cấu hình sai mở toang, SQL injection lọt qua raw query trong ORM, và xoay credential không downtime. Mỗi câu có thứ tự điều tra trước can thiệp, thuật ngữ đối chiếu glossary, cùng tín hiệu tốt và tín hiệu xấu để chấm điểm."
          - list [ref=f1e1286]:
            - listitem [ref=f1e1287]:
              - paragraph [ref=f1e1288]: API gateway ghi cả header Authorization chứa Bearer token vào log request, đẩy về ELK tập trung với retention 30 ngày cho 12 người có quyền đọc. Đợt rà soát quyền truy cập phát hiện token của một khách hàng doanh nghiệp vẫn nằm nguyên văn trong log cũ.
              - heading "Anh xử lý từ lúc phát hiện đến khi chốt xong, và sửa gì ở tầng ghi log để việc này không tái diễn?" [level=4] [ref=f1e1289]
              - list [ref=f1e1290]:
                - listitem [ref=f1e1291]: "Xác định phạm vi rò rỉ: query ELK đếm mọi request có header Authorization trong 30 ngày, tách theo service và khách hàng"
                - listitem [ref=f1e1292]: "Kiểm tra token còn hiệu lực hay không: đọc exp và jti, đối chiếu các phiên đang hoạt động của tài khoản đó"
                - listitem [ref=f1e1293]: "Thu hồi trước khi dọn dẹp: revoke refresh token, chấm dứt phiên liên quan, buộc đăng nhập lại các thiết bị bị ảnh hưởng"
                - listitem [ref=f1e1294]: "Làm sạch log đã lưu: chạy job redact che đúng pattern Bearer trong index cũ, không xóa cả index để giữ dấu vết điều tra"
                - listitem [ref=f1e1295]: "Sửa tầng ghi log: redaction tại gateway và app, loại các field Set-Cookie, Authorization, password trước khi serialize"
                - listitem [ref=f1e1296]: "Thêm test hồi quy: bản ghi log mẫu chứa token phải bị che, chạy trong CI như điều kiện chặn merge"
