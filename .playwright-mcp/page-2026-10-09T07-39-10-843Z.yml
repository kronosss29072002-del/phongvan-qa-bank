            - listitem [ref=f1e1308]:
              - paragraph [ref=f1e1309]: "PR cho endpoint GET /api/invoices/{id} lấy hóa đơn theo id rồi trả về thẳng, không đối chiếu chủ sở hữu. Rà tiếp trong repo phát hiện cùng pattern ở 12 endpoint khác đang chạy production cho 4 tenant."
              - heading "Anh đi từ endpoint này tới 12 endpoint còn lại thế nào, và bịt lỗ ở đâu để không phải sửa tay từng chỗ?" [level=4] [ref=f1e1310]
              - list [ref=f1e1311]:
                - listitem [ref=f1e1312]: "Tái hiện có kiểm soát: gọi endpoint bằng tài khoản tenant A với id hóa đơn của tenant B, ghi lại request và response"
                - listitem [ref=f1e1313]: "Khoanh vùng toàn repo: grep các handler nhận id trực tiếp từ path hoặc query mà không có điều kiện chủ sở hữu"
                - listitem [ref=f1e1314]: "Đo mức phơi nhiễm: đối chiếu access log tìm truy cập chéo tenant trong 30 ngày, xác định endpoint nào đã bị chạm"
                - listitem [ref=f1e1315]: "Sửa ở tầng dùng chung: đưa kiểm tra chủ sở hữu vào authorization layer, không vá rải rác từng handler"
                - listitem [ref=f1e1316]: Viết test hồi quy cho cả nhóm endpoint, xác nhận test fail trước khi fix rồi mới xanh
                - listitem [ref=f1e1317]: "Thêm gate tự động: rule kiểm tra handler truy vấn theo id mà thiếu điều kiện tenant, chạy trong CI"
