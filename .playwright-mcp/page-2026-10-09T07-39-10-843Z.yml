                - paragraph [ref=f1e1387]:
                  - generic [ref=f1e1388]: Tín hiệu tốt
                  - text: Chốt yêu cầu thu hồi trước, chọn access token TTL ngắn kèm refresh rotation giữ trạng thái server-side, có đường revoke cụ thể và đo lại sau rollout.
                - paragraph [ref=f1e1389]:
                  - generic [ref=f1e1390]: Dấu hiệu sai
                  - text: Đổi hẳn sang session store cho mọi client vì cho là bảo mật hơn, không tính chi phí vận hành và không có bước kiểm chứng thu hồi.
            - listitem [ref=f1e1391]:
              - paragraph [ref=f1e1392]: "API production phản chiếu Origin của request vào Access-Control-Allow-Origin kèm Allow-Credentials: true, thêm từ đợt mở cho subdomain riêng của khách hàng. Access log tuần này ghi 5 domain lạ đã gọi endpoint đọc dữ liệu."
              - heading "Anh siết CORS thế nào, và kiểm tra gì để chắc chắn cấu hình không mở lại?" [level=4] [ref=f1e1393]
              - list [ref=f1e1394]:
                - listitem [ref=f1e1395]: "Xác minh khai thác: từ một origin lạ gửi request kèm cookie phiên tới endpoint đọc dữ liệu, xem response có đọc được không"
                - listitem [ref=f1e1396]: "Rà access log 7 ngày: đếm các Origin bất thường đã gọi API, phân loại domain hợp lệ và domain cần chặn"
                - listitem [ref=f1e1397]: "Siết cấu hình: allowlist origin cụ thể, bỏ phản chiếu Origin, không dùng wildcard chung với credentials"
                - listitem [ref=f1e1398]: "Kiểm tra cache: set Vary đúng để response CORS không bị dùng chung giữa các origin"
                - listitem [ref=f1e1399]: "Rà tầng cookie và CSRF: set SameSite cho cookie phiên, xác nhận endpoint ghi vẫn yêu cầu CSRF token"
                - listitem [ref=f1e1400]: "Thêm test: suite từ chối origin lạ và kiểm tra preflight trả đúng allowlist trước khi deploy"
              - paragraph [ref=f1e1401]:
