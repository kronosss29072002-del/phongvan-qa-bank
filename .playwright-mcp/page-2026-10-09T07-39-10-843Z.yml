            - listitem [ref=f1e1588]:
              - paragraph [ref=f1e1589]: Sự cố 92 phút hôm 3/10 làm mất 2,3% đơn hàng. Postmortem đầu tiên kết luận 'on-call fix sai lúc 02:50', action item duy nhất là 'trực ca cẩn thận hơn', và tháng sau kịch bản lặp y hệt.
              - heading "Bạn điều phối lại postmortem thế nào để nó dừng là công cụ đổ lỗi?" [level=4] [ref=f1e1590]
              - list [ref=f1e1591]:
                - listitem [ref=f1e1592]: "Mở đầu bằng ground rule: phân tích hệ thống chứ không tìm người, dấu hiệu sai là cái tên xuất hiện trong nguyên nhân."
                - listitem [ref=f1e1593]: Dựng timeline khách quan từ alert, log và change, tách dữ kiện khỏi suy đoán.
                - listitem [ref=f1e1594]: Hỏi vì sao quyết định sai lúc 02:50 vẫn đi qua mọi lớp kiểm tra, xuống tới điều kiện cấu trúc.
                - listitem [ref=f1e1595]: "Viết lại nguyên nhân dạng hệ thống: thiếu tín hiệu, ngưỡng sai, rollback khó, đó là việc hệ thống cho phép."
                - listitem [ref=f1e1596]: Action item phải có chủ, có hạn, có tiêu chí done, không nhận 'chú ý hơn' hay 'tăng nhận thức'.
                - listitem [ref=f1e1597]: "Chốt metric cho lần sau: MTTR, thời gian chẩn đoán, tỉ lệ alert dẫn tới hành động."
                - listitem [ref=f1e1598]: Chia sẻ bản postmortem rộng, mở lại bài cũ nếu hành động trước chưa đủ.
