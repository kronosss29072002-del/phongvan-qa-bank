              - generic [ref=f1e995]:
                - paragraph [ref=f1e996]:
                  - generic [ref=f1e997]: Tín hiệu tốt
                  - text: Tách thành ba giai đoạn thêm nullable, backfill theo batch, đặt constraint validate, và xác nhận được bước nào thực sự khóa bảng trên DB đang dùng.
                - paragraph [ref=f1e998]:
                  - generic [ref=f1e999]: Dấu hiệu sai
                  - text: Khẳng định ALTER TABLE sẽ chạy nhanh mà không kiểm tra version DB và số liệu từ staging, hoặc gộp backfill và NOT NULL vào một câu lệnh.
            - listitem [ref=f1e1000]:
              - paragraph [ref=f1e1001]: Lưu lượng đọc dồn về read replica, số dư và trạng thái đơn hàng vừa ghi vẫn đọc từ replica. Khi replica lag đạt 12s lúc peak, user thấy đơn vừa đặt biến mất rồi xuất hiện lại. Ticket kiểu đơn của tôi đâu tăng gấp 5 lần trong hai tuần.
              - 'heading "Đọc phải dữ liệu cũ từ replica thì cậu xử lý ở đâu: ứng dụng, route, hay hạ tầng?" [level=4] [ref=f1e1002]'
              - list [ref=f1e1003]:
                - listitem [ref=f1e1004]: "Xác minh lag thật: so sánh vị trí WAL giữa primary và replica, ghi lag theo giờ peak"
                - listitem [ref=f1e1005]: "Phân loại request: đơn và số dư vừa ghi là read-after-write, xếp chúng vào luồng đọc primary"
                - listitem [ref=f1e1006]: Với request cần dữ liệu mới, gắn dấu session hoặc tham số route tới primary ngay từ gateway
                - listitem [ref=f1e1007]: "Đặt ngưỡng lag chấp nhận được: đọc replica khi lag dưới ngưỡng, fallback primary khi vượt"
                - listitem [ref=f1e1008]: Theo dõi lag theo percentile và đặt alert, phân biệt lag do replica quá tải với lag do network
                - listitem [ref=f1e1009]: "Viết e2e: ghi vào primary rồi đọc ngay qua luồng user, assert không thấy dữ liệu cũ"
              - paragraph [ref=f1e1010]:
                - text: Thuật ngữ
                - link "Replication Lag Tolerance" [ref=f1e1011] [cursor=pointer]:
                  - /url: "#e-replication-lag-tolerance"
