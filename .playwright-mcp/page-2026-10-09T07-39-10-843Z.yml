              - paragraph [ref=f1e871]: Bảng orders 40 triệu dòng, query WHERE status = 'PAID' ORDER BY created_at DESC có p99 2.8s. Dev đã thêm index (user_id) và index (status) riêng lẻ, EXPLAIN vẫn ra Sort trên 12 triệu dòng.
