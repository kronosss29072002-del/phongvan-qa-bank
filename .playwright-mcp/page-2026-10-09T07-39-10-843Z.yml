                  - generic [ref=f1e1430]: Tín hiệu tốt
                  - text: Tái hiện ở staging, vá bằng tham số hóa hoặc whitelist, rà hết raw query còn lại và thêm gate chặn tái diễn.
                - paragraph [ref=f1e1431]:
                  - generic [ref=f1e1432]: Dấu hiệu sai
                  - text: Vá đúng câu query bị pentest báo rồi dừng, không rà chỗ khác, vẫn tin ORM che hết mọi đường dữ liệu vào.
            - listitem [ref=f1e1433]:
              - paragraph [ref=f1e1434]: Credential truy cập DB production đã 14 tháng không xoay, chính sách mới bắt buộc 90 ngày một lần. Hệ thống 60 pod và 3 job batch dùng chung credential, deploy bằng rolling update.
              - heading "Anh xoay credential ra sao để không downtime, và tự động hóa nó thế nào cho lần sau?" [level=4] [ref=f1e1435]
              - list [ref=f1e1436]:
                - listitem [ref=f1e1437]: "Khoanh vùng người dùng credential: quét config, env, cron, script để biết chính xác cái gì gãy khi đổi"
                - listitem [ref=f1e1438]: Tạo credential mới song song, còn hiệu lực bên cạnh credential cũ để có đường lùi trong suốt quá trình xoay
                - listitem [ref=f1e1439]: "Rollout theo nhóm nhỏ trước: đổi một vài pod qua rolling, theo dõi lỗi xác thực và connection pool trước khi đổi toàn bộ"
                - listitem [ref=f1e1440]: "Xác nhận không còn kết nối dùng credential cũ: đối chiếu log xác thực và audit của DB trong grace period"
                - listitem [ref=f1e1441]: Thu hồi credential cũ sau khi hết grace period, giữ quy trình lùi lại được trong cửa sổ rollout
                - listitem [ref=f1e1442]: "Tự động hóa: secret manager phát credential động TTL ngắn, xoay theo lịch thay vì đổi tay"
