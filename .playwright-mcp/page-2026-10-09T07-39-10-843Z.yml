                  - generic [ref=f1e1169]: Tín hiệu tốt
                  - text: Ứng viên tách quota theo API key, trả 429 đúng chuẩn kèm header, và biết khi nào chuyển sang cắt tải thay vì siết limit.
                - paragraph [ref=f1e1170]:
                  - generic [ref=f1e1171]: Dấu hiệu sai
                  - text: Chỉ biết gắn limit theo IP ở nginx rồi tuyên bố sự cố được xử lý.
            - listitem [ref=f1e1172]:
              - paragraph [ref=f1e1173]: Consumer RabbitMQ nhận một message thiếu trường amount, throw exception và bị broker redeliver liên tục. Trong 35 phút, lag của consumer group phình từ 2.000 lên 410.000 message, hàng nghìn message lành đứng sau bị kẹt theo vì một consumer duy nhất đang quay vòng trên message đỏ.
              - heading "Một message hỏng lặp vô hạn và chặn cả queue, em xử lý thế nào để dòng tin chạy lại mà không mất dữ liệu?" [level=4] [ref=f1e1174]
              - list [ref=f1e1175]:
                - listitem [ref=f1e1176]: Xem delivery count của message đỏ và stack trace worker, xác định trường nào thiếu gây exception.
                - listitem [ref=f1e1177]: Định tuyến message vượt số lần redeliver sang dead letter queue để chặn vòng lặp vô hạn.
                - listitem [ref=f1e1178]: Đo lag và throughput hiện tại, ước lượng thời gian xả hết 410.000 message sau khi xử lý.
                - listitem [ref=f1e1179]: "Sửa handler: validate payload trước khi vào business logic, lỗi schema thì ghi rõ nguyên nhân vào DLQ."
                - listitem [ref=f1e1180]: Replay nội dung DLQ sau khi fix parser, chạy qua idempotent consumer để không xử lý trùng.
                - listitem [ref=f1e1181]: Đặt cảnh báo cho redelivery count vượt 5 và DLQ depth tăng nhanh, gắn vào dashboard của consumer.
                - listitem [ref=f1e1182]: Thêm contract test cho schema giữa producer và consumer trước khi nhận lại traffic bình thường.
