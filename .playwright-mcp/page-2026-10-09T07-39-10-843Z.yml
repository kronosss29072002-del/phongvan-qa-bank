                  - generic [ref=f1e1077]: Tín hiệu tốt
                  - text: Nói RPO/RTO là số đo được từ restore drill thực, và biết replay WAL để thu ngắn điểm phục hồi chứ không chỉ tăng tần suất full backup.
                - paragraph [ref=f1e1078]:
                  - generic [ref=f1e1079]: Dấu hiệu sai
                  - text: Tự tin backup chạy ổn vì status xanh mà chưa từng restore thành công một lần, hoặc trả lời RPO bằng thời gian chạy job backup.
            - listitem [ref=f1e1080]:
              - paragraph [ref=f1e1081]: Service đặt hàng mở transaction, bên trong gọi 5 service qua HTTP và emit sự kiện vào Kafka rồi mới commit. p99 đặt hàng từ 180ms lên 4,2s sau khi thêm bước verify kho ngoài, row lock bị giữ lâu. Có ngày gặp 3 deadlock và transaction chạm timeout mặc định 5s.
              - heading "Cậu thu nhỏ transaction này về đúng phạm vi cần thiết bằng cách nào?" [level=4] [ref=f1e1082]
              - list [ref=f1e1083]:
                - listitem [ref=f1e1084]: Đo thời gian từng bước trong transaction bằng tracing, xác định HTTP call và Kafka emit chiếm bao lâu
                - listitem [ref=f1e1085]: Tách các HTTP call ra ngoài transaction, chỉ giữ thao tác DB thực sự cần atomic bên trong
                - listitem [ref=f1e1086]: Chuyển emit Kafka ra sau commit qua transactional outbox, xóa dual-write và rút ngắn giữ lock
                - listitem [ref=f1e1087]: Xác định dòng bị giữ lock, đặt row lock gần cuối transaction để giảm thời gian khóa tối thiểu
                - listitem [ref=f1e1088]: Với flow nhiều service không chung DB, thay transaction bằng saga với bước bù trừ rõ ràng
                - listitem [ref=f1e1089]: Theo dõi lock duration, deadlock và timeout transaction qua metric, đặt alert ngưỡng
