                - listitem [ref=f1e878]: Thêm index qua migration an toàn, tránh giữ khóa ghi lâu trên bảng 40 triệu dòng giờ cao điểm
                - listitem [ref=f1e879]: Chạy lại EXPLAIN xác nhận Index Scan đúng index, rồi quét idx_scan = 0 để dọn index thừa
