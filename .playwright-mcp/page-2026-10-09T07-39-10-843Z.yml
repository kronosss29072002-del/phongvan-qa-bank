              - generic [ref=f1e953]:
                - paragraph [ref=f1e954]:
                  - generic [ref=f1e955]: Tín hiệu tốt
                  - text: Nhắc đến UPDATE nguyên tử tự tăng hoặc optimistic locking có version field, và dựng lại được kịch bản mất update cụ thể thay vì đoán chung chung.
                - paragraph [ref=f1e956]:
                  - generic [ref=f1e957]: Dấu hiệu sai
                  - text: Đề xuất retry request thêm một lần hoặc khóa cả bảng, không phân biệt được read-modify-write với update nguyên tử.
            - listitem [ref=f1e958]:
              - paragraph [ref=f1e959]: API charge trừ tiền trực tiếp, client timeout sau 10s ở gateway rồi retry, hai request cùng đi vào. Một phần giao dịch bị trừ hai lần, một phần không ghi nhận. Tỉ lệ lỗi tăng từ 0,2% lên 2,1% sau khi mobile app thêm retry tự động, không có header chống trùng.
              - heading "Cậu thiết kế idempotency cho API charge thế nào để retry không tạo giao dịch trùng?" [level=4] [ref=f1e960]
              - list [ref=f1e961]:
                - listitem [ref=f1e962]: Thống kê giao dịch trùng theo request_id và client, xác nhận retry chính là nguồn gây double charge
                - listitem [ref=f1e963]: Bắt buộc client gửi Idempotency-Key trong mọi request charge, ghi vào hợp đồng API
                - listitem [ref=f1e964]: Tra cứu key trong bảng idempotency trước khi xử lý, key tồn tại thì trả về kết quả gốc
                - listitem [ref=f1e965]: Lưu key và response trong cùng transaction với charge, unique constraint trên cặp key và client_id
                - listitem [ref=f1e966]: Với luồng async, áp dụng dedup window hoặc inbox pattern ở consumer để chặn message trùng
                - listitem [ref=f1e967]: "Chạy kịch bản: cùng một key gọi 10 lần song song, assert đúng một giao dịch được tạo"
              - paragraph [ref=f1e968]:
                - text: Thuật ngữ
                - link "Idempotency key (Stripe pattern)" [ref=f1e969] [cursor=pointer]:
                  - /url: "#e-idempotency-key-stripe-pattern"
                - text: ·
                - link "Dedup window" [ref=f1e970] [cursor=pointer]:
                  - /url: "#e-dedup-window"
                - text: ·
                - link "Exactly-once illusion vs at-least-once" [ref=f1e971] [cursor=pointer]:
