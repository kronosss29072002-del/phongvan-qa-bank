                  - generic [ref=f1e1257]: Tín hiệu tốt
                  - text: Ứng viên hỏi hậu quả cụ thể trước khi quyết định có lock, so sánh conditional update với lock và nhắc fencing token khi lock hết hạn giữa chừng.
