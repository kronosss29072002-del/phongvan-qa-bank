              - generic [ref=f1e603]:
                - paragraph [ref=f1e604]:
                  - generic [ref=f1e605]: Tín hiệu tốt
                  - text: Rollback trước rồi thêm field additive, có header deprecation và contract test chặn ở pipeline thay vì chỉ xin lỗi khách.
                - paragraph [ref=f1e606]:
                  - generic [ref=f1e607]: Dấu hiệu sai
                  - text: Bảo client cập nhật app là xong, hoặc mở /v2 cho field mới mà không đụng tới client cũ đang chạy.
            - listitem [ref=f1e608]:
              - paragraph [ref=f1e609]: Bảng transactions có 40 triệu dòng; client đang phân trang bằng offset 950.000 nên mỗi request mất 8,4s vì DB phải đọc rồi bỏ qua gần một triệu dòng. Đội frontend muốn infinite scroll mượt dưới 300ms mỗi trang.
              - heading "Với bảng cỡ này, em thiết kế lại pagination thế nào và chứng minh nó nhanh hơn bằng cách nào?" [level=4] [ref=f1e610]
              - list [ref=f1e611]:
                - listitem [ref=f1e612]: Đo lại từng phần của request chậm bằng EXPLAIN ANALYZE, tách thời gian scan, sort và trả dữ liệu cho client.
                - listitem [ref=f1e613]: "Xác nhận nguyên nhân: OFFSET 950.000 khiến DB đọc và bỏ gần một triệu dòng trước khi trả 50 dòng cần thiết."
                - listitem [ref=f1e614]: Kiểm tra index hiện có phủ được cột filter, cột sort và khóa chính theo đúng thứ tự hay chưa.
                - listitem [ref=f1e615]: "Chuyển sang keyset pagination: trả next_cursor từ khóa chính đã sắp, WHERE (created_at, id) < cursor thay cho OFFSET."
                - listitem [ref=f1e616]: Thêm index tổ hợp cho cột sort với khóa chính, xác nhận plan đổi từ scan sang index range scan.
                - listitem [ref=f1e617]: Chặn limit tối đa mỗi trang và trả 400 khi client xin số dòng vượt ngưỡng; giữ tương thích cho cursor cũ trong một chu kỳ.
                - listitem [ref=f1e618]: Đo lại p95 ở trang đầu và trang sâu, ghi số trước sau vào cùng bảng để so, không nhìn mỗi trang đầu.
