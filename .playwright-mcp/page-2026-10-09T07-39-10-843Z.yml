            - listitem [ref=f1e651]:
              - paragraph [ref=f1e652]: Đối tác nhận webhook payment.succeeded và tự tạo đơn trong ERP. Sau 20 phút mạng đứt, sender retry theo exponential backoff, phía nhận lấy 4.700 event trong đó 31% trùng id và đã tạo gần 1.460 đơn nháp trùng.
              - heading "Phía nhận xử lý webhook giao trùng thế nào để retry không sinh thêm bản ghi rác?" [level=4] [ref=f1e653]
              - list [ref=f1e654]:
                - listitem [ref=f1e655]: "Thống kê log theo event_id: cùng một id xuất hiện 2 đến 4 lần, xác nhận kênh giao ít nhất một lần chứ không phải exactly-once."
                - listitem [ref=f1e656]: Kiểm tra endpoint nhận có verify chữ ký không và đang ack nhanh hay xử lý nghiệp vụ trước khi trả 2xx.
                - listitem [ref=f1e657]: Ghi mỗi event_id vào bảng dedup có unique index trước khi xử lý nghiệp vụ; insert thất bại nghĩa là event đã xử lý.
                - listitem [ref=f1e658]: "Chuyển xử lý nghiệp vụ sang hàng đợi nội bộ: ack nhanh cho sender, worker xử lý sau theo idempotent consumer."
                - listitem [ref=f1e659]: Event hỏng sau nhiều lần thử thì đẩy vào dead letter queue kèm payload gốc để đối soát thủ công.
                - listitem [ref=f1e660]: Chỉ trả 2xx sau khi đã ghi dedup, và tách metric đếm số event trùng bị bỏ qua để còn phát hiện bất thường.
                - listitem [ref=f1e661]: Chạy lại kịch bản mạng đứt 20 phút trong staging, assert số bản ghi nghiệp vụ đúng bằng số event id duy nhất.
