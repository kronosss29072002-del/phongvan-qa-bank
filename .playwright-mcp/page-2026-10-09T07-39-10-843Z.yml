              - generic [ref=f1e258]:
                - heading "Byzantine fault & BFT" [level=4] [ref=f1e259]
                - button "Liên kết tới Byzantine fault & BFT" [ref=f1e260] [cursor=pointer]: "#"
                - generic [ref=f1e261]: Phân tán & Đồng thời
              - paragraph [ref=f1e262]: HayByzantine fault · fault của Byzantine · BFT · Byzantine Generals Problem · lỗi quân bất lương
              - paragraph [ref=f1e263]:
                - generic [ref=f1e264]: Vấn đề
                - text: "Crash-based consensus giả định node 'chết thì im lặng' — nhưng node hỏng phần mềm hoặc bị tấn công có thể gửi thông tin sai, và sai khác nhau cho từng node khác (nói A cho nhóm này, nói B cho nhóm kia): với 3 node có 1 nói dối, hai nhóm còn lại quyết định trái chiều, cluster kết luận giá trị sai mà không hề crash."
              - paragraph [ref=f1e265]:
                - generic [ref=f1e266]: Nguồn gốc
                - text: Robert Shostak (SRI, dự án SIFT) 1978; Marshall Pease tổng quát hóa; Lamport, Pease & Shostak, 'Reaching Agreement in the Presence of Faults', JACM 1980; biểu tượng 'Byzantine Generals Problem' do Lamport đưa ra 1982 — đoạt Dijkstra Prize 2005.
              - paragraph [ref=f1e267]:
                - generic [ref=f1e268]: Xử lý
                - text: BFT cần n > 3f (không chữ ký) hoặc n > f+1 (có chữ ký số) để luôn chọn được giá trị đúng bất kể f node hành xử tùy tiện; broadcast consistency — chỉ chặn được node gửi nội dung khác nhau, không chặn node gửi cùng một giá trị sai cho tất cả.
              - paragraph [ref=f1e269]:
                - text: Liên quan
