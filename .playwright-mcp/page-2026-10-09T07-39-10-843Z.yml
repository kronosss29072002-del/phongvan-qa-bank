            - listitem [ref=f1e806]:
              - paragraph [ref=f1e807]: "Hai service dùng chung một Redis: catalog sản phẩm đổi giá 2 lần mỗi ngày nhưng TTL 1 giờ khiến khách thấy giá cũ, còn đơn hàng ghi liên tục thì bị cache-aside che mất đơn vừa tạo. Hit ratio 96% vẫn bị khiếu nại."
              - heading "Anh chọn chiến lược cache nào cho từng workload này, và tiêu chí phân loại là gì?" [level=4] [ref=f1e808]
              - list [ref=f1e809]:
                - listitem [ref=f1e810]: "Phân loại theo tỉ lệ đọc/ghi và mức stale cho phép: catalog chấp nhận vài chục giây, đơn hàng là không"
                - listitem [ref=f1e811]: "Catalog: cache-aside với TTL ngẫu nhiên theo khóa, SWR để vẫn phục vụ bản cũ khi đang làm mới"
                - listitem [ref=f1e812]: "Đơn hàng: ghi xong invalidate ngay hoặc write-through, không để TTL dài che dữ liệu vừa ghi"
                - listitem [ref=f1e813]: "Chống stampede khi TTL hết hàng loạt: jitter TTL theo khóa, negative caching cho khóa không tồn tại"
                - listitem [ref=f1e814]: Đo cache hit ratio riêng theo từng endpoint, một con số gộp che mất phân bố thật
                - listitem [ref=f1e815]: Ghi lại lý do chọn strategy từng workload để người sau không vô thức quay về cache-aside everywhere
