        - generic [ref=f1e933]:
          - heading "Dữ liệu & Tính nhất quán 8 câu" [level=3] [ref=f1e934]:
            - text: Dữ liệu & Tính nhất quán
            - generic [ref=f1e935]: 8 câu
          - paragraph [ref=f1e936]: "Bộ câu hỏi tình huống cho mảng dữ liệu: race condition, idempotency, migration không downtime, replication lag, xung đột ghi, schema change giữa traffic, backup restore và transaction scope. Thang đo chính: chẩn đoán bằng số liệu trước, can thiệp sau, và mọi cam kết phải đo được chứ không phải trên giấy."
          - list [ref=f1e937]:
            - listitem [ref=f1e938]:
              - paragraph [ref=f1e939]: Ví điện tử đang chạy, hai request nạp 500.000 VNĐ vào cùng một user đến gần như đồng thời. Số dư chỉ tăng một lần, support nhận 40 ticket kiểu nạp tiền mất trong một giờ. Code hiện tại là read balance, cộng, rồi write, không có khóa.
              - heading "Cậu tìm ra nguyên nhân và sửa thế nào để cả hai lần cộng đều phản ánh vào số dư?" [level=4] [ref=f1e940]
              - list [ref=f1e941]:
                - listitem [ref=f1e942]: Viết test tái hiện hai request song song vào cùng user, khẳng định một lần cộng bị mất
                - listitem [ref=f1e943]: Xem query log và EXPLAIN, xác nhận luồng là read-modify-write không có SELECT FOR UPDATE hay version field
                - listitem [ref=f1e944]: Kiểm tra isolation level của transaction hiện tại, xem row lock có được giữ hay không
                - listitem [ref=f1e945]: Chuyển cộng tiền sang một câu UPDATE balance = balance + amount, bỏ hẳn bước đọc trước
                - listitem [ref=f1e946]: Với luồng phải check số dư trước khi ghi, thêm SELECT FOR UPDATE hoặc version field so sánh trong WHERE
                - listitem [ref=f1e947]: "Viết regression test: 50 request cộng đồng thời, assert số dư cuối đúng tổng, chạy pass rồi mới merge"
              - paragraph [ref=f1e948]:
                - text: Thuật ngữ
