                  - generic [ref=f1e1519]: Tín hiệu tốt
                  - text: Nghe thấy phân biệt leak với tải qua quan hệ RSS-traffic, giữ bằng chứng trước restart, cảnh báo theo restart count.
                - paragraph [ref=f1e1520]:
                  - generic [ref=f1e1521]: Dấu hiệu sai
                  - text: Đề xuất tăng limit rồi restart là xong, không giải thích vì sao heap không về baseline sau full GC.
            - listitem [ref=f1e1522]:
              - paragraph [ref=f1e1523]: 02:40 Redis failover khiến 700k key mất đồng loạt. Trong 30 giây MySQL nhận 12k QPS thay vì 800, CPU chạm 95%, query xếp hàng và client retry dồn sau mỗi timeout 5s.
              - heading "Thứ tự can thiệp của bạn là gì để cắt đàn ong mà không chặn luôn người dùng?" [level=4] [ref=f1e1524]
              - list [ref=f1e1525]:
                - listitem [ref=f1e1526]: "Nhận diện pattern trước: miss đồng loạt trên hot key cộng retry dồn là cache stampede, không phải traffic thật."
                - listitem [ref=f1e1527]: Cắt nguồn dồn ở nhánh rebuild bằng rate limit hoặc load shedding, giữ nhánh đọc còn phục vụ stale.
                - listitem [ref=f1e1528]: Cho phép serve stale trong lúc rebuild, bật negative caching cho key không tồn tại.
                - listitem [ref=f1e1529]: Ép client retry backoff mũ kèm jitter, thêm circuit breaker chặn vòng gọi downstream vô hạn.
                - listitem [ref=f1e1530]: Nới pool MySQL tạm thời, kill query đang phình để CPU về dưới 70%.
                - listitem [ref=f1e1531]: "Xác nhận hồi phục: QPS downstream về 800 và p99 ổn định liên tục 30 giây."
                - listitem [ref=f1e1532]: Sau sự cố, dựng stampede protection ở tầng cache-aside, alert theo cache hit ratio.
