                  - generic [ref=f1e626]: Tín hiệu tốt
                  - text: Chẩn đoán bằng EXPLAIN trước, chuyển sang keyset với cursor, và đo lại p95 ở trang sâu thay vì chỉ nhìn trang đầu.
