              - paragraph [ref=f1e329]:
                - generic [ref=f1e330]: Vấn đề
                - text: "Hệ thống phân tán không có đồng hồ chung: sự kiện ở hai node đến theo thứ tự network khác với thứ tự thật, không biết sự kiện nào 'trước' sự kiện nào để đồng bộ hóa resource. Lamport scalar thì dùng được nhưng đánh đồng cả 'xảy ra trước thật' lẫn 'chỉ tình cờ đến trước' — không phân biệt được causality với coincidence."
              - paragraph [ref=f1e331]:
                - generic [ref=f1e332]: Nguồn gốc
                - text: Lamport, 'Time, clocks, and the ordering of events in a distributed system', CACM 1978; vector clock do Colin Fidge và Friedemann Mattern độc lập công bố năm 1988.
              - paragraph [ref=f1e333]:
                - generic [ref=f1e334]: Xử lý
                - text: "Lamport clock (1978): mỗi process tăng counter, gửi kèm message, nhận thì lấy max — được thứ tự nhân quả một chiều nhưng không phát hiện event đồng thời. Vector clock: mỗi process một đồng hồ, VC(a) < VC(b) nghĩa là a xảy ra trước b; hai vector không so sánh được thì là concurrent — cho phép phát hiện xung đột thật sự."
