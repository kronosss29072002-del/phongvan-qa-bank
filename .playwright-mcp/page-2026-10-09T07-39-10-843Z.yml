                  - generic [ref=f1e1148]: Tín hiệu tốt
                  - text: Ứng viên đọc deadlock log để tìm đúng cặp query rồi chuẩn hóa thứ tự khóa, đồng thời nhắc tới retry sau khi transaction bị abort.
                - paragraph [ref=f1e1149]:
                  - generic [ref=f1e1150]: Dấu hiệu sai
                  - text: Đề xuất tăng deadlock_timeout, retry vô hạn, hoặc bỏ một endpoint để né deadlock.
            - listitem [ref=f1e1151]:
              - paragraph [ref=f1e1152]: API tra cứu công khai bị một client quét 20.000 QPS từ dải proxy, p99 tăng từ 210ms lên 6,8s và 43% request của client khác nhận 503. Giới hạn hiện tại chỉ gắn theo IP ở nginx nên đổi IP proxy là vượt qua, trong khi origin chỉ có 4 node.
              - heading "Đang có kẻ quét API công khai, em thiết kế rate limit theo tầng nào và xử lý thế nào để client lành không bị vạ lây?" [level=4] [ref=f1e1153]
              - list [ref=f1e1154]:
                - listitem [ref=f1e1155]: Group request theo API key và IP trong 15 phút gần nhất, tìm top talker và tỉ lệ 5xx theo từng nhóm.
                - listitem [ref=f1e1156]: "Gắn quota theo API key ở gateway: tier free 10 req/s qua token bucket, IP chỉ giữ làm lớp phụ."
                - listitem [ref=f1e1157]: Trả 429 kèm Retry-After và header RateLimit để client tự điều chỉnh thay vì nhận 503 mơ hồ.
                - listitem [ref=f1e1158]: Cache kết quả của hot query để giảm tải origin trước khi phải hạn chế client hợp lệ.
                - listitem [ref=f1e1159]: Bật adaptive throttling khi CPU vượt 70% hoặc queue depth vượt ngưỡng, cắt tải dần theo mức ưu tiên.
                - listitem [ref=f1e1160]: Cảnh báo khi một key chiếm hơn 30% lưu lượng, tạm khóa key vi phạm có thời hạn và ghi lại lý do.
                - listitem [ref=f1e1161]: Theo dõi tỉ lệ 429 và tỉ lệ client bị chặn nhầm trong 48 giờ, nới quota nếu siết quá tay.
