                  - generic [ref=f1e713]: Tín hiệu tốt
                  - text: Đặt quota theo API key có tier và burst, trả 429 kèm RateLimit và Retry-After, và cảnh báo ở 80% quota để client tự điều chỉnh.
                - paragraph [ref=f1e714]:
