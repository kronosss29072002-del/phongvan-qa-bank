                - paragraph [ref=f1e690]:
                  - generic [ref=f1e691]: Tín hiệu tốt
                  - text: Đếm query thật bằng tracing trước, xác nhận N+1 do resolver lặp, gom bằng IN batch rồi so lại số query lẫn p95.
                - paragraph [ref=f1e692]:
                  - generic [ref=f1e693]: Dấu hiệu sai
                  - text: Kết luận GraphQL chậm nên bỏ về REST, hoặc thêm cache toàn bộ mà không đo đếm gì.
            - listitem [ref=f1e694]:
              - paragraph [ref=f1e695]: API công khai mở cho đối tác, hợp đồng chưa ghi giới hạn. Một đối tác gọi 900 req/s chiếm 62% tài nguyên cụm 8 node, p99 của đối tác khác tăng từ 240ms lên 1,9s, và không có header nào cho họ biết mình đang vượt mức.
              - heading "Em thiết kế rate limit cho API công khai này thế nào để client tự điều chỉnh mà không phải gọi support mỗi lần bị chặn?" [level=4] [ref=f1e696]
              - list [ref=f1e697]:
                - listitem [ref=f1e698]: Lấy phân bố request theo API key trong 7 ngày, tách nhóm nặng, vừa, nhẹ và các đỉnh bất thường.
                - listitem [ref=f1e699]: "Đặt quota theo tier: free 20 req/s burst 40, partner 200 req/s burst 400, kèm trần theo tháng cho từng key."
                - listitem [ref=f1e700]: Đặt token bucket ở gateway khóa theo API key; IP chỉ giữ làm lớp phụ cho client chưa đăng ký.
                - listitem [ref=f1e701]: Trả 429 kèm RateLimit và Retry-After để client backoff đúng, thay vì 503 khó đoán như hiện tại.
                - listitem [ref=f1e702]: Công bố giới hạn trong tài liệu API và cảnh báo khi key chạm 80% quota trước khi chặn cứng.
                - listitem [ref=f1e703]: Bật adaptive throttle khi CPU cụm vượt 70%, hạ dần trần theo mức ưu tiên trước khi phải cắt tải.
                - listitem [ref=f1e704]: Theo dõi tỉ lệ 429 và tỉ lệ chặn nhầm trong 48 giờ, nới quota cho tier bị siết quá tay.
