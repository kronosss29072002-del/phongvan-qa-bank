              - generic [ref=f1e1124]:
                - paragraph [ref=f1e1125]:
                  - generic [ref=f1e1126]: Tín hiệu tốt
                  - text: Ứng viên chỉ ra truy vấn thiếu điều kiện atomic, đề xuất conditional update và đo tỉ lệ oversell trước khi bàn tới lock.
                - paragraph [ref=f1e1127]:
                  - generic [ref=f1e1128]: Dấu hiệu sai
                  - text: Nhảy ngay vào việc đóng một instance hoặc thêm sleep mà không truy được điểm tranh chấp từ log.
            - listitem [ref=f1e1129]:
              - paragraph [ref=f1e1130]: Đúng 20:10 giờ cao điểm, payment service treo gần 4 phút, pg_stat_activity bắt 14 session đang chờ lock. Postgres ghi hai deadlock mỗi giờ từ lúc deploy 18:40, hai query chết lock là cặp UPDATE đảo thứ tự khóa; team từng tăng deadlock_timeout lên 30 giây thay vì sửa query.
              - heading "Hai transaction giữ lock của nhau và cùng chờ, em xác định cặp query nào gây deadlock bằng cách nào, rồi sửa triệt để ra sao?" [level=4] [ref=f1e1131]
              - list [ref=f1e1132]:
                - listitem [ref=f1e1133]: Đọc log deadlock detected của Postgres, lấy hai PID và nội dung hai transaction đang chờ lock lẫn nhau.
                - listitem [ref=f1e1134]: EXPLAIN hai query, đối chiếu thứ tự acquire row lock giữa hai endpoint xem chỗ nào bị đảo.
                - listitem [ref=f1e1135]: Đếm deadlock theo giờ và đối chiếu với deploy 18:40 để xác nhận đây là regression mới.
                - listitem [ref=f1e1136]: "Chuẩn hóa thứ tự lock: sort theo khóa chính trước khi update, hoặc gộp hai UPDATE thành một statement."
                - listitem [ref=f1e1137]: "Rút ngắn thời gian giữ lock: chỉ lock row cần thiết, tách transaction dài đang giữ lock xuyên nhiều round-trip."
                - listitem [ref=f1e1138]: Bắt deadlock error ở application layer rồi retry có giới hạn, không để request treo đến hết timeout.
                - listitem [ref=f1e1139]: Thêm test hai transaction chạy song song, đặt alert khi deadlock rate vượt ngưỡng cho phép.
