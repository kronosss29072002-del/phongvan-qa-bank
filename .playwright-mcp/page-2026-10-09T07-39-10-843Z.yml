            - listitem [ref=f1e716]:
              - paragraph [ref=f1e717]: "Đã hai năm không ai dọn: /v1 còn 214 client trong đó 19 client nội bộ chỉ gọi một endpoint, /v2 chiếm 96% lưu lượng, /v3 làm nửa vời rồi bỏ. Đội sales cần cam kết 12 tháng không phá vỡ hợp đồng cho khách mới."
              - heading "Em chọn chiến lược versioning nào cho giai đoạn tiếp theo, và trả nợ /v1 cách nào mà không phá client đang chạy?" [level=4] [ref=f1e718]
              - list [ref=f1e719]:
                - listitem [ref=f1e720]: "Lập bảng client theo version: số request, endpoint dùng, owner và hạn hợp đồng, gắn nhãn ai còn cần hỗ trợ."
                - listitem [ref=f1e721]: Phân loại các thay đổi dự kiến thành additive hay breaking; thay đổi chỉ thêm field thì không cần version mới.
                - listitem [ref=f1e722]: Chốt một cơ chế versioning duy nhất, URL prefix cho đối tác hoặc header Accept cho nội bộ, không trộn nhiều kiểu.
                - listitem [ref=f1e723]: "Xây deprecation policy công khai: mốc thông báo, cam kết hỗ trợ tối thiểu 12 tháng, ngày sunset cụ thể cho từng version."
                - listitem [ref=f1e724]: Đánh dấu /v1 deprecated, trả header Deprecation và Sunset, kèm changelog và hướng dẫn migrate theo endpoint.
                - listitem [ref=f1e725]: Lấy OpenAPI của /v2 làm nguồn duy nhất, gate CI khi schema đổi mà không khai báo phiên bản hay deprecation.
                - listitem [ref=f1e726]: Theo dõi lưu lượng /v1 theo tháng, tắt dần endpoint khi nhóm client cuối cùng migrate xong.
              - paragraph [ref=f1e727]:
                - text: Thuật ngữ
                - link "API versioning (URL/header/media type)" [ref=f1e728] [cursor=pointer]:
