              - paragraph [ref=f1e387]: Haynhất quán tuần tự · sequential consistency · SC
              - paragraph [ref=f1e388]:
                - generic [ref=f1e389]: Vấn đề
                - text: "Hai client cùng thao tác trên một khối dữ liệu được replicate: client A ghi x=1 rồi ghi x=2; client B đọc lần lượt thấy x=2 rồi x=1. Từng bản sao đều tự nhất quán, nhưng thứ tự quan sát được khác nhau, nên không ai suy luận được 'giá trị nào mới hơn'. Câu hỏi: mô hình nhất quán yếu nhất nào đủ để mọi node nhìn thấy cùng một thứ tự thao tác, mà không đòi hỏi đồng hồ thời gian thực?"
              - paragraph [ref=f1e390]:
                - generic [ref=f1e391]: Nguồn gốc
                - text: Leslie Lamport, 'How to Make a Multiprocessor Computer That Correctly Executes Multiprocess Programs', IEEE Transactions on Computers, 1979.
              - paragraph [ref=f1e392]:
                - generic [ref=f1e393]: Xử lý
                - text: "Định nghĩa: tồn tại thứ tự toàn cục của mọi thao tác sao cho mỗi tiến trình giữ nguyên program order của mình và mọi tiến trình quan sát cùng thứ tự đó. Yếu hơn linearizability vì không ràng buộc mốc thời gian thực giữa các tiến trình khác nhau; mạnh hơn eventual consistency vì thứ tự đúng ngay, không hội tụ dần. Nhiều CPU hiện đại yếu hơn mức này (x86 chỉ bảo đảm TSO), nên code đa luồng cần fence khi muốn suy luận kiểu SC."
