                - link "BASE / Eventual consistency" [ref=f1e1013] [cursor=pointer]:
                  - /url: "#e-base-eventual-consistency"
              - generic [ref=f1e1014]:
                - paragraph [ref=f1e1015]:
                  - generic [ref=f1e1016]: Tín hiệu tốt
                  - text: Phân biệt được read-after-write phải về primary và trường hợp chấp nhận eventual consistency, kèm ngưỡng lag cụ thể và cơ chế fallback.
                - paragraph [ref=f1e1017]:
                  - generic [ref=f1e1018]: Dấu hiệu sai
                  - text: Trả lời đọc replica có lag là bình thường cho cả luồng thanh toán, hoặc đề xuất sleep một khoảng thời gian cố định thay vì đo lag.
            - listitem [ref=f1e1019]:
              - paragraph [ref=f1e1020]: "Hai service cùng sửa bản ghi user qua API: service A ghi display_name, service B ghi avatar_url. Last-write-wins hiện tại làm mất dữ liệu của service ghi trước, 27 sự cố ghi đè trong tháng. Team cần chọn giữa optimistic locking và merge theo trường."
              - heading "Dựa vào đâu để cậu chọn giữa version field và merge theo trường, thay vì chọn bừa một pattern?" [level=4] [ref=f1e1021]
              - list [ref=f1e1022]:
                - listitem [ref=f1e1023]: Liệt kê các trường mỗi service ghi, xác định trường nào hai service thực sự sửa đồng thời
                - listitem [ref=f1e1024]: "Đo tần suất conflict thực tế: đếm số lần ghi đè theo user_id từ log hoặc theo dõi 409 nếu có ETag"
                - listitem [ref=f1e1025]: "Nếu conflict hiếm và client xử lý được lỗi, chọn optimistic concurrency: version field, trả 409 kèm payload mới nhất"
                - listitem [ref=f1e1026]: "Nếu hai service ghi trường tách biệt, chọn merge theo trường: UPDATE chỉ set các cột được gửi, báo conflict khi cùng trường"
                - listitem [ref=f1e1027]: Định nghĩa chính sách bên nào thắng cho trường thật sự đụng nhau, ghi rõ vào hợp đồng API
                - listitem [ref=f1e1028]: Viết test hai luồng ghi cùng lúc vào cùng bản ghi, assert không trường nào bị mất ở cả hai cách
              - paragraph [ref=f1e1029]:
                - text: Thuật ngữ
                - link "Optimistic vs pessimistic locking" [ref=f1e1030] [cursor=pointer]:
                  - /url: "#e-optimistic-vs-pessimistic-locking"
                - text: ·
                - link "Optimistic concurrency (ETag/If-Match)" [ref=f1e1031] [cursor=pointer]:
                  - /url: "#e-optimistic-concurrency-etag-if-match"
                - text: ·
                - link "Race condition" [ref=f1e1032] [cursor=pointer]:
                  - /url: "#e-race-condition"
                - text: ·
                - link "Lock & deadlock" [ref=f1e1033] [cursor=pointer]:
                  - /url: "#e-lock-deadlock"
              - generic [ref=f1e1034]:
                - paragraph [ref=f1e1035]:
                  - generic [ref=f1e1036]: Tín hiệu tốt
                  - text: Đưa quyết định dựa trên tần suất conflict đo được và trường nào thực sự đụng nhau, không tuyên bố một pattern đúng cho mọi trường hợp.
                - paragraph [ref=f1e1037]:
                  - generic [ref=f1e1038]: Dấu hiệu sai
                  - text: Chọn last-write-wins vì đơn giản mà không lượng hóa dữ liệu mất, hoặc bảo vệ cả hai pattern mà không có tiêu chí chọn.
            - listitem [ref=f1e1039]:
              - paragraph [ref=f1e1040]: Bảng users 300 triệu dòng có cột email varchar(255) chưa unique, một service mới cần email là duy nhất. Traffic 8.000 request/s ở giờ cao điểm, thêm unique index dự kiến nặng và trong dữ liệu hiện có khả năng trùng. Production không được dừng.
              - heading "Cậu áp unique constraint lên cột đang có dữ liệu trùng và live traffic như thế nào?" [level=4] [ref=f1e1041]
              - list [ref=f1e1042]:
                - listitem [ref=f1e1043]: "Đếm trùng trước: SELECT email GROUP BY HAVING count > 1, xác định số dòng vi phạm và mức độ"
                - listitem [ref=f1e1044]: Bàn với chủ nghiệp vụ việc giữ hay gộp dòng trùng, viết migration chuẩn hóa dữ liệu trước khi áp ràng buộc
                - listitem [ref=f1e1045]: Tạo CREATE UNIQUE INDEX CONCURRENTLY, chạy nền không khóa ghi suốt quá trình scan
                - listitem [ref=f1e1046]: Gắn constraint bằng ADD CONSTRAINT UNIQUE USING INDEX vừa tạo, hoặc NOT VALID rồi VALIDATE CONSTRAINT
                - listitem [ref=f1e1047]: "Deploy theo thứ tự expand-contract: code mới xử lý lỗi unique trước, index đến sau cùng"
                - listitem [ref=f1e1048]: Theo dõi lock, replication lag và 5xx trong lúc index chạy, có phương án hủy và rollback
