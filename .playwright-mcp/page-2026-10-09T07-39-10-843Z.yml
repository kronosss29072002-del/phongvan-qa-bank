            - listitem [ref=f1e912]:
              - paragraph [ref=f1e913]: Một PR được ghi nhanh hơn 3x dựa trên một curl chạy trên laptop dev, nhưng hai tuần sau p99 của chính endpoint đó tăng 40% và không ai gắn được với thay đổi nào. Đội chỉ có metric trung bình theo ngày.
