                  - /url: "#e-idempotency-delivery-semantics"
              - generic [ref=f1e974]:
                - paragraph [ref=f1e975]:
                  - generic [ref=f1e976]: Tín hiệu tốt
                  - text: "Trả lời đúng thứ tự: nhận key từ client, dedup ở lớp DB bằng unique constraint trong cùng transaction, rồi mới bàn đến retry policy và thời gian sống của key."
                - paragraph [ref=f1e977]:
                  - generic [ref=f1e978]: Dấu hiệu sai
                  - text: Dùng Redis chống trùng mà không bàn đến persistence, hoặc tin vào exactly-once của message queue mà không có cơ chế trong ứng dụng.
            - listitem [ref=f1e979]:
              - paragraph [ref=f1e980]: Bảng orders 1,2 tỷ dòng, khoảng 480GB đang chạy production, cần thêm cột lưu nguồn đơn hàng. Lần thử ALTER TABLE ADD COLUMN NOT NULL DEFAULT trước đó khóa ghi 18 phút, 5xx vọt lên 3%. Không được phép downtime.
              - heading "Cậu đưa cột này vào production thế nào mà không khóa bảng và không downtime?" [level=4] [ref=f1e981]
              - list [ref=f1e982]:
                - listitem [ref=f1e983]: Chạy migration ở staging trên bản sao dữ liệu production, đo thời gian và lock trước khi đụng production
                - listitem [ref=f1e984]: "Xác nhận lần ALTER cũ vì sao mất 18 phút: đọc lock monitoring, xem có phải do NOT NULL quét toàn bộ bảng"
                - listitem [ref=f1e985]: Thêm cột dạng nullable hoặc DEFAULT hằng số, đây là metadata change không rewrite 480GB
                - listitem [ref=f1e986]: Backfill dữ liệu cũ theo batch 50k dòng chạy nền lúc thấp tải, theo dõi replication lag và lock
                - listitem [ref=f1e987]: Đặt NOT NULL bằng ADD CONSTRAINT NOT VALID rồi VALIDATE CONSTRAINT, không khóa ghi trong lúc validate
                - listitem [ref=f1e988]: Deploy code ghi giá trị cột mới qua feature flag, quan sát 5xx và p99 trước khi tắt cờ
