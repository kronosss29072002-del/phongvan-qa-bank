                - paragraph [ref=f1e1190]:
                  - generic [ref=f1e1191]: Tín hiệu tốt
                  - text: Ứng viên tách message đỏ sang DLQ, sửa validate ở handler, replay có idempotency và thêm cảnh báo redelivery count.
                - paragraph [ref=f1e1192]:
                  - generic [ref=f1e1193]: Dấu hiệu sai
                  - text: Xóa message lỗi tay rồi restart consumer, không sửa handler và không nhắc tới DLQ.
            - listitem [ref=f1e1194]:
              - paragraph [ref=f1e1195]: Switch mạng giữa hai region chết 90 giây, health check không detect kịp nên cả hai node cùng nhận write. Sau khi nối lại, 1.200 key có giá trị khác nhau giữa hai node, khoảng 8.000 session user bị logout oan vì token không còn khớp.
              - heading "Trong lúc partition hai nút cùng nhận write, em xử lý ngay lúc đó thế nào và thiết kế lại ra sao để không ghi hai chiều?" [level=4] [ref=f1e1196]
              - list [ref=f1e1197]:
                - listitem [ref=f1e1198]: Dựng timeline từ log hai node theo đồng hồ, xác định cửa sổ partition và đếm số key ghi hai chiều.
                - listitem [ref=f1e1199]: "Kiểm tra failover hiện tại: tách node có bầu leader theo majority quorum hay chỉ dựa vào health check ping."
                - listitem [ref=f1e1200]: Chọn node theo majority làm nguồn sự thật, node thiểu số ngừng nhận write ngay khi partition kết thúc.
                - listitem [ref=f1e1201]: Nhóm key xung đột theo loại, resolve thủ công nhóm có giá trị tiền tệ trước, nhóm còn lại theo last-writer.
                - listitem [ref=f1e1202]: "Bật cơ chế chặn ghi hai chiều: chỉ primary được ghi, secondary từ chối ghi và báo lỗi rõ cho caller."
                - listitem [ref=f1e1203]: Rút ngắn thời gian detect failover và kiểm tra lại health check để lần sau tách node sớm hơn.
                - listitem [ref=f1e1204]: Chạy chaos test ngắt mạng 30 giây trên staging, đo thời gian detect và số record xung đột trước khi đóng incident.
