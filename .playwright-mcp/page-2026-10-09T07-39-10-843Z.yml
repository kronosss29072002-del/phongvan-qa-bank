            - listitem [ref=f1e891]:
              - paragraph [ref=f1e892]: Sáu tháng trước team tối ưu bằng cache-aside cho mọi endpoint với TTL 1 giờ, cộng thêm 4 index chồng nhau và một Redis lock toàn cục cho mọi ghi đơn. Giờ khách vẫn khiếu nại giá cũ, gỡ thì sợ p99 xấu đi.
              - heading "Anh tháo những can thiệp tối ưu sai này theo trình tự nào để không gây sự cố mới?" [level=4] [ref=f1e893]
              - list [ref=f1e894]:
                - listitem [ref=f1e895]: "Liệt kê từng can thiệp đang chạy: cache nào, index nào, lock nào, ai thêm và vấn đề gốc ngày đó"
                - listitem [ref=f1e896]: "Trước khi gỡ, dựng baseline 3 ngày: p99 theo endpoint, query/s, cache hit ratio, số cảnh báo"
                - listitem [ref=f1e897]: Gỡ sau feature flag, mỗi lần một thứ, cách nhau ít nhất một chu kỳ release để quy được trách nhiệm
                - listitem [ref=f1e898]: "Tắt cache có trật tự: hạ TTL về 0 rồi xóa key, tránh invalidate đột ngột khi traffic vẫn đang chạy"
                - listitem [ref=f1e899]: Drop index thừa chỉ khi idx_scan = 0 vài ngày liên tiếp và EXPLAIN không đổi sau khi bỏ
                - listitem [ref=f1e900]: Mỗi lần gỡ đo lại so baseline, p99 xấu hơn ngưỡng đã chốt thì rollback đúng lần gỡ đó
