                - listitem [ref=f1e794]: Giới hạn cột select để include không kéo cột thừa, tránh đổi N+1 thành over-fetch bảng rộng
                - listitem [ref=f1e795]: EXPLAIN lại câu batch, đo số query/request và p99 trước sau trên cùng kịch bản load
