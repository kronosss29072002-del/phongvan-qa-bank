                - button "Liên kết tới Consensus" [ref=f1e281] [cursor=pointer]: "#"
                - generic [ref=f1e282]: Phân tán & Đồng thời
              - paragraph [ref=f1e283]: Hayđồng thuận phân tán · distributed consensus
              - paragraph [ref=f1e284]:
                - generic [ref=f1e285]: Vấn đề
                - text: N nodes đều cần kết luận cùng một giá trị ('giá trị config nào đúng', 'log entry thứ 5 là gì') trong khi tin nhắn đến chậm, mất, hoặc node crash giữa chừng — tự quyết định riêng thì cluster phân mảnh, hai bên ghi log khác nhau và không bao giờ heal được. Bỏ phiếu không quy tắc (ad-hoc) để lại các corner case chết người không được chứng minh.
              - paragraph [ref=f1e286]:
                - generic [ref=f1e287]: Nguồn gốc
                - text: không rõ (nền gắn với state machine replication của Lamport; xem Paxos/Raft).
