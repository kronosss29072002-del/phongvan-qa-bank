        - generic [ref=f1e582]:
          - heading "Thiết kế API & Tích hợp 8 câu" [level=3] [ref=f1e583]:
            - text: Thiết kế API & Tích hợp
            - generic [ref=f1e584]: 8 câu
          - paragraph [ref=f1e585]: "8 câu phỏng vấn tình huống cho hạng mục Thiết kế API & Tích hợp: breaking change đổi kiểu field làm client cũ crash, offset sâu trên bảng 40 triệu dòng, chống trừ tiền hai lần khi client retry, webhook giao trùng, N+1 trong một GraphQL request, rate limit cho API công khai, dọn nợ versioning giữa /v1, /v2 và /v3, và lệch hợp đồng dữ liệu giữa frontend với backend. Mỗi câu có bối cảnh kèm số liệu vận hành, các bước điều tra theo thứ tự chẩn đoán trước can thiệp sau, cùng tín hiệu tốt và tín hiệu xấu để chấm câu trả lời."
          - list [ref=f1e586]:
            - listitem [ref=f1e587]:
              - paragraph [ref=f1e588]: "API /v1/orders trả field status dạng chuỗi; đội platform đổi thành object {code, label} và deploy thẳng production. Trong 30 phút, app mobile 2.8 (37% người dùng) crash khi parse, crash rate client nhảy từ 0,4% lên 6,1% dù 5xx của server không đổi."
              - heading "Breaking change này lọt qua kiểm tra nào, và em xử lý thế nào để client cũ tiếp tục chạy trong khi vẫn đẩy được thay đổi?" [level=4] [ref=f1e589]
              - list [ref=f1e590]:
                - listitem [ref=f1e591]: Xem crash log và telemetry theo version client, xác nhận 37% người dùng 2.8 parse hỏng đúng field status vừa đổi.
                - listitem [ref=f1e592]: "Kiểm tra hợp đồng: field bị đổi kiểu trong khi client cũ không tolerant reader, đây là breaking change không được version hóa."
                - listitem [ref=f1e593]: Rollback bản deploy đổi kiểu field trước, đo lại crash rate để chốt nguyên nhân, không sửa thêm gì trong lúc chờ số liệu.
                - listitem [ref=f1e594]: "Đổi hướng additive: thêm field status_v2 một thời gian, giữ status cũ chạy song song, không xóa gì trong vòng 12 tháng."
                - listitem [ref=f1e595]: "Công bố deprecation policy: thông báo qua changelog, trả header Deprecation và Sunset cho client cũ, hẹn ngày tắt cụ thể."
                - listitem [ref=f1e596]: Thêm contract test cho response shape vào pipeline để lần đổi kiểu sau làm pipeline đỏ trước khi tới production.
                - listitem [ref=f1e597]: Theo dõi tỉ lệ client còn gọi path cũ theo tuần, chỉ tắt khi tỉ lệ dưới 0,1% và ghi lại mốc tắt theo từng version.
