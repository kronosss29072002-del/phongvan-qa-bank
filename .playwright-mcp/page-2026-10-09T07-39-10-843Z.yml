        - generic [ref=f1e1102]:
          - heading "Phân tán & Đồng thời 8 câu" [level=3] [ref=f1e1103]:
            - text: Phân tán & Đồng thời
            - generic [ref=f1e1104]: 8 câu
          - paragraph [ref=f1e1105]: "Tám tình huống vận hành cho vòng phỏng vấn senior backend: oversell khi chạy hai instance, deadlock hai transaction, API công khai bị quét, message độc kẹt queue, partition làm hai nút cùng ghi, fan-out kéo lag, Redis lock gắn bừa, fraud-service chết kéo sập checkout. Mỗi câu gồm bối cảnh có số liệu, câu hỏi đúng giọng phỏng viên, quy trình điều tra đúng thứ tự, chẩn đoán trước rồi can thiệp sau, cùng tín hiệu tốt và tín hiệu xấu để chấm ứng viên. Ứng viên mạnh đi từ log, metric, trace đến nguyên nhân rồi mới sửa và đo lại; ứng viên yếu nhảy thẳng vào giải pháp quen thuộc."
          - list [ref=f1e1106]:
            - listitem [ref=f1e1107]:
              - paragraph [ref=f1e1108]: Sau khi thêm instance thứ ba, 0,7% đơn hàng trong 24 giờ bị trừ tồn kho hai lần, mỗi lần một units. Log cho thấy hai instance cùng gọi reserve stock cách nhau 40ms trên cùng một SKU, đúng lúc deployment kết thúc lúc 02:15.
              - heading "Hai instance xử lý trùng một đơn hàng như vậy, em điều tra từ đâu và sửa ở đâu để hết oversell?" [level=4] [ref=f1e1109]
              - list [ref=f1e1110]:
                - listitem [ref=f1e1111]: Tra correlation ID của đơn oversell, đối chiếu log hai instance xem hai lần ghi DB cách nhau bao nhiêu.
                - listitem [ref=f1e1112]: "Đọc truy vấn cập nhật tồn kho: WHERE qty >= ? có atomic hay đang read-modify-write rồi ghi chồng."
                - listitem [ref=f1e1113]: Chạy lại kịch bản trên staging với hai instance, đo tỉ lệ oversell theo QPS để tái hiện trước khi sửa.
                - listitem [ref=f1e1114]: Đổi ghi tồn kho thành conditional update nguyên tử, chỉ row affected = 1 mới tính giữ chỗ thành công.
                - listitem [ref=f1e1115]: Bọc reserve và trừ kho trong transaction, dùng pessimistic lock hoặc version field, retry khi conflict.
                - listitem [ref=f1e1116]: Kiểm tra idempotency key của API đặt hàng để client retry không tạo thêm đơn thứ hai.
                - listitem [ref=f1e1117]: Thêm regression test chạy song song hai instance và alert tỉ lệ oversell, theo dõi 7 ngày sau fix.
