        - generic [ref=f1e1632]:
          - heading "Kiểm thử & Triển khai 8 câu" [level=3] [ref=f1e1633]:
            - text: Kiểm thử & Triển khai
            - generic [ref=f1e1634]: 8 câu
          - paragraph [ref=f1e1635]: "8 câu phỏng vấn tình huống cho hạng mục Kiểm thử & Triển khai: xử lý flaky test trong CI, vì sao coverage cao vẫn lọt bug, migration schema đi kèm deploy, canary bắt lỗi sớm, chọn rollback hay fix-forward, dọn feature flag tồn đọng, dữ liệu test lẫn giữa các môi trường, và pipeline CI quá chậm. Mỗi câu đòi hỏi trình tự chẩn đoán trước, can thiệp sau, kèm tín hiệu tốt và tín hiệu xấu để chấm câu trả lời."
          - list [ref=f1e1636]:
            - listitem [ref=f1e1637]:
              - paragraph [ref=f1e1638]: Bộ test backend 2.400 test, mỗi ngày CI chạy khoảng 60 lần. Ba tuần qua tỉ lệ pipeline đỏ là 22%, mỗi lần một test khác nhau, chạy lại thì xanh, và đội bắt đầu retry toàn suite như phản xạ.
              - heading "Anh xử lý flaky test trong CI theo trình tự nào, và khi nào thì cách ly một test khỏi suite thay vì cứ retry?" [level=4] [ref=f1e1639]
              - list [ref=f1e1640]:
                - listitem [ref=f1e1641]: Gom log CI nhiều tuần, tách test fail chập chờn khỏi test fail ổn định theo tỉ lệ đỏ qua các lần chạy
                - listitem [ref=f1e1642]: Chạy riêng nhóm nghi vấn lặp 30-50 lần ở môi trường sạch để đo tỉ lệ fail thật của từng test
                - listitem [ref=f1e1643]: "Đọc trace và log của đúng lần fail: race theo thời gian, phụ thuộc thứ tự chạy, hay dữ liệu dùng chung"
                - listitem [ref=f1e1644]: "Phân loại nguyên nhân: test tự gây (hẹn giờ, cổng cố định, dữ liệu) hay lỗi sản phẩm thật cần sửa"
                - listitem [ref=f1e1645]: "Sửa gốc trước: cô lập dữ liệu mỗi test, bỏ phụ thuộc thứ tự, thay chờ cố định bằng điều kiện"
                - listitem [ref=f1e1646]: Chỉ quarantine khi chưa tìm ra gốc, kèm người sở hữu và hạn sửa; cấm retry toàn suite để che đỏ
                - listitem [ref=f1e1647]: Theo dõi tỉ lệ đỏ sau fix theo tuần, đặt ngưỡng chặn merge khi flake quay lại
