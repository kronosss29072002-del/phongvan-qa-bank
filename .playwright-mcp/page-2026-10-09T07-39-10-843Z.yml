            - listitem [ref=f1e1238]:
              - paragraph [ref=f1e1239]: Team bọc Redis lock quanh mọi endpoint ghi, mỗi request thêm 3 vòng round-trip tới Redis nên p99 tăng từ 95ms lên 310ms. Hôm qua lock hết hạn giữa chừng vì một GC pause 2,5 giây, hai job nền song song ghi đè kết quả nhau và làm sai báo cáo doanh thu một ngày.
              - heading "Những chỗ này có thật sự cần distributed lock không, em chốt tiêu chí dùng hay bỏ thế nào, và khi buộc phải dùng thì an toàn ra sao?" [level=4] [ref=f1e1240]
              - list [ref=f1e1241]:
                - listitem [ref=f1e1242]: "Liệt kê mọi nơi đang đặt lock, mỗi chỗ trả lời được: hai process chạy song song thì hỏng gì cụ thể."
                - listitem [ref=f1e1243]: "Thử thay lock bằng thứ DB đã có: conditional update, unique constraint, hoặc advisory lock đúng phạm vi."
                - listitem [ref=f1e1244]: Giữ lock chỉ cho critical section ngắn, đo p99 thời gian giữ lock và so sánh với TTL đang khai.
                - listitem [ref=f1e1245]: "Khi buộc dùng: SET NX PX kèm fencing token tăng dần, resource từ chối token cũ hơn token đã nhận."
                - listitem [ref=f1e1246]: Khi release phải kiểm tra token rồi mới delete, tránh xóa nhầm lock của process khác.
                - listitem [ref=f1e1247]: "Xử lý GC pause và network stall: TTL phải lớn hơn thời gian giữ lock, kèm watchdog gia hạn khi cần."
                - listitem [ref=f1e1248]: Benchmark trước sau khi gỡ lock, thay bằng idempotency hoặc version field và ghi lại lý từng chỗ.
