                  - /url: "#e-backward-compatibility-schema"
              - generic [ref=f1e733]:
                - paragraph [ref=f1e734]:
                  - generic [ref=f1e735]: Tín hiệu tốt
                  - text: Có mốc sunset cụ thể cho từng version, phân loại additive với breaking trước khi mở version mới, và nhìn số liệu client trước khi tắt bất cứ thứ gì.
                - paragraph [ref=f1e736]:
                  - generic [ref=f1e737]: Dấu hiệu sai
                  - text: Mở thêm /v3 mới trong khi /v1 chưa có ngày chết, hoặc trộn URL với header version không theo quy tắc nào.
            - listitem [ref=f1e738]:
              - paragraph [ref=f1e739]: Frontend giữ TypeScript types copy tay từ tài liệu; backend đổi total_amount từ number sang string trong bản 2.4.0. Hai ngày sau, màn hình thanh toán hiện NaN ở 8% giao dịch, chỉ trên build frontend từ tuần trước.
              - heading "Em phát hiện và chặn kiểu lệch hợp đồng này từ pipeline như thế nào?" [level=4] [ref=f1e740]
              - list [ref=f1e741]:
                - listitem [ref=f1e742]: "Tái hiện NaN: so payload thật từ backend 2.4.0 với type frontend đang build, xác nhận lệch kiểu đúng field total_amount."
                - listitem [ref=f1e743]: "Rà nguồn chân lý: frontend copy tay từ tài liệu, không có bước nào kiểm tra khi backend đổi kiểu."
                - listitem [ref=f1e744]: Chốt OpenAPI của backend làm nguồn duy nhất, sinh type cho frontend tự động thay vì copy tay.
                - listitem [ref=f1e745]: "Thêm contract test vào CI: build frontend phải chạy được với schema API của bản backend sắp deploy."
                - listitem [ref=f1e746]: Bổ sung consumer-driven contract cho các consumer chính, lệch hợp đồng làm pipeline đỏ trước khi merge.
