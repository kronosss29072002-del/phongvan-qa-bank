            - listitem [ref=f1e1328]:
              - paragraph [ref=f1e1329]: Tính năng import ảnh nhận URL do người dùng nhập và server tự tải về. Alert của cloud provider báo instance đã gọi metadata endpoint 400 lần trong một giờ; log ghi URL dạng http://169.254.169.254/latest/meta-data/iam/security-credentials/.
              - heading "Anh xác minh SSRF trước khi attacker lấy được credential, rồi bịt nó ở tầng nào?" [level=4] [ref=f1e1330]
              - list [ref=f1e1331]:
                - listitem [ref=f1e1332]: "Xác nhận từ log egress: tìm request tới 169.254.169.254 và loopback, dựng lại input người dùng đã nhập"
                - listitem [ref=f1e1333]: "Chặn hướng khai thác ngay: khóa tạm tính năng fetch nếu chưa có allowlist, không chờ bản fix hoàn chỉnh"
                - listitem [ref=f1e1334]: "Xoay và thu hẹp credential instance: thu hồi role hiện tại, gắn lại quyền tối thiểu để giảm thiệt hại nếu còn lọt"
                - listitem [ref=f1e1335]: "Bịt gốc ở tầng fetch: allowlist domain, chặn dải IP nội bộ và redirect, resolve DNS một lần rồi kiểm tra lại trước khi connect"
                - listitem [ref=f1e1336]: Bọc egress qua proxy kiểm soát để mọi request ra ngoài đi qua một cửa có luật
                - listitem [ref=f1e1337]: "Thêm ca test SSRF vào suite: URL tới loopback, metadata, DNS rebinding đều phải bị từ chối"
