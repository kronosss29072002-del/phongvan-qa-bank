                  - generic [ref=f1e1477]: Tín hiệu tốt
                  - text: "Nghe thấy thứ tự: xác nhận alert, khoanh vùng bằng metric, can thiệp có kiểm soát, ngưỡng escalate định lượng."
                - paragraph [ref=f1e1478]:
                  - generic [ref=f1e1479]: Dấu hiệu sai
                  - text: Vào thẳng restart service hoặc restart cả cụm, không đo ảnh hưởng thật và không ai được báo.
            - listitem [ref=f1e1480]:
              - paragraph [ref=f1e1481]: 14:32 deploy version 2.14.0, bốn phút sau p99 checkout bật từ 180ms lên 4,2s và 5xx chạm 3,1%. Diff chỉ có một query mới và đổi timeout 2s thành 500ms, đội release đang chờ quyết định.
              - heading "Rollback hay fix-forward? Tiêu chí quyết định của bạn là gì và làm ngay trong 5 phút đầu?" [level=4] [ref=f1e1482]
              - list [ref=f1e1483]:
                - listitem [ref=f1e1484]: Xác nhận thủ phạm là 2.14.0 bằng metric theo nhãn version, không tin theo thứ tự deploy.
                - listitem [ref=f1e1485]: "Định lượng ảnh hưởng: tỉ lệ request lỗi, nhóm khách nào bị, hai replica nào còn chạy bản cũ."
                - listitem [ref=f1e1486]: "Chọn rollback khi nguyên nhân chưa rõ: một lệnh revert, rủi ro thấp hơn sửa giữa lúc cháy."
                - listitem [ref=f1e1487]: Chạy rollback, chờ traffic cạn hết bản mới, verify p99 về 180ms và 5xx dưới 0,5%.
                - listitem [ref=f1e1488]: Chỉ fix-forward khi nguyên nhân đã chốt và bản fix chạy qua staging, phải kèm canary.
                - listitem [ref=f1e1489]: Nếu rollback va vào migration chưa hoàn tác, tắt feature flag của query mới trước đã.
                - listitem [ref=f1e1490]: Chốt sự cố, chép mốc thời gian từng bước làm đầu vào cho postmortem.
              - paragraph [ref=f1e1491]:
