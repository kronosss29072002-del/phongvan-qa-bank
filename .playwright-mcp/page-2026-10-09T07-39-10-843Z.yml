            - listitem [ref=f1e673]:
              - paragraph [ref=f1e674]: "App mobile dùng GraphQL gateway cho màn hình đơn hàng: 20 đơn, mỗi đơn kèm khách hàng và 5 item. Một query mất 2,1s p95 và DB nhận 121 query cho một request (1 danh sách đơn, 20 khách hàng, 100 item), trong khi REST cũ cần 6 round-trip khoảng 1,1s do RTT 180ms."
              - heading "Giữa việc bỏ GraphQL về lại REST và sửa gateway, em phân tích thế nào và xử lý tầng nào trước?" [level=4] [ref=f1e675]
              - list [ref=f1e676]:
                - listitem [ref=f1e677]: Đếm số DB query thật cho một GraphQL request bằng log query hoặc tracing theo từng resolver.
                - listitem [ref=f1e678]: "Xác nhận N+1: 1 query danh sách đơn, 20 query khách hàng và 100 query item chi tiết đều chạy trong một request."
                - listitem [ref=f1e679]: "Đo đối chứng REST 6 round-trip: 6 lần RTT 180ms cộng payload, phần lớn thời gian nằm ở số vòng gọi, không nằm ở DB."
                - listitem [ref=f1e680]: Gom query con thành một câu IN theo batch id thay vì gọi từng id, hoặc gộp theo request bằng bộ đệm.
                - listitem [ref=f1e681]: Cache lớp đọc cho dữ liệu ít đổi như customer, đặt TTL rõ ràng và nêu điều kiện invalidate.
                - listitem [ref=f1e682]: Chặn độ sâu và độ rộng query tối đa ở gateway, từ chối query vượt ngưỡng để bảo vệ DB.
                - listitem [ref=f1e683]: Đo lại p95 và số query trên mỗi request, so với baseline 121 query và 2,1s rồi mới chốt giữ GraphQL hay không.
              - paragraph [ref=f1e684]:
                - text: Thuật ngữ
