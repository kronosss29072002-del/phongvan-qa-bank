              - generic [ref=f1e1496]:
                - paragraph [ref=f1e1497]:
                  - generic [ref=f1e1498]: Tín hiệu tốt
                  - text: Nghe thấy tiêu chí quyết định dựa trên độ rõ của nguyên nhân và blast radius, không phải sở thích cá nhân.
                - paragraph [ref=f1e1499]:
                  - generic [ref=f1e1500]: Dấu hiệu sai
                  - text: Trả lời cứng 'luôn rollback' hoặc 'luôn fix-forward' mà không nêu điều kiện, thời gian, rủi ro của từng hướng.
            - listitem [ref=f1e1501]:
              - paragraph [ref=f1e1502]: Payment-worker bị OOM killer giết lần thứ tư trong 90 phút, mỗi lần sống khoảng 20 phút. RSS chạm 2,1GB khi limit pod 2GB, full GC xong heap vẫn không về dưới 1,6GB.
              - heading "Bạn kết luận đây là leak hay tăng tải, và can thiệp gì trước khi nâng limit?" [level=4] [ref=f1e1503]
              - list [ref=f1e1504]:
                - listitem [ref=f1e1505]: "Xác nhận cái chết: exit code 137, dòng oom-kill trong dmesg hoặc kubectl describe, không đổ cho crash app."
                - listitem [ref=f1e1506]: "So curve RSS với request rate: RSS phình độc lập với traffic là leak, không phải đang chịu tải."
                - listitem [ref=f1e1507]: "Giữ hiện trường: chụp heap / profile ở lần sống gần nhất trước khi restart xóa bằng chứng."
                - listitem [ref=f1e1508]: "Rà thay đổi gần đây: version mới, dependency mới, cache giữ object không TTL trong worker."
                - listitem [ref=f1e1509]: Vá tạm bằng nâng limit hoặc thêm replica giữ traffic, ghi rõ đây là vá chứ chưa phải fix.
                - listitem [ref=f1e1510]: Sửa gốc trong code, thêm cảnh báo theo số restart và trend RSS thay vì chờ 5xx từ user.
                - listitem [ref=f1e1511]: Verify 24 giờ không restart lặp, rồi trả limit về chuẩn trong một change request riêng.
