            - generic [ref=f1e406]: 8 câu
          - paragraph [ref=f1e407]: "8 câu phỏng vấn tình huống cho hạng mục Thiết kế & Refactor: if/else lan tràn theo loại thuật toán trong PR, god class cần tách, quyết định abstraction theo rule of three, di trú legacy sang ports & adapters từng bước, DI container phình to khó debug, thêm tính năng không phá SOLID, chọn cấu trúc dữ liệu theo tradeoff Big-O, và nhận diện tight coupling khi review. Mỗi câu chấm theo trình tự chẩn đoán trước, can thiệp sau, kèm tín hiệu tốt và tín hiệu xấu."
