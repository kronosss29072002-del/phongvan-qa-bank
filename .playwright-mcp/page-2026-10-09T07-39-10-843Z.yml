                - paragraph [ref=f1e1655]:
                  - generic [ref=f1e1656]: Tín hiệu tốt
                  - text: Tái hiện được trước khi sửa, phân biệt flaky do test với bug thật, và dùng quarantine có thời hạn thay vì retry mù.
