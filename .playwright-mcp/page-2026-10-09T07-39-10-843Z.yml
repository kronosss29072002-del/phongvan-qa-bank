                  - generic [ref=f1e1409]: Tín hiệu tốt
                  - text: Xác minh khai thác bằng origin lạ trước, siết về allowlist cụ thể, set Vary đúng và rà luôn SameSite cho cookie phiên.
                - paragraph [ref=f1e1410]:
                  - generic [ref=f1e1411]: Dấu hiệu sai
                  - text: Đổi sang allowlist bằng một điều kiện if theo host chứa chuỗi khách hàng, không kiểm tra cache và cookie phiên.
            - listitem [ref=f1e1412]:
              - paragraph [ref=f1e1413]: Endpoint tìm kiếm nối tham số sort vào raw query qua $queryRawUnsafe; pentest chèn được ' OR 1=1-- và đọc sang bảng khác. Cả team trước giờ tin ORM che hết đường vào nên chưa từng rà raw query.
              - heading "Anh vá điểm nóng và rà các raw query còn lại thế nào trước khi có người khai thác thật?" [level=4] [ref=f1e1414]
              - list [ref=f1e1415]:
                - listitem [ref=f1e1416]: "Tái hiện ở staging có kiểm soát: chạy lại payload của pentest, ghi request và câu query để chắc chắn đường vào"
                - listitem [ref=f1e1417]: Bật log câu query có tham số trên môi trường bị ảnh hưởng để biết input nào chạm tới raw query
                - listitem [ref=f1e1418]: "Vá điểm nóng: bỏ nối chuỗi, chuyển sang tham số hóa hoặc whitelist giá trị cho sort và filter"
                - listitem [ref=f1e1419]: "Rà toàn repo: grep queryRawUnsafe, executeRawUnsafe và mọi SQL ghép từ chuỗi, xếp theo mức phơi nhiễm"
                - listitem [ref=f1e1420]: "Thêm gate: rule static analysis chặn raw query dựng từ input, bắt buộc review riêng cho mọi raw query"
                - listitem [ref=f1e1421]: "Giảm thiệt hại nếu còn lọt: thu quyền DB user về đúng bảng cần thiết, không dùng tài khoản toàn quyền cho app"
