                  - generic [ref=f1e1658]: Dấu hiệu sai
                  - text: Trả lời bằng cách tăng retry hoặc xóa test khỏi suite, không đụng tới dữ liệu chung và phụ thuộc thời gian.
            - listitem [ref=f1e1659]:
              - paragraph [ref=f1e1660]: "Module thanh toán đạt 91% line coverage trong báo cáo nhưng hai tháng liên tiếp có bug lọt production: sai làm tròn khi hoàn tiền và nhánh retry webhook chưa từng chạy trong test. Review vẫn dựa vào con số 91%."
              - heading "Vì sao coverage cao mà bug vẫn lọt, và anh thay con số đó bằng cách đo nào?" [level=4] [ref=f1e1661]
              - list [ref=f1e1662]:
                - listitem [ref=f1e1663]: Lấy từng bug vừa lọt, truy ngược về test đáng lẽ phải bắt và lý do nó không bắt được
                - listitem [ref=f1e1664]: Đọc coverage theo nhánh thay vì theo dòng; nhánh lỗi, nhánh hậu kiểm và retry thường trắng
                - listitem [ref=f1e1665]: "Kiểm tra assertion thật trên nhánh được phủ: chạy qua code mà không kiểm kết quả thì không tính"
                - listitem [ref=f1e1666]: "Viết test cho nhánh lỗi trước theo bug-fix protocol: tái hiện đỏ rồi sửa, sau đó mới bàn tăng phủ"
                - listitem [ref=f1e1667]: Thêm mutation testing hoặc property-based test cho module tính toán để đo chất lượng assertion
