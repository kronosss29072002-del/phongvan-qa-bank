            - listitem [ref=f1e1544]:
              - paragraph [ref=f1e1545]: "Cuối tuần trước có sự cố 40 phút không chẩn đoán nổi: alert chỉ ghi 'payment API 5xx cao', log mỗi service format riêng, không có correlation ID, metric không gắn nhãn service. Dashboard lớp gateway vẫn xanh."
              - heading "Anh dựng lại quy trình chẩn đoán và bổ sung tín hiệu gì để sự cố kiểu này không tái diễn?" [level=4] [ref=f1e1546]
              - list [ref=f1e1547]:
                - listitem [ref=f1e1548]: "Thu các mảnh còn sót: access log LB, slow query log, chỉ số replica, timeline deploy để dựng diễn biến."
                - listitem [ref=f1e1549]: "Chốt câu hỏi trước khi mua công cụ: lỗi ở tầng nào, đo ở đâu, vì sao giám sát không thấy."
                - listitem [ref=f1e1550]: Bắt buộc correlation ID xuyên HTTP và message, mọi log line là JSON kèm trace_id, service, version.
                - listitem [ref=f1e1551]: Gắn exemplar lên metric để nhảy từ spike p99 sang đúng span thay vì đoán theo dashboard tổng.
                - listitem [ref=f1e1552]: Chuẩn hóa metric RED từng service thay vì chỉ 5xx ở gateway, kiểm soát cardinality khi thêm nhãn.
                - listitem [ref=f1e1553]: Chạy drill với kịch bản đã biết, đặt mục tiêu thời gian chẩn đoán dưới 5 phút cho lần sau.
                - listitem [ref=f1e1554]: Đưa yêu cầu tín hiệu quan sát vào definition of done của mọi feature mới.
