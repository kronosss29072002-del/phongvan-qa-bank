            - listitem [ref=f1e849]:
              - paragraph [ref=f1e850]: Mỗi lần deploy hoặc autoscale, 8 pod mới mất 6-9s cho request đầu rồi mới về 120ms. Đúng 9h autoscale bật thêm 6 pod, hàng loạt client timeout và nhận 504, trong khi pod đã warm thì không ai phàn nàn.
              - heading "Anh đo và xử lý slow cold path này thế nào để user không phải trả giá cho lần gọi đầu tiên?" [level=4] [ref=f1e851]
              - list [ref=f1e852]:
                - listitem [ref=f1e853]: "Tách request đầu sau khởi động bằng trace, liệt kê thành phần: JIT warmup, mở pool kết nối, nạp config, cache lạnh"
                - listitem [ref=f1e854]: "Chưa nhận traffic thật: chạy request mẫu ở post-start, readiness chỉ pass khi warmup xong"
                - listitem [ref=f1e855]: Mở sẵn kết nối DB pool lúc khởi động và khi pool co lại, đừng để mỗi pod mới trả giá kết nối mới
                - listitem [ref=f1e856]: "Xử lý cache lạnh lúc scale ra: jitter TTL và negative cache để 8 pod cold cùng lúc không đàn ong vào Redis"
                - listitem [ref=f1e857]: Để autoscaling chạy trước giờ cao điểm theo lịch traffic, thay vì đợi CPU vượt ngưỡng mới scale
                - listitem [ref=f1e858]: Đo time-to-ready và p99 của 30 giây đầu sau mỗi deploy, coi đây là tiêu chí gate
