            - listitem [ref=f1e1566]:
              - paragraph [ref=f1e1567]: 09:14 một kỹ sư sửa config map hạ pool của payment-service từ 50 xuống 10 để 'giảm tải DB', push thẳng production không qua review. Chín phút sau 31% request thanh toán timeout vì pool hết slot.
              - heading "Bạn xử lý theo thứ tự nào, và sửa gì ở quy trình để không ai push thẳng config lên production nữa?" [level=4] [ref=f1e1568]
              - list [ref=f1e1569]:
                - listitem [ref=f1e1570]: Xác nhận change gần nhất qua lịch sử config repo và audit log, đối chiếu mốc 09:14 với curve timeout.
                - listitem [ref=f1e1571]: Revert config về giá trị cũ ngay, verify pool hết chờ và tỉ lệ timeout về dưới 0,1%.
                - listitem [ref=f1e1572]: Rà 24 giờ trước trong config repo tìm change tương tự đã áp cho service khác.
                - listitem [ref=f1e1573]: Chặn tạm quyền push thẳng lên production, mọi thay đổi bắt buộc qua pull request có review.
                - listitem [ref=f1e1574]: Chuyển config sang GitOps có drift detection, áp dụng kiểu canary thay vì bung toàn service.
                - listitem [ref=f1e1575]: Thêm alert theo pool wait time và SLO của payment, không chỉ nhìn mỗi CPU.
                - listitem [ref=f1e1576]: "Ghi vào postmortem: giá trị cũ, mới, mốc thời gian, lỗ hổng để change lọt thẳng production."
