              - paragraph [ref=f1e349]: Haymemory model · happens-before · memory visibility · data race · atomicity
              - paragraph [ref=f1e350]:
                - generic [ref=f1e351]: Vấn đề
                - text: Trong đa luồng, reorder (compiler/CPU) + cache gây visibility; cần happens-before/atomic để tránh data race và đảm bảo consistency.
              - paragraph [ref=f1e352]:
                - generic [ref=f1e353]: Nguồn gốc
                - text: Leslie Lamport (happens-before, sequential consistency); Java Memory Model (JSR-133), C++11 memory model.
              - paragraph [ref=f1e354]:
                - generic [ref=f1e355]: Xử lý
                - text: "Happens-before: quan hệ đảm bảo thứ tự/visibility (lock release→acquire, volatile/read-write, thread start/join, sync). Memory barrier/fence ngăn reorder. Atomic operations (compare-and-swap) cơ sở lock-free. Data race: 2 thread access shared non-atomic không sync → undefined/bug khó tái hiện."
          - article [ref=f1e356]:
            - generic [aria-hidden] [ref=f1e357]:
