              - generic [ref=f1e1211]:
                - paragraph [ref=f1e1212]:
                  - generic [ref=f1e1213]: Tín hiệu tốt
                  - text: Ứng viên chốt nguồn sự thật theo quorum, ép node thiểu số ngừng ghi, và có kế hoạch resolve key xung đột thay vì chỉ phục hồi rồi thôi.
                - paragraph [ref=f1e1214]:
                  - generic [ref=f1e1215]: Dấu hiệu sai
                  - text: Tin rằng health check ping là đủ để hai nút không cùng nhận write, hoặc phục hồi bằng cách copy đè một bên mà không phân tích.
            - listitem [ref=f1e1216]:
              - paragraph [ref=f1e1217]: Notification service fan-out một event ra 420 webhook subscriber bằng vòng lặp tuần tự, p95 của bước này là 9,4s. Sau khi thêm 80 subscriber mới, queue chính lag 45.000 message; một subscriber timeout 30 giây mỗi lần gọi kéo chậm cả batch vì chia sẻ chung một connection pool.
              - heading "Subscriber đông mà có kẻ chậm, em tái cấu trúc bước fan-out thế nào để hàng đợi chính không bị một subscriber kẹt kéo lùi?" [level=4] [ref=f1e1218]
              - list [ref=f1e1219]:
                - listitem [ref=f1e1220]: Phân bố thời gian gửi theo từng subscriber, xác định nhóm 10% chậm chiếm phần lớn p95 của fan-out.
                - listitem [ref=f1e1221]: "Tách fan-out khỏi consumer chính: mỗi event chỉ enqueue vào per-subscriber queue rồi trả về ngay."
                - listitem [ref=f1e1222]: Gửi song song với số worker giới hạn theo subscriber, gắn timeout riêng cho từng đích thay vì chung batch.
                - listitem [ref=f1e1223]: Dùng bounded queue per subscriber, subscriber chậm bị đo bằng lag metric riêng thay vì chặn cả nhóm.
                - listitem [ref=f1e1224]: Retry webhook fail với exponential backoff + jitter, sau N lần đưa sang DLQ cho người vận hành xử lý.
                - listitem [ref=f1e1225]: Theo dõi amplification factor nội bộ, đặt ngưỡng cảnh báo khi số request nội bộ trên mỗi event vượt mức.
                - listitem [ref=f1e1226]: Ưu tiên subscriber trả phí, nhóm còn lại batch theo lịch để đưa p95 fan-out về dưới 1s.
