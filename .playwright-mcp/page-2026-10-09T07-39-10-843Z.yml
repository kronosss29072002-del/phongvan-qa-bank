            - listitem [ref=f1e1610]:
              - paragraph [ref=f1e1611]: "Đêm qua pager reng 9 lần: 8 lần là CPU node test và cache hit ratio dao động, lần thứ chín là lỗi thẻ thật và on-call bỏ lỡ 14 phút. Tuần trước 214 cảnh báo, 96% không cần hành động."
              - heading "Bạn thanh lọc hệ thống cảnh báo theo trình tự nào và tiêu chí nào để giữ một alert lại?" [level=4] [ref=f1e1612]
              - list [ref=f1e1613]:
                - listitem [ref=f1e1614]: "Đo trước khi cắt: số page mỗi người trực, tỉ lệ ack, thời gian ack trung bình, mức hành động của từng alert."
                - listitem [ref=f1e1615]: Gỡ hoặc hạ mức cảnh báo không dẫn tới hành động cụ thể, chỉ giữ lại phần dashboard để xem.
                - listitem [ref=f1e1616]: Thay alert ngưỡng đơn bằng burn rate đa cửa sổ trên SLO, bắt được cả burn nhanh lẫn burn chậm.
                - listitem [ref=f1e1617]: Gộp alert trùng, đặt ngưỡng có hysteresis để metric quanh ngưỡng không re-fire liên tục.
                - listitem [ref=f1e1618]: Chỉ page khi ảnh hưởng user vượt error budget, phần còn lại chuyển vào báo cáo ngày.
                - listitem [ref=f1e1619]: Cân lại định kỳ hằng tháng theo tỉ lệ alert cần hành động, dưới 70% lại gỡ tiếp.
                - listitem [ref=f1e1620]: Duy trì kĩ năng trực ca bằng alert giả và game day, thay vì chìm trong nhiễu.
