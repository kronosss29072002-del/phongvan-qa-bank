                  - generic "Opens in a new tab" [ref=f49e216]
                - text: helps you understand the pros and cons of the decisions you make when building systems in the cloud. The six pillars of the Framework allow you to learn architectural best practices for designing and operating reliable, secure, efficient, cost-effective, and sustainable systems. Using the
                - link [ref=f49e218] [cursor=pointer]:
                  - /url: https://aws.amazon.com/well-architected-tool/
