                - text: .
              - heading [level=2] [ref=f49e231]:
                - text: Introduction
                - button "Copy link to the section" [ref=f49e239] [cursor=pointer]
              - heading "What is disaster recovery?" [level=3] [ref=f49e241]
              - paragraph [ref=f49e242]: Disaster recovery is the process of preparing for and recovering from a disruptive event.
              - heading "What is a disaster?" [level=3] [ref=f49e243]
              - paragraph [ref=f49e244]:
                - text: In the context of a company’s IT environment, a disaster is an event that partially or completely disrupts the operations of one or more applications. A disaster normally requires human intervention to
                - emphasis [ref=f49e245]: fail over
                - text: to secondary copies of applications in order to maintain their functionality.
              - paragraph [ref=f49e246]: "The four main categories of a disaster:"
              - list [ref=f49e248]:
                - listitem [ref=f49e249]:
                  - paragraph [ref=f49e250]: Human errors – Unintentional actions leading to a security breach such as inadvertent misconfiguration of the software or a database
                - listitem [ref=f49e251]:
                  - paragraph [ref=f49e252]: Malicious attacks – Unauthorized actions that affect a victim’s system such as a denial-of-service (DoS) or ransomware attack
                - listitem [ref=f49e253]:
                  - paragraph [ref=f49e254]: Natural disasters – Environmental factors that cause a system failure such as earthquakes or floods
                - listitem [ref=f49e255]:
                  - paragraph [ref=f49e256]: Technical failures – A malfunction of software, hardware, or a facility such as a power failure or a network connectivity failure
              - paragraph [ref=f49e257]: "There are several factors to consider when planning your response to a specific disaster:"
              - list [ref=f49e259]:
                - listitem [ref=f49e260]:
                  - paragraph [ref=f49e261]: Expected duration of the disaster – How soon will the application recover and how likely is the disaster to resolve on its own?
                - listitem [ref=f49e262]:
                  - paragraph [ref=f49e263]: Size of impact (also known as blast radius) – Which applications are affected and to what extent is their functionality impaired?
                - listitem [ref=f49e264]:
                  - paragraph [ref=f49e265]: Geographic impact – May be regional, national, continental, or global.
                - listitem [ref=f49e266]:
                  - paragraph [ref=f49e267]: Tolerance of downtime – How significant is the impact of the application not functioning?
              - heading "Why disaster recovery?" [level=3] [ref=f49e268]
              - paragraph [ref=f49e269]: "A properly planned and implemented disaster recovery solution helps mitigate the following issues that can be caused by a disaster:"
              - list [ref=f49e271]:
                - listitem [ref=f49e272]:
                  - paragraph [ref=f49e273]: Direct and indirect financial loss – The impact of direct financial loss is mostly relevant for applications that are critical for any revenue-generating processes. For example, external-facing IT systems that are provided to customers for a fee or internal IT systems that process data relevant for revenue generation. Indirect financial loss includes, for example, customers switching to a competing product and the cost of work needed to resume normal operation after the disaster is over.
                - listitem [ref=f49e274]:
                  - paragraph [ref=f49e275]: Reputational damage – In addition to financial loss, downtime caused by unexpected incidents can significantly harm a company’s reputation. A short recovery period aided by a disaster recovery solution can help avoid irreversible damage to the corporate image.
                - listitem [ref=f49e276]:
                  - paragraph [ref=f49e277]: Failure to abide by compliance standards – Multiple compliance standards, including System and Organization Controls (SOC), the Payment Card Industry (PCI) Data Security Standard, and the Health Insurance Portability and Accountability Act (HIPAA), require a disaster recovery plan. Some standards even add very specific requirements, such as minimal physical distance between the source site and the disaster recovery site.
