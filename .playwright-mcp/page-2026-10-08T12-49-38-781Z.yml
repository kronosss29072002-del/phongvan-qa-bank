              - paragraph [ref=f49e188]:
                - text: "Publication date: January 19, 2022 ("
                - link "Document history" [ref=f49e189] [cursor=pointer]:
                  - /url: ./document-history.html
                - text: )
              - heading [level=2] [ref=f49e190]:
                - text: Abstract
                - button "Copy link to the section" [ref=f49e198] [cursor=pointer]
              - paragraph [ref=f49e200]: This whitepaper outlines the best practices for planning, implementing, and maintaining disaster recovery for on-premises applications using AWS. It lays out the differences between disaster recovery and other resilience strategies, and describes the steps of building a disaster recovery plan. It also offers different approaches for mitigating risks and meeting recovery time objectives (RTO), and meeting recovery point objectives (RPO) by using AWS as the disaster recovery site. This whitepaper covers how to use AWS as a disaster recovery site for on-premises applications.
              - paragraph [ref=f49e201]:
                - text: Refer to
                - 'link "Disaster Recovery of Workloads on AWS: Recovery in the Cloud" [ref=f49e202] [cursor=pointer]':
                  - /url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-workloads-on-aws.html
                - text: for information about disaster recovery for AWS-hosted workloads.
              - heading [level=2] [ref=f49e203]:
                - text: Are you Well-Architected?
                - button "Copy link to the section" [ref=f49e211] [cursor=pointer]
              - paragraph [ref=f49e213]:
