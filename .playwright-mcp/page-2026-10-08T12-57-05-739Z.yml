          - text: See
          - link [ref=f62e104] [cursor=pointer]:
            - /url: https://www.google.com/policies/privacy/
            - emphasis [ref=f62e105]: https://www.google.com/policies/privacy/
          - text: .
        - paragraph [ref=f62e106]:
          - superscript [ref=f62e107]:
            - link "81" [ref=f62e108] [cursor=pointer]:
              - /url: "#id-4DBuqSVu9iy-marker"
          - text: If you’d like to start your own repository, Etsy has released
          - link [ref=f62e109] [cursor=pointer]:
            - /url: https://github.com/etsy/morgue
            - emphasis [ref=f62e110]: Morgue
          - text: ", a tool for managing postmortems."
        - paragraph [ref=f62e111]:
          - superscript [ref=f62e112]:
            - link "82" [ref=f62e113] [cursor=pointer]:
              - /url: "#id-JJ7umIlF2Tyuq-marker"
          - text: Google’s Peer Bonus program is a way for fellow Googlers to recognize colleagues for exceptional efforts and involves a token cash reward.
