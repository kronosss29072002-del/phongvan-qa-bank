                    - button "Xem thêm" [ref=f380e168] [cursor=pointer]
                  - heading "1. Kiểm thực ba bước là như thế nào?" [level=2] [ref=f380e169]
                  - paragraph [ref=f380e170]: "Kiểm thực ba bước là hoạt động được áp dụng đối với cơ sở kinh doanh dịch vụ ăn uống gồm: cơ sở chế biến suất ăn sẵn; căng tin kinh doanh ăn uống, bếp ăn tập thể; bếp ăn, nhà hàng ăn uống của khách sạn, khu nghỉ dưỡng; nhà hàng ăn uống. Việc kiểm tra ba bước giúp cho cơ sở kiểm soát được vấn đề an toàn, vệ sinh thực phẩm trong suốt quá trình từ khâu nhập nguyên liệu, thực phẩm; sơ chế; chế biến; phân chia; bảo quản; vận chuyển thức ăn cho đến khi ăn uống tại chỗ."
                  - paragraph [ref=f380e171]: Căn cứ vào khoản 2 Điều 3 Luật An toàn, vệ sinh thực phẩm năm 2010 thì tổ chức, cá nhân sản xuất, kinh doanh thực phẩm phải chịu trách nhiệm về vấn đề an toàn, vệ sinh đối với thực phẩm do mình sản xuất, kinh doanh. Do đó, quá trình kiểm thực ba bước của cơ sở kinh doanh dịch vụ ăn uống là cần thiết và đảm bảo cho sức khỏe của người tiêu dùng.
                  - paragraph [ref=f380e172]
                  - heading "2. Hướng dẫn kiểm thực ba bước" [level=2] [ref=f380e173]
                  - paragraph [ref=f380e174]:
                    - strong [ref=f380e175]: "Bước 1: Kiểm tra trước khi chế biến thức ăn"
                  - paragraph [ref=f380e176]: "* Kiểm tra nguyên liệu thực phẩm trước khi nhập vào cơ sở kinh doanh dịch vụ ăn uống:"
                  - paragraph [ref=f380e177]: Các cơ sở kinh doanh dịch vụ ăn uống sử dụng các nguyên liệu đạt được những quy chuẩn, tiêu chuẩn và tuân thủ những quy định về giới hạn vi sinh vật gây bệnh, dư lượng thuốc bảo vệ thực vật, dư lượng thuốc thú y, kim loại nặng,.. trong thực phẩm mà có thể gây hại đến sức khỏe và tính mạng của con người. Các cơ sở nên chọn mua nguyên liệu, thực phẩm tại các cơ sở uy tín, đáng tin cậy, có cửa hàng cố định hay có các chứng nhận về an toàn thực phẩm mà cơ quan có thẩm quyền cấp hoặc thực phẩm đã được kiểm nghiệm chất lượng an toàn thực phẩm.
                  - paragraph [ref=f380e178]: "Khi tiếp nhận nguồn cung ứng nguyên liệu thì cơ sở kinh doanh dịch vụ ăn uống phải tiến hành kiểm tra nguyên liệu và xác định xem: bên cung cấp có chứng chỉ gì không, kiểm tra (chất lượng, độ tươi nguyên, nhiệt độ phù hợp cho từng loại nguyên liệu,...) nguồn nguyên liệu khi nhập vào. Sau đó cơ sở kinh doanh sẽ ghi chép lại các thông tin vào sổ kiểm thực và lưu giữ lại."
                  - generic [ref=f380e179]: Quảng cáo
                  - paragraph [ref=f380e181]:
                    - emphasis [ref=f380e182]: Thứ nhất,
                    - text: kiểm tra về chủng loại và giấy tờ kèm theo đối với mỗi loại sản phẩm (giấy tờ, tài liệu chứng nhận về nguồn gốc, xuất xứ, hợp đồng mua bán, hóa đơn và các giấy tờ khác có liên quan)
                  - paragraph [ref=f380e183]: "+ Loại thực phẩm tươi sống, thực phẩm đông lạnh: tên thực phẩm, khối lượng, giấy chứng nhận kiểm dịch động vật; thông tin trên nhãn các sản phẩm tươi sống, đông lạnh đảm bảo được những nội dung sau: tên sản phẩm, nhà sản xuất, địa chỉ sản xuất, ngày sản xuất, hạn dùng, quy cách đóng gói, khối lượng, yêu cầu bảo quản;...."
                  - paragraph [ref=f380e184]: "+ Loại thực phẩm bao gói sẵn, phụ gia thực phẩm: tên sản phẩm khối lượng, kiểm tra nhãn sản phẩm (tên sản phẩm, cơ sở sản xuất, địa chỉ sản xuất, lô sản xuất, ngày sản xuất, thời hạn sử dụng, quy cách đóng gói, khối lượng, hướng dẫn sử dụng, yêu cầu bảo quản). Nếu cần thì có thể kiểm tra các giấy tờ liên quan đến sản phẩm như: Giấy chứng nhận đủ điều kiện an toàn thực phẩm, Giấy tiếp nhận công bố hợp quy hoặc Giấy xác nhận công bố phù hợp với quy định an toàn thực phẩm đối với sản phẩm,...."
                  - paragraph [ref=f380e185]:
                    - emphasis [ref=f380e186]: Thứ hai,
                    - text: "cơ sở kinh doanh sẽ tiến hành kiểm tra, đánh giá tình trạng cảm quan về chất lượng, an toàn thực phẩm của từng loại thực phẩm nhập vào, bao gồm: màu sắc, mùi vị, tính nguyên vẹn của sản phẩm,...và điều kiện bảo quản thực tế nếu có yêu cầu."
                  - paragraph [ref=f380e187]:
                    - emphasis [ref=f380e188]: Thứ ba,
                    - text: khuyến khích các cơ sở kinh doanh dịch vụ ăn uống kiểm tra một số nguyên liệu thực phẩm bằng xét nghiệm nhanh.
                  - paragraph [ref=f380e189]: "Trường hợp nguyên liệu, thực phẩm đã được kiểm tra, đánh giá không đạt yêu cầu về chất lượng, an toàn thực phẩm thì cần ghi rõ biện pháp xử lý với sản phẩm đó như là: loại bỏ, trả lại, tiêu hủy,..."
                  - paragraph [ref=f380e190]: "* Thực phẩm nhập vào để chế biến tại bếp ăn của cơ sở:"
                  - paragraph [ref=f380e191]:
                    - emphasis [ref=f380e192]: Thứ nhất,
                    - text: "thực phẩm nhập vào để chế biến ngay:"
                  - paragraph [ref=f380e193]: Thực phẩm nhập vào để chế biến ngay thì sẽ được kiểm tra về chủng loại, tình trạng cảm quan, một số chỉ tiêu về chất lượng, an toàn thực phẩm.
                  - paragraph [ref=f380e194]:
                    - emphasis [ref=f380e195]: Thứ hai,
                    - text: "thực phẩm nhận từ kho của cơ sở:"
                  - generic [ref=f380e196]: Quảng cáo
                  - paragraph [ref=f380e198]: "Thực phẩm nhận từ kho của cơ sở sẽ cần kiểm tra, đánh giá tình trạng cảm quan về chất lượng, an toàn thực phẩm của từng loại thực phẩm nhập vào bao gồm: màu sắc, mùi vị, tính nguyên vẹn của sản phẩm,...và điều kiện bảo quản thực tế nếu có yêu cầu."
                  - paragraph [ref=f380e199]: "* Thông tin kiểm tra trước khi chế biến sẽ được ghi chép theo Mẫu số 1 Phụ lục 1 về mẫu biểu ghi chép kiểm thực ba bước ban hành theo Quyết định về việc ban hành hướng dẫn thực hiện chế độ kiểm thực ba bước và lưu mẫu thức ăn đối với cơ sở kinh doanh dịch vụ ăn uống."
                  - paragraph [ref=f380e200]:
                    - strong [ref=f380e201]: "Bước 2: Kiểm tra trong quá trình chế biến thức ăn"
                  - paragraph [ref=f380e202]: Cơ sở kinh doanh cần đảm bảo quy trình chế biến theo nguyên tắc một chiều từ khi nguyên liệu xuất kho, sơ chế rồi lúc chuyển vào phân xưởng sản xuất, chế biến và sau chuyển đến phòng thành phẩm, phân phối.
                  - paragraph [ref=f380e203]: Trong quá trình chế biến thức ăn cần phải đảm bảo tốt khâu vệ sinh cá nhân, cơ sở, trang thiết bị, nguyên vật liệu chế biến. Lưu ý rằng cơ sở chỉ được sử dụng các chất phụ gia nằm trong danh mục được phép sử dụng và chú ý đến cả liều lượng và cách thức sử dụng.
                  - paragraph [ref=f380e204]: "* Kiểm tra điều kiện vệ sinh tại cơ sở từ thời điểm bắt đầu sơ chế, chế biến cho đến khi thức ăn được chế biến xong:"
                  - paragraph [ref=f380e205]:
                    - emphasis [ref=f380e206]: Thứ nhất,
                    - text: "người tham gia chế biến thức ăn cần đảm bảo về vấn đề vệ sinh cá nhân và bảo đảm an toàn thực phẩm:"
                  - paragraph [ref=f380e207]: + Mặc trang phục bảo hộ riêng, có tạp dề, đeo khẩu trang, đội mũ che tóc khi chế biến
                  - paragraph [ref=f380e208]: + Giữ móng tay luôn ngắn, được cắt sạch sẽ, đeo găng tay và không đeo đồ trang sức (nhẫn, đồng hồ,...) khi tiếp xúc trực tiếp với thực phẩm.
                  - paragraph [ref=f380e209]: + Không ăn uống, hút thuốc trong khu vực chế biến thức ăn;.....
                  - paragraph [ref=f380e210]: + Rửa tay trước khi chế biến thực phẩm và rửa tay sau khi đi vệ sinh, tiếp xúc với thực phẩm sống, gãi ngứa, ngoáy tay, ngoáy mũi,... bằng xà phòng và nước sạch.
                  - paragraph [ref=f380e211]:
                    - emphasis [ref=f380e212]: Thứ hai,
                    - text: trang thiết bị, dụng cụ trong khu vực chế biến
                  - paragraph [ref=f380e213]: + Trang thiết bị, dụng cụ tiếp xúc với thực phẩm phải được đảm bảo về vấn đề vệ sinh, an toàn thực phẩm.
                  - generic [ref=f380e214]: Quảng cáo
                  - paragraph [ref=f380e216]: + Trang thiết bị, dụng cụ được làm bằng vật liệu không gây độc, không gây ra mùi vị lạ cho thực phẩm, không thôi nhiễm vào thực phẩm, không bị ăn mòn,....
                  - paragraph [ref=f380e217]: + Trang thiết bị, dụng cụ nên dễ dàng tháo lắp, di chuyển để làm sạch, tẩy trùng, giảm thiểu những mối nguy hại về vệ sinh, an toàn thực phẩm.
                  - paragraph [ref=f380e218]: + Cần có dụng cụ, đồ chứa đựng riêng cho thực phẩm sống và thực phẩm chín.
                  - paragraph [ref=f380e219]:
                    - emphasis [ref=f380e220]: Thứ ba
                    - text: ", vệ sinh khu vực chế biến và phụ trợ: sàn nhà, thoát nước, thùng rác,..."
                  - paragraph [ref=f380e221]: "+ Kết cấu của nơi chế biến: (1) Trần nhà phải đảm bảo kín, không dột thấm nước, không rạn nứt, tránh ẩm mốc; (2) Sàn nhà phải dễ cọ rửa, không trơn, dễ lau chùi, khử trùng và thoát nước tốt; (3) Cửa ra vào không thấm nước, đóng kín, thuận tiện cho việc làm vệ sinh, bảo đảm tránh côn trùng, động vật xâm nhập; (4) Cửa sổ phải dễ lau chùi, làm sạch; (5) Các bề mặt tiếp xúc trực tiếp với thực phẩm phải bền, dễ lau chùi, dễ bảo dưỡng và tẩy trùng, không bị bào mòn bởi các chất tẩy rửa, tẩy trùng trong điều kiện bình thường,..."
                  - paragraph [ref=f380e222]: "+ Đồ rửa và khử trùng tay: cần đặt ở những vị trí thuận tiện trong khu vực chế biến, nơi rửa tay phải cung cấp đầy đủ nước sạch, xà phòng, khăn lau tay sử dụng một lần hay máy sấy khô tay."
                  - paragraph [ref=f380e223]: "+ Dụng cụ, thiết bị thu gom rác thải: dụng cụ thu gom, chứa đựng rác thải, chất thải cần đảm bảo vệ sinh."
                  - paragraph [ref=f380e224]: + Phòng thay bảo hộ lao động tại cơ sở kinh doanh nhà hàng, bếp ăn tập thể cần có phòng thay riêng biệt cho nhân viên thay trang phục bảo hộ lao động.
                  - paragraph [ref=f380e225]: + Hệ thống cung cấp nước phải đảm bảo kín, không bị rõ rỉ, ống dẫn và phương tiện chứa đựng nước phải bằng chất liệu, vật liệu an toàn, không gây ô nhiễm cho nguồn nước.
                  - paragraph [ref=f380e226]: "+ Hệ thống nước và xử lý chất thải: cống rãnh ở khu vực cửa hàng, nhà bếp phải thông thoáng, không ứ đọng làm sinh sôi các mầm bệnh; hệ thống thoát nước và phương tiện đổ chất thảo cần phải thiết kế và bố trí hợp lý; dụng cụ thu gom chất thải, rác thải, dụng cụ làm bằng vật liệu ít bị hư hỏng, có nắp đậy;..."
                  - generic [ref=f380e227]: Quảng cáo
                  - paragraph [ref=f380e229]: + Nhà vệ sinh cần bố trí đủ cho nhân viên, vị trí nhà vệ sinh cần được bố trí sao cho cách biệt khu vực chế biến, nhà ăn và được trang bị đầy đủ thiết bị bảo đảm vệ sinh, có đủ nước sạch và đồ dùng rửa tay. Khu vực nhà vệ sinh phải đảm bảo đủ sáng, thông gió tốt, thoát nước dễ dàng,...
                  - paragraph [ref=f380e230]: "* Kiểm tra, đánh giá cảm quan món ăn, thành phẩm sau khi được chế biến xong:"
                  - paragraph [ref=f380e231]: Trong quá trình sơ chế, chế biến mà phát hiện nguyên liệu hay thức ăn có những biểu hiện khác lạ về màu sắc, mùi vị, hình dạng,.... thì cần tiến hành kiểm tra, đánh giá và loại bổ thực phẩm, thức ăn và ghi rõ biện pháp xử lý.
                  - paragraph [ref=f380e232]: "* Ghi chép đầy đủ ngày giờ bắt đầu và kết thúc chế biến của từng món ăn"
                  - paragraph [ref=f380e233]: "* Các thông tin kiểm tra trong quá trình chế biến thức ăn được ghi vào Mẫu số 2 Phụ lục 1 Mẫu biểu ghi chép kiểm tra ba bước ban hành kèm theo Quyết định số 1246/QĐ-BYT"
                  - paragraph [ref=f380e234]:
                    - strong [ref=f380e235]: "Bước 3: Kiểm tra trước khi ăn"
                  - paragraph [ref=f380e236]: "* Kiểm tra việc chia thức ăn, khu vực bày thức ăn"
                  - paragraph [ref=f380e237]: Sau khi đã chế biến thực phẩm xong thì sẽ được đưa đến phòng chia để phân chia, đóng gói thành phẩm. Cho nên phòng phân chia thực phẩn đã chế biến cũng cần phải được giữ sạch sẽ, diệt khuẩn để tránh ô nhiễm. Những dụng cụ gắp, chứa đựng thực phẩm đã chế biến phải hợp vệ sinh.
                  - paragraph [ref=f380e238]: "* Kiểm tra các món ăn đối chiếu với thực đơn"
                  - paragraph [ref=f380e239]: "* Kiểm tra vệ sinh bát, đĩa, dụng cụ ăn uống"
                  - paragraph [ref=f380e240]: "* Kiểm tra dụng cụ che đậy, trang thiết bị phương tiện bảo quản thức ăn đối với thực phẩm không ăn ngay hoặc vận chuyển đến một địa điểm khác."
                  - paragraph [ref=f380e241]: Bảo quản thức ăn giúp cho thức ăn không bị nhiễm bụi bẩn, hư hỏng, biến chất, không bị ô nhiễm bởi vi sinh vật, hóa chất hay những mỗi nguy hại khác trong một khoảng thời gian.
                  - paragraph [ref=f380e242]: Cơ sở sử dụng các trang thiết bị phương tiện bảo quản để điều chỉnh, duy trì các yêu cầu về nhiệt độ, độ ẩm và các yếu tố trong quá trình bảo quản thực phẩm nhằm đảm bảo chất lượng, an toàn thực phẩm. Nên các trang thiết bị phương tiện bảo quản thức ăn cần đảm bảo sạch sẽ và thường xuyên được kiểm tra, bảo dưỡng.
                  - generic [ref=f380e243]: Quảng cáo
                  - paragraph [ref=f380e245]: Thức ăn được bày bán phải được để trong tủ kính hoặc thiết bị bảo quản hợp vệ sinh, chống bụi bám, sự xâm nhập của côn trùng và động vật,....
                  - paragraph [ref=f380e246]: "* Các thông tin kiểm tra trước khi ăn được ghi vào Mẫu số 3 Phụ lục 1 Mẫu biểu ghi chép kiểm thực ba bước ban hành kèm theo Quyết định số 1246/QĐ-BYT."
                  - paragraph [ref=f380e247]
                  - heading "3. Hướng dẫn cách viết sổ kiểm thực" [level=2] [ref=f380e248]
                  - paragraph [ref=f380e249]: "Người ghi chép vào sổ kiểm thực cần điền đầy đủ thông tin:"
                  - paragraph [ref=f380e250]:
                    - strong [ref=f380e251]: "Mẫu số 1: Kiểm tra trước khi chế biến thức ăn"
                  - paragraph [ref=f380e252]: "Người ghi chép sẽ điền đầy đủ nội dung: tên cơ sở, tên người kiểm tra, thời gian kiểm vào ngày tháng năm nào, địa chỉ kiểm tra (tại cơ sở kinh doanh hay tại đơn vị cung cấp...)"
                  - paragraph [ref=f380e253]: Người ghi chép, người kiểm tra hàng nào là thực phẩm tươi sống, đông lạnh (thịt, cá, rau, củ, quả,....) và hàng nào là thực phẩm khô và thực phẩm bao gói sẵn, phụ gia thực phẩm.
                  - paragraph [ref=f380e254]: "Mục số I sẽ dành cho thực phẩm tươi sống, đông lạnh nên người ghi chép sẽ ghi đầy đủ những thông tin về loại thực phẩm đó, bao gồm: Tên thực phẩm; Thời gian nhập (ghi rõ ngày, giờ); Khối lượng (kg, g, lít,...); Nơi cung cấp thực phẩm (tên cơ sở, địa chỉ và số điện thoại, tên người giao hàng); Chứng từ, hóa đơn; Giấy đăng ký vệ sinh thú ý; Giấy kiểm dịch; Kiểm tra cảm quan về mùi vị, trạng thái, bảo quản,... (tích Đạt hoặc Không đạt); Xét nghiệm nhanh nếu có (tích Đạt hoặc Không đạt); Biện pháp xử lý/ Ghi chú."
                  - paragraph [ref=f380e255]: "Mục số 2 dành cho thực phẩm khô và thực phẩm bao gói sẵn, phụ gia thực phẩm sẽ ghi chép đầy đủ những thông tin về mặt hàng thực phẩm, bao gồm: Tên thực phẩm; Tên cơ sở sản xuất, Địa chỉ sản xuất; Thời gian nhập (ghi rõ ngày giờ); Khối lượng (kg, g, lít,...); Nơi cung cấp mặt hàng (điền đầy đủ tên cơ sở, tên chủ giao hàng, địa chỉ, điện thoại); Hạn sử dụng (ghi rõ ngày tháng năm); Điều kiện bảo quản (T°thường/ lạnh....); Chứng từ, hóa đơn; Kiểm tra cảm quan (nhãn, bao bì, bảo quản, hạn sử dụng (nếu đạt thì tích vào ô Đạt hay không đạt thì tích vào ô Không đạt), Biện pháp xử lý/ Ghi chú."
                  - generic [ref=f380e256]: Quảng cáo
                  - paragraph [ref=f380e258]:
                    - strong [ref=f380e259]: "Mẫu số 2: Kiểm tra khi chế biến thức ăn"
                  - paragraph [ref=f380e260]: "Người ghi chép sẽ ghi đầy đủ những thông tin về ca/ bữa ăn (bữa ăn, giờ ăn..): Ca/ bữa ăn; Tên món ăn; Nguyên liệu chính để chế biến (ghi tên của nguyên liệu chính, số lượng,...); Số lượng hoặc số suất ăn; Thời gian sơ chế xong (ngày, giờ); Thời gian chế biến xong (ngày, giờ); Kiểm tra điều kiện vệ sinh từ thời điểm bắt đầu sơ chế, chế biến cho đến khi thức ăn được chế biến xong (ghi rõ tên người tham gia chế biến, trang thiết bị dụng cụ, khu vực chế biến và phụ trợ); Kiểm tra cảm quan thức ăn (kiểm tra về màu, mùi vị, trạng thái, bảo quản,.... nếu đạt thì tích vào ô Đạt còn nếu không đạt thì tích vào ô Không đạt); Biện pháp xử lý/ Ghi chú."
                  - paragraph [ref=f380e261]:
                    - strong [ref=f380e262]: "Mẫu số 3: Kiểm tra trước khi ăn"
                  - paragraph [ref=f380e263]: "Người ghi chép điền đầy đủ thông tin về ca/ bữa ăn như sau: Ca/ bữa ăn; Tên món ăn; Số lượng suất ăn; Thời gian chia món ăn xong (ghi rõ ngày giờ); Thời gian bắt đầu ăn (ghi rõ ngày giờ); Dụng cụ chia, chứa đựng, che đậy, bảo quản thức ăn; Kiểm tra cảm quan món ăn về màu, mùi vị, trạng thái, bảo quản,.. (nếu đạt thì tích vào ô Đạt còn không đạt thì tích vào ô Không đạt); Biện pháp xử lý/ Ghi chú."
                  - paragraph [ref=f380e264]
                  - heading "4. Mẫu sổ kiểm thực ba bước mới nhất" [level=2] [ref=f380e265]
                  - paragraph [ref=f380e266]: Bạn đọc có thể tham khảo mẫu sổ kiểm thực ba bước được quy định tại Mẫu số 1, Mẫu số 2, Mẫu 3 Phụ lục 1 ban hành kèm theo Quyết định số 1246/QĐ - BYT về việc ban hành "hướng dẫn thực hiện chế độ kiểm thực ba bước và lưu mẫu thức ăn đối với cơ sở kinh doanh ăn uống.
                  - paragraph [ref=f380e267]
                  - heading "4.1. Mẫu biểu ghi chép kiểm thực trước khi chế biến thức ăn" [level=3] [ref=f380e268]
                  - paragraph [ref=f380e269]: Mẫu số 1 Phụ lục 1 ban hành kèm theo Quyết định số 1246/QĐ-BYT
