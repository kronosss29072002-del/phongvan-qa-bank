                  - heading "4.2. Mẫu biểu ghi chép kiểm thực khi chế biến thức ăn" [level=3] [ref=f380e271]
                  - paragraph [ref=f380e272]: Mẫu số 2 Phụ lục 1 ban hành kèm theo Quyết định số 1246/QĐ-BYT
                  - paragraph [ref=f380e273]
                  - heading "4.3. Mẫu biểu ghi chép kiểm thực trước khi ăn" [level=3] [ref=f380e274]
                  - paragraph [ref=f380e275]: Mẫu số 3 Phụ lục 1 ban hành kèm theo Quyết định số 1246/QĐ-BYT
