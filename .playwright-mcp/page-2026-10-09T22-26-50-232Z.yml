  - contentinfo [ref=e12375]:
    - generic [ref=e12376]: "Nguồn: playlist phỏng vấn thử IT (kênh Việt Trí Đạo). Câu trả lời là bản viết lại từ chính buổi phỏng vấn, bao gồm cả phần phỏng vấn viên nhận xét và sửa — dùng để luyện tập, không phải đáp án chính thức. Nội dung gốc là tiếng nói tự động (ASR) nên có thể còn sai sót từ ngữ."