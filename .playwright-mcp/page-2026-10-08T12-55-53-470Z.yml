      - paragraph [ref=f60e522]: These buckets provide sufficient fidelity for protecting user happiness, but entail less toil than a system that is more complicated and expensive to manage that probably maps more precisely to the user experience.
      - heading "Conclusion" [level=1] [ref=f60e523]
      - paragraph [ref=f60e524]: If you set SLOs that are meaningful, understood, and represented in metrics, you can configure alerting to notify an on-caller only when there are actionable, specific threats to the error budget.
      - paragraph [ref=f60e525]: The techniques for alerting on significant events range from alerting when your error rate goes above your SLO threshold to using multiple levels of burn rate and window sizes. In most cases, we believe that the multiwindow, multi-burn-rate alerting technique is the most appropriate approach to defending your application’s SLOs.
      - paragraph [ref=f60e526]: We hope we have given you the context and tools required to make the right configuration decisions for your own application and organization.
      - generic [ref=f60e527]:
        - paragraph [ref=f60e528]:
          - superscript [ref=f60e529]:
            - link "1" [ref=f60e530] [cursor=pointer]:
              - /url: "#ch05fn1-marker"
          - text: Duration clauses can occasionally be useful when you are filtering out ephemeral noise over very short durations. However, you still need to be aware of the cons listed in this section.
        - paragraph [ref=f60e531]:
          - superscript [ref=f60e532]:
            - link "2" [ref=f60e533] [cursor=pointer]:
              - /url: "#ch05fn2-marker"
          - text: As described in the
          - link "introduction" [ref=f60e534] [cursor=pointer]:
            - /url: /sre-book/introduction/
          - text: to Site Reliability Engineering, pages and tickets are the only valid ways to get a human to take action.
        - paragraph [ref=f60e535]:
          - superscript [ref=f60e536]:
            - link "3" [ref=f60e537] [cursor=pointer]:
              - /url: "#ch05fn3-marker"
          - text: The section
          - 'link "What to Measure: Using SLIs" [ref=f60e538] [cursor=pointer]':
            - /url: /workbook/implementing-slos#what-to-measure-using-slis
          - text: recommends a style of SLI that scales according to the impact on the user.
        - paragraph [ref=f60e539]:
          - superscript [ref=f60e540]:
            - link "4" [ref=f60e541] [cursor=pointer]:
              - /url: "#ch05fn4-marker"
          - text: See
          - link "“Overloads and Failure”" [ref=f60e542] [cursor=pointer]:
            - /url: /sre-book/service-best-practices#id-AnCKIZFpUej
          - text: in Site Reliability Engineering.
        - paragraph [ref=f60e543]:
          - superscript [ref=f60e544]:
            - link "5" [ref=f60e545] [cursor=pointer]:
              - /url: "#ch05fn5-marker"
          - text: With the exception of temporary changes to alerting parameters, which are necessary when you’re fixing an ongoing outage and you don’t need to receive notifications during that period.
