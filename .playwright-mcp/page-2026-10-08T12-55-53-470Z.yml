          - /url: "#error-rate-is-too-high-over-a-larger-window"
        - text: shows the benefits and disadvantages of alerting when the error rate is too high over a larger window of time.
      - table [ref=f60e102]:
        - caption [ref=f60e103]: Table 5-2.Pros and cons of alerting when the error rate is too high over a larger window of time
        - rowgroup [ref=f60e104]:
          - row [ref=f60e105]:
            - columnheader "Pros" [ref=f60e106]
            - columnheader "Cons" [ref=f60e107]
        - rowgroup [ref=f60e108]:
          - row [ref=f60e109]:
            - cell [ref=f60e110]:
              - paragraph [ref=f60e111]: "Detection time is still good: 2 minutes and 10 seconds for a complete outage."
              - paragraph [ref=f60e112]: "Better precision than the previous example: by ensuring that the error rate is sustained for longer, an alert will likely represent a significant threat to the error budget."
            - cell [ref=f60e113]:
              - paragraph [ref=f60e114]: "Very poor reset time: In the case of 100% outage, an alert will fire shortly after 2 minutes, and continue to fire for the next 36 hours."
              - paragraph [ref=f60e115]: Calculating rates over longer windows can be expensive in terms of memory or I/O operations, due to the large number of data points.
      - paragraph [ref=f60e116]:
