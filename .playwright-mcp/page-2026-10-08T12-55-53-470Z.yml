      - paragraph [ref=f60e197]: By keeping the alert window fixed at one hour and deciding that a 5% error budget spend is significant enough to notify someone, you can derive the burn rate to use for the alert.
      - paragraph [ref=f60e198]: "For burn rate–based alerts, the time taken for an alert to fire is:"
