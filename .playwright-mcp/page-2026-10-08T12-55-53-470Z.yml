      - 'heading "3: Incrementing Alert Duration" [level=5] [ref=f60e121]'
      - paragraph [ref=f60e122]: "Most monitoring systems allow you to add a duration parameter to the alert criteria so the alert won’t fire unless the value remains above the threshold for some time. You may be tempted to use this parameter as a relatively inexpensive way to add longer windows:"
      - generic [ref=f60e123]: "- alert: HighErrorRate expr: job:slo_errors_per_request:ratio_rate1m{job=\"myjob\"} > 0.001 for: 1h"
      - paragraph [ref=f60e124]:
        - link "Table 5-3" [ref=f60e125] [cursor=pointer]:
          - /url: "#benefits-and-disadvantages-of-using-a-duration"
        - text: shows the benefits and disadvantages of using a duration parameter for alerts.
      - table [ref=f60e126]:
        - caption [ref=f60e127]: Table 5-3.Pros and cons of using a duration parameter for alerts
        - rowgroup [ref=f60e128]:
          - row [ref=f60e129]:
            - columnheader "Pros" [ref=f60e130]
            - columnheader "Cons" [ref=f60e131]
        - rowgroup [ref=f60e132]:
          - row [ref=f60e133]:
            - cell [ref=f60e134]:
              - paragraph [ref=f60e135]: Alerts can be higher precision. Requiring a sustained error rate before firing means that alerts are more likely to correspond to a significant event.
            - cell [ref=f60e136]:
              - paragraph [ref=f60e137]:
                - text: "Poor recall and poor detection time: Because the duration does not scale with the severity of the incident, a"
                - link "100% outage alerts" [ref=f60e138] [cursor=pointer]:
                  - /url: /workbook/error-budget-policy/
                - text: after one hour, the same detection time as a 0.2% outage. The 100% outage would consume 140% of the 30-day budget in that hour.
              - paragraph [ref=f60e139]: If the metric even momentarily returns to a level within SLO, the duration timer resets. An SLI that fluctuates between missing SLO and passing SLO may never alert.
      - paragraph [ref=f60e140]:
        - text: For the reasons listed in
        - link "Table 5-3" [ref=f60e141] [cursor=pointer]:
          - /url: "#benefits-and-disadvantages-of-using-a-duration"
        - text: ", we do not recommend using durations as part of your SLO-based alerting criteria."
        - superscript [ref=f60e142]:
          - link "1" [ref=f60e143] [cursor=pointer]:
            - /url: "#ch05fn1"
      - paragraph [ref=f60e144]:
        - link "Figure 5-3" [ref=f60e145] [cursor=pointer]:
          - /url: "#service_with_100percent_error_spikes_ever"
        - text: shows the average error rate over a 5-minute window of a service with a 10-minute duration before the alert fires. A series of 100% error spikes lasting 5 minutes every 10 minutes never triggers an alert, despite consuming 35% of the error budget.
      - figure "Figure 5-3. A service with 100% error spikes every 10 minutes" [ref=f60e146]:
        - img "service_with_100percent_error_spikes_ever" [ref=f60e147]
      - paragraph [ref=f60e149]: Each spike consumed almost 12% of the 30-day budget, yet the alert never triggered.
      - 'heading "4: Alert on Burn Rate" [level=5] [ref=f60e150]'
      - paragraph [ref=f60e151]: To improve upon the previous solution, you want to create an alert with good detection time and high precision. To this end, you can introduce a burn rate to reduce the size of the window while keeping the alert budget spend constant.
      - paragraph [ref=f60e152]:
        - text: Burn rate is how fast, relative to the SLO, the service consumes the error budget.
        - link "Figure 5-4" [ref=f60e153] [cursor=pointer]:
          - /url: "#error_budgets_relative_to_burn_rates"
        - text: shows the relationship between burn rates and error budgets.
      - paragraph [ref=f60e154]:
        - text: The example service uses a burn rate of 1, which means that it’s consuming error budget at a rate that leaves you with exactly 0 budget at the end of the SLO’s time window (see
        - link "Chapter 4" [ref=f60e155] [cursor=pointer]:
          - /url: /sre-book/service-level-objectives/
        - text: "in our first book). With an SLO of 99.9% over a time window of 30 days, a constant 0.1% error rate uses exactly all of the error budget: a burn rate of 1."
      - figure "Figure 5-4. Error budgets relative to burn rates" [ref=f60e156]:
        - img "error_budgets_relative_to_burn_rates" [ref=f60e157]
      - paragraph [ref=f60e159]:
        - link "Table 5-4" [ref=f60e160] [cursor=pointer]:
          - /url: "#burn_rates_and_time_to_complete_budget_ex"
        - text: shows burn rates, their corresponding error rates, and the time it takes to exhaust the SLO budget.
