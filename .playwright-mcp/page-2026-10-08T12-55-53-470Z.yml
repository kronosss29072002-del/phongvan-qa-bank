          - /url: "#detection-time"
        - text: shows the relationship between detection time and error rate for an example service with an alert window of 10 minutes and a 99.9% SLO.
      - figure "Figure 5-1. Detection time for an example service with an alert window of 10 minutes and a 99.9% SLO" [ref=f60e63]:
        - img "detection-time" [ref=f60e64]
