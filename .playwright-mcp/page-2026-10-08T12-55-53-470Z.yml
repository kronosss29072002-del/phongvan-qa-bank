    - heading "Chapter 5 - Alerting on SLOs" [level=2] [ref=f60e7]
  - main [ref=f60e8]:
    - generic [ref=f60e9]:
      - heading "Alerting on SLOs" [level=1] [ref=f60e10]
      - paragraph [ref=f60e11]: By Steven Thurgoodwith Jess Frame, Anthony Lenton,Carmela Quinito, Anton Tolchanov, and Nejc Trdin
      - paragraph [ref=f60e12]:
        - text: This chapter explains how to turn your SLOs into actionable alerts on significant events. Both our
        - link "first SRE book" [ref=f60e13] [cursor=pointer]:
          - /url: /sre-book/table-of-contents/
        - text: and this book talk about implementing SLOs. We believe that having good SLOs that measure the reliability of your platform, as experienced by your customers, provides the highest-quality indication for when an on-call engineer should respond. Here we give specific guidance on how to turn those SLOs into alerting rules so that you can respond to problems before you consume too much of your error budget.
      - paragraph [ref=f60e14]:
        - text: Our examples present a series of increasingly complex implementations for alerting metrics and logic; we discuss the utility and shortcomings of each. While our examples use a simple request-driven service and
        - link "Prometheus syntax" [ref=f60e15] [cursor=pointer]:
          - /url: https://prometheus.io/
        - text: ", you can apply this approach in any alerting framework."
      - heading "Alerting Considerations" [level=2] [ref=f60e16]
      - paragraph [ref=f60e17]:
        - text: In order to generate alerts from service level indicators (SLIs) and an
        - link "error budget," [ref=f60e18] [cursor=pointer]:
          - /url: /workbook/implementing-slos/
        - text: "you need a way to combine these two elements into a specific rule. Your goal is to be notified for a significant event: an event that consumes a large fraction of the error budget."
      - paragraph [ref=f60e19]: "Consider the following attributes when evaluating an alerting strategy:"
      - paragraph [ref=f60e20]: Precision
      - list [ref=f60e21]:
        - listitem [ref=f60e22]:
          - text: The proportion of events detected that were significant. Precision is 100% if every alert corresponds to a significant event. Note that alerting can become particularly sensitive to nonsignificant events during low-traffic periods (discussed in
          - link "Low-Traffic Services and Error Budget Alerting" [ref=f60e23] [cursor=pointer]:
            - /url: "#low-traffic-services-and-error-budget-alerting"
          - text: ).
      - paragraph [ref=f60e24]: Recall
      - list [ref=f60e25]:
        - listitem [ref=f60e26]: The proportion of significant events detected. Recall is 100% if every significant event results in an alert.
      - paragraph [ref=f60e27]: Detection time
      - list [ref=f60e28]:
        - listitem [ref=f60e29]: How long it takes to send notifications in various conditions. Long detection times can negatively impact the error budget.
      - paragraph [ref=f60e30]: Reset time
      - list [ref=f60e31]:
        - listitem [ref=f60e32]: How long alerts fire after an issue is resolved. Long reset times can lead to confusion or to issues being ignored.
      - heading "Ways to Alert on Significant Events" [level=1] [ref=f60e33]
      - paragraph [ref=f60e34]:
        - text: Constructing alert
        - link "rules for your SLOs" [ref=f60e35] [cursor=pointer]:
          - /url: /sre-book/service-level-objectives/
        - text: can become quite complex. Here we present six ways to configure alerting on significant events, in order of increasing fidelity, to arrive at an option that offers good control over the four parameters of precision, recall, detection time, and reset time simultaneously. Each of the following approaches addresses a different problem, and some eventually solve multiple problems at the same time. The first three nonviable attempts work toward the latter three viable alerting strategies, with approach 6 being the most viable and most highly recommended option. The first method is simple to implement but inadequate, while the optimal method provides a complete solution to defend an SLO over both the long and the short term.
      - paragraph [ref=f60e36]:
        - text: For the purposes of this discussion, “error budgets” and “error rates” apply to all SLIs, not just those with “error” in their name. In the section
        - 'link "What to Measure: Using SLIs" [ref=f60e37] [cursor=pointer]':
          - /url: /workbook/implementing-slos#what-to-measure-using-slis
        - text: ", we recommend using SLIs that capture the ratio of good events to total events. The error budget gives the number of allowed bad events, and the error rate is the ratio of bad events to total events."
      - 'heading "1: Target Error Rate ≥ SLO Threshold" [level=5] [ref=f60e38]'
      - paragraph [ref=f60e39]: For the most trivial solution, you can choose a small time window (for example, 10 minutes) and alert if the error rate over that window exceeds the SLO.
      - paragraph [ref=f60e40]: "For example, if the SLO is 99.9% over 30 days, alert if the error rate over the previous 10 minutes is ≥ 0.1%:"
      - generic [ref=f60e41]: "- alert: HighErrorRate expr: job:slo_errors_per_request:ratio_rate10m{job=\"myjob\"} >= 0.001"
      - complementary [ref=f60e42]:
        - heading "Note" [level=6] [ref=f60e43]
        - paragraph [ref=f60e44]: "This 10-minute average is calculated in Prometheus with a Recording rule:"
        - generic [ref=f60e45]: "record: job:slo_errors_per_request:ratio_rate10m expr: sum(rate(slo_errors[10m])) by (job) / sum(rate(slo_requests[10m])) by (job)"
        - paragraph [ref=f60e46]:
          - text: If you don’t export
          - code [ref=f60e47]: slo_errors
          - text: and
          - code [ref=f60e48]: slo_requests
          - text: "from your job, you can create the time series by renaming a metric:"
        - generic [ref=f60e49]: "record: slo_errors expr: http_errors"
      - paragraph [ref=f60e50]: "Alerting when the recent error rate is equal to the SLO means that the system detects a budget spend of:"
      - paragraph
