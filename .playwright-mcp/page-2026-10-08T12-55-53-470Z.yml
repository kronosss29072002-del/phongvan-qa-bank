      - figure "Figure 5-5. Error rate, detection time, and alert notification" [ref=f60e289]:
        - img "recommended_time_windows_and_burn_rates_f" [ref=f60e290]
      - paragraph [ref=f60e292]:
        - text: Multiple burn rates allow you to adjust the alert to give appropriate priority based on how quickly you have to respond. If an issue will exhaust the error budget within hours or a few days, sending an active notification is appropriate. Otherwise, a ticket-based notification to address the alert the next working day is more appropriate.
        - superscript [ref=f60e293]:
          - link "2" [ref=f60e294] [cursor=pointer]:
            - /url: "#ch05fn2"
      - paragraph [ref=f60e295]:
        - link "Table 5-7" [ref=f60e296] [cursor=pointer]:
          - /url: "#pros_and_cons_of_using_multiple_burn_rate"
        - text: lists the benefits and disadvantages of using multiple burn rates.
      - table [ref=f60e297]:
        - caption [ref=f60e298]: Table 5-7.Pros and cons of using multiple burn rates
        - rowgroup [ref=f60e299]:
          - row [ref=f60e300]:
            - columnheader "Pros" [ref=f60e301]
            - columnheader "Cons" [ref=f60e302]
        - rowgroup [ref=f60e303]:
          - row [ref=f60e304]:
            - cell [ref=f60e305]:
              - paragraph [ref=f60e306]: "Ability to adapt the monitoring configuration to many situations according to criticality: alert quickly if the error rate is high; alert eventually if the error rate is low but sustained."
              - paragraph [ref=f60e307]: Good precision, as with all fixed-budget portion alert approaches.
              - paragraph [ref=f60e308]: Good recall, because of the three-day window.
              - paragraph [ref=f60e309]: Ability to choose the most appropriate alert type based upon how quickly someone has to react to defend the SLO.
            - cell [ref=f60e310]:
              - paragraph [ref=f60e311]: More numbers, window sizes, and thresholds to manage and reason about.
              - paragraph [ref=f60e312]: An even longer reset time, as a result of the three-day window.
              - paragraph [ref=f60e313]: "To avoid multiple alerts from firing if all conditions are true, you need to implement alert suppression. For example: 10% budget spend in five minutes also means that 5% of the budget was spent in six hours, and 2% of the budget was spent in one hour. This scenario will trigger three notifications unless the monitoring system is smart enough to prevent it from doing so."
      - 'heading "6: Multiwindow, Multi-Burn-Rate Alerts" [level=5] [ref=f60e314]'
      - paragraph [ref=f60e315]: "We can enhance the multi-burn-rate alerts in iteration 5 to notify us only when we’re still actively burning through the budget—thereby reducing the number of false positives. To do this, we need to add another parameter: a shorter window to check if the error budget is still being consumed as we trigger the alert."
      - paragraph [ref=f60e316]:
        - text: A good guideline is to make the short window 1/12 the duration of the long window, as shown in
        - link "Figure 5-6" [ref=f60e317] [cursor=pointer]:
          - /url: "#short_and_long_windows_for_alerting"
        - text: . The graph shows both alerting threshold. After experiencing 15% errors for 10 minutes, the short window average goes over the alerting threshold immediately, and the long window average goes over the threshold after 5 minutes, at which point the alert starts firing. The short window average drops below the threshold 5 minutes after the errors stop, at which point the alert stops firing. The long window average drops below the threshold 60 minutes after the errors stop.
      - figure "Figure 5-6. Short and long windows for alerting" [ref=f60e318]:
        - img "short_and_long_windows_for_alerting" [ref=f60e319]
      - paragraph [ref=f60e321]: "For example, you can send a page-level alert when you exceed the 14.4x burn rate over both the previous one hour and the previous five minutes. This alert fires only once you’ve consumed 2% of the budget, but exhibits a better reset time by ceasing to fire five minutes later, rather than one hour later:"
      - generic [ref=f60e322]: "expr: ( job:slo_errors_per_request:ratio_rate1h{job=\"myjob\"} > (14.4*0.001) and job:slo_errors_per_request:ratio_rate5m{job=\"myjob\"} > (14.4*0.001) ) or ( job:slo_errors_per_request:ratio_rate6h{job=\"myjob\"} > (6*0.001) and job:slo_errors_per_request:ratio_rate30m{job=\"myjob\"} > (6*0.001) ) severity: page expr: ( job:slo_errors_per_request:ratio_rate24h{job=\"myjob\"} > (3*0.001) and job:slo_errors_per_request:ratio_rate2h{job=\"myjob\"} > (3*0.001) ) or ( job:slo_errors_per_request:ratio_rate3d{job=\"myjob\"} > 0.001 and job:slo_errors_per_request:ratio_rate6h{job=\"myjob\"} > 0.001 ) severity: ticket"
      - paragraph [ref=f60e323]:
        - text: We recommend the parameters listed in
        - link "Table 5-8" [ref=f60e324] [cursor=pointer]:
          - /url: "#recommended_parameters_for_an_slo_based_a"
        - text: as the starting point for your SLO-based alerting configuration.
