              - paragraph [ref=f60e77]: "Detection time is good: 0.6 seconds for a total outage."
              - paragraph [ref=f60e78]: This alert fires on any event that threatens the SLO, exhibiting good recall.
            - cell [ref=f60e79]:
              - paragraph [ref=f60e80]: "Precision is low: The alert fires on many events that do not threaten the SLO. A 0.1% error rate for 10 minutes would alert, while consuming only 0.02% of the monthly error budget."
              - paragraph [ref=f60e81]: Taking this example to an extreme, you could receive up to 144 alerts per day every day, not act upon any alerts, and still meet the SLO.
      - 'heading "2: Increased Alert Window" [level=5] [ref=f60e82]'
      - paragraph [ref=f60e83]: We can build upon the preceding example by changing the size of the alert window to improve precision. By increasing the window size, you spend a higher budget amount before triggering an alert.
      - paragraph [ref=f60e84]:
        - text: To keep the
        - link "rate of alerts manageable" [ref=f60e85] [cursor=pointer]:
          - /url: /sre-book/dealing-with-interrupts/
        - text: ", you decide to be notified only if an event consumes 5% of the 30-day error budget—a 36-hour window:"
      - generic [ref=f60e86]: "- alert: HighErrorRate expr: job:slo_errors_per_request:ratio_rate36h{job=\"myjob\"} > 0.001"
      - paragraph [ref=f60e87]: "Now, the detection time is:"
      - paragraph
      - generic [ref=f60e93]:
