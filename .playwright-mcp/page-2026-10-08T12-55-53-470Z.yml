      - paragraph [ref=f60e368]: We have found that alerting based on multiple burn rates is a powerful way to implement SLO-based alerting.
      - paragraph [ref=f60e369]:
        - link "Table 5-9" [ref=f60e370] [cursor=pointer]:
          - /url: "#pros_and_cons_of_using_multiple_b-id00013"
        - text: shows the benefits and limitations of using multiple burn rates and window sizes.
      - table [ref=f60e371]:
        - caption [ref=f60e372]: Table 5-9.Pros and cons of using multiple burn rates and window sizes
        - rowgroup [ref=f60e373]:
          - row [ref=f60e374]:
            - columnheader "Pros" [ref=f60e375]
            - columnheader "Cons" [ref=f60e376]
        - rowgroup [ref=f60e377]:
          - row [ref=f60e378]:
            - cell [ref=f60e379]:
              - paragraph [ref=f60e380]: A flexible alerting framework that allows you to control the type of alert according to the severity of the incident and the requirements of the organization.
              - paragraph [ref=f60e381]: Good precision, as with all fixed-budget portion alert approaches.
              - paragraph [ref=f60e382]: Good recall, because of the three-day window.
            - cell [ref=f60e383]:
              - paragraph [ref=f60e384]:
                - text: Lots of parameters to specify, which can make alerting rules hard to manage. For more on managing alerting rules, see
                - link "Alerting at Scale" [ref=f60e385] [cursor=pointer]:
                  - /url: "#alerting_at_scale"
                - text: .
      - heading "Low-Traffic Services and Error Budget Alerting" [level=1] [ref=f60e386]
      - paragraph [ref=f60e387]: The multiwindow, multi-burn-rate approach just detailed works well when a sufficiently high rate of incoming requests provides a meaningful signal when an issue arises. However, these approaches can cause problems for systems that receive a low rate of requests. If a system has either a low number of users or natural low-traffic periods (such as nights and weekends), you may need to alter your approach.
      - paragraph [ref=f60e388]: It’s harder to automatically distinguish unimportant events in low-traffic services. For example, if a system receives 10 requests per hour, then a single failed request results in an hourly error rate of 10%. For a 99.9% SLO, this request constitutes a 1,000x burn rate and would page immediately, as it consumed 13.9% of the 30-day error budget. This scenario allows for only seven failed requests in 30 days. Single requests can fail for a large number of ephemeral and uninteresting reasons that aren’t necessarily cost-effective to solve in the same way as large systematic outages.
      - paragraph [ref=f60e389]:
        - text: "The best solution depends on the nature of the service: what is the impact"
        - superscript [ref=f60e390]:
          - link "3" [ref=f60e391] [cursor=pointer]:
            - /url: "#ch05fn3"
        - text: of a single failed request? A high-availability target may be appropriate if failed requests are one-off, high-value requests that aren’t retried. It may make sense from a business perspective to investigate every single failed request. However, in this case, the alerting system notifies you of an error too late.
      - paragraph [ref=f60e392]: "We recommend a few key options to handle a low-traffic service:"
      - list [ref=f60e393]:
        - listitem [ref=f60e394]: Generate artificial traffic to compensate for the lack of signal from real users.
        - listitem [ref=f60e395]: Combine smaller services into a larger service for monitoring purposes.
        - listitem [ref=f60e396]: "Modify the product so that either:"
        - list [ref=f60e397]:
          - listitem [ref=f60e398]: It takes more requests to qualify a single incident as a failure.
          - listitem [ref=f60e399]: The impact of a single failure is lower.
      - heading "Generating Artificial Traffic" [level=5] [ref=f60e400]
      - paragraph [ref=f60e401]: A system can synthesize user activity to check for potential errors and high-latency requests. In the absence of real users, your monitoring system can detect synthetic errors and requests, so your on-call engineers can respond to issues before they impact too many actual users.
      - paragraph [ref=f60e402]: Artificial traffic provides more signals to work with, and allows you to reuse your existing monitoring logic and SLO values. You may even already have most of the necessary traffic-generating components, such as black-box probers and integration tests.
      - paragraph [ref=f60e403]: Generating artificial load does have some downsides. Most services that warrant SRE support are complex, and have a large system control surface. Ideally, the system should be designed and built for monitoring using artificial traffic. Even for a nontrivial service, you can synthesize only a small portion of the total number of user request types. For a stateful service, the greater number of states exacerbates this problem.
      - paragraph [ref=f60e404]: Additionally, if an issue affects real users but doesn’t affect artificial traffic, the successful artificial requests hide the real user signal, so you aren’t notified that users see errors.
      - heading "Combining Services" [level=5] [ref=f60e405]
      - paragraph [ref=f60e406]: If multiple low-traffic services contribute to one overall function, combining their requests into a single higher-level group can detect significant events more precisely and with fewer false positives. For this approach to work, the services must be related in some way—you can combine microservices that form part of the same product, or multiple request types handled by the same binary.
      - paragraph [ref=f60e407]: A downside to combining services is that a complete failure of an individual service may not count as a significant event. You can increase the likelihood that a failure will affect the group as a whole by choosing services with a shared failure domain, such as a common backend database. You can still use longer-period alerts that eventually catch these 100% failures for individual services.
      - heading "Making Service and Infrastructure Changes" [level=5] [ref=f60e408]
      - paragraph [ref=f60e409]: "Alerting on significant events aims to provide sufficient notice to mitigate problems before they exhaust the entire error budget. If you can’t adjust the monitoring to be less sensitive to ephemeral events, and generating synthetic traffic is impractical, you might instead consider changing the service to reduce the user impact of a single failed request. For example, you might:"
      - list [ref=f60e410]:
        - listitem [ref=f60e411]:
          - text: Modify the client to retry, with exponential backoff and jitter.
          - superscript [ref=f60e412]:
            - link "4" [ref=f60e413] [cursor=pointer]:
              - /url: "#ch05fn4"
        - listitem [ref=f60e414]: Set up fallback paths that capture the request for eventual execution, which can take place on the server or on the client.
      - paragraph [ref=f60e415]: "These changes are useful for high-traffic systems, but even more so for low-traffic systems: they allow for more failed events in the error budget, more signal from monitoring, and more time to respond to an incident before it becomes significant."
      - heading "Lowering the SLO or Increasing the Window" [level=5] [ref=f60e416]
      - paragraph [ref=f60e417]: You might also want to reconsider if the impact of a single failure on the error budget accurately reflects its impact on users. If a small number of errors causes you to lose error budget, do you really need to page an engineer to fix the issue immediately? If not, users would be equally happy with a lower SLO. With a lower SLO, an engineer is notified only of a larger sustained outage.
      - paragraph [ref=f60e418]: "Once you have negotiated lowering the SLO with the service’s stakeholders (for example, lowering the SLO from 99.9% to 99%), implementing the change is very simple: if you already have systems in place for reporting, monitoring, and alerting based upon an SLO threshold, simply add the new SLO value to the relevant systems."
      - paragraph [ref=f60e419]: "Lowering the SLO does have a downside: it involves a product decision. Changing the SLO affects other aspects of the system, such as expectations around system behavior and when to enact the error budget policy. These other requirements may be more important to the product than avoiding some number of low-signal alerts."
      - paragraph [ref=f60e420]: In a similar manner, increasing the time window used for the alerting logic ensures alerts that trigger pages are more significant and worthy of attention.
      - paragraph [ref=f60e421]: "In practice, we use some combination of the following methods to alert for low-traffic services:"
      - list [ref=f60e422]:
        - listitem [ref=f60e423]: Generating fake traffic, when doing so is possible and can achieve good coverage
        - listitem [ref=f60e424]: Modifying clients so that ephemeral failures are less likely to cause user harm
        - listitem [ref=f60e425]: Aggregating smaller services that share some failure mode
        - listitem [ref=f60e426]: Setting SLO thresholds commensurate with the actual impact of a failed request
      - heading "Extreme Availability Goals" [level=1] [ref=f60e427]
      - paragraph [ref=f60e428]:
        - text: Services with an extremely low or an extremely high availability goal may require special consideration. For example, consider a service that has a 90% availability target.
        - link "Table 5-8" [ref=f60e429] [cursor=pointer]:
          - /url: "#recommended_parameters_for_an_slo_based_a"
        - text: says to page when 2% of the error budget in a single hour is consumed. Because a 100% outage consumes only 1.4% of the budget in that hour, this alert could never fire. If your error budgets are set over long time periods, you may need to tune your alerting parameters.
      - paragraph [ref=f60e430]: For services with an extremely high availability goal, the time to exhaustion for a 100% outage is extremely small. A 100% outage for a service with a target monthly availability of 99.999% would exhaust its budget in 26 seconds—which is smaller than the metric collection interval of many monitoring services, let alone the end-to-end time to generate an alert and pass it through notification systems like email and SMS. Even if the alert goes straight to an automated resolution system, the issue may entirely consume the error budget before you can mitigate it.
      - paragraph [ref=f60e431]:
        - text: Receiving notifications that you have only 26 seconds of budget left isn’t necessarily a bad strategy; it’s just not useful for defending the SLO. The only way to defend this level of reliability is to design the system so that the chance of a 100% outage is extremely low. That way, you can fix issues before consuming the budget. For example, if you initially roll out that change to only 1% of your users, and burn your error budget at the same rate of 1%, you now have 43 minutes before you exhaust your error budget. See
        - link "Canarying Releases" [ref=f60e432] [cursor=pointer]:
          - /url: /workbook/canarying-releases/
        - text: for tactics on designing such a system.
      - heading "Alerting at Scale" [level=1] [ref=f60e433]
      - paragraph [ref=f60e434]: When you scale your service, make sure that your alerting strategy is likewise scalable. You might be tempted to specify custom alerting parameters for individual services. If your service comprises 100 microservices (or equivalently, a single service with 100 different request types), this scenario very quickly accumulates toil and cognitive load that does not scale.
      - paragraph [ref=f60e435]:
        - text: In this case, we strongly advise against specifying the alert window and burn rate parameters independently for each service, because doing so quickly becomes overwhelming.
        - superscript [ref=f60e436]:
          - link "5" [ref=f60e437] [cursor=pointer]:
            - /url: "#ch05fn5"
        - text: Once you decide on your alerting parameters, apply them to all your services.
      - paragraph [ref=f60e438]: "One technique for managing a large number of SLOs is to group request types into buckets of approximately similar availability requirements. For example, for a service with availability and latency SLOs, you can group its request types into the following buckets:"
      - paragraph [ref=f60e439]:
        - code [ref=f60e440]: CRITICAL
      - list [ref=f60e441]:
        - listitem [ref=f60e442]: For request types that are the most important, such as a request when a user logs in to the service.
      - paragraph [ref=f60e443]:
        - code [ref=f60e444]: HIGH_FAST
      - list [ref=f60e445]:
        - listitem [ref=f60e446]: For requests with high availability and low latency requirements. These requests involve core interactive functionality, such as when a user clicks a button to see how much money their advertising inventory has made this month.
      - paragraph [ref=f60e447]:
        - code [ref=f60e448]: HIGH_SLOW
      - list [ref=f60e449]:
        - listitem [ref=f60e450]: For important but less latency-sensitive functionality, such as when a user clicks a button to generate a report of all advertising campaigns over the past few years, and does not expect the data to return instantly.
      - paragraph [ref=f60e451]:
        - code [ref=f60e452]: LOW
      - list [ref=f60e453]:
        - listitem [ref=f60e454]: For requests that must have some availability, but for which outages are mostly invisible to users—for example, polling handlers for account notifications that can fail for long periods of time with no user impact.
      - paragraph [ref=f60e455]:
        - code [ref=f60e456]: NO_SLO
      - list [ref=f60e457]:
        - listitem [ref=f60e458]: For functionality that is completely invisible to the user—for example, dark launches or alpha functionality that is explicitly outside of any SLO.
      - paragraph [ref=f60e459]:
        - text: By grouping requests rather than placing unique availability and latency objectives on all request types, you can group requests into five buckets, like the example in
        - link "Table 5-10" [ref=f60e460] [cursor=pointer]:
          - /url: "#request_class_buckets_according_to_simila"
        - text: .
      - table [ref=f60e461]:
