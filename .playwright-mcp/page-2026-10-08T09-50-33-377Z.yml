  - main [ref=f1e40]:
    - article [ref=f1e41]:
      - heading [level=1] [ref=f1e42]:
        - link "Parallel Change" [ref=f1e43] [cursor=pointer]:
          - /url: ParallelChange.html
      - paragraph [ref=f1e44]: 13 May 2014
      - generic [ref=f1e45]:
        - generic [ref=f1e46]:
          - paragraph [ref=f1e47]:
            - link [ref=f1e48] [cursor=pointer]:
              - /url: http://www.dtsato.com/
              - img "Photo of Danilo Sato" [ref=f1e49]
          - paragraph [ref=f1e50]:
            - link "Danilo Sato" [ref=f1e51] [cursor=pointer]:
              - /url: http://www.dtsato.com/
        - generic [ref=f1e52]:
          - paragraph [ref=f1e53]:
            - text: 
            - link "evolutionary design" [ref=f1e54] [cursor=pointer]:
              - /url: /tags/evolutionary%20design.html
          - paragraph [ref=f1e55]:
            - text: 
            - link "API design" [ref=f1e56] [cursor=pointer]:
              - /url: /tags/API%20design.html
          - paragraph [ref=f1e57]:
            - text: 
            - link "refactoring" [ref=f1e58] [cursor=pointer]:
              - /url: /tags/refactoring.html
      - generic [ref=f1e59]:
        - paragraph [ref=f1e60]:
          - text: "Making a change to an interface that impacts all its consumers requires two thinking modes: implementing the change itself, and then updating all its usages. This can be hard when you try to do both at the same time, especially if the change is on a"
          - link "PublishedInterface" [ref=f1e61] [cursor=pointer]:
            - /url: /bliki/PublishedInterface.html
          - text: with multiple or external clients.
        - paragraph [ref=f1e62]: "Parallel change, also known as expand and contract, is a pattern to implement backward-incompatible changes to an interface in a safe manner, by breaking the change into three distinct phases: expand, migrate, and contract."
        - paragraph [ref=f1e63]:
          - text: To understand the pattern, let's use an example of a simple
          - code [ref=f1e64]: Grid
          - text: class that stores and provides information about its cells using a pair of
          - code [ref=f1e65]: x
          - text: and
          - code [ref=f1e66]: "y"
          - text: integer coordinates. Cells are stored internally in a two-dimentional array and clients can use the
          - code [ref=f1e67]: addCell()
          - text: ","
          - code [ref=f1e68]: fetchCell()
          - text: and
          - code [ref=f1e69]: isEmpty()
          - text: methods to interact with the grid.
        - generic [ref=f1e70]: "class Grid { private Cell[][] cells; … public void addCell(int x, int y, Cell cell) { cells[x][y] = cell; } public Cell fetchCell(int x, int y) { return cells[x][y]; } public boolean isEmpty(int x, int y) { return cells[x][y] == null; } }"
        - paragraph [ref=f1e71]:
          - text: As part of refactoring, we detect that
          - code [ref=f1e72]: x
          - text: and
          - code [ref=f1e73]: "y"
          - text: are a
          - link "DataClump" [ref=f1e74] [cursor=pointer]:
            - /url: /bliki/DataClump.html
          - text: and decide to introduce a new
          - code [ref=f1e75]: Coordinate
          - text: class. However, this will be a backwards-incompatible change to clients of the
          - code [ref=f1e76]: Grid
          - text: class. Instead of changing all the methods and the internal data structure at once, we decide to apply the parallel change pattern.
        - paragraph [ref=f1e77]:
          - text: In the expand phase you augment the interface to support both the old and the new versions. In our example, we introduce a new
          - code [ref=f1e78]: Map<Coordinate, Cell>
          - text: data structure and the new methods that can receive
          - code [ref=f1e79]: Coordinate
          - text: instances without changing the existing code.
        - generic [ref=f1e80]: "class Grid { private Cell[][] cells; private Map<Coordinate, Cell> newCells; … public void addCell(int x, int y, Cell cell) { cells[x][y] = cell; } public void addCell(Coordinate coordinate, Cell cell) { newCells.put(coordinate, cell); } public Cell fetchCell(int x, int y) { return cells[x][y]; } public Cell fetchCell(Coordinate coordinate) { return newCells.get(coordinate); } public boolean isEmpty(int x, int y) { return cells[x][y] == null; } public boolean isEmpty(Coordinate coordinate) { return !newCells.containsKey(coordinate); } }"
        - paragraph [ref=f1e81]: Existing clients will continue to consume the old version, and the new changes can be introduced incrementally without affecting them.
        - paragraph [ref=f1e82]
        - paragraph [ref=f1e84]: During the migrate phase you update all clients using the old version to the new version. This can be done incrementally and, in the case of external clients, this will be the longest phase.
        - paragraph [ref=f1e85]
        - paragraph [ref=f1e87]: Once all usages have been migrated to the new version, you perform the contract phase to remove the old version and change the interface so that it only supports the new version.
        - paragraph [ref=f1e88]
        - paragraph [ref=f1e90]:
          - text: In our example, since the internal two-dimentional array is not used anymore after the old methods have been deleted, we can safely remove that data structure and rename
          - code [ref=f1e91]: newCells
          - text: back to
          - code [ref=f1e92]: cells
          - text: .
        - generic [ref=f1e93]: "class Grid { private Map<Coordinate, Cell> cells; … public void addCell(Coordinate coordinate, Cell cell) { cells.put(coordinate, cell); } public Cell fetchCell(Coordinate coordinate) { return cells.get(coordinate); } public boolean isEmpty(Coordinate coordinate) { return !cells.containsKey(coordinate); } }"
        - paragraph [ref=f1e94]:
          - text: This pattern is particularly useful when practicing
          - link "ContinuousDelivery" [ref=f1e95] [cursor=pointer]:
            - /url: /bliki/ContinuousDelivery.html
          - text: because it allows your code to be released in any of these three phases. It also lowers the risk of change by allowing you to migrate clients and to test the new version incrementally.
        - paragraph [ref=f1e96]: Even when you have control over all usages of the interface, following this pattern is still useful because it prevents you from spreading breakage across the entire codebase all at once. The migrate phase can be short, but it is an alternative to leaning on the compiler to find all the usages that need to be fixed.
        - paragraph [ref=f1e97]: "Some example applications of this pattern are:"
        - list [ref=f1e98]:
          - listitem [ref=f1e99]:
            - text: "Refactoring: when changing a method or function signature, especially when doing a"
            - link "Long Term Refactoring" [ref=f1e100] [cursor=pointer]:
              - /url: /articles/workflowsOfRefactoring/#long-term
            - text: or when changing a
            - link "PublishedInterface" [ref=f1e101] [cursor=pointer]:
              - /url: /bliki/PublishedInterface.html
            - text: . A variant implementation of this pattern during a refactoring is to implement the old method in terms of the new API and use
            - link "Inline Method" [ref=f1e102] [cursor=pointer]:
              - /url: http://refactoring.com/catalog/inlineMethod.html
            - text: to update all usages at once. Delegating the old method to the new method is also a way to break the migrate phase into smaller and safer steps, allowing you to change the internal implementation first before changing the exposed API to clients. This is useful when the migrate phase is longer so you don't have to maintain two separate implementations.
          - listitem [ref=f1e103]:
            - text: "Database refactoring: this is a key component to"
            - link "evolutionary database design" [ref=f1e104] [cursor=pointer]:
              - /url: /articles/evodb.html
            - text: . Most database refactorings follow the parallel change pattern, where the migrate phase is the transition period between the original and the new schema, until all database access code has been updated to work with the new schema.
          - listitem [ref=f1e105]:
            - text: "Deployments: deployment techniques such as canary releases and"
            - link "BlueGreenDeployment" [ref=f1e106] [cursor=pointer]:
              - /url: /bliki/BlueGreenDeployment.html
            - text: are applications of the parallel change pattern where you have both old and new versions of the code deployed side by side, and you incrementally migrate users from one version to another, therefore lowering the risk of change. In a
            - link "microservices" [ref=f1e107] [cursor=pointer]:
              - /url: /articles/microservices.html
            - text: architecture, it can also remove the need for complex deployment orchestration of different services due to version dependencies between them.
          - listitem [ref=f1e108]:
            - text: "Remote API evolution: parallel change can be used to evolve a remote API (e.g. a REST web service) when you can't make the change in a backwards compatible manner. This is an alternative to using an explicit version in the exposed API. You can apply the pattern when making a change to the payload accepted or returned by the API on a given endpoint, or you can introduce a new endpoint to distinguish between the old and new versions. In the case of using parallel change in the same endpoint, following"
            - link "Postel's Law" [ref=f1e109] [cursor=pointer]:
              - /url: http://en.wikipedia.org/wiki/Robustness_principle
            - text: is a good technique to avoid consumers breaking when the payload is expanded.
        - paragraph [ref=f1e110]:
          - text: During the migrate phase, a
          - link "FeatureFlag" [ref=f1e111] [cursor=pointer]:
            - /url: /bliki/FeatureFlag.html
          - text: can be used to control which version of the interface is used. A feature toggle on the client side allows it to be forward-compatible with the new version of the supplier, which decouples the release of the supplier from the client.
        - paragraph [ref=f1e112]:
          - text: When implementing
          - link "BranchByAbstraction" [ref=f1e113] [cursor=pointer]:
            - /url: /bliki/BranchByAbstraction.html
          - text: ", parallel change is a good way to introduce the abstraction layer between the clients and the supplier. It is also an alternative way to perform a large-scale change without introducing the abstraction layer as a seam for replacement on the supplier side. However, when you have a large number of clients, using branch by abstraction is a better strategy to narrow the surface of change and reduce confusion during the migrate phase."
        - paragraph [ref=f1e114]: The downside of using parallel change is that during the migrate phase the supplier has to support two different versions, and clients could get confused about which version is new versus old. If the contract phase is not executed you might end up in a worse state than you started, therefore you need discipline to finish the transition successfully. Adding deprecation notes, documentation or TODO notes might help inform clients and other developers working on the same codebase about which version is in the process of being replaced.
        - generic [ref=f1e115]:
          - heading "Further Reading" [level=2] [ref=f1e116]
          - paragraph [ref=f1e117]:
            - text: Industrial Logic's
            - link "refactoring album" [ref=f1e118] [cursor=pointer]:
              - /url: https://elearning.industriallogic.com/gh/submit?Action=AlbumContentsAction&album=foundations&devLanguage=Java
            - text: documents and demonstrates an example of performing a parallel change.
        - generic [ref=f1e119]:
          - heading "Acknowledgements" [level=2] [ref=f1e120]
          - paragraph [ref=f1e121]:
            - text: This technique was first documented as a refactoring strategy by Joshua Kerievsky in 2006 and presented in his talk
            - link "The Limited Red Society" [ref=f1e122] [cursor=pointer]:
              - /url: http://www.infoq.com/presentations/The-Limited-Red-Society
            - text: presented at the Lean Software and Systems Conference in 2010.
          - paragraph [ref=f1e123]: "Thanks to Joshua Kerievsky for giving feedback on the first draft of this post. Also thanks to many Thoughtworks colleagues for their feedback: Greg Dutcher, Badrinath Janakiraman, Praful Todkar, Rick Carragher, Filipe Esperandio, Jason Yip, Tushar Madhukar, Pete Hodgson, and Kief Morris."
