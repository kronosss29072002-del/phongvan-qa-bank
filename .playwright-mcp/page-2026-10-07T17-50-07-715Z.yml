      - listitem [ref=f2e567]:
        - article [ref=f2e568]:
          - generic [ref=f2e569]:
            - generic [ref=f2e570]: "#11"
            - heading "DutyBell" [level=3] [ref=f2e571]
            - generic [ref=f2e572]: Flagship
            - generic [ref=f2e573]: 6 tuần
            - generic [ref=f2e574]: devtools
          - paragraph [ref=f2e575]: "Đội dev 5-10 người trực production theo ca nhưng lịch trực đang nằm ở Google Sheet, alert gửi vào group Slack chung nên không biết ai đang cầm chịch và không ai bị ép phải ack. DutyBell là hệ thống on-call rotation + escalation: xếp lịch trực ca tuần theo timezone Asia/Ho_Chi_Minh, bắn alert qua API key cho hệ thống giám sát, tự escalate lên người backup rồi lên engineering manager nếu không ai ack trong 5 phút, và buộc phải viết postmortem trước khi đóng incident — đúng loại công cụ một team thật sẽ dùng hằng ngày."
          - generic [ref=f2e576]:
            - generic [ref=f2e577]:
              - heading "Phạm vi" [level=4] [ref=f2e578]
              - list [ref=f2e579]:
                - listitem [ref=f2e580]: "Xếp lịch trực tuần (weekly rotation): team chọn thứ tự xoay vòng, hệ thống sinh ca theo tuần với handoff cố định 09:00 Asia/Ho_Chi_Minh; mỗi khung giờ chỉ được gắn đúng 1 on-call primary + 1 backup, conflict detection chặn 2 người cùng trúng 1 ca"
                - listitem [ref=f2e581]: "Swap ca 2 người: cả 2 bên phải confirm trước khi có hiệu lực — swap request ở trạng thái pending cho tới khi người thứ 2 xác nhận, chỉ khi đó lịch mới đổi và ghi audit log; từ chối hoặc quá TTL (env SWAP_TTL_HOURS, mặc định 24h) không confirm thì request tự hủy"
                - listitem [ref=f2e582]: "Tạo alert qua API key: endpoint nhận {title, severity, service} từ hệ thống giám sát; API key hash sha256 khi lưu, show plaintext 1 lần khi create, revoke bằng cách rotate (mỗi team 1 key); tự resolve người on-call primary tại thời điểm alert và gửi notification (Slack webhook + email stub)"
                - listitem [ref=f2e583]: "Escalation chain tự động: nếu không ack trong thời gian ESCALATION_STEP_MINUTES (mặc định 5 phút) → escalate lên backup (lưu escalatedAt), thêm 1 bước nữa → engineering manager; mỗi bước lưu timeline riêng, alert đã ack thì dừng chain; chạy qua background job (BullMQ/cron poll) có idempotency để không escalate 2 lần"
                - listitem [ref=f2e584]: "Ack với optimistic locking: mỗi incident có version field, ack phải gửi kèm version hiện tại — 2 người bấm đồng thời chỉ 1 người thắng, loser nhận 409 kèm thông tin người đã ack trước (hardest bug của project, bắt buộc có regression test fail-trước-fix)"
                - listitem [ref=f2e585]: "Status enum chốt 1 danh sách duy nhất: triggered → acknowledged → escalated → closed; ack (từ triggered hoặc escalated) → acknowledged; escalation chỉ set status = escalated khi incident vẫn un-acked; closed chỉ nhận từ acknowledged và bắt buộc đã có postmortem đủ field (timeline events + ít nhất 4 câu trả lời 5-whys), thiếu field trả 400 ValidationPipe"
                - listitem [ref=f2e586]: "Audit log append-only: mọi hành động (create alert, ack, escalate, swap confirm, close) ghi 1 dòng {actorId, action, incidentId, metadata, createdAt} — API không có route UPDATE/DELETE, chỉ INSERT và GET phân trang"
                - listitem [ref=f2e587]: "Dashboard React: timeline incident theo thời gian (polling 5s), lịch on-call dạng calendar tuần swap được (grid đơn giản, không drag-drop), trang incident detail ghi ack/escalate/postmortem"
            - generic [ref=f2e588]:
              - heading "Ngoài phạm vi" [level=4] [ref=f2e589]
              - list [ref=f2e590]:
                - listitem [ref=f2e591]: Mobile app / push notification native — chỉ email + Slack webhook, giữ scope web
                - listitem [ref=f2e592]: Tích hợp thật với PagerDuty/Opsgenie/Telegram Bot API — chỉ dùng webhook URL mock + email console transport, tránh OAuth flow dài
                - listitem [ref=f2e593]: Multi-tenant billing, SSO/SAML, RBAC phức tạp — chỉ 2 role (member/manager) seed sẵn, auth JWT đơn giản
                - listitem [ref=f2e594]: Realtime WebSocket/SSE — dùng polling 5s cho timeline, đủ demo không cần socket infra
                - listitem [ref=f2e595]: Alert deduplication/grouping nâng cao và SLA reporting — chỉ lưu escalatedAt thô, không tính metric phức tạp
