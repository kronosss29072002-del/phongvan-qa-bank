      - listitem [ref=f2e619]:
        - article [ref=f2e620]:
          - generic [ref=f2e621]:
            - generic [ref=f2e622]: "#12"
            - heading "ApprovaFlow" [level=3] [ref=f2e623]
            - generic [ref=f2e624]: Flagship
            - generic [ref=f2e625]: 7 tuần
            - generic [ref=f2e626]: internal-tools
          - paragraph [ref=f2e627]: "Các công ty vừa và nhỏ tại VN vẫn duyệt chi phí qua email và bảng tính: người duyệt không biết request đang kẹt ở đâu, cấp trên đi nghỉ không ai thay, quá 48h không ai nhắc, và khi có tranh chấp thì không ai truy được ai đã phê duyệt gì lúc nào. ApprovaFlow giải quyết đúng bottleneck đó — một engine duyệt chi phí nội bộ với chuỗi phê duyệt theo ngưỡng số tiền, ủy quyền tự động khi approver nghỉ, SLA nhắc việc + escalate, và audit trail toàn bộ transition. Dự án đáng làm vì nó ép bạn chạm vào đúng ranh giới junior/mid: state machine có guard, optimistic locking chống double-approve, và permission theo vai trò — ba thứ có thể defend nguyên vẹn trong phỏng vấn."
          - generic [ref=f2e628]:
            - generic [ref=f2e629]:
              - heading "Phạm vi" [level=4] [ref=f2e630]
              - list [ref=f2e631]:
                - listitem [ref=f2e632]: "Chuỗi phê duyệt theo ngưỡng: request dưới 1 triệu chỉ cần manager duyệt; 1–10 triệu thêm department head rồi finance; trên 10 triệu thêm CEO — ngưỡng lưu trong DB (không hardcode), tạo approval chain tự động khi submit dựa trên amount + department của người gửi"
                - listitem [ref=f2e633]: "Org chart: field users.managerId self-reference + quan hệ department, seed 5 user đủ 4 cấp (employee → manager → dept head/finance → CEO) — SLA escalation dựa vào parent thật, không hardcode"
                - listitem [ref=f2e634]: "State machine draft → submitted → in_review → approved / rejected / withdrawn với guard tập trung và aggregate rule tường minh: in_review khi chain có step pending đầu tiên; approved khi mọi step trong chain approved; rejected → tự hủy các step pending còn lại; withdraw chỉ hợp lệ khi chưa step nào approved; transition sai trả 409 kèm lý do rõ ràng"
                - listitem [ref=f2e635]: "Self-approval: requester không được approve step của chính mình (vd CEO submit >10 triệu vẫn nằm trong chain của mình) → trả 403 kèm lý do, bước đó chờ delegate hoặc admin xử lý"
                - listitem [ref=f2e636]: "Optimistic locking bằng version field trên ApprovalRequest: mỗi lần transition phải gửi kèm version hiện tại, nếu hai approver bấm cùng lúc thì người thứ hai nhận 409 Conflict — integration test trên Postgres thật (docker hoặc testcontainers): Promise.all bắn 2 transition đồng thời trên cùng record, assert đúng 1 success + 1 conflict (mock Prisma không chứng minh được optimistic locking)"
                - listitem [ref=f2e637]: "Delegation (ủy quyền): approver đặt người thay thế theo khoảng ngày nghỉ; trong khoảng đó mọi approval step đang chờ của người đó tự động chuyển sang delegate, có audit record ghi rõ approved by delegate X on behalf of Y"
                - listitem [ref=f2e638]: "SLA 48h: cron job quét step quá hạn → gửi email nhắc (Gmail SMTP/Resend) lần 1, quá thêm 24h → escalate lên cấp trên trực tiếp của approver (parent org chart trong DB), audit trail ghi mỗi lần reminder/escalate"
                - listitem [ref=f2e639]: "Audit trail bất biến: mọi transition (submit, approve, reject, withdraw, delegate, escalate) ghi actor, from_state, to_state, comment, timestamp — UI hiển thị timeline, không endpoint nào được update/xóa record audit"
                - listitem [ref=f2e640]: "Upload & gắn hóa đơn (attachment) vào request: file lưu S3-compatible (R2/MinIO) hoặc local disk, hiển thị inline trong trang chi tiết, chỉ người trong chain duyệt hoặc requester được xem"
                - listitem [ref=f2e641]: "Rate limit endpoint POST /requests: chống spam submit (5 request/phút/user), trả 429 — dùng @nestjs/throttler, map đúng message cho UI"
            - generic [ref=f2e642]:
              - heading "Ngoài phạm vi" [level=4] [ref=f2e643]
              - list [ref=f2e644]:
                - listitem [ref=f2e645]: Tích hợp ERP kế toán (Fasto, MISA) hay xuất sổ cái — chỉ export CSV đơn giản nếu có thời gian
                - listitem [ref=f2e646]: Xử lý thanh toán/chi tiền thật, tích hợp ngân hàng, đa currency — chỉ VND, chỉ quản lý quy trình duyệt
