          - blockquote [ref=f2e666]:
            - heading "Câu chuyện phỏng vấn" [level=4] [ref=f2e667]
            - paragraph [ref=f2e668]: "Problem: approver A và B cùng mở request 8 triệu, cả hai bấm Approve trong cùng 1 giây — version cũ, cả hai đều thành công, request bị ghi nhận 2 lần approve bất chấp rule. Quyết định: dùng optimistic locking (version field) thay vì SELECT FOR UPDATE giữ suốt transaction, vì mỗi transition là 1 thao tác ngắn, conflict hiếm, giữ lock lâu sẽ bottleneck khi nhiều approver thao tác song song khác request; UI gửi kèm version, nếu 409 thì refetch và báo request vừa được xử lý bởi người khác. Khó nhất là reproduce race condition trong test: ban đầu mock Prisma làm test flaky nên mình chuyển sang integration test trên Postgres thật — Promise.all bắn 2 transition đồng thời qua transaction thật rồi assert đúng 1 success + 1 conflict. Kết quả định lượng: 0 incident double-approve qua 200 lượt test CI, demo trực tiếp conflict scenario trong phỏng vấn; thời gian duyệt trên dữ liệu seed mô phỏng giảm từ 3 ngày (không reminder) xuống 1.2 ngày khi bật SLA reminder + delegate — số đo trên dataset demo, không phải user thật nên mình chỉ dùng nó để minh họa cơ chế."
          - paragraph [ref=f2e669]:
            - generic [ref=f2e670]: REALITY
            - generic [ref=f2e671]: "Tuần 7 gần như không còn buffer — nếu tuần 5 delegation + SLA chưa xong thì cắt theo thứ tự: attachment về local disk trước, escalation (chỉ giữ reminder), giữ nguyên race test + state machine vì đó là signal phỏng vấn."
