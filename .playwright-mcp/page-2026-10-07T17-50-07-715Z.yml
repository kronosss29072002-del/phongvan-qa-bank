          - blockquote [ref=f2e351]:
            - heading "Câu chuyện phỏng vấn" [level=4] [ref=f2e352]
            - paragraph [ref=f2e353]: "Problem: nhân viên CSKH phải mở 3 tab theo dõi 3 carrier, webhook GHN gửi lại nhiều lần nên dashboard từng hiển thị trạng thái nhảy lùi khi event về sai thứ tự. Quyết định: chuẩn hoá mọi nguồn về một state machine chung với mapping table per-carrier thay vì để UI tự diễn giải từng mã thô, và đưa toàn bộ việc ghi qua một pipeline duy nhất (webhook hay poll đều đi qua) với idempotency key là deliveryId + eventVersion. Khó nhất là race condition giữa webhook trùng và poll song song: 2 request cùng cập nhật 1 shipment — fix bằng unique constraint trên (deliveryId, eventVersion) + transaction, cộng trackingVersion monotonic để event cũ bị drop thay vì ghi đè; lúc đầu chỉ check version trong code vẫn race, thêm DB constraint mới ổn định. Kết quả định lượng: duplicate write = 0 sau fix (trước ~4% webhook bị xử lý 2 lần), 100% payload 3 carrier pass contract test trong CI, dashboard cập nhật dưới 1s qua SSE, phát hiện 12 đơn kẹt >48h trong tuần đầu chạy thử (trừ trạng thái terminal) — việc trước đây CSKH phát hiện thủ công sau 2-3 ngày."
