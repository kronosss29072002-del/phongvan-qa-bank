            - paragraph [ref=f2e833]: "Bối cảnh: team sản phẩm tích hợp nội dung vào 3 site riêng nhưng mọi người sửa content trực tiếp trong git hoặc copy-paste — không ai biết file nào đã publish, ai sửa. Tôi quyết định build headless CMS thay vì tự dựng CRUD thường, vì phần khó thật sự nằm ở integration: ai được đọc API, và khi content đổi thì hệ thống bên ngoài biết bằng cách nào. Khó nhất là rate limit + webhook retry: sliding window đầu tiên bị race condition (2 request cùng chạm ngưỡng vẫn qua) nên tôi chuyển sang Lua script chạy atomic trên Redis, và webhook lần đầu retry ngay liên tục làm receiver bị spam — refactor thành BullMQ job với delay 1m/5m/30m (config qua env để test không phải chờ thật) + lưu attempt log để thấy rõ 410 Gone thì tự đóng subscription thay vì retry vô hạn. Kết quả định lượng: 61 request/ph → đúng request thứ 61 trả 429 có header X-RateLimit-Remaining=0 (test hammer tự động), webhook fail toàn bộ 3 lần rơi dead-letter đúng hạn ~36 phút (mặc định prod), regression test chứng minh tenant B sửa id trong URL không đọc được entry của tenant A, audit log ghi trọn before/after mọi thay đổi content."
