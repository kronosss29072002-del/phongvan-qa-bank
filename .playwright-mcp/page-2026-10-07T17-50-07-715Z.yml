          - blockquote [ref=f2e88]:
            - heading "Câu chuyện phỏng vấn" [level=4] [ref=f2e89]
            - paragraph [ref=f2e90]: "Địa chỉ giao hàng không phải điểm chuẩn — nó rơi vào vùng, và bài kinh điển là tìm polygon chứa point. Ban đầu mình định loop polygon trong JS (ray-casting tay), nhưng N zone × M tra cứu thành bottleneck và mớ polygon chồng nhau khó kiểm tra overlap trong application code. Quyết định: đẩy toàn bộ xuống PostGIS — ST_Contains với GiST index để lookup log n, và chặn overlap lúc validate zone bằng ST_Intersects AND NOT ST_Touches (bắt cả zone chứa zone, vẫn cho zone chung biên) cộng trigger BEFORE INSERT/UPDATE nên không bao giờ commit được 2 zone chồng. Khó nhất là điểm nằm exactly trên biên polygon: ST_Contains trả false, ST_Intersects trả true khiến quote lúc được lúc không — mình chuẩn hóa bằng ST_Covers cho phép biên, thêm tie-break sort zone_id ASC để kết quả xác định bất kể thứ tự row, kèm regression test cho điểm biên. Một bài học khác: ban đầu mình đo khoảng cách bằng ST_DDistance trên geometry 4326 nên 5km thành 5 độ (≈555km), surcharge sai hết — fix bằng cast sang geography và có test khẳng định 5km không bằng 5 độ. Kết quả đo được trong benchmark (ghi vào README ngay khi đo): tra cứu 500 địa chỉ trong 1 transaction dưới 300ms (trước đó loop JS + external geocode ~4s), overlap bị chặn 100% ở DB thay vì phát hiện khi render map, và mọi quote trả breakdown đầy đủ base + surcharge + distance nên nhân viên không còn đoán phí ship."
