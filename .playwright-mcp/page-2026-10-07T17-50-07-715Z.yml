            - heading "ShipTrack" [level=3] [ref=f2e308]
            - generic [ref=f2e309]: Trung cấp
            - generic [ref=f2e310]: 4 tuần
            - generic [ref=f2e311]: Logistics Integrations
          - paragraph [ref=f2e312]: Team vận hành một cửa hàng e-commerce phải theo dõi hàng trăm đơn mỗi ngày trên 3-4 đơn vị vận chuyển (GHN, GHTK, Viettel Post...), mỗi đơn vị trả về một bộ trạng thái thô khác nhau nên nhân viên phải mở nhiều tab và đoán đơn nào đang kẹt. ShipTrack chuẩn hoá mọi trạng thái thô về một state machine chung, nhận webhook idempotent có xác thực chữ ký và push realtime lên dashboard, để người vận hành thấy ngay đơn nào đang giao, đơn nào kẹt quá 48h trên một màn hình.
          - generic [ref=f2e313]:
            - generic [ref=f2e314]:
              - heading "Phạm vi" [level=4] [ref=f2e315]
              - list [ref=f2e316]:
                - listitem [ref=f2e317]: "State machine chuẩn hoá: 5 trạng thái carrier thô (mỗi carrier một mapping table riêng, ~15 mã thô) quy về 6 trạng thái chuẩn pending → picked_up → in_transit → out_for_delivery → delivered | exception | returned; transition không hợp lệ (vd. delivered → in_transit) bị reject và ghi audit thay vì âm thầm ghi đè"
                - listitem [ref=f2e318]: "Webhook authentication: mỗi carrier có shared secret/token riêng, verify chữ ký (hoặc header token) bằng timingSafeEqual trước khi parse business payload, sai → 401; rate limit cơ bản cho route /webhooks"
                - listitem [ref=f2e319]: "Webhook receiver idempotent: unique constraint trên (deliveryId, eventVersion), xử lý trong transaction; duplicate key (P2002) → catch → trả 200 không ghi trùng"
                - listitem [ref=f2e320]: "Xử lý event về sai thứ tự: mỗi shipment có trackingVersion monotonic, event có version nhỏ hơn version hiện tại bị bỏ qua (không ghi) + ghi audit drop, event mới hơn cập nhật bình thường — phân công tường minh: dedupe bằng unique constraint trước, ordering bằng version sau, không chồng chéo hai cơ chế"
                - listitem [ref=f2e321]: "Poll backup định kỳ cho carrier không có webhook (hoặc webhook rớt): scheduler poll trạng thái carrier mỗi 15 phút, đi qua cùng pipeline normalise như webhook nên không tạo 2 luồng ghi khác nhau"
                - listitem [ref=f2e322]: "Retry + dead-letter: webhook xử lý lỗi 3 lần exponential backoff (1s / 4s / 16s) rồi chuyển vào dead-letter log với lý do lỗi, UI có trang xem lại (retry tay từ UI nằm ở stretchGoals)"
                - listitem [ref=f2e323]: "Dashboard realtime qua SSE: stream đơn đang giao cập nhật không cần refresh, filter theo carrier/trạng thái/thời gian"
                - listitem [ref=f2e324]: "Alert shipment kẹt: cron phát hiện đơn ở cùng một trạng thái quá 48h — CHỈ tính các trạng thái non-terminal (pending, picked_up, in_transit, out_for_delivery), loại delivered/returned (terminal đứng yên mãi) — đánh dấu stuck và nổi lên đầu dashboard"
                - listitem [ref=f2e325]: "Contract test CI: mock payload thật của từng carrier (GHN/GHTK/Viettel Post) chạy qua pipeline normalise trong GitHub Actions, sai mapping là build fail"
                - listitem [ref=f2e326]: "RBAC 2 role rõ ràng: admin (quản lý mapping, carrier config) và operator (xem dashboard, xem dead-letter)"
                - listitem [ref=f2e327]: "Phân bổ theo tuần: W1 domain + state machine + webhook auth + idempotent · W2 ordering + poll backup + retry/DLQ · W3 SSE dashboard + stuck cron + RBAC · W4 contract test + deploy + README"
            - generic [ref=f2e328]:
              - heading "Ngoài phạm vi" [level=4] [ref=f2e329]
              - list [ref=f2e330]:
                - listitem [ref=f2e331]: Tích hợp API tạo đơn/booking vận chuyển thật (chỉ theo dõi shipment có sẵn, không in phí ship hay gọi carrier để tạo đơn)
                - listitem [ref=f2e332]: UI theo dõi bản đồ vị trí xe giao hàng realtime (chỉ có timeline trạng thái + timestamp)
                - listitem [ref=f2e333]: Xử lý hoàn tiền/đối soát tiền COD với carrier — chỉ lưu trạng thái, không tính tiền
                - listitem [ref=f2e334]: Multi-tenant cho nhiều shop (giữ scope 1 org với 2 role admin/operator)
                - listitem [ref=f2e335]: Mobile app native — dashboard responsive web là đủ
