            - heading "Câu chuyện phỏng vấn" [level=4] [ref=f2e560]
            - paragraph [ref=f2e561]: "Problem: team dùng Google Form, sửa câu hỏi là mọi response cũ bị lệch schema — không còn cách nào phân tích đúng theo cấu trúc tại thời điểm nộp, còn Typeform tính tiền theo response. Quyết định: tách Form (container) khỏi FormVersion (immutable snapshot) — publish tạo version bất biến, response lưu JSONB kèm formVersionId và được Zod-validate bằng schema build từ đúng snapshot đó lúc submit; skip-logic được validate bằng directed-graph cycle check ngay lúc publish, không để rule vô hạn đến lúc user điền. Khó nhất: bug thật — field bị skip theo rule vẫn bị báo required-missing khi submit vì logic tính required chạy trước khi evaluate skip-path, và publish trước đó không chặn rule trỏ vòng lặp 2-node (graph check chỉ bắt self-loop); fix bằng cách evaluate path trước, mark skipped fields, rồi mới validate, đồng thời DFS full-cycle detection + regression test viết fail trước fix. Kết quả định lượng: 7 loại field chạy được với skip-logic 3 tầng, publish bất biến (sửa form không làm vỡ 1 response cũ nào trong test suite), seed 10k response cho benchmark — báo cáo aggregate trả về dưới 200ms nhờ JSONB query chạy trên DB thay vì load về Node."
