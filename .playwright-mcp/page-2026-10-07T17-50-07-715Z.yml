            - generic [ref=f2e43]: "#01"
            - heading "ZoneCheck" [level=3] [ref=f2e44]
            - generic [ref=f2e45]: Nền tảng
            - generic [ref=f2e46]: 3 tuần
            - generic [ref=f2e47]: geo
          - paragraph [ref=f2e48]: Cửa hàng giao hàng nhỏ đang tính phí ship bằng cách nhìn địa chỉ rồi đoán — nhân viên tra tay zone trên Google Maps, sai zone thì lỗ tiền ship hoặc khách hủy đơn. ZoneCheck cho khách nhập địa chỉ, hệ thống bắn điểm lên polygon vùng phục vụ và trả về ngay phí ship + thời gian giao theo zone, ngoài vùng trả not deliverable rõ ràng thay vì im lặng. Dự án đáng làm vì nó buộc bạn dùng geo-query thật (point-in-polygon qua PostGIS ST_Contains, khoảng cách ST_DWithin trên geography) chứ không chỉ nhúng Google Maps, và business rule tính phí nằm hẳn trong backend với validation địa lý chặt.
          - generic [ref=f2e49]:
            - generic [ref=f2e50]:
              - heading "Phạm vi" [level=4] [ref=f2e51]
              - list [ref=f2e52]:
                - listitem [ref=f2e53]: "Admin khai báo zone giao hàng: tạo/sửa/xóa zone (tên, base fee, surcharge, ETA giao, polygon ring nhập tọa độ hoặc import GeoJSON) — v1 không vẽ polygon trên bản đồ; validate polygon tự khép kín, tối thiểu 3 điểm, không self-intersect (ST_IsValid)"
                - listitem [ref=f2e54]: "Chặn overlap: 2 polygon chồng nhau → trả 409 Conflict kèm zone_ids xung đột, pre-check dùng ST_Intersects(a, b) AND NOT ST_Touches(a, b) — bắt được cả zone chứa zone và vẫn cho 2 zone chung biên (ST_Overlaps bỏ lọt containment; EXCLUDE với operator bbox thì over-block nên không dùng làm enforcement); enforcement ở DB bằng trigger BEFORE INSERT/UPDATE query qua GiST index"
                - listitem [ref=f2e55]: "Tra cứu phí ship: khách nhập địa chỉ (chuỗi) → geocode qua Nominatim, fallback nhập tay tọa độ → điểm (lat, lng) chạy ST_Contains tìm zone → trả {zone, baseFee, surcharge, totalFee, etaHours, distanceKm}"
                - listitem [ref=f2e56]: "Phụ phí khoảng cách: cast geometry → geography (EPSG:4326) rồi ST_DWithin / ST_Distance tính theo mét (không có function ST_SphereDistance, và không tính trên geometry degrees — 5 độ ≈ 555km); điểm xa tâm zone trên 5km (hằng số SHIP_DISTANCE_THRESHOLD_KM) cộng surcharge; regression test khẳng định 5km không bằng 5 độ"
                - listitem [ref=f2e57]: "Ngoài vùng: điểm không thuộc polygon nào → HTTP 200 với {deliverable: false, reason: 'outside_service_area'} — không bao giờ silent-fail, không bao giờ trả phí mặc định"
                - listitem [ref=f2e58]: "Tie-break điểm nằm trên biên chung 2 zone: thử ST_Contains trước, fallback ST_Covers với sort zone_id ASC để kết quả xác định (không phụ thuộc thứ tự row); unit test cho điểm trên biên"
                - listitem [ref=f2e59]: "Auth JWT 2 role: admin CRUD zone + xem báo cáo, staff chỉ tra cứu phí (route tra cứu public-optional cho khách, log tra cứu gắn staff khi đăng nhập) — guard check role ở route, không chỉ giấu nút UI"
                - listitem [ref=f2e60]: "Import GeoJSON tuyến hành chính VN: nguồn dữ liệu và granularity (quận hay phường) được ghim trong README ngay tuần 1 (dữ liệu hành chính VN đổi lớn sau sáp nhập 2025, rủi ro link 404/bản cũ); batch insert trong 1 transaction, rollback toàn bộ nếu 1 feature invalid; endpoint import hoàn thiện ở tuần 3"
                - listitem [ref=f2e61]: "Trang tra cứu cho khách: nhập địa chỉ → map Leaflet hiển thị điểm + polygon zone khớp + bảng breakdown phí, copy kết quả dán vào đơn hàng"
            - generic [ref=f2e62]:
              - heading "Ngoài phạm vi" [level=4] [ref=f2e63]
              - list [ref=f2e64]:
                - listitem [ref=f2e65]: Tích hợp Google Maps paid Geocoding/Directions chính thức (dùng Nominatim free + nhập tay tọa độ fallback; tránh key + quota)
                - listitem [ref=f2e66]: Tích hợp đơn hàng / thanh toán / đẩy đơn sang shipper — ZoneCheck chỉ trả quote, không tạo đơn
                - listitem [ref=f2e67]: Tính phí theo trọng lượng hay kilometer đường đi thật (chỉ dùng khoảng cách chim bay trên geography, không gọi routing API)
                - listitem [ref=f2e68]: Vẽ/sửa polygon trực tiếp trên bản đồ (Leaflet.draw) — v1 chỉ nhập tọa độ ring + import GeoJSON
                - listitem [ref=f2e69]: Realtime tracking ship, websocket, bản đồ mobile app
                - listitem [ref=f2e70]: Đa chi nhánh / đa cửa hàng — 1 cửa hàng, 1 set zone
                - listitem [ref=f2e71]: OAuth social login, phân quyền phức tạp hơn 2 role
