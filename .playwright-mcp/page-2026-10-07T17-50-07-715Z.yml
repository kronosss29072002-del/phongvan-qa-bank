            - heading "Câu chuyện phỏng vấn" [level=4] [ref=f2e775]
            - paragraph [ref=f2e776]: "Ban đầu team dùng spreadsheet, mỗi khi có mid-cycle upgrade là founder sửa tay rồi hai số MRR tháng đó lệch nhau không rõ vì sao. Mình quyết định không tính lại MRR từ đầu mà ghi bất biến: mỗi sự kiện Stripe sinh một movement append-only, MRR mọi thời điểm là SUM as-of-date — đánh đổi là phải xử lý idempotency và thứ tự event khó hơn. Khó nhất là bug concurrency: invoice.paid và subscription.updated của cùng subscription đến song song, hai transaction cùng đọc snapshot cũ rồi ghi 2 movement trùng delta làm MRR cộng thừa một lần; mình bắt được bằng e2e test replay webhook đồng thời, fix bằng version field optimistic locking trên aggregate (conflict → retry đọc lại snapshot) cộng unique constraint event.id làm lớp chặn cuối. Một bài học metric: ban đầu mình ghi expansion = phần proration thực thu nên sum sau upgrade ra 15$ trong khi giá recurring đã là 20$ — MRR drift vĩnh viễn, vì thế expansion phải tính full delta từ normalized recurring price, phần cash ghi ở metadata riêng. Kết quả định lượng: replay 1000 event không đổi tổng MRR (loại bỏ double-count), query as-of-date trả về đúng số đã chốt trong quá khứ dù dữ liệu hiện tại đã thay đổi, dashboard 6 chart dựng hoàn toàn từ ledger, không có bảng tổng hợp nào phải sửa tay."
