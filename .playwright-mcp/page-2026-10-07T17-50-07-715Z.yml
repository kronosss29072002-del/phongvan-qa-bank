      - listitem [ref=f2e410]:
        - article [ref=f2e411]:
          - generic [ref=f2e412]:
            - generic [ref=f2e413]: "#08"
            - heading "FlagDeck" [level=3] [ref=f2e414]
            - generic [ref=f2e415]: Trung cấp
            - generic [ref=f2e416]: 5 tuần
            - generic [ref=f2e417]: internal-tools
          - paragraph [ref=f2e418]: "Một team dev không có cách an toàn để bật tính năng mới cho một phần người dùng: bật sai là hỏng prod, bật hết một lần thì không rollback được, và không ai biết ai đã thay đổi flag khi sự cố xảy ra. FlagDeck là bảng điều khiển feature flag nội bộ — rollout phần trăm bám sticky theo user, tách giá trị theo môi trường (dev/staging/prod), audit log đầy đủ diff trước/sau, và kill switch tắt một flag trong 1 hành động có hiệu lực trong vòng 1 giây — đúng thứ một team thật dùng để ship an toàn."
          - generic [ref=f2e419]:
            - generic [ref=f2e420]:
              - heading "Phạm vi" [level=4] [ref=f2e421]
              - list [ref=f2e422]:
                - listitem [ref=f2e423]: "Rollout phần trăm sticky theo user: pin 1 thuật toán murmur3_32, bucket = hash(flag_key + ':' + user_id) % 100 (0–99), enabled khi bucket < pct — 0% = không ai, 100% = tất cả; cùng user luôn rơi cùng nhóm giữa các lần evaluate, tăng % lên 30% thì user đã ở nhóm vẫn giữ nguyên trạng thái; API và SDK phải dùng cùng algorithm + seed"
                - listitem [ref=f2e424]: "Targeting rule theo role/cohort/environment: rule có thứ tự (first-match-wins) gồm attribute (role, cohort, env), operator (=, !=, in, contains) và giá trị; rule matching trả override boolean, không match thì fallback sang giá trị phần trăm"
                - listitem [ref=f2e425]: "Giá trị tách theo môi trường: cùng flag_key có record riêng cho dev/staging/prod (DB unique constraint trên key + env), sửa prod không ảnh hưởng staging; UI có env switcher rõ ràng, màu khác nhau cho từng env"
                - listitem [ref=f2e426]: "Audit log bất biến: mọi mutation (tạo/sửa/xóa flag, đổi %, đổi rule, kill) ghi actor_id, actor_email, timestamp, JSON diff {before, after} đầy đủ; audit chỉ append, không update/delete, có trang filter theo flag/env/actor"
                - listitem [ref=f2e427]: "Kill switch toàn cục: endpoint 1 hành động đặt enabled=false cấp flag (ưu tiên trên mọi rule + % rollout); hiệu lực ≤1s cho route /evaluate/:key nhờ Redis pub/sub version key — kill bump version, mọi node invalidate in-memory cache ngay, không chờ hết TTL 15s; SDK snapshot poll mode chấp nhận ≤10s; mỗi lần kill/unkill đều tạo audit entry"
