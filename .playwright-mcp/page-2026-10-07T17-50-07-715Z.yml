      - listitem [ref=f2e674]:
        - article [ref=f2e675]:
          - generic [ref=f2e676]:
            - generic [ref=f2e677]: "#13"
            - heading "FeedForge" [level=3] [ref=f2e678]
            - generic [ref=f2e679]: Flagship
            - generic [ref=f2e680]: 7 tuần
            - generic [ref=f2e681]: social
          - paragraph [ref=f2e682]: "FeedForge là news feed realtime cho cộng đồng nhỏ, giải bài toán fan-out hỗn hợp: người theo dõi ít thì ghi sẵn timeline vào Redis khi đăng bài, người nổi tiếng thì merge on-read. Dự án đáng ở mức flagship vì chính tradeoff này phải đo bằng benchmark p95 trên dataset seed và giải thích được vì sao chọn ngưỡng, thay vì chỉ làm CRUD post/follow như các candidate khác."
          - generic [ref=f2e683]:
            - generic [ref=f2e684]:
              - heading "Phạm vi" [level=4] [ref=f2e685]
              - list [ref=f2e686]:
                - listitem [ref=f2e687]: Auth JWT email/password (register, login, guard) — nằm trong ước tính 7 tuần, không phải prerequisite ngầm
                - listitem [ref=f2e688]: "Post & embedded media: đăng bài có ảnh/giphy (lưu URL + metadata), business rule: mỗi post tối đa 10 media, bài chỉnh sửa giữ nguyên created_at để cursor pagination không nhảy, xóa post soft-delete để timeline đã cache không bị lệch id"
                - listitem [ref=f2e689]: "Follow graph + ngưỡng fan-out (threshold là config, mặc định 10k): follow/unfollow có kiểm tra (không tự follow, không follow trùng, chặn cycle self-follow), quyết định strategy theo follower count của người đăng: dưới ngưỡng thì fan-out-on-write (ZADD vào Redis sorted set timeline của từng follower), từ ngưỡng trở lên thì fan-out-on-read"
                - listitem [ref=f2e690]: "Seed benchmark: ≥11k users trong đó 1 celebrity account có ~10k follow edge để CẢ 2 nhánh fan-out đều kích hoạt được (1k users thì không bao giờ chạm ngưỡng 10k), cùng script seed 50k posts; threshold là config test ở ngưỡng thấp để e2e cover cả 2 nhánh; đo p95 query time 2 hướng (precomputed ZSET vs merge on-read) và ghi kết quả thật vào README — ghi rõ 10k là ngưỡng suy ra từ cost measurement, không phải crossover đo trực tiếp"
                - listitem [ref=f2e691]: "Cursor pagination ổn định: GET /feed?cursor=... trả về theo cặp (created_at, id) đóng cursor, không dùng offset — test bằng cách chèn bài mới giữa chừng khi đang scroll, không được lặp/không được bỏ bài"
                - listitem [ref=f2e692]: "Realtime qua SSE: endpoint /events/stream có heartbeat 25s; event id = cặp (created_at, id); client auto-reconnect: gửi Last-Event-ID rồi catch-up fetch /feed?cursor=... TRƯỚC khi resubscribe (Redis pub/sub là fire-and-forget, không replay được event bị lỡ), timeline cập nhật khi người mình follow đăng bài"
                - listitem [ref=f2e693]: "Soft-delete/block vs timeline cache: route serving timeline từ ZSET luôn filter-on-read (loại post đã xóa, user đã block — không chỉ dựa vào ZSET), có test case xóa post đã cache và block user đã cache"
                - listitem [ref=f2e694]: "Notification gộp: khi n người like cùng 1 post, A và B là 2 like đầu theo created_at, gộp thành 1 dòng A, B và 12 người khác — upsert transaction duy nhất, race-safe khi 2 like chạm nhau cùng lúc (test concurrency)"
                - listitem [ref=f2e695]: "Permission & state machine: like/unlike idempotent, owner-only edit/delete post, block user không thấy timeline của nhau — kiểm tra qua guard + query scope chứ không chỉ check ở controller"
                - listitem [ref=f2e696]: "Thin client frontend Next.js: infinite scroll theo cursor, composer tối đa 10 media, UI reconnect SSE, trang notification (~1–1.5 tuần, khai báo tường minh để 7 tuần không underestimate)"
            - generic [ref=f2e697]:
              - heading "Ngoài phạm vi" [level=4] [ref=f2e698]
              - list [ref=f2e699]:
