            - paragraph [ref=f2e247]: "Một sàn thương mại điện tử bị oversell trong flash sale: hai nhân viên reserve cùng một đơn vị hàng cuối cùng, code cũ đọc available rồi ghi đè nên cả hai đều thành công, tổng đơn vượt tồn kho thật. Mình quyết định không sửa bằng cách thêm lock cho cẩn thận mà đổi mô hình: mọi thay đổi tồn phải đi qua journal append-only kèm reasonCode, còn bảng stock chỉ là cache được xây dựng lại từ journal. Khó nhất là reproducer race — mình viết test bắn 50 request reserve đồng thời vào 10 đơn vị hàng còn lại, ban đầu vẫn oversell vì đọc-rồi-ghi, cuối cùng fix bằng conditional update WHERE on_hand - reserved >= ? bên trong transaction và bỏ hẳn bước read trước đó; riêng OUT và ADJUST từng làm vỡ invariant (OUT khi reserved = on_hand, kiểm kho set on_hand xuống dưới reserved) dù journal và stock vẫn nhất quán với nhau, nên mình thêm guard conditional cho 2 type này và mở rộng invariant check sang assert available ≥ 0 trên từng dòng stock. Kết quả định lượng: 50 request → đúng 10 thành công, 40 trả 409, invariant check soi 1000 dòng seed journal báo 0 mismatch, và reconciliation script on-demand chạy sạch — mỗi claim này đều có test chạy được trong CI để bảo vệ."
