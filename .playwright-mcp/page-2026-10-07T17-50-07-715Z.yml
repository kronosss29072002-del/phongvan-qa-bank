          - paragraph [ref=f2e470]: Team sales/support nhỏ (3-5 người) đang trả lời khách qua bảng chat chung nên hay giành nhau một hội thoại, trả lời trùng hoặc bỏ sót khách chờ quá lâu. ChatDesk Inbox là inbox realtime nơi mỗi hội thoại chỉ được 1 agent claim nguyên tử, agent thấy typing indicator, đếm unread theo cursor thật trên server và có timer SLA phản hồi đầu tiên đánh đỏ realtime — đúng các bài toán concurrency + realtime mà team backend đang tuyển.
          - generic [ref=f2e471]:
            - generic [ref=f2e472]:
              - heading "Phạm vi" [level=4] [ref=f2e473]
              - list [ref=f2e474]:
                - listitem [ref=f2e475]: "Auth: JWT 2 role (agent / admin), guard REST + verify token lúc socket connect; seed 5 agent có tài khoản để demo ngay"
                - listitem [ref=f2e476]: "Conversation state machine unassigned → claimed → active → waiting → resolved → reopened với transition validate phía server: chỉ agent đang sở hữu được resolve/active, waiting chỉ nhận từ claimed/active; resolved trong 24h khách nhắn lại → reopened (giữ nguyên owner, tính vào capacity 5); quá 24h khách nhắn → tạo hội thoại MỚI ở trạng thái unassigned, hội thoại cũ dừng ở resolved"
                - listitem [ref=f2e477]: "Claim hội thoại nguyên tử: Prisma $transaction + version field (optimistic lock) — hai agent bấm claim cùng lúc thì một người thắng, người thua nhận 409 kèm ai đang giữ; không bao giờ 2 agent cùng claim 1 hội thoại"
                - listitem [ref=f2e478]: "Agent capacity: tối đa 5 hội thoại active (claimed / active / waiting / reopened) trên 1 agent — trong transaction claim, lock row agent (SELECT FOR UPDATE theo agentId hoặc pg advisory lock) TRƯỚC khi count, nên 2 request claim 2 hội thoại KHÁC nhau cùng lúc không thể cùng qua; claim thứ 6 bị 409 với lý do rõ ràng; concurrency test chạy song song 2 claim khác hội thoại"
                - listitem [ref=f2e479]: "Typing indicator qua Socket.IO room theo từng conversation: client emit khi gõ, server broadcast kèm TTL tự hết sau 4s (agent disconnect / không emit nữa thì indicator biến mất, không cần client cleanup)"
                - listitem [ref=f2e480]: "Unread theo cursor: mỗi agent lưu lastReadAt per conversation trên server, cập nhật CHỈ khi agent mở hội thoại (server set về timestamp tin mới nhất tại thời điểm mở); unreadCount = count tin nhắn có timestamp > lastReadAt; không mở hội thoại thì cursor không nhảy nên tin cũ chưa đọc vẫn được đếm (không dùng boolean isRead)"
                - listitem [ref=f2e481]: "SLA first-response timer: đếm ngược từ tin nhắn customer đầu tiên (hoặc customer reopen), khi agent gửi tin đầu tiên thì dừng; breach quá 5 phút (đọc từ env) do scheduler quét định kỳ ~10s các hội thoại chưa có firstResponseAt và đã quá hạn — mốc thời gian tính lại từ DB nên sống sót khi restart API — phát event realtime đánh đỏ hội thoại cho MỌI agent đang online"
                - listitem [ref=f2e482]: Tin nhắn gắn monotonic sequence per conversation, cấp trong ĐÚNG transaction insert tin nhắn (max + 1 với unique constraint (conversationId, sequence), retry khi conflict — không dùng sequence ngoài transaction nên không có hole); client lưu seq cuối cùng, sau reconnect WS gửi seq đó → server backfill các tin bị miss trước khi stream tiếp
                - listitem [ref=f2e483]: Seed data demo (5 agent, ~30 hội thoại, tin nhắn trải đều để demo SLA + unread), structured logging Pino kèm correlationId, /health + /ready endpoint
