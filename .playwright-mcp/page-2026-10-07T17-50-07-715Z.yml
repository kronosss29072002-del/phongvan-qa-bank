          - paragraph [ref=f2e734]: "Team SaaS nhỏ theo dõi MRR bằng spreadsheet nối tay từ export Stripe: mỗi lần upgrade giữa kỳ, refund hay đổi gói là một dòng sửa tay, không ai truy vết được vì sao MRR tháng này lệch tháng trước. CohortIQ nhận webhook Stripe, biến mỗi sự kiện thành một dòng bất biến trong ledger MRR (new / expansion / contraction / churn / reactivation), nên tổng ledger tại bất kỳ ngày nào chính xác là MRR ngày đó — truy vấn as-of-date được, sửa lịch sử không được. Dự án đáng làm vì nó đúng loại bài toán production team billing thật sự phỏng vấn: ingest idempotent, ledger bất biến, tính point-in-time và concurrency control trên write path."
          - generic [ref=f2e735]:
            - generic [ref=f2e736]:
              - heading "Phạm vi" [level=4] [ref=f2e737]
              - list [ref=f2e738]:
                - listitem [ref=f2e739]: "Ingest webhook Stripe (checkout.session.completed, invoice.paid, customer.subscription.updated/deleted, charge.refunded) với idempotency bắt buộc: event.id unique trong DB, replay cùng event không sinh movement thứ 2 (e2e test replay 2 lần chỉ sum 1 lần); event xử lý lỗi ghi vào bảng dead-letter kèm lý do + retry count, có endpoint replay DLQ"
                - listitem [ref=f2e740]: "Ledger bất biến: mỗi dòng là một MRR movement có loại (new/expansion/contraction/churn/reactivation), amount, occurred_at, source_event_id — không UPDATE/DELETE movement; correction sinh dòng bù trừ mới; SUM(amount) WHERE occurred_at <= :date = MRR tại ngày đó (query as-of-date có API và chart)"
                - listitem [ref=f2e741]: "Quy tắc movement tường minh: expansion/contraction = chênh lệch normalized recurring price lấy từ snapshot subscription (full delta, occurred_at = ngày effective), không tính theo phần proration; phần proration/cash ghi ở metadata riêng (paid_amount, paid_at, proration flag) KHÔNG tham gia SUM-MRR; charge.refunded KHÔNG đổi MRR khi subscription còn active — ghi dòng cash/revenue riêng, contraction chỉ sinh từ subscription.updated (price/status giảm) và subscription.deleted"
                - listitem [ref=f2e742]: "Normalization MRR: mọi plan normalize về monthly (annual/12, interval_count > 1 chia đúng; sum mọi subscription active của cùng customer); test fixtures chỉ dùng monthly fixed price — metered/seat nằm ngoài outOfScope"
                - listitem [ref=f2e743]: "Thứ tự event lệch vẫn đúng: khi invoice.paid đến trễ sau subscription.updated, ledger vẫn tính delta từ snapshot subscription gần nhất chứ không cộng dồn mù — có regression test cho 2 webhook song song của cùng subscription"
                - listitem [ref=f2e744]: "Cohort retention với business rule định nghĩa: anchor = checkout.session.completed đầu tiên (first successful payment); predicate active = status active/trialing tại ngày 1 của tháng N; churned rồi reactivation giữ nguyên cohort signup gốc (không tạo cohort mới); heatmap cohort theo tháng (1/3/6 tháng), NRR và GRR theo plan cho cửa sổ 3/6/12 tháng"
                - listitem [ref=f2e745]: "Inventory 6 chart thống nhất giữa scope và demo: MRR theo ngày (line), MRR waterfall (new/expansion/contraction/churn/reactivation), cohort heatmap, churn by plan, NRR/GRR line, panel event pipeline (latency ingest + số event DLQ 24h)"
                - listitem [ref=f2e746]: "RBAC 2 mức: owner (xem, quản lý webhook secret, replay DLQ, gán viewer bằng username trong workspace — không có email invite, xem outOfScope) và viewer (chỉ đọc dashboard); mọi query dashboard gắn workspace_id, viewer không gọi được mutation"
                - listitem [ref=f2e747]: "Monitoring: /health (DB + webhook pipeline) và /ready, structured logging JSON kèm correlation-id xuyên suốt 1 request webhook"
                - listitem [ref=f2e748]: "Concurrency: version field (optimistic locking) trên bản aggregate cache MRR theo tháng — 2 webhook xử lý song song cùng workspace không ghi đè nhau, conflict được retry thay vì mất movement; e2e test 2 webhook song song"
                - listitem [ref=f2e749]: Seed/fixture generator ≥13 tháng event deterministic (dùng chung cho e2e) nằm trong scope chính — không có data history thì NRR 12 tháng và heatmap 6 tháng rỗng suốt 8 tuần build
