            - generic [ref=f2e789]: Content platforms & CMS
          - paragraph [ref=f2e790]: "Các team sản phẩm nhỏ cần một headless CMS để quản lý nội dung (article/page/product) rồi push ra website/app riêng, nhưng CMS có sẵn hoặc quá to (Strapi self-host nặng, Contentful tính tiền theo seat) hoặc không có ranh giới tenant + API key giới hạn quyền + webhook retry rõ ràng. Syndicate là multi-tenant headless CMS: mỗi tổ chức có content và schema riêng, expose public Content API qua scoped API key (read/write) kèm rate limit 60 req/ph, và khi content đổi thì fire webhook có HMAC signature + retry 1m/5m/30m với dead-letter UI — đúng lớp production habit mà một team thật cần ở integration layer."
