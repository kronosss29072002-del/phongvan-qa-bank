          - blockquote [ref=f2e402]:
            - heading "Câu chuyện phỏng vấn" [level=4] [ref=f2e403]
            - paragraph [ref=f2e404]: "Đơn COD bị nhận rồi bỏ làm shop lỗ tiền hàng, còn agent ngồi gọi xác nhận nhưng không ai biết hôm nay ai gọi bao nhiêu cuộc, chốt được bao nhiêu. Mình quyết định không làm CRUD đơn thuần mà tách toàn bộ quy trình ra một state machine có guard — mọi chuyển trạng thái phải đi qua service validation và ghi OrderEvent, nên confirmed nhảy về pending không bao giờ xảy ra bất kể gọi API kiểu gì. Phần khó nhất là rule blacklist: version đầu chỉ count rejected 30 ngày ngay trong transaction tạo đơn, nhưng test bắn 2 create song song cùng phone vẫn cả hai qua — vì dưới READ COMMITTED hai transaction cùng thấy snapshot cũ. Fix bằng pg_advisory_xact_lock theo phone trước khi count, tách rõ 2 race (2 create đồng thời, và create chạy song song với lúc đánh dấu rejected), kèm regression test tái hiện từng case. Kết quả định lượng: dashboard cho thấy tỉ lệ chốt đơn theo từng agent, đơn có ≥3 lần no_answer tự reject không cần người canh, và rate limit 10 phút/phone chặn sạch spam tạo đơn — những con số một manager COD dùng để ra quyết định mỗi sáng."
