      - listitem [ref=f2e359]:
        - article [ref=f2e360]:
          - generic [ref=f2e361]:
            - generic [ref=f2e362]: "#07"
            - heading "COD Confirm" [level=3] [ref=f2e363]
            - generic [ref=f2e364]: Trung cấp
            - generic [ref=f2e365]: 5 tuần
            - generic [ref=f2e366]: E-commerce & marketplace
          - paragraph [ref=f2e367]: "Nhà bán hàng COD tại Việt Nam mất tiền vì đơn nhận rồi bỏ và gọi xác nhận thủ công không ai theo dõi: mỗi ngày hàng chục cuộc gọi, agent quên gọi lại, số đen đặt lại đơn thoải mái, quản lý không biết tỉ lệ chốt đơn của từng người. COD Confirm là tool nội bộ cho team bán hàng — quản lý vòng đời đơn COD qua state machine chặt (pending → calling → confirmed → shipping → delivered / rejected / returned / cancelled), ghi lại từng lần gọi điện, tự động chặn số điện thoại có tiền sử bỏ đơn, và cho phép hủy đơn confirmed có kiểm soát (bắt buộc lý do, sau 2h phải qua duyệt) — thứ một team COD thật sẽ dùng hàng ngày."
          - generic [ref=f2e368]:
            - generic [ref=f2e369]:
              - heading "Phạm vi" [level=4] [ref=f2e370]
              - list [ref=f2e371]:
                - listitem [ref=f2e372]: "Order state machine có guard: pending → calling (tạo CallLog) → confirmed → shipping → delivered | rejected | returned | cancelled; cancelled là terminal, chỉ nhận từ pending / calling / confirmed; transition không hợp lệ bị 409 (confirmed không nhảy ngược về pending, returned chỉ đến từ shipping, rejected chỉ từ calling/confirmed); phân biệt hủy trước/sau 2h bằng cờ approval trên chính transition đó chứ không bằng target state khác; mọi transition ghi OrderEvent kèm actor + timestamp để audit"
                - listitem [ref=f2e373]: "Gọi điện có nhật ký: mỗi lần gọi agent tạo CallLog (kết quả: answered / no_answer / refused / wrong_number, ghi chú), đơn quá 3 lần no_answer tự chuyển rejected; dashboard hiển thị số lần gọi và agent phụ trách theo từng đơn"
                - listitem [ref=f2e374]: "Chống fraud bằng blacklist rule: phone có ≥3 đơn rejected/returned trong 30 ngày (rolling window, tính trên order history) tự động vào blacklist; thứ tự kiểm tra khi POST /orders cố định — blacklist trước (403 kèm lý do), rồi rate limit (429); admin có thể whitelist lại có lý do; sau whitelist, rule vẫn tính từ lịch sử đơn thật nên lần rejected thứ 3 kế tiếp của số đó tự vào lại blacklist ngay, không đếm lại từ đầu"
                - listitem [ref=f2e375]: "Hủy đơn confirmed sau 2h bắt buộc qua trang duyệt: chọn reason enum (customer_requested / out_of_stock / duplicate / fraud_suspect), trước 2h hủy tự do nhưng vẫn phải có lý do; mọi lần hủy ghi OrderEvent"
                - listitem [ref=f2e376]: "Webhook giả lập carrier (ký HMAC signature, verify bằng secret): POST /webhooks/carrier nhận shipment_id + trạng thái, đẩy shipping → delivered hoặc shipping → returned; đơn không ở trạng thái tương ứng bị bỏ qua có log (idempotent theo event id)"
                - listitem [ref=f2e377]: "Rate limit tạo đơn: 1 đơn / 10 phút / phone (qua Redis hoặc table đếm), trả 429 có Retry-After; tách riêng rate limit cho auth endpoint"
                - listitem [ref=f2e378]: "Dashboard vận hành: KPI theo ngày (tỉ lệ confirmed/calling, tỉ lệ returned, top agent chốt đơn), bảng lọc đơn theo trạng thái + khoảng ngày, chuyển trạng thái ngay trên hàng (gọi / chốt / reject)"
            - generic [ref=f2e379]:
              - heading "Ngoài phạm vi" [level=4] [ref=f2e380]
              - list [ref=f2e381]:
                - listitem [ref=f2e382]: Tích hợp carrier thật (GHN/GHTK/Viettel Post) — chỉ mock qua webhook nội bộ
                - listitem [ref=f2e383]: Gọi điện SIP/voip thật hoặc SMS OTP — CallLog nhập tay bởi agent
                - listitem [ref=f2e384]: Payment/hoàn tiền thật (chỉ đánh dấu trạng thái, không xử lý tiền)
                - listitem [ref=f2e385]: "Multi-tenant nhiều shop, phân quyền phức tạp — chỉ 2 role: agent và admin"
                - listitem [ref=f2e386]: Đồng bộ đơn từ sàn (Shopee/Lazada) qua API sàn
