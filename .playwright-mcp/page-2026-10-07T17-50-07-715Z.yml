            - paragraph [ref=f2e720]: "Mục tiêu là news feed realtime cho feed network có người nổi tiếng và người thường. Quyết định: fan-out hybrid — dưới ngưỡng follower thì ghi sẵn timeline vào Redis sorted set khi đăng bài, trên ngưỡng thì để reader merge on-read, vì fan-out-on-write tốn O(followers) mỗi post còn on-read tốn O(posts) mỗi load. Hardest bug: timeline mất bài khi follower list thay đổi giữa chừng — lúc user unfollow giữa lúc fan-out đang bơm bài vào ZSET của họ, có post được ghi vào timeline của follower cũ và post mới bị miss vì cursor quét trên snapshot cũ; fix bằng cách lock follow edge trong transaction fan-out + invalidate ZSET của follower đó thay vì bơm tiếp, rồi viết regression test reproduce bằng 2 thread racing. Kết quả đo được từ benchmark trong repo: seed 50k posts, p95 query timeline 48ms (yêu cầu dưới 100ms), benchmark 2 strategy có số thật trong README để defend ngưỡng 10k — và mình ghi rõ ngưỡng là suy ra từ cost measurement vì seed có 1 celebrity account để chạm nhánh on-read."
