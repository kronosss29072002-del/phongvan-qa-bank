            - generic [ref=f2e99]: "#02"
            - heading "MediSlot" [level=3] [ref=f2e100]
            - generic [ref=f2e101]: Nền tảng
            - generic [ref=f2e102]: 4 tuần
            - generic [ref=f2e103]: scheduling
          - paragraph [ref=f2e104]: "Phòng khám nhỏ vẫn ghi lịch hẹn bằng sổ tay hoặc tin nhắn, nên hai người có thể cùng giữ một khung giờ với bác sĩ và nhân viên phải gọi điện xác nhận thủ công. MediSlot là trang đặt lịch khám nơi bệnh nhân tự chọn slot trống theo ngày/dịch vụ/bác sĩ, và hệ thống chặn double-book ngay ở tầng database (partial unique index + transaction) thay vì chỉ check-if-exists trong service — đây chính là điểm khiến dự án đáng giá trong phỏng vấn: bạn chứng minh hiểu race condition thật sự và biết cách để DB là người quyết định, không phải code."
          - generic [ref=f2e105]:
            - generic [ref=f2e106]:
              - heading "Phạm vi" [level=4] [ref=f2e107]
              - list [ref=f2e108]:
                - listitem [ref=f2e109]: Sinh slot tự động theo khung giờ làm việc của từng bác sĩ (VD 8:00–11:30, 13:30–17:00), chia theo duration của dịch vụ (khám tổng quát 20 phút, siêu âm 40 phút) cộng buffer chuyển phòng 5 phút — admin sửa khung giờ thì slot tương lai sinh lại
                - listitem [ref=f2e110]: Booking đã xác nhận không bao giờ bị hủy hoặc hẹn lại ngầm bởi thay đổi khung giờ hay bật blackout; thay đổi chỉ tác động slot available tương lai, và slot generator không sinh giờ chồng lên booking hiện có (block ở tầng tạo slot); conflict còn lại admin tự xử lý thủ công
                - listitem [ref=f2e111]: "Đặt lịch chống trùng: mỗi slot chỉ đặt được 1 lần bằng partial unique index trên (doctorId, startAt) chỉ khi status = 'booked' trong bảng Booking + transaction, map lỗi Prisma P2002 → HTTP 409; stress test 2 request song song cùng slot thì đúng 1 request thành công"
                - listitem [ref=f2e112]: "Quy tắc hủy/đổi: hủy miễn phí trước giờ khám từ 2 giờ trở lên (slot trả về available), dưới 2 giờ chặn với thông báo rõ; lịch đã qua không cho hủy, chỉ admin đánh dấu no-show"
                - listitem [ref=f2e113]: "Ràng buộc thời gian đặt: chỉ nhận lịch trong tương lai và trong vòng 30 ngày tới, từ chối request giả lập clock trước quá khứ hoặc vượt 30 ngày"
                - listitem [ref=f2e114]: Blackout ngày nghỉ lễ VN hardcode trong seed + admin CRUD bật/tắt blackout theo ngày, slot trong ngày blackout không hiển thị cho bệnh nhân
                - listitem [ref=f2e115]: "Auth 2 roles: bệnh nhân đăng nhập bằng JWT (email + password, seed sẵn), admin qua role claim; guard phân quyền trang admin dashboard"
                - listitem [ref=f2e116]: "Admin dashboard: liệt kê lịch theo ngày với 3 trạng thái (booked / cancelled / no-show), filter theo bác sĩ, đếm nhanh số lịch trong ngày"
