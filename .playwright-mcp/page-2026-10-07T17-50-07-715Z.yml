            - heading "FormForge" [level=3] [ref=f2e519]
            - generic [ref=f2e520]: Trung cấp
            - generic [ref=f2e521]: 6 tuần
            - generic [ref=f2e522]: forms
          - paragraph [ref=f2e523]: Nội bộ team dùng Google Form nhưng sửa form là response cũ bị lệch schema, còn Typeform/SurveyMonkey thì đắt và không control được data. FormForge là tool builder cho phép đặt luật nhảy có điều kiện (Q3 = Không → nhảy Q7) và publish form dưới dạng version bất biến — mỗi response được validate đúng version tại thời điểm nộp, sửa form không đụng đến data cũ. Nó đáng build vì buộc bạn design schema immutable + validate theo version, đúng kiểu suy nghĩ data model mà team thật cần thay vì CRUD thuần.
          - generic [ref=f2e524]:
            - generic [ref=f2e525]:
              - heading "Phạm vi" [level=4] [ref=f2e526]
              - list [ref=f2e527]:
                - listitem [ref=f2e528]: Auth JWT email/password (register, login, guard populate req.user, seed 2 account owner/viewer) — không có identity thì guard permission không chạy được
                - listitem [ref=f2e529]: Builder 7 loại field (text, textarea, rating 1-5, single choice, multi choice, dropdown, số) với order/position — v1 reorder bằng nút lên/xuống (drag-drop nằm stretchGoals); mỗi field có config riêng (required, min/max, options) và được Zod-validate cả ở DTO lẫn client
                - listitem [ref=f2e530]: "Skip-logic rule dạng declarative: nếu Q3 = Không → nhảy tới Q7 — trước khi publish, hệ thống build directed graph của rules và từ chối publish nếu graph có vòng (DFS full-cycle, không chỉ self-loop) hoặc trỏ tới field không tồn tại; traversal mặc định khi không rule match: đi field kế theo thứ tự order tăng dần; khi rule match thì các field ở giữa bị skip, skip có transitive (tiếp tục evaluate rule tại đích cho tới khi không match — graph vô vòng nên terminate); dữ liệu trả lời cho field đã skip bị reject"
                - listitem [ref=f2e531]: Publish = tạo FormVersion bất biến (snapshot JSON schema + rules) — draft autosave qua PATCH partial không bao giờ chạm version đã publish; response chỉ trỏ formVersionId, không trỏ formId
                - listitem [ref=f2e532]: "Submit response: server load đúng FormVersion theo id, evaluate skip-path TRƯỚC rồi mới build schema Zod từ snapshot và validate (field bị skip không bị báo required-missing) — sửa form sau submit không revalidate/không làm vỡ response cũ"
                - listitem [ref=f2e533]: "Báo cáo aggregate theo FormVersion được chọn (dropdown chọn version, mặc định version mới nhất; KHÔNG aggregate cross-version vì option-set/rating-config khác nhau): distribution bar cho single/multi choice và dropdown, avg + stddev cho rating, min/max/median cho số — query trên JSONB có expression/GIN index, không load toàn bộ response về Node"
                - listitem [ref=f2e534]: Seed script sinh 10k responses (kèm index migration) để đo claim báo cáo dưới 200ms ngay khi build xong
                - listitem [ref=f2e535]: "Role owner/viewer theo form: owner CRUD + publish, viewer chỉ đọc responses + report; guard qua decorator + Prisma relation check trên mọi write endpoint"
