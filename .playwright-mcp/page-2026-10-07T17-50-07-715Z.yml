            - heading "StockLedger" [level=3] [ref=f2e205]
            - generic [ref=f2e206]: Trung cấp
            - generic [ref=f2e207]: 3 tuần
            - generic [ref=f2e208]: Inventory & Warehousing
          - paragraph [ref=f2e209]: "Team kho ghi tồn bằng tồn -= 1 trên một dòng record, nên hai request reserve chạy song song luôn oversell hoặc lệch sổ mà không ai phát hiện cho tới khi kiểm kho. StockLedger là sổ cái tồn kho append-only: mọi thay đổi tồn là một journal row bất biến kèm reasonCode + actorId, và invariant available = on_hand − reserved được giữ bằng conditional update bên trong transaction cho cả RESERVE, OUT và ADJUST — dev chứng minh mình viết backend có kiểm soát đồng thời và audit trail thật, không chỉ dựng CRUD."
          - generic [ref=f2e210]:
            - generic [ref=f2e211]:
              - heading "Phạm vi" [level=4] [ref=f2e212]
              - list [ref=f2e213]:
                - listitem [ref=f2e214]: "CRUD SKU + vị trí kho với DTO validation Prisma/NestJS: SKU unique, quantity bắt buộc ≥ 0, payload lạ bị reject nhờ whitelist + forbidNonWhitelisted, mọi lỗi trả về đúng mã HTTP"
                - listitem [ref=f2e215]: "Ghi journal append-only với 5 loại movement: IN (nhập), OUT (xuất), ADJUST (kiểm kho), RESERVE (giữ hàng cho đơn), RELEASE (hủy giữ). Mọi dòng bắt buộc có reasonCode + actorId; API không expose endpoint UPDATE/DELETE journal, chỉ INSERT — sửa lịch sử là bug, không phải feature"
                - listitem [ref=f2e216]: "Reserve chống race: chạy trong transaction với conditional update UPDATE stock SET reserved = reserved + qty WHERE sku_id = ... AND on_hand - reserved >= qty; affected row = 0 thì trả 409 OUT_OF_STOCK kèm số available còn lại, không bao giờ cho reserved vượt on_hand"
                - listitem [ref=f2e217]: "OUT guard: UPDATE stock SET on_hand = on_hand - qty WHERE sku_id = ... AND on_hand - reserved >= qty — cùng semantics với RESERVE, không bao giờ đẩy available xuống dưới 0; affected row = 0 → 409 OUT_OF_STOCK"
                - listitem [ref=f2e218]: "ADJUST là số tuyệt đối (kiểm kho): trong transaction đọc on_hand hiện tại, journal ghi delta = new − on_hand, update SET on_hand = new WHERE new >= reserved — new dưới reserved trả 409 (không để kiểm kho âm đầu available)"
                - listitem [ref=f2e219]: "Invariant check chủ động: endpoint đối chiếu tổng signed quantity trong journal với bảng stock theo từng cặp (sku, location) VÀ assert available = on_hand − reserved ≥ 0 trên từng dòng stock; lệch thì trả 500 INTEGRITY_VIOLATION kèm danh sách dòng sai để truy ngược bug"
                - listitem [ref=f2e220]: "Reconciliation script chạy on-demand (không có cron trong scope): đối chiếu journal đã cộng dồn với bảng stock, xuất báo cáo lệch khi mở trang Integrity"
                - listitem [ref=f2e221]: Trang Audit filter journal theo SKU, actor, loại movement, khoảng thời gian; xem lịch sử một SKU dạng timeline để đối chiếu nhanh
                - listitem [ref=f2e222]: Seed script sinh 1000 dòng journal cho ~30 SKU ở 3 kho (kèm fixture oversell cố ý để regression test bắt được)
