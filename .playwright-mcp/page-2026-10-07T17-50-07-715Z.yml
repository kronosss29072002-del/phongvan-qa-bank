          - blockquote [ref=f2e611]:
            - heading "Câu chuyện phỏng vấn" [level=4] [ref=f2e612]
            - paragraph [ref=f2e613]: "Một alert bắn vào DutyBell và 2 engineer cùng mở tab, cùng bấm Ack trong cùng 1 giây — trước khi fix, cả 2 đều được ghi là người ack, escalation timer dừng vô định và audit log ghi 2 dòng mâu thuẫn. Mình viết regression test tái hiện race đó (fail trước), rồi thêm version field vào Incident: ack phải gửi kèm version, update thành updateMany({where: {id, version}}) — row count = 0 nghĩa là đã có người thắng, trả 409 kèm userId của người ack trước, loser thấy toast Đã được ack bởi An. Timer job cũng đọc version trước khi escalate nên không bắn notification trùng. Kết quả: test xanh, double-ack biến mất, và mình có câu chuyện phỏng vấn đủ chi tiết — reproduce → fail test → optimistic locking → mapping lỗi Prisma/HTTP đúng ngữ nghĩa — chứng minh đã gặp và fix race condition thật chứ không chỉ làm CRUD."
          - paragraph [ref=f2e614]:
            - generic [ref=f2e615]: REALITY
            - generic [ref=f2e616]: Calendar tuần làm grid đơn giản ngay từ đầu, đừng bắt đầu với drag-drop fullCalendar; debug idempotency của BullMQ escalation dễ ăn thêm 1–2 ngày ở tuần 3.
