                - listitem [ref=f2e804]: "Audit log mọi thay đổi content: who (user id hoặc API key id) / what (action) / before-after (JSON diff), chỉ admin trong cùng tenant đọc được, kèm trang Audit trong dashboard"
                - listitem [ref=f2e805]: "Production habits: structured logging Pino với correlation ID theo request, endpoint /health (liveness) + /ready (DB/Redis ping), global exception filter map Prisma P2002→409 / P2025→404"
                - listitem [ref=f2e806]: "Phân bổ theo tuần: W1-2 scaffold + tenant repository wrapper + IDOR test · W3 bắt đầu dashboard song song (schema editor, dynamic form) · W4 public API + API key scope · W5 rate limit Lua · W5-6 webhook HMAC + BullMQ retry/DLQ · W6-7 audit + Pino/health · W8 e2e + CI + README; v1 schema editor chỉ là JSON textarea"
