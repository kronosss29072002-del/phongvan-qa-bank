                - listitem [ref=f2e796]: "Role trong tenant tối thiểu: admin (quản lý content type, API key, đọc audit, CRUD content) và member (chỉ CRUD entry) — guard ở service layer, không phải chỉ ở controller"
                - listitem [ref=f2e797]: JWT session auth cho admin dashboard (login / logout / guard), hoạt động song song với API key auth cho public Content API
                - listitem [ref=f2e798]: "Quản lý API key: create / list / revoke, hash khi lưu (không plaintext), show plaintext đúng 1 lần khi create"
                - listitem [ref=f2e799]: "Content type động: mỗi tenant định nghĩa schema JSON (field name, type string/number/boolean/richtext, required, enum) cho article/page/product; mọi entry validate theo schema của tenant tại DTO pipe + service, schema sai → 400 kèm tên field"
                - listitem [ref=f2e800]: "Public Content API dạng REST: GET/POST /v1/content/:type và GET/PATCH/DELETE /v1/content/:type/:id (id nằm ở route param); API key sk_live_<32hex>, scope read chỉ được GET, scope write được POST/PATCH/DELETE; thiếu/sai scope → 403, key hết hạn → 401"
                - listitem [ref=f2e801]: "Rate limit 60 req/ph/key bằng Redis sliding window (sorted set + Lua): trả 429 khi vượt, luôn kèm header X-RateLimit-Limit / X-RateLimit-Remaining / X-RateLimit-Reset, có test hammer 61 request liên tiếp"
                - listitem [ref=f2e802]: "Publish webhook: tenant đăng ký URL, khi entry chuyển sang status published thì POST JSON payload kèm header X-Signature = HMAC-SHA256(body, secret); receiver verify được signature; response 410 → tự đóng subscription"
