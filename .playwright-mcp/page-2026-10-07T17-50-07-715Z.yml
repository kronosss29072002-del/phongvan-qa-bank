              - generic [ref=f2e291]: "Chống SSRF: DNS resolve rồi kiểm tra IP private/loopback/metadata trước khi server-side fetch"
              - generic [ref=f2e292]: Prisma schema design cho self-referencing (replayOfId), cascade delete, query theo retention window
              - generic [ref=f2e293]: Cron job retention với @nestjs/schedule và log quan sát được
              - generic [ref=f2e294]: Polling realtime 2s + JSON detail view trên React (không cần WebSocket phức tạp)
