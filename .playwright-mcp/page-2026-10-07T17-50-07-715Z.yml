            - paragraph [ref=f2e141]: "Problem: phòng khám ghi lịch bằng sổ tay nên hay bị double-book, và version service đầu tiên của mình cũng vậy — code check findUnique rồi mới create, hai request đến gần nhau vẫn both pass. Quyết định: bỏ check-if-exists, đưa ràng buộc xuống database bằng partial unique index trên (doctorId, startAt) chỉ khi status = 'booked' (Prisma previewFeatures partialIndexes hoặc raw SQL migration), bắt lỗi P2002 trong Prisma transaction và map sang 409 Conflict. Khó nhất là viết được integration test chứng minh nó thật sự chặn: spawn 2 request song song cùng 1 slot, assert đúng 1 cái 201 và cái kia 409 — lần đầu test này fail vì mình vẫn để race window giữa check và insert. Kết quả định lượng: 0 ca double-book trong 200 lần chạy song song, thời gian xử lý đặt lịch không đổi (~120ms), và README có đoạn ghi lại đúng tradeoff này (DB constraint mạnh hơn service check vì còn chặn được cả client khác, cron job, admin script trực tiếp DB)."
