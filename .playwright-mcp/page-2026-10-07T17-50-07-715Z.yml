            - paragraph [ref=f2e298]: "Một service thanh toán bên thứ ba gửi webhook về server nội bộ nhưng dev không reproduce được bug chữ ký sai vì không giữ được raw body — quyết định của em là route /ingest/* dùng body parser riêng giữ nguyên bytes thay vì để JSON parse nuốt mất, vì HMAC phải tính trên đúng từng byte đã nhận. Bug khó nhất: replay ban đầu bị ghi thành record mới nên metric requests received tăng ảo mỗi lần bắn lại — em tách schema thành record gốc và record replay (replayOfId nullable) rồi sửa mọi count/query chạy qua 1 hàm duy nhất filter replayOfId IS NULL, viết regression test fail trước khi fix theo đúng bug-fix protocol. Load test 500 request/5 phút (ở mức vượt rate limit 60/phút): mọi request đều nhận response đúng — 200 hoặc 429 kèm Retry-After — không request nào timeout hay treo. Retention cron dọn xong data cũ đúng 1 lần/ngày, và toàn bộ flow ingest → verify → replay chạy live trên VPS với URL thật để demo khi phỏng vấn."
