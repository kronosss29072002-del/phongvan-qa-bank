            - text: in March, we had the pleasure of introducing one of Grafana Labs’ newest team members, Tom Wilkie, who joined as VP, Product with the
            - link "acquisition of Kausal (opens in new tab)" [ref=f38e62] [cursor=pointer]:
              - /url: https://kausal.co/blog/grafana-labs-to-acquire-kausal/
              - text: acquisition of Kausal
            - text: .
          - paragraph [ref=f38e63]: "And he came bearing gifts: his popular talk about the RED Method of monitoring microservices, which he created in 2015."
          - 'heading "Link to section: The USE Method The USE Method" [level=4] [ref=f38e64]':
            - 'link "Link to section: The USE Method"':
              - /url: "#the-use-method"
              - img [aria-hidden] [ref=f38e65] [cursor=pointer]
            - text: The USE Method
          - paragraph [ref=f38e68]:
            - text: In the talk, Tom first went over the USE Method of instrumenting, which has been popularized by
            - link "Brendan Gregg (opens in new tab)" [ref=f38e69] [cursor=pointer]:
              - /url: http://www.brendangregg.com/usemethod.html
              - text: Brendan Gregg
            - text: ":"
          - paragraph [ref=f38e70]:
            - strong [ref=f38e71]: "For every resource, monitor:"
          - list [ref=f38e72]:
            - listitem [ref=f38e73]:
              - generic [ref=f38e74]: Utilization (% time that the resource was busy)
            - listitem [ref=f38e75]:
              - generic [ref=f38e76]: Saturation (amount of work resource has to do, often queue length)
            - listitem [ref=f38e77]:
              - generic [ref=f38e78]: Errors (count of error events)
          - paragraph [ref=f38e79]: “It’s a way of building a checklist that goes through everything,” he said. “It helps you know what you don’t know.” But he pointed out that this method, while useful, is somewhat abstract. Applying it to memory, for instance, is hard. “Memory utilization is tricky. What is it? Do you count caches toward utilization?” he said. “Saturation of memory is kind of a weird one… And what is a memory error? And how do you count them in Linux?”
          - 'heading "Link to section: The RED Method The RED Method" [level=3] [ref=f38e80]':
            - 'link "Link to section: The RED Method"':
              - /url: "#the-red-method"
              - img [aria-hidden] [ref=f38e81] [cursor=pointer]
            - text: The RED Method
          - paragraph [ref=f38e84]: Tom then turned to his RED Method, which he created after a new employee asked what his monitoring philosophy was. “The USE Method doesn’t really apply to services; it applies to hardware, network disks, things like this,” Tom said. “We really wanted a microservices-oriented monitoring philosophy, so we came up with the RED Method.”
          - paragraph [ref=f38e85]:
            - strong [ref=f38e86]: "For every resource, monitor:"
          - list [ref=f38e87]:
            - listitem [ref=f38e88]:
              - generic [ref=f38e89]: Rate (the number of requests per second)
            - listitem [ref=f38e90]:
              - generic [ref=f38e91]: Errors (the number of those requests that are failing)
            - listitem [ref=f38e92]:
              - generic [ref=f38e93]: Duration (the amount of time those requests take)
          - paragraph [ref=f38e94]:
            - text: (See his
            - link "presentation slides (opens in new tab)" [ref=f38e95] [cursor=pointer]:
              - /url: /files/grafanacon_eu_2018/Tom_Wilkie_GrafanaCon_EU_2018.pdf?pg=the-red-method-how-to-instrument-your-services&plcmt=in-text
              - text: presentation slides
            - text: on the
            - link "Prometheus (opens in new tab)" [ref=f38e96] [cursor=pointer]:
              - /url: /oss/prometheus/?pg=the-red-method-how-to-instrument-your-services&plcmt=in-text
              - text: Prometheus
            - text: implementation of the RED Method)
          - paragraph [ref=f38e97]: “Everyone should understand the error rate, the request rate, and then some distribution of latency for those requests,” Tom explained. “You model this for every single service in your architecture, and this gives you a nice, consistent view of how your architecture is behaving. Giving this kind of consistency across services allows you to scale your operational team, and allows you to put people on call for code they didn’t write.”
          - paragraph [ref=f38e98]: Plus, he pointed out, “The RED Method is a good proxy to how happy your customers will be. If you’ve got a high error rate, that’s basically going through to your users and they’re getting page load errors. If you’ve got a high duration, your website is slow. So these are really good metrics for building meaningful alerts and measuring your SLA.”
          - 'heading "Link to section: The Four Golden Signals The Four Golden Signals" [level=4] [ref=f38e99]':
            - 'link "Link to section: The Four Golden Signals"':
              - /url: "#the-four-golden-signals"
              - img [aria-hidden] [ref=f38e100] [cursor=pointer]
            - text: The Four Golden Signals
          - paragraph [ref=f38e103]:
            - text: "Finally, Tom looked at a third method: The Four Golden Signals, which is from"
            - link "Google’s SRE book (opens in new tab)" [ref=f38e104] [cursor=pointer]:
              - /url: https://landing.google.com/sre/book.html
              - text: Google’s SRE book
            - text: .
          - paragraph [ref=f38e105]:
            - strong [ref=f38e106]: "For each service, monitor:"
          - list [ref=f38e107]:
            - listitem [ref=f38e108]:
              - generic [ref=f38e109]: Latency (time taken to serve a request)
            - listitem [ref=f38e110]:
              - generic [ref=f38e111]: Traffic (how much demand is placed on your system)
            - listitem [ref=f38e112]:
              - generic [ref=f38e113]: Errors (rate of requests that are failing)
            - listitem [ref=f38e114]:
              - generic [ref=f38e115]: Saturation (how “full” your service is)
          - paragraph [ref=f38e116]:
            - text: "This is basically the same as the RED Method, but includes saturation. He explained one approach to measuring saturation: “With"
            - link "kube-state-metrics (opens in new tab)" [ref=f38e117] [cursor=pointer]:
              - /url: https://github.com/kubernetes/kube-state-metrics
              - text: kube-state-metrics
            - text: ", a little job you run on your Kubernetes cluster that scrapes the Kubernetes API and exports really interesting metadata about your jobs and services and pods and so on, you can compare the amount of CPU a service is using against its quota. Like how much it should be using, or how much is it allowed to use, as a proportion between 1 and 0. This gives you a measure of how ‘full’ your service is, or some proxy for how full your service is at least. And this is super useful because you could for instance build an alert on this.”"
          - 'heading "Link to section: Two Sides of the Same Coin Two Sides of the Same Coin" [level=4] [ref=f38e118]':
            - 'link "Link to section: Two Sides of the Same Coin"':
              - /url: "#two-sides-of-the-same-coin"
              - img [aria-hidden] [ref=f38e119] [cursor=pointer]
            - text: Two Sides of the Same Coin
          - paragraph [ref=f38e122]: Tom recommended using the USE and RED Methods together. “It’s like the RED Method is about caring about your users and how happy they are,” Tom said, “and the USE Method is about caring about your machines and how happy they are. It’s really just two different views on the same system. They’re complimentary.”
