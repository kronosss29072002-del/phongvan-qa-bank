              - paragraph [ref=f3e292]: Haydistributed lock · fencing token · Redlock · lease
              - paragraph [ref=f3e293]:
                - generic [ref=f3e294]: Vấn đề
                - text: "Lock trong process local vô ích khi có nhiều instance cùng chạy job định kỳ. Đặt distributed lock vẫn chưa đủ: client giữ lock rồi bị GC pause hàng chục giây (trường hợp GitHub thực tế, packet delay ~90s), lease hết hạn, client khác acquire — hai bên cùng tin mình giữ lock và cùng ghi. Kiểm tra lease ngay trước khi ghi cũng vô dụng vì pause có thể xảy ra đúng thời điểm đó."
              - paragraph [ref=f3e295]:
                - generic [ref=f3e296]: Nguồn gốc
                - text: Martin Kleppmann, 'How to do distributed locking' (2016); lease phân tán do Cary Gray & David Cheriton đặt tên, paper SOSP 1989 về cache coherence.
              - paragraph [ref=f3e297]:
                - generic [ref=f3e298]: Xử lý
                - text: Lock service cấp fencing token tăng dần theo mỗi lần acquire; storage từ chối mọi ghi có token nhỏ hơn token đã xử lý — client 'đông băng' cũ thức dậy cũng không thể ghi đè. ZooKeeper dùng zxid làm token; Redlock không có cơ chế này nên không an toàn cho critical section.
