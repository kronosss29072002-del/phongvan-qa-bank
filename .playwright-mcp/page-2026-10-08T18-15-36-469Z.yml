              - paragraph [ref=f3e418]:
                - generic [ref=f3e419]: Vấn đề
                - text: "Config chỉ để đọc mà mỗi lần đọc cũng exclusive-lock thì 1000 request đọc xếp hàng vào nhau, an toàn nhưng throughput không hơn lock độc quyền. Server database cũng thế: 200 session chỉ SELECT mà mỗi cái cũng phải xin lock ghi thì chẳng ai hơn ai."
              - paragraph [ref=f3e420]:
                - generic [ref=f3e421]: Xử lý
                - text: "RWLock cho nhiều reader giữ đồng thời (shared) XOR đúng một writer (exclusive): reader vào được khi không có writer, writer đợi hết reader. Đổi lại writer có thể bị đói khi reader vào liên tục, nên cần biến thể ưu tiên writer hoặc hàng đợi writer; nâng cấp từ read sang write khi đang giữ shared thì dễ deadlock, pattern an toàn là thả read rồi xin lại exclusive."
