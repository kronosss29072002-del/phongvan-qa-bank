              - generic [ref=f3e266]: Trung cấp
            - generic [ref=f3e267]:
              - generic [ref=f3e268]:
                - heading "Consistent hashing & virtual node" [level=4] [ref=f3e269]
                - button "Liên kết tới Consistent hashing & virtual node" [ref=f3e270] [cursor=pointer]: "#"
                - generic [ref=f3e271]: Phân tán & Đồng thời
              - paragraph [ref=f3e272]: Hayconsistent hashing · băm nhất quán · virtual node · vnode · hash ring
              - paragraph [ref=f3e273]:
                - generic [ref=f3e274]: Vấn đề
                - text: "Distribute cache bằng key % N: thêm 1 node thì N đổi → gần như toàn bộ key phải rehash, cache rỗng cùng lúc, request dồn vào DB (cache stampede); node chết cũng vậy. Thêm nữa, 10 node mạnh yếu không đều nhưng hash đều nhau dẫn đến load lệch — node yếu chết chìm."
              - paragraph [ref=f3e275]:
                - generic [ref=f3e276]: Nguồn gốc
                - text: "David Karger và cộng sự (MIT), 'Consistent Hashing and Random Trees: Distributed Caching Protocols for Relieving Hot Spots on the World Wide Web', STOC 1997; virtual node nằm ngay trong paper này để giảm variance phân phối."
              - paragraph [ref=f3e277]:
                - generic [ref=f3e278]: Xử lý
