                - generic [ref=f3e398]: Vấn đề
                - text: "Ghi cùng một bản ghi: pessimistic lock (SELECT FOR UPDATE) giữ lock từ đầu → dưới tải cao, các transaction khác xếp hàng chỉ để đọc, throughput tụt. Optimistic thì cứ đọc-tính-ghi rồi kiểm tra ở commit — nhưng hai bên cùng sửa một dòng thì một bên phải làm lại toàn bộ, client không hiểu vì sao retry."
