                - text: "Thuật toán bầu chọn đảm bảo hai điều kiện: uniqueness (đúng một node tự nhận là leader) và agreement (các node còn lại都知道 leader là ai) — qua token ring, hay lease-based (ZooKeeper ephemeral node, etcd lease) để leader chết thì lease hết hạn và bầu lại."
