              - paragraph [ref=f3e478]: Haysplit-brain · brain split · quorum · majority quorum
              - paragraph [ref=f3e479]:
                - generic [ref=f3e480]: Vấn đề
                - text: "HA cluster mất nhau vì đường heartbeat chết nhưng process vẫn sống: hai node tự cho mình là master, cùng nhận ghi, dữ liệu hai bên lệch nhau — lúc heal là corrupt, phải operator can thiệp tay. Cụm 2 node không có witness thì không ai quyết định được ai là 'đúng'."
              - paragraph [ref=f3e481]:
                - generic [ref=f3e482]: Nguồn gốc
                - text: Quorum (weighted voting) do David Gifford đề xuất, 'Weighted voting for replicated data', 1979; thuật ngữ split-brain thuộc vận hành cluster HA, không rõ tác giả đầu tiên.
