                - button "Liên kết tới Redis lock (SET NX PX)" [ref=f3e434] [cursor=pointer]: "#"
                - generic [ref=f3e435]: Phân tán & Đồng thời
              - paragraph [ref=f3e436]: HaySET NX PX · Redis distributed lock · khóa Redis
              - paragraph [ref=f3e437]:
                - generic [ref=f3e438]: Vấn đề
                - text: "Nhiều instance cùng chạy một job định kỳ (cron quét đơn hàng, worker gửi email) thì mỗi chu kỳ có thể chạy 3 lần. Lấy lock trên Redis là cách rẻ nhất, nhưng bẫy dễ rơi vào: tách SET rồi EXPIRE thành hai lệnh, client chết giữa hai lệnh thì lock treo cho tới lúc Redis xóa key; process chết sau khi SET cũng y như vậy. Gộp thành một lệnh SET NX PX thì an toàn hơn, nhưng TTL vẫn hữu hạn: TTL hết giữa lúc critical section đang chạy thì instance khác acquire được ngay, hai bên cùng ghi."
              - paragraph [ref=f3e439]:
                - generic [ref=f3e440]: Xử lý
                - text: "Một lệnh atomic: `SET lock:job <token> NX PX 30000`, token là UUID sinh riêng cho từng lần giữ lock. Giải phóng bằng script Lua so token rồi DEL, để không xóa nhầm lock của người khác. Holder còn sống thì watchdog timer tự gia hạn TTL ở khoảng 1/3 giá trị (Redisson làm thế). Đổi lại, nếu TTL hết thật giữa chừng thì exclusivity mất, nên section nào bắt buộc không bị ghi chồng vẫn cần fencing token ở tầng storage."
