              - generic [ref=f3e222]: № 174
              - generic [ref=f3e223]: I
              - generic [ref=f3e224]: Trung cấp
            - generic [ref=f3e225]:
              - generic [ref=f3e226]:
                - heading "2PC/3PC & distributed transaction" [level=4] [ref=f3e227]
                - button "Liên kết tới 2PC/3PC & distributed transaction" [ref=f3e228] [cursor=pointer]: "#"
                - generic [ref=f3e229]: Phân tán & Đồng thời
              - paragraph [ref=f3e230]: Haytwo-phase commit · 2PC · three-phase commit · 3PC · distributed transaction
              - paragraph [ref=f3e231]:
                - generic [ref=f3e232]: Vấn đề
                - text: "Transaction trải qua hai database/service (trừ tiền ở DB A, ghi sổ ở DB B): commit riêng lẻ thì A commit xong B fail là tiền biến mất. Cần tất cả cùng quyết định commit hoặc abort — nhưng 2PC blocking: sau khi participant đã vote yes mà coordinator chết, participant giữ lock chờ vô hạn, dòng đó bị khóa cả chục phút."
              - paragraph [ref=f3e233]:
                - generic [ref=f3e234]: Nguồn gốc
                - text: không rõ (được Bernstein, Hadzilacos & Goodman, 'Concurrency Control and Recovery in Database Systems' 1987 tài liệu hóa; thường ghi nhận từ công việc của Jim Gray cuối thập niên 1970, chưa verify trực tiếp).
              - paragraph [ref=f3e235]:
                - generic [ref=f3e236]: Xử lý
                - text: "2PC: phase 1 prepare/vote, phase 2 broadcast commit/abort — an toàn nhưng blocking; 3PC thêm phase pre-commit với timeout để participant tự quyết định khi coordinator mất, giảm blocking (vẫn không an toàn tuyệt đối khi network partition)."
