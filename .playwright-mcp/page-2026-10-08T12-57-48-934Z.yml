          - heading "Introduction to exemplars" [level=1] [ref=f68e70]
          - paragraph [ref=f68e71]: An exemplar is a specific trace representative of measurement taken in a given time interval. While metrics excel at giving you an aggregated view of your system, traces give you a fine grained view of a single request; exemplars are a way to link the two.
          - paragraph [ref=f68e72]: Suppose your company website is experiencing a surge in traffic volumes. While more than eighty percent of the users are able to access the website in under two seconds, some users are experiencing a higher than normal response time resulting in bad user experience.
          - paragraph [ref=f68e73]: To identify the factors that are contributing to the latency, you must compare a trace for a fast response against a trace for a slow response. Given the vast amount of data in a typical production environment, it’s an extremely laborious and time-consuming effort.
          - paragraph [ref=f68e74]: Use exemplars to help isolate problems within your data distribution by pinpointing query traces exhibiting high latency within a time interval. After you localize the latency problem to a few exemplar traces, you can combine it with additional system based information or location properties to perform a root cause analysis faster, leading to quick resolutions to performance issues.
          - paragraph [ref=f68e75]:
            - text: Support for exemplars is available for the Prometheus data source only. After you enable the functionality, exemplar data is available by default. For more information on exemplar configuration and how to enable exemplars, refer to the Exemplars section in
            - link "Prometheus configuration options" [ref=f68e76] [cursor=pointer]:
              - /url: /docs/grafana/latest/datasources/prometheus/configure/#configuration-options
            - text: .
          - paragraph [ref=f68e77]:
            - text: Grafana shows exemplars alongside a metric in the Explore view and in dashboards. Each exemplar displays as a highlighted star. You can hover your cursor over an exemplar to view the unique trace ID, which is a combination of a key value pair. To investigate further, click the blue button next to the
            - code [ref=f68e78]: traceID
            - text: property.
          - figure [ref=f68e79]:
            - link "Screenshot showing the detail window of an exemplar Screenshot showing the detail window of an exemplar" [ref=f68e80] [cursor=pointer]:
              - /url: /media/docs/grafana/exemplars/screenshot-exemplars.png
              - img "Screenshot showing the detail window of an exemplar" [ref=f68e82]
              - generic [ref=f68e83]: Screenshot showing the detail window of an exemplar
          - paragraph [ref=f68e84]:
            - text: Refer to
            - link "View exemplar data" [ref=f68e85] [cursor=pointer]:
              - /url: "#view-exemplar-data"
            - text: for instructions on how to drill down and view exemplar trace details from metrics and logs. To know more about exemplars, refer to the blog post
            - link "Intro to exemplars, which enable Grafana Tempo’s distributed tracing at massive scale" [ref=f68e86] [cursor=pointer]:
              - /url: /blog/2021/03/31/intro-to-exemplars-which-enable-grafana-tempos-distributed-tracing-at-massive-scale/
            - text: .
          - heading "View exemplar data" [level=2] [ref=f68e87]
          - paragraph [ref=f68e88]: When support for exemplar support is enabled for a Prometheus data source, you can view exemplar data either in the Explore view or from the Loki log details.
          - heading "In Explore" [level=3] [ref=f68e89]
          - paragraph [ref=f68e90]:
            - text: Explore visualizes exemplar traces as highlighted stars alongside metrics data. For more information on how Explore visualizes trace data, refer to
            - link "Tracing in Explore" [ref=f68e91] [cursor=pointer]:
              - /url: ../../explore/trace-integration/
            - text: .
          - paragraph [ref=f68e92]: "To examine the details of an exemplar trace:"
          - list [ref=f68e93]:
            - listitem [ref=f68e94]:
              - paragraph [ref=f68e95]:
                - text: Place your cursor over an exemplar (highlighted star). Depending on the trace data source you are using, you may see a blue button with the label
                - code [ref=f68e96]: Query with <DATA SOURCE NAME>
                - text: . In the following example, the tracing data source is Tempo.
              - figure [ref=f68e97]:
                - link "Screenshot showing exemplar details" [ref=f68e98] [cursor=pointer]:
                  - /url: /media/docs/grafana/exemplars/screenshot-exemplar-details.png
            - listitem [ref=f68e101]:
              - paragraph [ref=f68e102]:
                - text: Click the
                - strong [ref=f68e103]: Query with Tempo
                - text: option next to the
                - code [ref=f68e104]: traceID
                - text: property. The trace details, including the spans within the trace are listed in a separate panel on the right.
              - figure [ref=f68e105]:
                - link "Explorer view with panel showing trace details" [ref=f68e106] [cursor=pointer]:
                  - /url: /media/docs/grafana/exemplars/screenshot-exemplar-explore-view.png
          - paragraph [ref=f68e109]:
            - text: For more information on how to drill down and analyze the trace and span details, refer to the
            - link "Analyze trace and span details" [ref=f68e110] [cursor=pointer]:
              - /url: "#analyze-trace-and-spans"
            - text: section.
          - heading "In logs" [level=3] [ref=f68e111]
          - paragraph [ref=f68e112]:
            - text: You can also view exemplar trace details from the Loki logs in Explore. Use regular expressions within the Derived fields links for Loki to extract the
            - code [ref=f68e113]: traceID
            - text: information. Now when you expand Loki logs, you can see a
            - code [ref=f68e114]: traceID
            - text: property under the
            - strong [ref=f68e115]: Detected fields
            - text: section. To learn more about how to extract a part of a log message into an internal or external link, refer to
            - link "using derived fields in Loki" [ref=f68e116] [cursor=pointer]:
              - /url: ../../explore/logs-integration/
            - text: .
          - paragraph [ref=f68e117]: "To view the details of an exemplar trace:"
          - list [ref=f68e118]:
            - listitem [ref=f68e119]:
              - paragraph [ref=f68e120]:
                - text: Expand a log line and scroll down to the
                - code [ref=f68e121]: Fields
                - text: section. Depending on your backend trace data source, you may see a blue button with the label
                - code [ref=f68e122]: <DATA SOURCE NAME>
                - text: .
            - listitem [ref=f68e123]:
              - paragraph [ref=f68e124]:
                - text: Click the blue button next to the
                - code [ref=f68e125]: traceID
                - text: property. Typically, it has the name of the backend data source. In the following example, the tracing data source is Tempo. The trace details, including the spans within the trace are listed in a separate panel on the right.
          - figure [ref=f68e126]:
            - link "Explorer view with panel showing trace details" [ref=f68e127] [cursor=pointer]:
              - /url: /media/docs/grafana/exemplars/screenshot-exemplar-loki-logs.png
          - paragraph [ref=f68e130]:
            - text: For more information on how to drill down and analyze the trace and span details, refer to the
            - link "Analyze trace and span details" [ref=f68e131] [cursor=pointer]:
              - /url: "#analyze-trace-and-spans"
            - text: section.
          - heading "Analyze trace and spans" [level=3] [ref=f68e132]
          - paragraph [ref=f68e133]: This panel shows the details of the trace in different segments.
          - list [ref=f68e134]:
            - listitem [ref=f68e135]:
              - paragraph [ref=f68e136]: The top segment displays the trace ID to indicate that the query results correspond to the specific trace.
              - paragraph [ref=f68e137]:
                - text: You can add more traces to the results using the
                - code [ref=f68e138]: Add query
                - text: button.
            - listitem [ref=f68e139]:
              - paragraph [ref=f68e140]: The next segment shows the entire span for the specific trace as a narrow strip. All levels of the trace from the client all the way down to database query is displayed, which provides a bird’s eye view of the time distribution across all layers over which the HTTP request was processed.
              - list [ref=f68e141]:
                - listitem [ref=f68e142]:
                  - paragraph [ref=f68e143]: You can click within this strip view to display a magnified view of a smaller time segment within the span. This magnified view shows up in the bottom segment of the panel.
                - listitem [ref=f68e144]:
                  - paragraph [ref=f68e145]: In the magnified view, you can expand or collapse the various levels of the trace to drill down to the specific span of interest.
                  - paragraph [ref=f68e146]: For example, if the strip view shows that most of the latency was within the app layer, you can expand the trace down the app layer to investigate the problem further. To expand a particular layer of span, click the left icon. The same button can collapse an expanded span.
            - listitem [ref=f68e147]:
              - paragraph [ref=f68e148]: To see the details of the span at any level, click the span itself.
              - paragraph [ref=f68e149]: This displays additional metadata associated with the span. The metadata itself is initially shown in a narrow strip but you can see more details by clicking the metadata strip.
              - figure [ref=f68e150]:
                - link "Span details" [ref=f68e151] [cursor=pointer]:
                  - /url: /media/docs/grafana/exemplars/screenshot-exemplar-span-details.png
