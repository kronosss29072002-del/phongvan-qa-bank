            - text: You can find much more detail on this and related techniques from the
            - link "Continuous Delivery book" [ref=f3e76] [cursor=pointer]:
              - /url: /books/continuousDelivery.html
            - text: by Jez Humble and Dave Farley. My
            - link "guide page on delivery" [ref=f3e77] [cursor=pointer]:
              - /url: /delivery.html
            - text: points to more material on these topcis.
