- main [ref=f61e2]:
  - generic [ref=f61e5]:
    - generic [ref=f61e6] [cursor=pointer]
    - heading "Chapter 22 - Addressing Cascading Failures" [level=2] [ref=f61e7]
  - main [ref=f61e8]:
    - generic [ref=f61e9]:
      - heading "Addressing Cascading Failures" [level=1] [ref=f61e10]
      - paragraph [ref=f61e11]: Written by Mike Ulrich
      - blockquote [ref=f61e12]:
        - paragraph [ref=f61e13]: If at first you don't succeed, back off exponentially.
        - paragraph [ref=f61e14]: Dan Sandler, Google Software Engineer
      - blockquote [ref=f61e15]:
        - paragraph [ref=f61e16]: Why do people always forget that you need to add a little jitter?
        - paragraph [ref=f61e17]: Ade Oshineye, Google Developer Advocate
      - paragraph [ref=f61e18]:
        - text: A cascading failure is a failure that grows over time as a result of positive feedback.
        - superscript [ref=f61e19]:
          - link "107" [ref=f61e20] [cursor=pointer]:
            - /url: "#id-GbduZFnh9"
        - text: It can occur when a portion of an overall system fails, increasing the probability that other portions of the system fail. For example, a single replica for a service can fail due to overload, increasing load on remaining replicas and increasing their probability of failing, causing a domino effect that takes down all the replicas for a service.
      - paragraph [ref=f61e21]:
        - text: We’ll use the Shakespeare search service discussed in
        - 'link "Shakespeare: A Sample Service" [ref=f61e22] [cursor=pointer]':
          - /url: /sre-book/production-environment#xref_production-environment_shakespeare
        - text: as an example throughout this chapter. Its production configuration might look something like
        - link "Figure 22-1" [ref=f61e23] [cursor=pointer]:
          - /url: "#fig_cascading-failure_basic-architecture"
        - text: .
      - figure "Figure 22-1. Example production configuration for the Shakespeare search service" [ref=f61e24]:
        - img "Example production configuration for the Shakespeare search service." [ref=f61e25]
      - heading "Causes of Cascading Failures and Designing to Avoid Them" [level=2] [ref=f61e27]
      - paragraph [ref=f61e28]: Well-thought-out system design should take into account a few typical scenarios that account for the majority of cascading failures.
      - heading "Server Overload" [level=2] [ref=f61e29]
      - paragraph [ref=f61e30]: The most common cause of cascading failures is overload. Most cascading failures described here are either directly due to server overload, or due to extensions or variations of this scenario.
      - paragraph [ref=f61e31]:
        - text: Suppose the frontend in cluster A is handling 1,000 requests per second (QPS), as in
        - link "Figure 22-2" [ref=f61e32] [cursor=pointer]:
          - /url: "#fig_cascading-failure_load-distribution"
        - text: .
      - figure "Figure 22-2. Normal server load distribution between clusters A and B" [ref=f61e33]:
        - img "Normal server load distribution between clusters A and B." [ref=f61e34]
      - paragraph [ref=f61e36]:
        - text: If cluster B fails (
        - link "Figure 22-3" [ref=f61e37] [cursor=pointer]:
          - /url: "#fig_cascading-failure_failure-load-distribution"
        - text: ), requests to cluster A increase to 1,200 QPS. The frontends in A are not able to handle requests at 1,200 QPS, and therefore start running out of resources, which causes them to crash, miss deadlines, or otherwise misbehave. As a result, the rate of successfully handled requests in A dips well below 1,000 QPS.
      - figure "Figure 22-3. Cluster B fails, sending all traffic to cluster A" [ref=f61e38]:
        - img "Cluster B fails, sending all traffic to cluster A." [ref=f61e39]
      - paragraph [ref=f61e41]:
        - text: This reduction in the rate of useful work being done can spread into other failure domains, potentially spreading globally. For example, local overload in one cluster may lead to its servers crashing; in response, the load balancing controller sends requests to other clusters, overloading their servers, leading to a service-wide overload failure. It may not take long for these events to transpire (e.g., on the order of a couple minutes), because the
        - link "load balancer" [ref=f61e42] [cursor=pointer]:
          - /url: /sre-book/handling-overload/
        - text: and task scheduling systems involved may act very quickly.
      - heading "Resource Exhaustion" [level=2] [ref=f61e43]
      - paragraph [ref=f61e44]: "Running out of a resource can result in higher latency, elevated error rates, or the substitution of lower-quality results. These are in fact desired effects of running out of resources: something eventually needs to give as the load increases beyond what a server can handle."
      - paragraph [ref=f61e45]: Depending on what resource becomes exhausted in a server and how the server is built, resource exhaustion can render the server less efficient or cause the server to crash, prompting the load balancer to distribute the resource problems to other servers. When this happens, the rate of successfully handled requests can drop and possibly send the cluster or an entire service into a cascade failure.
      - paragraph [ref=f61e46]: Different types of resources can be exhausted, resulting in varying effects on servers.
      - heading "CPU" [level=3] [ref=f61e47]
      - paragraph [ref=f61e48]: "If there is insufficient CPU to handle the request load, typically all requests become slower. This scenario can result in various secondary effects, including the following:"
      - generic [ref=f61e49]:
        - term [ref=f61e50]: Increased number of in-flight requests
        - definition [ref=f61e51]: Because requests take longer to handle, more requests are handled concurrently (up to a possible maximum capacity at which queuing may occur). This affects almost all resources, including memory, number of active threads (in a thread-per-request server model), number of file descriptors, and backend resources (which in turn can have other effects).
        - term [ref=f61e52]: Excessively long queue lengths
        - definition [ref=f61e53]:
          - text: If there is insufficient capacity to handle all the requests at steady state, the server will saturate its queues. This means that latency increases (the requests are queued for longer amounts of time) and the queue uses more memory. See
          - link "Queue Management" [ref=f61e54] [cursor=pointer]:
            - /url: "#xref_cascading-failure_queue-management"
          - text: for a discussion of mitigation strategies.
        - term [ref=f61e55]: Thread starvation
        - definition [ref=f61e56]: When a thread can’t make progress because it’s waiting for a lock, health checks may fail if the health check endpoint can’t be served in time.
        - term [ref=f61e57]: CPU or request starvation
        - definition [ref=f61e58]:
          - text: Internal watchdogs
          - superscript [ref=f61e59]:
            - link "108" [ref=f61e60] [cursor=pointer]:
              - /url: "#id-p8BuzSVSmijIlh0tjiq"
          - text: in the server detect that the server isn’t making progress, causing the servers to crash due to CPU starvation, or due to request starvation if watchdog events are triggered remotely and processed as part of the request queue.
        - term [ref=f61e61]: Missed RPC deadlines
        - definition [ref=f61e62]: As a server becomes overloaded, its responses to RPCs from its clients arrive later, which may exceed any deadlines those clients set. The work the server did to respond is then wasted, and clients may retry the RPCs, leading to even more overload.
        - term [ref=f61e63]: Reduced CPU caching benefits
        - definition [ref=f61e64]: As more CPU is used, the chance of spilling on to more cores increases, resulting in decreased usage of local caches and decreased CPU efficiency.
      - heading "Memory" [level=3] [ref=f61e65]
      - paragraph [ref=f61e66]: "If nothing else, more in-flight requests consume more RAM from allocating the request, response, and RPC objects. Memory exhaustion can cause the following effects:"
      - generic [ref=f61e67]:
        - term [ref=f61e68]: Dying tasks
        - definition [ref=f61e69]: For example, a task might be evicted by the container manager (VM or otherwise) for exceeding available resource limits, or application-specific crashes may cause tasks to die.
        - term [ref=f61e70]: Increased rate of garbage collection (GC) in Java, resulting in increased CPU usage
        - definition [ref=f61e71]: "A vicious cycle can occur in this scenario: less CPU is available, resulting in slower requests, resulting in increased RAM usage, resulting in more GC, resulting in even lower availability of CPU. This is known colloquially as the “GC death spiral.”"
        - term [ref=f61e72]: Reduction in cache hit rates
        - definition [ref=f61e73]: Reduction in available RAM can reduce application-level cache hit rates, resulting in more RPCs to the backends, which can possibly cause the backends to become overloaded.
      - heading "Threads" [level=3] [ref=f61e74]
      - paragraph [ref=f61e75]: Thread starvation can directly cause errors or lead to health check failures. If the server adds threads as needed, thread overhead can use too much RAM. In extreme cases, thread starvation can also cause you to run out of process IDs.
      - heading "File descriptors" [level=3] [ref=f61e76]
      - paragraph [ref=f61e77]: Running out of file descriptors can lead to the inability to initialize network connections, which in turn can cause health checks to fail.
      - heading "Dependencies among resources" [level=3] [ref=f61e78]
      - paragraph [ref=f61e79]:
        - text: Note that many of these resource exhaustion scenarios feed from one another—a
        - link "service experiencing overload" [ref=f61e80] [cursor=pointer]:
          - /url: ../../workbook/overload/
        - text: often has a host of secondary symptoms that can look like the root cause, making debugging difficult.
      - paragraph [ref=f61e81]: "For example, imagine the following scenario:"
      - list [ref=f61e82]:
        - listitem [ref=f61e83]: A Java frontend has poorly tuned garbage collection (GC) parameters.
        - listitem [ref=f61e84]: Under high (but expected) load, the frontend runs out of CPU due to GC.
        - listitem [ref=f61e85]: CPU exhaustion slows down completion of requests.
        - listitem [ref=f61e86]: The increased number of in-progress requests causes more RAM to be used to process the requests.
        - listitem [ref=f61e87]: Memory pressure due to requests, in combination with a fixed memory allocation for the frontend process as a whole, leaves less RAM available for caching.
        - listitem [ref=f61e88]: The reduced cache size means fewer entries in the cache, in addition to a lower hit rate.
        - listitem [ref=f61e89]: The increase in cache misses means that more requests fall through to the backend for servicing.
        - listitem [ref=f61e90]: The backend, in turn, runs out of CPU or threads.
        - listitem [ref=f61e91]: Finally, the lack of CPU causes basic health checks to fail, starting a cascading failure.
      - paragraph [ref=f61e92]: In situations as complex as the preceding scenario, it’s unlikely that the causal chain will be fully diagnosed during an outage. It might be very hard to determine that the backend crash was caused by a decrease in the cache rate in the frontend, particularly if the frontend and backend components have different owners.
      - heading "Service Unavailability" [level=2] [ref=f61e93]
      - paragraph [ref=f61e94]: Resource exhaustion can lead to servers crashing; for example, servers might crash when too much RAM is allocated to a container. Once a couple of servers crash on overload, the load on the remaining servers can increase, causing them to crash as well. The problem tends to snowball and soon all servers begin to crash-loop. It’s often difficult to escape this scenario because as soon as servers come back online they’re bombarded with an extremely high rate of requests and fail almost immediately.
      - paragraph [ref=f61e95]: "For example, if a service was healthy at 10,000 QPS, but started a cascading failure due to crashes at 11,000 QPS, dropping the load to 9,000 QPS will almost certainly not stop the crashes. This is because the service will be handling increased demand with reduced capacity; only a small fraction of servers will usually be healthy enough to handle requests. The fraction of servers that will be healthy depends on a few factors: how quickly the system is able to start the tasks, how quickly the binary can start serving at full capacity, and how long a freshly started task is able to survive the load. In this example, if 10% of the servers are healthy enough to handle requests, the request rate would need to drop to about 1,000 QPS in order for the system to stabilize and recover."
      - paragraph [ref=f61e96]:
        - text: "Similarly, servers can appear unhealthy to the load balancing layer, resulting in reduced load balancing capacity: servers may go into “lame duck” state (see"
        - 'link "A Robust Approach to Unhealthy Tasks: Lame Duck State" [ref=f61e97] [cursor=pointer]':
          - /url: /sre-book/load-balancing-datacenter#robust_approach_lame_duck
        - text: ") or fail health checks without crashing. The effect can be very similar to crashing: more servers appear unhealthy, the healthy servers tend to accept requests for a very brief period of time before becoming unhealthy, and fewer servers participate in handling requests."
      - paragraph [ref=f61e98]: Load balancing policies that avoid servers that have served errors can exacerbate problems further—a few backends serve some errors, so they don’t contribute to the available capacity for the service. This increases the load on the remaining servers, starting the snowball effect.
      - heading "Preventing Server Overload" [level=1] [ref=f61e99]
      - paragraph [ref=f61e100]:
        - text: The following list presents strategies for
        - link "avoiding server overload" [ref=f61e101] [cursor=pointer]:
          - /url: ../../sre-book/handling-overload/
        - text: "in rough priority order:"
      - generic [ref=f61e102]:
        - term [ref=f61e103]: Load test the server’s capacity limits, and test the failure mode for overload
        - definition [ref=f61e104]:
          - text: This is the most important exercise you should conduct in order to prevent server overload. Unless you test in a realistic environment, it’s very hard to predict exactly which resource will be exhausted and how that resource exhaustion will manifest. For details, see
          - link "Testing for Cascading Failures" [ref=f61e105] [cursor=pointer]:
            - /url: "#xref_cascading-failure_testing"
          - text: .
        - term [ref=f61e106]: Serve degraded results
        - definition [ref=f61e107]:
          - text: Serve lower-quality, cheaper-to-compute results to the user. Your strategy here will be service-specific. See
          - link "Load Shedding and Graceful Degradation" [ref=f61e108] [cursor=pointer]:
            - /url: "#xref_cascading-failure_load-shed-graceful-degredation"
          - text: .
        - term [ref=f61e109]: Instrument the server to reject requests when overloaded
        - definition [ref=f61e110]:
          - text: Servers should protect themselves from becoming overloaded and crashing. When overloaded at either the frontend or backend layers, fail early and cheaply. For details, see
          - link "Load Shedding and Graceful Degradation" [ref=f61e111] [cursor=pointer]:
            - /url: "#xref_cascading-failure_load-shed-graceful-degredation"
          - text: .
        - term [ref=f61e112]: Instrument higher-level systems to reject requests, rather than overloading servers
        - definition [ref=f61e113]: "Note that because rate limiting often doesn’t take overall service health into account, it may not be able to stop a failure that has already begun. Simple rate-limiting implementations are also likely to leave capacity unused. Rate limiting can be implemented in a number of places:"
        - definition [ref=f61e114]:
          - list [ref=f61e115]:
            - listitem [ref=f61e116]:
              - emphasis [ref=f61e117]: At the reverse proxies
              - text: ", by limiting the volume of requests by criteria such as IP address to mitigate attempted denial-of-service attacks and abusive clients."
            - listitem [ref=f61e118]:
              - emphasis [ref=f61e119]: At the load balancers
              - text: ", by dropping requests when the service enters global overload. Depending on the nature and complexity of the service, this rate limiting can be indiscriminate (“drop all traffic above X requests per second”) or more selective (“drop requests that aren’t from users who have recently interacted with the service” or “drop requests for low-priority operations like background synchronization, but keep serving interactive user sessions”)."
            - listitem [ref=f61e120]:
              - emphasis [ref=f61e121]: At individual tasks
              - text: ", to prevent random fluctuations in load balancing from overwhelming the server."
        - term [ref=f61e122]: Perform capacity planning
        - definition [ref=f61e123]:
          - text: Good capacity planning can reduce the probability that a cascading failure will occur. Capacity planning should be coupled with performance testing to determine the load at which the service will fail. For instance, if every cluster’s breaking point is 5,000 QPS, the load is evenly spread across clusters,
          - superscript [ref=f61e124]:
            - link "109" [ref=f61e125] [cursor=pointer]:
              - /url: "#id-jE2ujIQSjUEIKuv"
          - text: and the service’s peak load is 19,000 QPS, then approximately six clusters are needed to run the service at
          - emphasis [ref=f61e126]: "N"
          - text: + 2.
      - paragraph [ref=f61e127]: Capacity planning reduces the probability of triggering a cascading failure, but it is not sufficient to protect the service from cascading failures. When you lose major parts of your infrastructure during a planned or unplanned event, no amount of capacity planning may be sufficient to prevent cascading failures. Load balancing problems, network partitions, or unexpected traffic increases can create pockets of high load beyond what was planned. Some systems can grow the number of tasks for your service on demand, which may prevent overload; however, proper capacity planning is still needed.
      - heading "Queue Management" [level=2] [ref=f61e128]
      - paragraph [ref=f61e129]: Most thread-per-request servers use a queue in front of a thread pool to handle requests. Requests come in, they sit on a queue, and then threads pick requests off the queue and perform the actual work (whatever actions are required by the server). Usually, if the queue is full, the server will reject new requests.
      - paragraph [ref=f61e130]: "If the request rate and latency of a given task is constant, there is no reason to queue requests: a constant number of threads should be occupied. Under this idealized scenario, requests will only be queued if the steady state rate of incoming requests exceeds the rate at which the server can process requests, which results in saturation of both the thread pool and the queue."
      - paragraph [ref=f61e131]: Queued requests consume memory and increase latency. For example, if the queue size is 10x the number of threads, the time to handle the request on a thread is 100 milliseconds. If the queue is full, then a request will take 1.1 seconds to handle, most of which time is spent on the queue.
      - paragraph [ref=f61e132]: For a system with fairly steady traffic over time, it is usually better to have small queue lengths relative to the thread pool size (e.g., 50% or less), which results in the server rejecting requests early when it can’t sustain the rate of incoming requests. For example, Gmail often uses queueless servers, relying instead on failover to other server tasks when the threads are full. On the other end of the spectrum, systems with “bursty” load for which traffic patterns fluctuate drastically may do better with a queue size based on the current number of threads in use, processing time for each request, and the size and frequency of bursts.
      - heading "Load Shedding and Graceful Degradation" [level=2] [ref=f61e133]
      - paragraph [ref=f61e134]:
        - emphasis [ref=f61e135]: Load shedding
        - text: drops some proportion of load by dropping traffic as the server approaches overload conditions. The goal is to keep the server from running out of RAM, failing health checks, serving with extremely high latency, or any of the other symptoms associated with overload, while still doing as much useful work as it can.
      - paragraph [ref=f61e136]:
        - text: One straightforward way to shed load is to do per-task throttling based on CPU, memory, or queue length; limiting queue length as discussed in
        - link "Queue Management" [ref=f61e137] [cursor=pointer]:
          - /url: "#xref_cascading-failure_queue-management"
        - text: is a form of this strategy. For example, one effective approach is to return an HTTP 503 (service unavailable) to any incoming request when there are more than a given number of client requests in flight.
      - paragraph [ref=f61e138]:
        - text: Changing the queuing method from the standard
        - emphasis [ref=f61e139]: first-in, first-out
        - text: (FIFO) to
        - emphasis [ref=f61e140]: last-in, first-out
        - text: (LIFO) or using the
        - emphasis [ref=f61e141]: controlled delay
        - text: (CoDel) algorithm
        - link "[Nic12]" [ref=f61e142] [cursor=pointer]:
          - /url: /sre-book/bibliography#Nic12
        - text: or similar approaches can reduce load by removing requests that are unlikely to be worth processing
        - link "[Mau15]" [ref=f61e143] [cursor=pointer]:
          - /url: /sre-book/bibliography#Mau15
        - text: ". If a user’s web search is slow because an RPC has been queued for 10 seconds, there’s a good chance the user has given up and refreshed their browser, issuing another request: there’s no point in responding to the first one, since it will be ignored! This strategy works well when combined with propagating RPC deadlines throughout the stack, described in"
        - link "Latency and Deadlines" [ref=f61e144] [cursor=pointer]:
          - /url: "#xref_cascading-failure_latency-and-deadlines"
        - text: .
      - paragraph [ref=f61e145]: More sophisticated approaches include identifying clients to be more selective about what work is dropped, or picking requests that are more important and prioritizing. Such strategies are more likely to be needed for shared services.
      - paragraph [ref=f61e146]:
        - emphasis [ref=f61e147]: Graceful degradation
        - text: takes the concept of load shedding one step further by reducing the amount of work that needs to be performed. In some applications, it’s possible to significantly decrease the amount of work or time needed by decreasing the quality of responses. For instance, a search application might only search a subset of data stored in an in-memory cache rather than the full on-disk database or use a less-accurate (but faster) ranking algorithm when overloaded.
      - paragraph [ref=f61e148]: "When evaluating load shedding or graceful degradation options for your service, consider the following:"
      - list [ref=f61e149]:
        - listitem [ref=f61e150]: Which metrics should you use to determine when load shedding or graceful degradation should kick in (e.g,. CPU usage, latency, queue length, number of threads used, whether your service enters degraded mode automatically or if manual intervention is necessary)?
        - listitem [ref=f61e151]: What actions should be taken when the server is in degraded mode?
        - listitem [ref=f61e152]: At what layer should load shedding and graceful degradation be implemented? Does it make sense to implement these strategies at every layer in the stack, or is it sufficient to have a high-level choke-point?
      - paragraph [ref=f61e153]: "As you evaluate options and deploy, keep the following in mind:"
      - list [ref=f61e154]:
        - listitem [ref=f61e155]: Graceful degradation shouldn’t trigger very often—usually in cases of a capacity planning failure or unexpected load shift. Keep the system simple and understandable, particularly if it isn’t used often.
        - listitem [ref=f61e156]:
          - text: Remember that the code path you never use is the code path that (often) doesn’t work. In steady-state operation, graceful degradation mode won’t be used, implying that you’ll have much less operational experience with this mode and any of its quirks, which
          - emphasis [ref=f61e157]: increases
          - text: the level of risk. You can make sure that graceful degradation stays working by regularly running a small subset of servers near overload in order to exercise this code path.
        - listitem [ref=f61e158]: Monitor and alert when too many servers enter these modes.
        - listitem [ref=f61e159]: Complex load shedding and graceful degradation can cause problems themselves—excessive complexity may cause the server to trip into a degraded mode when it is not desired, or enter feedback cycles at undesired times. Design a way to quickly turn off complex graceful degradation or tune parameters if needed. Storing this configuration in a consistent system that each server can watch for changes, such as Chubby, can increase deployment speed, but also introduces its own risks of synchronized failure.
      - heading "Retries" [level=2] [ref=f61e160]
      - paragraph [ref=f61e161]: "Suppose the code in the frontend that talks to the backend implements retries naively. It retries after encountering a failure and caps the number of backend RPCs per logical request to 10. Consider this code in the frontend, using gRPC in Go:"
      - generic [ref=f61e162]: "func exampleRpcCall(client pb.ExampleClient, request pb.Request) *pb.Response { // Set RPC timeout to 5 seconds. opts := grpc.WithTimeout(5 * time.Second) // Try up to 10 times to make the RPC call. attempts := 10 for attempts > 0 { conn, err := grpc.Dial(*serverAddr, opts...) if err != nil { // Something went wrong in setting up the connection. Try again. attempts-- continue } defer conn.Close() // Create a client stub and make the RPC call. client := pb.NewBackendClient(conn) response, err := client.MakeRequest(context.Background, request) if err != nil { // Something went wrong in making the call. Try again. attempts-- continue } return response } grpclog.Fatalf(\"ran out of attempts\") }"
      - paragraph [ref=f61e163]: "This system can cascade in the following way:"
      - list [ref=f61e164]:
        - listitem [ref=f61e165]: Assume our backend has a known limit of 10,000 QPS per task, after which point all further requests are rejected in an attempt at graceful degradation.
        - listitem [ref=f61e166]:
          - text: The frontend calls
          - code [ref=f61e167]: MakeRequest
          - text: at a constant rate of 10,100 QPS and overloads the backend by 100 QPS, which the backend rejects.
        - listitem [ref=f61e168]:
          - text: Those 100 failed QPS are retried in
          - code [ref=f61e169]: MakeRequest
          - text: every 1,000 ms, and probably succeed. But the retries are themselves adding to the requests sent to the backend, which now receives 10,200 QPS—200 QPS of which are failing due to overload.
        - listitem [ref=f61e170]: "The volume of retries grows: 100 QPS of retries in the first second leads to 200 QPS, then to 300 QPS, and so on. Fewer and fewer requests are able to succeed on their first attempt, so less useful work is being performed as a fraction of requests to the backend."
        - listitem [ref=f61e171]: If the backend task is unable to handle the increase in load—which is consuming file descriptors, memory, and CPU time on the backend—it can melt down and crash under the sheer load of requests and retries. This crash then redistributes the requests it was receiving across the remaining backend tasks, in turn further overloading those tasks.
      - paragraph [ref=f61e172]:
        - text: Some simplifying assumptions were made here to illustrate this scenario,
        - superscript [ref=f61e173]:
          - link "110" [ref=f61e174] [cursor=pointer]:
            - /url: "#id-OdauNSrT7cvuy"
        - text: but the point remains that retries can destabilize a system. Note that both temporary load spikes and slow increases in usage can cause this effect.
      - paragraph [ref=f61e175]:
        - text: Even if the rate of calls to
        - code [ref=f61e176]: MakeRequest
        - text: "decreases to pre-meltdown levels (9,000 QPS, for example), depending on how much returning a failure costs the backend, the problem might not go away. Two factors are at play here:"
      - list [ref=f61e177]:
        - listitem [ref=f61e178]: If the backend spends a significant amount of resources processing requests that will ultimately fail due to overload, then the retries themselves may be keeping the backend in an overloaded mode.
        - listitem [ref=f61e179]:
          - text: The backend servers themselves may not be stable. Retries can amplify the effects seen in
          - link "Server Overload" [ref=f61e180] [cursor=pointer]:
            - /url: "#xref_cascading-failure_server-overload"
          - text: .
      - paragraph [ref=f61e181]: If either of these conditions is true, in order to dig out of this outage, you must dramatically reduce or eliminate the load on the frontends until the retries stop and the backends stabilize.
      - paragraph [ref=f61e182]:
        - text: This pattern has contributed to several cascading failures, whether the frontends and backends communicate via RPC messages, the “frontend” is client JavaScript code issuing
        - code [ref=f61e183]: XmlHttpRequest
        - text: calls to an endpoint and retries on failure, or the retries originate from an offline sync protocol that retries aggressively when it encounters a failure.
      - paragraph [ref=f61e184]: "When issuing automatic retries, keep in mind the following considerations:"
      - list [ref=f61e185]:
        - listitem [ref=f61e186]:
          - text: Most of the backend protection strategies described in
          - link "Preventing Server Overload" [ref=f61e187] [cursor=pointer]:
            - /url: "#xref_cascading-failure_preventing-server-overload"
          - text: apply. In particular, testing the system can highlight problems, and graceful degradation can reduce the effect of the retries on the backend.
        - listitem [ref=f61e188]:
          - text: Always use randomized exponential backoff when scheduling retries. See also
          - link "\"Exponential Backoff and Jitter\"" [ref=f61e189] [cursor=pointer]:
            - /url: https://www.awsarchitectureblog.com/2015/03/backoff.html
          - text: in the AWS Architecture Blog
          - link "[Bro15]" [ref=f61e190] [cursor=pointer]:
            - /url: /sre-book/bibliography#Bro15
          - text: . If retries aren’t randomly distributed over the retry window, a small perturbation (e.g., a network blip) can cause retry ripples to schedule at the same time, which can then amplify themselves
          - link "[Flo94]" [ref=f61e191] [cursor=pointer]:
            - /url: /sre-book/bibliography#Flo94
          - text: .
        - listitem [ref=f61e192]: Limit retries per request. Don’t retry a given request indefinitely.
        - listitem [ref=f61e193]: Consider having a server-wide retry budget. For example, only allow 60 retries per minute in a process, and if the retry budget is exceeded, don’t retry; just fail the request. This strategy can contain the retry effect and be the difference between a capacity planning failure that leads to some dropped queries and a global cascading failure.
        - listitem [ref=f61e194]:
          - text: "Think about the service holistically and decide if you really need to perform retries at a given level. In particular, avoid amplifying retries by issuing retries at multiple levels: a single request at the highest layer may produce a number of attempts as large as the"
          - emphasis [ref=f61e195]: product
          - text: of the number of attempts at each layer to the lowest layer. If the database can’t service requests because it’s overloaded, and the backend, frontend, and JavaScript layers all issue 3 retries (4 attempts), then a single user action may create 64 attempts (4^3) on the database. This behavior is undesirable when the database is returning those errors because it’s overloaded.
        - listitem [ref=f61e196]: Use clear response codes and consider how different failure modes should be handled. For example, separate retriable and nonretriable error conditions. Don’t retry permanent errors or malformed requests in a client, because neither will ever succeed. Return a specific status when overloaded so that clients and other layers back off and do not retry.
      - paragraph [ref=f61e197]: In an emergency, it may not be obvious that an outage is due to bad retry behavior. Graphs of retry rates can be an indication of bad retry behavior, but may be confused as a symptom instead of a compounding cause. In terms of mitigation, this is a special case of the insufficient capacity problem, with the additional caveat that you must either fix the retry behavior (usually requiring a code push), reduce load significantly, or cut requests off entirely.
      - heading "Latency and Deadlines" [level=2] [ref=f61e198]
      - paragraph [ref=f61e199]: When a frontend sends an RPC to a backend server, the frontend consumes resources waiting for a reply. RPC deadlines define how long a request can wait before the frontend gives up, limiting the time that the backend may consume the frontend’s resources.
      - heading "Picking a deadline" [level=3] [ref=f61e200]
      - paragraph [ref=f61e201]: It’s usually wise to set a deadline. Setting either no deadline or an extremely high deadline may cause short-term problems that have long since passed to continue to consume server resources until the server restarts.
      - paragraph [ref=f61e202]: High deadlines can result in resource consumption in higher levels of the stack when lower levels of the stack are having problems. Short deadlines can cause some more expensive requests to fail consistently. Balancing these constraints to pick a good deadline can be something of an art.
      - heading "Missing deadlines" [level=3] [ref=f61e203]
      - paragraph [ref=f61e204]:
        - text: A common theme in many
        - link "cascading outages" [ref=f61e205] [cursor=pointer]:
          - /url: /sre-book/tracking-outages/
        - text: "is that servers spend resources handling requests that will exceed their deadlines on the client. As a result, resources are spent while no progress is made: you don’t get credit for late assignments with RPCs."
      - paragraph [ref=f61e206]: Suppose an RPC has a 10-second deadline, as set by the client. The server is very overloaded, and as a result, it takes 11 seconds to move from a queue to a thread pool. At this point, the client has already given up on the request. Under most circumstances, it would be unwise for the server to attempt to handle this request, because it would be doing work for which no credit will be granted—the client doesn’t care what work the server does after the deadline has passed, because it’s given up on the request already.
      - paragraph [ref=f61e207]: If handling a request is performed over multiple stages (e.g., there are a few callbacks and RPC calls), the server should check the deadline left at each stage before attempting to perform any more work on the request. For example, if a request is split into parsing, backend request, and processing stages, it may make sense to check that there is enough time left to handle the request before each stage.
      - heading "Deadline propagation" [level=3] [ref=f61e208]
      - paragraph [ref=f61e209]: Rather than inventing a deadline when sending RPCs to backends, servers should employ deadline propagation.
      - paragraph [ref=f61e210]:
        - text: With deadline propagation, a deadline is set high in the stack (e.g., in the frontend). The tree of RPCs emanating from an initial request will all have the same absolute deadline. For example, if server
        - emphasis [ref=f61e211]: A
        - text: selects a 30-second deadline, and processes the request for 7 seconds before sending an RPC to server
        - emphasis [ref=f61e212]: B
        - text: ", the RPC from"
        - emphasis [ref=f61e213]: A
        - text: to
        - emphasis [ref=f61e214]: B
        - text: will have a 23-second deadline. If server
        - emphasis [ref=f61e215]: B
        - text: takes 4 seconds to handle the request and sends an RPC to server
        - emphasis [ref=f61e216]: C
        - text: ", the RPC from"
        - emphasis [ref=f61e217]: B
        - text: to
        - emphasis [ref=f61e218]: C
        - text: will have a 19-second deadline, and so on. Ideally, each server in the request tree implements deadline propagation.
      - paragraph [ref=f61e219]: "Without deadline propagation, the following scenario may occur:"
      - list [ref=f61e220]:
        - listitem [ref=f61e221]:
          - text: Server
          - emphasis [ref=f61e222]: A
          - text: sends an RPC to server
          - emphasis [ref=f61e223]: B
          - text: with a 10-second deadline.
        - listitem [ref=f61e224]:
          - text: Server
          - emphasis [ref=f61e225]: B
          - text: takes 8 seconds to start processing the request and then sends an RPC to server
          - emphasis [ref=f61e226]: C
          - text: .
        - listitem [ref=f61e227]:
          - text: If server
          - emphasis [ref=f61e228]: B
          - text: uses deadline propagation, it should set a 2-second deadline, but suppose it instead uses a hardcoded 20-second deadline for the RPC to server
          - emphasis [ref=f61e229]: C
          - text: .
        - listitem [ref=f61e230]:
          - text: Server
          - emphasis [ref=f61e231]: C
          - text: pulls the request off its queue after 5 seconds.
      - paragraph [ref=f61e232]:
        - text: Had server
        - emphasis [ref=f61e233]: B
        - text: used deadline propagation, server
        - emphasis [ref=f61e234]: C
        - text: could immediately give up on the request because the 2-second deadline was exceeded. However, in this scenario, server
        - emphasis [ref=f61e235]: C
        - text: processes the request thinking it has 15 seconds to spare, but is not doing useful work, since the request from server
        - emphasis [ref=f61e236]: A
        - text: to server
        - emphasis [ref=f61e237]: B
        - text: has already exceeded its deadline.
      - paragraph [ref=f61e238]: You may want to reduce the outgoing deadline a bit (e.g., a few hundred milliseconds) to account for network transit times and post-processing in the client.
      - paragraph [ref=f61e239]: Also consider setting an upper bound for outgoing deadlines. You may want to limit how long the server waits for outgoing RPCs to noncritical backends, or for RPCs to backends that typically complete in a short duration. However, be sure to understand your traffic mix, because you might otherwise inadvertently make particular types of requests fail all the time (e.g., requests with large payloads, or requests that require responding to a lot of computation).
      - paragraph [ref=f61e240]: There are some exceptions for which servers may wish to continue processing a request after the deadline has elapsed. For example, if a server receives a request that involves performing some expensive catchup operation and periodically checkpoints the progress of the catchup, it would be a good idea to check the deadline only after writing the checkpoint, instead of after the expensive operation.
      - heading "Cancellation propagation" [level=3] [ref=f61e241]
      - paragraph [ref=f61e242]:
        - text: Propagating cancellations reduces unneeded or doomed work by advising servers in an RPC call stack that their efforts are no longer necessary. To reduce latency, some systems use "hedged requests"
        - link "[Dea13]" [ref=f61e243] [cursor=pointer]:
          - /url: /sre-book/bibliography#Dea13
        - text: to send RPCs to a primary server, then some time later, send the same request to other instances of the same service in case the primary is slow in responding; once the client has received a response from any server, it sends messages to the other servers to cancel the now-superfluous requests. Those requests may themselves transitively fan out to many other servers, so cancellations should be propagated throughout the entire stack.
      - paragraph [ref=f61e244]: This approach can also be used to avoid the potential leakage that occurs if an initial RPC has a long deadline, but subsequent critical RPCs between deeper layers of the stack receive errors which can't succeed on retry, or have short deadlines and time out. Using only simple deadline propagation, the initial call continues to use server resources until it eventually times out, despite being doomed to failure. Sending fatal errors or timeouts up the stack and cancelling other RPCs in the call tree prevents unneeded work if the request as a whole can't be fulfilled.
      - heading "Bimodal latency" [level=3] [ref=f61e245]
      - paragraph [ref=f61e246]: Suppose that the frontend from the preceding example consists of 10 servers, each with 100 worker threads. This means that the frontend has a total of 1,000 threads of capacity. During usual operation, the frontends perform 1,000 QPS and requests complete in 100 ms. This means that the frontends usually have 100 worker threads occupied out of the 1,000 configured worker threads (1,000 QPS * 0.1 seconds).
      - paragraph [ref=f61e247]: Suppose an event causes 5% of the requests to never complete. This could be the result of the unavailability of some Bigtable row ranges, which renders the requests corresponding to that Bigtable keyspace unservable. As a result, 5% of the requests hit the deadline, while the remaining 95% of the requests take the usual 100 ms.
      - paragraph [ref=f61e248]: With a 100-second deadline, 5% of requests would consume 5,000 threads (50 QPS * 100 seconds), but the frontend doesn’t have that many threads available. Assuming no other secondary effects, the frontend will only be able to handle 19.6% of the requests (1,000 threads available / (5,000 + 95) threads’ worth of work), resulting in an 80.4% error rate.
      - paragraph [ref=f61e249]: Therefore, instead of only 5% of requests receiving an error (those that didn’t complete due to keyspace unavailability), most requests receive an error.
      - paragraph [ref=f61e250]: "The following guidelines can help address this class of problems:"
      - list [ref=f61e251]:
        - listitem [ref=f61e252]:
          - text: Detecting this problem can be very hard. In particular, it may not be clear that bimodal latency is the cause of an outage when you are looking at
          - emphasis [ref=f61e253]: mean
          - text: latency. When you see a latency increase, try to look at the
          - emphasis [ref=f61e254]: distribution
          - text: of latencies in addition to the averages.
        - listitem [ref=f61e255]: This problem can be avoided if the requests that don’t complete return with an error early, rather than waiting the full deadline. For example, if a backend is unavailable, it’s usually best to immediately return an error for that backend, rather than consuming resources until the backend is available. If your RPC layer supports a fail-fast option, use it.
        - listitem [ref=f61e256]: Having deadlines several orders of magnitude longer than the mean request latency is usually bad. In the preceding example, a small number of requests initially hit the deadline, but the deadline was three orders of magnitude larger than the normal mean latency, leading to thread exhaustion.
        - listitem [ref=f61e257]: When using shared resources that can be exhausted by some keyspace, consider either limiting in-flight requests by that keyspace or using other kinds of abuse tracking. Suppose your backend processes requests for different clients that have wildly different performance and request characteristics. You might consider only allowing 25% of your threads to be occupied by any one client in order to provide fairness in the face of heavy load by any single client misbehaving.
      - heading "Slow Startup and Cold Caching" [level=1] [ref=f61e258]
      - paragraph [ref=f61e259]: "Processes are often slower at responding to requests immediately after starting than they will be in steady state. This slowness can be caused by either or both of the following:"
      - generic [ref=f61e260]:
        - term [ref=f61e261]: Required initialization
        - definition [ref=f61e262]: Setting up connections upon receiving the first request that needs a given backend
        - term [ref=f61e263]: Runtime performance improvements in some languages, particularly Java
        - definition [ref=f61e264]: Just-In-Time compilation, hotspot optimization, and deferred class loading
      - paragraph [ref=f61e265]: Similarly, some binaries are less efficient when caches aren’t filled. For example, in the case of some of Google’s services, most requests are served out of caches, so requests that miss the cache are significantly more expensive. In steady-state operation with a warm cache, only a few cache misses occur, but when the cache is completely empty, 100% of requests are costly. Other services might employ caches to keep a user’s state in RAM. This might be accomplished through hard or soft stickiness between reverse proxies and service frontends.
      - paragraph [ref=f61e266]: If the service is not provisioned to handle requests under a cold cache, it’s at greater risk of outages and should take steps to avoid them.
      - paragraph [ref=f61e267]: "The following scenarios can lead to a cold cache:"
      - generic [ref=f61e268]:
        - term [ref=f61e269]: Turning up a new cluster
        - definition [ref=f61e270]: A recently added cluster will have an empty cache.
        - term [ref=f61e271]: Returning a cluster to service after maintenance
        - definition [ref=f61e272]: The cache may be stale.
        - term [ref=f61e273]: Restarts
        - definition [ref=f61e274]: If a task with a cache has recently restarted, filling its cache will take some time. It may be worthwhile to move caching from a server to a separate binary like memcache, which also allows cache sharing between many servers, albeit at the cost of introducing another RPC and slight additional latency.
      - paragraph [ref=f61e275]:
        - text: If caching has a significant effect on the service,
        - superscript [ref=f61e276]:
          - link "111" [ref=f61e277] [cursor=pointer]:
            - /url: "#id-wbau7SBiPUZ"
        - text: "you may want to use one or some of the following strategies:"
      - list [ref=f61e278]:
        - listitem [ref=f61e279]: "Overprovision the service. It’s important to note the distinction between a latency cache versus a capacity cache: when a latency cache is employed, the service can sustain its expected load with an empty cache, but a service using a capacity cache cannot sustain its expected load under an empty cache. Service owners should be vigilant about adding caches to their service, and make sure that any new caches are either latency caches or are sufficiently well engineered to safely function as capacity caches. Sometimes caches are added to a service to improve performance, but actually wind up being hard dependencies."
        - listitem [ref=f61e280]: Employ general cascading failure prevention techniques. In particular, servers should reject requests when they’re overloaded or enter degraded modes, and testing should be performed to see how the service behaves after events such as a large restart.
        - listitem [ref=f61e281]: When adding load to a cluster, slowly increase the load. The initially small request rate warms up the cache; once the cache is warm, more traffic can be added. It’s a good idea to ensure that all clusters carry nominal load and that the caches are kept warm.
      - heading "Always Go Downward in the Stack" [level=2] [ref=f61e282]
      - paragraph [ref=f61e283]: In the example Shakespeare service, the frontend talks to a backend, which in turn talks to the storage layer. A problem that manifests in the storage layer can cause problems for servers that talk to it, but fixing the storage layer will usually repair both the backend and frontend layers.
      - paragraph [ref=f61e284]: "However, suppose the backends cross-communicate amongst each other. For example, the backends might proxy requests to one another to change who owns a user when the storage layer can’t service a request. This intra-layer communication can be problematic for several reasons:"
      - list [ref=f61e285]:
        - listitem [ref=f61e286]:
          - paragraph [ref=f61e287]:
            - text: The communication is susceptible to a distributed deadlock. Backends may use the same thread pool to wait on RPCs sent to remote backends that are simultaneously receiving requests from remote backends. Suppose backend
            - emphasis [ref=f61e288]: A
            - text: ’s thread pool is full. Backend
            - emphasis [ref=f61e289]: B
            - text: sends a request to backend
            - emphasis [ref=f61e290]: A
            - text: and uses a thread in backend
            - emphasis [ref=f61e291]: B
            - text: until backend
            - emphasis [ref=f61e292]: A
            - text: ’s thread pool clears. This behavior can cause the thread pool saturation to spread.
        - listitem [ref=f61e293]:
          - paragraph [ref=f61e294]: If intra-layer communication increases in response to some kind of failure or heavy load condition (e.g., load rebalancing that is more active under high load), intra-layer communication can quickly switch from a low to high intra-layer request mode when the load increases enough.
          - paragraph [ref=f61e295]: For example, suppose a user has a primary backend and a predetermined hot standby secondary backend in a different cluster that can take over the user. The primary backend proxies requests to the secondary backend as a result of errors from the lower layer or in response to heavy load on the master. If the entire system is overloaded, primary to secondary proxying will likely increase and add even more load to the system, due to the additional cost of parsing and waiting on the request to the secondary in the primary.
        - listitem [ref=f61e296]:
          - paragraph [ref=f61e297]: Depending on the criticality of the cross-layer communication, bootstrapping the system may become more complex.
          - paragraph [ref=f61e298]: It’s usually better to avoid intra-layer communication—i.e., possible cycles in the communication path—in the user request path. Instead, have the client do the communication. For example, if a frontend talks to a backend but guesses the wrong backend, the backend should not proxy to the correct backend. Instead, the backend should tell the frontend to retry its request on the correct backend.
      - heading "Triggering Conditions for Cascading Failures" [level=1] [ref=f61e299]
      - paragraph [ref=f61e300]: When a service is susceptible to cascading failures, there are several possible disturbances that can initiate the domino effect. This section identifies some of the factors that trigger cascading failures.
      - heading "Process Death" [level=2] [ref=f61e301]
      - paragraph [ref=f61e302]: Some server tasks may die, reducing the amount of available capacity. Tasks might die because of a Query of Death (an RPC whose contents trigger a failure in the process), cluster issues, assertion failures, or a number of other reasons. A very small event (e.g., a couple of crashes or tasks rescheduled to other machines) may cause a service on the brink of falling to break.
      - heading "Process Updates" [level=2] [ref=f61e303]
      - paragraph [ref=f61e304]: Pushing a new version of the binary or updating its configuration may initiate a cascading failure if a large number of tasks are affected simultaneously. To prevent this scenario, either account for necessary capacity overhead when setting up the service’s update infrastructure, or push off-peak. Dynamically adjusting the number of in-flight task updates based on the volume of requests and available capacity may be a workable approach.
      - heading "New Rollouts" [level=2] [ref=f61e305]
      - paragraph [ref=f61e306]: A new binary, configuration changes, or a change to the underlying infrastructure stack can result in changes to request profiles, resource usage and limits, backends, or a number of other system components that can trigger a cascading failure.
      - paragraph [ref=f61e307]: During a cascading failure, it’s usually wise to check for recent changes and consider reverting them, particularly if those changes affected capacity or altered the request profile.
      - paragraph [ref=f61e308]: Your service should implement some type of change logging, which can help quickly identify recent changes.
      - heading "Organic Growth" [level=2] [ref=f61e309]
      - paragraph [ref=f61e310]: In many cases, a cascading failure isn’t triggered by a specific service change, but because a growth in usage wasn’t accompanied by an adjustment to capacity.
      - heading "Planned Changes, Drains, or Turndowns" [level=2] [ref=f61e311]
      - paragraph [ref=f61e312]: If your service is multihomed, some of your capacity may be unavailable because of maintenance or outages in a cluster. Similarly, one of the service’s critical dependencies may be drained, resulting in a reduction in capacity for the upstream service due to drain dependencies, or an increase in latency due to having to send the requests to a more distant cluster.
      - heading "Request profile changes" [level=3] [ref=f61e313]
      - paragraph [ref=f61e314]:
        - text: "A backend service may receive requests from different clusters because a frontend service shifted its traffic due to load balancing configuration changes, changes in the traffic mix, or cluster fullness. Also, the average cost to handle an individual payload may have changed due to frontend code or configuration changes. Similarly, the data handled by the service may have changed organically due to increased or differing usage by existing users: for instance, both the number and size of images,"
        - emphasis [ref=f61e315]: per user
        - text: ", for a photo storage service tend to increase over time."
      - heading "Resource limits" [level=3] [ref=f61e316]
      - paragraph [ref=f61e317]: Some cluster operating systems allow resource overcommitment. CPU is a fungible resource; often, some machines have some amount of slack CPU available, which provides a bit of a safety net against CPU spikes. The availability of this slack CPU differs between cells, and also between machines within the cell.
      - paragraph [ref=f61e318]: Depending upon this slack CPU as your safety net is dangerous. Its availability is entirely dependent on the behavior of the other jobs in the cluster, so it might suddenly drop out at any time. For example, if a team starts a MapReduce that consumes a lot of CPU and schedules on many machines, the aggregate amount of slack CPU can suddenly decrease and trigger CPU starvation conditions for unrelated jobs. When performing load tests, make sure that you remain within your committed resource limits.
      - heading "Testing for Cascading Failures" [level=1] [ref=f61e319]
      - paragraph [ref=f61e320]: The specific ways in which a service will fail can be very hard to predict from first principles. This section discusses testing strategies that can detect if services are susceptible to cascading failures.
      - paragraph [ref=f61e321]: You should test your service to determine how it behaves under heavy load in order to gain confidence that it won’t enter a cascading failure under various circumstances.
      - heading "Test Until Failure and Beyond" [level=2] [ref=f61e322]
      - paragraph [ref=f61e323]: Understanding the behavior of the service under heavy load is perhaps the most important first step in avoiding cascading failures. Knowing how your system behaves when it is overloaded helps to identify what engineering tasks are the most important for long-term fixes; at the very least, this knowledge may help bootstrap the debugging process for on-call engineers when an emergency arises.
      - paragraph [ref=f61e324]: Load test components until they break. As load increases, a component typically handles requests successfully until it reaches a point at which it can’t handle more requests. At this point, the component should ideally start serving errors or degraded results in response to additional load, but not significantly reduce the rate at which it successfully handles requests. A component that is highly susceptible to a cascading failure will start crashing or serving a very high rate of errors when it becomes overloaded; a better designed component will instead be able to reject a few requests and survive.
      - paragraph [ref=f61e325]: Load testing also reveals where the breaking point is, knowledge that’s fundamental to the capacity planning process. It enables you to test for regressions, provision for worst-case thresholds, and to trade off utilization versus safety margins.
      - paragraph [ref=f61e326]: Because of caching effects, gradually ramping up load may yield different results than immediately increasing to expected load levels. Therefore, consider testing both gradual and impulse load patterns.
      - paragraph [ref=f61e327]: "You should also test and understand how the component behaves as it returns to nominal load after having been pushed well beyond that load. Such testing may answer questions such as:"
      - list [ref=f61e328]:
        - listitem [ref=f61e329]: If a component enters a degraded mode on heavy load, is it capable of exiting the degraded mode without human intervention?
        - listitem [ref=f61e330]: If a couple of servers crash under heavy load, how much does the load need to drop in order for the system to stabilize?
      - paragraph [ref=f61e331]: If you’re load testing a stateful service or a service that employs caching, your load test should track state between multiple interactions and check correctness at high load, which is often where subtle concurrency bugs hit.
      - paragraph [ref=f61e332]: Keep in mind that individual components may have different breaking points, so load test each component separately. You won’t know in advance which component may hit the wall first, and you want to know how your system behaves when it does.
      - paragraph [ref=f61e333]: "If you believe your system has proper protections against being overloaded, consider performing failure tests in a small slice of production to find the point at which the components in your system fail under real traffic. These limits may not be adequately reflected by synthetic load test traffic, so real traffic tests may provide more realistic results than load tests, at the risk of causing user-visible pain. Be careful when testing on real traffic: make sure that you have extra capacity available in case your automatic protections don’t work and you need to manually fail over. You might consider some of the following production tests:"
      - list [ref=f61e334]:
        - listitem [ref=f61e335]: Reducing task counts quickly or slowly over time, beyond expected traffic patterns
        - listitem [ref=f61e336]: Rapidly losing a cluster’s worth of capacity
        - listitem [ref=f61e337]: Blackholing various backends
      - heading "Test Popular Clients" [level=2] [ref=f61e338]
      - paragraph [ref=f61e339]: "Understand how large clients use your service. For example, you want to know if clients:"
      - list [ref=f61e340]:
        - listitem [ref=f61e341]: Can queue work while the service is down
        - listitem [ref=f61e342]: Use randomized exponential backoff on errors
        - listitem [ref=f61e343]: Are vulnerable to external triggers that can create large amounts of load (e.g., an externally triggered software update might clear an offline client’s cache)
      - paragraph [ref=f61e344]: Depending on your service, you may or may not be in control of all the client code that talks to your service. However, it’s still a good idea to have an understanding of how large clients that interact with your service will behave.
      - paragraph [ref=f61e345]: The same principles apply to large internal clients. Stage system failures with the largest clients to see how they react. Ask internal clients how they access your service and what mechanisms they use to handle backend failure.
      - heading "Test Noncritical Backends" [level=2] [ref=f61e346]
      - paragraph [ref=f61e347]: Test your noncritical backends, and make sure their unavailability does not interfere with the critical components of your service.
      - paragraph [ref=f61e348]: For example, suppose your frontend has critical and noncritical backends. Often, a given request includes both critical components (e.g., query results) and noncritical components (e.g., spelling suggestions). Your requests may significantly slow down and consume resources waiting for noncritical backends to finish.
      - paragraph [ref=f61e349]: In addition to testing behavior when the noncritical backend is unavailable, test how the frontend behaves if the noncritical backend never responds (for example, if it is blackholing requests). Backends advertised as noncritical can still cause problems on frontends when requests have long deadlines. The frontend should not start rejecting lots of requests, running out of resources, or serving with very high latency when a noncritical backend blackholes.
      - heading "Immediate Steps to Address Cascading Failures" [level=1] [ref=f61e350]
      - paragraph [ref=f61e351]:
        - text: Once you have identified that your service is experiencing a cascading failure, you can use a few different strategies to remedy the situation—and of course, a cascading failure is a good opportunity to use your incident management protocol (
        - link "Managing Incidents" [ref=f61e352] [cursor=pointer]:
          - /url: /sre-book/managing-incidents/
        - text: ).
      - heading "Increase Resources" [level=2] [ref=f61e353]
      - paragraph [ref=f61e354]: If your system is running at degraded capacity and you have idle resources, adding tasks can be the most expedient way to recover from the outage. However, if the service has entered a death spiral of some sort, adding more resources may not be sufficient to recover.
      - heading "Stop Health Check Failures/Deaths" [level=2] [ref=f61e355]
      - paragraph [ref=f61e356]: Some cluster scheduling systems, such as Borg, check the health of tasks in a job and restart tasks that are unhealthy. This practice may create a failure mode in which health-checking itself makes the service unhealthy. For example, if half the tasks aren’t able to accomplish any work because they’re starting up and the other half will soon be killed because they’re overloaded and failing health checks, temporarily disabling health checks may permit the system to stabilize until all the tasks are running.
      - paragraph [ref=f61e357]:
        - text: Process health checking (“is this binary responding
        - emphasis [ref=f61e358]: at all
        - text: "?”) and service health checking (“is this binary able to respond to"
        - emphasis [ref=f61e359]: this class of requests
        - text: right now?”) are two conceptually distinct operations. Process health checking is relevant to the cluster scheduler, whereas service health checking is relevant to the load balancer. Clearly distinguishing between the two types of health checks can help avoid this scenario.
      - heading "Restart Servers" [level=2] [ref=f61e360]
      - paragraph [ref=f61e361]: "If servers are somehow wedged and not making progress, restarting them may help. Try restarting servers when:"
      - list [ref=f61e362]:
        - listitem [ref=f61e363]: Java servers are in a GC death spiral
        - listitem [ref=f61e364]: Some in-flight requests have no deadlines but are consuming resources, leading them to block threads, for example
        - listitem [ref=f61e365]: The servers are deadlocked
      - paragraph [ref=f61e366]: Make sure that you identify the source of the cascading failure before you restart your servers. Make sure that taking this action won’t simply shift around load. Canary this change, and make it slowly. Your actions may amplify an existing cascading failure if the outage is actually due to an issue like a cold cache.
      - heading "Drop Traffic" [level=2] [ref=f61e367]
      - paragraph [ref=f61e368]: "Dropping load is a big hammer, usually reserved for situations in which you have a true cascading failure on your hands and you cannot fix it by other means. For example, if heavy load causes most servers to crash as soon as they become healthy, you can get the service up and running again by:"
      - list [ref=f61e369]:
        - listitem [ref=f61e370]: Addressing the initial triggering condition (by adding capacity, for example).
        - listitem [ref=f61e371]: Reducing load enough so that the crashing stops. Consider being aggressive here—if the entire service is crash-looping, only allow, say, 1% of the traffic through.
        - listitem [ref=f61e372]: Allowing the majority of the servers to become healthy.
        - listitem [ref=f61e373]: Gradually ramping up the load.
      - paragraph [ref=f61e374]: This strategy allows caches to warm up, connections to be established, etc., before load returns to normal levels.
      - paragraph [ref=f61e375]:
        - text: Obviously, this tactic will cause a lot of user-visible harm. Whether or not you’re able to (or if you even
        - emphasis [ref=f61e376]: should
        - text: ) drop traffic indiscriminately depends on how the service is configured. If you have some mechanism to drop less important traffic (e.g., prefetching), use that mechanism first.
      - paragraph [ref=f61e377]: It is important to keep in mind that this strategy enables you to recover from a cascading outage once the underlying problem is fixed. If the issue that started the cascading failure is not fixed (e.g., insufficient global capacity), then the cascading failure may trigger shortly after all traffic returns. Therefore, before using this strategy, consider fixing (or at least papering over) the root cause or triggering condition. For example, if the service ran out of memory and is now in a death spiral, adding more memory or tasks should be your first step.
      - heading "Enter Degraded Modes" [level=2] [ref=f61e378]
      - paragraph [ref=f61e379]: Serve degraded results by doing less work or dropping unimportant traffic. This strategy must be engineered into your service, and can be implemented only if you know which traffic can be degraded and you have the ability to differentiate between the various payloads.
      - heading "Eliminate Batch Load" [level=2] [ref=f61e380]
      - paragraph [ref=f61e381]: Some services have load that is important, but not critical. Consider turning off those sources of load. For example, if index updates, data copies, or statistics gathering consume resources of the serving path, consider turning off those sources of load during an outage.
      - heading "Eliminate Bad Traffic" [level=2] [ref=f61e382]
      - paragraph [ref=f61e383]: If some queries are creating heavy load or crashes (e.g., queries of death), consider blocking them or eliminating them via other means.
      - heading "Cascading Failure and Shakespeare" [level=5] [ref=f61e384]
      - paragraph [ref=f61e385]: A documentary about Shakespeare’s works airs in Japan, and explicitly points to our Shakespeare service as an excellent place to conduct further research. Following the broadcast, traffic to our Asian datacenter surges beyond the service’s capacity. This capacity problem is further compounded by a major update to the Shakespeare service that simultaneously occurs in that datacenter.
      - paragraph [ref=f61e386]: Fortunately, a number of safeguards are in place that help mitigate the potential for failure. The Production Readiness Review process identified some issues that the team already addressed. For example, the developers built graceful degradation into the service. As capacity becomes scarce, the service no longer returns pictures alongside text or small maps illustrating where a story takes place. And depending on its purpose, an RPC that times out is either not retried (for example, in the case of the aforementioned pictures), or is retried with a randomized exponential backoff. Despite these safeguards, the tasks fail one by one and are then restarted by Borg, which drives the number of working tasks down even more.
      - paragraph [ref=f61e387]: As a result, some graphs on the service dashboard turn an alarming shade of red and SRE is paged. In response, SREs temporarily add capacity to the Asian datacenter by increasing the number of tasks available for the Shakespeare job. By doing so, they’re able to restore the Shakespeare service in the Asian cluster.
      - paragraph [ref=f61e388]: Afterward, the SRE team writes a postmortem detailing the chain of events, what went well, what could have gone better, and a number of action items to prevent this scenario from occurring again. For example, in the case of a service overload, the GSLB load balancer will redirect some traffic to neighboring datacenters. Also, the SRE team turns on autoscaling, so that the number of tasks automatically increases with traffic, so they don’t have to worry about this type of issue again.
      - heading "Closing Remarks" [level=1] [ref=f61e389]
      - paragraph [ref=f61e390]: When systems are overloaded, something needs to give in order to remedy the situation. Once a service passes its breaking point, it is better to allow some user-visible errors or lower-quality results to slip through than try to fully serve every request. Understanding where those breaking points are and how the system behaves beyond them is critical for service owners who want to avoid cascading failures.
      - paragraph [ref=f61e391]: "Without proper care, some system changes meant to reduce background errors or otherwise improve the steady state can expose the service to greater risk of a full outage. Retrying on failures, shifting load around from unhealthy servers, killing unhealthy servers, adding caches to improve performance or reduce latency: all of these might be implemented to improve the normal case, but can improve the chance of causing a large-scale failure. Be careful when evaluating changes to ensure that one outage is not being traded for another."
      - generic [ref=f61e392]:
        - paragraph [ref=f61e393]:
          - superscript [ref=f61e394]:
            - link "107" [ref=f61e395] [cursor=pointer]:
              - /url: "#id-GbduZFnh9-marker"
          - text: See Wikipedia, “Positive feedback,”
          - link [ref=f61e396] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Positive_feedback
            - emphasis [ref=f61e397]: https://en.wikipedia.org/wiki/Positive_feedback
          - text: .
        - paragraph [ref=f61e398]:
          - superscript [ref=f61e399]:
            - link "108" [ref=f61e400] [cursor=pointer]:
              - /url: "#id-p8BuzSVSmijIlh0tjiq-marker"
          - text: A watchdog is often implemented as a thread that wakes up periodically to see whether work has been done since the last time it checked. If not, it assumes that the server is stuck and kills it. For instance, requests of a known type can be sent to the server at regular intervals; if one hasn’t been received or processed when expected, this may indicate failure—of the server, the system sending requests, or the intermediate network.
        - paragraph [ref=f61e401]:
          - superscript [ref=f61e402]:
            - link "109" [ref=f61e403] [cursor=pointer]:
              - /url: "#id-jE2ujIQSjUEIKuv-marker"
          - text: This is often not a good assumption due to geography; see also
          - link "Job and Data Organization" [ref=f61e404] [cursor=pointer]:
            - /url: /sre-book/production-environment#xref_production-environment_job-and-data-organization
          - text: .
        - paragraph [ref=f61e405]:
          - superscript [ref=f61e406]:
            - link "110" [ref=f61e407] [cursor=pointer]:
              - /url: "#id-OdauNSrT7cvuy-marker"
          - text: "An instructive exercise, left for the reader: write a simple simulator and see how the amount of useful work the backend can do varies with how much it’s overloaded and how many retries are permitted."
        - paragraph [ref=f61e408]:
          - superscript [ref=f61e409]:
            - link "111" [ref=f61e410] [cursor=pointer]:
              - /url: "#id-wbau7SBiPUZ-marker"
          - text: "Sometimes you find that a meaningful proportion of your actual serving capacity is as a function of serving from a cache, and if you lost access to that cache, you wouldn’t actually be able to serve that many queries. A similar observation holds for latency: a cache can help you achieve latency goals (by lowering the average response time when the query is servable from cache) that you possibly couldn’t meet without that cache."
