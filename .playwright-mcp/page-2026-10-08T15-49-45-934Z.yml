                - /url: "#tcp"
              - text: ","
              - link "TLS/SSL" [ref=f81e2589] [cursor=pointer]:
                - /url: "#tls-ssl"
              - text: ","
              - link "TTFB" [ref=f81e2590] [cursor=pointer]:
                - /url: "#ttfb"
          - article [ref=f81e2591]:
            - heading "kqueue" [level=4] [ref=f81e2592]
            - paragraph [ref=f81e2593]: "còn gọi: kernel event queue, BSD event mechanism"
            - paragraph [ref=f81e2594]:
              - generic [ref=f81e2595]: Vấn đề
              - text: FreeBSD/BSD cũng gặp đúng bài toán C10k với select/poll O(n) và cần cơ chế sự kiện của riêng hệ, vì epoll là Linux-specific. nginx và các server production cần một interface hiệu quả để theo dõi hàng nghìn fd trên BSD/macOS.
            - paragraph [ref=f81e2596]:
              - generic [ref=f81e2597]: Nguồn gốc
              - text: Jonathan Lemon, FreeBSD Core Team, 2000 (FreeBSD 4.1, tháng 7/2000)
            - paragraph [ref=f81e2598]:
              - generic [ref=f81e2599]: Giải pháp
              - text: Một call kevent() gộp cả đăng ký filter, sửa đổi và chờ event — kernel chỉ trả về đúng những sự kiện người dùng quan tâm; ngoài fd readiness còn theo dõi được file đổi, signal, timer nanosecond, tiến trình con, event người dùng định nghĩa.
            - paragraph [ref=f81e2600]:
              - text: "Liên quan:"
              - link "epoll" [ref=f81e2601] [cursor=pointer]:
                - /url: "#epoll"
              - text: ","
              - link "C10k problem" [ref=f81e2602] [cursor=pointer]:
                - /url: "#c10k-problem"
              - text: ","
              - link "I/O multiplexing (select/poll)" [ref=f81e2603] [cursor=pointer]:
                - /url: "#i-o-multiplexing-select-poll"
          - article [ref=f81e2604]:
            - heading "Proxy (forward/reverse)" [level=4] [ref=f81e2605]
            - paragraph [ref=f81e2606]: "còn gọi: reverse proxy, forward proxy, nginx, HAProxy"
            - paragraph [ref=f81e2607]:
              - generic [ref=f81e2608]: Vấn đề
              - text: "Forward proxy: doanh nghiệp 1990s muốn hàng trăm nhân viên ra Internet qua MỘT cửa chung — tiết kiệm băng thông, log/locại nội dung, không lộ IP nội bộ ra ngoài. Reverse proxy: server gốc chịu hết tải đặt sau load balancer không nổi, muốn gắn TLS tập trung, cache, gộp nhiều backend — đặt một lớp trước nó nhận hết request."
            - paragraph [ref=f81e2609]:
              - generic [ref=f81e2610]: Nguồn gốc
              - text: không rõ (forward proxy xuất hiện cùng thời với CERN httpd/early web thập niên 1990; reverse proxy phổ biến cùng nginx 2004).
            - paragraph [ref=f81e2611]:
              - generic [ref=f81e2612]: Giải pháp
              - text: "Forward proxy: client cấu hình trỏ vào proxy, proxy thay mặt fetch (ẩn client). Reverse proxy: client chỉ biết proxy, proxy chuyển tiếp (proxy_pass) tới backend pool — client không biết có bao nhiêu máy sau đó; dùng để terminate TLS, cache, rate limit, health check."
            - paragraph [ref=f81e2613]:
              - text: "Liên quan:"
              - link "CDN" [ref=f81e2614] [cursor=pointer]:
                - /url: "#cdn"
              - text: ", Load balancer,"
              - link "TLS/SSL" [ref=f81e2615] [cursor=pointer]:
                - /url: "#tls-ssl"
              - text: ","
              - link "Port" [ref=f81e2616] [cursor=pointer]:
                - /url: "#port"
              - text: ", Firewall"
          - article [ref=f81e2617]:
            - heading "Reactor pattern" [level=4] [ref=f81e2618]
            - paragraph [ref=f81e2619]: "còn gọi: mẫu Reactor, readiness-based event handling"
            - paragraph [ref=f81e2620]:
              - generic [ref=f81e2621]: Vấn đề
              - text: "Thiết kế server theo kiểu thủ công 'vòng lặp + if event' khiến mỗi project tự phát minh lại cách demultiplex và dispatch, code trộn lẫn giữa 'chờ socket' và 'xử lý nghiệp vụ', khó bảo trì và dễ block ngoài ý muốn. Bài toán cần một mẫu chuẩn: single thread xử lý nhiều kết nối mà không block."
            - paragraph [ref=f81e2622]:
              - generic [ref=f81e2623]: Nguồn gốc
              - text: "Douglas C. Schmidt, 1995 — 'Reactor: An Object Behavioral Pattern...', Chương 29, Pattern Languages of Program Design (Addison-Wesley)"
            - paragraph [ref=f81e2624]:
              - generic [ref=f81e2625]: Giải pháp
              - text: "Reactor gồm: Handle (socket/fd) → Demultiplexer (epoll/kqueue/select chờ sẵn sàng) → Dispatcher (event loop) → Event handlers đã đăng ký. Sự kiện 'đã sẵn sàng để đọc/ghi' được dispatch đúng handler — readiness-based: kernel báo 'sẵn sàng', handler tự đọc."
            - paragraph [ref=f81e2626]:
              - text: "Liên quan:"
              - link "Proactor pattern" [ref=f81e2627] [cursor=pointer]:
                - /url: "#proactor-pattern"
              - text: ","
              - link "Event loop" [ref=f81e2628] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ","
              - link "epoll" [ref=f81e2629] [cursor=pointer]:
                - /url: "#epoll"
              - text: ","
              - link "C10k problem" [ref=f81e2630] [cursor=pointer]:
                - /url: "#c10k-problem"
          - article [ref=f81e2631]:
            - heading "REST" [level=4] [ref=f81e2632]
            - paragraph [ref=f81e2633]: "còn gọi: Representational State Transfer, RESTful API"
            - paragraph [ref=f81e2634]:
              - generic [ref=f81e2635]: Vấn đề
              - text: "Đầu những 2000, các extension HTTP tự chế và giao thức RPC kiểu cũ (CORBA, DCOM) khiến kiến trúc web không có mô tả chính thức: mỗi team phát minh cách gọi API riêng, proxy/cache không hiểu response nào được cache, dev không thống nhất cách đặt tên tài nguyên. Roy Fielding — người đồng tác giả HTTP/URI — cần một mô hình chuẩn để đánh giá mọi thay đổi đề xuất lên Web."
            - paragraph [ref=f81e2636]:
              - generic [ref=f81e2637]: Nguồn gốc
              - text: Roy Fielding, luận án tiến sĩ UC Irvine, 2000 ('Architectural Styles and the Design of Network-based Software Architectures').
            - paragraph [ref=f81e2638]:
              - generic [ref=f81e2639]: Giải pháp
              - text: "Bắt buộc 6 ràng buộc: client-server, stateless (mỗi request tự chứa đủ thông tin), cacheable, uniform interface (URI đánh dấu tài nguyên, GET/PUT/POST/DELETE thao tác, representation, self-descriptive messages), layered system, code-on-demand (tùy chọn)."
            - paragraph [ref=f81e2640]:
              - text: "Liên quan:"
              - link "HTTP" [ref=f81e2641] [cursor=pointer]:
                - /url: "#http"
              - text: ","
              - link "RPC" [ref=f81e2642] [cursor=pointer]:
                - /url: "#rpc"
              - text: ","
              - link "gRPC" [ref=f81e2643] [cursor=pointer]:
                - /url: "#grpc"
              - text: ","
              - link "Cache" [ref=f81e2644] [cursor=pointer]:
                - /url: "#cache"
              - text: ","
              - link "CORS" [ref=f81e2645] [cursor=pointer]:
                - /url: "#cors"
          - article [ref=f81e2646]:
            - heading "RPC" [level=4] [ref=f81e2647]
            - paragraph [ref=f81e2648]: "còn gọi: Remote Procedure Call, gọi hàm từ xa"
            - paragraph [ref=f81e2649]:
              - generic [ref=f81e2650]: Vấn đề
              - text: Khi hệ thống chia từ một tiến trình ra nhiều máy, hàm không còn gọi hàm được — dev phải tự serialize tham số, mở socket, viết giao thức, xử lý timeout/mất kết nối cho từng hàm, code trùng lặp và dễ sai. Birrell & Nelson muốn gọi hàm từ máy khác 'như đang gọi hàm nội bộ'.
            - paragraph [ref=f81e2651]:
              - generic [ref=f81e2652]: Nguồn gốc
              - text: Andrew Birrell & Bruce Nelson, Xerox PARC, paper 'Implementing Remote Procedure Calls' (1984).
            - paragraph [ref=f81e2653]:
              - generic [ref=f81e2654]: Giải pháp
              - text: "Client stub thay mặt hàm remotes: marshal tham số vào message, gửi qua network, server unmarshal, chạy hàm thật, marshal kết quả trả về — phần network được framework che đi (SOAP, Thrift, JSON-RPC, gRPC đều là con của ý tưởng này)."
            - paragraph [ref=f81e2655]:
              - text: "Liên quan:"
              - link "gRPC" [ref=f81e2656] [cursor=pointer]:
                - /url: "#grpc"
              - text: ","
              - link "REST" [ref=f81e2657] [cursor=pointer]:
                - /url: "#rest"
              - text: ", Protocol Buffers, IDL, Load balancer"
          - article [ref=f81e2658]:
            - heading "SSE" [level=4] [ref=f81e2659]
            - paragraph [ref=f81e2660]: "còn gọi: Server-Sent Events, EventSource, text/event-stream"
            - paragraph [ref=f81e2661]:
              - generic [ref=f81e2662]: Vấn đề
              - text: Nhiều trường hợp chỉ cần server push một chiều (bảng giá, notification, tiến trình build) — dùng WebSocket thì phải viết tay cả handshake upgrade, framing, heartbeat, reconnect, và bị proxy cũ cắt; poll lại phí băng thông. Cần một cơ chế push đơn giản chỉ dựa trên HTTP thông thường.
            - paragraph [ref=f81e2663]:
              - generic [ref=f81e2664]: Nguồn gốc
              - text: Ian Hickson, WHATWG 'Web Applications 1.0', bắt đầu 2004; Opera thử nghiệm 9/2006; W3C Recommendation 3/2015.
            - paragraph [ref=f81e2665]:
              - generic [ref=f81e2666]: Giải pháp
              - text: "Server trả Content-Type: text/event-stream và stream các dòng 'data: ...' định dạng; browser qua API EventSource tự giữ kết nối, tự parse, tự reconnect — không cần thư viện bên ngoài."
            - paragraph [ref=f81e2667]:
              - text: "Liên quan:"
              - link "WebSocket" [ref=f81e2668] [cursor=pointer]:
                - /url: "#websocket"
              - text: ","
              - link "HTTP" [ref=f81e2669] [cursor=pointer]:
                - /url: "#http"
              - text: ", Long polling, Streaming"
          - article [ref=f81e2670]:
            - heading "TCP congestion control (AIMD)" [level=4] [ref=f81e2671]
            - paragraph [ref=f81e2672]: "còn gọi: kiểm soát tắc nghẽn TCP, congestion window, AIMD"
            - paragraph [ref=f81e2673]:
              - generic [ref=f81e2674]: Vấn đề
              - text: Nếu mọi host bung data theo khả năng đường truyền mà không kiểm soát, router quá tải sẽ drop hàng loạt — các kết nối cùng retransmit làm tình trạng tệ hơn, kéo cả Internet vào 'congestive collapse' (mô tả của Van Jacobson cuối những năm 80). Flow control (receiver window) không giải quyết được vì nó chỉ bảo vệ từng connection, không bảo vệ mạng.
            - paragraph [ref=f81e2675]:
              - generic [ref=f81e2676]: Nguồn gốc
              - text: Van Jacobson & Michael Karels, 1988 (RFC 2001, RFC 5681)
            - paragraph [ref=f81e2677]:
              - generic [ref=f81e2678]: Giải pháp
              - text: "Sender giữ congestion window (cwnd) giới hạn byte đang trong đường; mất packet/có tín hiệu nghẽn thì cắt cửa sổ (multiplicative decrease), không nghẽn thì tăng từ từ (additive increase) — AIMD. Mất 3 duplicate ACK → fast retransmit ngay không chờ timeout; Tahoe reset về 1 MSS, Reno vào fast recovery. End-to-end: kiểm soát nằm ở host, không ở router."
            - paragraph [ref=f81e2679]:
              - text: "Liên quan:"
              - link "TCP slow start" [ref=f81e2680] [cursor=pointer]:
                - /url: "#tcp-slow-start"
              - text: ", RTT, BBR / CUBIC"
          - article [ref=f81e2681]:
            - heading "Vary header / content negotiation cache" [level=4] [ref=f81e2682]
            - paragraph [ref=f81e2683]: "còn gọi: Vary: Accept-Encoding, cache variant"
            - paragraph [ref=f81e2684]:
              - generic [ref=f81e2685]: Vấn đề
              - text: Cache mặc định chỉ key theo URL — nhưng cùng một URL có thể trả body khác nhau tùy Accept-Language (đức/anh), Accept-Encoding (gzip/br) hoặc User-Agent (mobile/desktop). Không có Vary, cache sẽ trao bản tiếng Đức cho client yêu cầu tiếng Anh, hoặc gửi bản nén cho client không hỗ trợ — đúng loại bug 'phục vụ sai biến thể' cực khó debug.
            - paragraph [ref=f81e2686]:
              - generic [ref=f81e2687]: Nguồn gốc
              - text: RFC 2616 (1997); hiện RFC 9110 § field.vary
            - paragraph [ref=f81e2688]:
              - generic [ref=f81e2689]: Giải pháp
              - text: "Vary liệt kê các request header ảnh hưởng tới nội dung; cache mở rộng key từ URL thành URL + các header đó, lưu nhiều biến thể riêng. Cạm bẫy: mỗi chiều Vary nhân lên số entry (10 ngôn ngữ × 3 encoding × 50 UA = 1500 key) → cache fragmentation, hit rate sập; chỉ liệt kê header thực sự đổi bytes, giữ giá trị Vary nhất quán giữa 200/304. Vary: * = cấm cache."
            - paragraph [ref=f81e2690]:
              - text: "Liên quan:"
              - link "CDN cache key" [ref=f81e2691] [cursor=pointer]:
                - /url: "#cdn-cache-key"
              - text: ", ETag / conditional requests, HTTP caching với Cache-Control"
          - article [ref=f81e2692]:
            - heading "WebSocket" [level=4] [ref=f81e2693]
            - paragraph [ref=f81e2694]: "còn gọi: ws://, wss://"
            - paragraph [ref=f81e2695]:
              - generic [ref=f81e2696]: Vấn đề
              - text: "HTTP một chiều: client hỏi server mới trả lời — chat/realtime/notifications đành dùng long-polling hay Comet (giữ request treo, client hỏi đi hỏi lại), mỗi lần tốn TCP handshake + HTTP header, độ trễ cao và không scale nổi với hàng nghìn client hỏi dồn dập. Port 80 phải đi qua firewall, không mở socket tùy ý được."
            - paragraph [ref=f81e2697]:
              - generic [ref=f81e2698]: Nguồn gốc
              - text: "Ian Hickson & Michael Carter đặt tên trong #whatwg (2008); RFC 6455 (12/2011, Ian Fette); Chrome 4 hỗ trợ đầu tiên (12/2009)."
            - paragraph [ref=f81e2699]:
              - generic [ref=f81e2700]: Giải pháp
              - text: "Bắt tay 'upgrade' ngay trên HTTP port 80/443, sau đó giữ kết nối TCP mở hai chiều: server push bất cứ lúc nào, thêm khung message (frame) trên stream byte của TCP, overhead rất nhỏ."
            - paragraph [ref=f81e2701]:
              - text: "Liên quan:"
              - link "SSE" [ref=f81e2702] [cursor=pointer]:
                - /url: "#sse"
              - text: ","
              - link "HTTP" [ref=f81e2703] [cursor=pointer]:
                - /url: "#http"
              - text: ","
              - link "TCP" [ref=f81e2704] [cursor=pointer]:
                - /url: "#tcp"
              - text: ","
              - link "Socket" [ref=f81e2705] [cursor=pointer]:
                - /url: "#socket"
              - text: ", Long polling"
        - generic [ref=f81e2706]:
          - heading "Thiết kế API 22" [level=3] [ref=f81e2707]:
            - text: Thiết kế API
            - generic [ref=f81e2708]: "22"
          - article [ref=f81e2709]:
            - heading "API deprecation policy" [level=4] [ref=f81e2710]
            - paragraph [ref=f81e2711]: "còn gọi: deprecation, sunset policy"
            - paragraph [ref=f81e2712]:
              - generic [ref=f81e2713]: Vấn đề
              - text: Xóa endpoint/change shape đột ngột làm client đang chạy production chết; không có thời gian chuyển thì quan hệ đối tác/người dùng phá vỡ.
            - paragraph [ref=f81e2714]:
              - generic [ref=f81e2715]: Nguồn gốc
              - text: "Microsoft Graph: element deprecated GA phải hỗ trợ tối thiểu 36 tháng hoặc 24 tháng khi chứng minh không còn dùng. Draft IETF draft-ietf-httpapi-sunset (HTTPAPI WG) chuẩn hóa header Sunset."
            - paragraph [ref=f81e2716]:
              - generic [ref=f81e2717]: Giải pháp
              - text: "Công bố sớm: header Sunset (ngày ngừng hoạt động theo HTTP-date), header Deprecation, link rel=sunset; log usage để biết client nào còn gọi. Breaking change bắt buộc qua version mới, version cũ giữ trong cửa sổ deprecation. Stripe hướng dẫn migrate từng bước qua 2 endpoint webhook song song."
            - paragraph [ref=f81e2718]:
              - text: "Liên quan:"
              - link "Deprecation/sunset headers" [ref=f81e2719] [cursor=pointer]:
                - /url: "#deprecation-sunset-headers"
              - text: ","
              - link "API versioning (URL/header/media type)" [ref=f81e2720] [cursor=pointer]:
                - /url: "#api-versioning-url-header-media-type"
              - text: ", Breaking vs non-breaking change"
          - article [ref=f81e2721]:
            - heading "API gateway pattern" [level=4] [ref=f81e2722]
            - paragraph [ref=f81e2723]: "còn gọi: gateway, edge service, single entry point"
            - paragraph [ref=f81e2724]:
              - generic [ref=f81e2725]: Vấn đề
              - text: "Microservice expose hàng chục endpoint nội bộ: client phải tự discovery, tự auth từng service, gộp data từ 10 service = 10 round-trip, giao thức internal (gRPC) không nói chuyện được với browser."
            - paragraph [ref=f81e2726]:
              - generic [ref=f81e2727]: Nguồn gốc
              - text: microservices.io - Chris Richardson (tác giả 'Microservices Patterns'), có dẫn Netflix API gateway làm ví dụ; cùng pattern có trong Sam Newman 'Building Microservices'.
            - paragraph [ref=f81e2728]:
              - generic [ref=f81e2729]: Giải pháp
              - text: "Gateway là single entry point: proxy route tới service phù hợp, fan-out gộp nhiều service (aggregation), kiểm tra auth, dịch giao thức public (HTTPS/JSON) sang internal (gRPC), expose API khác nhau cho client khác nhau (BFF variant). Cost: thêm hop (latency) + thêm component quản lý."
            - paragraph [ref=f81e2730]:
              - text: "Liên quan:"
              - link "BFF (Backend for Frontend)" [ref=f81e2731] [cursor=pointer]:
                - /url: "#bff-backend-for-frontend"
              - text: ", Rate limiting vs throttling vs quota, Strangler fig"
          - article [ref=f81e2732]:
            - heading "API versioning (URL/header/media type)" [level=4] [ref=f81e2733]
            - paragraph [ref=f81e2734]: "còn gọi: versioning strategy, api-version, breaking version"
            - paragraph [ref=f81e2735]:
              - generic [ref=f81e2736]: Vấn đề
              - text: Đổi shape API mà không version thì client cũ vỡ; version sai cách (mọi thay đổi đều bump) thì client phải nâng liên tục.
            - paragraph [ref=f81e2737]:
              - generic [ref=f81e2738]: Nguồn gốc
              - text: "Azure: query param api-version dạng YYYY-MM-DD (preview thêm -preview); Microsoft Graph: segment /v1.0 và /beta; Stripe: header Stripe-Version pin theo ngày (2015-02-16); RFC 9110 media type versioning (application/vnd.company.v2+json) hiếm dùng."
            - paragraph [ref=f81e2739]:
              - generic [ref=f81e2740]: Giải pháp
              - text: "URL prefix dễ thấy, dễ cache nhưng chia đôi codebase; header gọn hơn nhưng khó discover/test; media type đúng chuẩn content negotiation nhưng client phức tạp. Bất kỳ cách nào cũng phải có policy deprecation rõ. Stripe: mỗi request nên pin version thay vì dựa default của account."
            - paragraph [ref=f81e2741]:
              - text: "Liên quan: Breaking vs non-breaking change, Semantic versioning for APIs,"
              - link "API deprecation policy" [ref=f81e2742] [cursor=pointer]:
                - /url: "#api-deprecation-policy"
          - article [ref=f81e2743]:
            - heading "API-first design" [level=4] [ref=f81e2744]
            - paragraph [ref=f81e2745]: "còn gọi: API-driven design, design-first API"
            - paragraph [ref=f81e2746]:
              - generic [ref=f81e2747]: Vấn đề
              - text: "Code xong rồi mới vẽ swagger: backend/frontend/qa mỗi bên tự hiểu contract khác nhau, integration test fail cuối sprint, đổi contract lúc đó đã tốn."
            - paragraph [ref=f81e2748]:
              - generic [ref=f81e2749]: Nguồn gốc
              - text: Phong trào API-first phổ biến cùng thời OpenAPI; AWS API Gateway và các platform (Stoplight, Postman) quảng bá 'design before implementation'.
            - paragraph [ref=f81e2750]:
              - generic [ref=f81e2751]: Giải pháp
              - text: "Chốt contract (OpenAPI/proto) TRƯỚC khi implement: backend code theo contract, frontend mock được ngay, contract test chặn drift, SDK tự sinh. Dùng contract làm single source of truth giữa các team và các language."
            - paragraph [ref=f81e2752]:
              - text: "Liên quan:"
              - link "OpenAPI/Swagger" [ref=f81e2753] [cursor=pointer]:
                - /url: "#openapi-swagger"
              - text: ","
              - link "Contract-first" [ref=f81e2754] [cursor=pointer]:
                - /url: "#contract-first"
              - text: ", SDK/codegen"
          - article [ref=f81e2755]:
            - heading "BFF (Backend for Frontend)" [level=4] [ref=f81e2756]
            - paragraph [ref=f81e2757]: "còn gọi: Backend for Frontend, per-client BFF, backend cho frontend"
            - paragraph [ref=f81e2758]:
              - generic [ref=f81e2759]: Vấn đề
              - text: "1 API chung cho web + iOS + Android: web cần 15 field, mobile cần 5 field; mỗi client đòi endpoint riêng làm API phình, team backend thành bottleneck chung."
            - paragraph [ref=f81e2760]:
              - generic [ref=f81e2761]: Nguồn gốc
              - text: "Thuật ngữ do Phil Calçado (SoundCloud) đặt; Sam Newman mô tả trong bài 'Pattern: Backends For Frontend' ngày 18/11/2015, dẫn feedback của Stewart Gleadow ('one experience, one BFF')."
            - paragraph [ref=f81e2762]:
              - generic [ref=f81e2763]: Giải pháp
              - text: Deploy 1 server-side component cho mỗi loại client (BFF cho iOS, BFF cho web...), đặt trong perimeter cạnh client, do team làm UI đó duy trì (Conway's Law). BFF gộp call nhiều downstream (catalog + inventory + wishlist cho 1 trang) song song, degrade graceful. Chấp nhận trùng lặp giữa các BFF; trích xuất abstraction tới lần 3.
            - paragraph [ref=f81e2764]:
              - text: "Liên quan:"
              - link "API gateway pattern" [ref=f81e2765] [cursor=pointer]:
                - /url: "#api-gateway-pattern"
              - text: ","
              - link "API-first design" [ref=f81e2766] [cursor=pointer]:
                - /url: "#api-first-design"
              - text: ", Query parameter design,"
              - link "API gateway" [ref=f81e2767] [cursor=pointer]:
                - /url: "#api-gateway"
              - text: ","
              - link "microservices" [ref=f81e2768] [cursor=pointer]:
                - /url: "#microservices"
              - text: ","
              - link "monolith" [ref=f81e2769] [cursor=pointer]:
                - /url: "#monolith"
          - article [ref=f81e2770]:
            - heading "Conditional requests & 304 Not Modified" [level=4] [ref=f81e2771]
            - paragraph [ref=f81e2772]: "còn gọi: If-None-Match, If-Modified-Since, revalidation"
            - paragraph [ref=f81e2773]:
              - generic [ref=f81e2774]: Vấn đề
              - text: Reload trang trả lại toàn bộ body dù dữ liệu không đổi - lãng phí băng thông, chậm, đặc biệt với asset/API lớn.
            - paragraph [ref=f81e2775]:
              - generic [ref=f81e2776]: Nguồn gốc
              - text: RFC 9110 section 13 (conditional requests) + RFC 9111 (caching) - 304 dùng để cập nhật metadata cache.
            - paragraph [ref=f81e2777]:
              - generic [ref=f81e2778]: Giải pháp
              - text: "Client gửi If-None-Match: <etag> (hoặc If-Modified-Since); nếu validator khớp server trả 304 không body, client dùng bản cache. GET tĩnh còn dùng If-Match để chặn ghi đè. Cache nhận 304 MUST cập nhật header trường từ response 304 đó."
            - paragraph [ref=f81e2779]:
              - text: "Liên quan:"
              - link "ETag/Last-Modified caching" [ref=f81e2780] [cursor=pointer]:
                - /url: "#etag-last-modified-caching"
              - text: ","
              - link "Optimistic concurrency (ETag/If-Match)" [ref=f81e2781] [cursor=pointer]:
                - /url: "#optimistic-concurrency-etag-if-match"
              - text: ","
              - link "HTTP caching semantics (Cache-Control)" [ref=f81e2782] [cursor=pointer]:
                - /url: "#http-caching-semantics-cache-control"
          - article [ref=f81e2783]:
            - heading "Content negotiation" [level=4] [ref=f81e2784]
            - paragraph [ref=f81e2785]: "còn gọi: Accept header, proactive negotiation, media type selection"
            - paragraph [ref=f81e2786]:
              - generic [ref=f81e2787]: Vấn đề
              - text: Muốn trả XML cho client cũ, JSON cho client mới, bản in PDF cho in... nếu tạo endpoint riêng thì nhân đôi API và khó duy trì.
            - paragraph [ref=f81e2788]:
              - generic [ref=f81e2789]: Nguồn gốc
              - text: RFC 9110 section 12 (Content Negotiation) - kế thừa framework negotiation từ HTTP/1.1 (RFC 2616).
            - paragraph [ref=f81e2790]:
              - generic [ref=f81e2791]: Giải pháp
              - text: "Proactive: client gửi Accept, Accept-Language, Accept-Encoding (kèm q value ưu tiên); server chọn representation và trả kèm Vary để cache phân biệt. Reactive: server trả 406/415 kèm list option. Nếu response phụ thuộc Accept thì PHẢI có Vary: Accept, không cache lẫn."
            - paragraph [ref=f81e2792]:
              - text: "Liên quan:"
              - link "Vary header" [ref=f81e2793] [cursor=pointer]:
                - /url: "#vary-header"
              - text: ","
              - link "HTTP caching semantics (Cache-Control)" [ref=f81e2794] [cursor=pointer]:
                - /url: "#http-caching-semantics-cache-control"
              - text: ", Representational state"
          - article [ref=f81e2795]:
            - heading "Contract-first" [level=4] [ref=f81e2796]
            - paragraph [ref=f81e2797]: "còn gọi: contract-first development, schema-first, design by contract"
            - paragraph [ref=f81e2798]:
              - generic [ref=f81e2799]: Vấn đề
              - text: "Implement trước rồi sinh spec từ code: spec là ảnh chụp cái đã có, không ai review được contract trước khi code; schema drift giữa các service im lặng."
            - paragraph [ref=f81e2800]:
              - generic [ref=f81e2801]: Nguồn gốc
              - text: Thuật ngữ gắn với OpenAPI/gRPC (define .proto trước khi viết service) - thực hành chuẩn của API-first.
            - paragraph [ref=f81e2802]:
              - generic [ref=f81e2803]: Giải pháp
              - text: Soạn contract (OpenAPI hay protobuf) → review + version nó như sản phẩm → sinh stub/mock → backend implement, frontend viết theo mock → CI chạy contract test (khớp implementation với spec). Breaking change bị chặn ngay ở vòng review contract.
            - paragraph [ref=f81e2804]:
              - text: "Liên quan:"
              - link "OpenAPI/Swagger" [ref=f81e2805] [cursor=pointer]:
                - /url: "#openapi-swagger"
              - text: ","
              - link "API-first design" [ref=f81e2806] [cursor=pointer]:
                - /url: "#api-first-design"
              - text: ", gRPC (HTTP/2, protobuf)"
          - article [ref=f81e2807]:
            - heading "CORS preflight (OPTIONS)" [level=4] [ref=f81e2808]
            - paragraph [ref=f81e2809]: "còn gọi: Cross-Origin Resource Sharing, preflight request, Access-Control-Allow-*"
            - paragraph [ref=f81e2810]:
              - generic [ref=f81e2811]: Vấn đề
              - text: Same-origin policy chặn JS gọi API khác domain; nếu server không trả header đúng thì browser nuốt response, JS không thấy lỗi chi tiết.
            - paragraph [ref=f81e2812]:
              - generic [ref=f81e2813]: Nguồn gốc
              - text: Chuẩn hóa bởi WHATWG Fetch spec (W3C CORS cũ đã obsolete); browser hỗ trợ rộng từ 7/2015.
            - paragraph [ref=f81e2814]:
              - generic [ref=f81e2815]: Giải pháp
              - text: "Request 'đơn giản' (GET/HEAD/POST + header safelisted, content-type text/plain...) không preflight, server trả Access-Control-Allow-Origin. Request 'phức tạp' (method khác, custom header) browser gửi OPTIONS trước với Origin + Access-Control-Request-Method; server trả Allow-Methods/Allow-Headers, cache được qua Access-Control-Max-Age. Request có credential thì không được dùng *, phải chỉ định origin cụ thể + Allow-Credentials: true."
            - paragraph [ref=f81e2816]:
              - text: "Liên quan:"
              - link "Vary header" [ref=f81e2817] [cursor=pointer]:
                - /url: "#vary-header"
              - text: ", Status codes"
          - article [ref=f81e2818]:
            - heading "Deprecation/sunset headers" [level=4] [ref=f81e2819]
            - paragraph [ref=f81e2820]: "còn gọi: Sunset header, Deprecation header, rel=sunset"
            - paragraph [ref=f81e2821]:
              - generic [ref=f81e2822]: Vấn đề
              - text: Client chỉ biết API bị gỡ khi nó hỏng 500/404 giữa đêm; không có tín hiệu máy đọc để cảnh báo trước.
            - paragraph [ref=f81e2823]:
              - generic [ref=f81e2824]: Nguồn gốc
              - text: draft-ietf-httpapi-sunset (IETF HTTPAPI WG - Internet-Draft, chưa thành RFC khi research; Roberto Polli và cộng sự trong nhóm HTTPAPI liên quan).
            - paragraph [ref=f81e2825]:
              - generic [ref=f81e2826]: Giải pháp
              - text: "Server trả header Deprecation (thời điểm công bố deprecated) và Sunset: <HTTP-date> (thời điểm tắt hẳn) trên response; link relation ' Sunset' chỉ trang thông báo. Client/SDK đọc được thì log warning và lên kế hoạch migrate thay vì chờ outage."
            - paragraph [ref=f81e2827]:
              - text: "Liên quan:"
              - link "API deprecation policy" [ref=f81e2828] [cursor=pointer]:
                - /url: "#api-deprecation-policy"
              - text: ", Rate limit headers"
          - article [ref=f81e2829]:
            - heading "ETag/Last-Modified caching" [level=4] [ref=f81e2830]
            - paragraph [ref=f81e2831]: "còn gọi: entity tag, strong/weak validator, Last-Modified"
            - paragraph [ref=f81e2832]:
              - generic [ref=f81e2833]: Vấn đề
              - text: Không có validator thì không phân biệt được 'response cũ' với 'response mới giống hệt', conditional request không hoạt động.
            - paragraph [ref=f81e2834]:
              - generic [ref=f81e2835]: Nguồn gốc
              - text: "RFC 9110 section 8.8.3-8.8.4: ETag strong (bản byte-different) vs weak (semantic khác); Last-Modified chỉ có độ phân giải tới giây nên không đủ với update sub-second (Azure guidelines cảnh báo)."
            - paragraph [ref=f81e2836]:
              - generic [ref=f81e2837]: Giải pháp
              - text: Server trả ETag mỗi khi trả/update resource; dùng làm validator cho 304 và làm khóa optimistic cho If-Match. Weak etag (W/ prefix) dùng khi content negotiation/ghi gzip làm byte thay đổi nhưng ngữ nghĩa không đổi.
            - paragraph [ref=f81e2838]:
              - text: "Liên quan:"
              - link "Optimistic concurrency (ETag/If-Match)" [ref=f81e2839] [cursor=pointer]:
                - /url: "#optimistic-concurrency-etag-if-match"
              - text: ","
              - link "Conditional requests & 304 Not Modified" [ref=f81e2840] [cursor=pointer]:
                - /url: "#conditional-requests-304-not-modified"
              - text: ","
              - link "HTTP caching semantics (Cache-Control)" [ref=f81e2841] [cursor=pointer]:
                - /url: "#http-caching-semantics-cache-control"
          - article [ref=f81e2842]:
            - heading "Field masks" [level=4] [ref=f81e2843]
            - paragraph [ref=f81e2844]: "còn gọi: google.protobuf.FieldMask, update_mask, mask parameter"
            - paragraph [ref=f81e2845]:
              - generic [ref=f81e2846]: Vấn đề
              - text: PATCH với body đầy đủ làm client phải đọc-modify-write; server không biết field nào client cố tình sửa so với field chỉ vô tình gửi kèm.
            - paragraph [ref=f81e2847]:
              - generic [ref=f81e2848]: Nguồn gốc
              - text: Google AIP-161 (Field Masks) - dùng google.protobuf.FieldMask làm syntax chuẩn cho cả đọc và ghi.
            - paragraph [ref=f81e2849]:
              - generic [ref=f81e2850]: Giải pháp
              - text: Mask liệt kê đường dẫn field tương đối với resource (title, author.given_name), traversal dấu chấm, wildcard '*' trên repeated/map, backquote cho key lạ. Update kèm update_mask thì server chỉ sửa field trong mask. Mask đọc phải khớp mask ghi (đọc rồi ghi lại = no-op), field output-only bị bỏ qua khi ghi.
            - paragraph [ref=f81e2851]:
              - text: "Liên quan:"
              - link "Partial response (fields param)" [ref=f81e2852] [cursor=pointer]:
                - /url: "#partial-response-fields-param"
              - text: ","
              - link "PUT vs PATCH" [ref=f81e2853] [cursor=pointer]:
                - /url: "#put-vs-patch"
          - article [ref=f81e2854]:
            - heading "Filtering/sorting query params" [level=4] [ref=f81e2855]
            - paragraph [ref=f81e2856]: "còn gọi: query filter, sort parameter, filter syntax"
            - paragraph [ref=f81e2857]:
              - generic [ref=f81e2858]: Vấn đề
              - text: Mỗi client tự tạo endpoint con ('/users/active', '/users/banned') làm số endpoint bùng nổ và không mở rộng được khi thêm tiêu chí lọc.
            - paragraph [ref=f81e2859]:
              - generic [ref=f81e2860]: Nguồn gốc
              - text: Google AIP-160 (filter string syntax với EBNF grammar); cộng đồng REST dùng query param như ?status=active&sort=-created_at.
            - paragraph [ref=f81e2861]:
              - generic [ref=f81e2862]: Giải pháp
              - text: "API nhận filter dạng chuỗi có ngữ pháp: so sánh (=, !=, <, >, <=, >=), AND/OR, NOT, wildcard, traversal dấu chấm (a.b), toán tử has ':'. Sort qua param riêng (vd sort=-created_at). Validate trả INVALID_ARGUMENT/400 khi field không tồn tại hoặc sai kiểu. Filter kết hợp pagination: đổi tham số ngoài filter giữa các trang thì lỗi."
            - paragraph [ref=f81e2863]:
              - text: "Liên quan:"
              - link "Pagination (offset vs cursor)" [ref=f81e2864] [cursor=pointer]:
                - /url: "#pagination-offset-vs-cursor"
              - text: ", Query parameter design, N+1 at API layer (sparse fieldsets)"
          - article [ref=f81e2865]:
            - heading "HTTP caching semantics (Cache-Control)" [level=4] [ref=f81e2866]
            - paragraph [ref=f81e2867]: "còn gọi: Cache-Control, max-age, no-store, private/public"
            - paragraph [ref=f81e2868]:
              - generic [ref=f81e2869]: Vấn đề
              - text: Response chứa dữ liệu cá nhân bị shared cache/CDN lưu và trả cho người khác; hoặc response không cache được làm tốn bandwidth và làm chậm.
            - paragraph [ref=f81e2870]:
              - generic [ref=f81e2871]: Nguồn gốc
              - text: RFC 9111 HTTP Caching (STD 98, 2022, Fielding/Nottingham/Reschke) - kế thừa RFC 7234.
            - paragraph [ref=f81e2872]:
              - generic [ref=f81e2873]: Giải pháp
              - text: "max-age: hết hạn sau N giây (s-maxage ưu tiên cho shared cache); no-store: không được lưu gì; private: chỉ browser cache được, shared cache cấm; public: force cacheable kể cả kèm Authorization; stale-while-revalidate (RFC 5861): phục vụ bản cũ khi đang revalidate. Hết hạn thì revalidate bằng conditional request."
            - paragraph [ref=f81e2874]:
              - text: "Liên quan:"
              - link "Conditional requests & 304 Not Modified" [ref=f81e2875] [cursor=pointer]:
                - /url: "#conditional-requests-304-not-modified"
              - text: ","
              - link "ETag/Last-Modified caching" [ref=f81e2876] [cursor=pointer]:
                - /url: "#etag-last-modified-caching"
              - text: ","
              - link "Vary header" [ref=f81e2877] [cursor=pointer]:
                - /url: "#vary-header"
          - article [ref=f81e2878]:
            - heading "Optimistic concurrency (ETag/If-Match)" [level=4] [ref=f81e2879]
            - paragraph [ref=f81e2880]: "còn gọi: conditional request, lost update prevention, optimistic locking"
            - paragraph [ref=f81e2881]:
              - generic [ref=f81e2882]: Vấn đề
              - text: Hai client cùng đọc rồi cùng ghi, bản ghi sau đè lên bản trước mà không ai báo (lost update); pessimistic lock giữ khóa quá lâu giảm throughput.
            - paragraph [ref=f81e2883]:
              - generic [ref=f81e2884]: Nguồn gốc
              - text: ETag từ RFC 2616/7232, nay RFC 9110 section 8.8.3; Azure REST API Guidelines khuyến nghị mạnh ETag thay Last-Modified vì ngày không phân biệt cập nhật dưới giây.
            - paragraph [ref=f81e2885]:
              - generic [ref=f81e2886]: Giải pháp
              - text: "Server trả ETag (version/validator) kèm resource; client ghi kèm If-Match: ETag. Server thấy ETag cũ trả 412 Precondition Failed. GET kèm If-None-Match khớp trả 304. Nếu server muốn chặn ghi thiếu conditional thì trả 428 Precondition Required (RFC 6585)."
            - paragraph [ref=f81e2887]:
              - text: "Liên quan:"
              - link "Conditional requests & 304 Not Modified" [ref=f81e2888] [cursor=pointer]:
                - /url: "#conditional-requests-304-not-modified"
              - text: ","
              - link "ETag/Last-Modified caching" [ref=f81e2889] [cursor=pointer]:
                - /url: "#etag-last-modified-caching"
              - text: ","
              - link "PUT vs PATCH" [ref=f81e2890] [cursor=pointer]:
                - /url: "#put-vs-patch"
          - article [ref=f81e2891]:
            - heading "Partial response (fields param)" [level=4] [ref=f81e2892]
            - paragraph [ref=f81e2893]: "còn gọi: fields parameter, sparse fieldsets, read_mask, partial responses"
            - paragraph [ref=f81e2894]:
              - generic [ref=f81e2895]: Vấn đề
              - text: Resource lớn (user 50 field) trả đầy đủ làm response nặng, mobile tốn data, compute lãng phí; client chỉ cần 3 field.
            - paragraph [ref=f81e2896]:
              - generic [ref=f81e2897]: Nguồn gốc
              - text: Google APIs 'fields' query param, chuẩn hóa trong AIP-157 (Partial Responses) và AIP-161 (Field Masks).
            - paragraph [ref=f81e2898]:
              - generic [ref=f81e2899]: Giải pháp
              - text: "Client truyền danh sách field cần (vd fields=id,name,email hoặc FieldMask proto qua query/header). Mặc định '*' (lấy tất cả) - đổi default này là breaking change. AIP-157: thay vì read_mask trên request nên để qua system parameter; cách khác là enum view (BASIC/FULL) khi chỉ có vài tổ hợp cố định."
            - paragraph [ref=f81e2900]:
              - text: "Liên quan:"
              - link "Field masks" [ref=f81e2901] [cursor=pointer]:
                - /url: "#field-masks"
              - text: ", N+1 at API layer (sparse fieldsets),"
              - link "Envelope pattern" [ref=f81e2902] [cursor=pointer]:
                - /url: "#envelope-pattern"
          - article [ref=f81e2903]:
            - heading "Rate limit headers (429 + Retry-After + RateLimit)" [level=4] [ref=f81e2904]
            - paragraph [ref=f81e2905]: "còn gọi: throttling headers, X-RateLimit, RateLimit-Policy"
            - paragraph [ref=f81e2906]:
              - generic [ref=f81e2907]: Vấn đề
              - text: Client vượt quota thì server trả 429 nhưng client không biết khi nào được thử lại, hoặc cả nghìn client retry cùng lúc gây sập tiếp (thundering herd).
            - paragraph [ref=f81e2908]:
              - generic [ref=f81e2909]: Nguồn gốc
              - text: 429 Too Many Requests từ RFC 6585 (2012, Nottingham & Fielding); Retry-After định nghĩa ở RFC 9110 section 10.2.3 (delta-seconds hoặc HTTP-date); header chuẩn RateLimit/RateLimit-Policy từ draft-ietf-httpapi-ratelimit-headers (Polli & Martínez Ruiz, 2022+).
            - paragraph [ref=f81e2910]:
              - generic [ref=f81e2911]: Giải pháp
              - text: "429 + Retry-After: client chờ đúng ngần đó giây. Draft chuẩn hóa: RateLimit-Limit (giới hạn đang tới hạn), RateLimit-Remaining (còn bao nhiêu), RateLimit-Reset (giây tới reset - dạng delay tránh lệch đồng hồ), RateLimit-Policy (100;w=60 nghĩa 100 req/60s). Giá trị là gợi ý không phải guarantee; nếu có cả Retry-After và RateLimit-Reset thì Retry-After thắng."
            - paragraph [ref=f81e2912]: "Liên quan: Rate limiting vs throttling vs quota, Exponential backoff + jitter, Status codes"
          - article [ref=f81e2913]:
            - heading "Retry guidance (safe methods)" [level=4] [ref=f81e2914]
            - paragraph [ref=f81e2915]: "còn gọi: automatic retry, retry policy, retryable status codes"
            - paragraph [ref=f81e2916]:
              - generic [ref=f81e2917]: Vấn đề
              - text: "Client retry tùy hứng: retry cả POST (tạo trùng), retry 400 vô hạn, hoặc không retry gì khi 503 thoáng qua làm mất availability."
            - paragraph [ref=f81e2918]:
              - generic [ref=f81e2919]: Nguồn gốc
              - text: "RFC 9110 section 9.2.2: 'Some requests can be automatically retried by a client in the event of an underlying connection failure' - áp cho method an toàn/idempotent."
            - paragraph [ref=f81e2920]:
              - generic [ref=f81e2921]: Giải pháp
              - text: "Retry an toàn: GET/HEAD khi lỗi kết nối (chưa nhận response); PUT/DELETE (idempotent) retry được; POST chỉ retry khi có idempotency key. Không retry 4xx (lỗi request thật). Với 429/503 tôn trọng Retry-After. Áp backoff + jitter để không dồn dập."
            - paragraph [ref=f81e2922]:
              - text: "Liên quan:"
              - link "Safe & idempotent methods" [ref=f81e2923] [cursor=pointer]:
                - /url: "#safe-idempotent-methods"
              - text: ", Exponential backoff + jitter,"
              - link "Idempotency key (Stripe pattern)" [ref=f81e2924] [cursor=pointer]:
                - /url: "#idempotency-key-stripe-pattern"
          - article [ref=f81e2925]:
            - heading "RFC 7807/9457 problem+json" [level=4] [ref=f81e2926]
            - paragraph [ref=f81e2927]: "còn gọi: application/problem+json, problem details, RFC 9457"
            - paragraph [ref=f81e2928]:
              - generic [ref=f81e2929]: Vấn đề
              - text: 403 hay 400 đơn lẻ không nói vì sao bị từ chối và cách sửa; mỗi API tự bịa format lỗi riêng gây fragment hóa.
            - paragraph [ref=f81e2930]:
              - generic [ref=f81e2931]: Nguồn gốc
              - text: RFC 7807 (2016, Mark Nottingham & Erik Wilde), bị thay thế bởi RFC 9457 (2023, Nottingham, Wilde, S. Dalal) thêm registry problem type URI.
            - paragraph [ref=f81e2932]:
              - generic [ref=f81e2933]: Giải pháp
              - text: "Media type application/problem+json với member: type (URI định dạng lỗi, mặc định about:blank), title (mô tả loại), status (bản sao HTTP status), detail (giải thích cho lần này), instance (URI occurrence cụ thể). Extension member tùy ý (vd balance) - client MUST bỏ qua field không nhận ra. Dùng thay vì tự bịa envelope lỗi."
            - paragraph [ref=f81e2934]:
              - text: "Liên quan:"
              - link "Error response shape" [ref=f81e2935] [cursor=pointer]:
                - /url: "#error-response-shape"
              - text: ", Status codes,"
              - link "Envelope pattern" [ref=f81e2936] [cursor=pointer]:
                - /url: "#envelope-pattern"
          - article [ref=f81e2937]:
            - heading "Vary header" [level=4] [ref=f81e2938]
            - paragraph [ref=f81e2939]: "còn gọi: Vary: Accept-Encoding, Vary: Origin, cache key variance"
            - paragraph [ref=f81e2940]:
              - generic [ref=f81e2941]: Vấn đề
              - text: "CDN cache 1 response cho request đầu (vd Accept-Encoding: gzip) rồi trả đúng bản đó cho client không nhận gzip; hoặc cache nhầm response CORS giữa các origin."
            - paragraph [ref=f81e2942]:
              - generic [ref=f81e2943]: Nguồn gốc
              - text: "RFC 9110 section 8.4 + RFC 9111 section 4.1: response có Vary không được dùng lại nếu header được nêu không khớp."
            - paragraph [ref=f81e2944]:
              - generic [ref=f81e2945]: Giải pháp
              - text: "Vary liệt kê request header mà response phụ thuộc: Vary: Accept-Encoding, Accept-Language, Origin. Vary: * = không bao giờ match. Đây là lý do content negotiation bắt buộc kèm Vary, và CORS nên kèm Vary: Origin khi trả origin cụ thể."
            - paragraph [ref=f81e2946]:
              - text: "Liên quan:"
              - link "Content negotiation" [ref=f81e2947] [cursor=pointer]:
                - /url: "#content-negotiation"
              - text: ","
              - link "HTTP caching semantics (Cache-Control)" [ref=f81e2948] [cursor=pointer]:
                - /url: "#http-caching-semantics-cache-control"
              - text: ","
              - link "CORS preflight (OPTIONS)" [ref=f81e2949] [cursor=pointer]:
                - /url: "#cors-preflight-options"
          - article [ref=f81e2950]:
            - heading "Webhook (delivery, retries, signature)" [level=4] [ref=f81e2951]
            - paragraph [ref=f81e2952]: "còn gọi: webhook callback, HTTP callback, push notification"
            - paragraph [ref=f81e2953]:
              - generic [ref=f81e2954]: Vấn đề
              - text: Polling hỏi server 'có gì mới?' liên tục tốn resources và chậm; tự dựng message bus riêng giữa 2 công ty thì không thực tế.
            - paragraph [ref=f81e2955]:
              - generic [ref=f81e2956]: Nguồn gốc
              - text: Thuật ngữ 'webhook' do Jeff Lindsay đặt năm 2007 (theo Wikipedia, derive từ programming term 'hook').
            - paragraph [ref=f81e2957]:
              - generic [ref=f81e2958]: Giải pháp
              - text: "Khi event xảy ra, source HTTP POST JSON tới URL đã đăng ký. Bắt buộc: verify chữ ký (Stripe-Signature HMAC-SHA256 với timestamp chống replay, tolerance 5 phút; IP allowlist), trả 2xx NGẮN trước khi xử lý nặng, retry với backoff (Stripe: tới 3 ngày, exponential backoff; sandbox 3 lần trong vài giờ), consumer idempotent vì event gửi lại, KHÔNG phụ thuộc thứ tự event (Stripe không guarantee order)."
            - paragraph [ref=f81e2959]:
              - text: "Liên quan:"
              - link "Webhook subscription" [ref=f81e2960] [cursor=pointer]:
                - /url: "#webhook-subscription"
              - text: ","
              - link "Idempotent consumer" [ref=f81e2961] [cursor=pointer]:
                - /url: "#idempotent-consumer"
              - text: ","
              - link "Exactly-once illusion vs at-least-once" [ref=f81e2962] [cursor=pointer]:
                - /url: "#exactly-once-illusion-vs-at-least-once"
          - article [ref=f81e2963]:
            - heading "Webhook subscription" [level=4] [ref=f81e2964]
            - paragraph [ref=f81e2965]: "còn gọi: webhook endpoint registration, event destination, subscribe events"
            - paragraph [ref=f81e2966]:
              - generic [ref=f81e2967]: Vấn đề
              - text: Server không biết URL nào của khách để gửi event; khách đổi URL thì event gửi vào chỗ cũ mất; gửi tất cả event cho mọi người thì lãng phí và đè nặng receiver.
            - paragraph [ref=f81e2968]:
              - generic [ref=f81e2969]: Nguồn gốc
              - text: Mẫu đăng ký endpoint có trong Stripe Webhooks/Dashboard, GitHub webhooks, AWS EventDestinations.
            - paragraph [ref=f81e2970]:
              - generic [ref=f81e2971]: Giải pháp
              - text: Client đăng ký URL + danh sách event type cần (webhook endpoint phải HTTPS public). Server cấp signing secret (vd whsec_...) để verify. Nên subscribe đúng event cần, xử lý bất đồng bộ qua queue, exempt route khỏi CSRF, bật TLS. Roll secret định kỳ (cho phép overlap 24h để rotate không downtime).
            - paragraph [ref=f81e2972]:
              - text: "Liên quan:"
              - link "Webhook (delivery, retries, signature)" [ref=f81e2973] [cursor=pointer]:
                - /url: "#webhook-delivery-retries-signature"
              - text: ","
              - link "API gateway pattern" [ref=f81e2974] [cursor=pointer]:
                - /url: "#api-gateway-pattern"
