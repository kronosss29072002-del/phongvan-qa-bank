          - article [ref=f81e2562]:
            - heading "HTTP/3 (QUIC)" [level=4] [ref=f81e2563]
            - paragraph [ref=f81e2564]: "còn gọi: QUIC, HTTP over QUIC"
            - paragraph [ref=f81e2565]:
              - generic [ref=f81e2566]: Vấn đề
              - text: HTTP/2 multiplex trên TCP → 1 packet mất là TCP chặn TOÀN BỘ byte phía sau, mọi stream đứng im dù chỉ stream liên quan bị mất (HOL blocking tầng vận chuyển); thêm nữa TCP + TLS mất 2–3 round-trip bắt tay, đổi Wi-Fi sang 4G là mất kết nối vì tứ giác (IP, port) đổi. Jim Roskind tại Google muốn sửa cả hai từ 2012.
            - paragraph [ref=f81e2567]:
              - generic [ref=f81e2568]: Nguồn gốc
              - text: Jim Roskin (Jim Roskind) tại Google thiết kế 2012, công bố 2013 (gQUIC); IETF chuẩn hóa RFC 9000 (5/2021); IETF đổi tên 'HTTP-over-QUIC' thành HTTP/3 (10/2018).
            - paragraph [ref=f81e2569]:
              - generic [ref=f81e2570]: Giải pháp
              - text: QUIC chạy trên UDP, gộp truyền tải + TLS 1.3 vào 1-RTT handshake, mỗi stream có flow-control riêng (mất packet chỉ chặn stream đó), Connection ID giữ kết nối sống khi đổi IP; HTTP/3 chỉ là HTTP chạy phía trên QUIC.
