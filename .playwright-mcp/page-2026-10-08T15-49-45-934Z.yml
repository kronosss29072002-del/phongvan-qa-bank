          - heading "Mạng & Giao thức 19" [level=3] [ref=f81e2450]:
            - text: Mạng & Giao thức
            - generic [ref=f81e2451]: "19"
          - article [ref=f81e2452]:
            - heading "C10k problem" [level=4] [ref=f81e2453]
            - paragraph [ref=f81e2454]: "còn gọi: bài toán 10.000 kết nối, bài toán C10K"
            - paragraph [ref=f81e2455]:
              - generic [ref=f81e2456]: Vấn đề
              - text: "Năm 1999, Dan Kegel chỉ ra rằng phần cứng đã không còn là nút thắt (máy $1200 với 2GB RAM đủ để phục vụ 10.000 client, mỗi client chỉ cần ~50KHz CPU) — thứ vỡ là mô hình phần mềm: thread-per-connection hết stack ở vài trăm thread, select bị cap 1024 fd và O(n) quét, poll chậm khi quét hàng nghìn descriptor mostly-idle. Web server không thể scale theo phần cứng vì kiến trúc I/O cũ."
            - paragraph [ref=f81e2457]:
              - generic [ref=f81e2458]: Nguồn gốc
              - text: Dan Kegel, 1999 (kegel.com/c10k.html)
            - paragraph [ref=f81e2459]:
              - generic [ref=f81e2460]: Giải pháp
              - text: "Kegel hệ thống hóa 5 hướng giải: non-blocking I/O + readiness (select/poll), edge-triggered notification (epoll/kqueue), asynchronous completion (IOCP/AIO), thread-per-client (giữ làm baseline), và server in-kernel. Kết luận: non-blocking + event-driven + epoll/kqueue cho phép một máy nhỏ phục vụ vượt 10k kết nối."
            - paragraph [ref=f81e2461]:
