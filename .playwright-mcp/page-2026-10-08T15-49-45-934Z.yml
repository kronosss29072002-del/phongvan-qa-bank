              - link "Apache Kafka" [ref=f81e6539] [cursor=pointer]:
                - /url: "#apache-kafka"
          - article [ref=f81e6540]:
            - heading "Event sourcing" [level=4] [ref=f81e6541]
            - paragraph [ref=f81e6542]: "còn gọi: lưu nguồn sự kiện, event replay"
            - paragraph [ref=f81e6543]:
              - generic [ref=f81e6544]: Vấn đề
              - text: "Chỉ lưu state hiện tại (UPDATE số dư = 100): không trả lời được 'lúc 10h số dư bao nhiêu', không audit ai đổi khi nào, bug ghi nhầm thì dữ liệu quá khứ vĩnh viễn mất — không còn gì để tra hay replay khi debug."
            - paragraph [ref=f81e6545]:
              - generic [ref=f81e6546]: Nguồn gốc
              - text: Martin Fowler, bài 'Event Sourcing' ngày 12/12/2005
            - paragraph [ref=f81e6547]:
              - generic [ref=f81e6548]: Giải pháp
              - text: Ghi mọi thay đổi thành dãy event bất biến (append-only); state hiện tại là kết quả fold(events); rebuild từ đầu, query tại thời điểm quá khứ, phát lại event cũ vào môi trường test đều được.
            - paragraph [ref=f81e6549]:
              - text: "Liên quan:"
              - link "Event-driven architecture" [ref=f81e6550] [cursor=pointer]:
