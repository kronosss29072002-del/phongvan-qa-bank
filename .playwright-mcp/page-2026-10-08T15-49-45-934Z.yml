              - text: ","
              - link "rollback" [ref=f81e5567] [cursor=pointer]:
                - /url: "#rollback"
              - text: ","
              - link "release vs deploy" [ref=f81e5568] [cursor=pointer]:
                - /url: "#release-vs-deploy"
          - article [ref=f81e5569]:
            - heading "Config management" [level=4] [ref=f81e5570]
            - paragraph [ref=f81e5571]: "còn gọi: quản lý cấu hình, Puppet, Chef, Ansible, CFEngine, cấu hình như code"
            - paragraph [ref=f81e5572]:
              - generic [ref=f81e5573]: Vấn đề
              - text: "Mỗi server cấu hình tay: đổi cấu hình nginx thì server A được cập nhật, server B quên; dần dần production và staging lệch nhau tới mức 'bug chỉ reproduce được trên staging'. Không ai trả lời được câu 'cấu hình nào đang thực sự chạy trên máy đó'."
            - paragraph [ref=f81e5574]:
              - generic [ref=f81e5575]: Nguồn gốc
              - text: CFEngine (Mark Burgess) năm 1993 đi trước; Puppet của Luke Kanies ra mắt 2005; Chef năm 2009; Ansible của Michael DeHaan năm 2012.
            - paragraph [ref=f81e5576]:
              - generic [ref=f81e5577]: Giải pháp
              - text: "Đặt cấu hình thành code và áp dụng idempotent, đồng nhất lên mọi node (Puppet/Chef/Ansible/Salt): chạy lại không làm hỏng, cấu hình thay đổi đi qua git, server tự converge về trạng thái khai báo."
            - paragraph [ref=f81e5578]:
              - text: "Liên quan:"
              - link "Infrastructure as Code (Terraform, Pulumi)" [ref=f81e5579] [cursor=pointer]:
                - /url: "#infrastructure-as-code-terraform-pulumi"
              - text: ", environment (dev/staging/prod),"
              - link "secrets in runtime" [ref=f81e5580] [cursor=pointer]:
                - /url: "#secrets-in-runtime"
              - text: ","
              - link "immutable infrastructure" [ref=f81e5581] [cursor=pointer]:
                - /url: "#immutable-infrastructure"
          - article [ref=f81e5582]:
            - heading "Deployment & Replica (ReplicaSet)" [level=4] [ref=f81e5583]
            - paragraph [ref=f81e5584]: "còn gọi: Deployment, ReplicaSet, replicas, bản sao, replication"
            - paragraph [ref=f81e5585]:
              - generic [ref=f81e5586]: Vấn đề
              - text: "Cần 3 bản sao service để chịu tải nên người ta tự nhân process trên 3 máy bằng script: khi 1 bản chết không ai khởi động lại, và mỗi lần upgrade là stop/start tay từng cái — có lúc traffic chạm cả version cũ lẫn mới cùng lúc, dữ liệu lẫn lộn."
            - paragraph [ref=f81e5587]:
              - generic [ref=f81e5588]: Nguồn gốc
              - text: ReplicaSet (trước đó là ReplicationController) và Deployment là API gốc của Kubernetes từ các version đầu.
            - paragraph [ref=f81e5589]:
              - generic [ref=f81e5590]: Giải pháp
              - text: Deployment khai báo số replica mong muốn; ReplicaSet giữ đúng số đó (tạo pod mới khi có pod chết), Deployment thêm chiến lược rollout (tạo bản mới, health check, thay dần, giữ bản cũ để dừng khi fail) — upgrade không làm mất bản đang serve.
            - paragraph [ref=f81e5591]:
              - text: "Liên quan:"
              - link "Kubernetes" [ref=f81e5592] [cursor=pointer]:
                - /url: "#kubernetes"
              - text: ","
              - link "pod" [ref=f81e5593] [cursor=pointer]:
                - /url: "#pod"
              - text: ", HPA, rolling deploy / zero-downtime,"
              - link "blue-green deploy" [ref=f81e5594] [cursor=pointer]:
                - /url: "#blue-green-deploy"
          - article [ref=f81e5595]:
            - heading "Feature flag" [level=4] [ref=f81e5596]
            - paragraph [ref=f81e5597]: "còn gọi: feature toggle, feature switch, cờ tính năng, toggle"
            - paragraph [ref=f81e5598]:
              - generic [ref=f81e5599]: Vấn đề
              - text: Nhánh tính năng sống 2-3 tuần rồi merge là conflict dày đặc; và ngay cả khi merge xong, muốn bật cho 1% user hay tắt ngay khi tính năng mới làm cháy CPU giờ cao điểm thì vẫn phải deploy lại cả build — không có đòn bẩy nào ngoài roll back.
            - paragraph [ref=f81e5600]:
              - generic [ref=f81e5601]: Nguồn gốc
              - text: không rõ người đặt ra đầu tiên; được hệ thống hóa bởi Pete Hodgson trên martinfowler.com năm 2017 (chia release/experiment/permissioning/operational toggles).
            - paragraph [ref=f81e5602]:
              - generic [ref=f81e5603]: Giải pháp
              - text: "Bọc code mới sau điều kiện runtime (if flag_enabled): nhánh được gộp sớm, code đã lên production nhưng hành vi chưa bật; tung dần theo % user, tắt được không cần deploy — và phải dọn flag sau khi rollout xong."
            - paragraph [ref=f81e5604]:
              - text: "Liên quan:"
              - link "release vs deploy" [ref=f81e5605] [cursor=pointer]:
                - /url: "#release-vs-deploy"
              - text: ", trunk-based vs git flow,"
              - link "canary deploy" [ref=f81e5606] [cursor=pointer]:
                - /url: "#canary-deploy"
              - text: ","
              - link "rollback" [ref=f81e5607] [cursor=pointer]:
                - /url: "#rollback"
          - article [ref=f81e5608]:
            - heading "Helm" [level=4] [ref=f81e5609]
            - paragraph [ref=f81e5610]: "còn gọi: Helm chart, chart, package manager cho Kubernetes"
            - paragraph [ref=f81e5611]:
              - generic [ref=f81e5612]: Vấn đề
              - text: Deploy một app lên Kubernetes phải chuyền tay 10 file YAML (Deployment, Service, ConfigMap, Ingress...); đổi port hay image tag là sửa 10 chỗ, và không có khái niệm 'bản 1.4.2 của bộ manifest này' để promote qua các môi trường hay rollback theo version.
            - paragraph [ref=f81e5613]:
              - generic [ref=f81e5614]: Nguồn gốc
              - text: Bắt đầu năm 2015 tại Deis ('Helm Classic', ra mắt ở KubeCon đầu tiên); tháng 1/2016 sáp nhập với Kubernetes Deployment Manager của Google; hiện là dự án CNCF graduated.
            - paragraph [ref=f81e5615]:
              - generic [ref=f81e5616]: Giải pháp
              - text: "Helm đóng gói manifest thành chart có version, tham số hóa bằng values.yaml theo môi trường, rồi `install`/`upgrade`/`rollback` một lệnh — apt/npm cho Kubernetes, quản lý được vòng đời (values, history, rollback)."
            - paragraph [ref=f81e5617]:
              - text: "Liên quan:"
              - link "Kubernetes" [ref=f81e5618] [cursor=pointer]:
                - /url: "#kubernetes"
              - text: ","
              - link "GitOps" [ref=f81e5619] [cursor=pointer]:
                - /url: "#gitops"
              - text: ", deployment & replica,"
              - link "rollback" [ref=f81e5620] [cursor=pointer]:
                - /url: "#rollback"
          - article [ref=f81e5621]:
            - heading "Infrastructure as Code (Terraform, Pulumi)" [level=4] [ref=f81e5622]
            - paragraph [ref=f81e5623]: "còn gọi: IaC, hạ tầng như mã, Terraform, Pulumi"
            - paragraph [ref=f81e5624]:
              - generic [ref=f81e5625]: Vấn đề
              - text: Nhấn 'tạo server' trên console cloud rồi quên ghi lại; 6 tháng sau dựng lại môi trường staging thì thiếu firewall rule, thiếu subnet, không ai giải thích được hạ tầng đang có gì. Hạ tầng không nằm trong git nên không diff được, không review được, không reproduce được.
            - paragraph [ref=f81e5626]:
              - generic [ref=f81e5627]: Nguồn gốc
              - text: Terraform ra mắt bản 0.1 tháng 7/2014 (HashiCorp, Mitchell Hashimoto); Pulumi Corporation thành lập năm 2017 (Joe Duffy & Eric Rudder); gốc khái niệm đi từ configuration management.
            - paragraph [ref=f81e5628]:
              - generic [ref=f81e5629]: Giải pháp
              - text: "Mô tả hạ tầng bằng file code và thay đổi qua quy trình git: Terraform dùng HCL declarative với `plan` trước khi `apply`; Pulumi dùng TypeScript/Python/Golang thật. Môi trường dựng lại được từ 0, thay đổi ai sửa cũng trace được."
            - paragraph [ref=f81e5630]:
              - text: "Liên quan:"
              - link "config management" [ref=f81e5631] [cursor=pointer]:
                - /url: "#config-management"
              - text: ","
              - link "immutable infrastructure" [ref=f81e5632] [cursor=pointer]:
                - /url: "#immutable-infrastructure"
              - text: ","
              - link "GitOps" [ref=f81e5633] [cursor=pointer]:
                - /url: "#gitops"
              - text: ", environment (dev/staging/prod)"
          - article [ref=f81e5634]:
            - heading "Kubernetes" [level=4] [ref=f81e5635]
            - paragraph [ref=f81e5636]: "còn gọi: K8s, kubernetes cluster, orchestrator container"
            - paragraph [ref=f81e5637]:
              - generic [ref=f81e5638]: Vấn đề
              - text: "Sau khi có container, team deploy hàng chục service lên vài chục server bằng script tay: server chết thì service chết luôn, muốn thêm instance phải tự cấu hình load balancer, upgrade thì chạy script từng máy. Quy mô tăng từ 5 lên 50 service thì cách này vỡ hoàn toàn và chỉ vài người thuộc lòng server."
            - paragraph [ref=f81e5639]:
              - generic [ref=f81e5640]: Nguồn gốc
              - text: Google công bố open-source tháng 8/2014, rút ra từ kinh nghiệm hệ thống nội bộ Borg; chuyển giao cho CNCF năm 2015.
            - paragraph [ref=f81e5641]:
              - generic [ref=f81e5642]: Giải pháp
              - text: Khai báo mong muốn ('cần 3 bản sao của service này') dưới dạng API; control plane tự đối chiếu hiện trạng với mong muốn — schedule pod lên node phù hợp, khởi động lại khi chết, scale — con người lo việc khai báo, máy lo việc giữ đúng.
            - paragraph [ref=f81e5643]:
              - text: "Liên quan:"
              - link "pod" [ref=f81e5644] [cursor=pointer]:
                - /url: "#pod"
              - text: ", deployment & replica, service & ingress, HPA,"
              - link "helm" [ref=f81e5645] [cursor=pointer]:
                - /url: "#helm"
              - text: ","
              - link "container (Docker, container image)" [ref=f81e5646] [cursor=pointer]:
                - /url: "#container-docker-container-image"
          - article [ref=f81e5647]:
            - heading "Monorepo vs Polyrepo" [level=4] [ref=f81e5648]
            - paragraph [ref=f81e5649]: "còn gọi: monorepo, polyrepo, đa repo, single repo"
            - paragraph [ref=f81e5650]:
              - generic [ref=f81e5651]: Vấn đề
              - text: "100 repo riêng lẻ: đổi 1 interface dùng chung phải mở 100 PR, version dependency giữa các service lệch nhau, không thể atomic một thay đổi cross-service. Ngược lại, một repo khổng lồ không có tooling thì CI chậm, quyền truy cập thô, git operations ì ạch."
            - paragraph [ref=f81e5652]:
              - generic [ref=f81e5653]: Nguồn gốc
              - text: Monorepo là thực hành lâu đời của Google (mô tả trong bài 'Large-Scale Cluster Management at Google with Bazel', SoCC 2016); polyrepo là mặc định của kỷ nguyên GitHub.
            - paragraph [ref=f81e5654]:
              - generic [ref=f81e5655]: Giải pháp
              - text: "Monorepo gom nhiều service/library vào 1 trunk: thay đổi cross-cutting atomic, code share và refactor toàn cục được (cần tool như Bazel/Nx/Turborepo). Polyrepo mỗi service 1 repo: ownership, quyền và deploy tách bạch rõ hơn. Chọn theo quy mô team và tooling, không theo trendy."
            - paragraph [ref=f81e5656]:
              - text: "Liên quan: trunk-based vs git flow,"
              - link "build artifact" [ref=f81e5657] [cursor=pointer]:
                - /url: "#build-artifact"
              - text: ", CI (continuous integration)"
          - article [ref=f81e5658]:
            - heading "Pod" [level=4] [ref=f81e5659]
            - paragraph [ref=f81e5660]: "còn gọi: kubernetes pod, đơn vị nhỏ nhất K8s"
            - paragraph [ref=f81e5661]:
              - generic [ref=f81e5662]: Vấn đề
              - text: Container thuần túy chỉ là 1 process cách ly — orchestrator không biết 'một bộ ứng dụng' gồm nhiều container (app + log agent + proxy) nào thì nên nằm cùng nhau, cũng không biết cấp IP ra sao khi chúng phải nói chuyện nội bộ qua localhost.
            - paragraph [ref=f81e5663]:
              - generic [ref=f81e5664]: Nguồn gốc
              - text: Là primitive gốc của Kubernetes (Google, 2014).
            - paragraph [ref=f81e5665]:
              - generic [ref=f81e5666]: Giải pháp
              - text: "Pod là đơn vị nhỏ nhất Kubernetes schedule: 1 container (thường) hoặc vài container chung network namespace, IP và volume, luôn sống cùng node; thay vì sửa đổi, ta kill và tạo pod mới."
            - paragraph [ref=f81e5667]:
              - text: "Liên quan:"
              - link "Kubernetes" [ref=f81e5668] [cursor=pointer]:
                - /url: "#kubernetes"
              - text: ", deployment & replica,"
              - link "sidecar" [ref=f81e5669] [cursor=pointer]:
                - /url: "#sidecar"
              - text: ","
              - link "container (Docker, container image)" [ref=f81e5670] [cursor=pointer]:
                - /url: "#container-docker-container-image"
          - article [ref=f81e5671]:
            - heading "Secrets in runtime" [level=4] [ref=f81e5672]
            - paragraph [ref=f81e5673]: "còn gọi: quản lý secret, runtime secrets, Vault, secrets manager, bí mật khi chạy"
            - paragraph [ref=f81e5674]:
              - generic [ref=f81e5675]: Vấn đề
              - text: Đội để API key trong file .env và commit vào repo (hoặc hardcode trong code); key lộ thì không ai chắc key nào đang nằm ở server nào để thu hồi. Secret nằm trong git là secret đã chết, còn secret copy tay ra 10 server thì không rotate được.
            - paragraph [ref=f81e5676]:
              - generic [ref=f81e5677]: Nguồn gốc
              - text: HashiCorp Vault ra mắt năm 2015; Kubernetes Secret có từ các version đầu; secret store quản lý của cloud (AWS Secrets Manager, Azure Key Vault) xuất hiện sau đó.
            - paragraph [ref=f81e5678]:
              - generic [ref=f81e5679]: Giải pháp
              - text: "Secret tách khỏi code và khỏi cấu hình tĩnh: nạp lúc runtime từ nguồn tập trung (HashiCorp Vault, AWS Secrets Manager, Kubernetes Secret), phân quyền theo service, ghi log redaction, rotate được mà không cần deploy lại toàn bộ."
            - paragraph [ref=f81e5680]:
              - text: "Liên quan:"
              - link "config management" [ref=f81e5681] [cursor=pointer]:
                - /url: "#config-management"
              - text: ", environment (dev/staging/prod),"
              - link "GitOps" [ref=f81e5682] [cursor=pointer]:
                - /url: "#gitops"
              - text: ", secrets không vào code"
          - article [ref=f81e5683]:
            - heading "Service & Ingress (mạng Kubernetes)" [level=4] [ref=f81e5684]
            - paragraph [ref=f81e5685]: "còn gọi: Service (ClusterIP/NodePort/LoadBalancer), Ingress, Ingress controller, mạng trong cluster"
            - paragraph [ref=f81e5686]:
              - generic [ref=f81e5687]: Vấn đề
              - text: Pod restart là đổi IP ngay nên client ghi IP cứng thì hỏng sau lần scale đầu tiên. Song song đó, mỗi service muốn ra internet lại phải mở port/load balancer riêng và khai báo domain tay — số service tăng thì việc quản lý đường vào rối không kiểm soát.
            - paragraph [ref=f81e5688]:
              - generic [ref=f81e5689]: Nguồn gốc
              - text: Đều là API gốc của Kubernetes; Ingress controller phổ biến (nginx, Traefik) do cộng đồng triển khai.
            - paragraph [ref=f81e5690]:
              - generic [ref=f81e5691]: Giải pháp
              - text: Service tạo IP ảo ổn định và load balance tới nhóm pod theo label (qua kube-proxy/IPVS); Ingress là tầng L7 trước Service, route theo host/path, gom TLS một chỗ — một cổng vào duy nhất cho nhiều service.
            - paragraph [ref=f81e5692]:
              - text: "Liên quan:"
              - link "Kubernetes" [ref=f81e5693] [cursor=pointer]:
                - /url: "#kubernetes"
              - text: ","
              - link "pod" [ref=f81e5694] [cursor=pointer]:
                - /url: "#pod"
              - text: ", deployment & replica, HPA"
          - article [ref=f81e5695]:
            - heading "SRE vs DevOps" [level=4] [ref=f81e5696]
            - paragraph [ref=f81e5697]: "còn gọi: Site Reliability Engineering, SRE, DevOps, vận hành kiểu kỹ sư"
            - paragraph [ref=f81e5698]:
              - generic [ref=f81e5699]: Vấn đề
              - text: "DevOps nói về văn hóa gộp dev và ops, nhưng khi hỏi 'ai chịu trách nhiệm hệ thống lúc 3h sáng, SLI/SLO là gì, được phép downtime bao nhiêu phần trăm' thì không ai trả lời được: ops vẫn là nhóm bị gọi trong đêm, dev vẫn ném code qua hàng rào, SLO không tồn tại nên mọi incident đều là khẩn cấp."
            - paragraph [ref=f81e5700]:
              - generic [ref=f81e5701]: Nguồn gốc
              - text: Google khởi xướng năm 2003; Ben Treynor Sloss là người đặt thuật ngữ 'Site Reliability Engineering'; sách Site Reliability Engineering của Google xuất bản 2016.
            - paragraph [ref=f81e5702]:
              - generic [ref=f81e5703]: Giải pháp
              - text: "SRE là cách Google vận hành DevOps bằng kỹ sư: viết automation thay việc tay, đặt SLI/SLO và error budget làm cơ chế quyết định (hết budget thì dừng release). DevOps là phong trào/cộng đồng rộng hơn; SRE là bộ phận + thực hành cụ thể kèm công cụ."
            - paragraph [ref=f81e5704]:
              - text: "Liên quan:"
              - link "GitOps" [ref=f81e5705] [cursor=pointer]:
                - /url: "#gitops"
              - text: ","
              - link "smoke test" [ref=f81e5706] [cursor=pointer]:
                - /url: "#smoke-test"
              - text: ","
              - link "rollback" [ref=f81e5707] [cursor=pointer]:
                - /url: "#rollback"
              - text: ", CI (continuous integration)"
          - article [ref=f81e5708]:
            - heading "Trunk-based development vs Git flow" [level=4] [ref=f81e5709]
            - paragraph [ref=f81e5710]: "còn gọi: trunk-based development, TBD, git flow, mainline development, chiến lược nhánh"
            - paragraph [ref=f81e5711]:
              - generic [ref=f81e5712]: Vấn đề
              - text: Git flow với develop/release/hotfix để nhánh sống vài tuần khiến merge conflict dày đặc, mỗi nhánh là một state không ai test chung; trong khi đội cần deploy hàng ngày thì 'gộp nhánh' trở thành sự kiện lớn, rủi ro, phải book lịch.
            - paragraph [ref=f81e5713]:
              - generic [ref=f81e5714]: Nguồn gốc
              - text: Git flow do Vincent Driessen xuất bản trên nvie.com (tháng 1/2010); trunk-based do Paul Hammant hệ thống hóa (trunkbaseddevelopment.com) và là thực hành chuẩn ở Google.
            - paragraph [ref=f81e5715]:
              - generic [ref=f81e5716]: Giải pháp
              - text: "Trunk-based: mọi người commit vào 1 trunk, nhánh sống dưới 1-2 ngày, luôn merge được, tính năng chưa xong che bằng feature flag. Git flow hợp với phần mềm đóng gói cần hỗ trợ nhiều version song song — chọn theo cách phát hành, không theo phong trào."
            - paragraph [ref=f81e5717]:
              - text: "Liên quan:"
              - link "feature flag" [ref=f81e5718] [cursor=pointer]:
                - /url: "#feature-flag"
              - text: ", CI (continuous integration),"
              - link "monorepo vs polyrepo" [ref=f81e5719] [cursor=pointer]:
                - /url: "#monorepo-vs-polyrepo"
              - text: ", CD (continuous delivery/deployment)"
          - article [ref=f81e5720]:
            - heading "Zero-downtime deploy (rolling deploy)" [level=4] [ref=f81e5721]
            - paragraph [ref=f81e5722]: "còn gọi: rolling deploy, rolling update, triển khai không downtime, zero downtime"
            - paragraph [ref=f81e5723]:
              - generic [ref=f81e5724]: Vấn đề
              - text: "Mỗi lần deploy là dừng process vài chục giây: request giữa chừng bị drop, user đang tải trang thấy 502. Đau như vậy nên team gom code và release vào cuối tuần — càng ít lần deploy thì càng nhiều thay đổi dồn vào một lần, rủi ro tăng theo."
            - paragraph [ref=f81e5725]:
              - generic [ref=f81e5726]: Nguồn gốc
              - text: không rõ (khái niệm lan rộng cùng continuous delivery; trong Kubernetes, rolling update là chiến lược mặc định của Deployment)
            - paragraph [ref=f81e5727]:
              - generic [ref=f81e5728]: Giải pháp
              - text: "Không bao giờ dừng toàn bộ: rolling deploy giữ N bản cũ đang serve, khởi động bản mới bên cạnh, chuyển traffic dần sau khi health check xanh, lặp tới hết — request luôn có nơi trả lời, downtime về 0."
            - paragraph [ref=f81e5729]:
              - text: "Liên quan: deployment & replica,"
              - link "blue-green deploy" [ref=f81e5730] [cursor=pointer]:
                - /url: "#blue-green-deploy"
              - text: ","
              - link "canary deploy" [ref=f81e5731] [cursor=pointer]:
                - /url: "#canary-deploy"
              - text: ", CD (continuous delivery/deployment)"
      - generic [ref=f81e5732]:
        - generic [ref=f81e5733]:
          - paragraph [ref=f81e5734]: Phần 3
          - heading "Nâng cao" [level=2] [ref=f81e5735]
          - paragraph [ref=f81e5736]: Phân tán, đồng thời, thất bại từng phần — chỉ hiện ra khi hệ thống đủ lớn hoặc đủ căng. Đọc khi đã gặp đau thật.
          - paragraph [ref=f81e5737]: 129 thuật ngữ · 13 chủ đề
        - generic [ref=f81e5738]:
          - heading "Mạng & Giao thức 7" [level=3] [ref=f81e5739]:
            - text: Mạng & Giao thức
            - generic [ref=f81e5740]: "7"
          - article [ref=f81e5741]:
            - heading "BBR / CUBIC (congestion control algorithms)" [level=4] [ref=f81e5742]
            - paragraph [ref=f81e5743]: "còn gọi: BBR Google, CUBIC Linux default"
            - paragraph [ref=f81e5744]:
              - generic [ref=f81e5745]: Vấn đề
              - text: AIMD kiểu Reno/CUBIC phản ứng với MẤT GÓI làm tín hiệu nghẽn — nhưng link không dây/mobile và buffer router lớn (bufferbloat) gây loss không phải vì nghẽn thật, khiến throughput giảm oan; ngoài ra loss-based không phân biệt được 'mất do nghẽn' và 'mất do wifi'. Network nhanh đường dài (BDP lớn) bị throughput kẹt.
            - paragraph [ref=f81e5746]:
              - generic [ref=f81e5747]: Nguồn gốc
              - text: "CUBIC: Sangtae Heo và cộng sự (mặc định Linux 2.6.19, 2006); BBR: Neal Cardwell & Yuchung Cheng (Google, 2016, Linux 4.9)"
            - paragraph [ref=f81e5748]:
              - generic [ref=f81e5749]: Giải pháp
              - text: "CUBIC (mặc định Linux từ 2.6.19/2006) tăng cwnd theo hàm bậc ba kể từ lần nghẽn cuối, êm hơn BIC. BBR (Google, 2016, Linux 4.9+) ước lượng hai đại lượng: bottleneck bandwidth và RTT propagation, rồi điều khiển pacing cho vừa hai cái đó — không đợi mất gói; trên YouTube BBR tăng throughput trung bình ~4%. v2/v3 bổ sung tín hiệu loss/ECN để fair hơn."
            - paragraph [ref=f81e5750]:
              - text: "Liên quan: TCP congestion control,"
              - link "TCP slow start" [ref=f81e5751] [cursor=pointer]:
                - /url: "#tcp-slow-start"
              - text: ", RTT"
          - article [ref=f81e5752]:
            - heading "CDN cache key" [level=4] [ref=f81e5753]
            - paragraph [ref=f81e5754]: "còn gọi: khóa cache CDN, cache key normalization"
            - paragraph [ref=f81e5755]:
              - generic [ref=f81e5756]: Vấn đề
              - text: "CDN có thể lưu cùng một URL hàng nghìn bản copy khác nhau nếu key không được kiểm soát: query string trùng thứ tự khác nhau (?a=1&b=2 vs ?b=2&a=1), cookie session vô nghĩa, header ngẫu nhiên — mỗi biến thể là một cache entry riêng, phần lớn chỉ hit một lần rồi bị evict, hit rate sập trong khi origin bị gọi liên tục. Đổi scheme SSL hoặc normalize URL sai còn vô tình bust toàn bộ cache."
            - paragraph [ref=f81e5757]:
              - generic [ref=f81e5758]: Nguồn gốc
              - text: không rõ (khái niệm có ở mọi CDN; ví dụ cấu hình từ docs Cloudflare)
            - paragraph [ref=f81e5759]:
              - generic [ref=f81e5760]: Giải pháp
              - text: "Cache key = trích xuất có kiểm soát từ request (URL + query đã include/exclude/sort + header được phép + method-override headers). Cloudflare mặc định key theo full URL + Origin + các header forward; header như accept-*/user-agent chỉ cho include khi chỉ định giá trị cụ thể (1-10 giá trị). Best practice: dùng mặc định, exclude query param vô nghĩa, bật URL normalization để tránh cache poisoning, chỉ custom key khi thật sự cần (theo device/geo)."
            - paragraph [ref=f81e5761]:
              - text: "Liên quan:"
              - link "Vary header / content negotiation cache" [ref=f81e5762] [cursor=pointer]:
                - /url: "#vary-header-content-negotiation-cache"
              - text: ","
              - link "DNS TTL caching" [ref=f81e5763] [cursor=pointer]:
                - /url: "#dns-ttl-caching"
              - text: ", HTTP caching với Cache-Control"
          - article [ref=f81e5764]:
            - heading "Edge-triggered vs level-triggered" [level=4] [ref=f81e5765]
            - paragraph [ref=f81e5766]: "còn gọi: ET/LT, EPOLLET, sẵn sàng vs chuyển tiếp"
            - paragraph [ref=f81e5767]:
              - generic [ref=f81e5768]: Vấn đề
              - text: "Level-triggered cổ điển liên tục báo lại 'buffer còn data chưa đọc' — mỗi epoll_wait đều trả về dù không có gì mới, tốn CPU xử lý event trùng. Nhưng edge-triggered cực kỳ dễ sai: nếu nhận event mà không đọc hết buffer thì kernel không báo lại → kết nối treo vĩnh viễn, bug khó tìm nhất trong event-driven server."
            - paragraph [ref=f81e5769]:
              - generic [ref=f81e5770]: Nguồn gốc
              - text: không rõ (epoll hỗ trợ từ đầu 2002; kqueue qua cờ EV_CLEAR)
            - paragraph [ref=f81e5771]:
              - generic [ref=f81e5772]: Giải pháp
              - text: "Level-triggered: trả về chừng điều kiện còn đúng (giống poll). Edge-triggered: chỉ báo khi CÓ sự kiện mới (data tới, socket đóng); bắt buộc developer phải đọc/ghi tới khi EAGAIN mới nghỉ. Kết hợp với non-blocking để không bao giờ block trong handler."
            - paragraph [ref=f81e5773]:
              - text: "Liên quan:"
              - link "epoll" [ref=f81e5774] [cursor=pointer]:
                - /url: "#epoll"
              - text: ","
              - link "kqueue" [ref=f81e5775] [cursor=pointer]:
                - /url: "#kqueue"
              - text: ","
              - link "Event loop" [ref=f81e5776] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ","
              - link "Reactor pattern" [ref=f81e5777] [cursor=pointer]:
                - /url: "#reactor-pattern"
          - article [ref=f81e5778]:
            - heading "Proactor pattern" [level=4] [ref=f81e5779]
            - paragraph [ref=f81e5780]: "còn gọi: mẫu Proactor, completion-based I/O, IOCP"
            - paragraph [ref=f81e5781]:
              - generic [ref=f81e5782]: Vấn đề
              - text: "Reactor vẫn là 'readiness-based': handler phải tự đọc/ghi sau khi báo sẵn sàng — nếu read() chỉ được nửa đường (partial), hoặc thao tác file không theo model readiness, developer phải tự viết state machine nối data. Với I/O thực sự asynchronous của OS (đọc xong mới báo), Reactor không khai thác được và code vẫn rối."
            - paragraph [ref=f81e5783]:
              - generic [ref=f81e5784]: Nguồn gốc
              - text: "Irfan Pyarali, Tim Harrison, Douglas C. Schmidt, Thomas D. Jordan — 'Proactor: An Object Behavioral Pattern...', PLoP '97 (tháng 9/1997)"
            - paragraph [ref=f81e5785]:
              - generic [ref=f81e5786]: Giải pháp
              - text: "Proactor là completion-based: initiator nạp trước thao tác async + completion handler cho OS; khi I/O HOÀN TẤT OS mới gọi handler kèm kết quả (data đã đọc xong), không phải 'sẵn sàng'. Các thành phần: proactive initiator, asynchronous operation processor, completion dispatcher. Reactor vẫn có thể nằm trong Proactor để giải quyết phần blocking I/O."
            - paragraph [ref=f81e5787]:
              - text: "Liên quan:"
              - link "Reactor pattern" [ref=f81e5788] [cursor=pointer]:
                - /url: "#reactor-pattern"
              - text: ","
              - link "io_uring" [ref=f81e5789] [cursor=pointer]:
                - /url: "#io-uring"
              - text: ", I/O completion ports (IOCP)"
          - article [ref=f81e5790]:
            - heading "TCP handshake (three-way handshake)" [level=4] [ref=f81e5791]
            - paragraph [ref=f81e5792]: "còn gọi: bắt tay ba bước, SYN/SYN-ACK/ACK"
            - paragraph [ref=f81e5793]:
              - generic [ref=f81e5794]: Vấn đề
              - text: Hai bên cần đồng ý số sequence bắt đầu trước khi truyền byte — nếu client gửi dữ liệu ngay, server không biết bắt đầu đếm từ số mấy, không ACK được, không phân biệt được packet cũ của kết nối trước với kết nối mới (xâm phạm an toàn + lẫn lộn). Cần cơ chế hai chiều xác nhận cả hai bên đều sẵn sàng, tránh thêm round-trip thừa.
            - paragraph [ref=f81e5795]:
              - generic [ref=f81e5796]: Nguồn gốc
              - text: Mô hình TCP trong RFC 793 (9/1981, biên tập Jon Postel); ý tưởng từ Cerf & Kahn 1974.
            - paragraph [ref=f81e5797]:
              - generic [ref=f81e5798]: Giải pháp
              - text: "Client gửi SYN (số seq random x) → server trả SYN-ACK (ack x+1, seq random y) → client gửi ACK (ack y+1): mỗi bên đều đã xác nhận số sequence của bên kia, tổng đúng 3 packet, trạng thái ESTABLISHED rồi mới truyền dữ liệu."
            - paragraph [ref=f81e5799]:
              - text: "Liên quan:"
              - link "TCP" [ref=f81e5800] [cursor=pointer]:
                - /url: "#tcp"
              - text: ","
              - link "TLS/SSL" [ref=f81e5801] [cursor=pointer]:
                - /url: "#tls-ssl"
              - text: ","
              - link "HTTP/3 (QUIC)" [ref=f81e5802] [cursor=pointer]:
                - /url: "#http-3-quic"
              - text: ","
              - link "TTFB" [ref=f81e5803] [cursor=pointer]:
                - /url: "#ttfb"
              - text: ", SYN flood"
          - article [ref=f81e5804]:
            - heading "TTFB" [level=4] [ref=f81e5805]
            - paragraph [ref=f81e5806]: "còn gọi: Time To First Byte, thời gian đến byte đầu tiên"
            - paragraph [ref=f81e5807]:
              - generic [ref=f81e5808]: Vấn đề
              - text: "Khi trang chậm, 'rất chậm' không phân biệt nổi lỗi ở đâu: DNS? TCP+TLS handshake? server code xử lý 2s? Hay chỉ là bandwidth tải body? Dev và team performance cần một con số tách backend ra khỏi mạng để biết phải fix cái gì trước."
            - paragraph [ref=f81e5809]:
              - generic [ref=f81e5810]: Nguồn gốc
              - text: không rõ (khái niệm đo lường web performance phổ biến từ thập niên 2000, xuất hiện trong các công cụ như YSlow/PageSpeed).
            - paragraph [ref=f81e5811]:
              - generic [ref=f81e5812]: Giải pháp
              - text: Đo từ lúc browser gửi request (hoặc bắt đầu navigation) đến lúc nhận byte response đầu tiên — TTFB cao dù file nhỏ ⇒ nghi backend/DB/reverse proxy; TTFB thấp nhưng tải lâu ⇒ nghi bandwidth/kích thước resource. Thường kèm metrics DNS time, connect time, TLS time để chẻ further.
            - paragraph [ref=f81e5813]:
              - text: "Liên quan:"
              - link "HTTP" [ref=f81e5814] [cursor=pointer]:
                - /url: "#http"
              - text: ","
              - link "TLS/SSL" [ref=f81e5815] [cursor=pointer]:
                - /url: "#tls-ssl"
              - text: ", TCP handshake,"
              - link "DNS" [ref=f81e5816] [cursor=pointer]:
                - /url: "#dns"
              - text: ","
              - link "CDN" [ref=f81e5817] [cursor=pointer]:
                - /url: "#cdn"
              - text: ","
              - link "Keep-alive" [ref=f81e5818] [cursor=pointer]:
                - /url: "#keep-alive"
          - article [ref=f81e5819]:
            - heading "Zero-copy (sendfile)" [level=4] [ref=f81e5820]
            - paragraph [ref=f81e5821]: "còn gọi: copy không qua user space, sendfile(2)"
            - paragraph [ref=f81e5822]:
              - generic [ref=f81e5823]: Vấn đề
              - text: "Phục vụ file tĩnh theo cách thông thường: read() kéo data từ page cache vào buffer user-space, rồi write() đẩy ngược từ user-space vào socket — mỗi byte bị sao chép nhiều lần qua biên giới kernel/user, tốn CPU memcpy và chiếm thêm memory bandwidth. Với server serve hàng GB/giây (static files, CDN origin), overhead sao chép trở thành nút thắt CPU."
            - paragraph [ref=f81e5824]:
              - generic [ref=f81e5825]: Nguồn gốc
              - text: Linux 2.2, glibc 2.1 (sendfile64 thêm ở Linux 2.4 cho file lớn)
            - paragraph [ref=f81e5826]:
              - generic [ref=f81e5827]: Giải pháp
              - text: "sendfile(in_fd, out_fd) yêu cầu kernel tự chuyển data trực tiếp từ page cache của file sang socket, không đi qua user space. Hạn chế: in_fd phải là file hỗ trợ mmap (không phải socket), file không được sửa đổi khi đang đọc, mỗi lần tối đa ~2GB, không portable — fallback bằng read/write trên EINVAL/ENOSYS. Kết hợp TCP_CORK/MSG_MORE để gộp header."
            - paragraph [ref=f81e5828]:
              - text: "Liên quan:"
