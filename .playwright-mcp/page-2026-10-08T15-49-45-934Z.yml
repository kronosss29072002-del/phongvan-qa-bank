          - article [ref=f81e1721]:
            - heading "SLO/SLI" [level=4] [ref=f81e1722]
            - paragraph [ref=f81e1723]: "còn gọi: service level indicator, service level objective, chỉ số/mục tiêu mức dịch vụ"
            - paragraph [ref=f81e1724]:
              - generic [ref=f81e1725]: Vấn đề
              - text: Chỉ nói 'hệ thống nhanh/ổn định' thì không đo được, không quyết định được cần đầu tư.
            - paragraph [ref=f81e1726]:
              - generic [ref=f81e1727]: Nguồn gốc
              - text: Google SRE Book (2016), Chương 4 'Service Level Objectives'.
            - paragraph [ref=f81e1728]:
              - generic [ref=f81e1729]: Giải pháp
              - text: SLI = số đo thực tế (tỷ lệ request thành công, latency p99, throughput). SLO = cam kết ngưỡng cho SLI trên cửa sổ thời gian. Chọn SLI theo trải nghiệm user, đặt SLO chặt hơn SLA.
