            - paragraph [ref=f81e6216]:
              - generic [ref=f81e6217]: Giải pháp
              - text: Tính toán trước kết quả khi dữ liệu thay đổi (cron job, trigger, stream processor) rồi lưu lại; request chỉ đọc thành phẩm O(1) — đổi lấy độ trễ cập nhật (staleness window) và chi phí lưu trữ/refresh job.
