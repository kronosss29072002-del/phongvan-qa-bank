          - article [ref=f81e2212]:
            - heading "Statement coverage" [level=4] [ref=f81e2213]
            - paragraph [ref=f81e2214]: "còn gọi: Line coverage"
            - paragraph [ref=f81e2215]:
              - generic [ref=f81e2216]: Vấn đề
              - text: Cần đo đơn giản xem từng dòng lệnh có được chạy ít nhất một lần bởi test hay không.
            - paragraph [ref=f81e2217]:
              - generic [ref=f81e2218]: Nguồn gốc
              - text: Miller & Maloney (1963)
            - paragraph [ref=f81e2219]:
              - generic [ref=f81e2220]: Giải pháp
              - text: Tính phần trăm số dòng code được thực thi trong tổng số dòng có thể thực thi.
