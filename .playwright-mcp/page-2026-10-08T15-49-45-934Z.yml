                - /url: "#cdn-cache-key"
        - generic [ref=f81e5832]:
          - heading "Thiết kế API 5" [level=3] [ref=f81e5833]:
            - text: Thiết kế API
            - generic [ref=f81e5834]: "5"
          - article [ref=f81e5835]:
            - heading "Dedup window" [level=4] [ref=f81e5836]
            - paragraph [ref=f81e5837]: "còn gọi: deduplication window, idempotency window, message dedup"
            - paragraph [ref=f81e5838]:
              - generic [ref=f81e5839]: Vấn đề
              - text: Trùng event cách nhau vài phút thì check 'đã thấy trong RAM' không còn; lưu mãi thì tốn bộ nhớ - cần cửa sổ thời gian rõ ràng.
            - paragraph [ref=f81e5840]:
              - generic [ref=f81e5841]: Nguồn gốc
              - text: Thực hành từ pattern idempotent consumer; AWS SQS FIFO có MessageDeduplicationId (cửa sổ 5 phút), Stripe idempotency key giữ 24h.
            - paragraph [ref=f81e5842]:
              - generic [ref=f81e5843]: Giải pháp
              - text: "Lưu key/event id kèm timestamp trong cửa sổ N (24h với idempotency API, vài phút với MQ). Quá cửa sổ mà message đến nữa thì coi là mới - tradeoff: tăng cửa sổ = tăng bộ nhớ, giảm rủi ro trùng lặp muộn. Cửa sổ phải ≥ thời gian retry tối đa của producer."
            - paragraph [ref=f81e5844]:
              - text: "Liên quan:"
              - link "Exactly-once illusion vs at-least-once" [ref=f81e5845] [cursor=pointer]:
                - /url: "#exactly-once-illusion-vs-at-least-once"
              - text: ","
              - link "Idempotency key (Stripe pattern)" [ref=f81e5846] [cursor=pointer]:
                - /url: "#idempotency-key-stripe-pattern"
              - text: ","
              - link "Idempotent consumer" [ref=f81e5847] [cursor=pointer]:
                - /url: "#idempotent-consumer"
          - article [ref=f81e5848]:
            - heading "Exactly-once illusion vs at-least-once" [level=4] [ref=f81e5849]
            - paragraph [ref=f81e5850]: "còn gọi: delivery semantics, at-most-once, effectively-once"
            - paragraph [ref=f81e5851]:
              - generic [ref=f81e5852]: Vấn đề
              - text: MQ hứa 'exactly-once' khiến team viết code lơ là; thực tế network chia đôi thì consumer xử lý 2 lần, side effect (gửi email, charge) bị lặp.
            - paragraph [ref=f81e5853]:
              - generic [ref=f81e5854]: Nguồn gốc
              - text: Thuật ngữ delivery semantics trong distributed messaging (xem lại tài liệu Kafka/SQS); không có 1 RFC duy nhất - là khái niệm hệ thống phân tán.
            - paragraph [ref=f81e5855]:
              - generic [ref=f81e5856]: Giải pháp
              - text: "Transport thực tế chỉ bảo đảm at-most-once (mất) hoặc at-least-once (trùng). Exactly-once end-to-end phải ghép: idempotent consumer (dedup theo event id) + transaction với side effect = 'effectively once'. Stripe: webhook gửi lại là bình thường, consumer phải dedup theo event id."
            - paragraph [ref=f81e5857]:
              - text: "Liên quan:"
              - link "Idempotent consumer" [ref=f81e5858] [cursor=pointer]:
                - /url: "#idempotent-consumer"
              - text: ","
              - link "Webhook (delivery, retries, signature)" [ref=f81e5859] [cursor=pointer]:
                - /url: "#webhook-delivery-retries-signature"
              - text: ","
              - link "Dedup window" [ref=f81e5860] [cursor=pointer]:
                - /url: "#dedup-window"
          - article [ref=f81e5861]:
            - heading "HATEOAS" [level=4] [ref=f81e5862]
            - paragraph [ref=f81e5863]: "còn gọi: Hypermedia as the engine of application state, hypermedia controls"
            - paragraph [ref=f81e5864]:
              - generic [ref=f81e5865]: Vấn đề
              - text: Client hardcode URL và luồng chuyển trạng thái (biết trước PUT /orders/5/cancel); server đổi route hay quy tắc nghiệp vụ là client chết, không phân biệt được 'tài nguyên cho phép gì' theo trạng thái.
            - paragraph [ref=f81e5866]:
              - generic [ref=f81e5867]: Nguồn gốc
              - text: "Roy Fielding, luận án 2000 - ràng buộc của uniform interface trong REST. Ví dụ ngân hàng: account bị overdraft thì link 'withdraw' biến mất, chỉ còn 'deposit'."
            - paragraph [ref=f81e5868]:
              - generic [ref=f81e5869]: Giải pháp
              - text: "Mỗi response kèm link (rel) nói hành động kế tiếp và nơi thực hiện; client đi theo link thay vì nhớ route. Định dạng: JSON-HAL, JSON-LD+Hydra, Siren, Collection+JSON, JSON:API. Thực tế ít API đạt mức này vì JSON không phải hypermedia format tự nhiên như HTML."
            - paragraph [ref=f81e5870]:
              - text: "Liên quan:"
              - link "REST" [ref=f81e5871] [cursor=pointer]:
                - /url: "#rest"
              - text: ", Hyperlink media types, Richardson Maturity Model"
          - article [ref=f81e5872]:
            - heading "Idempotency key (Stripe pattern)" [level=4] [ref=f81e5873]
            - paragraph [ref=f81e5874]: "còn gọi: Idempotency-Key header, request deduplication"
            - paragraph [ref=f81e5875]:
              - generic [ref=f81e5876]: Vấn đề
              - text: "POST /charges không idempotent: client timeout rồi retry = charge hai lần; refund sai thì mất tiền thật của khách."
            - paragraph [ref=f81e5877]:
              - generic [ref=f81e5878]: Nguồn gốc
              - text: Stripe API 'Idempotent requests' - client sinh key (khuyến nghị UUIDv4), gửi header Idempotency-Key; server lưu kết quả lần đầu.
            - paragraph [ref=f81e5879]:
              - generic [ref=f81e5880]: Giải pháp
              - text: Lần đầu thực thi và lưu status+body theo key; retry cùng key trả y chang kết quả (kể cả 500). Key ≤255 ký tự, không chứa PII; server prune key ≥24h - sau prune mà dùng lại thì coi là request mới nhưng so tham số, khác thì báo lỗi (chống dùng nhầm). Validation fail hoặc conflict trước khi thực thi thì KHÔNG lưu - được retry. Chỉ áp cho POST; GET/DELETE đã idempotent.
