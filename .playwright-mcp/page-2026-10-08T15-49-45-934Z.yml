                - /url: "#n-1-problem"
          - article [ref=f81e3229]:
            - heading "Query planner" [level=4] [ref=f81e3230]
            - paragraph [ref=f81e3231]: "còn gọi: bộ lập kế hoạch truy vấn"
            - paragraph [ref=f81e3232]:
              - generic [ref=f81e3233]: Vấn đề
              - text: Nhiều cách thực hiện cùng một SQL, chọn sai thì chậm hơn hàng nghìn lần.
            - paragraph [ref=f81e3234]:
              - generic [ref=f81e3235]: Giải pháp
              - text: Sinh các plan thay thế, ước chi phí rồi chọn cách thực hiện rẻ nhất cho truy vấn đó.
            - paragraph [ref=f81e3236]:
