          - article [ref=f81e3023]:
            - heading "Consistent hashing" [level=4] [ref=f81e3024]
            - paragraph [ref=f81e3025]: "còn gọi: băm nhất quán, Consistent hashing & virtual node, virtual node, vnode, hash ring"
            - paragraph [ref=f81e3026]:
              - generic [ref=f81e3027]: Vấn đề
              - text: "Phân phối theo modulo số node khiến phải remap gần như toàn bộ dữ liệu khi thêm hoặc bớt node. Distribute cache bằng key % N: thêm 1 node thì N đổi → gần như toàn bộ key phải rehash, cache rỗng cùng lúc, request dồn vào DB (cache stampede); node chết cũng vậy. Thêm nữa, 10 node mạnh yếu không đều nhưng hash đều nhau dẫn đến load lệch — node yếu chết chìm."
            - paragraph [ref=f81e3028]:
              - generic [ref=f81e3029]: Nguồn gốc
              - text: Karger và cộng sự, 1997
            - paragraph [ref=f81e3030]:
              - generic [ref=f81e3031]: Giải pháp
              - text: Đặt node và key lên vành băm, key gán cho node kế tiếp; đổi số node chỉ làm một phần nhỏ key phải chuyển. Đặt node và key lên một vòng tròn, key gán cho node kế tiếp theo chiều kim đồng hồ — thêm/bớt node chỉ di chuyển khoảng 1/N key; virtual node (nhiều điểm ảo cho mỗi máy vật lý) san đều load giữa node khác sức mạnh và khi node chết, key giao cho nhiều node thay.
            - paragraph [ref=f81e3032]:
              - text: "Liên quan:"
              - link "Sharding" [ref=f81e3033] [cursor=pointer]:
                - /url: "#sharding"
              - text: ","
