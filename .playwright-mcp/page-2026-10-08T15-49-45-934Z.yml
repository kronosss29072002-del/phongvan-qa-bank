          - article [ref=f81e2533]:
            - heading "HTTP/1.1" [level=4] [ref=f81e2534]
            - paragraph [ref=f81e2535]: "còn gọi: HTTP 1.1"
            - paragraph [ref=f81e2536]:
              - generic [ref=f81e2537]: Vấn đề
              - text: HTTP/1.0 mỗi request mở TCP rồi đóng ngay — trang web 80 resource = 80 lần bắt tay TCP + 80 lần gửi lại header cookie/user-agent to đùng; còn giữ kết nối thì proxy/load balancer cũ treo kết nối vô hạn (rò rỉ bộ nhớ). Browser giới hạn ~6 kết nối/origin nên phần còn lại phải xếp hàng.
            - paragraph [ref=f81e2538]:
              - generic [ref=f81e2539]: Nguồn gốc
              - text: RFC 2068 (1997) → RFC 2616 (1999); hiện RFC 9112 (2022).
            - paragraph [ref=f81e2540]:
              - generic [ref=f81e2541]: Giải pháp
              - text: Thêm mandatory Host header, support chunked transfer encoding, pipelining (có hạn chế), và keep-alive mặc định — mỗi request vẫn là văn bản dòng–dòng (method/URI/version…), một request phải đợi response xong mới gửi tiếp trên cùng kết nối.
