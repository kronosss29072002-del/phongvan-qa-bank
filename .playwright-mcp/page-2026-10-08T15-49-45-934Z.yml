          - article [ref=f81e1504]:
            - heading "Four Golden Signals" [level=4] [ref=f81e1505]
            - paragraph [ref=f81e1506]: "còn gọi: four_golden_signals, bốn tín hiệu vàng, latency-traffic-errors-saturation"
            - paragraph [ref=f81e1507]:
              - generic [ref=f81e1508]: Vấn đề
              - text: Cần tập trung vào 4 chỉ số cốt lõi thay vì theo dõi quá nhiều metric gây nhiễu.
            - paragraph [ref=f81e1509]:
              - generic [ref=f81e1510]: Nguồn gốc
              - text: Google SRE Book - Chapter 6 (Monitoring Distributed Systems)
            - paragraph [ref=f81e1511]:
              - generic [ref=f81e1512]: Giải pháp
              - text: Latency (thời gian phản hồi, phân biệt thành công/thất bại), Traffic (lưu lượng yêu cầu), Errors (tỷ lệ thất bại), Saturation (mức độ đầy tải của tài nguyên giới hạn).
            - paragraph [ref=f81e1513]:
              - text: "Liên quan: RED_method, USE_method, latency,"
              - link "RED method" [ref=f81e1514] [cursor=pointer]:
                - /url: "#red-method"
              - text: ","
              - link "USE method" [ref=f81e1515] [cursor=pointer]:
                - /url: "#use-method"
              - text: ","
              - link "Black-box vs white-box monitoring" [ref=f81e1516] [cursor=pointer]:
                - /url: "#black-box-vs-white-box-monitoring"
          - article [ref=f81e1517]:
            - heading "Health check (/health, /ready)" [level=4] [ref=f81e1518]
            - paragraph [ref=f81e1519]: "còn gọi: health probe, liveness/readiness probe, kiểm tra sức khỏe service"
            - paragraph [ref=f81e1520]:
              - generic [ref=f81e1521]: Vấn đề
              - text: "Process vẫn sống nhưng treo hoặc không kết nối được DB: load balancer/Kubernetes không biết, request vẫn route đến node hỏng và user thấy timeout trong khi node khác vẫn khỏe."
            - paragraph [ref=f81e1522]:
              - generic [ref=f81e1523]: Nguồn gốc
              - text: không rõ (quy dıktan phổ biến trong Kubernetes/ECS)
            - paragraph [ref=f81e1524]:
              - generic [ref=f81e1525]: Giải pháp
              - text: Endpoint HTTP được probe định kỳ; liveness để orchestrator restart, readiness để LB ngừng gửi traffic cho tới khi service thật sự sẵn sàng.
            - paragraph [ref=f81e1526]: "Liên quan: Black-box monitoring, Alerting, Synthetic monitoring"
          - article [ref=f81e1527]:
            - heading "Log aggregation & ELK Stack" [level=4] [ref=f81e1528]
            - paragraph [ref=f81e1529]: "còn gọi: log aggregation, ELK, Elasticsearch-Logstash-Kibana, xây dựng trung tâm log"
            - paragraph [ref=f81e1530]:
              - generic [ref=f81e1531]: Vấn đề
              - text: Một request đi qua 8 service, mỗi service ghi log vào file của máy mình; user báo lỗi nhưng dev không thể ssh hàng trăm node để đọc file, và mỗi kiểu lỗi nằm ở một nơi nên không soi chéo được. Không có nơi tập trung thì điều tra incident = chạy khắp nơi.
            - paragraph [ref=f81e1532]:
              - generic [ref=f81e1533]: Nguồn gốc
              - text: Elasticsearch (Shay Banon) mở nguồn năm 2010; stack ELK hình thành từ đó
            - paragraph [ref=f81e1534]:
              - generic [ref=f81e1535]: Giải pháp
              - text: Logstash/Beats gom log từ mọi node, Elasticsearch lưu index cho phép search full-text + filter theo field, Kibana để tra cứu và vẽ; toàn hệ thống có một chỗ hỏi 'về request này đã xảy ra gì'.
            - paragraph [ref=f81e1536]:
              - text: "Liên quan:"
              - link "Structured logging" [ref=f81e1537] [cursor=pointer]:
                - /url: "#structured-logging"
              - text: ", Loki,"
              - link "Trace" [ref=f81e1538] [cursor=pointer]:
                - /url: "#trace"
          - article [ref=f81e1539]:
            - heading "Metrics (time-series)" [level=4] [ref=f81e1540]
            - paragraph [ref=f81e1541]: "còn gọi: metric, số liệu, thời gian series"
            - paragraph [ref=f81e1542]:
              - generic [ref=f81e1543]: Vấn đề
              - text: Log text không trả lời được 'p99 latency 5 phút qua là bao nhiêu, so với hôm qua thế nào' — parse từng dòng quá chậm và đắt đỏ; dashboard và alert cần dữ liệu liên tục, dạng số để aggregate và so ngưỡng.
            - paragraph [ref=f81e1544]:
              - generic [ref=f81e1545]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1546]:
              - generic [ref=f81e1547]: Giải pháp
              - text: Ghi dữ liệu dạng (timestamp, tên metric, value, labels) — time series — cho phép sum/avg/percentile theo khoảng thời gian với chi phí lưu trữ và truy vấn thấp hơn log rất nhiều.
            - paragraph [ref=f81e1548]:
              - text: "Liên quan: Prometheus scrape model,"
              - link "Monitoring" [ref=f81e1549] [cursor=pointer]:
                - /url: "#monitoring"
              - text: ","
              - link "Metric cardinality" [ref=f81e1550] [cursor=pointer]:
                - /url: "#metric-cardinality"
          - article [ref=f81e1551]:
            - heading "Monitoring" [level=4] [ref=f81e1552]
            - paragraph [ref=f81e1553]: "còn gọi: giám sát, monitoring dashboard"
            - paragraph [ref=f81e1554]:
              - generic [ref=f81e1555]: Vấn đề
              - text: Không ai ngồi nhìn console 24/7; sự cố lúc 3h sáng chỉ được phát hiện khi customer support mở ticket. Team cần lớp liên tục đo những câu hỏi ĐÃ biết trước (CPU bao nhiêu, lỗi bao nhiêu phần trăm) và tự báo khi sai lệch.
            - paragraph [ref=f81e1556]:
              - generic [ref=f81e1557]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1558]:
              - generic [ref=f81e1559]: Giải pháp
              - text: Thu thập số liệu định kỳ, vẽ dashboard và đặt ngưỡng; khi metric vượt ngưỡng thì hệ thống cảnh báo, con người chỉ can thiệp khi có việc thật.
            - paragraph [ref=f81e1560]:
              - text: "Liên quan: Alerting,"
              - link "Metrics (time-series)" [ref=f81e1561] [cursor=pointer]:
                - /url: "#metrics-time-series"
              - text: ","
              - link "Observability" [ref=f81e1562] [cursor=pointer]:
                - /url: "#observability"
          - article [ref=f81e1563]:
            - heading "On-call rotation" [level=4] [ref=f81e1564]
            - paragraph [ref=f81e1565]: "còn gọi: trực production, trực ca đêm, on-call, trực trực"
            - paragraph [ref=f81e1566]:
              - generic [ref=f81e1567]: Vấn đề
              - text: Production chạy 24/7 nhưng developer làm giờ hành chính; sự cố ngoài giờ không ai chịu trách nhiệm rõ ràng thì mọi người giả vờ không thấy, hoặc mấy người nhiệt tình bị burnout vì lúc nào cũng bị gọi.
            - paragraph [ref=f81e1568]:
              - generic [ref=f81e1569]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1570]:
              - generic [ref=f81e1571]: Giải pháp
              - text: "Xếp lịch trực xoay vòng kèm escalation policy: một người luôn là người đầu tiên được gọi, có quyền pause deploy/rollback, sau ca đêm được nghỉ bù; có tool (PagerDuty, Opsgenie) để gọi điện/turn theo lịch."
            - paragraph [ref=f81e1572]:
              - text: "Liên quan:"
              - link "Alert fatigue" [ref=f81e1573] [cursor=pointer]:
                - /url: "#alert-fatigue"
              - text: ","
              - link "Alerting (threshold alert)" [ref=f81e1574] [cursor=pointer]:
                - /url: "#alerting-threshold-alert"
              - text: ","
              - link "Blameless postmortem" [ref=f81e1575] [cursor=pointer]:
                - /url: "#blameless-postmortem"
          - article [ref=f81e1576]:
            - heading "Reliability vs Availability" [level=4] [ref=f81e1577]
            - paragraph [ref=f81e1578]: "còn gọi: reliability_vs_availability"
            - paragraph [ref=f81e1579]:
              - generic [ref=f81e1580]: Vấn đề
              - text: Người ta thường nhầm lẫn giữa độ tin cậy (reliability) và tính sẵn sàng (availability), dẫn đến mục tiêu đo lường sai.
            - paragraph [ref=f81e1581]:
              - generic [ref=f81e1582]: Nguồn gốc
              - text: Google SRE Book - Chapter 1 (Betsy Beyer et al.)
            - paragraph [ref=f81e1583]:
              - generic [ref=f81e1584]: Giải pháp
              - text: Reliability là xác suất hệ thống thực hiện đúng chức năng trong khoảng thời gian đã định. Availability là tỷ lệ thời gian hệ thống có thể sử dụng được (uptime/total time). Hệ thống có thể có downtime có kế hoạch nhưng vẫn đạt reliability mục tiêu.
            - paragraph [ref=f81e1585]:
              - text: "Liên quan:"
              - link "SLO" [ref=f81e1586] [cursor=pointer]:
                - /url: "#slo"
              - text: ", availability, error_budget"
          - article [ref=f81e1587]:
            - heading "SLA" [level=4] [ref=f81e1588]
            - paragraph [ref=f81e1589]: "còn gọi: Service Level Agreement"
            - paragraph [ref=f81e1590]:
              - generic [ref=f81e1591]: Vấn đề
              - text: Cần phân biệt rõ cam kết hợp đồng với khách hàng khỏi mục tiêu nội bộ để tránh nhầm lẫn khái niệm.
            - paragraph [ref=f81e1592]:
              - generic [ref=f81e1593]: Nguồn gốc
              - text: Google SRE Book - Chapter 4 (Service Level Objectives)
            - paragraph [ref=f81e1594]:
              - generic [ref=f81e1595]: Giải pháp
              - text: SLA là hợp đồng rõ ràng hoặc ngầm định với người dùng, bao gồm hậu quả khi đạt/mất SLO (bồi thường, credit...). SRE thường dùng SLO nội bộ cao hơn SLA.
            - paragraph [ref=f81e1596]:
              - text: "Liên quan:"
              - link "SLI" [ref=f81e1597] [cursor=pointer]:
                - /url: "#sli"
              - text: ","
              - link "SLO" [ref=f81e1598] [cursor=pointer]:
                - /url: "#slo"
              - text: ", error_budget"
          - article [ref=f81e1599]:
            - heading "SLI" [level=4] [ref=f81e1600]
            - paragraph [ref=f81e1601]: "còn gọi: Service Level Indicator"
            - paragraph [ref=f81e1602]:
              - generic [ref=f81e1603]: Vấn đề
              - text: Cần một chỉ số định lượng rõ ràng để đo mức độ phục vụ, tránh đo cảm tính.
            - paragraph [ref=f81e1604]:
              - generic [ref=f81e1605]: Nguồn gốc
              - text: Google SRE Book - Chapter 4 (Service Level Objectives)
            - paragraph [ref=f81e1606]:
              - generic [ref=f81e1607]: Giải pháp
              - text: "SLI là chỉ số định lượng được định nghĩa cẩn thận để đo một khía cạnh của dịch vụ (ví dụ: tỷ lệ request thành công, latency percentile, throughput). Thường được tổng hợp trong cửa sổ đo lường."
            - paragraph [ref=f81e1608]:
              - text: "Liên quan:"
              - link "SLO" [ref=f81e1609] [cursor=pointer]:
                - /url: "#slo"
              - text: ","
              - link "SLA" [ref=f81e1610] [cursor=pointer]:
                - /url: "#sla"
              - text: ", error_rate"
          - article [ref=f81e1611]:
            - heading "SLO" [level=4] [ref=f81e1612]
            - paragraph [ref=f81e1613]: "còn gọi: Service Level Objective"
            - paragraph [ref=f81e1614]:
              - generic [ref=f81e1615]: Vấn đề
              - text: Không có mục tiêu rõ ràng khiến người dùng tự kỳ vọng và đội vận hành thiếu tiêu chí ra quyết định.
            - paragraph [ref=f81e1616]:
              - generic [ref=f81e1617]: Nguồn gốc
              - text: Google SRE Book - Chapter 4 (Service Level Objectives)
            - paragraph [ref=f81e1618]:
              - generic [ref=f81e1619]: Giải pháp
              - text: "SLO là giá trị mục tiêu hoặc khoảng mục tiêu cho SLI (ví dụ: p95 latency < 100ms). Giúp cân bằng giữa đổi mới và ổn định."
            - paragraph [ref=f81e1620]:
              - text: "Liên quan:"
              - link "SLI" [ref=f81e1621] [cursor=pointer]:
                - /url: "#sli"
              - text: ","
              - link "SLA" [ref=f81e1622] [cursor=pointer]:
                - /url: "#sla"
              - text: ", error_budget"
          - article [ref=f81e1623]:
            - heading "Structured logging" [level=4] [ref=f81e1624]
            - paragraph [ref=f81e1625]: "còn gọi: JSON logging, nhật ký có cấu trúc"
            - paragraph [ref=f81e1626]:
              - generic [ref=f81e1627]: Vấn đề
              - text: "Service ghi log dạng text tự do ('ERROR: timeout when calling...') chạy trên vài chục container, dev phải ssh từng máy để grep chuỗi; khi cần lọc 'lỗi theo user_id' hay đếm 'số lỗi mỗi phút' thì không làm được vì thông tin nằm lẫn trong câu chữ. Sau sự cố 2h sáng, container đã restart và file log bị xoay vòng thì bằng chứng biến mất hoàn toàn."
            - paragraph [ref=f81e1628]:
              - generic [ref=f81e1629]: Nguồn gốc
              - text: Mô hình 12-factor (Heroku, Adam Wiggins), Factor XI 'Treat logs as event streams'
            - paragraph [ref=f81e1630]:
              - generic [ref=f81e1631]: Giải pháp
              - text: Ép mỗi dòng log thành record JSON có trường cố định (timestamp, level, msg, request_id...) để filter/group-by/index ngay ở tầng thu thập, đồng thời app chỉ ghi ra stdout để log shipper tự kéo đi — không tự quản lý file.
            - paragraph [ref=f81e1632]: "Liên quan: Log aggregation, Correlation ID, Structured event"
        - generic [ref=f81e1633]:
          - heading "Bền vững & Chị tải 11" [level=3] [ref=f81e1634]:
            - text: Bền vững & Chị tải
            - generic [ref=f81e1635]: "11"
          - article [ref=f81e1636]:
            - heading "Autoscaling (Horizontal/Vertical)" [level=4] [ref=f81e1637]
            - paragraph [ref=f81e1638]: "còn gọi: tự động mở rộng, scale out/in, scale up/down, autoscaler"
            - paragraph [ref=f81e1639]:
              - generic [ref=f81e1640]: Vấn đề
              - text: "Capacity cố định: mua theo đỉnh thì lãng phí, mua theo trung bình thì sập giờ cao điểm."
            - paragraph [ref=f81e1641]:
              - generic [ref=f81e1642]: Nguồn gốc
              - text: AWS EC2 Auto Scaling là nơi chuẩn hóa khái niệm trong cloud.
            - paragraph [ref=f81e1643]:
              - generic [ref=f81e1644]: Giải pháp
              - text: "Horizontal (scale out): thêm/bớt instance theo tín hiệu (CPU, queue depth, request count). Vertical (scale up): tăng CPU/RAM cho instance hiện có. Kèm warmup để instance mới chưa nhận traffic khi chưa sẵn sàng."
            - paragraph [ref=f81e1645]:
              - text: "Liên quan:"
              - link "Cooldown" [ref=f81e1646] [cursor=pointer]:
                - /url: "#cooldown"
              - text: ","
              - link "Capacity Planning" [ref=f81e1647] [cursor=pointer]:
                - /url: "#capacity-planning"
              - text: ","
              - link "Load Testing" [ref=f81e1648] [cursor=pointer]:
                - /url: "#load-testing"
              - text: ", Connection Draining"
          - article [ref=f81e1649]:
            - heading "Availability Math (Five Nines)" [level=4] [ref=f81e1650]
            - paragraph [ref=f81e1651]: "còn gọi: 99.999%, high availability, uptime calculation"
            - paragraph [ref=f81e1652]:
              - generic [ref=f81e1653]: Vấn đề
              - text: Cần quy đổi 'five nines' (99.999%) ra downtime thực tế để đặt kỳ vọng.
            - paragraph [ref=f81e1654]:
              - generic [ref=f81e1655]: Nguồn gốc
              - text: Thuật ngữ phổ biến trong telecom/carrier-grade tradition (high availability).
            - paragraph [ref=f81e1656]:
              - generic [ref=f81e1657]: Giải pháp
              - text: 99.9% = ~43 phút/tháng, 99.99% = ~4.3 phút/tháng, 99.999% = ~26 giây/tháng (~5.26 phút/năm). Availability tính theo SLI thành công, không tính planned maintenance nếu quy ước khác nhau.
            - paragraph [ref=f81e1658]:
              - text: "Liên quan:"
              - link "SLO/SLI" [ref=f81e1659] [cursor=pointer]:
                - /url: "#slo-sli"
              - text: ","
              - link "Error Budget" [ref=f81e1660] [cursor=pointer]:
                - /url: "#error-budget"
              - text: ","
              - link "MTTR/MTBF" [ref=f81e1661] [cursor=pointer]:
                - /url: "#mttr-mtbf"
          - article [ref=f81e1662]:
            - heading "Exponential Backoff" [level=4] [ref=f81e1663]
            - paragraph [ref=f81e1664]: "còn gọi: backoff mũ, exponential backoff with jitter, full jitter, Exponential backoff + jitter (client), backoff with jitter, decorrelated jitter"
            - paragraph [ref=f81e1665]:
              - generic [ref=f81e1666]: Vấn đề
              - text: Nhiều client cùng fail rồi retry cùng một thời điểm khiến backend vừa hồi phục lại bị dồn dập đánh gục (retry storm). Retry sau 1s, 2s, 4s... đồng bộ giữa các client khiến burst retry trùng nhau (thundering herd); server vừa hồi phục lại bị đánh sập - plain backoff 'chỉ tạo ra các khoảng thời gian không client nào tranh chấp'.
            - paragraph [ref=f81e1667]:
              - generic [ref=f81e1668]: Nguồn gốc
              - text: Ethernet binary exponential backoff (Metcalfe & Boggs, 1976, CSMA/CD); biến thể exponential + jitter cho service được AWS Builders Library (Marc Brooker) phổ biến trong 'Timeouts, retries and backoff with jitter'.
            - paragraph [ref=f81e1669]:
              - generic [ref=f81e1670]: Giải pháp
              - text: "Mỗi lần retry tiếp theo, thời gian chờ tăng theo cấp số nhân (1s, 2s, 4s...) có cap; thêm jitter (ngẫu nhiên hóa thời điểm retry, kiểu 'full jitter' = random trong [0, backoff]) để phá đồng bộ hóa đàn thú. AWS khuyên kết hợp token bucket giới hạn retry locally thay vì chỉ cap. sleep = min(base * 2^n, cap) cộng random. Full jitter: sleep = random(0, backoff) - giảm tải nhất; Equal jitter: backoff/2 + random(0, backoff/2); Decorrelated jitter: random(base, prev*3). Hầu hết AWS SDK bật sẵn standard/adaptive retry mode (update 2023)."
            - paragraph [ref=f81e1671]:
              - text: "Liên quan:"
              - link "Retry" [ref=f81e1672] [cursor=pointer]:
                - /url: "#retry"
              - text: ","
              - link "Retry Budget" [ref=f81e1673] [cursor=pointer]:
