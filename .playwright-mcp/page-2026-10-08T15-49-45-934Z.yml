          - article [ref=f81e6554]:
            - heading "Exactly-once semantics" [level=4] [ref=f81e6555]
            - paragraph [ref=f81e6556]: "còn gọi: exactly-once, effectively-once, đúng một lần"
            - paragraph [ref=f81e6557]:
              - generic [ref=f81e6558]: Vấn đề
              - text: Timeout không nói được tiền đã vào nên producer gửi lại → bản sao; consumer xử lý xong nhưng crash trước khi commit offset → đọc lại và xử lý lần hai. End-to-end exactly-once trong distributed system không guarantee được thuần — trùng giao dịch thẻ là hậu quả thật của niềm tin sai này.
            - paragraph [ref=f81e6559]:
              - generic [ref=f81e6560]: Giải pháp
              - text: "Chỉ guarantee được trong phạm vi broker kiểm soát: idempotent producer (sequence number loại bản trùng khi retry) + transaction ghi output và commit offset atomically (consumer read_committed); side effect ngoài broker vẫn phải idempotent — gọi là effectively-once."
            - paragraph [ref=f81e6561]:
              - text: "Liên quan:"
              - link "Idempotent consumer" [ref=f81e6562] [cursor=pointer]:
                - /url: "#idempotent-consumer"
              - text: ","
              - link "Transactional outbox" [ref=f81e6563] [cursor=pointer]:
                - /url: "#transactional-outbox"
              - text: ","
              - link "Idempotency" [ref=f81e6564] [cursor=pointer]:
                - /url: "#idempotency"
              - text: ","
              - link "Apache Kafka" [ref=f81e6565] [cursor=pointer]:
                - /url: "#apache-kafka"
          - article [ref=f81e6566]:
            - heading "Kafka topic / partition / consumer group" [level=4] [ref=f81e6567]
            - paragraph [ref=f81e6568]: "còn gọi: partition, consumer group, offset, topic"
            - paragraph [ref=f81e6569]:
              - generic [ref=f81e6570]: Vấn đề
              - text: Cần vừa giữ thứ tự theo từng người dùng (10 event cùng user không được đảo) vừa xử lý song song triệu msg/s — ép thứ tự toàn topic thì chặn hết, hoàn toàn không thứ tự thì sai business; số consumer vượt số partition thì phần dư không có việc.
            - paragraph [ref=f81e6571]:
              - generic [ref=f81e6572]: Nguồn gốc
              - text: Cùng nguồn với Kafka — LinkedIn, 2011
            - paragraph [ref=f81e6573]:
              - generic [ref=f81e6574]: Giải pháp
              - text: Topic chia partition — đơn vị của thứ tự lẫn song song; trong một consumer group mỗi partition gán độc quyền cho đúng một consumer (vừa giữ thứ tự vừa chia tải), group mới đọc lại từ offset đầu; xử lý fail thì giữ offset chưa commit để đọc lại.
            - paragraph [ref=f81e6575]:
              - text: "Liên quan:"
              - link "Apache Kafka" [ref=f81e6576] [cursor=pointer]:
                - /url: "#apache-kafka"
              - text: ","
              - link "FIFO / Message ordering" [ref=f81e6577] [cursor=pointer]:
                - /url: "#fifo-message-ordering"
