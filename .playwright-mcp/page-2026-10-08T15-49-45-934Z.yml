        - generic [ref=f81e2322]:
          - heading "DevOps & Triển khai 9" [level=3] [ref=f81e2323]:
            - text: DevOps & Triển khai
            - generic [ref=f81e2324]: "9"
          - article [ref=f81e2325]:
            - heading "Build artifact" [level=4] [ref=f81e2326]
            - paragraph [ref=f81e2327]: "còn gọi: artifact, tệp đóng gói build, bản build"
            - paragraph [ref=f81e2328]:
              - generic [ref=f81e2329]: Vấn đề
              - text: "Mỗi môi trường tự build lại từ source: dev build với dependency bản mới, prod build với dependency bản cũ nên 'chạy được trên dev, lỗi trên prod'. Không có thứ gì để truy vết 'commit nào, build nào đang chạy trên production'."
            - paragraph [ref=f81e2330]:
              - generic [ref=f81e2331]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e2332]:
              - generic [ref=f81e2333]: Giải pháp
              - text: Build đúng 1 lần, đóng gói thành artifact bất biến (jar, npm tarball, docker image) kèm version + hash; mọi môi trường dùng đúng artifact đó, chỉ khác config. Muốn biết prod chạy gì thì xem version artifact.
            - paragraph [ref=f81e2334]:
              - text: "Liên quan: CD (continuous delivery/deployment),"
              - link "container (Docker, container image)" [ref=f81e2335] [cursor=pointer]:
                - /url: "#container-docker-container-image"
              - text: ","
              - link "immutable infrastructure" [ref=f81e2336] [cursor=pointer]:
                - /url: "#immutable-infrastructure"
              - text: ","
              - link "rollback" [ref=f81e2337] [cursor=pointer]:
                - /url: "#rollback"
          - article [ref=f81e2338]:
            - heading "CD (continuous delivery / continuous deployment)" [level=4] [ref=f81e2339]
            - paragraph [ref=f81e2340]: "còn gọi: continuous delivery, continuous deployment, phát hành liên tục, CD pipeline"
            - paragraph [ref=f81e2341]:
              - generic [ref=f81e2342]: Vấn đề
              - text: Sau khi có CI, team vẫn build tay, copy file lên server, chạy migration tay trước mỗi lần phát hành; mỗi release là một sự kiện căng thẳng cuối tuần. Vì deploy khó nên họ chỉ release vài tuần một lần, gom cả đống thay đổi rủi ro vào cùng lúc.
            - paragraph [ref=f81e2343]:
              - generic [ref=f81e2344]: Nguồn gốc
              - text: Dave Farley & Jez Humble, cuốn Continuous Delivery (Addison-Wesley, 2010).
            - paragraph [ref=f81e2345]:
              - generic [ref=f81e2346]: Giải pháp
              - text: CD tự động hóa mọi bước sau CI (test end-to-end, đóng gói, deploy) để build luôn ở trạng thái có thể phát hành bất kỳ lúc nào; continuous deployment còn push thẳng thay đổi pass test lên production, không cần người bấm nút.
            - paragraph [ref=f81e2347]:
              - text: "Liên quan: CI (continuous integration),"
              - link "release vs deploy" [ref=f81e2348] [cursor=pointer]:
                - /url: "#release-vs-deploy"
              - text: ","
              - link "build artifact" [ref=f81e2349] [cursor=pointer]:
                - /url: "#build-artifact"
              - text: ","
              - link "smoke test" [ref=f81e2350] [cursor=pointer]:
                - /url: "#smoke-test"
              - text: ", zero-downtime deploy"
          - article [ref=f81e2351]:
            - heading "Container (Docker, container image)" [level=4] [ref=f81e2352]
            - paragraph [ref=f81e2353]: "còn gọi: Docker, container, container image, image, OCI image"
            - paragraph [ref=f81e2354]:
              - generic [ref=f81e2355]: Vấn đề
              - text: Code chạy ngon trên máy dev nhưng lên server production lỗi vì version Java/Python/dependency khác nhau; mỗi server cài đặt tay nên 'cùng commit, hai môi trường, hai kết quả'. Dùng VM đầy đủ thì nặng — GB disk, khởi động hàng phút, không nhanh được khi scale hàng trăm instance.
            - paragraph [ref=f81e2356]:
              - generic [ref=f81e2357]: Nguồn gốc
              - text: Docker trình diễn công khai lần đầu tại PyCon ngày 15/3/2013 (Solomon Hykes, khi đó ở dotCloud); nền tảng namespace/cgroups của Linux có trước đó nhiều năm.
            - paragraph [ref=f81e2358]:
              - generic [ref=f81e2359]: Giải pháp
              - text: Docker đóng gói ứng dụng + dependency vào unit cách ly dùng chung kernel (namespaces/cgroups của Linux); container image là snapshot read-only nhiều lớp, kéo về đâu cũng chạy giống nhau, khởi động trong vài giây.
            - paragraph [ref=f81e2360]:
              - text: "Liên quan:"
              - link "build artifact" [ref=f81e2361] [cursor=pointer]:
                - /url: "#build-artifact"
              - text: ","
              - link "Kubernetes" [ref=f81e2362] [cursor=pointer]:
                - /url: "#kubernetes"
              - text: ","
              - link "immutable infrastructure" [ref=f81e2363] [cursor=pointer]:
                - /url: "#immutable-infrastructure"
              - text: ","
              - link "pod" [ref=f81e2364] [cursor=pointer]:
                - /url: "#pod"
          - article [ref=f81e2365]:
            - heading "Continuous Integration (CI)" [level=4] [ref=f81e2366]
            - paragraph [ref=f81e2367]: "còn gọi: CI, tích hợp liên tục, CI pipeline"
            - paragraph [ref=f81e2368]:
              - generic [ref=f81e2369]: Vấn đề
              - text: "Đội 5-10 người backend mỗi người code trên nhánh riêng, vài ngày mới gộp một lần: đến lúc merge, conflict kéo dài hàng giờ, không ai biết commit nào làm hỏng build. Trước đó họ chỉ chạy test tay trên máy trước khi release, nên lỗi chỉ lộ khi đã gộp xong và đã sát ngày phát hành."
            - paragraph [ref=f81e2370]:
              - generic [ref=f81e2371]: Nguồn gốc
              - text: Xuất xứ từ Extreme Programming (thập niên 1990); được hệ thống hóa bởi Martin Fowler (bliki Continuous Integration) và cộng đồng ThoughtWorks.
            - paragraph [ref=f81e2372]:
              - generic [ref=f81e2373]: Giải pháp
              - text: Mỗi lần push, máy trung tâm tự build + chạy test trong vài phút; code không xanh thì bị chặn merge. Gộp nhỏ liên tục thay vì gộp lớn định kỳ, lỗi tìm được ngay tại commit gây ra.
            - paragraph [ref=f81e2374]:
              - text: "Liên quan: CD (continuous delivery/deployment),"
              - link "build artifact" [ref=f81e2375] [cursor=pointer]:
                - /url: "#build-artifact"
              - text: ", trunk-based vs git flow,"
              - link "smoke test" [ref=f81e2376] [cursor=pointer]:
                - /url: "#smoke-test"
          - article [ref=f81e2377]:
            - heading "Cron job & Scheduler" [level=4] [ref=f81e2378]
            - paragraph [ref=f81e2379]: "còn gọi: crontab, cron, job scheduler, lập lịch công việc, batch scheduler, task queue, định kỳ công việc"
            - paragraph [ref=f81e2380]:
              - generic [ref=f81e2381]: Vấn đề
              - text: "Việc lặp theo lịch (đồng bộ dữ liệu 3h sáng, gửi báo cáo hàng ngày, dọn file hết hạn) bị làm tay hoặc code ngủ `sleep()` trong tiến trình: server restart là mất job, không ai biết job nào đã/chưa chạy, lỗi chạy âm thầm hàng tháng mới phát hiện."
            - paragraph [ref=f81e2382]:
              - generic [ref=f81e2383]: Nguồn gốc
              - text: cron có từ Unix thập niên 1970 ở Bell Labs; định dạng crontab 5 trường chuẩn hóa quanh Unix Version 7 (1979).
            - paragraph [ref=f81e2384]:
              - generic [ref=f81e2385]: Giải pháp
              - text: "Tách 'lịch' ra khỏi 'việc': crontab 5 trường (phút/giờ/ngày/tháng/thứ) + daemon tự đánh thức đúng lúc; scheduler cấp cao hơn (Quartz, Celery beat, Kubernetes CronJob) thêm retry, chống chạy trùng, giám sát."
            - paragraph [ref=f81e2386]:
              - text: "Liên quan:"
              - link "process manager (systemd, PM2, Supervisor)" [ref=f81e2387] [cursor=pointer]:
                - /url: "#process-manager-systemd-pm2-supervisor"
              - text: ", scheduler trong Kubernetes (CronJob),"
              - link "SRE vs DevOps" [ref=f81e2388] [cursor=pointer]:
                - /url: "#sre-vs-devops"
              - text: ","
              - link "Delayed queue" [ref=f81e2389] [cursor=pointer]:
                - /url: "#delayed-queue"
              - text: ","
              - link "Priority queue" [ref=f81e2390] [cursor=pointer]:
                - /url: "#priority-queue"
              - text: ","
              - link "Message queue" [ref=f81e2391] [cursor=pointer]:
                - /url: "#message-queue"
          - article [ref=f81e2392]:
            - heading "Environment (dev / staging / prod)" [level=4] [ref=f81e2393]
            - paragraph [ref=f81e2394]: "còn gọi: môi trường, dev/staging/prod, pre-prod"
            - paragraph [ref=f81e2395]:
              - generic [ref=f81e2396]: Vấn đề
              - text: Nhóm nhỏ lúc đầu cấu hình và test thẳng trên môi trường dùng chung, thậm chí sửa trực tiếp production để fix nhanh; hậu quả là không ai tái lập được cấu hình, test vô tình làm hỏng hệ thống thật, và dev không bao giờ giống prod.
            - paragraph [ref=f81e2397]:
              - generic [ref=f81e2398]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e2399]:
              - generic [ref=f81e2400]: Giải pháp
              - text: Tách thành dev (chạy nhanh, data giả), staging (giống prod) và prod (user thật); thay đổi phải đi qua các tầng này, cấu hình mỗi tầng khai báo riêng và không sửa tay ngoài quy trình.
            - paragraph [ref=f81e2401]:
              - text: "Liên quan:"
              - link "config management" [ref=f81e2402] [cursor=pointer]:
                - /url: "#config-management"
              - text: ","
              - link "release vs deploy" [ref=f81e2403] [cursor=pointer]:
                - /url: "#release-vs-deploy"
              - text: ","
              - link "secrets in runtime" [ref=f81e2404] [cursor=pointer]:
                - /url: "#secrets-in-runtime"
              - text: ","
              - link "rollback" [ref=f81e2405] [cursor=pointer]:
                - /url: "#rollback"
          - article [ref=f81e2406]:
            - heading "Process manager (systemd, PM2, Supervisor)" [level=4] [ref=f81e2407]
            - paragraph [ref=f81e2408]: "còn gọi: systemd, init system, PM2, Supervisor, upstart, quản lý tiến trình"
            - paragraph [ref=f81e2409]:
              - generic [ref=f81e2410]: Vấn đề
              - text: "Ứng dụng chạy nền bằng `node app.js &` hay nohup: crash lúc 3h sáng thì im lặng, không tự khởi động lại, log rải rác, và server reboot xong thì cả hệ thống nằm im cho tới khi có người SSH vào vá lại từng tiến trình."
            - paragraph [ref=f81e2411]:
              - generic [ref=f81e2412]: Nguồn gốc
              - text: systemd do Lennart Poettering công bố năm 2010 để thay SysV init; Supervisor (Python) và PM2 (Node) ra đời cho cấp ứng dụng web.
            - paragraph [ref=f81e2413]:
              - generic [ref=f81e2414]: Giải pháp
              - text: Process manager giữ tiến trình sống (respawn khi crash), quản lý start/stop/restart, gom log, và đăng ký khởi động cùng hệ điều hành. systemd đảm nhận vai trò PID 1 cho services trên Linux; PM2/Supervisor làm việc tương tự ở cấp ứng dụng.
            - paragraph [ref=f81e2415]:
              - text: "Liên quan:"
              - link "cron job & scheduler" [ref=f81e2416] [cursor=pointer]:
                - /url: "#cron-job-scheduler"
              - text: ", zero-downtime deploy,"
              - link "SRE vs DevOps" [ref=f81e2417] [cursor=pointer]:
                - /url: "#sre-vs-devops"
          - article [ref=f81e2418]:
            - heading "Release vs deploy" [level=4] [ref=f81e2419]
            - paragraph [ref=f81e2420]: "còn gọi: phát hành khác triển khai, deploy ≠ release"
            - paragraph [ref=f81e2421]:
              - generic [ref=f81e2422]: Vấn đề
              - text: "Quyền 'cho user thấy tính năng' bị gắn cứng với việc deploy: muốn bật cho 10% user hay tắt khi tính năng lỗi thì phải deploy lại toàn bộ hệ thống. Vì thế hoặc là không dám tung tính năng, hoặc là phải roll back cả build chỉ vì một toggle."
            - paragraph [ref=f81e2423]:
              - generic [ref=f81e2424]: Nguồn gốc
              - text: không rõ (khái niệm được cộng đồng continuous delivery và feature-flag phổ biến)
            - paragraph [ref=f81e2425]:
              - generic [ref=f81e2426]: Giải pháp
              - text: "Tách hai việc: deploy = đưa code lên môi trường (có thể nhiều lần mỗi ngày), release = quyết định hiển thị tính năng cho user (qua feature flag). Code deployed nhưng chưa released là bình thường."
            - paragraph [ref=f81e2427]:
              - text: "Liên quan:"
              - link "feature flag" [ref=f81e2428] [cursor=pointer]:
                - /url: "#feature-flag"
              - text: ", CD (continuous delivery/deployment), environment (dev/staging/prod)"
          - article [ref=f81e2429]:
            - heading "Rollback" [level=4] [ref=f81e2430]
            - paragraph [ref=f81e2431]: "còn gọi: quay lui phiên bản, rollback về bản cũ, revert deploy"
            - paragraph [ref=f81e2432]:
              - generic [ref=f81e2433]: Vấn đề
              - text: Release mới gây lỗi thanh toán lúc 2h sáng; trước đó server bị sửa in-place nên muốn quay lại phải build lại version cũ, copy lên, cấu hình tay — mất hàng giờ trong đêm, user đã bị ảnh hưởng từ phút đầu.
            - paragraph [ref=f81e2434]:
              - generic [ref=f81e2435]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e2436]:
              - generic [ref=f81e2437]: Giải pháp
              - text: Luôn giữ artifact/version trước đó còn chạy được và chuyển lưu lượng về nó như một thao tác (đổi tag, đổi load balancer, helm rollback) — phục hồi là nút bấm, không phải dự án.
