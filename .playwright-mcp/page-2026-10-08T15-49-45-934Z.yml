          - article [ref=f81e2236]:
            - heading "TDD" [level=4] [ref=f81e2237]
            - paragraph [ref=f81e2238]: "còn gọi: Test-Driven Development"
            - paragraph [ref=f81e2239]:
              - generic [ref=f81e2240]: Vấn đề
              - text: Khi code trước test, dễ viết code quá phức, khó test, hoặc bỏ sót yêu cầu. Thiếu ràng buộc để đảm bảo code đúng theo kỳ vọng.
            - paragraph [ref=f81e2241]:
              - generic [ref=f81e2242]: Nguồn gốc
              - text: Kent Beck (Extreme Programming)
            - paragraph [ref=f81e2243]:
              - generic [ref=f81e2244]: Giải pháp
              - text: Viết test fail trước, rồi implement tối thiểu để pass, sau đó refactor. Quy trình red-green-refactor.
            - paragraph [ref=f81e2245]:
              - text: "Liên quan:"
              - link "red-green-refactor" [ref=f81e2246] [cursor=pointer]:
                - /url: "#red-green-refactor"
              - text: ","
              - link "BDD" [ref=f81e2247] [cursor=pointer]:
                - /url: "#bdd"
              - text: ","
              - link "unit test" [ref=f81e2248] [cursor=pointer]:
                - /url: "#unit-test"
              - text: ","
              - link "refactoring" [ref=f81e2249] [cursor=pointer]:
                - /url: "#refactoring"
              - text: ","
              - link "Red-Green-Refactor" [ref=f81e2250] [cursor=pointer]:
                - /url: "#red-green-refactor"
              - text: ","
              - link "Regression test" [ref=f81e2251] [cursor=pointer]:
                - /url: "#regression-test"
          - article [ref=f81e2252]:
            - heading "Test double" [level=4] [ref=f81e2253]
            - paragraph [ref=f81e2254]:
              - generic [ref=f81e2255]: Vấn đề
              - text: Khi test cần phụ thuộc vào component bên ngoài (database, API, file hệ thống) làm chậm, không ổn định hoặc khó kiểm soát, việc test đơn vị trở nên khó khăn.
            - paragraph [ref=f81e2256]:
              - generic [ref=f81e2257]: Nguồn gốc
              - text: Gerard Meszaros (xUnit Test Patterns, 2007)
            - paragraph [ref=f81e2258]:
              - generic [ref=f81e2259]: Giải pháp
              - text: Thay thế các phụ thuộc thật bằng đối tượng thay thế có hành vi được kiểm soát, giúp cô lập system under test.
            - paragraph [ref=f81e2260]:
              - text: "Liên quan:"
              - link "Mock" [ref=f81e2261] [cursor=pointer]:
                - /url: "#mock"
              - text: ","
              - link "Stub" [ref=f81e2262] [cursor=pointer]:
                - /url: "#stub"
              - text: ","
