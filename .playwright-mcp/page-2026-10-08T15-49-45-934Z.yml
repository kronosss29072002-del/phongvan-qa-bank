                - /url: "#rollback"
              - text: ","
              - link "canary deploy" [ref=f81e2199] [cursor=pointer]:
                - /url: "#canary-deploy"
          - article [ref=f81e2200]:
            - heading "Spy" [level=4] [ref=f81e2201]
            - paragraph [ref=f81e2202]:
              - generic [ref=f81e2203]: Vấn đề
              - text: Khi cần dùng một phụ thuộc thực (hoặc gần thực) nhưng vẫn muốn ghi lại các lời gọi đã diễn ra (tham số, số lần gọi) để kiểm chứng sau khi thực thi.
            - paragraph [ref=f81e2204]:
              - generic [ref=f81e2205]: Nguồn gốc
              - text: Gerard Meszaros (xUnit Test Patterns)
            - paragraph [ref=f81e2206]:
              - generic [ref=f81e2207]: Giải pháp
              - text: Bọc quanh một đối tượng thật và ghi lại lịch sử tương tác, sau đó cho phép kiểm tra các tương tác đó trong phần assert.
