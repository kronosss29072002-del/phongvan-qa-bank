          - article [ref=f81e5471]:
            - heading "stress test" [level=4] [ref=f81e5472]
            - paragraph [ref=f81e5473]: "còn gọi: stress testing"
            - paragraph [ref=f81e5474]:
              - generic [ref=f81e5475]: Vấn đề
              - text: "Cần biết điểm gãy (breaking point) của hệ thống: khi nào CPU/memory/DB bị quá tải dẫn đến crash hoặc timeout."
            - paragraph [ref=f81e5476]:
              - generic [ref=f81e5477]: Nguồn gốc
              - text: Performance engineering
            - paragraph [ref=f81e5478]:
              - generic [ref=f81e5479]: Giải pháp
              - text: Tăng tải vượt ngưỡng dự kiến để quan sát hành vi khi quá tải (degradation, recovery).
            - paragraph [ref=f81e5480]:
              - text: "Liên quan:"
              - link "load test" [ref=f81e5481] [cursor=pointer]:
                - /url: "#load-test"
              - text: ","
