          - article [ref=f81e6153]:
            - heading "Cache penetration / breakdown / thundering herd" [level=4] [ref=f81e6154]
            - paragraph [ref=f81e6155]: "còn gọi: cache penetration, cache breakdown, cache avalanche, cache stampede, dog-piling"
            - paragraph [ref=f81e6156]:
              - generic [ref=f81e6157]: Vấn đề
              - text: "Ba kiểu sập cache theo kiểu khác nhau: (1) penetration — attacker hoặc bug query key không tồn tại ở cả cache lẫn DB (id=-1) nên mọi request đều miss, DB nhận toàn bộ traffic; (2) breakdown — một key hot vừa hết hạn, nghìn request đồng loạt miss cùng lúc cùng recompute; (3) avalanche — hàng nghìn key TTL giống hệt nhau hết hạn cùng một thời điểm. Kết quả: hit rate về 0, DB chết tải, có thể cascade sập toàn hệ thống (ví dụ render 3s × 10 req/s = 30 process tính đồng thời)."
            - paragraph [ref=f81e6158]:
              - generic [ref=f81e6159]: Nguồn gốc
              - text: "Cache stampede có trong Jargon File; 3 thuật ngữ 'penetration/breakdown/avalanche' phổ biến trong cộng đồng kỹ thuật Trung Quốc (Alibaba/Meituan blogs); giải pháp probabilistic early expiration: Vattani et al., 2015"
            - paragraph [ref=f81e6160]:
              - generic [ref=f81e6161]: Giải pháp
              - text: "Penetration: Bloom filter chặn key không tồn tại + cache negative result với TTL ngắn. Breakdown: mutex/single-flight chỉ 1 process recompute, phần còn chờ hoặc trả stale. Avalanche: TTL jitter ngẫu nhiên (không set trùng nhau) + probabilistic early expiration (Vattani et al. 2015 chứng minh phân phối mũ là tối ưu) + circuit breaker."
            - paragraph [ref=f81e6162]:
              - text: "Liên quan:"
              - link "Thundering herd" [ref=f81e6163] [cursor=pointer]:
                - /url: "#thundering-herd"
              - text: ", TTL,"
              - link "Hot key" [ref=f81e6164] [cursor=pointer]:
                - /url: "#hot-key"
              - text: ", Cache-aside, Single flight"
          - article [ref=f81e6165]:
            - heading "Hot key" [level=4] [ref=f81e6166]
            - paragraph [ref=f81e6167]: "còn gọi: khóa nóng, hotspot key"
            - paragraph [ref=f81e6168]:
              - generic [ref=f81e6169]: Vấn đề
              - text: Một key (sản phẩm flash-sale, tweet của người nổi tiếng) nhận hàng chục nghìn query/giây — dù đã cache, 1 Redis node duy nhất chứa key đó trở thành bottleneck CPU/network; xóa cache để refresh thì lập tức thousand-threads stampede cùng đọc DB.
            - paragraph [ref=f81e6170]:
              - generic [ref=f81e6171]: Nguồn gốc
              - text: không rõ (bài toán hotspot phổ biến trong blog kỹ thuật Trung Quốc và tài liệu vận hành Redis/MySQL)
            - paragraph [ref=f81e6172]:
              - generic [ref=f81e6173]: Giải pháp
              - text: "Phân tán hot key: replica nhiều bản local (local cache + TTL ngắn), thêm random suffix rời rộ (key-1..key-N), hash về nhiều shard node, hoặc read replica DB cho key đó — chia đều tải thay vì để một điểm nóng gánh tất cả."
            - paragraph [ref=f81e6174]:
              - text: "Liên quan:"
