              - link "Exactly-once illusion vs at-least-once" [ref=f81e5883] [cursor=pointer]:
                - /url: "#exactly-once-illusion-vs-at-least-once"
              - text: ","
              - link "Dedup window" [ref=f81e5884] [cursor=pointer]:
                - /url: "#dedup-window"
          - article [ref=f81e5885]:
            - heading "Idempotent consumer" [level=4] [ref=f81e5886]
            - paragraph [ref=f81e5887]: "còn gọi: idempotent handler, deduplicating consumer, dedup consumer, inbox pattern, người tiêu thụ bất biến"
            - paragraph [ref=f81e5888]:
              - generic [ref=f81e5889]: Vấn đề
              - text: At-least-once delivery đảm bảo không mất nhưng đảm bảo trùng; handler charge 2 lần hoặc insert 2 row khi redelivery.
            - paragraph [ref=f81e5890]:
              - generic [ref=f81e5891]: Nguồn gốc
              - text: Pattern phổ biến trong event-driven microservices (Chris Richardson - Microservices Patterns; liên quan outbox và saga).
            - paragraph [ref=f81e5892]:
              - generic [ref=f81e5893]: Giải pháp
              - text: Ghi event id (hoặc business key) đã xử lý trong DB (unique constraint) trước/с cùng side effect trong 1 transaction; lần sau thấy id trùng thì skip. Webhook Stripe hướng dẫn log event id rồi bỏ qua id đã có. Đôi khi kết hợp natural idempotency (UPSERT theo business key).
            - paragraph [ref=f81e5894]:
              - text: "Liên quan:"
              - link "Exactly-once illusion vs at-least-once" [ref=f81e5895] [cursor=pointer]:
                - /url: "#exactly-once-illusion-vs-at-least-once"
              - text: ", Outbox pattern,"
              - link "Webhook (delivery, retries, signature)" [ref=f81e5896] [cursor=pointer]:
                - /url: "#webhook-delivery-retries-signature"
              - text: ","
              - link "Idempotency" [ref=f81e5897] [cursor=pointer]:
                - /url: "#idempotency"
              - text: ","
              - link "Exactly-once semantics" [ref=f81e5898] [cursor=pointer]:
                - /url: "#exactly-once-semantics"
              - text: ","
              - link "Transactional outbox" [ref=f81e5899] [cursor=pointer]:
                - /url: "#transactional-outbox"
        - generic [ref=f81e5900]:
          - heading "Cơ sở dữ liệu & Lưu trữ 19" [level=3] [ref=f81e5901]:
            - text: Cơ sở dữ liệu & Lưu trữ
            - generic [ref=f81e5902]: "19"
          - article [ref=f81e5903]:
            - heading "Backward compatibility (schema)" [level=4] [ref=f81e5904]
            - paragraph [ref=f81e5905]: "còn gọi: tương thích ngược, expand-contract"
            - paragraph [ref=f81e5906]:
              - generic [ref=f81e5907]: Vấn đề
              - text: Rolling deploy giữa lúc schema đổi làm bản code cũ đọc hoặc ghi lỗi.
            - paragraph [ref=f81e5908]:
              - generic [ref=f81e5909]: Giải pháp
              - text: Mở rộng trước (thêm cột nullable), migrate dữ liệu, code mới chạy trước rồi mới gỡ cột cũ.
            - paragraph [ref=f81e5910]:
              - text: "Liên quan:"
              - link "Schema migration" [ref=f81e5911] [cursor=pointer]:
                - /url: "#schema-migration"
              - text: ","
              - link "Forward engineering" [ref=f81e5912] [cursor=pointer]:
                - /url: "#forward-engineering"
          - article [ref=f81e5913]:
            - heading "BASE / Eventual consistency" [level=4] [ref=f81e5914]
            - paragraph [ref=f81e5915]: "còn gọi: BASE, eventual consistency, nhất quán cuối cùng, basically available soft state"
            - paragraph [ref=f81e5916]:
              - generic [ref=f81e5917]: Vấn đề
              - text: Với tải ghi toàn cầu (multi-region, triệu request/giây), buộc mọi nút đồng bộ đồng thời (strong consistency) thì latency liên miền tăng hàng trăm ms và hệ thống dễ sập khi 1 region chết — ACID đánh đổi availability lấy đúng, không phù hợp khi availability là yêu cầu sinh tồn.
            - paragraph [ref=f81e5918]:
              - generic [ref=f81e5919]: Nguồn gốc
              - text: "Thuật ngữ BASE do Danny Pritchett (eBay) phổ biến trong \"BASE: An Acid Alternative\" (ACM Queue, 2008); ý tưởng eventual consistency đi kèm hệ Dynamo (Amazon, 2007)"
            - paragraph [ref=f81e5920]:
              - generic [ref=f81e5921]: Giải pháp
              - text: "BASE: Basically available (luôn trả lời được), Soft state (trạng thái có thể thay đổi không cần input), Eventual consistency (các nốt cùng kết quả khi ngừng ghi) — replica nhận ghi bất đồng bộ, chấp nhận đọc cũ trong khoảng trễ. DNS/email là ví dụ kinh điển."
            - paragraph [ref=f81e5922]:
              - text: "Liên quan:"
              - link "CAP theorem" [ref=f81e5923] [cursor=pointer]:
                - /url: "#cap-theorem"
              - text: ","
              - link "PACELC" [ref=f81e5924] [cursor=pointer]:
                - /url: "#pacelc"
              - text: ","
              - link "Multi-master replication" [ref=f81e5925] [cursor=pointer]:
                - /url: "#multi-master-replication"
          - article [ref=f81e5926]:
            - heading "CAP theorem" [level=4] [ref=f81e5927]
            - paragraph [ref=f81e5928]: "còn gọi: định lý CAP, Brewer's conjecture, Consistency-Availability-Partition tolerance, CAP, nguyên lý CAP"
            - paragraph [ref=f81e5929]:
              - generic [ref=f81e5930]: Vấn đề
              - text: Hệ phân tán chạy nhiều node, mạng giữa chúng chắc chắn sẽ chập chờn (mất gói, partition). Lúc partition xảy ra, ta muốn vừa trả lời mọi request (Availability) vừa đảm bảo mọi client thấy dữ liệu mới nhất (Consistency) — định lý chỉ ra không thể đồng thời, nên kiến trúc phải chọn thay vì mơ có tất cả.
            - paragraph [ref=f81e5931]:
              - generic [ref=f81e5932]: Nguồn gốc
              - text: Eric Brewer đưa ra giả thuyết 1998/2000 (PODC); Seth Gilbert & Nancy Lynch (MIT) chứng minh năm 2002
            - paragraph [ref=f81e5933]:
              - generic [ref=f81e5934]: Giải pháp
              - text: "Khi partition: chọn C (từ chối request để giữ nhất quán — CP) hoặc chọn A (phản hồi dữ liệu có thể cũ — AP). Mọi quyết định thiết kế NoSQL/replication đều nằm quanh tradeoff này."
            - paragraph [ref=f81e5935]:
              - text: "Liên quan:"
              - link "PACELC" [ref=f81e5936] [cursor=pointer]:
                - /url: "#pacelc"
              - text: ","
              - link "BASE / eventual consistency" [ref=f81e5937] [cursor=pointer]:
                - /url: "#base-eventual-consistency"
              - text: ","
              - link "Replication (master-slave / read replica)" [ref=f81e5938] [cursor=pointer]:
                - /url: "#replication-master-slave-read-replica"
              - text: ","
              - link "Eventual consistency" [ref=f81e5939] [cursor=pointer]:
                - /url: "#eventual-consistency"
              - text: ","
              - link "Split brain & quorum" [ref=f81e5940] [cursor=pointer]:
                - /url: "#split-brain-quorum"
              - text: ","
              - link "Linearizability" [ref=f81e5941] [cursor=pointer]:
                - /url: "#linearizability"
          - article [ref=f81e5942]:
            - heading "Cardinality estimation" [level=4] [ref=f81e5943]
            - paragraph [ref=f81e5944]: "còn gọi: ước lượng số dòng"
            - paragraph [ref=f81e5945]:
              - generic [ref=f81e5946]: Vấn đề
              - text: Ước sai số dòng làm chọn nhầm thứ tự join, plan xấu đi theo cấp số nhân.
            - paragraph [ref=f81e5947]:
              - generic [ref=f81e5948]: Giải pháp
              - text: Dùng histogram, số giá trị distinct và phỏng tuyến tính để dự đoán kết quả; thống kê sai là nguyên nhân plan tồi phổ biến.
            - paragraph [ref=f81e5949]:
              - text: "Liên quan:"
              - link "Cost-based optimizer" [ref=f81e5950] [cursor=pointer]:
                - /url: "#cost-based-optimizer"
              - text: ","
              - link "Index" [ref=f81e5951] [cursor=pointer]:
                - /url: "#index"
              - text: ","
              - link "Query planner" [ref=f81e5952] [cursor=pointer]:
                - /url: "#query-planner"
          - article [ref=f81e5953]:
            - heading "Cost-based optimizer" [level=4] [ref=f81e5954]
            - paragraph [ref=f81e5955]: "còn gọi: CBO, tối ưu theo chi phí"
            - paragraph [ref=f81e5956]:
              - generic [ref=f81e5957]: Vấn đề
              - text: Tối ưu theo quy tắc chọn plan theo thứ tự viết SQL, không tính đặc điểm dữ liệu nên hay chọn sai.
            - paragraph [ref=f81e5958]:
              - generic [ref=f81e5959]: Nguồn gốc
              - text: System R, Selinger và cộng sự, 1979
            - paragraph [ref=f81e5960]:
              - generic [ref=f81e5961]: Giải pháp
              - text: Tính chi phí I/O và CPU cho từng plan dựa trên thống kê bảng và index, chọn tổng chi phí thấp nhất.
            - paragraph [ref=f81e5962]:
              - text: "Liên quan:"
              - link "Query planner" [ref=f81e5963] [cursor=pointer]:
                - /url: "#query-planner"
              - text: ","
              - link "Cardinality estimation" [ref=f81e5964] [cursor=pointer]:
                - /url: "#cardinality-estimation"
              - text: ","
              - link "JOIN algorithms (nested loop / hash / sort-merge)" [ref=f81e5965] [cursor=pointer]:
                - /url: "#join-algorithms-nested-loop-hash-sort-merge"
          - article [ref=f81e5966]:
            - heading "Geospatial index" [level=4] [ref=f81e5967]
            - paragraph [ref=f81e5968]: "còn gọi: chỉ mục địa lý, spatial index, R-tree, geohash, H3, quadtree, PostGIS"
            - paragraph [ref=f81e5969]:
              - generic [ref=f81e5970]: Vấn đề
              - text: Tìm "nhà hàng trong bán kính 5km" trên bảng triệu điểm mà WHERE lat/lon so sánh range thì không đủ — lat/lon là 2 chiều, phải quét O(n) mọi điểm rồi tính khoảng cách từng cái, tốn hàng giây và sai vì lat/lon không linear (1 độ lon khác nhau theo vĩ độ).
            - paragraph [ref=f81e5971]:
              - generic [ref=f81e5972]: Nguồn gốc
              - text: "R-tree: Antonin Guttman, 1984 (paper gốc UC Berkeley). Geohash: Gustavo Niemeyer, 2008"
            - paragraph [ref=f81e5973]:
              - generic [ref=f81e5974]: Giải pháp
              - text: Chỉ mục không gian (R-tree gộp bounding box theo cây, quadtree, geohash/H3 mã hoá toạ độ thành chuỗi prefix) cho phép query theo vùng (ST_DWithin, CONTAINS) chỉ chạm các vùng không gian liên quan — giảm từ O(n) xuống gần O(log n).
            - paragraph [ref=f81e5975]:
              - text: "Liên quan: GIN / GiST,"
              - link "Index (B-tree, hash, composite)" [ref=f81e5976] [cursor=pointer]:
                - /url: "#index-b-tree-hash-composite"
              - text: ","
              - link "Query plan / EXPLAIN" [ref=f81e5977] [cursor=pointer]:
                - /url: "#query-plan-explain"
          - article [ref=f81e5978]:
            - heading "GIN / GiST index" [level=4] [ref=f81e5979]
            - paragraph [ref=f81e5980]: "còn gọi: generalized inverted index, generalized search tree, inverted index, PostgreSQL GIN, PostgreSQL GiST"
            - paragraph [ref=f81e5981]:
              - generic [ref=f81e5982]: Vấn đề
              - text: "B-tree không phục vụ được kiểu truy vấn \"chứa\", \"giao\", \"toạ độ gần\": WHERE tags @> '{db}' (mảng chứa phần tử), full-text search 'apple & banana', tìm điểm trong vùng... — dữ liệu JSONb/array/full-text ngày càng nhiều mà B-tree sinh ra cho so sánh thứ tự của 1 giá trị scalar."
            - paragraph [ref=f81e5983]:
              - generic [ref=f81e5984]: Nguồn gốc
              - text: "GiST: Hellerstein, Naughton & Pfeiffer, 1998 (\"Generalized Search Trees for Database Systems\"). GIN: O'Neil, Cheng, Gawlick & O'Neil, 2006 (\"The GIN Inverted Index\")"
            - paragraph [ref=f81e5985]:
              - generic [ref=f81e5986]: Giải pháp
              - text: "GIN (inverted): index theo từng phần tử bên trong giá trị phức (mỗi tag/array element dẫn về danh sách row chứa nó) — trả lời \"chứa X\" gần O(log n). GiST: khung search tree tổng quát chứa cả R-tree (spatial), trigram... dùng cho nearest-neighbor, containment. Postgres chọn type bằng USING clause."
            - paragraph [ref=f81e5987]:
              - text: "Liên quan:"
              - link "Index (B-tree, hash, composite)" [ref=f81e5988] [cursor=pointer]:
                - /url: "#index-b-tree-hash-composite"
              - text: ","
              - link "Geospatial index" [ref=f81e5989] [cursor=pointer]:
                - /url: "#geospatial-index"
              - text: ","
              - link "Query plan / EXPLAIN" [ref=f81e5990] [cursor=pointer]:
                - /url: "#query-plan-explain"
          - article [ref=f81e5991]:
            - heading "LSM tree" [level=4] [ref=f81e5992]
            - paragraph [ref=f81e5993]: "còn gọi: Log-Structured Merge Tree"
            - paragraph [ref=f81e5994]:
              - generic [ref=f81e5995]: Vấn đề
              - text: Ghi ngẫu hứng lên B+tree tạo random I/O chậm, khó scale khi workload ghi nhiều.
            - paragraph [ref=f81e5996]:
              - generic [ref=f81e5997]: Nguồn gốc
              - text: Patrick O'Neil, 1996
            - paragraph [ref=f81e5998]:
              - generic [ref=f81e5999]: Giải pháp
              - text: Ghi tuần tự vào memtable rồi flush thành SSTable, compaction gộp bản ghi; ghi nhanh, đổi lấy chi phí đọc và nền compaction.
            - paragraph [ref=f81e6000]:
              - text: "Liên quan: B+tree,"
              - link "Index" [ref=f81e6001] [cursor=pointer]:
                - /url: "#index"
              - text: ", WAL"
          - article [ref=f81e6002]:
            - heading "Multi-master replication" [level=4] [ref=f81e6003]
            - paragraph [ref=f81e6004]: "còn gọi: multi-primary, master-master, đa master ghi"
            - paragraph [ref=f81e6005]:
              - generic [ref=f81e6006]: Vấn đề
              - text: "Master-slave: master chết thì chỉ nhận read, không ghi được (hoặc failover trễ gây downtime ghi); ghi cho người dùng châu Á phải về master ở Mỹ — latency ghi cao. 1 nút ghi duy nhất là single point of failure và bottleneck địa lý."
            - paragraph [ref=f81e6007]:
              - generic [ref=f81e6008]: Nguồn gốc
              - text: Không rõ tác giả — có trong các clustered DB thương mại (Oracle RAC, MySQL multi-master) từ thập niên 2000
            - paragraph [ref=f81e6009]:
              - generic [ref=f81e6010]: Giải pháp
              - text: "Nhiều nút cùng nhận ghi, đồng bộ sang nhau; node nào chết thì client chuyển node khác. Vấn đề mới sinh ra: conflict resolution — 2 nút cùng sửa 1 dòng thì phân giải thế nào (last-write-wins, vector clock, CRDT)? Dễ vi phạm ACID hơn, thường phải chấp nhận eventual consistency."
            - paragraph [ref=f81e6011]:
              - text: "Liên quan:"
              - link "Replication (master-slave / read replica)" [ref=f81e6012] [cursor=pointer]:
                - /url: "#replication-master-slave-read-replica"
              - text: ","
              - link "Split brain" [ref=f81e6013] [cursor=pointer]:
                - /url: "#split-brain"
              - text: ","
              - link "BASE / eventual consistency" [ref=f81e6014] [cursor=pointer]:
                - /url: "#base-eventual-consistency"
          - article [ref=f81e6015]:
            - heading "MVCC" [level=4] [ref=f81e6016]
            - paragraph [ref=f81e6017]: "còn gọi: Multi-Version Concurrency Control"
            - paragraph [ref=f81e6018]:
              - generic [ref=f81e6019]: Vấn đề
              - text: Lock đọc-ghi truyền thống làm mọi đọc phải chờ ghi và ngược lại, bóp nghẹt throughput.
            - paragraph [ref=f81e6020]:
              - generic [ref=f81e6021]: Giải pháp
              - text: Mỗi transaction thấy một snapshot; bản ghi giữ nhiều phiên bản kèm XID nên đọc không phải chờ ghi.
            - paragraph [ref=f81e6022]:
              - text: "Liên quan:"
              - link "Snapshot isolation" [ref=f81e6023] [cursor=pointer]:
                - /url: "#snapshot-isolation"
              - text: ", WAL,"
              - link "Isolation level" [ref=f81e6024] [cursor=pointer]:
                - /url: "#isolation-level"
          - article [ref=f81e6025]:
            - heading "MVCC (Multiversion Concurrency Control)" [level=4] [ref=f81e6026]
            - paragraph [ref=f81e6027]: "còn gọi: điều khiển đồng thời đa phiên bản, snapshot isolation"
            - paragraph [ref=f81e6028]:
              - generic [ref=f81e6029]: Vấn đề
              - text: Với locking đơn thuần, reader chặn writer và ngược lại — transaction đọc dài (báo cáo) giữ lock làm writer chờ hàng giây, hoặc transaction ghi lâu làm reader chờ. Dưới tải nhiều client, lock contention làm throughput sập; đọc được dữ liệu nửa vời của transaction chưa commit thì hỏng consistency.
            - paragraph [ref=f81e6030]:
              - generic [ref=f81e6031]: Nguồn gốc
              - text: David P. Reed, dissertation MIT 1978; chi tiết hóa bởi Phil Bernstein & Goodman (1981); sản phẩm thương mại đầu tiên VAX Rdb/ELN (DEC, 1984, Jim Starkey)
            - paragraph [ref=f81e6032]:
              - generic [ref=f81e6033]: Giải pháp
              - text: "Mỗi ghi tạo version mới thay vì ghi đè; mỗi transaction thấy snapshot dữ liệu tại thời điểm bắt đầu — reader không chặn writer, writer không chặn reader. Version cũ được VACUUM/garbage-collect khi không transaction nào còn thấy. Đánh đổi: tốn storage + overhead dọn dẹp."
            - paragraph [ref=f81e6034]:
              - text: "Liên quan:"
              - link "Isolation level" [ref=f81e6035] [cursor=pointer]:
                - /url: "#isolation-level"
              - text: ","
              - link "Lock & deadlock" [ref=f81e6036] [cursor=pointer]:
                - /url: "#lock-deadlock"
              - text: ", WAL"
          - article [ref=f81e6037]:
            - heading "PACELC" [level=4] [ref=f81e6038]
            - paragraph [ref=f81e6039]: "còn gọi: PACELC theorem"
            - paragraph [ref=f81e6040]:
              - generic [ref=f81e6041]: Vấn đề
              - text: CAP chỉ nói về lúc có partition — nhưng partition hiếm, phần lớn thời gian hệ thống chạy bình thường, khi đó vẫn phải chọn giữa latency và consistency (đọc từ replica trả lời nhanh nhưng có thể cũ; đợi replica đồng bộ thì đúng nhưng chậm). CAP không mô tả đánh đổi này nên kiến trúc đánh giá chưa đủ.
            - paragraph [ref=f81e6042]:
              - generic [ref=f81e6043]: Nguồn gốc
              - text: Daniel Abadi (Yale University) — blog 2010, paper làm rõ 2012; chứng minh hình thức bởi Wojciech Golab, ACM SIGACT News 2018
            - paragraph [ref=f81e6044]:
              - generic [ref=f81e6045]: Giải pháp
              - text: "If Partition thì chọn A hay C; Else (không partition) thì chọn L (latency) hay C. Bắt trọn 4 kịch bản: PA/EL (Dynamo-style), PC/EC (transaction DB)... Chọn P/C/A/L cho đúng case thật thay vì label CP/AP chung chung."
            - paragraph [ref=f81e6046]:
              - text: "Liên quan:"
              - link "CAP theorem" [ref=f81e6047] [cursor=pointer]:
                - /url: "#cap-theorem"
              - text: ","
              - link "BASE / eventual consistency" [ref=f81e6048] [cursor=pointer]:
                - /url: "#base-eventual-consistency"
              - text: ","
              - link "Replication (master-slave / read replica)" [ref=f81e6049] [cursor=pointer]:
                - /url: "#replication-master-slave-read-replica"
          - article [ref=f81e6050]:
            - heading "Sharding" [level=4] [ref=f81e6051]
            - paragraph [ref=f81e6052]: "còn gọi: phân mảnh dữ liệu, phân vùng ngang"
            - paragraph [ref=f81e6053]:
              - generic [ref=f81e6054]: Vấn đề
              - text: Một node hết dung lượng và hết sức xử lý, còn tăng cấp dọc thì đắt.
            - paragraph [ref=f81e6055]:
              - generic [ref=f81e6056]: Giải pháp
              - text: Chia bảng theo hàng dựa trên shard key sang nhiều node, mỗi node giữ phần dữ liệu và gánh phần tải.
            - paragraph [ref=f81e6057]:
              - text: "Liên quan:"
              - link "Consistent hashing" [ref=f81e6058] [cursor=pointer]:
                - /url: "#consistent-hashing"
              - text: ","
              - link "Replication (sync/async)" [ref=f81e6059] [cursor=pointer]:
                - /url: "#replication-sync-async"
          - article [ref=f81e6060]:
            - heading "Sharding & consistent hashing" [level=4] [ref=f81e6061]
            - paragraph [ref=f81e6062]: "còn gọi: phân mảnh phân tán, shard, consistent hashing, hash partitioning"
            - paragraph [ref=f81e6063]:
              - generic [ref=f81e6064]: Vấn đề
              - text: 1 node DB chạm giới hạn ghi/RAM/disk — thêm read replica chỉ giải load đọc, còn ghi vẫn kẹt 1 nơi. Đặt hết data 1 máy thì không scale write và chết là mất sạch. Hash data theo mod N node thì đổi N (thêm/bớt node) là phải remap gần toàn bộ key — không mở rộng nổi.
            - paragraph [ref=f81e6065]:
              - generic [ref=f81e6066]: Nguồn gốc
              - text: "Consistent hashing: David Karger et al. (MIT), 1997. Sharding: thuật ngữ phổ biến cộng đồng MySQL scalability đầu thập niên 2000 — không rõ tác giả duy nhất"
            - paragraph [ref=f81e6067]:
              - generic [ref=f81e6068]: Giải pháp
              - text: "Sharding: chia data thành shard theo shard key, mỗi shard 1 DB riêng, thêm node = thêm shard. Consistent hashing: key và node cùng nằm trên vòng hash, node chết/thêm chỉ ảnh hưởng key của node đó (~1/N) thay vì remap tất cả. Đánh đổi: JOIN cross-shard khó, hot shard, rebalancing phức tạp."
            - paragraph [ref=f81e6069]:
              - text: "Liên quan:"
              - link "Partitioning (horizontal / vertical)" [ref=f81e6070] [cursor=pointer]:
