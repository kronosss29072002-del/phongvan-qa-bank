                - /url: "#two-phase-locking-2pl"
              - text: ","
              - link "Snapshot isolation" [ref=f81e3215] [cursor=pointer]:
                - /url: "#snapshot-isolation"
          - article [ref=f81e3216]:
            - heading "Query plan / EXPLAIN" [level=4] [ref=f81e3217]
            - paragraph [ref=f81e3218]: "còn gọi: kế hoạch thực thi, EXPLAIN ANALYZE, execution plan, query planner"
            - paragraph [ref=f81e3219]:
              - generic [ref=f81e3220]: Vấn đề
              - text: Cùng 1 câu SQL chạy nhanh khi table nhỏ, chậm gấp 1000x khi data tăng — vì planner chọn sai cách (dùng index sai, quét bảng full, join sai thứ tự). Không xem được plan thì tối ưu query là đoán mò.
            - paragraph [ref=f81e3221]:
              - generic [ref=f81e3222]: Nguồn gốc
              - text: Có từ các hệ sớm như IBM System R (thập niên 1970) — không rõ người/năm cụ thể
            - paragraph [ref=f81e3223]:
              - generic [ref=f81e3224]: Giải pháp
              - text: "EXPLAIN cho planner giải thích: scan table hay index, ước tính bao nhiêu dòng, join thế nào; EXPLAIN ANALYZE chạy thật và đo thời gian từng bước — chỉ ra chính xác bước nào tốn nhất để sửa."
            - paragraph [ref=f81e3225]:
              - text: "Liên quan:"
              - link "Index (B-tree, hash, composite)" [ref=f81e3226] [cursor=pointer]:
                - /url: "#index-b-tree-hash-composite"
