            - paragraph [ref=f81e2995]:
              - generic [ref=f81e2996]: Vấn đề
              - text: Đọc từng trang từ đĩa chậm hơn RAM hàng nghìn lần, còn ghi trực tiếp thì cản truy vấn.
            - paragraph [ref=f81e2997]:
              - generic [ref=f81e2998]: Giải pháp
              - text: Giữ trang hay dùng trong RAM, thay thế theo LRU hoặc clock, ghi dirty page ra đĩa khi cần.
