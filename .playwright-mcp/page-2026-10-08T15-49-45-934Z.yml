            - paragraph [ref=f81e6225]: "còn gọi: chạy hồ sơ hiệu năng, CPU profile"
            - paragraph [ref=f81e6226]:
              - generic [ref=f81e6227]: Vấn đề
              - text: API chậm nhưng 'code nhìn không có gì nặng' — tối ưu mù các dòng code cảm tính (micro-optimize vòng lặp nhỏ) trong khi bottleneck thật là mộtregex compile lại mỗi request hoặc GC pause 200ms. Không profile thì tối ưu kiểu mò kim đáy bể.
            - paragraph [ref=f81e6228]:
              - generic [ref=f81e6229]: Nguồn gốc
              - text: không rõ (profiler có từ hệ thống mainframe; flame graph do Brendan Gregg phổ biến năm 2011)
            - paragraph [ref=f81e6230]:
              - generic [ref=f81e6231]: Giải pháp
              - text: "Đo thật: CPU profile (sampling flame graph tìm hàm chiếm % CPU), memory profile (leak, allocation rate), wall-clock/race detector — chỉ ra chính xác dòng code tiêu tốn tài nguyên, tối ưu đúng chỗ rồi đo lại để xác nhận."
