              - link "Test isolation" [ref=f81e5524] [cursor=pointer]:
                - /url: "#test-isolation"
          - article [ref=f81e5525]:
            - heading "Test fixture" [level=4] [ref=f81e5526]
            - paragraph [ref=f81e5527]:
              - generic [ref=f81e5528]: Vấn đề
              - text: Nhiều test cần cùng một thiết lập ban đầu (dữ liệu, đối tượng) — lặp lại code thiết lập sẽ gây rườm rà và khó bảo trì.
            - paragraph [ref=f81e5529]:
              - generic [ref=f81e5530]: Nguồn gốc
              - text: xUnit
            - paragraph [ref=f81e5531]:
              - generic [ref=f81e5532]: Giải pháp
              - text: Thiết lập môi trường/common state cần thiết trước test (setup) và dọn dẹp sau (teardown), giúp đảm bảo test isolation.
            - paragraph [ref=f81e5533]:
