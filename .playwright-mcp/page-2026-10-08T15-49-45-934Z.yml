          - article [ref=f81e660]:
            - heading "Dirty read" [level=4] [ref=f81e661]
            - paragraph [ref=f81e662]: "còn gọi: đọc bẩn"
            - paragraph [ref=f81e663]:
              - generic [ref=f81e664]: Vấn đề
              - text: Đọc dữ liệu chưa commit của transaction khác; nếu bên đó rollback, bạn giữ giá trị chưa bao giờ tồn tại.
            - paragraph [ref=f81e665]:
              - generic [ref=f81e666]: Giải pháp
              - text: Nâng isolation lên Read Committed trở lên để chỉ đọc dữ liệu đã commit.
            - paragraph [ref=f81e667]:
              - text: "Liên quan:"
              - link "Isolation level" [ref=f81e668] [cursor=pointer]:
                - /url: "#isolation-level"
              - text: ","
              - link "MVCC" [ref=f81e669] [cursor=pointer]:
                - /url: "#mvcc"
              - text: ","
              - link "Snapshot isolation" [ref=f81e670] [cursor=pointer]:
                - /url: "#snapshot-isolation"
          - article [ref=f81e671]:
            - heading "Index" [level=4] [ref=f81e672]
            - paragraph [ref=f81e673]: "còn gọi: chỉ mục"
            - paragraph [ref=f81e674]:
              - generic [ref=f81e675]: Vấn đề
              - text: Query không index phải quét toàn bảng, tốn O(n) trên dữ liệu lớn.
            - paragraph [ref=f81e676]:
              - generic [ref=f81e677]: Giải pháp
              - text: Cấu trúc phụ thường là B+tree lưu key kèm vị trí bản ghi, đổi dung lượng và chi phí ghi lấy tốc độ đọc.
            - paragraph [ref=f81e678]:
              - text: "Liên quan: B+tree,"
              - link "Primary key vs Secondary index" [ref=f81e679] [cursor=pointer]:
                - /url: "#primary-key-vs-secondary-index"
              - text: ","
              - link "Query planner" [ref=f81e680] [cursor=pointer]:
                - /url: "#query-planner"
          - article [ref=f81e681]:
            - heading "Index (B-tree, hash, composite)" [level=4] [ref=f81e682]
            - paragraph [ref=f81e683]: "còn gọi: chỉ mục, B-tree index, hash index, composite index"
            - paragraph [ref=f81e684]:
              - generic [ref=f81e685]: Vấn đề
              - text: Bảng 10 triệu dòng mà WHERE email = 'x' phải quét toàn table (full table scan) — truy vấn vài chục ms biến thành vài giây, sập dưới tải thật. Không index thì tìm kiếm, lọc, phân trang đều chậm theo kích thước dữ liệu.
            - paragraph [ref=f81e686]:
              - generic [ref=f81e687]: Nguồn gốc
              - text: Cây B-tree do Bayer & McCreight (Boeing Research Labs) công bố 1970/1972; hash index và composite index có trong các hệ DB thương mại thập niên 1980
            - paragraph [ref=f81e688]:
              - generic [ref=f81e689]: Giải pháp
              - text: "Cấu trúc dữ liệu phụ (B-tree cho so sánh =, <, >, range và giữ thứ tự; hash chỉ cho =; composite gộp nhiều cột cho WHERE dùng 2+ cột) để tìm dòng đúng gần O(log n) thay vì O(n). Đánh đổi: đọc nhanh hơn nhưng ghi chậm hơn vì phải cập nhật index."
            - paragraph [ref=f81e690]:
              - text: "Liên quan:"
              - link "Query plan / EXPLAIN" [ref=f81e691] [cursor=pointer]:
                - /url: "#query-plan-explain"
              - text: ","
              - link "Normalization" [ref=f81e692] [cursor=pointer]:
                - /url: "#normalization"
              - text: ", GIN / GiST"
          - article [ref=f81e693]:
            - heading "Migration" [level=4] [ref=f81e694]
            - paragraph [ref=f81e695]: "còn gọi: di trú schema, database migration, Flyway, Liquibase, Prisma Migrate"
            - paragraph [ref=f81e696]:
              - generic [ref=f81e697]: Vấn đề
              - text: Developer A đổi schema trên máy mình, developer B và production vẫn schema cũ — code deploy lên là crash vì cột biến mất hoặc sai kiểu. Không có lịch sử schema thì không biết DB đang ở cấu trúc nào và không rollback được khi migration sai.
            - paragraph [ref=f81e698]:
              - generic [ref=f81e699]: Nguồn gốc
              - text: Không rõ tác giả đầu tiên; được phổ biến rộng rãi bởi Ruby on Rails (migrations, giữa thập niên 2000)
            - paragraph [ref=f81e700]:
              - generic [ref=f81e701]: Giải pháp
              - text: Schema mô tả bằng file versioned trong git; từng bước migration chạy có trật tự trên mọi môi trường — dev/staging/prod cùng phiên bản, ai cũng thấy lịch sử thay đổi và revert được.
            - paragraph [ref=f81e702]:
              - text: "Liên quan:"
              - link "Schema" [ref=f81e703] [cursor=pointer]:
                - /url: "#schema"
              - text: ","
              - link "ORM" [ref=f81e704] [cursor=pointer]:
                - /url: "#orm"
              - text: ","
              - link "Relational database (RDBMS)" [ref=f81e705] [cursor=pointer]:
                - /url: "#relational-database-rdbms"
          - article [ref=f81e706]:
            - heading "Normalization" [level=4] [ref=f81e707]
            - paragraph [ref=f81e708]: "còn gọi: chuẩn hoá dữ liệu, 1NF, 2NF, 3NF, BCNF"
            - paragraph [ref=f81e709]:
              - generic [ref=f81e710]: Vấn đề
              - text: "Bảng chưa chuẩn hoá thì cùng một sự thật nằm ở nhiều dòng: đổi địa chỉ 1 khách phải UPDATE 50 dòng, sót dòng nào là dữ liệu mâu thuẫn ngay (update anomaly); xoá đúng 1 dòng lại mất luôn thông tin không liên quan (delete anomaly)."
            - paragraph [ref=f81e711]:
              - generic [ref=f81e712]: Nguồn gốc
              - text: Edgar F. Codd — 1NF (1970), 2NF/3NF (1971); BCNF do Codd & Boyce, 1974
            - paragraph [ref=f81e713]:
              - generic [ref=f81e714]: Giải pháp
              - text: Chia bảng nhỏ, mỗi sự thật chỉ lưu 1 lần, quan hệ qua FK. Đánh đổi nhiều JOIN khi đọc — sau này denormalize lại khi JOIN thật sự chậm.
            - paragraph [ref=f81e715]:
              - text: "Liên quan: Primary key / Foreign key,"
              - link "N+1 problem" [ref=f81e716] [cursor=pointer]:
                - /url: "#n-1-problem"
              - text: ","
              - link "Index (B-tree, hash, composite)" [ref=f81e717] [cursor=pointer]:
                - /url: "#index-b-tree-hash-composite"
          - article [ref=f81e718]:
            - heading "NoSQL (MongoDB / Redis / Cassandra)" [level=4] [ref=f81e719]
            - paragraph [ref=f81e720]: "còn gọi: document store, key-value store, wide-column store"
            - paragraph [ref=f81e721]:
              - generic [ref=f81e722]: Vấn đề
              - text: Sản phẩm đổi schema liên tục thì schema rigid của RDBMS khiến mỗi lần thêm field là migration lớn; khi cần hàng triệu lượt ghi/giây (session, feed, telemetry) thì single-node ACID trả giá quá cao — mô hình quan hệ không phù hợp cho tải này.
            - paragraph [ref=f81e723]:
              - generic [ref=f81e724]: Nguồn gốc
              - text: Thuật ngữ "NoSQL" xuất hiện cuối thập niên 1990, phổ biến rộng rãi khoảng 2009 (cộng đồng Cassandra/MongoDB/Redis); không có tác giả duy nhất
            - paragraph [ref=f81e725]:
              - generic [ref=f81e726]: Giải pháp
              - text: "Bỏ bớt ràng buộc: document store (MongoDB) lưu JSON linh hoạt, key-value (Redis) tra cứu O(1) trong RAM, wide-column (Cassandra) ghi phân tán theo hàng — thường chọn availability + tốc độ thay vì ACID đầy đủ (BASE)."
            - paragraph [ref=f81e727]:
              - text: "Liên quan:"
              - link "BASE / eventual consistency" [ref=f81e728] [cursor=pointer]:
                - /url: "#base-eventual-consistency"
              - text: ","
              - link "CAP theorem" [ref=f81e729] [cursor=pointer]:
                - /url: "#cap-theorem"
              - text: ","
              - link "Sharding & consistent hashing" [ref=f81e730] [cursor=pointer]:
                - /url: "#sharding-consistent-hashing"
          - article [ref=f81e731]:
            - heading "OLTP vs OLAP" [level=4] [ref=f81e732]
            - paragraph [ref=f81e733]: "còn gọi: OLTP, OLAP, hệ giao dịch, hệ phân tích"
            - paragraph [ref=f81e734]:
              - generic [ref=f81e735]: Vấn đề
              - text: Truy vấn giao dịch ngắn và báo cáo tổng hợp lớn có workload trái ngược, không tối ưu chung được.
            - paragraph [ref=f81e736]:
              - generic [ref=f81e737]: Giải pháp
              - text: OLTP xử lý nhiều transaction ngắn trên dòng, cần index và khóa; OLAP quét khối lớn, ưu tiên cột và hàm tổng hợp.
            - paragraph [ref=f81e738]:
              - text: "Liên quan:"
              - link "Index" [ref=f81e739] [cursor=pointer]:
                - /url: "#index"
              - text: ","
              - link "Normalization (1NF-3NF)" [ref=f81e740] [cursor=pointer]:
                - /url: "#normalization-1nf-3nf"
              - text: ","
              - link "Clustered index" [ref=f81e741] [cursor=pointer]:
                - /url: "#clustered-index"
          - article [ref=f81e742]:
            - heading "ORM" [level=4] [ref=f81e743]
            - paragraph [ref=f81e744]: "còn gọi: Object-Relational Mapping, Prisma, TypeORM, Hibernate, Sequelize"
            - paragraph [ref=f81e745]:
              - generic [ref=f81e746]: Vấn đề
              - text: Code app làm việc với object/struct, DB làm việc với hàng/cột — mỗi chỗ tự viết tay SELECT/INSERT rồi map về object rất lặp và dễ sai; đổi schema là sửa hàng chục chỗ SQL rải rác, thiếu type safety.
            - paragraph [ref=f81e747]:
              - generic [ref=f81e748]: Nguồn gốc
              - text: Không rõ tác giả duy nhất; kỹ thuật bắt nguồn từ object database thập niên 1980-90, phổ biến cùng các framework web (Hibernate 2001, ActiveRecord của Rails)
            - paragraph [ref=f81e749]:
              - generic [ref=f81e750]: Giải pháp
              - text: "ORM ánh xạ model class sang bảng, cho phép thao tác mức object (user.findMany()) và tự sinh SQL; đổi tên cột chỉ sửa 1 chỗ model. Đánh đổi: dễ tạo query ẩn kém tối ưu, dẫn tới N+1."
            - paragraph [ref=f81e751]:
              - text: "Liên quan:"
              - link "N+1 problem" [ref=f81e752] [cursor=pointer]:
                - /url: "#n-1-problem"
              - text: ","
              - link "Migration" [ref=f81e753] [cursor=pointer]:
                - /url: "#migration"
              - text: ","
              - link "Schema" [ref=f81e754] [cursor=pointer]:
                - /url: "#schema"
          - article [ref=f81e755]:
            - heading "Page" [level=4] [ref=f81e756]
            - paragraph [ref=f81e757]: "còn gọi: khối dữ liệu, block"
            - paragraph [ref=f81e758]:
              - generic [ref=f81e759]: Vấn đề
              - text: Đọc ghi từng byte trên đĩa kém hiệu quả, I/O nên thực hiện theo lô cỡ cố định.
            - paragraph [ref=f81e760]:
              - generic [ref=f81e761]: Giải pháp
              - text: Chia file thành khối thường 4-16KB; mọi đọc ghi đều đi theo trang để gộp I/O.
            - paragraph [ref=f81e762]:
              - text: "Liên quan:"
              - link "Buffer pool" [ref=f81e763] [cursor=pointer]:
