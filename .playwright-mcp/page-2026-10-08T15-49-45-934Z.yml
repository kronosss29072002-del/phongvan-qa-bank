          - article [ref=f81e2135]:
            - heading "lint" [level=4] [ref=f81e2136]
            - paragraph [ref=f81e2137]: "còn gọi: linter, linting"
            - paragraph [ref=f81e2138]:
              - generic [ref=f81e2139]: Vấn đề
              - text: Code style không nhất quán, dễ gây tranh cãi trong review. Nhiều lỗi đơn giản (unused import, typo) lặp lại.
            - paragraph [ref=f81e2140]:
              - generic [ref=f81e2141]: Nguồn gốc
              - text: Stephen C. Johnson (lint for C)
            - paragraph [ref=f81e2142]:
              - generic [ref=f81e2143]: Giải pháp
              - text: Tự động kiểm tra style/rule (format, convention) trước commit/CI để bắt lỗi sớm, giữ codebase nhất quán.
            - paragraph [ref=f81e2144]:
              - text: "Liên quan:"
