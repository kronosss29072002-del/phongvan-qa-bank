          - article [ref=f81e6097]:
            - heading "Split brain" [level=4] [ref=f81e6098]
            - paragraph [ref=f81e6099]: "còn gọi: chia não, split-brain, network partition giữa 2 nút"
            - paragraph [ref=f81e6100]:
              - generic [ref=f81e6101]: Vấn đề
              - text: "Hai nút trong cluster mất liên lạc với nhau nhưng cả hai vẫn sống và phục vụ client (mỗi nút nghĩ đối phương chết) — cả hai cùng nhận ghi làm dữ liệu phân nhánh: 2 phiên bản mâu thuẫn của cùng 1 record, khi heal mạng lại không biết bản nào đúng, resolve sai là mất dữ liệu."
            - paragraph [ref=f81e6102]:
              - generic [ref=f81e6103]: Nguồn gốc
              - text: Không rõ tác giả — thuật ngữ từ hệ thống phân tán/cluster (thập niên 1990-2000, gắn với cao availability clustering và nghiên cứu quorum/Paxos)
            - paragraph [ref=f81e6104]:
              - generic [ref=f81e6105]: Giải pháp
              - text: Quorum/majority (nút chỉ serve khi thấy đủ số nút còn sống), fencing (STONITH — kill node cũ trước khi cấp quyền nút mới), lease/epoch number để chặn nút "chết đi sống lại" ghi đè. Tránh để cả 2 cùng active-write.
            - paragraph [ref=f81e6106]:
              - text: "Liên quan: Two-phase commit,"
              - link "Multi-master replication" [ref=f81e6107] [cursor=pointer]:
                - /url: "#multi-master-replication"
              - text: ","
              - link "CAP theorem" [ref=f81e6108] [cursor=pointer]:
                - /url: "#cap-theorem"
          - article [ref=f81e6109]:
            - heading "Two-phase commit (2PC)" [level=4] [ref=f81e6110]
            - paragraph [ref=f81e6111]: "còn gọi: giao dịch hai pha, 2PC, XA transaction"
            - paragraph [ref=f81e6112]:
              - generic [ref=f81e6113]: Vấn đề
              - text: "Transaction cần ghi trên 2 DB khác nhau (đặt vé + trừ ví điện tử): nếu commit DB A rồi crash trước khi commit DB B thì dữ liệu 2 nơi mâu thuẫn vĩnh viễn — không cơ chế nào tự biết phía bên kia đã làm gì."
            - paragraph [ref=f81e6114]:
              - generic [ref=f81e6115]: Nguồn gốc
              - text: Không xác minh được tác giả/năm trực tiếp từ nguồn chính thức (thường được nhắc cùng văn bản Jim Gray/IBM thập niên 1970-80)
            - paragraph [ref=f81e6116]:
              - generic [ref=f81e6117]: Giải pháp
              - text: "Pha 1 (prepare): coordinator hỏi mọi participant đã sẵn sàng chưa, participant ghi WAL sẵn commit nhưng chưa làm; pha 2: tất cả trả YES thì coordinator ra lệnh commit, có 1 nơi NO thì rollback tất cả. Đánh đổi lớn: protocol blocking — coordinator chết thì participant kẹt giữ lock chờ vô hạn."
            - paragraph [ref=f81e6118]:
              - text: "Liên quan:"
              - link "Transaction & ACID" [ref=f81e6119] [cursor=pointer]:
                - /url: "#transaction-acid"
              - text: ", WAL,"
              - link "Split brain" [ref=f81e6120] [cursor=pointer]:
                - /url: "#split-brain"
          - article [ref=f81e6121]:
            - heading "Two-phase locking (2PL)" [level=4] [ref=f81e6122]
            - paragraph [ref=f81e6123]: "còn gọi: 2PL, hai pha khóa"
            - paragraph [ref=f81e6124]:
              - generic [ref=f81e6125]: Vấn đề
              - text: Cần cách chứng minh lịch song song đúng isolation mà không cấm hẳn đồng thời.
            - paragraph [ref=f81e6126]:
              - generic [ref=f81e6127]: Nguồn gốc
              - text: Eswaran và cộng sự, 1976
            - paragraph [ref=f81e6128]:
              - generic [ref=f81e6129]: Giải pháp
              - text: Pha lấy khóa không giải phóng, pha giải phóng không lấy thêm; giữ khóa đến commit thì được serializable.
