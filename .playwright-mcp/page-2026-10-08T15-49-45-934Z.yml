                - /url: "#non-blocking-i-o"
              - text: ","
              - link "Reactor pattern" [ref=f81e2465] [cursor=pointer]:
                - /url: "#reactor-pattern"
          - article [ref=f81e2466]:
            - heading "CDN" [level=4] [ref=f81e2467]
            - paragraph [ref=f81e2468]: "còn gọi: Content Delivery Network, mạng phân phối nội dung"
            - paragraph [ref=f81e2469]:
              - generic [ref=f81e2470]: Vấn đề
              - text: "Website phục vụ user toàn cầu từ MỘT data center: người ở châu Á tải ảnh từ server Mỹ mất vài trăm ms RTT, và đợt cao điểm (sale, tin nóng) cả origin sập vì mọi request về một chỗ — chi phí bandwidth origin cũng phình. Đứng sau một trang lớn, bạn không thể giải quyết bằng cách chỉ tăng 1 server ở 1 vùng."
            - paragraph [ref=f81e2471]:
              - generic [ref=f81e2472]: Nguồn gốc
              - text: Cảm hứng từ work của Tom Leighton/Danny Lewin (MIT) cuối 1990s → Akamai thành lập 1998; CDN 'arose in the late 1990s' để giảm bottleneck Internet.
            - paragraph [ref=f81e2473]:
              - generic [ref=f81e2474]: Giải pháp
              - text: Sao chép cache static (và cả dynamic) ra các PoP edge khắp thế giới, DNS/Anycast định tuyến user về node gần nhất; miss mới quay về origin (origin shield), giảm cả latency lẫn tải origin.
