            - paragraph [ref=f81e3051]:
              - generic [ref=f81e3052]: Vấn đề
              - text: Máy tắt giữa chừng khi transaction đang ghi dở và mọi thứ trong RAM biến mất.
            - paragraph [ref=f81e3053]:
              - generic [ref=f81e3054]: Giải pháp
              - text: Redo các thay đổi đã commit từ log và undo transaction chưa commit, đưa DB về trạng thái nhất quán.
            - paragraph [ref=f81e3055]:
