              - link "Autoscaling" [ref=f81e1697] [cursor=pointer]:
                - /url: "#autoscaling"
              - text: ","
              - link "Bottleneck Analysis" [ref=f81e1698] [cursor=pointer]:
                - /url: "#bottleneck-analysis"
          - article [ref=f81e1699]:
            - heading "Redundancy/N+1 Redundancy" [level=4] [ref=f81e1700]
            - paragraph [ref=f81e1701]: "còn gọi: dự phòng, N+1, active-active, active-passive"
            - paragraph [ref=f81e1702]:
              - generic [ref=f81e1703]: Vấn đề
              - text: Single point of failure (SPOF) làm toàn hệ thống sập khi 1 thành phần hỏng.
            - paragraph [ref=f81e1704]:
              - generic [ref=f81e1705]: Giải pháp
              - text: "N = capacity cần thiết để phục vụ; N+1 nghĩa thêm 1 instance dự phòng; N+2 an toàn hơn nhưng tốn kém. Active-active: tất cả xử lý lưu lượng; active-passive: dự phòng chờ kích hoạt. Cần đảm bảo failover nhanh và test định kỳ."
            - paragraph [ref=f81e1706]:
              - text: "Liên quan:"
              - link "Autoscaling" [ref=f81e1707] [cursor=pointer]:
