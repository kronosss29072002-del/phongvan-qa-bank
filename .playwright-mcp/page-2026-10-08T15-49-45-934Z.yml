                - /url: "#type-check"
          - article [ref=f81e2147]:
            - heading "Mock" [level=4] [ref=f81e2148]
            - paragraph [ref=f81e2149]:
              - generic [ref=f81e2150]: Vấn đề
              - text: Khi muốn đảm bảo system under test gọi đúng phương thức với tham số đúng lên một collaborator (hành vi tương tác), chứ không chỉ quan tâm đến kết quả trả về.
            - paragraph [ref=f81e2151]:
              - generic [ref=f81e2152]: Nguồn gốc
              - text: Gerard Meszaros (xUnit Test Patterns)
            - paragraph [ref=f81e2153]:
              - generic [ref=f81e2154]: Giải pháp
              - text: Một test double được cấu hình trước với các kỳ vọng (expectations) về cách nó sẽ được gọi; test sẽ thất bại nếu các tương tác không khớp như mong đợi.
            - paragraph [ref=f81e2155]:
