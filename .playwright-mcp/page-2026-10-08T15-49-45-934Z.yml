              - link "Index" [ref=f81e789] [cursor=pointer]:
                - /url: "#index"
              - text: ","
              - link "Covering index" [ref=f81e790] [cursor=pointer]:
                - /url: "#covering-index"
          - article [ref=f81e791]:
            - heading "Relational database (RDBMS)" [level=4] [ref=f81e792]
            - paragraph [ref=f81e793]: "còn gọi: Cơ sở dữ liệu quan hệ, RDBMS"
            - paragraph [ref=f81e794]:
              - generic [ref=f81e795]: Vấn đề
              - text: "Trước khi có mô hình quan hệ, dữ liệu doanh nghiệp nằm trong file phẳng hoặc mô hình mạng/phân cấp: mỗi ứng dụng tự lưu file riêng, dữ liệu trùng lặp khắp nơi, đổi cấu trúc là phải sửa hàng loạt chương trình và các bản sao rất dễ mâu thuẫn với nhau."
            - paragraph [ref=f81e796]:
              - generic [ref=f81e797]: Nguồn gốc
              - text: Edgar F. Codd (IBM), 1970 — paper "A Relational Model of Data for Large Shared Data Banks"
            - paragraph [ref=f81e798]:
              - generic [ref=f81e799]: Giải pháp
              - text: Dữ liệu tổ chức thành bảng có schema cố định, truy cập qua ngôn ngữ khai báo (SQL); quan hệ giữa bảng giữ bằng khóa chính/khóa ngoại thay vì hardcode cấu trúc con trỏ trong code.
            - paragraph [ref=f81e800]:
              - text: "Liên quan:"
              - link "SQL" [ref=f81e801] [cursor=pointer]:
                - /url: "#sql"
              - text: ","
              - link "Normalization" [ref=f81e802] [cursor=pointer]:
                - /url: "#normalization"
              - text: ", Primary key / Foreign key,"
              - link "Transaction & ACID" [ref=f81e803] [cursor=pointer]:
                - /url: "#transaction-acid"
          - article [ref=f81e804]:
            - heading "Schema" [level=4] [ref=f81e805]
            - paragraph [ref=f81e806]: "còn gọi: lớp sơ đồ dữ liệu, database schema"
            - paragraph [ref=f81e807]:
              - generic [ref=f81e808]: Vấn đề
              - text: Nếu mỗi developer tự quyết dữ liệu lưu kiểu gì (cột tên lung tung, kiểu dữ liệu mỗi nơi một khác) thì dữ liệu trao đổi giữa các service hỏng ngầm — app này ghi "age", app kia đọc "tuoi", không ai biết bản nào là đúng.
            - paragraph [ref=f81e809]:
              - generic [ref=f81e810]: Nguồn gốc
              - text: Không rõ (đi kèm mô hình quan hệ của Codd 1970 và các hệ DB thương mại đầu thập niên 1970-80)
            - paragraph [ref=f81e811]:
              - generic [ref=f81e812]: Giải pháp
              - text: "Schema là bản khai báo cứng: tên bảng/cột, kiểu dữ liệu, ràng buộc (NOT NULL, unique...). DB enforce schema lúc ghi vào, dữ liệu sai cấu trúc bị từ chối ngay ở cửa vào thay vì lan vào bảng."
            - paragraph [ref=f81e813]:
              - text: "Liên quan:"
              - link "Relational database (RDBMS)" [ref=f81e814] [cursor=pointer]:
                - /url: "#relational-database-rdbms"
              - text: ","
              - link "Migration" [ref=f81e815] [cursor=pointer]:
                - /url: "#migration"
              - text: ","
              - link "ORM" [ref=f81e816] [cursor=pointer]:
                - /url: "#orm"
          - article [ref=f81e817]:
            - heading "SQL" [level=4] [ref=f81e818]
            - paragraph [ref=f81e819]: "còn gọi: Structured Query Language, ngôn ngữ truy vấn có cấu trúc"
            - paragraph [ref=f81e820]:
              - generic [ref=f81e821]: Vấn đề
              - text: Khi dữ liệu đã tổ chức thành bảng, programmer vẫn phải viết code imperative từng bước (mở dữ liệu, lặp, lọc, map) để lấy kết quả — chậm, dễ sai, mỗi người viết một kiểu và không ai tối ưu tập trung được.
            - paragraph [ref=f81e822]:
              - generic [ref=f81e823]: Nguồn gốc
              - text: IBM System R, đầu thập niên 1970 — ban đầu gọi SEQUEL (Chamberlin & Boyce), đổi thành SQL vì lý do tên thương mại
            - paragraph [ref=f81e824]:
              - generic [ref=f81e825]: Giải pháp
              - text: "Ngôn ngữ khai báo: nói \"muốn gì\" (SELECT ... WHERE ... JOIN), bộ query planner của DB tự chọn cách thực hiện — người viết không cần biết dữ liệu nằm ở đâu hay index nào được dùng."
            - paragraph [ref=f81e826]:
              - text: "Liên quan:"
              - link "Relational database (RDBMS)" [ref=f81e827] [cursor=pointer]:
                - /url: "#relational-database-rdbms"
              - text: ","
              - link "Query plan / EXPLAIN" [ref=f81e828] [cursor=pointer]:
                - /url: "#query-plan-explain"
              - text: ","
              - link "Index (B-tree, hash, composite)" [ref=f81e829] [cursor=pointer]:
                - /url: "#index-b-tree-hash-composite"
          - article [ref=f81e830]:
            - heading "Transaction" [level=4] [ref=f81e831]
            - paragraph [ref=f81e832]: "còn gọi: giao dịch"
            - paragraph [ref=f81e833]:
              - generic [ref=f81e834]: Vấn đề
              - text: Nhiều thao tác ghi liên quan phải thành công hoặc thất bại cùng nhau; lỗi giữa chừng để dữ liệu lệch nhau.
            - paragraph [ref=f81e835]:
              - generic [ref=f81e836]: Nguồn gốc
              - text: IBM System R, thập niên 1970
            - paragraph [ref=f81e837]:
              - generic [ref=f81e838]: Giải pháp
              - text: "Gói nhiều lệnh thành một đơn vị nguyên tử: commit thì ghi hết, rollback thì hủy hết."
            - paragraph [ref=f81e839]:
              - text: "Liên quan:"
              - link "BEGIN/COMMIT/ROLLBACK" [ref=f81e840] [cursor=pointer]:
                - /url: "#begin-commit-rollback"
              - text: ","
              - link "ACID" [ref=f81e841] [cursor=pointer]:
                - /url: "#acid"
              - text: ","
              - link "Isolation level" [ref=f81e842] [cursor=pointer]:
                - /url: "#isolation-level"
          - article [ref=f81e843]:
            - heading "Transaction & ACID" [level=4] [ref=f81e844]
            - paragraph [ref=f81e845]: "còn gọi: giao dịch, giao dịch nguyên tử, Atomicity, Consistency, Isolation, Durability"
            - paragraph [ref=f81e846]:
              - generic [ref=f81e847]: Vấn đề
              - text: Chuyển tiền là nhiều bước UPDATE riêng lẻ; app crash giữa chừng hoặc 2 client ghi đè nhau thì số dư lệch thật, không tự cân đối được — code application không thể tự đảm bảo mọi bước thành công hay thất bại cùng nhau khi process chết giữa chừng.
            - paragraph [ref=f81e848]:
              - generic [ref=f81e849]: Nguồn gốc
              - text: Thuật ngữ ACID do Haerder & Reuter đặt trong "Principles of Transaction-Oriented Database Recovery" (1983); ý tưởng giao dịch phát triển từ công việc của James Gray (IBM/System R, thập niên 1970)
            - paragraph [ref=f81e850]:
              - generic [ref=f81e851]: Giải pháp
              - text: "DB đóng gói nhiều thao tác thành 1 đơn vị: Atomicity (thành công hết hoặc rollback hết), Consistency (ràng buộc luôn đúng sau giao dịch), Isolation (giao dịch song song không làm hỏng nhau), Durability (đã commit là sống qua crash nhờ WAL)."
            - paragraph [ref=f81e852]:
              - text: "Liên quan:"
              - link "Isolation level" [ref=f81e853] [cursor=pointer]:
                - /url: "#isolation-level"
              - text: ", WAL, Two-phase commit"
        - generic [ref=f81e854]:
          - heading "Caching & Hiệu năng 9" [level=3] [ref=f81e855]:
            - text: Caching & Hiệu năng
            - generic [ref=f81e856]: "9"
          - article [ref=f81e857]:
            - heading "Browser cache" [level=4] [ref=f81e858]
            - paragraph [ref=f81e859]: "còn gọi: HTTP cache, client cache"
            - paragraph [ref=f81e860]:
              - generic [ref=f81e861]: Vấn đề
              - text: Mỗi lần mở trang, browser tải lại toàn bộ CSS/JS/ảnh dù file không đổi — tốn bandwidth, chậm, server chịu load vô nghĩa cho static resource.
            - paragraph [ref=f81e862]:
              - generic [ref=f81e863]: Nguồn gốc
              - text: Phần của HTTP/1.0 (1997) với header Expires; phát triển qua RFC 2616 (1999) và RFC 9111 (2022)
            - paragraph [ref=f81e864]:
              - generic [ref=f81e865]: Giải pháp
              - text: Browser lưu response kèm metadata (ETag, Last-Modified, Cache-Control) rồi gửi conditional request (If-None-Match) — server trả 304 Not Modified khi chưa đổi, tiết kiệm cả bandwidth lẫn round-trip.
            - paragraph [ref=f81e866]:
              - text: "Liên quan:"
              - link "Cache" [ref=f81e867] [cursor=pointer]:
                - /url: "#cache"
              - text: ", TTL,"
              - link "stale-while-revalidate" [ref=f81e868] [cursor=pointer]:
                - /url: "#stale-while-revalidate"
              - text: ","
              - link "CDN" [ref=f81e869] [cursor=pointer]:
                - /url: "#cdn"
          - article [ref=f81e870]:
            - heading "Cache" [level=4] [ref=f81e871]
            - paragraph [ref=f81e872]: "còn gọi: bộ nhớ đệm"
            - paragraph [ref=f81e873]:
              - generic [ref=f81e874]: Vấn đề
              - text: Mỗi request đều đọc database hoặc tính lại dữ liệu khiến hệ thống chậm và database chết tải khi traffic tăng. Đọc ổ cứng/Database tốn hàng chục ms trong khi RAM chỉ tốn vài ms — người phục vụ website động những năm 1990-2000 liên tục bị bottleneck ở tầng lưu trữ.
            - paragraph [ref=f81e875]:
              - generic [ref=f81e876]: Nguồn gốc
              - text: Khái niệm cổ trong khoa học máy tính (CPU cache từ những năm 1960s); không ghi nhận một người phát minh duy nhất
            - paragraph [ref=f81e877]:
              - generic [ref=f81e878]: Giải pháp
              - text: Chuỗi lưu kết quả tính sẵn ở nơi đọc nhanh (RAM, ổ đĩa) để request sau đọc lại thay vì truy vấn lại nguồn gốc; chỉ trả về từ nguồn thật khi cache miss.
            - paragraph [ref=f81e879]:
              - text: "Liên quan:"
              - link "in-memory cache" [ref=f81e880] [cursor=pointer]:
                - /url: "#in-memory-cache"
              - text: ", TTL,"
              - link "cache invalidation" [ref=f81e881] [cursor=pointer]:
                - /url: "#cache-invalidation"
              - text: ","
              - link "CDN" [ref=f81e882] [cursor=pointer]:
                - /url: "#cdn"
          - article [ref=f81e883]:
            - heading "Cache invalidation" [level=4] [ref=f81e884]
            - paragraph [ref=f81e885]: "còn gọi: hủy cache, xóa cache"
            - paragraph [ref=f81e886]:
              - generic [ref=f81e887]: Vấn đề
              - text: Dữ liệu trong cache là bản sao — khi user ghi đè database, cache vẫn giữ bản cũ nên user thấy dữ liệu sai (giá cũ, quyền hạn cũ). Invalidate sai cách thì serve data sai; invalidate quá mạnh thì mất hết lợi ích cache.
            - paragraph [ref=f81e888]:
              - generic [ref=f81e889]: Nguồn gốc
              - text: Phát biểu nổi tiếng "there are only two hard things in cache invalidation" gắn với Phil Karlton (late 1990s); không có một phát minh cụ thể
            - paragraph [ref=f81e890]:
              - generic [ref=f81e891]: Giải pháp
              - text: "Có nhiều chiến lược: ghi DB thì xóa key tương ứng (cache-aside), version/epoch key, pub/sub broadcast xóa đa node, hoặc để TTL tự hết — chọn theo mức chấp nhận được của staleness."
            - paragraph [ref=f81e892]:
              - text: "Liên quan:"
              - link "Cache" [ref=f81e893] [cursor=pointer]:
                - /url: "#cache"
              - text: ", TTL, cache-aside,"
              - link "write-through" [ref=f81e894] [cursor=pointer]:
                - /url: "#write-through"
          - article [ref=f81e895]:
            - heading "CDN (Content Delivery Network)" [level=4] [ref=f81e896]
            - paragraph [ref=f81e897]: "còn gọi: mạng phân phối nội dung"
            - paragraph [ref=f81e898]:
              - generic [ref=f81e899]: Vấn đề
              - text: Người dùng ở Việt Nam truy cập server đặt ở Mỹ phải đi qua hàng chục hop xuyên đại dương — latency 200-300ms mỗi request, và server gốc chịu toàn bộ traffic dồn dập gây bottleneck.
            - paragraph [ref=f81e900]:
              - generic [ref=f81e901]: Nguồn gốc
              - text: CDN xuất hiện cuối thập niên 1990 (Akamai thành lập 1998 bởi Tom Leighton và nhóm MIT) để xử lý bottleneck Internet thời đó
            - paragraph [ref=f81e902]:
              - generic [ref=f81e903]: Giải pháp
              - text: Phân phối static content ra các edge node đặt khắp thế giới; request trả lời từ node gần user nhất, giảm latency và gánh bandwidth cho origin. Push CDN nhận file chủ động, Pull CDN hút khi có request đầu tiên.
            - paragraph [ref=f81e904]:
              - text: "Liên quan:"
              - link "Cache" [ref=f81e905] [cursor=pointer]:
                - /url: "#cache"
              - text: ","
              - link "Browser cache" [ref=f81e906] [cursor=pointer]:
                - /url: "#browser-cache"
              - text: ","
              - link "stale-while-revalidate" [ref=f81e907] [cursor=pointer]:
                - /url: "#stale-while-revalidate"
              - text: ", Compression"
          - article [ref=f81e908]:
            - heading "Compression (gzip/Brotli)" [level=4] [ref=f81e909]
            - paragraph [ref=f81e910]: "còn gọi: nén dữ liệu, gzip, brotli, Compression (gzip/brotli) & CPU tradeoff, nén HTTP, compression ratio"
            - paragraph [ref=f81e911]:
              - generic [ref=f81e912]: Vấn đề
              - text: Response JSON/HTML/JS hàng trăm KB gửi nguyên dạng khiến trang tải chậm trên mạng di động, tốn bandwidth — server cũng tốn băng thông egress mỗi GB trả về. Nén brotli level 11 cho JSON 200KB nhưng tốn 50ms CPU/request trên QPS cao — tiết kiệm bandwidth đổi lấy CPU và latency, hoặc nén mọi thứ kể cả ảnh đã nén (lãngng phí).
            - paragraph [ref=f81e913]:
              - generic [ref=f81e914]: Nguồn gốc
              - text: Gzip là RFC 1952 (1996). Brotli do kỹ sư Google Jyrki Alakuijala và Zoltán Szabadka phát triển, phát hành 15/10/2013, chuẩn hóa RFC 7932
            - paragraph [ref=f81e915]:
              - generic [ref=f81e916]: Giải pháp
              - text: "Nén payload trước khi gửi (Content-Encoding), client giải nén — JSON 500KB có thể còn ~50-100KB. Gzip phổ biến từ lâu; Brotli nén tốt hơn ~15-20% cho JS/HTML/CSS nhờ dictionary 120KB, nhưng encode chậm hơn nên hay dùng cho static asset. Gzip (deflate) nhanh, ratio ~70-80% so với thô; brotli (Google, RFC 7932) ratio cao hơn nhưng level cao chậm (nên precompress tĩnh tại build). Chỉ nén text (json/html/js/css), bỏ qua ảnh/video đã nén. Threshold tối thiểu (~1KB), Vary: Accept-Encoding, tính CPU/request × QPS."
            - paragraph [ref=f81e917]:
              - text: "Liên quan:"
              - link "CDN" [ref=f81e918] [cursor=pointer]:
                - /url: "#cdn"
              - text: ","
              - link "latency vs throughput" [ref=f81e919] [cursor=pointer]:
                - /url: "#latency-vs-throughput"
              - text: ","
              - link "Connection pool" [ref=f81e920] [cursor=pointer]:
                - /url: "#connection-pool"
              - text: ", CPU pinning,"
              - link "Zero-copy" [ref=f81e921] [cursor=pointer]:
                - /url: "#zero-copy"
              - text: ","
              - link "CDN edge caching" [ref=f81e922] [cursor=pointer]:
                - /url: "#cdn-edge-caching"
          - article [ref=f81e923]:
            - heading "In-memory cache" [level=4] [ref=f81e924]
            - paragraph [ref=f81e925]: "còn gọi: cache trong bộ nhớ RAM"
            - paragraph [ref=f81e926]:
              - generic [ref=f81e927]: Vấn đề
              - text: Database lưu trên đĩa (hoặc network round-trip) quá chậm so với nhu cầu đọc hàng nghìn lần/giây; đọc cùng một row hàng nghìn lần mà vẫn disk I/O thì throughput bị chặn.
            - paragraph [ref=f81e928]:
              - generic [ref=f81e929]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e930]:
              - generic [ref=f81e931]: Giải pháp
              - text: Giữ dữ liệu thường đọc trong RAM của process hoặc service riêng, tra key-value O(1) thay vì truy vấn SQL; đổi lấy chi phí RAM và vấn đề đồng bộ khi dữ liệu gốc thay đổi.
            - paragraph [ref=f81e932]:
              - text: "Liên quan:"
              - link "Redis" [ref=f81e933] [cursor=pointer]:
                - /url: "#redis"
              - text: ","
              - link "Memcached" [ref=f81e934] [cursor=pointer]:
                - /url: "#memcached"
              - text: ","
              - link "Cache" [ref=f81e935] [cursor=pointer]:
                - /url: "#cache"
          - article [ref=f81e936]:
            - heading "Latency vs Throughput" [level=4] [ref=f81e937]
            - paragraph [ref=f81e938]: "còn gọi: độ trễ vs công suất"
            - paragraph [ref=f81e939]:
              - generic [ref=f81e940]: Vấn đề
              - text: Team đo 'hệ thống xử lý 10k req/s' nhưng user vẫn phì thanh toán chậm 5 giây — vì họ nhầm throughput cao = nhanh. Tối ưu một chiều có thể làm chiều kia xấu đi (batching tăng throughput nhưng tăng latency từng request).
            - paragraph [ref=f81e941]:
              - generic [ref=f81e942]: Nguồn gốc
              - text: không rõ (khái niệm nền tảng của performance engineering)
            - paragraph [ref=f81e943]:
              - generic [ref=f81e944]: Giải pháp
              - text: Latency = thời gian 1 request hoàn thành (ms); throughput = số request hoàn thành mỗi giây. Đặt SLO theo p50/p95/p99 latency cho UX, dùng throughput để tính capacity — tối ưu cả hai theo mục tiêu thật chứ không chỉ một con số.
            - paragraph [ref=f81e945]:
              - text: "Liên quan: QPS,"
              - link "Little's law" [ref=f81e946] [cursor=pointer]:
                - /url: "#little-s-law"
              - text: ","
              - link "Benchmark" [ref=f81e947] [cursor=pointer]:
                - /url: "#benchmark"
              - text: ","
              - link "Backpressure" [ref=f81e948] [cursor=pointer]:
                - /url: "#backpressure"
          - article [ref=f81e949]:
            - heading "Pagination (offset vs cursor)" [level=4] [ref=f81e950]
            - paragraph [ref=f81e951]: "còn gọi: phân trang, offset pagination, cursor/keyset pagination, Pagination (offset vs cursor/keyset), cursor pagination, keyset pagination, page token"
            - paragraph [ref=f81e952]:
              - generic [ref=f81e953]: Vấn đề
              - text: Bảng triệu dòng mà trả hết một lần thì API trả hàng GB và browser treo. Nhưng OFFSET 100000 thì database vẫn phải đọc rồi vứt 100000 dòng trước đó — càng lặn sâu càng chậm; đồng thời data đổi giữa 2 trang thì OFFSET làm trùng/sót dòng (drift). Trả toàn bộ collection làm response phình và timeout; offset(skip) trên bảng lớn làm query chậm O(n) và item bị trùng/lọt khi dữ liệu chèn/xóa giữa chừng.
            - paragraph [ref=f81e954]:
              - generic [ref=f81e955]: Nguồn gốc
              - text: không rõ (bài toán cổ điển của mọi ORM/API; cộng đồng wiki.use-the-index-luke.com của Markus Winand phổ biến keyset pagination)
            - paragraph [ref=f81e956]:
              - generic [ref=f81e957]: Giải pháp
              - text: "Offset (?page=50) nhảy theo số dòng — đơn giản cho số trang tùy ý nhưng chậm ở trang sâu. Cursor/keyset (WHERE id < last_seen ORDER BY id LIMIT 10) seek thẳng theo index — O(1) ở mọi độ sâu, không drift khi data đổi, đánh đổi là không nhảy arbitrary page. Offset: page/limit, dễ nhảy trang nhưng đắt và không ổn định. Cursor: server trả token opaque trỏ tới vị trí (thường kèm sort key); client gửi lại token cho trang sau. AIP-158: token phải opaque, không user-parseable (base64 che thông tin minh bạch là không đủ), token không được cấp quyền truy cập, khoảng 3 ngày là thời hạn tối hậu, thêm pagination vào API cũ là breaking change."
            - paragraph [ref=f81e958]:
              - text: "Liên quan:"
              - link "hot path" [ref=f81e959] [cursor=pointer]:
                - /url: "#hot-path"
              - text: ", QPS,"
              - link "in-memory cache" [ref=f81e960] [cursor=pointer]:
                - /url: "#in-memory-cache"
              - text: ", Cursor stability, Pagination token expiry,"
              - link "Filtering/sorting query params" [ref=f81e961] [cursor=pointer]:
                - /url: "#filtering-sorting-query-params"
          - article [ref=f81e962]:
            - heading "TTL (Time To Live)" [level=4] [ref=f81e963]
            - paragraph [ref=f81e964]: "còn gọi: thời gian sống, cache expiry"
            - paragraph [ref=f81e965]:
              - generic [ref=f81e966]: Vấn đề
              - text: Cache không bao giờ hết hạn thì dữ liệu cũ tồn tại mãi — giá sản phẩm thay đổi nhưng client vẫn thấy giá cũ, hoặc cache phình vô hạn vì không có cơ chế tự dọn.
            - paragraph [ref=f81e967]:
              - generic [ref=f81e968]: Nguồn gốc
              - text: không rõ (khái niệm xuất hiện sớm trong DNS TTL và mạng máy tính)
            - paragraph [ref=f81e969]:
              - generic [ref=f81e970]: Giải pháp
              - text: Gắn thời hạn cho mỗi entry; quá hạn thì bị evict hoặc phải revalidate với nguồn, cân bằng giữa độ tươi mới dữ liệu và số lần phải truy vấn nguồn.
            - paragraph [ref=f81e971]:
              - text: "Liên quan:"
              - link "Cache invalidation" [ref=f81e972] [cursor=pointer]:
                - /url: "#cache-invalidation"
              - text: ", TTL jitter,"
              - link "stale-while-revalidate" [ref=f81e973] [cursor=pointer]:
                - /url: "#stale-while-revalidate"
        - generic [ref=f81e974]:
          - heading "Hiệu năng 19" [level=3] [ref=f81e975]:
            - text: Hiệu năng
            - generic [ref=f81e976]: "19"
          - article [ref=f81e977]:
            - heading "Amdahl's law" [level=4] [ref=f81e978]
            - paragraph [ref=f81e979]: "còn gọi: định luật Amdahl, speedup tối đa, serial fraction"
            - paragraph [ref=f81e980]:
              - generic [ref=f81e981]: Vấn đề
              - text: Đội ngũ thêm 100 core mà tốc độ chỉ cải thiện 2x, rồi kết luận 'phần song song hóa làm sai' — thực ra phần tuần tự còn lại chi phối tất cả.
            - paragraph [ref=f81e982]:
              - generic [ref=f81e983]: Nguồn gốc
              - text: Gene Amdahl, trình bày tại AFIPS Spring Joint Computer Conference, 1967
            - paragraph [ref=f81e984]:
              - generic [ref=f81e985]: Giải pháp
              - text: "Speedup tối đa = 1 / (f + (1-f)/n), với f là fraction tuần tự, n số luồng/tài nguyên. Khi n → vô hạn, speedup bị chặn bởi 1/f. Bài học: đo fraction tuần tự trước khi đầu tư song song; tối ưu phần chiếm nhiều thời gian nhất (profiling) trước."
            - paragraph [ref=f81e986]:
              - text: "Liên quan:"
              - link "Gustafson's law" [ref=f81e987] [cursor=pointer]:
                - /url: "#gustafson-s-law"
              - text: ", Amdahl,"
              - link "Profiling" [ref=f81e988] [cursor=pointer]:
                - /url: "#profiling"
          - article [ref=f81e989]:
            - heading "Bandwidth vs Latency" [level=4] [ref=f81e990]
            - paragraph [ref=f81e991]: "còn gọi: băng thông và độ trễ, bandwidth latency tradeoff"
            - paragraph [ref=f81e992]:
              - generic [ref=f81e993]: Vấn đề
              - text: "Đường truyền 1Gbps vẫn upload file chậm vì latency cao (satellite/4G): người dùng hiểu nhầm 'mạng nhanh = băng thông lớn'."
            - paragraph [ref=f81e994]:
              - generic [ref=f81e995]: Giải pháp
              - text: Bandwidth = số byte tối đa mỗi giây (phụ thuộc pipe); latency = thời gian byte đầu tiên đi được hết đường (phụ thuộc khoảng cách + xử lý ở mỗi nút). Giao thức gửi nhiều round trip nhỏ bị chi phối bởi latency; transfer file lớn bị chi phối bởi bandwidth. High-BDP link cần cửa sổ truyền đủ lớn để lấp đầy băng thông.
            - paragraph [ref=f81e996]:
              - text: "Liên quan: Speed of light RTT,"
              - link "TCP slow start" [ref=f81e997] [cursor=pointer]:
                - /url: "#tcp-slow-start"
              - text: ","
              - link "Bufferbloat" [ref=f81e998] [cursor=pointer]:
                - /url: "#bufferbloat"
          - article [ref=f81e999]:
            - heading "Cache hit ratio" [level=4] [ref=f81e1000]
            - paragraph [ref=f81e1001]: "còn gọi: tỉ lệ trúng cache, hit rate, cache hit rate"
            - paragraph [ref=f81e1002]:
              - generic [ref=f81e1003]: Vấn đề
              - text: Thêm Redis nhưng DB vẫn chết vì hit ratio chỉ 40% — 60% request vẫn xuyên thấu xuống database đúng lúc traffic cao điểm.
            - paragraph [ref=f81e1004]:
              - generic [ref=f81e1005]: Giải pháp
              - text: "Hit ratio = số truy cập trả về từ cache / tổng số truy cập. Đo theo key/hotpath, không chỉ tổng thể (một tỷ lệ cao toàn cục vẫn che một vùng key miss 100%). Cải thiện: TTL và refresh phù hợp, warming, nâng cache cho hot key; kết hợp negative caching cho miss lặp lại."
            - paragraph [ref=f81e1006]:
              - text: "Liên quan: Cache stampede, Negative caching,"
              - link "Hot key" [ref=f81e1007] [cursor=pointer]:
                - /url: "#hot-key"
          - article [ref=f81e1008]:
            - heading "Capacity test vs performance test" [level=4] [ref=f81e1009]
            - paragraph [ref=f81e1010]: "còn gọi: capacity testing, performance testing, load test vs stress test, soak test"
            - paragraph [ref=f81e1011]:
              - generic [ref=f81e1012]: Vấn đề
              - text: Team chỉ chạy 'load test đúng kịch bản giờ cao điểm' rồi kết luận đủ capacity — thực tế không biết giới hạn rìa ở đâu, không biết phục hồi sau quá tải ra sao.
            - paragraph [ref=f81e1013]:
              - generic [ref=f81e1014]: Giải pháp
              - text: Performance test đo latency/throughput ở mức load xác định (so sánh regression); capacity test dò đến ngưỡng (max sustainable RPS trước khi latency SLO vỡ); stress test vượt ngưỡng để xem degrade/recovery; soak test chạy giờ-độ để bắt leak. Mỗi loại mục tiêu và tiêu chí pass khác nhau.
            - paragraph [ref=f81e1015]:
              - text: "Liên quan: Performance budget, SLO-driven optimization,"
              - link "Benchmark" [ref=f81e1016] [cursor=pointer]:
                - /url: "#benchmark"
          - article [ref=f81e1017]:
            - heading "CDN edge caching" [level=4] [ref=f81e1018]
            - paragraph [ref=f81e1019]: "còn gọi: CDN, edge cache, cache tại biên, origin shield"
            - paragraph [ref=f81e1020]:
              - generic [ref=f81e1021]: Vấn đề
              - text: "User ở xa origin: mỗi lần tải ảnh/video qua nửa vòng đất, origin chịu load dù nội dung tĩnh — chi phí bandwidth và latency cao vô ích."
            - paragraph [ref=f81e1022]:
              - generic [ref=f81e1023]: Giải pháp
              - text: "CDN phân phối replica nội dung tại PoP gần user: cache HIT → RTT vài ms; MISS → pull về origin rồi phục vụ edge sau. Cấu hình: Cache-Control/TTL, cache key (query string, header), stale-while-revalidate tại edge, purge, origin shield để tránh request storm (cache stampede phân tán). Đo hit ratio theo edge."
            - paragraph [ref=f81e1024]:
              - text: "Liên quan:"
              - link "Stale-while-revalidate" [ref=f81e1025] [cursor=pointer]:
                - /url: "#stale-while-revalidate"
              - text: ", Cache stampede,"
              - link "TTFB" [ref=f81e1026] [cursor=pointer]:
                - /url: "#ttfb"
          - article [ref=f81e1027]:
            - heading "Debounce & throttle" [level=4] [ref=f81e1028]
            - paragraph [ref=f81e1029]: "còn gọi: debounce, throttle, giới hạn tần suất event, Debounce / Throttle (backend context), chống rung, xử lý dồn, rate-limit theo thời gian"
            - paragraph [ref=f81e1030]:
              - generic [ref=f81e1031]: Vấn đề
              - text: User gõ nhanh mỗi phím bắn 1 request gợi ý → server nhận 10 request/giây cho 1 truy vấn thật, phần lớn bị bỏ phí (và có thể bị rate limit chính mình). Webhook Stripe/GitHub bắn 50 event trùng trong 2 giây mà mỗi event đều trigger recompute báo cáo thì backend tốn 50 lần tính việc chỉ cần làm 1 lần; hoặc client bấm double-submit tạo 2 đơn hàng.
            - paragraph [ref=f81e1032]:
              - generic [ref=f81e1033]: Giải pháp
              - text: "Debounce: chỉ fire sau khi sự kiện dừng một khoảng (gõ xong mới gọi API). Throttle: fire tối đa 1 lần mỗi N ms (cố định tần suất). Áp dụng cả hai phía: client giảm request, server endpoint tìm kiếm có thể debounce/queue nội bộ. Đây là rate shaping ở mức độ trễ-micro. Debounce: chỉ xử lý khi im lặng đủ N ms (dồn event lại thành 1). Throttle: cho phép tối đa N lần xử lý trong cửa sổ thời gian. Ở backend còn là rate limiting theo token bucket cho API — cả hai giảm tải và chống duplicate work."
            - paragraph [ref=f81e1034]:
              - text: "Liên quan: Rate shaping,"
              - link "Backpressure" [ref=f81e1035] [cursor=pointer]:
                - /url: "#backpressure"
              - text: ", Debounced search,"
              - link "Batching" [ref=f81e1036] [cursor=pointer]:
                - /url: "#batching"
              - text: ", QPS"
          - article [ref=f81e1037]:
            - heading "DNS lookup cost" [level=4] [ref=f81e1038]
            - paragraph [ref=f81e1039]: "còn gọi: DNS resolution, resolve time, DNS TTL"
            - paragraph [ref=f81e1040]:
              - generic [ref=f81e1041]: Vấn đề
              - text: Mỗi cold request chịu 1-2 lần DNS query hàng chục-hàng trăm ms (đặc biệt mobile/3G hoặc resolver chậm), và TTL thấp làm re-resolve thường xuyên.
            - paragraph [ref=f81e1042]:
              - generic [ref=f81e1043]: Giải pháp
              - text: "Hạ tầng DNS: recursive resolver cache theo TTL; hạ TTL trước khi migrate. Ứng dụng: connection pooling giữ socket sống (không phải resolve lại), happy eyeballs IPv6/IPv4 song song, DNS-over-HTTPS/TCP có chi phí riêng. Đo riêng component DNS trong waterfall."
            - paragraph [ref=f81e1044]:
              - text: "Liên quan:"
              - link "Keep-alive" [ref=f81e1045] [cursor=pointer]:
                - /url: "#keep-alive"
              - text: ","
              - link "TTFB" [ref=f81e1046] [cursor=pointer]:
                - /url: "#ttfb"
              - text: ", Latency numbers"
          - article [ref=f81e1047]:
            - heading "FCP / LCP (web vitals backend liên quan)" [level=4] [ref=f81e1048]
            - paragraph [ref=f81e1049]: "còn gọi: First Contentful Paint, Largest Contentful Paint, Core Web Vitals"
            - paragraph [ref=f81e1050]:
              - generic [ref=f81e1051]: Vấn đề
              - text: LCP 4s trên mobile do HTML render-blocking + ảnh hero không nén + API blockmàn hình đầu — số liệu UX này quyết định SEO/ranking nhưng dev backend thường không nhìn.
            - paragraph [ref=f81e1052]:
              - generic [ref=f81e1053]: Nguồn gốc
              - text: FCP đến từ cộng đồng W3C Web Performance; LCP do nhóm Chrome/Google giới thiệu ~2019, chuẩn hóa trong Core Web Vitals (web.dev, 2020)
            - paragraph [ref=f81e1054]:
              - generic [ref=f81e1055]: Giải pháp
              - text: "FCP: thời điểm pixel đầu tiên có nội dung xuất hiện. LCP: thời điểm phần tử lớn nhất (hero ảnh/title) hoàn tất. Backend ảnh hưởng qua: TTFB, server-rendered HTML, CDN cache hit, payload ảnh/API blocking. Ngân sách: LCP < 2.5s ở p75, TTFB mục tiêu < 800ms."
            - paragraph [ref=f81e1056]:
              - text: "Liên quan:"
              - link "TTFB" [ref=f81e1057] [cursor=pointer]:
                - /url: "#ttfb"
              - text: ", Performance budget,"
              - link "CDN edge caching" [ref=f81e1058] [cursor=pointer]:
                - /url: "#cdn-edge-caching"
          - article [ref=f81e1059]:
            - heading "Gustafson's law" [level=4] [ref=f81e1060]
            - paragraph [ref=f81e1061]: "còn gọi: định luật Gustafson, Gustafson-Barsis"
            - paragraph [ref=f81e1062]:
              - generic [ref=f81e1063]: Vấn đề
              - text: Amdahl's law dùng workload cố định nên có vẻ 'song song vô dụng', trong khi thực tế người dùng luôn tăng quy mô bài toán khi có thêm tài nguyên.
            - paragraph [ref=f81e1064]:
              - generic [ref=f81e1065]: Nguồn gốc
              - text: John L. Gustafson & Edwin H. Barsis, bài 'Reevaluating Amdahl's Law', 1988
            - paragraph [ref=f81e1066]:
              - generic [ref=f81e1067]: Giải pháp
              - text: "Speedup = n - (1-n)·s (với s là fraction tuần tự của bản tuần tự, n số core): workload mới = phần song song mở rộng + phần tuần tự giữ nguyên. Phản đề thực tế của Amdahl: câu hỏi đúng là 'có thêm tài nguyên thì giải được bài toán lớn đến đâu', không chỉ 'bài cũ nhanh bao nhiêu'."
            - paragraph [ref=f81e1068]:
              - text: "Liên quan:"
              - link "Amdahl's law" [ref=f81e1069] [cursor=pointer]:
                - /url: "#amdahl-s-law"
              - text: ","
              - link "Capacity planning" [ref=f81e1070] [cursor=pointer]:
                - /url: "#capacity-planning"
          - article [ref=f81e1071]:
            - heading "HTTP keep-alive" [level=4] [ref=f81e1072]
            - paragraph [ref=f81e1073]: "còn gọi: persistent connection, TCP connection reuse, HTTP connection reuse"
            - paragraph [ref=f81e1074]:
              - generic [ref=f81e1075]: Vấn đề
              - text: Mỗi ảnh/JS/CSS lại mở một TCP+TLS handshake (vài trăm ms) nên trang 50 tài nguyên mất vài giây chỉ để 'chào hỏi', trong khi server tốn thời gian accept/teardown.
            - paragraph [ref=f81e1076]:
              - generic [ref=f81e1077]: Nguồn gốc
              - text: Mặc định từ HTTP/1.1 (RFC 2068/7230, Fielding và cộng sự, 1997)
            - paragraph [ref=f81e1078]:
              - generic [ref=f81e1079]: Giải pháp
              - text: "Giữ socket TCP mở sau response để request tiếp theo dùng lại, bỏ đi 1-3 round trip (SYN, TLS) mỗi tài nguyên. Cấu hình: keep-alive timeout, max requests per connection, connection pool phía client (pool size cân bằng với số kết nối server chịu nổi)."
            - paragraph [ref=f81e1080]:
              - text: "Liên quan: Connection pool vs new connection, TLS handshake cost,"
              - link "HTTP/2 multiplexing" [ref=f81e1081] [cursor=pointer]:
                - /url: "#http-2-multiplexing"
          - article [ref=f81e1082]:
            - heading "Latency numbers every programmer should know" [level=4] [ref=f81e1083]
            - paragraph [ref=f81e1084]: "còn gọi: bảng số độ trễ, 100ns/1ms/10ms, Jeff Dean latency table"
            - paragraph [ref=f81e1085]:
              - generic [ref=f81e1086]: Vấn đề
              - text: "Dev viết code gọi network call cho việc có thể làm bằng RAM cache vì không có 'intuition' về thứ tự độ lớn: 100ns với 10ms chênh 100.000 lần nhưng trong đầu người viết chỉ là 'cũng nhanh thôi'."
            - paragraph [ref=f81e1087]:
              - generic [ref=f81e1088]: Nguồn gốc
              - text: Bảng số của Jeff Dean (Google) trong các talk (~2002-2009); bản tương tác phổ biến của Colin Scott; nhiều bản cập nhật sau này
            - paragraph [ref=f81e1089]:
              - generic [ref=f81e1090]: Giải pháp
              - text: "Tham chiếu thứ tự độ lớn: ~1ns đọc cache L1, ~100ns đọc RAM / cache L3, ~1ms network RTT cùng trung tâm dữ liệu, ~10-40ms RTT xuyên lục địa, ~10ms đọc SSD, ~100ms-10s đọc HDD/seek. Dùng làm quy tắc ngón tay trước khi quyết định thêm một hop mạng hoặc một lần đọc đĩa."
            - paragraph [ref=f81e1091]:
              - text: "Liên quan: Speed of light RTT, Cache locality,"
              - link "Bandwidth vs latency" [ref=f81e1092] [cursor=pointer]:
                - /url: "#bandwidth-vs-latency"
          - article [ref=f81e1093]:
            - heading "Lazy vs eager loading / lazy evaluation" [level=4] [ref=f81e1094]
            - paragraph [ref=f81e1095]: "còn gọi: trễ trễ, deferred evaluation, call-by-need, eager loading"
            - paragraph [ref=f81e1096]:
              - generic [ref=f81e1097]: Vấn đề
              - text: "Eager: render trang list 1000 phần tử gán mọi relation dù 90% không hiển thị → query thừa. Lazy ngược lại: mỗi phần tử hiển thị lại query 1 lần → N+1. Cả hai cực đoan đều sai."
            - paragraph [ref=f81e1098]:
              - generic [ref=f81e1099]: Nguồn gốc
              - text: Lazy evaluation (call-by-need) là chủ đề học thuật PL từ thập niên 1970
            - paragraph [ref=f81e1100]:
              - generic [ref=f81e1101]: Giải pháp
              - text: "Lazy hoãn tính đến khi giá trị cần (giảm work thừa, thêm độ trễ lần đầu + complexity); eager tính ngay (dễ dự đoán, trả giá trước). Trong backend: lazy load relation theo trang, nhưng eager theo batch cho list; pagination + virtual list; dùng projection select đúng cột."
            - paragraph [ref=f81e1102]:
              - text: "Liên quan:"
              - link "N+1 query" [ref=f81e1103] [cursor=pointer]:
                - /url: "#n-1-query"
              - text: ","
              - link "Memoization" [ref=f81e1104] [cursor=pointer]:
                - /url: "#memoization"
              - text: ", Pagination cost"
          - article [ref=f81e1105]:
            - heading "Memoization" [level=4] [ref=f81e1106]
            - paragraph [ref=f81e1107]: "còn gọi: ghi nhớ kết quả, memoise, function result cache, ghi nhớ kết quả hàm"
            - paragraph [ref=f81e1108]:
              - generic [ref=f81e1109]: Vấn đề
              - text: Hàm đệ quy tính lại Fibonacci/parse config/validate token hàng nghìn lần với cùng input — CPU đốt cho việc đã từng tính rồi.
            - paragraph [ref=f81e1110]:
              - generic [ref=f81e1111]: Nguồn gốc
              - text: Thuật ngữ do Donald Michie đặt năm 1968 (từ tiếng Hy Lạp 'memorikos')
            - paragraph [ref=f81e1112]:
              - generic [ref=f81e1113]: Giải pháp
              - text: "Hash map input → kết quả, lần gọi sau trả thẳng (trade time lấy space). Yêu cầu hàm thuần (cùng input → cùng output) và key hash ổn định; cần TTL/invalidation nếu dữ liệu nền thay đổi. Kết hợp cache-control: LRU cho kích thước, per-key lock chống stampede khi compute đắt."
            - paragraph [ref=f81e1114]:
              - text: "Liên quan:"
              - link "Cache hit ratio" [ref=f81e1115] [cursor=pointer]:
                - /url: "#cache-hit-ratio"
              - text: ", Lazy evaluation, Cache stampede,"
              - link "Cache" [ref=f81e1116] [cursor=pointer]:
                - /url: "#cache"
              - text: ","
              - link "Precomputation" [ref=f81e1117] [cursor=pointer]:
                - /url: "#precomputation"
              - text: ","
              - link "Materialized view" [ref=f81e1118] [cursor=pointer]:
                - /url: "#materialized-view"
          - article [ref=f81e1119]:
            - heading "N+1 query" [level=4] [ref=f81e1120]
            - paragraph [ref=f81e1121]: "còn gọi: n+1 problem, truy vấn N+1, chậm vì lặp query"
            - paragraph [ref=f81e1122]:
              - generic [ref=f81e1123]: Vấn đề
              - text: "Danh sách 50 sản phẩm render chậm 2 giây vì code hỏi DB 51 lần: 1 lần lấy list + 50 lần hỏi category từng cái — ORM eager/lazy sai chỗ, QPS DB phình 50x."
            - paragraph [ref=f81e1124]:
              - generic [ref=f81e1125]: Giải pháp
              - text: "Lặp query trong vòng lặp (hoặc lazy-load mỗi phần tử). Fix: JOIN/include prefetch trọn quan hệ, hoặc batch theo id (WHERE id IN (...)), gộp thành map cache. Phát hiện bằng log query + đếm số statement/request, EXPLAIN, pg_stat_statements."
            - paragraph [ref=f81e1126]:
              - text: "Liên quan: Query batching (IN/bulk), Fan-out,"
              - link "Prefetch" [ref=f81e1127] [cursor=pointer]:
                - /url: "#prefetch"
          - article [ref=f81e1128]:
            - heading "Performance budget & SLO-driven optimization" [level=4] [ref=f81e1129]
            - paragraph [ref=f81e1130]: "còn gọi: performance budget, SLO, error budget, service level objective, budget hiệu năng"
            - paragraph [ref=f81e1131]:
              - generic [ref=f81e1132]: Vấn đề
              - text: Không ai đặt ngưỡng 'được phép chậm bao nhiêu' nên mỗi lần regression chỉ phát hiện khi khách khiếu nại; tối ưu lan man vì thiếu tiêu chí 'đủ rồi'.
            - paragraph [ref=f81e1133]:
              - generic [ref=f81e1134]: Nguồn gốc
              - text: SLO/error budget được hệ thống hóa trong Google SRE Book (2016); performance budget là pratique cộng đồng web performance
            - paragraph [ref=f81e1135]:
              - generic [ref=f81e1136]: Giải pháp
              - text: "Performance budget: ngưỡng cứng cho metric (LCP < 2.5s, API p99 < 300ms, bundle < 200KB) — vượt là gate CI/PR. SLO = mục tiêu độ tin cậy (99.9% requests < 300ms/tháng); error budget = phần được phép fail, còi báo khi burn quá nhanh. Tối ưu theo budget/SLO, không theo cảm tính."
            - paragraph [ref=f81e1137]:
              - text: "Liên quan: SLO-driven optimization, Regression detection in benchmarks,"
              - link "Tail latency" [ref=f81e1138] [cursor=pointer]:
                - /url: "#tail-latency"
          - article [ref=f81e1139]:
            - heading "Phân vị trung vị và phần trăm (p50/p95/p99)" [level=4] [ref=f81e1140]
            - paragraph [ref=f81e1141]: "còn gọi: percentile latency, median latency, average vs percentile"
            - paragraph [ref=f81e1142]:
              - generic [ref=f81e1143]: Vấn đề
              - text: "Trung bình (mean) nói dối: 99 request nhanh 10ms + 1 request chậm 10s cho mean ~110ms,trông như đạt SLO trong khi 1% user chờ 10 giây."
            - paragraph [ref=f81e1144]:
              - generic [ref=f81e1145]: Giải pháp
              - text: Chia toàn bộ mẫu latency đã sắp xếp vào 100 phần, p50 = nửa dưới nhanh hơn, p99 = ngưỡng chỉ 1% mẫu vượt qua. Mean dễ tính nhưng bị outlier chi phối; p50 mô tả 'người dùng trung bình', p95/p99 mô tả nhóm kém may mắn — nhóm hay rời bỏ sản phẩm.
            - paragraph [ref=f81e1146]:
              - text: "Liên quan:"
              - link "Tail latency" [ref=f81e1147] [cursor=pointer]:
                - /url: "#tail-latency"
              - text: ", Latency histogram,"
              - link "Coordinated omission" [ref=f81e1148] [cursor=pointer]:
                - /url: "#coordinated-omission"
          - article [ref=f81e1149]:
            - heading "Query batching (IN / bulk)" [level=4] [ref=f81e1150]
            - paragraph [ref=f81e1151]: "còn gọi: batch query, whereIn, bulk insert, batch insert"
            - paragraph [ref=f81e1152]:
              - generic [ref=f81e1153]: Vấn đề
              - text: Ghi 1.000 dòng mỗi dòng một INSERT trong 1 transaction riêng → 1.000 round trip mạng và fsync, mất hàng chục giây.
            - paragraph [ref=f81e1154]:
              - generic [ref=f81e1155]: Giải pháp
              - text: "Gộp N câu thành một: INSERT multi-values, SELECT ... WHERE id IN (n,...), bulk update qua VALUES join (PostgreSQL). Cần trần batch (vd 500-1000 id/query) tránh packet size limit và plan xấu. Tradeoff: SQL dài hơn, parameter limits (SQLite 999), lock giữ lâu hơn."
            - paragraph [ref=f81e1156]:
              - text: "Liên quan:"
              - link "N+1 query" [ref=f81e1157] [cursor=pointer]:
                - /url: "#n-1-query"
              - text: ", Syscall batching, Fan-out"
          - article [ref=f81e1158]:
            - heading "Speed of light & network RTT" [level=4] [ref=f81e1159]
            - paragraph [ref=f81e1160]: "còn gọi: độ trễ tốc độ ánh sáng, round-trip time, cross-country latency"
            - paragraph [ref=f81e1161]:
              - generic [ref=f81e1162]: Vấn đề
              - text: "Kế hoạch 'gọi service ở datacenter bên kia quả đất cho mỗi request' thất bại vì không phần mềm nào nhanh hơn tín hiệu đi qua cáp quang: mỗi round trip thêm hàng chục ms bất kể code tối ưu thế nào."
            - paragraph [ref=f81e1163]:
              - generic [ref=f81e1164]: Giải pháp
              - text: Tín hiệu trong cáp quang ~200.000 km/s (≈2/3 tốc độ ánh sáng), nên RTT TP.HCM–Hoa Kỳ thực tế ~150-250ms kể cả không nghẽn. Tổng latency request ≈ (số round trip) × RTT + thời gian xử lý. Giảm số round trip (batch, pipeline, cache) thường thắng việc tối ưu vài dòng code.
            - paragraph [ref=f81e1165]:
              - text: "Liên quan: Latency numbers,"
              - link "Bandwidth vs latency" [ref=f81e1166] [cursor=pointer]:
                - /url: "#bandwidth-vs-latency"
              - text: ", TLS handshake cost"
          - article [ref=f81e1167]:
            - heading "TTFB (Time To First Byte)" [level=4] [ref=f81e1168]
            - paragraph [ref=f81e1169]: "còn gọi: time to first byte, thời gian đến byte đầu"
            - paragraph [ref=f81e1170]:
              - generic [ref=f81e1171]: Vấn đề
              - text: "TTFB 2s dù transfer chỉ 20KB: vấn đề nằm ở phía server (DNS, TLS, xử lý, block I/O) chứ không phải bandwidth — nhưng dev lại đi tối ưu nén ảnh."
            - paragraph [ref=f81e1172]:
              - generic [ref=f81e1173]: Giải pháp
              - text: TTFB = thời gian từ request bắt đầu đến byte đầu của response về (gồm DNS + TCP + TLS + server processing + network). TTFB cao → nghi server/DB/queue; TTFB thấp mà LCP chậm → nghi payload/render. Phân tách bằng watermark DevTools (DNS/connect/TLS/wait).
            - paragraph [ref=f81e1174]:
              - text: "Liên quan:"
              - link "DNS lookup cost" [ref=f81e1175] [cursor=pointer]:
                - /url: "#dns-lookup-cost"
              - text: ", TLS handshake cost, FCP/LCP"
        - generic [ref=f81e1176]:
          - heading "Phân tán & Đồng thời 7" [level=3] [ref=f81e1177]:
            - text: Phân tán & Đồng thời
            - generic [ref=f81e1178]: "7"
          - article [ref=f81e1179]:
            - heading "Async/await" [level=4] [ref=f81e1180]
            - paragraph [ref=f81e1181]: "còn gọi: callback hell, pyramid of doom, lồng callback"
            - paragraph [ref=f81e1182]:
              - generic [ref=f81e1183]: Vấn đề
              - text: Code Node.js lồng 5 cấp callback (đọc file → duyệt danh sách → xử lý → ghi → báo lỗi) thành kim tự tháp — lỗi phải bắt riêng ở từng tầng, muốn retry/điều phối gần như không viết nổi; developer gọi là callback hell.
            - paragraph [ref=f81e1184]:
              - generic [ref=f81e1185]: Nguồn gốc
              - text: F# 2007 → C# 5.0 (2012) → Python 3.5/PEP 492 (2015) → JavaScript (ES2017).
            - paragraph [ref=f81e1186]:
              - generic [ref=f81e1187]: Giải pháp
              - text: Khai báo hàm async rồi 'await' kết quả; trình biên dịch chuyển thành state machine/continuation, code đọc tuyến tính như đồng bộ nhưng không block thread. Khi await, trạng thái dùng chung vẫn có thể đổi — vẫn phải phòng race.
            - paragraph [ref=f81e1188]:
              - text: "Liên quan: Callback hell,"
              - link "Event loop" [ref=f81e1189] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ","
              - link "Race condition" [ref=f81e1190] [cursor=pointer]:
                - /url: "#race-condition"
          - article [ref=f81e1191]:
            - heading "Concurrency vs Parallelism" [level=4] [ref=f81e1192]
            - paragraph [ref=f81e1193]: "còn gọi: đồng thời, song song, concurrency, parallelism"
            - paragraph [ref=f81e1194]:
              - generic [ref=f81e1195]: Vấn đề
              - text: "Team hay nhầm lẫn: thêm async/timer đã tưởng là 'có parallel', hoặc ngược lại máy 8 core nhưng code toàn chặn chờ I/O nên 1 core cũng không dùng hết. Hiểu sai dẫn đến tối ưu sai chỗ — thêm thread không cứu được bottleneck đang là network I/O."
            - paragraph [ref=f81e1196]:
              - generic [ref=f81e1197]: Nguồn gốc
              - text: Phân biệt được làm rành mạch trong talk của Rob Pike, 'Concurrency is not Parallelism' (Waza, 11/01/2012); học thuật về concurrent algorithm bắt đầu từ bài của Dijkstra 1965.
            - paragraph [ref=f81e1198]:
              - generic [ref=f81e1199]: Giải pháp
              - text: Concurrency là nhiều task chồng lên nhau trong cùng một khoảng thời gian (có thể lần lượt trên 1 core, phục vụ điều phối I/O); Parallelism là chạy thực sự đồng thời trên nhiều core (phục vụ tính toán). Mục tiêu khác nhau nên công cụ cũng khác.
            - paragraph [ref=f81e1200]:
              - text: "Liên quan:"
              - link "Event loop" [ref=f81e1201] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ", Thread,"
              - link "Process vs Thread" [ref=f81e1202] [cursor=pointer]:
                - /url: "#process-vs-thread"
          - article [ref=f81e1203]:
            - heading "Deadlock" [level=4] [ref=f81e1204]
            - paragraph [ref=f81e1205]: "còn gọi: chết lock, treo, bế tắc"
            - paragraph [ref=f81e1206]:
              - generic [ref=f81e1207]: Vấn đề
              - text: "Hai thread giữ hai mutex theo thứ tự ngược nhau (A→B và B→A) rồi cùng chờ vô hạn; hoặc DB: T1 lock dòng 1 rồi chờ dòng 2, T2 lock dòng 2 rồi chờ dòng 1 — toàn bộ request kẹt cứng, service treo mà không crash để báo lỗi."
            - paragraph [ref=f81e1208]:
              - generic [ref=f81e1209]: Nguồn gốc
              - text: Bốn điều kiện cần (mutual exclusion, hold-and-wait, no preemption, circular wait) do Coffman, Elphick & Shoshani mô tả năm 1971 ('System Deadlocks', ACM Computing Surveys).
            - paragraph [ref=f81e1210]:
              - generic [ref=f81e1211]: Giải pháp
              - text: "Phá ít nhất một trong 4 điều kiện Coffman: thứ tự khóa thống nhất toàn hệ thống, hoặc cho phép chiếm lại khóa qua timeout (nhưng timeout phải có thiết kế compensating)."
            - paragraph [ref=f81e1212]:
              - text: "Liên quan:"
              - link "Mutex & Semaphore" [ref=f81e1213] [cursor=pointer]:
                - /url: "#mutex-semaphore"
              - text: ","
              - link "Starvation & livelock" [ref=f81e1214] [cursor=pointer]:
                - /url: "#starvation-livelock"
              - text: ","
              - link "Race condition" [ref=f81e1215] [cursor=pointer]:
                - /url: "#race-condition"
          - article [ref=f81e1216]:
            - heading "Event loop" [level=4] [ref=f81e1217]
            - paragraph [ref=f81e1218]: "còn gọi: vòng lặp sự kiện, single-threaded event loop, lõi sự kiện Node/Nginx"
            - paragraph [ref=f81e1219]:
              - generic [ref=f81e1220]: Vấn đề
              - text: Mỗi kết nối HTTP mà một thread riêng thì 10.000 kết nối tốn cả GB RAM và kernel tốn công context switch; trong khi đo ra thì 99% thời gian request đang chờ socket/disk, không hề dùng CPU — block một thread chỉ vì chờ I/O là lãng phí.
            - paragraph [ref=f81e1221]:
              - generic [ref=f81e1222]: Nguồn gốc
              - text: "không rõ (mẫu được tự phát minh ở nhiều nơi: select()/poll() của Unix, message loop của Windows)."
            - paragraph [ref=f81e1223]:
              - generic [ref=f81e1224]: Giải pháp
              - text: Một vòng lặp duy nhất poll sự kiện (socket có dữ liệu, timer hết giờ) rồi gọi handler tương ứng — không bao giờ chờ I/O blocking nên 1 thread vẫn phục vụ hàng vạn kết nối (mô hình Node.js, nginx worker).
            - paragraph [ref=f81e1225]:
              - text: "Liên quan:"
              - link "Async/await" [ref=f81e1226] [cursor=pointer]:
                - /url: "#async-await"
              - text: ", Callback hell,"
              - link "Thread pool & pool exhaustion" [ref=f81e1227] [cursor=pointer]:
                - /url: "#thread-pool-pool-exhaustion"
              - text: ","
              - link "Reactor pattern" [ref=f81e1228] [cursor=pointer]:
                - /url: "#reactor-pattern"
              - text: ","
              - link "epoll" [ref=f81e1229] [cursor=pointer]:
                - /url: "#epoll"
              - text: ","
              - link "Non-blocking I/O" [ref=f81e1230] [cursor=pointer]:
                - /url: "#non-blocking-i-o"
          - article [ref=f81e1231]:
            - heading "Mutex & Semaphore" [level=4] [ref=f81e1232]
            - paragraph [ref=f81e1233]: "còn gọi: khóa tương hỗ, mutual exclusion, semaphore, P/V"
            - paragraph [ref=f81e1234]:
              - generic [ref=f81e1235]: Vấn đề
              - text: Nhiều thread cùng ghi biến đếm/đẩy phần tử vào mảng chung làm mất dữ liệu (race condition); song có lúc cần cho phép tối đa N thread cùng vào một resource (pool kết nối) chứ không phải chỉ đúng 1 — spinlock busy-wait thì phung phí CPU.
            - paragraph [ref=f81e1236]:
              - generic [ref=f81e1237]: Nguồn gốc
              - text: Semaphore do Dijkstra phát minh 1962-1963 với thao tác P/V trên máy Electrologica X8; bài 'Solution of a problem in concurrent programming control' của Dijkstra (1965) đặt nền cho mutual exclusion.
            - paragraph [ref=f81e1238]:
              - generic [ref=f81e1239]: Giải pháp
              - text: Mutex cho chỉ một thread sở hữu critical section tại một thời điểm; semaphore đếm số lượt vào — thao tác P/trừ chặn khi hết lượt, V/cộng giải thread đang chờ. OS chuyển thread sang chờ thay vì quay vòng.
            - paragraph [ref=f81e1240]:
              - text: "Liên quan:"
              - link "Race condition" [ref=f81e1241] [cursor=pointer]:
                - /url: "#race-condition"
              - text: ","
              - link "Deadlock" [ref=f81e1242] [cursor=pointer]:
                - /url: "#deadlock"
              - text: ","
              - link "Atomic operation & CAS" [ref=f81e1243] [cursor=pointer]:
                - /url: "#atomic-operation-cas"
          - article [ref=f81e1244]:
            - heading "Process vs Thread" [level=4] [ref=f81e1245]
            - paragraph [ref=f81e1246]: "còn gọi: process, thread, tiến trình, luồng"
            - paragraph [ref=f81e1247]:
              - generic [ref=f81e1248]: Vấn đề
              - text: "Server xử lý nhiều request cùng lúc nhưng chạy tuần tự thì request sau phải đợi request trước, nhất là khi chờ đọc DB/network (I/O chậm) trong khi CPU thì rảnh. Người viết server phải tự chia chương trình thành các đơn vị chạy song song, và câu hỏi đầu tiên là: tách bộ nhớ (process) hay dùng chung heap (thread)?"
            - paragraph [ref=f81e1249]:
              - generic [ref=f81e1250]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1251]:
              - generic [ref=f81e1252]: Giải pháp
              - text: Process có không gian địa chỉ riêng, nặng, cách ly mạnh; thread chia sẻ bộ nhớ của process, nhẹ hơn nhưng phải tự xử lý race condition khi truy cập dữ liệu chung. Chọn theo mức cách ly và chi phí giao tiếp cần có.
            - paragraph [ref=f81e1253]:
              - text: "Liên quan:"
              - link "Concurrency vs Parallelism" [ref=f81e1254] [cursor=pointer]:
                - /url: "#concurrency-vs-parallelism"
              - text: ","
              - link "Mutex & Semaphore" [ref=f81e1255] [cursor=pointer]:
                - /url: "#mutex-semaphore"
              - text: ","
              - link "Race condition" [ref=f81e1256] [cursor=pointer]:
                - /url: "#race-condition"
          - article [ref=f81e1257]:
            - heading "Race condition" [level=4] [ref=f81e1258]
            - paragraph [ref=f81e1259]: "còn gọi: điều kiện tranh chấp, data race, race"
            - paragraph [ref=f81e1260]:
              - generic [ref=f81e1261]: Vấn đề
              - text: "Hai request đồng thời đọc số dư 100k, mỗi bên cộng thêm 50k rồi ghi — kết quả là 150k thay vì 200k; hoặc hai thread cùng sửa linked list làm hỏng cấu trúc. Đáng sợ hơn: lỗi chỉ xuất hiện tùy timing nên 'test local vẫn pass, production thi thoảng mất tiền'."
            - paragraph [ref=f81e1262]:
              - generic [ref=f81e1263]: Nguồn gốc
              - text: không rõ (khái niệm đi cùng văn học hệ điều hành đầu thập niên 1960).
            - paragraph [ref=f81e1264]:
              - generic [ref=f81e1265]: Giải pháp
              - text: "Loại bỏ sự bất định thứ tự thực thi: đưa thao tác đọc-ghi vào critical section bằng mutex, dùng biến nguyên tử/CAS, hoặc thiết kế để mỗi dữ liệu chỉ có một chủ sở hữu (actor/message queue)."
            - paragraph [ref=f81e1266]:
              - text: "Liên quan:"
              - link "Mutex & Semaphore" [ref=f81e1267] [cursor=pointer]:
                - /url: "#mutex-semaphore"
