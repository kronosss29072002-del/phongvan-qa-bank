    - main [ref=f81e197]:
      - generic [ref=f81e198]:
        - generic [ref=f81e199]:
          - paragraph [ref=f81e200]: Phần 1
          - heading "Nền tảng" [level=2] [ref=f81e201]
          - paragraph [ref=f81e202]: Những khái niệm gặp ngay tuần đầu đi làm. Bỏ qua phần này thì mọi thứ phía trên xây trên cát.
          - paragraph [ref=f81e203]: 178 thuật ngữ · 13 chủ đề
        - generic [ref=f81e204]:
          - heading "Mạng & Giao thức 20" [level=3] [ref=f81e205]:
            - text: Mạng & Giao thức
            - generic [ref=f81e206]: "20"
          - article [ref=f81e207]:
            - heading "ARP" [level=4] [ref=f81e208]
            - paragraph [ref=f81e209]: "còn gọi: Address Resolution Protocol"
            - paragraph [ref=f81e210]:
              - generic [ref=f81e211]: Vấn đề
              - text: Ethernet truyền frame dựa trên địa chỉ MAC (địa chỉ phần cứng), nhưng ứng dụng/stack chỉ biết địa chỉ IP — không có cơ chế nào dịch IP sang MAC nên gói không thể đi được trong cùng một LAN; mỗi hệ điều hành sẽ lại tự nghĩ ra cách khác nhau.
            - paragraph [ref=f81e212]:
              - generic [ref=f81e213]: Nguồn gốc
              - text: RFC 826, David C. Plummer, 11/1982.
            - paragraph [ref=f81e214]:
              - generic [ref=f81e215]: Giải pháp
              - text: Máy broadcast ARP request 'ai có IP này báo lại địa chỉ MAC của mình', máy sở hữu trả lời, bảng ARP cache lại để các frame sau không phải hỏi lại.
            - paragraph [ref=f81e216]:
              - text: "Liên quan:"
              - link "IP" [ref=f81e217] [cursor=pointer]:
                - /url: "#ip"
              - text: ", MAC address,"
              - link "TCP" [ref=f81e218] [cursor=pointer]:
                - /url: "#tcp"
              - text: ", Subnet, Proxy"
          - article [ref=f81e219]:
            - heading "Context switch cost" [level=4] [ref=f81e220]
            - paragraph [ref=f81e221]: "còn gọi: chi phí đổi ngữ cảnh, tốn kém context switch"
            - paragraph [ref=f81e222]:
              - generic [ref=f81e223]: Vấn đề
              - text: Mỗi lần CPU chuyển từ tiến trình/thread này sang tiến trình khác, hệ điều phải lưu thanh ghi, cập nhật bảng bảng điều phối, và thường phải flush TLB + làm nhiễu cache CPU — sau đó gần như mọi tham chiếu bộ nhớ đều miss cho tới khi TLB nạp lại. Với 10.000 kết nối đang active, hàng nghìn context switch mỗi giây khiến phần lớn CPU mất vào 'việc nội bộ' thay vì phục vụ request; đây là lý do đo lường thực tế cho thấy thread-per-connection không scale dù RAM còn đủ.
            - paragraph [ref=f81e224]:
              - generic [ref=f81e225]: Nguồn gốc
              - text: không rõ (khái niệm tồn tại từ OS thời kỳ đầu; số liệu cụ thể tùy kiến trúc)
            - paragraph [ref=f81e226]:
              - generic [ref=f81e227]: Giải pháp
              - text: "Giảm số lần phải đổi ngữ cảnh: gom nhiều kết nối vào ít thread (event loop), hoặc dùng user-space thread (goroutine) vốn switch gần như rẻ như một lời gọi hàm vì không cần flush TLB."
            - paragraph [ref=f81e228]:
              - text: "Liên quan: Thread-per-connection,"
              - link "Non-blocking I/O" [ref=f81e229] [cursor=pointer]:
                - /url: "#non-blocking-i-o"
              - text: ","
              - link "Event loop" [ref=f81e230] [cursor=pointer]:
                - /url: "#event-loop"
          - article [ref=f81e231]:
            - heading "Cookie vs session token" [level=4] [ref=f81e232]
            - paragraph [ref=f81e233]: "còn gọi: HTTP cookie, session token, phiên làm việc"
            - paragraph [ref=f81e234]:
              - generic [ref=f81e235]: Vấn đề
              - text: "HTTP stateless: mỗi request là một sự kiện độc lập nên giỏ hàng biến mất khi chuyển trang — Netscape đang làm ứng dụng thương mại điện tử cho MCI năm 1994, và MCI không muốn server giữ trạng thái giao dịch dở dang cho hàng triệu client (tốn bộ nhớ, không scale)."
            - paragraph [ref=f81e236]:
              - generic [ref=f81e237]: Nguồn gốc
              - text: Lou Montulli, Netscape, 6/1994 (cookie); session token phía server phổ biến cùng thời với J2EE Servlet (1999) — mốc chính xác 'không rõ'.
            - paragraph [ref=f81e238]:
              - generic [ref=f81e239]: Giải pháp
              - text: "Cookie: server gửi kèm Set-Cookie chứa mã phiên, browser tự đính kèm nó vào mọi request sau — server nhận mã là biết ngay 'ai'. Session token: server giữ state thật ở RAM/Redis/DB theo mã đó; bản thân token có thể là JWT mang claims đã ký. 5 năm sau Servlet HttpSession (1999) chuẩn hóa khái niệm session phía server."
            - paragraph [ref=f81e240]:
              - text: "Liên quan:"
              - link "HTTP" [ref=f81e241] [cursor=pointer]:
                - /url: "#http"
              - text: ","
              - link "HTTPS" [ref=f81e242] [cursor=pointer]:
                - /url: "#https"
              - text: ","
              - link "JWT" [ref=f81e243] [cursor=pointer]:
                - /url: "#jwt"
              - text: ","
              - link "Cache" [ref=f81e244] [cursor=pointer]:
                - /url: "#cache"
              - text: ","
              - link "CORS" [ref=f81e245] [cursor=pointer]:
                - /url: "#cors"
          - article [ref=f81e246]:
            - heading "DNS" [level=4] [ref=f81e247]
            - paragraph [ref=f81e248]: "còn gọi: Domain Name System, hệ thống tên miền"
            - paragraph [ref=f81e249]:
              - generic [ref=f81e250]: Vấn đề
              - text: Trước 1983, SRI duy trì một file HOSTS.TXT duy nhất ánh xạ hostname↔IP, admin phải gọi điện thoại cho SRI NIC trong giờ hành chính để thêm máy mới — file tập trung đó chậm, phình to và trở thành nút cổ chai khi ARPANET lớn dần.
            - paragraph [ref=f81e251]:
              - generic [ref=f81e252]: Nguồn gốc
              - text: Paul Mockapetris, USC/ISI, 1983 (RFC 882/883); chuẩn hóa lại RFC 1034/1035 (1987).
            - paragraph [ref=f81e253]:
              - generic [ref=f81e254]: Giải pháp
              - text: Phân cấp tên miền xuống các zone ủy quyền cho name server riêng; resolver hỏi đệ quy hoặc trả lời từ cache (TTL), cuối cùng trả về IP — không còn một file duy nhất làm mọi thứ.
            - paragraph [ref=f81e255]:
              - text: "Liên quan:"
              - link "IP" [ref=f81e256] [cursor=pointer]:
                - /url: "#ip"
              - text: ","
              - link "TTFB" [ref=f81e257] [cursor=pointer]:
                - /url: "#ttfb"
              - text: ","
              - link "CDN" [ref=f81e258] [cursor=pointer]:
                - /url: "#cdn"
              - text: ","
              - link "Cache" [ref=f81e259] [cursor=pointer]:
                - /url: "#cache"
              - text: ","
              - link "UDP" [ref=f81e260] [cursor=pointer]:
                - /url: "#udp"
          - article [ref=f81e261]:
            - heading "DNS resolution chain" [level=4] [ref=f81e262]
            - paragraph [ref=f81e263]: "còn gọi: chuỗi phân giải DNS, recursive resolver, stub resolver"
            - paragraph [ref=f81e264]:
              - generic [ref=f81e265]: Vấn đề
              - text: Trước khi request HTTP đầu tiên rời khỏi máy, client phải dịch 'api.example.com' thành IP — nếu mỗi trình ứng dụng tự tra từ đầu (hỏi root → TLD → authoritative) thì mỗi lần mở trang mất thêm vài trăm ms độ trễ và Internet phải gánh lượng query khổng lồ lặp đi lặp lại. Chuỗi phân giải (stub → recursive resolver → root/TLD/authoritative) ra đời để gom việc tra cứu vào một chỗ.
            - paragraph [ref=f81e266]:
              - generic [ref=f81e267]: Nguồn gốc
              - text: Paul Mockapetris, 1983 (USC ISI); RFC 882/883 (11/1983), chuẩn hóa lại bởi RFC 1034/1035 (11/1987)
            - paragraph [ref=f81e268]:
              - generic [ref=f81e269]: Giải pháp
              - text: Stub resolver cục bộ gửi 1 câu hỏi cho recursive resolver (thường của ISP); resolver này tự hỏi root, rồi server TLD (.com), rồi authoritative server của domain, trả lời cho client và cache kết quả theo TTL.
            - paragraph [ref=f81e270]:
              - text: "Liên quan:"
              - link "DNS TTL caching" [ref=f81e271] [cursor=pointer]:
                - /url: "#dns-ttl-caching"
              - text: ","
              - link "DNS negative caching" [ref=f81e272] [cursor=pointer]:
                - /url: "#dns-negative-caching"
              - text: ","
              - link "CDN cache key" [ref=f81e273] [cursor=pointer]:
                - /url: "#cdn-cache-key"
          - article [ref=f81e274]:
            - heading "DNS TTL caching" [level=4] [ref=f81e275]
            - paragraph [ref=f81e276]: "còn gọi: Time To Live DNS, cache DNS"
            - paragraph [ref=f81e277]:
              - generic [ref=f81e278]: Vấn đề
              - text: Nếu mỗi lần phân giải đều phải hỏi hết root → TLD → authoritative thì độ trễ cộng dồn và các root server sẽ bị nhấn chìm bởi hàng tỷ query lặp lại mỗi ngày. Trước khi có TTL cache, 'mọi phân giải trên Internet đều bắt đầu từ root' — không bền.
            - paragraph [ref=f81e279]:
              - generic [ref=f81e280]: Nguồn gốc
              - text: Paul Mockapetris, 1983; TTL có từ thiết kế DNS ban đầu (RFC 1034/1035)
            - paragraph [ref=f81e281]:
              - generic [ref=f81e282]: Giải pháp
              - text: Recursive resolver lưu kết quả theo TTL (do chủ zone đặt, thường vài phút tới vài ngày); truy vấn lặp lại trả lời ngay từ bộ nhớ. TTL hết hạn thì tra lại, nên đổi DNS không mất quá lâu để lan ra toàn cầu.
            - paragraph [ref=f81e283]:
              - text: "Liên quan:"
              - link "DNS resolution chain" [ref=f81e284] [cursor=pointer]:
                - /url: "#dns-resolution-chain"
              - text: ","
              - link "DNS negative caching" [ref=f81e285] [cursor=pointer]:
                - /url: "#dns-negative-caching"
          - article [ref=f81e286]:
            - heading "ETag / conditional requests (If-None-Match → 304)" [level=4] [ref=f81e287]
            - paragraph [ref=f81e288]: "còn gọi: revalidate cache, 304 Not Modified"
            - paragraph [ref=f81e289]:
              - generic [ref=f81e290]: Vấn đề
              - text: Cache hết hạn (stale) nhưng file có thể vẫn không đổi — nếu tải lại toàn bộ response thì tốn băng thông vô ích, đặc biệt với file lớn. Không có cách nào hỏi 'bản tôi đang giữ còn đúng không?' mà không tải hết body thì cache-hit giảm và origin vẫn bị gọi.
            - paragraph [ref=f81e291]:
              - generic [ref=f81e292]: Nguồn gốc
              - text: RFC 2616 (1997); hiện tại RFC 9110 § field.etag
            - paragraph [ref=f81e293]:
              - generic [ref=f81e294]: Giải pháp
              - text: Server trả ETag (hash/nhãn phiên bản của nội dung); khi cache stale, client gửi If-None-Match kèm ETag cũ, server nếu thấy nội dung không đổi chỉ trả 304 Not Modified không body — client dùng tiếp bản cache. ETag mạnh đảm bảo giống byte từng byte, ETag yếu (W/) chỉ đảm bảo tương đương ngữ nghĩa; If-Match còn chống 'mid-air collision' khi ghi đè song song (412).
            - paragraph [ref=f81e295]:
              - text: "Liên quan: HTTP caching với Cache-Control,"
              - link "CDN cache key" [ref=f81e296] [cursor=pointer]:
                - /url: "#cdn-cache-key"
          - article [ref=f81e297]:
            - heading "HTTP" [level=4] [ref=f81e298]
            - paragraph [ref=f81e299]: "còn gọi: HyperText Transfer Protocol"
            - paragraph [ref=f81e300]:
              - generic [ref=f81e301]: Vấn đề
              - text: Đầu thập niên 1990, nhà nghiên cứu tại CERN muốn chia sẻ tài liệu có hyperlink giữa nhiều loại máy tính khác nhau, nhưng mỗi kiểu mạng/máy lại dùng giao thức riêng (FTP, Telnet, Gopher), phải cài phần mềm riêng, không click chuột được. Tim Berners-Lee cần một giao thức đủ đơn giản để trình duyệt bất kỳ nói chuyện được với server bất kỳ.
            - paragraph [ref=f81e302]:
              - generic [ref=f81e303]: Nguồn gốc
              - text: Tim Berners-Lee, CERN, 1991; HTTP/1.1 chuẩn hóa tại RFC 2616 (1999), hiện hành RFC 9110/9112 (2022).
            - paragraph [ref=f81e304]:
              - generic [ref=f81e305]: Giải pháp
              - text: Client gửi request (method + URL + header + body) qua TCP, server trả response (status code + header + body); mọi request độc lập với nhau, server không tự nhớ trạng thái giữa các lần gọi.
            - paragraph [ref=f81e306]:
              - text: "Liên quan:"
              - link "HTTPS" [ref=f81e307] [cursor=pointer]:
                - /url: "#https"
              - text: ","
              - link "TCP" [ref=f81e308] [cursor=pointer]:
                - /url: "#tcp"
              - text: ","
              - link "REST" [ref=f81e309] [cursor=pointer]:
                - /url: "#rest"
              - text: ","
              - link "Keep-alive" [ref=f81e310] [cursor=pointer]:
                - /url: "#keep-alive"
              - text: ","
              - link "TTFB" [ref=f81e311] [cursor=pointer]:
                - /url: "#ttfb"
          - article [ref=f81e312]:
            - heading "HTTP caching với Cache-Control (freshness)" [level=4] [ref=f81e313]
            - paragraph [ref=f81e314]: "còn gọi: cache-control max-age, hết hạn cache HTTP"
            - paragraph [ref=f81e315]:
              - generic [ref=f81e316]: Vấn đề
              - text: Mọi request tĩnh (HTML, ảnh, JS) đều phải bay tới origin server khiến origin bị overload và user ở xa chờ cả RTT lẫn thời gian server. Trước khi có Cache-Control, caches dùng Expires tuyệt đối — múi giờ lệch là cache sai vĩnh viễn; còn không có cache thì băng thông và độ trễ không cải thiện được.
            - paragraph [ref=f81e317]:
              - generic [ref=f81e318]: Nguồn gốc
              - text: RFC 2616 (HTTP/1.1, 6/1997) định nghĩa Cache-Control; RFC 7234 (2014); hiện hành RFC 9111 (6/2022)
            - paragraph [ref=f81e319]:
              - generic [ref=f81e320]: Giải pháp
              - text: Server chỉ định max-age=N (đếm từ lúc sinh ra response, header Age tính nốt thời gian đã nằm ở cache trung gian); trong N giây cache dùng luôn không hỏi origin. no-cache = vẫn lưu nhưng phải revalidate mỗi lần, no-store = cấm lưu, private = chỉ browser được cache (chống rò rỉ data cá nhân ra shared cache).
            - paragraph [ref=f81e321]:
              - text: "Liên quan: ETag / conditional requests,"
              - link "CDN cache key" [ref=f81e322] [cursor=pointer]:
                - /url: "#cdn-cache-key"
              - text: ","
              - link "stale-while-revalidate" [ref=f81e323] [cursor=pointer]:
                - /url: "#stale-while-revalidate"
          - article [ref=f81e324]:
            - heading "HTTPS" [level=4] [ref=f81e325]
            - paragraph [ref=f81e326]: "còn gọi: HTTP over TLS, HTTP Secure"
            - paragraph [ref=f81e327]:
              - generic [ref=f81e328]: Vấn đề
              - text: "HTTP truyền text trần đi qua hàng chục router/ISP trung gian: ai đó ở Wi-Fi quán cà phê hay nhà cung cấp dịch vụ đọc được mật khẩu, cookie phiên, số thẻ tín dụng; mặt khác client không có cách nào kiểm tra server trả lời có đúng là server mình muốn hay không (man-in-the-middle). Thương mại điện tử đầu những 1990s không thể chạy trên kênh công khai như vậy."
            - paragraph [ref=f81e329]:
              - generic [ref=f81e330]: Nguồn gốc
              - text: Netscape giới thiệu HTTPS cùng SSL trong Netscape Navigator (1994–1995); IETF chuẩn hóa thành TLS từ 1999.
            - paragraph [ref=f81e331]:
              - generic [ref=f81e332]: Giải pháp
              - text: "Bọc HTTP trong lớp TLS: TLS mã hóa toàn bộ nội dung request/response (không ai đọc được giữa chăng) và xác thực server qua certificate do CA ký (client biết mình đang nói chuyện với đúng ngân hàng/cửa hàng)."
            - paragraph [ref=f81e333]:
              - text: "Liên quan:"
              - link "TLS/SSL" [ref=f81e334] [cursor=pointer]:
                - /url: "#tls-ssl"
              - text: ","
              - link "HTTP" [ref=f81e335] [cursor=pointer]:
                - /url: "#http"
              - text: ","
              - link "Certificate" [ref=f81e336] [cursor=pointer]:
                - /url: "#certificate"
              - text: ","
              - link "TCP" [ref=f81e337] [cursor=pointer]:
                - /url: "#tcp"
          - article [ref=f81e338]:
            - heading "I/O multiplexing (select/poll)" [level=4] [ref=f81e339]
            - paragraph [ref=f81e340]: "còn gọi: nhân rẽ I/O, polling nhiều socket"
            - paragraph [ref=f81e341]:
              - generic [ref=f81e342]: Vấn đề
              - text: "Sau khi có non-blocking, bài toán đặt ra là: một thread muốn biết trong hàng nghìn socket nào có dữ liệu tới. Viết vòng lặp hỏi từng cái là O(n) mỗi lượt và lãng phí; select/poll ra đời để hỏi hàng loạt trong một syscall — nhưng select giới hạn hard cap FD_SETSIZE (mặc định 1024) và poll phải quét lại toàn bộ danh sách mỗi lần, nên càng nhiều socket càng chậm."
            - paragraph [ref=f81e343]:
              - generic [ref=f81e344]: Nguồn gốc
              - text: không rõ (select có từ BSD 4.2, ~1983)
            - paragraph [ref=f81e345]:
              - generic [ref=f81e346]: Giải pháp
              - text: Một syscall duy nhất truyền vào tập socket cần theo dõi, trả về tập socket đang sẵn sàng (đọc/ghi được), để thread chỉ thao tác đúng những socket có việc.
            - paragraph [ref=f81e347]:
              - text: "Liên quan:"
              - link "epoll" [ref=f81e348] [cursor=pointer]:
                - /url: "#epoll"
              - text: ","
              - link "kqueue" [ref=f81e349] [cursor=pointer]:
                - /url: "#kqueue"
              - text: ","
              - link "C10k problem" [ref=f81e350] [cursor=pointer]:
                - /url: "#c10k-problem"
          - article [ref=f81e351]:
            - heading "IP" [level=4] [ref=f81e352]
            - paragraph [ref=f81e353]: "còn gọi: Internet Protocol, IPv4, IPv6"
            - paragraph [ref=f81e354]:
              - generic [ref=f81e355]: Vấn đề
              - text: Mỗi mạng con riêng (Ethernet, Token Ring, X.25) có cách đặt địa chỉ và định dạng gói khác nhau, máy trong một mạng không giao tiếp được với mạng khác — năm 1974 Cerf và Kahn muốn 'ghép' nhiều mạng thành một mạng ảo thống nhất (internetwork).
            - paragraph [ref=f81e356]:
              - generic [ref=f81e357]: Nguồn gốc
              - text: Vint Cerf & Bob Kahn, 1974; IPv4 RFC 791 (1981).
            - paragraph [ref=f81e358]:
              - generic [ref=f81e359]: Giải pháp
              - text: Định địa chỉ toàn cục cho mọi thiết bị và định tuyến từng gói từ nguồn đến đích theo hop; IP KHÔNG đảm bảo gói đến nơi hay đến đúng thứ tự — phần đó để TCP/UDP phía trên lo.
            - paragraph [ref=f81e360]:
              - text: "Liên quan:"
              - link "TCP" [ref=f81e361] [cursor=pointer]:
                - /url: "#tcp"
              - text: ","
              - link "UDP" [ref=f81e362] [cursor=pointer]:
                - /url: "#udp"
              - text: ","
              - link "DNS" [ref=f81e363] [cursor=pointer]:
                - /url: "#dns"
              - text: ","
              - link "ARP" [ref=f81e364] [cursor=pointer]:
                - /url: "#arp"
              - text: ", IPv6"
          - article [ref=f81e365]:
            - heading "Non-blocking I/O" [level=4] [ref=f81e366]
            - paragraph [ref=f81e367]: "còn gọi: I/O không chặn, non-blocking socket"
            - paragraph [ref=f81e368]:
              - generic [ref=f81e369]: Vấn đề
              - text: Trong blocking I/O, read() trên socket chưa có data sẽ treo thread tới khi client gửi — 1000 client im lặng đồng nghĩa 1000 thread bị giam, không thread nào làm việc khác được. Mô hình này biến 'chờ mạng' (vài ms tới vài giây, chậm hơn CPU hàng triệu lần) thành lãng phí tài nguyên nghiêm trọng.
            - paragraph [ref=f81e370]:
              - generic [ref=f81e371]: Nguồn gốc
              - text: không rõ (fcntl O_NONBLOCK trên POSIX sockets)
            - paragraph [ref=f81e372]:
              - generic [ref=f81e373]: Giải pháp
              - text: "Đặt socket ở chế độ non-blocking: read() trả về ngay 'chưa có data' thay vì chờ, để thread rảnh làm việc khác hoặc poll kết nối khác; việc chờ được thay bằng một vòng lặp hỏi 'socket nào sẵn sàng?'."
            - paragraph [ref=f81e374]:
              - text: "Liên quan:"
              - link "I/O multiplexing (select/poll)" [ref=f81e375] [cursor=pointer]:
                - /url: "#i-o-multiplexing-select-poll"
              - text: ","
              - link "Event loop" [ref=f81e376] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ","
              - link "Reactor pattern" [ref=f81e377] [cursor=pointer]:
                - /url: "#reactor-pattern"
          - article [ref=f81e378]:
            - heading "Port" [level=4] [ref=f81e379]
            - paragraph [ref=f81e380]: "còn gọi: cổng, TCP/UDP port"
            - paragraph [ref=f81e381]:
              - generic [ref=f81e382]: Vấn đề
              - text: Một server chạy web, mail, DB, Redis cùng lúc thì đều chung một địa chỉ IP — gói TCP/IP chỉ ghi IP thì kernel không biết giao payload cho tiến trình nào; đồng thời không có cơ chế 'gắn nhãn' loại dịch vụ để firewall chặn/mở theo dịch vụ.
            - paragraph [ref=f81e383]:
              - generic [ref=f81e384]: Nguồn gốc
              - text: Phần của mô hình TCP/IP từ RFC 793 (1981); phân bổ chính thức do IANA quản lý.
            - paragraph [ref=f81e385]:
              - generic [ref=f81e386]: Giải pháp
              - text: TCP/UDP thêm số port 0–65535 vào header (80/443/3306/5432…); kernel gom kết nối theo (IP, port) gọi là socket 4-tuple và chuyển data cho đúng tiến trình đã listen cổng đó.
            - paragraph [ref=f81e387]:
              - text: "Liên quan:"
              - link "Socket" [ref=f81e388] [cursor=pointer]:
                - /url: "#socket"
              - text: ","
              - link "TCP" [ref=f81e389] [cursor=pointer]:
                - /url: "#tcp"
              - text: ","
              - link "UDP" [ref=f81e390] [cursor=pointer]:
                - /url: "#udp"
              - text: ", Firewall, Proxy"
          - article [ref=f81e391]:
            - heading "RTT (Round-Trip Time)" [level=4] [ref=f81e392]
            - paragraph [ref=f81e393]: "còn gọi: thời gian khứ hồi, độ trễ mạng"
            - paragraph [ref=f81e394]:
              - generic [ref=f81e395]: Vấn đề
              - text: "Mọi request web đều bị chi phối bởi thời gian gói tin đi đi về về: client ở Việt Nam tới server Mỹ mất ~200-300ms mỗi RTT, và một trang web cần 20-100 round trip (DNS, TCP, TLS, HTML, JS, API) nên dù server xử lý chỉ 5ms, user vẫn chờ vài giây. Đây là lý do CDN, HTTP/2 multiplexing, keep-alive tồn tại — giảm số RTT, không phải tăng CPU."
            - paragraph [ref=f81e396]:
              - generic [ref=f81e397]: Nguồn gốc
              - text: không rõ (khái niệm cơ bản của networking)
            - paragraph [ref=f81e398]:
              - generic [ref=f81e399]: Giải pháp
              - text: "Đo RTT để làm căn cứ cho các cơ chế khác: timeout tính từ RTT ước lượng, TCP tính bandwidth-delay product từ RTT, thuật toán delay-based (BBR, Vegas) dùng RTT tăng làm tín hiệu tắc nghẽn."
            - paragraph [ref=f81e400]:
              - text: "Liên quan:"
              - link "TCP slow start" [ref=f81e401] [cursor=pointer]:
                - /url: "#tcp-slow-start"
              - text: ", TCP congestion control,"
              - link "CDN cache key" [ref=f81e402] [cursor=pointer]:
                - /url: "#cdn-cache-key"
          - article [ref=f81e403]:
            - heading "Socket" [level=4] [ref=f81e404]
            - paragraph [ref=f81e405]: "còn gọi: Berkeley socket, BSD socket"
            - paragraph [ref=f81e406]:
              - generic [ref=f81e407]: Vấn đề
              - text: Nhiều chương trình user-space cùng muốn gửi/nhận dữ liệu mạng trên một máy, nhưng hệ điềuälle sở hữu NIC — không có chuẩn nào cho app gọi 'mở kết nối, gửi bytes, nhận bytes' mà không đụng trực tiếp vào driver mạng.
            - paragraph [ref=f81e408]:
              - generic [ref=f81e409]: Nguồn gốc
              - text: Berkeley sockets giới thiệu trong 4.2BSD (1983); mô hình trở thành chuẩn chéo nền tảng.
            - paragraph [ref=f81e410]:
              - generic [ref=f81e411]: Giải pháp
              - text: Cung cấp API (AF_INET, bind/listen/connect/accept/send/recv) để chương trình làm việc với 'cổng giao tiếp' ảo gắn với IP+port; kernel lo phần giao packet xuống card mạng.
            - paragraph [ref=f81e412]:
              - text: "Liên quan:"
              - link "Port" [ref=f81e413] [cursor=pointer]:
                - /url: "#port"
              - text: ","
              - link "TCP" [ref=f81e414] [cursor=pointer]:
                - /url: "#tcp"
              - text: ","
              - link "UDP" [ref=f81e415] [cursor=pointer]:
                - /url: "#udp"
              - text: ","
              - link "Connection pool" [ref=f81e416] [cursor=pointer]:
                - /url: "#connection-pool"
              - text: ", Firewall"
          - article [ref=f81e417]:
            - heading "TCP" [level=4] [ref=f81e418]
            - paragraph [ref=f81e419]: "còn gọi: Transmission Control Protocol"
            - paragraph [ref=f81e420]:
              - generic [ref=f81e421]: Vấn đề
              - text: Mạng packet-switching (ARPANET) làm mất gói, trộn thứ tự, nhân bản gói tin — gửi file 10MB mà rơi 0.1% gói là file hỏng, và không ứng dụng nào muốn tự viết lại logic truyền cho từng loại mạng. Cerf và Kahn (1974) cần một lớp 'tin cậy' đặt trên nhiều mạng con khác nhau.
            - paragraph [ref=f81e422]:
              - generic [ref=f81e423]: Nguồn gốc
              - text: Vint Cerf & Bob Kahn, 1974; chuẩn hóa RFC 793 (1981), hiện RFC 9293 (2022).
            - paragraph [ref=f81e424]:
              - generic [ref=f81e425]: Giải pháp
              - text: Chia dữ liệu thành segment có số thứ tự; bên nhận xác nhận (ACK) và báo thiếu để bên gửiretransmit; sắp lại đúng thứ tự, kiểm tra checksum; kèm kiểm soát luồng (flow control) và kiểm soát tắc nghẽn (congestion control).
            - paragraph [ref=f81e426]:
              - text: "Liên quan:"
              - link "UDP" [ref=f81e427] [cursor=pointer]:
                - /url: "#udp"
              - text: ","
              - link "IP" [ref=f81e428] [cursor=pointer]:
                - /url: "#ip"
              - text: ", TCP handshake,"
              - link "Socket" [ref=f81e429] [cursor=pointer]:
                - /url: "#socket"
              - text: ","
              - link "Port" [ref=f81e430] [cursor=pointer]:
                - /url: "#port"
              - text: ","
              - link "Head-of-line blocking" [ref=f81e431] [cursor=pointer]:
                - /url: "#head-of-line-blocking"
          - article [ref=f81e432]:
            - heading "Thread-per-connection (Blocking I/O model)" [level=4] [ref=f81e433]
            - paragraph [ref=f81e434]: "còn gọi: mỗi kết nối một luồng, blocking server"
            - paragraph [ref=f81e435]:
              - generic [ref=f81e436]: Vấn đề
              - text: "Server thế hệ đầu viết theo mô hình mỗi socket một thread: thread gọi read() và đứng yên chờ client gửi data. Khi số kết nối lên tới hàng nghìn, mỗi threadcòn phải giữ stack 2MB — máy 1GB RAM hết bộ nhớ ở ~512 thread, và CPU thì tiêu hao cho việc đổi ngữ cảnh liên tục thay vì xử lý request. Đây là mô hình mặc định của mọi server đơn giản (Apache prefork từng thời kỳ) và là thứ đầu tiên vỡ khi traffic tăng."
            - paragraph [ref=f81e437]:
              - generic [ref=f81e438]: Nguồn gốc
              - text: không rõ (mô hình socket blocking có từ BSD sockets cổ điển)
            - paragraph [ref=f81e439]:
              - generic [ref=f81e440]: Giải pháp
              - text: "Tách 'chờ I/O' khỏi 'xử lý': đọc dữ liệu không block (non-blocking) hoặc nhờ một cơ chế tập trung báo biết socket nào đã sẵn sàng, để một thread duy nhất phục vụ hàng nghìn kết nối thay vì mỗi kết nối một thread."
            - paragraph [ref=f81e441]:
              - text: "Liên quan:"
              - link "Non-blocking I/O" [ref=f81e442] [cursor=pointer]:
                - /url: "#non-blocking-i-o"
              - text: ","
              - link "Context switch cost" [ref=f81e443] [cursor=pointer]:
                - /url: "#context-switch-cost"
              - text: ","
              - link "C10k problem" [ref=f81e444] [cursor=pointer]:
                - /url: "#c10k-problem"
              - text: ","
              - link "Event loop" [ref=f81e445] [cursor=pointer]:
                - /url: "#event-loop"
          - article [ref=f81e446]:
            - heading "TLS/SSL" [level=4] [ref=f81e447]
            - paragraph [ref=f81e448]: "còn gọi: Transport Layer Security, Secure Sockets Layer"
            - paragraph [ref=f81e449]:
              - generic [ref=f81e450]: Vấn đề
              - text: Những năm 1990 Netscape muốn trình duyệt của mình giao dịch thương mại (mua hàng, thẻ tín dụng) trên Internet công cộng — kênh TCP/IP vốn không có mã hóa lẫn xác thực, mọi router trung gian đều đọc/sửa đổi được nội dung. SSL 1.0 có lỗ hổng nghiêm trọng nên không bao giờ phát hành công khai.
            - paragraph [ref=f81e451]:
              - generic [ref=f81e452]: Nguồn gốc
              - text: Netscape (Taher Elgamal) — SSL 2.0 (1995), SSL 3.0 (1996); IETF chuẩn hóa TLS 1.0 tại RFC 2246 (1999); TLS 1.3 RFC 8446 (2018).
            - paragraph [ref=f81e453]:
              - generic [ref=f81e454]: Giải pháp
              - text: Handshake agreed key (AES…) để mã hóa channel, dùng certificate do CA ký để chứng minh danh tính server, và chữ ký MAC để phát hiện chỉnh sửa; TLS 1.3 (2018) rút handshake còn 1-RTT và buộc forward secrecy.
            - paragraph [ref=f81e455]:
              - text: "Liên quan:"
              - link "HTTPS" [ref=f81e456] [cursor=pointer]:
                - /url: "#https"
              - text: ","
              - link "Certificate" [ref=f81e457] [cursor=pointer]:
                - /url: "#certificate"
              - text: ", TCP handshake,"
              - link "HTTP/2" [ref=f81e458] [cursor=pointer]:
                - /url: "#http-2"
              - text: ","
              - link "HTTP/3 (QUIC)" [ref=f81e459] [cursor=pointer]:
                - /url: "#http-3-quic"
          - article [ref=f81e460]:
            - heading "UDP" [level=4] [ref=f81e461]
            - paragraph [ref=f81e462]: "còn gọi: User Datagram Protocol"
            - paragraph [ref=f81e463]:
              - generic [ref=f81e464]: Vấn đề
              - text: TCP bắt mất round-trip bắt tay, chờ ACK từng đoạn, truyền packet bị mất khiến độ trễ tăng hàng trăm ms — với VoIP/telephony thì mất 1 gói âm thanh còn tốt hơn là 'đứng hình' chờ nó; nhiều giao thức chỉ cần một cặp hỏi–trả lời gọn (DNS, DHCP, NTP) không cần giữ kết nối.
            - paragraph [ref=f81e465]:
              - generic [ref=f81e466]: Nguồn gốc
              - text: RFC 768, Jon Postel, 1980.
            - paragraph [ref=f81e467]:
              - generic [ref=f81e468]: Giải pháp
              - text: "Chỉ thêm port + checksum lên IP: không bắt tay, không ACK, không thứ tự, gửi là đi — mất packet hay không thứ tự do chính ứng dụng tự xử lý (hoặc bỏ qua)."
            - paragraph [ref=f81e469]:
              - text: "Liên quan:"
              - link "TCP" [ref=f81e470] [cursor=pointer]:
                - /url: "#tcp"
              - text: ","
              - link "IP" [ref=f81e471] [cursor=pointer]:
                - /url: "#ip"
              - text: ","
              - link "Port" [ref=f81e472] [cursor=pointer]:
                - /url: "#port"
              - text: ","
              - link "DNS" [ref=f81e473] [cursor=pointer]:
                - /url: "#dns"
        - generic [ref=f81e474]:
          - heading "Thiết kế API 11" [level=3] [ref=f81e475]:
            - text: Thiết kế API
            - generic [ref=f81e476]: "11"
          - article [ref=f81e477]:
            - heading "Envelope pattern" [level=4] [ref=f81e478]
            - paragraph [ref=f81e479]: "còn gọi: response wrapper, data envelope, API wrapper"
            - paragraph [ref=f81e480]:
              - generic [ref=f81e481]: Vấn đề
              - text: Mỗi endpoint tự shape response (đôi khi là object, đôi khi là array), client phải viết code khác nhau cho từng chỗ; thêm metadata (pagination, requestId) không có chỗ đặt.
            - paragraph [ref=f81e482]:
              - generic [ref=f81e483]: Nguồn gốc
              - text: "Không có 1 RFC - là convention phổ biến (AWS ApiResponse {data, error, requestId}; Azure object {value, nextLink})."
            - paragraph [ref=f81e484]:
              - generic [ref=f81e485]: Giải pháp
              - text: "Bọc payload trong object cố định vd {data, meta, error}. Meta chứa cursor, tổng số, requestId; error chứa mã lỗi thống nhất. Downsides: không đúng chuẩn REST lắm (mỗi resource là 1 representation), đôi khi gâydư thừa; nhiều API chọn không envelope để giữ đơn giản."
            - paragraph [ref=f81e486]:
              - text: "Liên quan:"
              - link "Error response shape" [ref=f81e487] [cursor=pointer]:
                - /url: "#error-response-shape"
              - text: ", RFC 7807 problem+json,"
              - link "Pagination (offset vs cursor)" [ref=f81e488] [cursor=pointer]:
                - /url: "#pagination-offset-vs-cursor"
          - article [ref=f81e489]:
            - heading "Error response shape" [level=4] [ref=f81e490]
            - paragraph [ref=f81e491]: "còn gọi: error object, error format, standard error"
            - paragraph [ref=f81e492]:
              - generic [ref=f81e493]: Vấn đề
              - text: "Lỗi trả tùy hứng (string, {message}, {errors:[]}...) khiến client không viết được 1 chỗ xử lý lỗi chung, monitoring không phân loại được."
            - paragraph [ref=f81e494]:
              - generic [ref=f81e495]: Nguồn gốc
              - text: "Azure REST API Guidelines: body {error: {code, message, target, details[], innererror}} + header x-ms-error-code khớp code trong body; Microsoft Graph, Google (google.rpc.Status) đều có format chuẩn."
            - paragraph [ref=f81e496]:
              - generic [ref=f81e497]: Giải pháp
              - text: "Chuẩn hóa: code máy đọc (stable, không đổi), message người đọc, field lỗi chi tiết (per-field validation), requestId để truy vết. Code khác nhau cho lỗi runtime-recoverable vs lỗi dùng sai; thêm code mới ở top-level cần bump version."
            - paragraph [ref=f81e498]:
              - text: "Liên quan: RFC 7807 problem+json,"
              - link "Envelope pattern" [ref=f81e499] [cursor=pointer]:
                - /url: "#envelope-pattern"
              - text: ", Request correlation ID"
          - article [ref=f81e500]:
            - heading "HTTP methods semantics" [level=4] [ref=f81e501]
            - paragraph [ref=f81e502]: "còn gọi: HTTP verbs, GET/POST/PUT/PATCH/DELETE semantics"
            - paragraph [ref=f81e503]:
              - generic [ref=f81e504]: Vấn đề
              - text: Dùng POST cho mọi thứ làm mất khả năng cache, mất retry an toàn, proxy/CDN không biết request có an toàn để lặp lại không.
            - paragraph [ref=f81e505]:
              - generic [ref=f81e506]: Nguồn gốc
              - text: RFC 9110 (STD 97, 2022, Fielding/Nottingham/Reschke) section 9 - kế thừa RFC 7231/2616.
            - paragraph [ref=f81e507]:
              - generic [ref=f81e508]: Giải pháp
              - text: "GET/HEAD = đọc (safe); POST = tạo/submit, không an toàn; PUT = thay thế toàn bộ resource (idempotent); DELETE = xóa (idempotent); PATCH = sửa một phần (không idempotent); OPTIONS = hỏi khả năng. Trả status code đúng ngữ nghĩa: 201 khi tạo, 204 khi xóa thành công."
            - paragraph [ref=f81e509]:
              - text: "Liên quan:"
              - link "Safe & idempotent methods" [ref=f81e510] [cursor=pointer]:
                - /url: "#safe-idempotent-methods"
              - text: ", Status codes,"
              - link "PUT vs PATCH" [ref=f81e511] [cursor=pointer]:
                - /url: "#put-vs-patch"
          - article [ref=f81e512]:
            - heading "Idempotency" [level=4] [ref=f81e513]
            - paragraph [ref=f81e514]: "còn gọi: idempotent operation, idempotent, bất biến lặp, idempotency key"
            - paragraph [ref=f81e515]:
              - generic [ref=f81e516]: Vấn đề
              - text: Retry sau timeout mạng có thể tạo đối tượng thứ hai hoặc charge hai lần; client không phân biệt 'mạng lỗi' với 'chưa xử lý'.
            - paragraph [ref=f81e517]:
              - generic [ref=f81e518]: Nguồn gốc
              - text: Khái niệm từ HTTP spec (idempotent methods, RFC 9110 section 9.2.2); mẫu Idempotency-Key phổ biến hóa bởi Stripe API.
            - paragraph [ref=f81e519]:
              - generic [ref=f81e520]: Giải pháp
              - text: Server ghi kết quả của lần đầu theo key; lần retry cùng key trả về đúng kết quả cũ thay vì thực thi lại. Stripe lưu status code + body của lần đầu với key, cho phép dùng lại tối đa khoảng 24h, tham số khác key cũ gây lỗi để tránh dùng nhầm.
            - paragraph [ref=f81e521]:
              - text: "Liên quan:"
              - link "Idempotency key (Stripe pattern)" [ref=f81e522] [cursor=pointer]:
                - /url: "#idempotency-key-stripe-pattern"
              - text: ","
              - link "Safe & idempotent methods" [ref=f81e523] [cursor=pointer]:
                - /url: "#safe-idempotent-methods"
              - text: ","
              - link "Exactly-once illusion vs at-least-once" [ref=f81e524] [cursor=pointer]:
                - /url: "#exactly-once-illusion-vs-at-least-once"
              - text: ","
              - link "Idempotent consumer" [ref=f81e525] [cursor=pointer]:
                - /url: "#idempotent-consumer"
              - text: ","
              - link "Retry với exponential backoff & jitter" [ref=f81e526] [cursor=pointer]:
                - /url: "#retry-vo-i-exponential-backoff-jitter"
              - text: ","
              - link "Exactly-once semantics" [ref=f81e527] [cursor=pointer]:
                - /url: "#exactly-once-semantics"
          - article [ref=f81e528]:
            - heading "OpenAPI/Swagger" [level=4] [ref=f81e529]
            - paragraph [ref=f81e530]: "còn gọi: OpenAPI Specification, OAS, Swagger, OpenAPI Description"
            - paragraph [ref=f81e531]:
              - generic [ref=f81e532]: Vấn đề
              - text: Document API bằng wiki/Excel nhanh lạc hậu; không có format machine-readable thì không tự sinh SDK, không mock, không test contract tự động.
            - paragraph [ref=f81e533]:
              - generic [ref=f81e534]: Nguồn gốc
              - text: Swagger do Tony Tam tạo khi ở Wordnik, spec đầu tiên phát hành 10/8/2011; 11/2015 SmartBear donate cho OpenAPI Initiative dưới Linux Foundation (Google, IBM, Microsoft, PayPal); 1/1/2016 đổi tên OpenAPI Specification.
            - paragraph [ref=f81e535]:
              - generic [ref=f81e536]: Giải pháp
              - text: File YAML/JSON mô tả paths, operations, parameters, schemas (JSON Schema), security, servers. Tools đọc spec để sinh docs (Swagger UI/Redoc), client SDK, server stub, contract tests. Spec language-agnostic nên team khác nhau dùng chung 1 nguồn.
            - paragraph [ref=f81e537]:
              - text: "Liên quan:"
              - link "API-first design" [ref=f81e538] [cursor=pointer]:
                - /url: "#api-first-design"
              - text: ","
              - link "Contract-first" [ref=f81e539] [cursor=pointer]:
                - /url: "#contract-first"
              - text: ", SDK/codegen"
          - article [ref=f81e540]:
            - heading "PUT vs PATCH" [level=4] [ref=f81e541]
            - paragraph [ref=f81e542]: "còn gọi: full update vs partial update, replace vs merge"
            - paragraph [ref=f81e543]:
              - generic [ref=f81e544]: Vấn đề
              - text: Gửi PUT với body thiếu trường sẽ xóa mất dữ liệu do PUT là thay thế toàn bộ; còn PATCH không chuẩn thì mỗi API tự định nghĩa format, client không đoán được.
            - paragraph [ref=f81e545]:
              - generic [ref=f81e546]: Nguồn gốc
              - text: RFC 5789 'PATCH Method for HTTP' (2010, Lisa Dusseault & James M. Snell) - PUT chỉ thay thế toàn bộ nên không dùng được cho sửa một phần.
            - paragraph [ref=f81e547]:
              - generic [ref=f81e548]: Giải pháp
              - text: PUT gửi full representation, idempotent; PATCH gửi instruction sửa một phần (JSON Merge Patch RFC 7396 hoặc JSON Patch RFC 6902), không idempotent. PATCH trả 204/200, lỗi 400 (patch sai), 409 (xung đột), 412 (precondition fail), 415 (không hỗ trợ format), 422 (syntax đúng nhưng không áp được).
            - paragraph [ref=f81e549]:
              - text: "Liên quan:"
              - link "HTTP methods semantics" [ref=f81e550] [cursor=pointer]:
                - /url: "#http-methods-semantics"
              - text: ","
              - link "Optimistic concurrency (ETag/If-Match)" [ref=f81e551] [cursor=pointer]:
                - /url: "#optimistic-concurrency-etag-if-match"
          - article [ref=f81e552]:
            - heading "Representational state (resource vs representation)" [level=4] [ref=f81e553]
            - paragraph [ref=f81e554]: "còn gọi: resource-oriented design, resource, representation"
            - paragraph [ref=f81e555]:
              - generic [ref=f81e556]: Vấn đề
              - text: Khi API trả về 'đối tượng' như gửi trực tiếp object, client phụ thuộc format cụ thể; đổi trường dữ liệu hay đổi format là phá mọi client.
            - paragraph [ref=f81e557]:
              - generic [ref=f81e558]: Nguồn gốc
              - text: Fielding dissertation 2000 - phân biệt resource (khái niệm được định danh) và representation (dữ liệu mô tả trạng thái tại thời điểm gửi, theo định dạng JSON/XML...).
            - paragraph [ref=f81e559]:
              - generic [ref=f81e560]: Giải pháp
              - text: Resource có nhiều representation; client chọn qua content negotiation. Server gửi trạng thái hiện tại, client thay đổi trạng thái bằng PUT/POST/PATCH; thao tác dựa trên giao thức không lưu trạng thái phía client.
            - paragraph [ref=f81e561]:
              - text: "Liên quan:"
              - link "REST" [ref=f81e562] [cursor=pointer]:
                - /url: "#rest"
              - text: ","
              - link "Content negotiation" [ref=f81e563] [cursor=pointer]:
                - /url: "#content-negotiation"
              - text: ","
              - link "HTTP methods semantics" [ref=f81e564] [cursor=pointer]:
                - /url: "#http-methods-semantics"
          - article [ref=f81e565]:
            - heading "REST (Representational State Transfer)" [level=4] [ref=f81e566]
            - paragraph [ref=f81e567]: "còn gọi: RESTful, RESTful API"
            - paragraph [ref=f81e568]:
              - generic [ref=f81e569]: Vấn đề
              - text: "Trước 2000 web API thiết kế tùy tiện: mỗi hệ thống tự đặt quy ước URL/verb/định dạng riêng, client phải hardcode cấu trúc máy chủ và vỡ khi hệ thống thay đổi."
            - paragraph [ref=f81e570]:
              - generic [ref=f81e571]: Nguồn gốc
              - text: Roy Fielding, luận án tiến sĩ 'Architectural Styles and the Design of Network-based Software Architectures', UC Irvine, 2000.
            - paragraph [ref=f81e572]:
              - generic [ref=f81e573]: Giải pháp
              - text: "Kiểu kiến trúc gồm 6 ràng buộc: client-server, statelessness, cache, uniform interface (tài nguyên định danh bằng URI, thao tác qua representation, message tự mô tả, HATEOAS), layered system, code on demand (tùy chọn). Client chỉ cần URI khởi đầu và tự khám phá phần còn lại qua hypermedia nên ít khớp chặt với máy chủ."
            - paragraph [ref=f81e574]:
              - text: "Liên quan: Representational state,"
              - link "Statelessness" [ref=f81e575] [cursor=pointer]:
                - /url: "#statelessness"
              - text: ","
              - link "HATEOAS" [ref=f81e576] [cursor=pointer]:
                - /url: "#hateoas"
              - text: ","
              - link "HTTP methods semantics" [ref=f81e577] [cursor=pointer]:
                - /url: "#http-methods-semantics"
          - article [ref=f81e578]:
            - heading "Safe & idempotent methods" [level=4] [ref=f81e579]
            - paragraph [ref=f81e580]: "còn gọi: safe methods, idempotent methods"
            - paragraph [ref=f81e581]:
              - generic [ref=f81e582]: Vấn đề
              - text: Khi kết nối sập giữa chừng client không biết request đã xử lý chưa; retry bừa có thể tạo trùng (double charge, record trùng).
            - paragraph [ref=f81e583]:
              - generic [ref=f81e584]: Nguồn gốc
              - text: "RFC 9110 section 9.2: safe = không đổi trạng thái server (GET/HEAD/OPTIONS); idempotent = làm N lần giống 1 lần về hiệu ứng (PUT/DELETE, GET)."
            - paragraph [ref=f81e585]:
              - generic [ref=f81e586]: Giải pháp
              - text: Client chỉ tự động retry method an toàn/idempotent khi mạng lỗi; với POST phải dùng idempotency key hoặc cho người dùng xác nhận. Azure REST guidelines còn yêu cầu mọi method phải idempotent, POST tạo resource cũng idempotent nhờ header Repeatability-Request-ID.
            - paragraph [ref=f81e587]:
              - text: "Liên quan:"
              - link "Idempotency" [ref=f81e588] [cursor=pointer]:
                - /url: "#idempotency"
              - text: ","
              - link "Retry guidance (safe methods)" [ref=f81e589] [cursor=pointer]:
                - /url: "#retry-guidance-safe-methods"
              - text: ","
              - link "HTTP methods semantics" [ref=f81e590] [cursor=pointer]:
                - /url: "#http-methods-semantics"
          - article [ref=f81e591]:
            - heading "Statelessness" [level=4] [ref=f81e592]
            - paragraph [ref=f81e593]: "còn gọi: stateless server, server stateless"
            - paragraph [ref=f81e594]:
              - generic [ref=f81e595]: Vấn đề
              - text: Server giữ session trên memory khiến không scale ngang (request phải về đúng node giữ session), client nghỉ mà server vẫn tốn tài nguyên lưu trạng thái.
            - paragraph [ref=f81e596]:
              - generic [ref=f81e597]: Nguồn gốc
              - text: "Ràng buộc thứ 2 của REST, Fielding 2000: 'A specific client does not consume server storage when the client is at rest'."
            - paragraph [ref=f81e598]:
              - generic [ref=f81e599]: Giải pháp
              - text: Mỗi request mang đủ thông tin để xử lý độc lập (auth token, context); server không lưu phiên. Trạng thái nằm ở client hoặc resource, mọi node xử lý được mọi request, dễ load balance và chịu lỗi.
            - paragraph [ref=f81e600]:
              - text: "Liên quan:"
              - link "REST" [ref=f81e601] [cursor=pointer]:
                - /url: "#rest"
              - text: ","
              - link "Idempotency" [ref=f81e602] [cursor=pointer]:
                - /url: "#idempotency"
          - article [ref=f81e603]:
            - heading "Status codes (2xx/4xx/5xx)" [level=4] [ref=f81e604]
            - paragraph [ref=f81e605]: "còn gọi: HTTP status codes, response status"
            - paragraph [ref=f81e606]:
              - generic [ref=f81e607]: Vấn đề
              - text: Luôn trả 200 kèm lỗi trong body làm client khó phân biệt thành công/thất bại, cache và monitoring hiểu sai, debug tốn thời gian.
            - paragraph [ref=f81e608]:
              - generic [ref=f81e609]: Nguồn gốc
              - text: RFC 9110 section 15 (2022) định nghĩa bảng status code; RFC 6585 (2012, Nottingham & Fielding) bổ sung 428/429/431/511.
            - paragraph [ref=f81e610]:
              - generic [ref=f81e611]: Giải pháp
              - text: 2xx thành công (200 OK, 201 Created, 202 Accepted, 204 No Content); 4xx lỗi phía client (400, 401, 403, 404, 409, 412, 415, 422, 429); 5xx lỗi server (500, 503). Mã lạ client coi như nhóm tương ứng (499 lạ coi như 400).
            - paragraph [ref=f81e612]:
              - text: "Liên quan:"
              - link "Error response shape" [ref=f81e613] [cursor=pointer]:
                - /url: "#error-response-shape"
              - text: ", RFC 7807 problem+json, Rate limit headers"
        - generic [ref=f81e614]:
          - heading "Cơ sở dữ liệu & Lưu trữ 19" [level=3] [ref=f81e615]:
            - text: Cơ sở dữ liệu & Lưu trữ
            - generic [ref=f81e616]: "19"
          - article [ref=f81e617]:
            - heading "ACID" [level=4] [ref=f81e618]
            - paragraph [ref=f81e619]: "còn gọi: giao dịch ACID"
            - paragraph [ref=f81e620]:
              - generic [ref=f81e621]: Vấn đề
              - text: Ghi dữ liệu từ nhiều client song song rất dễ hỏng khi lỗi phần cứng hoặc tranh chấp xảy ra, để lại trạng thái nửa vời.
            - paragraph [ref=f81e622]:
              - generic [ref=f81e623]: Nguồn gốc
              - text: Härder và Reuter đặt tên năm 1983
            - paragraph [ref=f81e624]:
              - generic [ref=f81e625]: Giải pháp
              - text: "Bốn thuộc tính Atomicity, Consistency, Isolation, Durability: ghi hoặc bỏ hẳn, luôn giữ DB ở trạng thái hợp lệ, bền sau crash."
            - paragraph [ref=f81e626]:
              - text: "Liên quan:"
              - link "Transaction" [ref=f81e627] [cursor=pointer]:
                - /url: "#transaction"
              - text: ","
              - link "Isolation level" [ref=f81e628] [cursor=pointer]:
                - /url: "#isolation-level"
              - text: ", WAL,"
              - link "MVCC" [ref=f81e629] [cursor=pointer]:
                - /url: "#mvcc"
          - article [ref=f81e630]:
            - heading "BEGIN/COMMIT/ROLLBACK" [level=4] [ref=f81e631]
            - paragraph [ref=f81e632]: "còn gọi: vòng đời transaction"
            - paragraph [ref=f81e633]:
              - generic [ref=f81e634]: Vấn đề
              - text: Cần cơ chế để ứng dụng tự quyết định điểm chốt hoặc hoàn tác một nhóm thao tác ghi.
            - paragraph [ref=f81e635]:
              - generic [ref=f81e636]: Nguồn gốc
              - text: Tiêu chuẩn SQL, thập niên 1980
            - paragraph [ref=f81e637]:
              - generic [ref=f81e638]: Giải pháp
              - text: BEGIN mở transaction, COMMIT ghi vĩnh viễn và chốt, ROLLBACK đưa dữ liệu về trạng thái trước BEGIN.
            - paragraph [ref=f81e639]:
              - text: "Liên quan:"
              - link "Transaction" [ref=f81e640] [cursor=pointer]:
                - /url: "#transaction"
              - text: ", WAL,"
              - link "Crash recovery" [ref=f81e641] [cursor=pointer]:
                - /url: "#crash-recovery"
          - article [ref=f81e642]:
            - heading "Connection pool" [level=4] [ref=f81e643]
            - paragraph [ref=f81e644]: "còn gọi: pool kết nối, kết nối DB tái sử dụng, connection pooling, DB pool, Connection pool vs kết nối mới, pooling, pre-warm connections, connection reuse, kết nối pool, pool kết nối database"
            - paragraph [ref=f81e645]:
              - generic [ref=f81e646]: Vấn đề
              - text: Mỗi request mở 1 kết nối TCP + auth tới DB rồi đóng lại thì tốn hàng chục ms handshake; traffic cao hàng nghìn kết nối cùng lúc làm sập DB (mỗi connection ăn RAM và slot) — mở-đóng kết nối thẳng là bottleneck kinh điển. Mỗi request mở 1 kết nối TCP + handshake + TLS + auth với Postgres rồi đóng lại — tốn vài chục ms và hàng nghìn kết nối ngắn hạn khiến database kiệt sức (connection storm), đặc biệt với serverless Lambda khởi động per-invocation.
            - paragraph [ref=f81e647]:
              - generic [ref=f81e648]: Nguồn gốc
              - text: Không rõ tác giả — phát triển cùng application server Java/JDBC pools thập niên 2000 (Commons DBCP, HikariCP...)
            - paragraph [ref=f81e649]:
              - generic [ref=f81e650]: Giải pháp
              - text: "Giữ sẵn nhóm kết nối mở, cho mượn rồi trả lại pool — app tái sử dụng thay vì tạo mới; giới hạn số kết nối tối đa bảo vệ DB không bị overload. Pool giữ sẵn N kết nối đã xác thực, checkout/checkin microseconds. Cấu hình: max pool = f(số instance app, số backend), idle timeout, validation query on borrow, leak detection. Pre-warm: mở hết pool lúc boot trước khi nhận traffic (tránh cold-start spike). Pool quá lớn → backend (Postgres, MySQL) kiệt slot kết nối. Tạo trước tập kết nối, cho mượn/trả lại thay vì mở-đóng — giảm overhead setup, giới hạn đồng thời tối đa khớp max_connections của DB; phải tune idle timeout vì NAT/proxy âm thầm giết kết nối cũ."
            - paragraph [ref=f81e651]:
              - text: "Liên quan:"
              - link "N+1 problem" [ref=f81e652] [cursor=pointer]:
                - /url: "#n-1-problem"
              - text: ","
              - link "Query plan / EXPLAIN" [ref=f81e653] [cursor=pointer]:
                - /url: "#query-plan-explain"
              - text: ","
