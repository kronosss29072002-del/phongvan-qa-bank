                - /url: "#chaos-test"
          - article [ref=f81e5484]:
            - heading "technical debt" [level=4] [ref=f81e5485]
            - paragraph [ref=f81e5486]: "còn gọi: tech debt"
            - paragraph [ref=f81e5487]:
              - generic [ref=f81e5488]: Vấn đề
              - text: Chọn shortcut để release nhanh hôm nay → chi phí bảo trì tăng theo thời gian (khó sửa, khó mở rộng).
            - paragraph [ref=f81e5489]:
              - generic [ref=f81e5490]: Nguồn gốc
              - text: Ward Cunningham
            - paragraph [ref=f81e5491]:
              - generic [ref=f81e5492]: Giải pháp
              - text: Ghi nhận nợ có chủ đích (intentional) vs vô tình. Ưu tiên trả nợ theo tác động (critical path).
            - paragraph [ref=f81e5493]:
              - text: "Liên quan:"
