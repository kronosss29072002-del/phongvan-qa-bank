                - /url: "#http"
              - text: ","
              - link "HTTPS" [ref=f81e2492] [cursor=pointer]:
                - /url: "#https"
              - text: ", Preflight, Same-origin policy"
          - article [ref=f81e2493]:
            - heading "DNS negative caching" [level=4] [ref=f81e2494]
            - paragraph [ref=f81e2495]: "còn gọi: cache DNS 'không tồn tại', NXDOMAIN cache, RFC 2308"
            - paragraph [ref=f81e2496]:
              - generic [ref=f81e2497]: Vấn đề
              - text: Người dùng gõ sai domain hàng triệu lần mỗi ngày; mỗi lần resolver đều phải hỏi nguyên chuỗi tới authoritative server chỉ để nhận về 'NXDOMAIN, không có tên này'. RFC 1034 gốc có cơ chế cache câu trả lời âm nhưng 'có khuyết tật gốc' — không cho server khác mượn lại cache đó, nên phần lớn DNS traffic vẫn là query vô nghĩa lặp lại.
            - paragraph [ref=f81e2498]:
              - generic [ref=f81e2499]: Nguồn gốc
              - text: Mark P. Andrews (CSIRO), RFC 2308, tháng 3/1998
            - paragraph [ref=f81e2500]:
              - generic [ref=f81e2501]: Giải pháp
              - text: Resolver cache cả câu trả lời 'không tồn tại' (NXDOMAIN) và 'tên đúng nhưng sai loại record' (NODATA) theo TTL lấy từ field MINIMUM của SOA; RFC 2308 còn buộc resolver 'nếu cache gì thì phải cache cả câu trả lời âm'.
            - paragraph [ref=f81e2502]:
              - text: "Liên quan:"
              - link "DNS TTL caching" [ref=f81e2503] [cursor=pointer]:
                - /url: "#dns-ttl-caching"
              - text: ","
              - link "DNS resolution chain" [ref=f81e2504] [cursor=pointer]:
                - /url: "#dns-resolution-chain"
          - article [ref=f81e2505]:
            - heading "epoll" [level=4] [ref=f81e2506]
            - paragraph [ref=f81e2507]: "còn gọi: event poll Linux, epoll_wait"
            - paragraph [ref=f81e2508]:
              - generic [ref=f81e2509]: Vấn đề
              - text: select/poll phải quét toàn bộ danh sách descriptor O(n) mỗi lần hỏi 'ai sẵn sàng?', và select còn hard-cap FD_SETSIZE — server có 100.000 kết nối thì mỗi vòng lặp tốn 100.000 lần kiểm tra, phần lớn kết nối im lặng. Nút thắt này khiến Linux không thể cạnh tranh ở bài toán C10k cho tới khi epoll ra đời.
            - paragraph [ref=f81e2510]:
              - generic [ref=f81e2511]: Nguồn gốc
              - text: Linux kernel 2.5.45, tháng 10/2002 (được công bố trong bản phát hành của Linus Torvalds; đưa tin bởi Jonathan Corbet trên LWN)
            - paragraph [ref=f81e2512]:
              - generic [ref=f81e2513]: Giải pháp
              - text: Kernel giữ tập descriptor đã đăng ký trong cây đỏ-đen; người dùng thêm/sửa/xóa riêng qua epoll_ctl, rồi epoll_wait chỉ trả về đúng các event đang xảy ra — O(1) cho thao tác thường gặp, không phải quét lại. Hỗ trợ level-triggered (trả về chừng điều kiện còn đúng) và edge-triggered (chỉ trả về khi có event mới).
