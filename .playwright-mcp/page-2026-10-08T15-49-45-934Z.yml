                - /url: "#stream-processing-vs-batch"
          - article [ref=f81e6579]:
            - heading "Mailbox (actor model)" [level=4] [ref=f81e6580]
            - paragraph [ref=f81e6581]: "còn gọi: actor model, mailbox, hộp thư actor"
            - paragraph [ref=f81e6582]:
              - generic [ref=f81e6583]: Vấn đề
              - text: "Nhiều thread sửa chung biến global: thêm lock để tránh race thì dễ deadlock và priority inversion, quên lock thì data corrupt, race condition khó reproduce trên máy dev — lock là gốc của phần lớn lỗi đồng hành khó tìm trong hệ thống concurrent."
            - paragraph [ref=f81e6584]:
              - generic [ref=f81e6585]: Nguồn gốc
              - text: Actor model — Carl Hewitt, Peter Bishop, Richard Steiger, 1973
            - paragraph [ref=f81e6586]:
              - generic [ref=f81e6587]: Giải pháp
              - text: Mỗi actor/process có mailbox riêng và state riêng tư, giao tiếp chỉ qua gửi message theo địa chỉ — không có memory chung thì không cần lock, lỗi cách ly theo process (Erlang/OTP dùng supervision tree restart process hỏng).
            - paragraph [ref=f81e6588]:
              - text: "Liên quan:"
              - link "Message queue" [ref=f81e6589] [cursor=pointer]:
                - /url: "#message-queue"
              - text: ","
              - link "Event-driven architecture" [ref=f81e6590] [cursor=pointer]:
                - /url: "#event-driven-architecture"
              - text: ","
              - link "Pub/Sub" [ref=f81e6591] [cursor=pointer]:
                - /url: "#pub-sub"
          - article [ref=f81e6592]:
            - heading "Stream processing vs batch" [level=4] [ref=f81e6593]
            - paragraph [ref=f81e6594]: "còn gọi: streaming, stream vs batch, Lambda architecture, Kappa architecture"
            - paragraph [ref=f81e6595]:
              - generic [ref=f81e6596]: Vấn đề
              - text: Batch (Hadoop/ETL đêm) cho kết quả đúng trên toàn bộ dữ liệu nhưng dashboard trễ hàng giờ — không kịp phát hiện gian lận realtime; xử lý stream từng event thì state chỉ một phần và khó đảm bảo độ đúng, mặt khác phải duy trì hai codebase xử lý hoàn toàn khác nhau.
            - paragraph [ref=f81e6597]:
              - generic [ref=f81e6598]: Nguồn gốc
              - text: Lambda architecture — Nathan Marz, blog 2011 (gốc gọi là 'batch/realtime architecture'); Kappa do Jay Kreps đề xuất
            - paragraph [ref=f81e6599]:
              - generic [ref=f81e6600]: Giải pháp
              - text: Stream xử lý liên tục theo window + checkpoint (Flink, Kafka Streams, Storm) cho độ trễ thấp; batch xử lý toàn bộ cho chính xác — Lambda architecture xếp hai lớp (batch + speed) còn Kappa bỏ lớp batch, chạy thuần stream một codebase.
            - paragraph [ref=f81e6601]:
              - text: "Liên quan:"
              - link "Apache Kafka" [ref=f81e6602] [cursor=pointer]:
                - /url: "#apache-kafka"
              - text: ","
              - link "Event sourcing" [ref=f81e6603] [cursor=pointer]:
                - /url: "#event-sourcing"
              - text: ","
              - link "Backpressure" [ref=f81e6604] [cursor=pointer]:
                - /url: "#backpressure"
          - article [ref=f81e6605]:
            - heading "Transactional outbox" [level=4] [ref=f81e6606]
            - paragraph [ref=f81e6607]: "còn gọi: outbox pattern, dual-write fix"
            - paragraph [ref=f81e6608]:
              - generic [ref=f81e6609]: Vấn đề
              - text: "Dual write: một business transaction phải vừa ghi database vừa publish event cho broker — không có transaction chung: gửi giữa transaction thì event sống sót cả khi rollback, gửi sau commit thì crash đúng giữa hai bước là event mất vĩnh viễn; 2PC với broker thì không thực tế."
            - paragraph [ref=f81e6610]:
              - generic [ref=f81e6611]: Nguồn gốc
              - text: Chris Richardson — microservices.io
            - paragraph [ref=f81e6612]:
              - generic [ref=f81e6613]: Giải pháp
              - text: Ghi event vào bảng outbox CÙNG transaction với row business; relay (polling bảng hoặc CDC đọc transaction log) đẩy outbox ra broker — database là nguồn sự thật duy nhất; consumer vẫn cần idempotent vì relay crash giữa 'đã gửi' và 'đã đánh dấu' có thể gửi trùng.
            - paragraph [ref=f81e6614]:
              - text: "Liên quan:"
              - link "Idempotent consumer" [ref=f81e6615] [cursor=pointer]:
                - /url: "#idempotent-consumer"
              - text: ","
              - link "Event-driven architecture" [ref=f81e6616] [cursor=pointer]:
                - /url: "#event-driven-architecture"
              - text: ","
              - link "Event sourcing" [ref=f81e6617] [cursor=pointer]:
                - /url: "#event-sourcing"
              - text: ","
              - link "Exactly-once semantics" [ref=f81e6618] [cursor=pointer]:
                - /url: "#exactly-once-semantics"
        - generic [ref=f81e6619]:
          - heading "Kiến trúc & Khả năng mở rộng 8" [level=3] [ref=f81e6620]:
            - text: Kiến trúc & Khả năng mở rộng
            - generic [ref=f81e6621]: "8"
          - article [ref=f81e6622]:
            - heading "Bounded Context" [level=4] [ref=f81e6623]
            - paragraph [ref=f81e6624]: "còn gọi: ngữ cảnh giới hạn"
            - paragraph [ref=f81e6625]:
              - generic [ref=f81e6626]: Vấn đề
              - text: Trong hệ thống lớn, từ 'Customer' với team billing nghĩa là 'người trả tiền', với team shipping là 'người nhận hàng', với team marketing là 'lead'. Ép tất cả dùng chung một model Customer thì model đó trở nên vô nghĩa vì mỗi team hiểu khác nhau. Bounded context ra đời để mỗi team có model riêng, rõ ràng, không đụng nhau.
            - paragraph [ref=f81e6627]:
              - generic [ref=f81e6628]: Nguồn gốc
              - text: Eric Evans giới thiệu trong cuốn 'Domain-Driven Design' (2003); Martin Fowler mô tả chi tiết trên bliki (BoundedContext.html).
            - paragraph [ref=f81e6629]:
              - generic [ref=f81e6630]: Giải pháp
              - text: Chia hệ thống thành các context, mỗi context có ubiquitous language và model riêng, nội bộ nhất quán. Các context giao tiếp qua context map với các relationship rõ ràng (anti-corruption layer, shared kernel, customer-supplier...).
            - paragraph [ref=f81e6631]:
              - text: "Liên quan: DDD,"
              - link "modular monolith" [ref=f81e6632] [cursor=pointer]:
                - /url: "#modular-monolith"
              - text: ", ubiquitous language"
          - article [ref=f81e6633]:
            - heading "Cell-Based Architecture" [level=4] [ref=f81e6634]
            - paragraph [ref=f81e6635]: "còn gọi: kiến trúc phân ô"
            - paragraph [ref=f81e6636]:
              - generic [ref=f81e6637]: Vấn đề
              - text: "Hệ thống lớn phục vụ hàng triệu user, khi một service fail, deploy lỗi, hoặc lỗi chiếm hết tài nguyên, toàn bộ user bị ảnh hưởng — blast radius quá lớn. Cell-based architecture ra đời để chia hệ thống thành nhiều 'cell' độc lập: fail một cell chỉ ảnh hưởng tập user của cell đó, không lan ra toàn hệ thống."
            - paragraph [ref=f81e6638]:
              - generic [ref=f81e6639]: Nguồn gốc
              - text: Amazon phổ biến qua AWS Builders Library (bài 'Avoiding overload in distributed systems by putting cell-based architecture in place').
            - paragraph [ref=f81e6640]:
              - generic [ref=f81e6641]: Giải pháp
              - text: Mỗi cell là một bản sao đầy đủ của hệ thống (API, service, DB). Router phân user vào cell dựa trên shard key (user ID, region). Cell sập thì router redirect sang cell khác; deploy theo từng cell để rollout từng phần, không cần outage toàn hệ thống.
            - paragraph [ref=f81e6642]:
              - text: "Liên quan:"
              - link "multi-tenancy" [ref=f81e6643] [cursor=pointer]:
                - /url: "#multi-tenancy"
              - text: ","
              - link "geo-replication" [ref=f81e6644] [cursor=pointer]:
                - /url: "#geo-replication"
              - text: ", blast radius"
          - article [ref=f81e6645]:
            - heading "DDD (Domain-Driven Design)" [level=4] [ref=f81e6646]
            - paragraph [ref=f81e6647]: "còn gọi: thiết kế hướng domain"
            - paragraph [ref=f81e6648]:
              - generic [ref=f81e6649]: Vấn đề
              - text: Dev hiểu business ít hơn domain expert, code implement sai logic nghiệp vụ vì yêu cầu bị dịch qua nhiều lớp (BA → spec → code), và model code ngày càng lệch khỏi model business thật. DDD ra đời để dev và domain expert nói chung một ngôn ngữ, model code phản ánh đúng model nghiệp vụ.
            - paragraph [ref=f81e6650]:
              - generic [ref=f81e6651]: Nguồn gốc
              - text: "Eric Evans, cuốn 'Domain-Driven Design: Tackling Complexity in the Heart of Software' (2003)."
            - paragraph [ref=f81e6652]:
              - generic [ref=f81e6653]: Giải pháp
              - text: "Strategic design: bounded context, context map, ubiquitous language. Tactical design: entity, value object, aggregate, repository, domain service, domain event. Tách model kỹ thuật (database tables) khỏi domain model."
            - paragraph [ref=f81e6654]:
              - text: "Liên quan:"
              - link "bounded context" [ref=f81e6655] [cursor=pointer]:
                - /url: "#bounded-context"
              - text: ", aggregate,"
              - link "microservices" [ref=f81e6656] [cursor=pointer]:
                - /url: "#microservices"
          - article [ref=f81e6657]:
            - heading "Fallacies of Distributed Computing" [level=4] [ref=f81e6658]
            - paragraph [ref=f81e6659]: "còn gọi: 8 ngộ nhận về tính toán phân tán"
            - paragraph [ref=f81e6660]:
              - generic [ref=f81e6661]: Vấn đề
              - text: Dev quen viết app trên một máy, khi chuyển sang hệ thống phân tán vẫn giả định 'mạng luôn chạy, latency = 0, bandwidth vô hạn...' — dẫn đến app treo khi mạng rớt, timeout sai, không retry, security lỏng. 8 fallacies ra đời để cảnh tỉnh những giả định sai lầm này.
            - paragraph [ref=f81e6662]:
              - generic [ref=f81e6663]: Nguồn gốc
              - text: L. Peter Deutsch (Sun Microsystems Fellow) công bố 7 fallacies năm 1994 (dựa trên 4 fallacy của Bill Joy và Dave Lyon); James Gosling thêm fallacy thứ 8 khoảng năm 1997.
            - paragraph [ref=f81e6664]:
              - generic [ref=f81e6665]: Giải pháp
              - text: "8 fallacies: (1) mạng đáng tin, (2) latency = 0, (3) bandwidth vô hạn, (4) mạng bảo mật, (5) topology không đổi, (6) chỉ có 1 admin, (7) chi phí transport = 0, (8) mạng đồng nhất. Thiết kế phải đối mặt từng cái: timeout + retry, circuit breaker, backpressure, encryption, service discovery, graceful degradation."
            - paragraph [ref=f81e6666]:
              - text: "Liên quan:"
              - link "service discovery" [ref=f81e6667] [cursor=pointer]:
                - /url: "#service-discovery"
              - text: ","
              - link "circuit breaker" [ref=f81e6668] [cursor=pointer]:
                - /url: "#circuit-breaker"
              - text: ","
              - link "geo-replication" [ref=f81e6669] [cursor=pointer]:
                - /url: "#geo-replication"
          - article [ref=f81e6670]:
            - heading "Geo-Replication" [level=4] [ref=f81e6671]
            - paragraph [ref=f81e6672]: "còn gọi: nhân bản địa lý"
            - paragraph [ref=f81e6673]:
              - generic [ref=f81e6674]: Vấn đề
              - text: "User ở Việt Nam gọi API đặt server tại US mất ~200ms mỗi round-trip; và nếu US region chết (mất điện, thảm họa) thì toàn bộ user không truy cập được. Geo-replication ra đời để copy data sang nhiều region: user đọc từ region gần nhất, region khác takeover khi một region sập."
            - paragraph [ref=f81e6675]:
              - generic [ref=f81e6676]: Nguồn gốc
              - text: "Xuất hiện cùng các hệ thống distributed database lớn: Google Spanner (2012-2013), Apache Cassandra (Facebook, 2010), và tính năng replication của PostgreSQL/MySQL từ những năm 2000s."
            - paragraph [ref=f81e6677]:
              - generic [ref=f81e6678]: Giải pháp
              - text: "Đồng bộ data giữa datacenter ở các region khác nhau. Đồng bộ (synchronous): strong consistency nhưng chậm. Bất đồng bộ (asynchronous): nhanh nhưng eventual consistency. Thường ghép với global load balancer route user tới region gần nhất và để failover khi region chết."
            - paragraph [ref=f81e6679]:
              - text: "Liên quan: consistency, cell-based,"
              - link "CDN" [ref=f81e6680] [cursor=pointer]:
                - /url: "#cdn"
          - article [ref=f81e6681]:
            - heading "Orchestration vs Choreography" [level=4] [ref=f81e6682]
            - paragraph [ref=f81e6683]: "còn gọi: điều phối vs biên đạo"
            - paragraph [ref=f81e6684]:
              - generic [ref=f81e6685]: Vấn đề
              - text: "Business transaction (đặt hàng → trừ kho → trừ tiền → giao hàng) cần nhiều service phối hợp. Orchestration: có một 'nhạc trưởng' điều khiển tất cả — dễ theo dõi nhưng nhạc trưởng thành single point of failure và bottleneck. Choreography: mỗi service tự biết khi nào làm gì qua event — loose coupling nhưng logic ẩn trong event flow, rất khó debug và không ai thấy được bức tranh toàn cảnh."
            - paragraph [ref=f81e6686]:
              - generic [ref=f81e6687]: Nguồn gốc
              - text: Mượn từ business process management (BPM); được mô tả trong pattern catalog của Chris Richardson (microservices.io) và Azure Architecture Center (choreography pattern).
            - paragraph [ref=f81e6688]:
              - generic [ref=f81e6689]: Giải pháp
              - text: "Orchestration: orchestrator phát lệnh tới từng service, nhận kết quả, quyết định bước tiếp theo — dễ trace nhưng coupling cao. Choreography: service A xong publish event, B lắng nghe và làm việc của B rồi publish tiếp cho C — không có điểm trung tâm nhưng phải dùng distributed tracing + correlation ID mới theo dõi được."
            - paragraph [ref=f81e6690]:
              - text: "Liên quan:"
              - link "event bus" [ref=f81e6691] [cursor=pointer]:
                - /url: "#event-bus"
              - text: ","
              - link "saga" [ref=f81e6692] [cursor=pointer]:
                - /url: "#saga"
              - text: ","
              - link "microservices" [ref=f81e6693] [cursor=pointer]:
                - /url: "#microservices"
          - article [ref=f81e6694]:
            - heading "Service Mesh" [level=4] [ref=f81e6695]
            - paragraph [ref=f81e6696]: "còn gọi: lưới dịch vụ"
            - paragraph [ref=f81e6697]:
              - generic [ref=f81e6698]: Vấn đề
              - text: 100 microservices đều cần retry, timeout, mTLS, tracing, rate limit. Nếu mỗi service tự implement thì 100 codebase khác nhau, không nhất quán, mỗi lần upgrade framework phải sửa cả trăm chỗ. Service mesh ra đời để tách networking logic ra khỏi app code, nhét vào layer hạ tầng.
            - paragraph [ref=f81e6699]:
              - generic [ref=f81e6700]: Nguồn gốc
              - text: "Linkerd (Buoyant, 2016) là service mesh mã nguồn mở đầu tiên — bản thân là 'Finagle wrapped in proxy form'; Istio (Google/IBM/Lyft, 2017) phổ biến hóa khái niệm. Trước đó là library thế hệ: Netflix Hystrix, Twitter Finagle, Google Stubby."
            - paragraph [ref=f81e6701]:
              - generic [ref=f81e6702]: Giải pháp
              - text: Mỗi service instance chạy kèm sidecar proxy (Envoy). Mọi traffic vào/ra đi qua proxy. Control plane push config, certificate, routing policy xuống proxy. App không sửa code vẫn có mTLS, retry, circuit breaking, metrics, traffic split (canary).
            - paragraph [ref=f81e6703]:
              - text: "Liên quan:"
              - link "sidecar" [ref=f81e6704] [cursor=pointer]:
                - /url: "#sidecar"
              - text: ","
              - link "service discovery" [ref=f81e6705] [cursor=pointer]:
                - /url: "#service-discovery"
              - text: ","
              - link "mTLS" [ref=f81e6706] [cursor=pointer]:
                - /url: "#mtls"
          - article [ref=f81e6707]:
            - heading "Sidecar" [level=4] [ref=f81e6708]
            - paragraph [ref=f81e6709]: "còn gọi: mẫu sidecar, sidecar container, pattern sidecar, container phụ"
            - paragraph [ref=f81e6710]:
              - generic [ref=f81e6711]: Vấn đề
              - text: App viết bằng 5 ngôn ngữ khác nhau, nhưng tất cả đều cần logging, metrics, mTLS, service discovery, retry. Viết lại cùng logic cho 5 ngôn ngữ thì tốn công và không nhất quán giữa các team. Sidecar ra đời để gắn một container phụ chạy cạnh app chính, lo cross-cutting concern đúng một lần bằng một ngôn ngữ.
            - paragraph [ref=f81e6712]:
              - generic [ref=f81e6713]: Nguồn gốc
              - text: Pattern được Microsoft mô tả trong Azure Architecture Center (Sidecar Pattern); phổ biến cùng Kubernetes (native sidecar containers) và service mesh (Istio, Linkerd).
            - paragraph [ref=f81e6714]:
              - generic [ref=f81e6715]: Giải pháp
              - text: Mỗi app instance chạy kèm một sidecar container cùng lifecycle, chia sẻ network namespace (gọi nhau qua localhost). Sidecar lo proxy traffic, collect metrics, inject headers, handle retry — app không cần biết sidecar tồn tại, không cần sửa code.
            - paragraph [ref=f81e6716]:
              - text: "Liên quan:"
              - link "service mesh" [ref=f81e6717] [cursor=pointer]:
                - /url: "#service-mesh"
