          - article [ref=f81e3203]:
            - heading "Phantom read" [level=4] [ref=f81e3204]
            - paragraph [ref=f81e3205]: "còn gọi: phantom"
            - paragraph [ref=f81e3206]:
              - generic [ref=f81e3207]: Vấn đề
              - text: Chạy cùng query hai lần trong transaction nhưng transaction khác đã insert nên bộ kết quả khác đi.
            - paragraph [ref=f81e3208]:
              - generic [ref=f81e3209]: Nguồn gốc
              - text: Định nghĩa trong tiêu chuẩn SQL-92
            - paragraph [ref=f81e3210]:
              - generic [ref=f81e3211]: Giải pháp
              - text: Serializable, predicate locking, hoặc SSI chặn insert mới dưới cùng bộ điều kiện quét.
            - paragraph [ref=f81e3212]:
              - text: "Liên quan:"
              - link "Isolation level" [ref=f81e3213] [cursor=pointer]:
                - /url: "#isolation-level"
              - text: ","
