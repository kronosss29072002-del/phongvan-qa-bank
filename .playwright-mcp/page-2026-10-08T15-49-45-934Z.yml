                - /url: "#flaky-test"
          - article [ref=f81e2082]:
            - heading "Fake" [level=4] [ref=f81e2083]
            - paragraph [ref=f81e2084]:
              - generic [ref=f81e2085]: Vấn đề
              - text: Khi stub đơn thuần quá đơn giản nhưng dùng phụ thuộc thật lại quá chậm (vd. dùng DB thật trong unit test), cần một triển khai thay thế có hành vi tương tự nhưng nhẹ.
            - paragraph [ref=f81e2086]:
              - generic [ref=f81e2087]: Nguồn gốc
              - text: Gerard Meszaros (xUnit Test Patterns)
            - paragraph [ref=f81e2088]:
              - generic [ref=f81e2089]: Giải pháp
              - text: "Triển khai một phiên bản đơn giản, hiệu quả hơn của phụ thuộc thật (ví dụ: in-memory database) nhưng vẫn tuân thủ cùng interface."
