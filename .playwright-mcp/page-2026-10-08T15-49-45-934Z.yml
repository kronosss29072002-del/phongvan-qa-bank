                - /url: "#fake"
              - text: ","
              - link "Spy" [ref=f81e2264] [cursor=pointer]:
                - /url: "#spy"
          - article [ref=f81e2265]:
            - heading "test pyramid" [level=4] [ref=f81e2266]
            - paragraph [ref=f81e2267]: "còn gọi: testing pyramid"
            - paragraph [ref=f81e2268]:
              - generic [ref=f81e2269]: Vấn đề
              - text: Nếu chỉ viết e2e, test chạy chậm, dễ flaky, khó maintain. Nếu chỉ viết unit, dễ bỏ sót tương tác. Cần cân bằng số lượng test theo tốc độ/độ tin cậy.
            - paragraph [ref=f81e2270]:
              - generic [ref=f81e2271]: Nguồn gốc
              - text: Martin Fowler (Test Pyramid) referencing Cohn/Beck ideas; popularized 2012
            - paragraph [ref=f81e2272]:
              - generic [ref=f81e2273]: Giải pháp
              - text: Ưu tiên nhiều unit (nhanh), vừa phải integration, ít e2e (chậm) để tối ưu feedback loop.
