            - heading "test data management" [level=4] [ref=f81e5511]
            - paragraph [ref=f81e5512]: "còn gọi: test data, TDM"
            - paragraph [ref=f81e5513]:
              - generic [ref=f81e5514]: Vấn đề
              - text: Dùng dữ liệu cố định gây xung đột khi chạy song song, khó tái tạo lỗi, khó maintain.
            - paragraph [ref=f81e5515]:
              - generic [ref=f81e5516]: Nguồn gốc
              - text: Enterprise testing practice
            - paragraph [ref=f81e5517]:
              - generic [ref=f81e5518]: Giải pháp
              - text: "Quản lý dữ liệu test: factory, builder, fixtures, data seeding per test. Ưu tiên dữ liệu per-test thay vì shared."
