          - article [ref=f81e3152]:
            - heading "Lock & deadlock" [level=4] [ref=f81e3153]
            - paragraph [ref=f81e3154]: "còn gọi: khóa dữ liệu, row lock, table lock, deadlock, SELECT FOR UPDATE, optimistic locking"
            - paragraph [ref=f81e3155]:
              - generic [ref=f81e3156]: Vấn đề
              - text: 2 transaction cùng sửa 1 dòng thì mất update (cùng ghi, ghi sau đè) hoặc đọc intermediate state. Khi A giữ lock dòng 1 chờ lock dòng 2, còn B giữ dòng 2 chờ dòng 1 — cả hai chờ nhau vĩnh viễn, transaction treo và connection pool cạn dần.
            - paragraph [ref=f81e3157]:
              - generic [ref=f81e3158]: Nguồn gốc
              - text: Không rõ tác giả duy nhất; locking/mutex là nền tảng computer science, deadlock detection có trong DB từ thập niên 1970 (System R, IBM)
            - paragraph [ref=f81e3159]:
              - generic [ref=f81e3160]: Giải pháp
              - text: Lock row/table chặn truy cập ghi đè khi có transaction khác đang xử lý; DB detect deadlock (đồ thị chờ có cycle) và abort 1 transaction để giải — application phải retry. Optimistic locking (version field) tránh khóa bằng cách fail nếu có người sửa giữa chừng.
            - paragraph [ref=f81e3161]:
              - text: "Liên quan:"
              - link "Isolation level" [ref=f81e3162] [cursor=pointer]:
                - /url: "#isolation-level"
              - text: ","
              - link "MVCC" [ref=f81e3163] [cursor=pointer]:
                - /url: "#mvcc"
              - text: ","
              - link "Transaction & ACID" [ref=f81e3164] [cursor=pointer]:
                - /url: "#transaction-acid"
          - article [ref=f81e3165]:
            - heading "N+1 problem" [level=4] [ref=f81e3166]
            - paragraph [ref=f81e3167]: "còn gọi: vấn đề N+1 query, N+1 select, lazy loading issue"
            - paragraph [ref=f81e3168]:
              - generic [ref=f81e3169]: Vấn đề
              - text: "Trang list 50 post hiển thị tác giả mỗi post: query 1 lấy posts, rồi loop 50 lần query tác giả = 51 round-trip thay vì 2. Dưới load thật, DB nhận hàng nghìn query thừa, latency tăng theo O(N) dù codetrông đẹp với ORM lazy loading."
            - paragraph [ref=f81e3170]:
              - generic [ref=f81e3171]: Nguồn gốc
              - text: Không rõ tác giả; thuật ngữ phổ biến qua cộng đồng ORM/Ruby on Rails (cuối thập niên 2000)
            - paragraph [ref=f81e3172]:
              - generic [ref=f81e3173]: Giải pháp
              - text: Gộp thành 1 query JOIN/include (WHERE author_id IN (...)) hoặc batch loading — giảm từ N+1 xuống tối đa 2-3 query. Nhận diện qua log query hoặc debug mode của ORM.
            - paragraph [ref=f81e3174]:
              - text: "Liên quan:"
              - link "ORM" [ref=f81e3175] [cursor=pointer]:
                - /url: "#orm"
              - text: ","
              - link "Connection pool" [ref=f81e3176] [cursor=pointer]:
                - /url: "#connection-pool"
              - text: ","
              - link "Query plan / EXPLAIN" [ref=f81e3177] [cursor=pointer]:
                - /url: "#query-plan-explain"
          - article [ref=f81e3178]:
            - heading "Normalization (1NF-3NF)" [level=4] [ref=f81e3179]
            - paragraph [ref=f81e3180]: "còn gọi: chuẩn hóa, normal form"
            - paragraph [ref=f81e3181]:
              - generic [ref=f81e3182]: Vấn đề
              - text: "Trùng lặp dữ liệu gây update anomaly: sửa một chỗ thì chỗ khác không theo."
            - paragraph [ref=f81e3183]:
              - generic [ref=f81e3184]: Nguồn gốc
              - text: Codd 1970 (1NF), Fagin 1974 (3NF)
            - paragraph [ref=f81e3185]:
              - generic [ref=f81e3186]: Giải pháp
              - text: 1NF loại giá trị lồng, 2NF bỏ phụ thuộc một phần, 3NF bỏ phụ thuộc chuyển tiếp; mỗi sự kiện chỉ ghi một nơi.
            - paragraph [ref=f81e3187]:
              - text: "Liên quan:"
              - link "Denormalization" [ref=f81e3188] [cursor=pointer]:
                - /url: "#denormalization"
              - text: ","
              - link "Primary key vs Secondary index" [ref=f81e3189] [cursor=pointer]:
                - /url: "#primary-key-vs-secondary-index"
          - article [ref=f81e3190]:
            - heading "Partitioning (horizontal / vertical)" [level=4] [ref=f81e3191]
            - paragraph [ref=f81e3192]: "còn gọi: phân mảnh dữ liệu, horizontal partitioning, vertical partitioning, table partition"
            - paragraph [ref=f81e3193]:
              - generic [ref=f81e3194]: Vấn đề
              - text: Bảng orders 500 triệu dòng thì index phình to, backup/quét dữ liệu chậm, query chạm mọi partition dù chỉ cần tháng này — 1 table quá lớn làm mọi thao tác trên nó đều chậm và khó quản lý.
            - paragraph [ref=f81e3195]:
              - generic [ref=f81e3196]: Nguồn gốc
              - text: Không rõ tác giả — tính năng partitioning xuất hiện sớm trong Oracle (1996-97) và DB2, trước khi có khái niệm sharding phân tán
            - paragraph [ref=f81e3197]:
              - generic [ref=f81e3198]: Giải pháp
              - text: "Horizontal: chia dòng theo khoá (user_id, date) — mỗi phần nằm ở file/segment riêng, query lọc theo khoá chỉ đụng đúng partition. Vertical: chia cột (tách field ít dùng sang bảng riêng). Giảm kích thước đơn vị thao tác."
            - paragraph [ref=f81e3199]:
              - text: "Liên quan:"
              - link "Sharding & consistent hashing" [ref=f81e3200] [cursor=pointer]:
                - /url: "#sharding-consistent-hashing"
              - text: ","
              - link "Index (B-tree, hash, composite)" [ref=f81e3201] [cursor=pointer]:
