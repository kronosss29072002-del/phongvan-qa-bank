              - link "Capacity Planning" [ref=f81e1708] [cursor=pointer]:
                - /url: "#capacity-planning"
              - text: ","
              - link "Replication Lag Tolerance" [ref=f81e1709] [cursor=pointer]:
                - /url: "#replication-lag-tolerance"
          - article [ref=f81e1710]:
            - heading "Retry" [level=4] [ref=f81e1711]
            - paragraph [ref=f81e1712]: "còn gọi: tái thử, retry policy"
            - paragraph [ref=f81e1713]:
              - generic [ref=f81e1714]: Vấn đề
              - text: Lỗi mạng tạm thời hoặc backend chậm đôi lần làm request bị fail dù hệ thống vẫn sống.
            - paragraph [ref=f81e1715]:
              - generic [ref=f81e1716]: Giải pháp
              - text: Gọi lại thao tác thất bại sau một khoảng trễ. Chỉ nên retry lỗi tạm thời (timeout, 502/503), chỉ retry idempotent (hoặc có idempotency key); retry ở nhiều tầng cùng lúc nhân số request lên (3 tầng × 3 lần = 64 lần gọi DB cho 1 hành động của user — ví dụ trong Google SRE Book ch.22).
