              - link "Deadlock" [ref=f81e1269] [cursor=pointer]:
                - /url: "#deadlock"
        - generic [ref=f81e1270]:
          - heading "Messaging & Bất đồng bộ 8" [level=3] [ref=f81e1271]:
            - text: Messaging & Bất đồng bộ
            - generic [ref=f81e1272]: "8"
          - article [ref=f81e1273]:
            - heading "Fan-out / Fan-in" [level=4] [ref=f81e1274]
            - paragraph [ref=f81e1275]: "còn gọi: scatter-gather, fanout, rải tụ"
            - paragraph [ref=f81e1276]:
              - generic [ref=f81e1277]: Vấn đề
              - text: Tweet mới phải vào timeline của 500k follower — xử lý tuần tự trong request thì mất hàng phút, follower không thấy gì; hoặc job index 10 triệu bản ghi chạy một thread thì nửa đêm vẫn chưa xong.
            - paragraph [ref=f81e1278]:
              - generic [ref=f81e1279]: Giải pháp
              - text: Fan-out rải việc (hoặc bản sao tin nhắn) cho nhiều worker xử lý song song (scatter), fan-in gom kết quả các nhánh về một nơi (gather) để trả kết quả hoặc ghi tổng hợp.
            - paragraph [ref=f81e1280]:
              - text: "Liên quan:"
              - link "Pub/Sub" [ref=f81e1281] [cursor=pointer]:
                - /url: "#pub-sub"
              - text: ","
              - link "Message queue" [ref=f81e1282] [cursor=pointer]:
                - /url: "#message-queue"
              - text: ","
              - link "Competing consumers" [ref=f81e1283] [cursor=pointer]:
                - /url: "#competing-consumers"
              - text: ","
              - link "Stream processing vs batch" [ref=f81e1284] [cursor=pointer]:
                - /url: "#stream-processing-vs-batch"
          - article [ref=f81e1285]:
            - heading "FIFO / Message ordering" [level=4] [ref=f81e1286]
            - paragraph [ref=f81e1287]: "còn gọi: FIFO queue, message ordering, thứ tự tin nhắn"
            - paragraph [ref=f81e1288]:
              - generic [ref=f81e1289]: Vấn đề
              - text: Worker xử lý song song khiến event 'khách đã chuyển khoản' đến TRƯỚC event 'đơn được tạo' do hai luồng khác lane, xử lý đảo thứ tự nên đơn bị tính sai trạng thái; queue chuẩn (standard queue) còn không giữ thứ tự qua các lần redelivery.
            - paragraph [ref=f81e1290]:
              - generic [ref=f81e1291]: Giải pháp
              - text: "Gom tin nhắn cùng khoá (message group, partition) và ép tuần tự trong nhóm đó — tin sau chờ tin trước xong; đánh đổi: tiến độ nhóm bị chặn bởi nút chậm nhất (head-of-line blocking)."
            - paragraph [ref=f81e1292]:
              - text: "Liên quan:"
              - link "Kafka topic / partition / consumer group" [ref=f81e1293] [cursor=pointer]:
                - /url: "#kafka-topic-partition-consumer-group"
              - text: ","
              - link "Idempotent consumer" [ref=f81e1294] [cursor=pointer]:
                - /url: "#idempotent-consumer"
              - text: ","
              - link "Message queue" [ref=f81e1295] [cursor=pointer]:
                - /url: "#message-queue"
          - article [ref=f81e1296]:
            - heading "Message broker" [level=4] [ref=f81e1297]
            - paragraph [ref=f81e1298]: "còn gọi: broker, trung gian tin nhắn, message-oriented middleware"
            - paragraph [ref=f81e1299]:
              - generic [ref=f81e1300]: Vấn đề
              - text: 5 service giao tiếp trực tiếp thì mỗi cặp giữ kết nối riêng, phải biết địa chỉ nhau; một service đổi địa chỉ hoặc crash thì các bên gửi treo hoặc mất dữ liệu — không ai lưu hộ tin nhắn chờ người nhận quay lại.
            - paragraph [ref=f81e1301]:
              - generic [ref=f81e1302]: Giải pháp
              - text: "Broker (RabbitMQ, Kafka, SQS) đứng giữa: nhận, lưu (store-and-forward) và route tin nhắn theo queue/topic tới người nhận sẵn sàng — mọi thứ chỉ kết nối tới một điểm trung tâm."
            - paragraph [ref=f81e1303]:
              - text: "Liên quan:"
              - link "Message queue" [ref=f81e1304] [cursor=pointer]:
                - /url: "#message-queue"
              - text: ", RabbitMQ,"
              - link "Apache Kafka" [ref=f81e1305] [cursor=pointer]:
                - /url: "#apache-kafka"
              - text: ","
              - link "Pub/Sub" [ref=f81e1306] [cursor=pointer]:
                - /url: "#pub-sub"
          - article [ref=f81e1307]:
            - heading "Message queue" [level=4] [ref=f81e1308]
            - paragraph [ref=f81e1309]: "còn gọi: hàng đợi tin nhắn, message-oriented middleware, MOM"
            - paragraph [ref=f81e1310]:
              - generic [ref=f81e1311]: Vấn đề
              - text: "Team làm API gửi email xác nhận ngay trong luồng request HTTP: lúc traffic cao, SMTP chậm khiến request treo và timeout, user thấy lỗi dù đơn hàng đã lưu. Gọi thẳng sang service khác thì service đó sập là mất việc kèm theo, không ai giữ hộ tin nhắn chờ."
            - paragraph [ref=f81e1312]:
              - generic [ref=f81e1313]: Nguồn gốc
              - text: IBM MQ (MQSeries) là thương mại hóa sớm nhất; hàng đợi tin nhắn đã có trong RTOS thập niên 1980 (VRTX, pSOS+)
            - paragraph [ref=f81e1314]:
              - generic [ref=f81e1315]: Giải pháp
              - text: Producer đẩy tin nhắn vào hàng đợi giữa chừng rồi trả lời client ngay; worker tách riêng lấy tin ra xử lý — áp lực đỉnh bị hàng đợi giữ (buffer), việc xử lý nền không kéo sập request path.
            - paragraph [ref=f81e1316]:
              - text: "Liên quan:"
              - link "Message broker" [ref=f81e1317] [cursor=pointer]:
                - /url: "#message-broker"
              - text: ","
              - link "Pub/Sub" [ref=f81e1318] [cursor=pointer]:
                - /url: "#pub-sub"
              - text: ","
              - link "Competing consumers" [ref=f81e1319] [cursor=pointer]:
                - /url: "#competing-consumers"
              - text: ","
              - link "Dead letter queue" [ref=f81e1320] [cursor=pointer]:
                - /url: "#dead-letter-queue"
          - article [ref=f81e1321]:
            - heading "Polling" [level=4] [ref=f81e1322]
            - paragraph [ref=f81e1323]: "còn gọi: hỏi thăm, long polling"
            - paragraph [ref=f81e1324]:
              - generic [ref=f81e1325]: Vấn đề
              - text: Trang cần hiển thị notification mới nhưng HTTP là request/response — không ai báo khi server có gì; client hỏi mỗi giây thì server gánh hàng nghìn GET rỗng, hỏi thưa thì user thấy trễ.
            - paragraph [ref=f81e1326]:
              - generic [ref=f81e1327]: Giải pháp
              - text: Client định kỳ GET kiểm tra thay đổi (dùng ETag/If-None-Match cho nhẹ); long polling giữ request mở tới khi có dữ liệu hoặc timeout để giảm số lần hỏi.
            - paragraph [ref=f81e1328]:
              - text: "Liên quan:"
              - link "Webhook" [ref=f81e1329] [cursor=pointer]:
                - /url: "#webhook"
              - text: ", Server-Sent Events,"
              - link "WebSocket" [ref=f81e1330] [cursor=pointer]:
                - /url: "#websocket"
          - article [ref=f81e1331]:
            - heading "Pub/Sub" [level=4] [ref=f81e1332]
            - paragraph [ref=f81e1333]: "còn gọi: publish-subscribe, đăng ký phát, topic"
            - paragraph [ref=f81e1334]:
              - generic [ref=f81e1335]: Vấn đề
              - text: Log service muốn ghi log mọi sự kiện, search indexer và analytics cũng muốn; nếu mỗi sự kiện gọi thẳng từng consumer thì service sinh sự kiện phải biết và sửa code mỗi khi thêm consumer mới — coupling 1-1 tăng theo số người đọc.
            - paragraph [ref=f81e1336]:
              - generic [ref=f81e1337]: Nguồn gốc
              - text: Hệ thống 'news' của Isis Toolkit (Birman & Joseph, trình bày tại SOSP '87) là một trong những pub/sub công khai đầu tiên
            - paragraph [ref=f81e1338]:
              - generic [ref=f81e1339]: Giải pháp
              - text: Publisher publish vào topic chung, subscriber tự đăng ký topic mình cần — một publish chạm n subscriber, bên gửi không cần biết bên nhận là ai hay đã tồn tại chưa.
            - paragraph [ref=f81e1340]:
              - text: "Liên quan:"
              - link "Message broker" [ref=f81e1341] [cursor=pointer]:
                - /url: "#message-broker"
              - text: ","
              - link "Fan-out / Fan-in" [ref=f81e1342] [cursor=pointer]:
                - /url: "#fan-out-fan-in"
              - text: ","
              - link "Event-driven architecture" [ref=f81e1343] [cursor=pointer]:
                - /url: "#event-driven-architecture"
              - text: ","
              - link "Apache Kafka" [ref=f81e1344] [cursor=pointer]:
                - /url: "#apache-kafka"
          - article [ref=f81e1345]:
            - heading "Retry với exponential backoff & jitter" [level=4] [ref=f81e1346]
            - paragraph [ref=f81e1347]: "còn gọi: exponential backoff, jitter, retry, thử lại có lùi giờ"
            - paragraph [ref=f81e1348]:
              - generic [ref=f81e1349]: Vấn đề
              - text: Call API phụ chợt timeout 5 giây do service restart — bỏ qua thì mất việc; nhưng 1000 client cùng retry sau đúng 1 giây thì service đang yếu bị ném thêm 1000 request cùng lúc (thundering herd / retry storm) và chết hẳn.
            - paragraph [ref=f81e1350]:
              - generic [ref=f81e1351]: Giải pháp
              - text: Chờ tăng theo cấp số nhân (1s→2s→4s, có cap) để service có thời gian hồi phục; thêm jitter ngẫu nhiên để các client không bắn retry cùng một thời điểm.
            - paragraph [ref=f81e1352]:
              - text: "Liên quan:"
              - link "Idempotency" [ref=f81e1353] [cursor=pointer]:
                - /url: "#idempotency"
              - text: ","
              - link "Dead letter queue" [ref=f81e1354] [cursor=pointer]:
                - /url: "#dead-letter-queue"
              - text: ","
              - link "Message queue" [ref=f81e1355] [cursor=pointer]:
                - /url: "#message-queue"
          - article [ref=f81e1356]:
            - heading "Webhook" [level=4] [ref=f81e1357]
            - paragraph [ref=f81e1358]: "còn gọi: HTTP callback, web hook"
            - paragraph [ref=f81e1359]:
              - generic [ref=f81e1360]: Vấn đề
              - text: Ứng dụng cần biết ngay khi Stripe trừ tiền thành công hay GitHub push code — polling Stripe mỗi 5 giây thì vừa trễ vừa tốn quota, trong khi bạn không muốn giữ kết nối dài hạn tới từng nhà cung cấp.
            - paragraph [ref=f81e1361]:
              - generic [ref=f81e1362]: Nguồn gốc
              - text: Jeff Lindsay, 2007 — bài blog 'Web hook to revolutionize the web'
            - paragraph [ref=f81e1363]:
              - generic [ref=f81e1364]: Giải pháp
              - text: Bạn đăng ký URL callback; khi sự kiện xảy ra, server bên kia tự POST HTTP tới URL đó — push đúng lúc, chỉ dùng HTTP nên không cần hạ tầng mới; cần ký HMAC để chống giả mạo và replay.
            - paragraph [ref=f81e1365]:
