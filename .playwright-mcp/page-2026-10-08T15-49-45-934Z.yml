          - article [ref=f81e7358]:
            - heading "HPA (Horizontal Pod Autoscaler)" [level=4] [ref=f81e7359]
            - paragraph [ref=f81e7360]: "còn gọi: Horizontal Pod Autoscaler, autoscaling, tự động scale ngang, HPA"
            - paragraph [ref=f81e7361]:
              - generic [ref=f81e7362]: Vấn đề
              - text: "Số pod cố định từ trước: đêm giao thừa hay Black Friday traffic x10, CPU chạm 95% và user thấy timeout; báo ops tăng replica thì mất 10-20 phút qua ticket, xong lại quên giảm khi traffic về — chi phí đội lên mà SLO vẫn vỡ."
            - paragraph [ref=f81e7363]:
              - generic [ref=f81e7364]: Nguồn gốc
              - text: Là autoscaling API của Kubernetes, có từ các version đầu; về sau mở rộng cho custom/external metrics (metrics-server, Prometheus adapter).
            - paragraph [ref=f81e7365]:
              - generic [ref=f81e7366]: Giải pháp
              - text: HPA quan sát metrics (CPU/memory, custom từ Prometheus, external) theo chu kỳ, tính số replica cần để chạm target rồi tự sửa replicas của workload — scale ngang nhiều bản, không chờ người; kết hợp với min/maxReplicas để không bao giờ scale vô hạn.
            - paragraph [ref=f81e7367]:
              - text: "Liên quan: deployment & replica,"
              - link "Kubernetes" [ref=f81e7368] [cursor=pointer]:
                - /url: "#kubernetes"
              - text: ","
              - link "pod" [ref=f81e7369] [cursor=pointer]:
                - /url: "#pod"
              - text: ", scheduler"
          - article [ref=f81e7370]:
            - heading "Immutable infrastructure" [level=4] [ref=f81e7371]
            - paragraph [ref=f81e7372]: "còn gọi: hạ tầng bất biến, immutable server, cattle not pets, infrastructure bất biến"
            - paragraph [ref=f81e7373]:
              - generic [ref=f81e7374]: Vấn đề
              - text: "Server sống hàng tháng bị patch tay, cài package, sửa cấu hình trực tiếp: không server nào giống server nào, không thể reproduce lỗi ở môi trường khác, và mỗi lần vá là một mission có thể làm hỏng thứ đang chạy — vì server đã biến thành 'con thú cưng' không ai dám đụng."
            - paragraph [ref=f81e7375]:
              - generic [ref=f81e7376]: Nguồn gốc
              - text: Thuật ngữ 'immutable infrastructure' do Chad Fowler đặt trong bài blog 'Trash Your Servers and Burn Your Code' năm 2013 (theo O'Reilly).
            - paragraph [ref=f81e7377]:
              - generic [ref=f81e7378]: Giải pháp
              - text: "Không bao giờ sửa server đang sống: mọi thay đổi (code, config, patch) đều tạo image/version mới, rồi thay cả cụm bằng bản mới; rollback = quay về image trước đó. Máy hỏng thì thay bằng instance dựng từ image, không 'vá lại cái cũ'."
