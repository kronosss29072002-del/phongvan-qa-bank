        - generic [ref=f81e1771]:
          - heading "Bảo mật & Xác thực 18" [level=3] [ref=f81e1772]:
            - text: Bảo mật & Xác thực
            - generic [ref=f81e1773]: "18"
          - article [ref=f81e1774]:
            - heading "authentication vs authorization" [level=4] [ref=f81e1775]
            - paragraph [ref=f81e1776]: "còn gọi: authN vs authZ, Authentication vs Authorization (Authn vs AuthZ), xác thực vs phân quyền, định danh và truy cập"
            - paragraph [ref=f81e1777]:
              - generic [ref=f81e1778]: Vấn đề
              - text: "Khi web app mới xuất hiện, chỉ cần 'ai là ai' (authentication) thôi chưa đủ — hệ thống cũng phải biết 'ai được làm gì' (authorization). Nếu không phân biệt rõ, dễ cấp quyền sai hoặc chặn nhầm người dùng hợp lệ. Người mới xây API thường gộp 'đăng nhập' và 'được phép làm gì' thành một khái niệm login. Hệ quả thực tế: endpoint kiểm tra 'user đã đăng nhập' rồi cho mọi user đọc/xóa dữ liệu của user khác, hoặc khi sửa code auth không biết mình đang sửa khâu nào vì code lẫn lộn. Hai câu hỏi khác nhau — 'bạn là ai' vs 'bạn được làm gì' — cần tách bạch từ đầu."
            - paragraph [ref=f81e1779]:
              - generic [ref=f81e1780]: Nguồn gốc
              - text: General access control model (early multi-user systems)
            - paragraph [ref=f81e1781]:
              - generic [ref=f81e1782]: Giải pháp
              - text: Authentication xác minh danh tính (username/password, token), authorization quyết định quyền truy cập tài nguyên sau khi đã xác minh. Authentication xác minh danh tính (password, token, MFA) và trả về identity; Authorization diễn ra sau đó, quyết định identity đó được thực hiện hành động nào trên tài nguyên nào (policy/permission check).
            - paragraph [ref=f81e1783]:
              - text: "Liên quan:"
              - link "session-based auth" [ref=f81e1784] [cursor=pointer]:
                - /url: "#session-based-auth"
              - text: ","
              - link "RBAC" [ref=f81e1785] [cursor=pointer]:
                - /url: "#rbac"
              - text: ","
              - link "least privilege" [ref=f81e1786] [cursor=pointer]:
                - /url: "#least-privilege"
              - text: ", Session,"
              - link "OAuth 2.0" [ref=f81e1787] [cursor=pointer]:
                - /url: "#oauth-2-0"
          - article [ref=f81e1788]:
            - heading "bcrypt" [level=4] [ref=f81e1789]
            - paragraph [ref=f81e1790]:
              - generic [ref=f81e1791]: Vấn đề
              - text: Trước bcrypt, web dùng MD5/SHA-1 để hash mật khẩu — chúng là hash nhanh, thiết kế để tính toán nhiều lần trên giây, hoàn toàn ngược với nhu cầu hash mật khẩu. Attacker với GPU đập được hàng tỷ hash mỗi giây nên mật khẩu yếu chỉ sống sót vài giây khi database lộ.
            - paragraph [ref=f81e1792]:
              - generic [ref=f81e1793]: Nguồn gốc
              - text: Niels Provos và David Mazières, USENIX 1999
            - paragraph [ref=f81e1794]:
              - generic [ref=f81e1795]: Giải pháp
              - text: "Dựa trên Blowfish, hàm adaptive: tham số cost (2^cost vòng lặp) tăng được theo thời gian, kèm salt ngẫu nhiên 16 byte — mỗi lần verify cố ý chậm lại để brute-force offline trở nên đắt đỏ."
            - paragraph [ref=f81e1796]:
              - text: "Liên quan:"
              - link "Password hashing" [ref=f81e1797] [cursor=pointer]:
                - /url: "#password-hashing"
              - text: ","
              - link "Salt" [ref=f81e1798] [cursor=pointer]:
                - /url: "#salt"
              - text: ","
              - link "Argon2" [ref=f81e1799] [cursor=pointer]:
                - /url: "#argon2"
          - article [ref=f81e1800]:
            - heading "CORS vs CSRF" [level=4] [ref=f81e1801]
            - paragraph [ref=f81e1802]:
              - generic [ref=f81e1803]: Vấn đề
              - text: Browser thực thi Same-Origin Policy để bảo vệ, nhưng app frontend cần gọi API cross-origin. Đồng thời, browser tự động gửi cookie khiến request giả mạo từ trang khác có thể hành động thay user (CSRF). Cần phân biệt rõ hai vấn đề.
            - paragraph [ref=f81e1804]:
              - generic [ref=f81e1805]: Nguồn gốc
              - text: Same-Origin Policy; CSRF described in security literature (early 2000s)
            - paragraph [ref=f81e1806]:
              - generic [ref=f81e1807]: Giải pháp
              - text: CORS (server opt-in qua HTTP headers) quyết định trình duyệt có cho JS đọc response cross-origin không. CSRF là tấn công khiến user vô tình gửi request có cookie; phòng bằng CSRF token, SameSite cookie.
            - paragraph [ref=f81e1808]:
              - text: "Liên quan:"
              - link "session-based auth" [ref=f81e1809] [cursor=pointer]:
                - /url: "#session-based-auth"
              - text: ","
              - link "XSS" [ref=f81e1810] [cursor=pointer]:
                - /url: "#xss"
          - article [ref=f81e1811]:
            - heading "Cross-Origin Resource Sharing (CORS)" [level=4] [ref=f81e1812]
            - paragraph [ref=f81e1813]:
              - generic [ref=f81e1814]: Vấn đề
              - text: "Same-origin policy chặn JS đọc response từ domain khác, nhưng SPA frontend ở `app.example.com` lại cần gọi API `api.example.com` — không có cơ chế cho phép có kiểm soát thì developer buộc phải đặt chung origin hoặc mở proxy chết người. Thiếu CORS đúng thì tính năng 'gọi API chéo origin' không hoạt động; CORS sai (`*` + credentials) thì lộ data cho site lạ."
            - paragraph [ref=f81e1815]:
              - generic [ref=f81e1816]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1817]:
              - generic [ref=f81e1818]: Giải pháp
              - text: "Server trả header `Access-Control-Allow-Origin` (và Allow-Methods/Headers/Credentials) như consent có chủ đích; request 'độc' (POST, custom header)kích hoạt preflight OPTIONS trước. CORS enforced bởi trình duyệt, bảo người dùng chứ không bảo server khỏi CSRF."
            - paragraph [ref=f81e1819]: "Liên quan: CSRF, Session"
          - article [ref=f81e1820]:
            - heading "Cross-Site Request Forgery (CSRF)" [level=4] [ref=f81e1821]
            - paragraph [ref=f81e1822]: "còn gọi: giả mạo yêu cầu chéo trang"
            - paragraph [ref=f81e1823]:
              - generic [ref=f81e1824]: Vấn đề
              - text: "Trình duyệt tự gắn cookie phiên khi gửi request sang site khác, nên site xấu chèn `<img src=\"bank.com/transfer?to=attacker\">` vẫn chạy với quyền của nạn nhân đang đăng nhập bank.com — server thấy cookie hợp lệ và không phân biệt được request thật do user bấm vs request bị site khác ép gửi."
            - paragraph [ref=f81e1825]:
              - generic [ref=f81e1826]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1827]:
              - generic [ref=f81e1828]: Giải pháp
              - text: Token đồng bộ (server phát token ẩn trong form/header, đối chiếu khi nhận), double-submit cookie, và SameSite cookie attr — mỗi lớp chặn một phần đường gửi cookie ngầm.
            - paragraph [ref=f81e1829]:
              - text: "Liên quan:"
              - link "SameSite cookie" [ref=f81e1830] [cursor=pointer]:
                - /url: "#samesite-cookie"
              - text: ","
              - link "CORS" [ref=f81e1831] [cursor=pointer]:
                - /url: "#cors"
              - text: ","
              - link "XSS" [ref=f81e1832] [cursor=pointer]:
                - /url: "#xss"
          - article [ref=f81e1833]:
            - heading "Cross-Site Scripting (XSS)" [level=4] [ref=f81e1834]
            - paragraph [ref=f81e1835]: "còn gọi: chèn script chéo trang"
            - paragraph [ref=f81e1836]:
              - generic [ref=f81e1837]: Vấn đề
              - text: Server render user input (tên hiển thị, comment) vào HTML mà không encode, trình duyệt giao đoạn script của attacker chạy trong phiên của nạn nhân. Kẻ tấn công ăn cắp cookie/session, giả mạo nạn nhân, keylog ngay trong trang 'tin tưởng' — mức nghiêm trọng ngang SQLi nhưng nhắm vào trình duyệt thay vì database.
            - paragraph [ref=f81e1838]:
              - generic [ref=f81e1839]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1840]:
              - generic [ref=f81e1841]: Giải pháp
              - text: Encode theo từng ngữ cảnh (HTML/JS/URL/CSS) tại điểm render, sanitize HTML do user tạo bằng thư viện như DOMPurify, và dùng Content Security Policy làm lớp phòng thủ thứ hai.
            - paragraph [ref=f81e1842]: "Liên quan: CSRF, Content Security Policy"
          - article [ref=f81e1843]:
            - heading "encryption symmetric vs asymmetric" [level=4] [ref=f81e1844]
            - paragraph [ref=f81e1845]:
              - generic [ref=f81e1846]: Vấn đề
              - text: Cần mã hóa dữ liệu trong truyền tải/lưu trữ. Symmetric nhanh nhưng khó phân phối key; asymmetric dùng cặp public/private giúp trao đổi key/xác thực nhưng chậm hơn.
            - paragraph [ref=f81e1847]:
              - generic [ref=f81e1848]: Nguồn gốc
              - text: Diffie–Hellman (1976), RSA (1978)
            - paragraph [ref=f81e1849]:
              - generic [ref=f81e1850]: Giải pháp
              - text: "Symmetric: cùng key mã hóa/giải mã (AES). Asymmetric: public key mã hóa, private key giải mã (RSA/ECDSA); ngược lại dùng cho signature."
            - paragraph [ref=f81e1851]:
              - text: "Liên quan:"
              - link "TLS handshake" [ref=f81e1852] [cursor=pointer]:
                - /url: "#tls-handshake"
              - text: ","
              - link "certificate" [ref=f81e1853] [cursor=pointer]:
                - /url: "#certificate"
              - text: ","
              - link "digital signature" [ref=f81e1854] [cursor=pointer]:
                - /url: "#digital-signature"
          - article [ref=f81e1855]:
            - heading "Multi-Factor Authentication (MFA)" [level=4] [ref=f81e1856]
            - paragraph [ref=f81e1857]: "còn gọi: xác thực đa yếu tố, 2FA"
            - paragraph [ref=f81e1858]:
              - generic [ref=f81e1859]: Vấn đề
              - text: "Mật khẩu một mình đã thất bại ở quy mô lớn: phishing, credential stuffing từ database site khác, mật khẩu yếu — Microsoft phân tích cho thấy MFA chặn được 99,9% các vụ account compromise. Cần thứ gì đó 'attacker không có' ngoài mật khẩu đã bị đánh cắp."
            - paragraph [ref=f81e1860]:
              - generic [ref=f81e1861]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1862]:
              - generic [ref=f81e1863]: Giải pháp
              - text: Yêu cầu kết hợp 2 trong 3 loại yếu tố (biết — mật khẩu/PIN; có — phone/hardware key; là — sinh trắc) trước khi vào tài khoản, nên chiếm được mật khẩu vẫn không đăng nhập được.
            - paragraph [ref=f81e1864]:
              - text: "Liên quan:"
              - link "Password hashing" [ref=f81e1865] [cursor=pointer]:
                - /url: "#password-hashing"
              - text: ", Rate limiting"
          - article [ref=f81e1866]:
            - heading "password hashing" [level=4] [ref=f81e1867]
            - paragraph [ref=f81e1868]: "còn gọi: băm mật khẩu, password hash"
            - paragraph [ref=f81e1869]:
              - generic [ref=f81e1870]: Vấn đề
              - text: Nếu lưu password dạng plaintext, một khi database bị leak, toàn bộ tài khoản bị mất ngay. Cần biến đổi password thành dạng không thể đảo ngược để so sánh khi login.
            - paragraph [ref=f81e1871]:
              - generic [ref=f81e1872]: Nguồn gốc
              - text: UNIX password storage (DES crypt) evolved to salted hashes
            - paragraph [ref=f81e1873]:
              - generic [ref=f81e1874]: Giải pháp
              - text: Dùng hash function chuyên biệt cho password (bcrypt/scrypt/argon2) với salt để tạo digest; login so sánh digest.
            - paragraph [ref=f81e1875]:
              - text: "Liên quan:"
              - link "salting" [ref=f81e1876] [cursor=pointer]:
                - /url: "#salting"
              - text: ","
              - link "rainbow table" [ref=f81e1877] [cursor=pointer]:
                - /url: "#rainbow-table"
              - text: ","
              - link "brute force + rate limiting" [ref=f81e1878] [cursor=pointer]:
                - /url: "#brute-force-rate-limiting"
              - text: ","
              - link "bcrypt" [ref=f81e1879] [cursor=pointer]:
                - /url: "#bcrypt"
              - text: ","
              - link "Argon2" [ref=f81e1880] [cursor=pointer]:
                - /url: "#argon2"
              - text: ","
              - link "Salt" [ref=f81e1881] [cursor=pointer]:
                - /url: "#salt"
              - text: ","
              - link "Rainbow table" [ref=f81e1882] [cursor=pointer]:
                - /url: "#rainbow-table"
          - article [ref=f81e1883]:
            - heading "Principle of Least Privilege (PoLP)" [level=4] [ref=f81e1884]
            - paragraph [ref=f81e1885]: "còn gọi: nguyên tắc đặc quyền tối thiểu"
            - paragraph [ref=f81e1886]:
              - generic [ref=f81e1887]: Vấn đề
              - text: Cho mọi service/user quyền admin 'cho đỡ phải sửa quyền sau này' — khi một tài khoản bị xâm phạm, attacker hưởng trọn toàn bộ quyền đó (database read-write cả bảng, xóa production...). Thiếu nguyên tắc này thì mọi sự cố nhỏ đều leo thang thành sự cố toàn hệ thống.
            - paragraph [ref=f81e1888]:
              - generic [ref=f81e1889]: Nguồn gốc
              - text: Jerome Saltzer và Michael Schroeder, "The protection of information in computer systems", Proceedings of the IEEE, 1975
            - paragraph [ref=f81e1890]:
              - generic [ref=f81e1891]: Giải pháp
              - text: Mỗi chương trình/user chỉ nhận đúng đặc quyền cần cho công việc cụ thể, chia nhỏ service account theo endpoint, review định kỳ; giảm bề mặt tấn công và blast radius của mỗi sự cố.
            - paragraph [ref=f81e1892]:
              - text: "Liên quan:"
              - link "RBAC" [ref=f81e1893] [cursor=pointer]:
                - /url: "#rbac"
              - text: ","
              - link "Secrets management" [ref=f81e1894] [cursor=pointer]:
                - /url: "#secrets-management"
          - article [ref=f81e1895]:
            - heading "rainbow table" [level=4] [ref=f81e1896]
            - paragraph [ref=f81e1897]: "còn gọi: bảng cầu vồng, precomputed hash table"
            - paragraph [ref=f81e1898]:
              - generic [ref=f81e1899]: Vấn đề
              - text: Attacker cần nhanh chóng đảo ngược hash thành plaintext sau khi có database leak. Brute force chậm, nên sinh bảng precomputed (space-time tradeoff) để tra ngược nhanh.
            - paragraph [ref=f81e1900]:
              - generic [ref=f81e1901]: Nguồn gốc
              - text: Martin Hellman (1980) time-memory tradeoff; Philippe Oechslin (2003) rainbow tables
            - paragraph [ref=f81e1902]:
              - generic [ref=f81e1903]: Giải pháp
              - text: Precompute chains (hash+reduce) từ passwords, chỉ lưu start/end. Khi có hash cần crack, tìm chain chứa hash rồi dựng lại plaintext.
            - paragraph [ref=f81e1904]:
              - text: "Liên quan:"
              - link "salting" [ref=f81e1905] [cursor=pointer]:
                - /url: "#salting"
              - text: ","
              - link "password hashing" [ref=f81e1906] [cursor=pointer]:
                - /url: "#password-hashing"
              - text: ","
              - link "Salt" [ref=f81e1907] [cursor=pointer]:
                - /url: "#salt"
              - text: ","
              - link "Password hashing" [ref=f81e1908] [cursor=pointer]:
                - /url: "#password-hashing"
          - article [ref=f81e1909]:
            - heading "Rate limiting / login throttling" [level=4] [ref=f81e1910]
            - paragraph [ref=f81e1911]: "còn gọi: giới hạn tần suất đăng nhập, brute force protection"
            - paragraph [ref=f81e1912]:
              - generic [ref=f81e1913]: Vấn đề
              - text: Không giới hạn số lần thử mật khẩu thì attacker chạy dictionary/brute-force thoải mái; tệ hơn là credential stuffing (danh sách user/pass rò rỉ từ site khác) và password spraying (1 mật khẩu yếu thử hàng nghìn account) — cả hai tấn công hàng loạt mà không site nào chặn vì mỗi IP/account chỉ thử vài lần.
            - paragraph [ref=f81e1914]:
              - generic [ref=f81e1915]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1916]:
              - generic [ref=f81e1917]: Giải pháp
              - text: Chốt số lần thử thất bại theo account (không theo IP để né distributed attack), khóa theo bậc thang/exponential backoff, MFA và blocklist mật khẩu đã rò rỉ như lớp bổ sung; OWASP khuyến nghị defense-in-depth thay vì một biện pháp đơn lẻ.
            - paragraph [ref=f81e1918]:
              - text: "Liên quan: MFA,"
              - link "Password hashing" [ref=f81e1919] [cursor=pointer]:
                - /url: "#password-hashing"
          - article [ref=f81e1920]:
            - heading "Salt" [level=4] [ref=f81e1921]
            - paragraph [ref=f81e1922]: "còn gọi: mặn hóa mật khẩu, random salt"
            - paragraph [ref=f81e1923]:
              - generic [ref=f81e1924]: Vấn đề
              - text: Nếu chỉ hash mật khẩu không salt, cùng một mật khẩu luôn cho cùng hash — attacker tải một bảng tra ngược sẵn là crack toàn bộ user dùng 'password123' cùng lúc, và attacker biết ngay user nào trùng mật khẩu mà không cần thử gì.
            - paragraph [ref=f81e1925]:
              - generic [ref=f81e1926]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1927]:
              - generic [ref=f81e1928]: Giải pháp
              - text: Sinh số ngẫu nhiên 128-bit riêng cho mỗi mật khẩu, hash(password + salt) và lưu cùng hash; mỗi password có hash riêng vô hiệu hóa bảng tra trước và việc đối chiếu hàng loạt.
            - paragraph [ref=f81e1929]:
              - text: "Liên quan:"
              - link "Rainbow table" [ref=f81e1930] [cursor=pointer]:
                - /url: "#rainbow-table"
              - text: ","
              - link "bcrypt" [ref=f81e1931] [cursor=pointer]:
                - /url: "#bcrypt"
              - text: ","
              - link "Password hashing" [ref=f81e1932] [cursor=pointer]:
                - /url: "#password-hashing"
          - article [ref=f81e1933]:
            - heading "salting" [level=4] [ref=f81e1934]
            - paragraph [ref=f81e1935]: "còn gọi: salt"
            - paragraph [ref=f81e1936]:
              - generic [ref=f81e1937]: Vấn đề
              - text: Ngay cả khi dùng hash, nhiều user dùng cùng password sẽ có cùng hash. Attacker có thể dùng precomputed bảng để dò nhanh. Cần thêm giá trị ngẫu nhiên (salt) vào mỗi password trước khi hash.
            - paragraph [ref=f81e1938]:
              - generic [ref=f81e1939]: Nguồn gốc
              - text: Morris/Thompson (1979) noted need for salt
            - paragraph [ref=f81e1940]:
              - generic [ref=f81e1941]: Giải pháp
              - text: Tạo salt ngẫu nhiên cho mỗi user, lưu salt cùng hash; hash(password+salt). Nhờ vậy identical passwords cho hash khác nhau.
            - paragraph [ref=f81e1942]:
              - text: "Liên quan:"
              - link "password hashing" [ref=f81e1943] [cursor=pointer]:
                - /url: "#password-hashing"
              - text: ","
              - link "rainbow table" [ref=f81e1944] [cursor=pointer]:
                - /url: "#rainbow-table"
              - text: ","
              - link "bcrypt/scrypt/argon2" [ref=f81e1945] [cursor=pointer]:
                - /url: "#bcrypt-scrypt-argon2"
          - article [ref=f81e1946]:
            - heading "SameSite cookie" [level=4] [ref=f81e1947]
            - paragraph [ref=f81e1948]: "còn gọi: SameSite=Strict/Lax/None"
            - paragraph [ref=f81e1949]:
              - generic [ref=f81e1950]: Vấn đề
              - text: Cookie mặc định được gửi trong mọi request kể cả request từ site khác — chính là lỗ hổng cho CSRF. Trước khi có SameSite, developer phải tự gắn anti-CSRF token vào từng form/API,site nào quên là bị giả mạo ngay.
            - paragraph [ref=f81e1951]:
              - generic [ref=f81e1952]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1953]:
              - generic [ref=f81e1954]: Giải pháp
              - text: "Attribute của Set-Cookie: Strict chặn toàn bộ cross-site, Lax chỉ cho navigation GET an toàn, None (bắt buộc kèm Secure) cho phép cross-site có chủ đích; giảm đáng kể CSRF nhưng OWASP cảnh báo không đủ một mình."
            - paragraph [ref=f81e1955]: "Liên quan: CSRF, Session"
          - article [ref=f81e1956]:
            - heading "session-based auth" [level=4] [ref=f81e1957]
            - paragraph [ref=f81e1958]: "còn gọi: cookie-based session"
            - paragraph [ref=f81e1959]:
              - generic [ref=f81e1960]: Vấn đề
              - text: Khi server cần ghi nhớ người dùng sau login, việc gửi username/password đi lại mỗi request rất tốn và không an toàn. Cần cách 'ghi nhớ phiên đăng nhập' mà vẫn có thể kiểm soát hết hạn.
            - paragraph [ref=f81e1961]:
              - generic [ref=f81e1962]: Nguồn gốc
              - text: HTTP is stateless; early web apps needed stateful sessions
            - paragraph [ref=f81e1963]:
              - generic [ref=f81e1964]: Giải pháp
              - text: Sau login, server tạo session ID lưu server-side (session store), gửi session ID qua cookie cho client. Mỗi request kèm cookie để server tra cứu phiên.
            - paragraph [ref=f81e1965]:
              - text: "Liên quan:"
              - link "authentication vs authorization" [ref=f81e1966] [cursor=pointer]:
                - /url: "#authentication-vs-authorization"
              - text: ","
              - link "CORS vs CSRF" [ref=f81e1967] [cursor=pointer]:
                - /url: "#cors-vs-csrf"
              - text: ","
              - link "replay attack" [ref=f81e1968] [cursor=pointer]:
                - /url: "#replay-attack"
          - article [ref=f81e1969]:
            - heading "SQL injection (SQLi)" [level=4] [ref=f81e1970]
            - paragraph [ref=f81e1971]: "còn gọi: tiêm SQL, chèn lệnh SQL"
            - paragraph [ref=f81e1972]:
              - generic [ref=f81e1973]: Vấn đề
              - text: "Ứng dụng nối chuỗi user input thẳng vào câu SQL (`\"SELECT * FROM users WHERE name='\" + input + \"'`), nên input `' OR 1=1--` viết lại cả logic truy vấn. Hậu quả gặp thật hàng ngày: đăng nhập bypass bằng `admin'--`, dump toàn bảng user, thậm chí OS command qua INTO OUTFILE — OWASP xếp đầu Top 10 suốt nhiều năm vì nguồn gốc là thói quen nối chuỗi có từ thời CGI."
            - paragraph [ref=f81e1974]:
              - generic [ref=f81e1975]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1976]:
              - generic [ref=f81e1977]: Giải pháp
              - text: "Parameterized query/prepared statement tách query structure khỏi data: input chỉ được bind vào placeholder, không bao giờparse thành SQL; phần không parameterize được (tên bảng/cột, ORDER BY) thì whitelist."
            - paragraph [ref=f81e1978]:
              - text: "Liên quan:"
              - link "Command injection" [ref=f81e1979] [cursor=pointer]:
                - /url: "#command-injection"
              - text: ", Input validation"
          - article [ref=f81e1980]:
            - heading "token" [level=4] [ref=f81e1981]
            - paragraph [ref=f81e1982]: "còn gọi: access token"
            - paragraph [ref=f81e1983]:
              - generic [ref=f81e1984]: Vấn đề
              - text: Session lưu trên server không scale tốt (load balancer nhiều node). Cần cách đại diện cho quyền truy cập mà client tự mang theo, server có thể xác minh nhanh mà không cần tra cứu session store.
            - paragraph [ref=f81e1985]:
              - generic [ref=f81e1986]: Nguồn gốc
              - text: OAuth delegation needs stateless credentials
            - paragraph [ref=f81e1987]:
              - generic [ref=f81e1988]: Giải pháp
              - text: "Token là chuỗi đại diện (thường signed) client đính kèm (Authorization: Bearer) để server xác minh quyền truy cập."
            - paragraph [ref=f81e1989]:
              - text: "Liên quan:"
              - link "JWT" [ref=f81e1990] [cursor=pointer]:
                - /url: "#jwt"
              - text: ","
              - link "OAuth 2.0" [ref=f81e1991] [cursor=pointer]:
                - /url: "#oauth-2-0"
              - text: ","
              - link "refresh token rotation" [ref=f81e1992] [cursor=pointer]:
                - /url: "#refresh-token-rotation"
        - generic [ref=f81e1993]:
          - heading "Kiểm thử & Chất lượng 25" [level=3] [ref=f81e1994]:
            - text: Kiểm thử & Chất lượng
            - generic [ref=f81e1995]: "25"
          - article [ref=f81e1996]:
            - heading "arrange-act-assert" [level=4] [ref=f81e1997]
            - paragraph [ref=f81e1998]: "còn gọi: AAA, 3A pattern"
            - paragraph [ref=f81e1999]:
              - generic [ref=f81e2000]: Vấn đề
              - text: Test viết lộn xộn, khó đọc, khó biết đâu là setup, đâu là hành động, đâu là kiểm chứng.
            - paragraph [ref=f81e2001]:
              - generic [ref=f81e2002]: Nguồn gốc
              - text: William C. Wake / Bill Wake popularized
            - paragraph [ref=f81e2003]:
              - generic [ref=f81e2004]: Giải pháp
              - text: "Arrange: chuẩn bị. Act: thực thi. Assert: kiểm chứng. Giúp test rõ ràng, dễ review."
            - paragraph [ref=f81e2005]:
              - text: "Liên quan:"
              - link "assertion" [ref=f81e2006] [cursor=pointer]:
                - /url: "#assertion"
              - text: ","
              - link "fixture" [ref=f81e2007] [cursor=pointer]:
