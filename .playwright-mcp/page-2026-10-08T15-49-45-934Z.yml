          - article [ref=f81e3058]:
            - heading "Cursor / keyset pagination" [level=4] [ref=f81e3059]
            - paragraph [ref=f81e3060]: "còn gọi: phân trang con trỏ, keyset pagination, seek pagination, pagination không OFFSET"
            - paragraph [ref=f81e3061]:
              - generic [ref=f81e3062]: Vấn đề
              - text: LIMIT 20 OFFSET 1000000 bắt DB phải tính và vứt đi 1 triệu dòng trước khi lấy 20 dòng — trang sau càng chậm; đồng thời giữa 2 trang có data mới insert/delete làm dòng nhảy cóc, lặp hoặc mất (offset drift).
            - paragraph [ref=f81e3063]:
              - generic [ref=f81e3064]: Nguồn gốc
              - text: Không rõ tác giả; được phổ biến trong cộng đồng web (các bài về keyset pagination, thập niên 2010)
            - paragraph [ref=f81e3065]:
              - generic [ref=f81e3066]: Giải pháp
              - text: Thay vì nhảy vị trí, nhớ khóa của dòng cuối (cursor = id + sort key) rồi WHERE id > cursor ORDER BY ... LIMIT 20 — luôn đi tiếp từ chỗ cũ, chi phí ổn định dù trang số bao nhiêu. Phù hợp feed/scroll vô hạn.
