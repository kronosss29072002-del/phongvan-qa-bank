            - paragraph [ref=f81e3039]: "còn gọi: index bao quát"
            - paragraph [ref=f81e3040]:
              - generic [ref=f81e3041]: Vấn đề
              - text: Query chỉ cần vài cột nhưng vẫn phải quay lại bảng, tốn lookup không cần thiết.
            - paragraph [ref=f81e3042]:
              - generic [ref=f81e3043]: Giải pháp
              - text: Đưa các cột cần vào mục lục để trả lời trực tiếp từ index, tránh truy cập bảng (index-only scan).
