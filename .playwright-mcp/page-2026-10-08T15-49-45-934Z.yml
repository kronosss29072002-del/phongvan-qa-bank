          - article [ref=f81e2118]:
            - heading "integration test" [level=4] [ref=f81e2119]
            - paragraph [ref=f81e2120]: "còn gọi: integration testing"
            - paragraph [ref=f81e2121]:
              - generic [ref=f81e2122]: Vấn đề
              - text: Unit test pass nhưng ứng dụng vẫn lỗi vì các thành phần (DB, service, module) không tương thích nhau khi ghép lại. Cần test quy trình liên kết giữa chúng.
            - paragraph [ref=f81e2123]:
              - generic [ref=f81e2124]: Nguồn gốc
              - text: Kent Beck / xUnit context
            - paragraph [ref=f81e2125]:
              - generic [ref=f81e2126]: Giải pháp
              - text: Test tương tác thật giữa vài thành phần (vd. service + DB in-memory/test DB) thay vì mock toàn bộ.
