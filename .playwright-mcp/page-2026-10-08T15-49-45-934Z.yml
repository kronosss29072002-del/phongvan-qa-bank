              - text: Trang chứa bản ghi biến đổi độ dài, chèn xóa làm fragment hóa và không xác định được vị trí bản ghi.
            - paragraph [ref=f81e6078]:
              - generic [ref=f81e6079]: Giải pháp
              - text: Header giữ mảng slot trỏ tới offset từng bản ghi; xóa chỉ đánh dấu, slot được sắp lại để gom khoảng trống.
