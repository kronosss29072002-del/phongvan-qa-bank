          - article [ref=f81e1735]:
            - heading "Stress Test vs Soak Test" [level=4] [ref=f81e1736]
            - paragraph [ref=f81e1737]: "còn gọi: stress testing, soak testing, endurance test"
            - paragraph [ref=f81e1738]:
              - generic [ref=f81e1739]: Vấn đề
              - text: "Dùng sai loại test: stress test tìm giới hạn tối đa, soak test tìm leak/resource ổn định dài hạn."
            - paragraph [ref=f81e1740]:
              - generic [ref=f81e1741]: Giải pháp
              - text: "Stress test: tăng lưu lượng vượt ngưỡng dự kiến (tìm breaking point, behavior under extreme). Soak test: chạy lưu lượng ổn định trong thời gian dài (4–24h) để phát hiện memory leak, connection leak, GC issue."
            - paragraph [ref=f81e1742]:
