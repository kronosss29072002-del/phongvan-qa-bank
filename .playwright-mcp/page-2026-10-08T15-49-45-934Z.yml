                - /url: "#arrange-act-assert"
          - article [ref=f81e2107]:
            - heading "Gherkin" [level=4] [ref=f81e2108]
            - paragraph [ref=f81e2109]:
              - generic [ref=f81e2110]: Vấn đề
              - text: Cần một định dạng văn bản có cấu trúc để biểu diễn ví dụ nghiệp vụ mà cả người kỹ thuật và không kỹ thuật đều đọc được và có thể chạy làm test.
            - paragraph [ref=f81e2111]:
              - generic [ref=f81e2112]: Nguồn gốc
              - text: khoảng 2008 (Cucumber)
            - paragraph [ref=f81e2113]:
              - generic [ref=f81e2114]: Giải pháp
              - text: Sử dụng cú pháp Given, When, Then để mô tả ngữ cảnh, hành động và kết quả kỳ vọng, sau đó ánh xạ từng bước vào code thực thi.
