              - text: ", head_based_sampling,"
              - link "OpenTelemetry" [ref=f81e6941] [cursor=pointer]:
                - /url: "#opentelemetry"
          - article [ref=f81e6942]:
            - heading "Trace Context Propagation" [level=4] [ref=f81e6943]
            - paragraph [ref=f81e6944]: "còn gọi: trace_context, w3c_tracecontext"
            - paragraph [ref=f81e6945]:
              - generic [ref=f81e6946]: Vấn đề
              - text: Cần lan truyền context (trace/span ID) nhất quán xuyên ranh giới service để có thể liên kết signal.
            - paragraph [ref=f81e6947]:
              - generic [ref=f81e6948]: Nguồn gốc
              - text: W3C TraceContext specification
            - paragraph [ref=f81e6949]:
              - generic [ref=f81e6950]: Giải pháp
              - text: "Lan truyền context qua headers (mặc định traceparent: version-trace-id-parent-id-trace-flags) để các service có thể tạo span con thuộc cùng trace."
            - paragraph [ref=f81e6951]:
              - text: "Liên quan:"
              - link "trace" [ref=f81e6952] [cursor=pointer]:
