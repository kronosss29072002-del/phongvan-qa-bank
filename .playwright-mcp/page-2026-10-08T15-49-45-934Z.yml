        - generic [ref=f81e6134]:
          - heading "Caching & Hiệu năng 7" [level=3] [ref=f81e6135]:
            - text: Caching & Hiệu năng
            - generic [ref=f81e6136]: "7"
          - article [ref=f81e6137]:
            - heading "Backpressure" [level=4] [ref=f81e6138]
            - paragraph [ref=f81e6139]: "còn gọi: áp suất ngược, khối áp lực ngược, flow control, buffering, buffer"
            - paragraph [ref=f81e6140]:
              - generic [ref=f81e6141]: Vấn đề
              - text: "Producer bắn dữ liệu nhanh hơn consumer xử lý (stream log, message queue đầy, HTTP client quá mạnh) — buffer tràn RAM, message rơi mất, hoặc hệ thống sập dần theo kiểu congestion collapse: càng nhận nhiều càng xử lý chậm rồi treo."
            - paragraph [ref=f81e6142]:
              - generic [ref=f81e6143]: Nguồn gốc
              - text: Thuật ngữ gốc từ thủy lực (điện khí học); không rõ ai đưa vào hệ thống phân tán trước tiên — spec Reactive Streams (2015) chuẩn hóa ở tầng API
            - paragraph [ref=f81e6144]:
              - generic [ref=f81e6145]: Giải pháp
              - text: Consumer báo ngược lại producer 'chậm lại' (bounded queue → 503/HTTP 429, credit-based flow control của Reactive Streams/TCP window) — hệ thống tự điều tiết về mức chịu được thay vì sập; kèm exponential backoff + jitter ở client.
            - paragraph [ref=f81e6146]:
              - text: "Liên quan: Queue,"
              - link "Latency vs throughput" [ref=f81e6147] [cursor=pointer]:
                - /url: "#latency-vs-throughput"
