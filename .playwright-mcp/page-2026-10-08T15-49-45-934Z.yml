            - heading "test isolation" [level=4] [ref=f81e5536]
            - paragraph [ref=f81e5537]: "còn gọi: isolated test"
            - paragraph [ref=f81e5538]:
              - generic [ref=f81e5539]: Vấn đề
              - text: Test A làm thay đổi state (DB, cache, file) ảnh hưởng test B chạy sau hoặc song song → kết quả không lặp lại được.
            - paragraph [ref=f81e5540]:
              - generic [ref=f81e5541]: Nguồn gốc
              - text: xUnit/test design (Kent Beck, Gerard Meszaros)
            - paragraph [ref=f81e5542]:
              - generic [ref=f81e5543]: Giải pháp
              - text: Mỗi test tự khởi tạo/dọn dẹp state, không phụ thuộc order. Dùng fixture, transaction rollback, in-memory, hoặc mock.
