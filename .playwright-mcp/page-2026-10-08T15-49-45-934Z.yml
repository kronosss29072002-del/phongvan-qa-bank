            - generic [ref=f81e5554]: "14"
          - article [ref=f81e5555]:
            - heading "Blue-green deploy" [level=4] [ref=f81e5556]
            - paragraph [ref=f81e5557]: "còn gọi: blue/green, hai môi trường xanh chín, swap môi trường"
            - paragraph [ref=f81e5558]:
              - generic [ref=f81e5559]: Vấn đề
              - text: Rolling để hai phiên bản cùng xử lý lưu lượng; với migration database hay cấu hình không tương thích hai chiều thì trộn phiên bản là rủi ro thật. Cần cách chuyển sang bản mới gần như tức thì và quay lại ngay được nếu hỏng, thay vì dừng service giữa chừng.
            - paragraph [ref=f81e5560]:
              - generic [ref=f81e5561]: Nguồn gốc
              - text: Martin Fowler, bliki 'Blue Green Deployment' ngày 1/3/2010 — giới thiệu kỹ thuật lấy từ mục blue-green trong cuốn Continuous Delivery của Dave Farley & Jez Humble (2010).
            - paragraph [ref=f81e5562]:
              - generic [ref=f81e5563]: Giải pháp
              - text: "Duy trì 2 môi trường sản xuất y hệt: blue đang live, green chứa bản mới được deploy + test khi trống; đổi router/load balancer sang green, blue giữ nguyên làm mục tiêu rollback tức thì."
            - paragraph [ref=f81e5564]:
              - text: "Liên quan:"
