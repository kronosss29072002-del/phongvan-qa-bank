              - text: ","
              - link "B-tree" [ref=f81e766] [cursor=pointer]:
                - /url: "#b-tree"
          - article [ref=f81e767]:
            - heading "Primary key & Foreign key" [level=4] [ref=f81e768]
            - paragraph [ref=f81e769]: "còn gọi: khóa chính, khóa ngoại, PK, FK"
            - paragraph [ref=f81e770]:
              - generic [ref=f81e771]: Vấn đề
              - text: Cùng một thông tin ghi ở nhiều bảng (địa chỉ khách nằm cả ở orders lẫn invoices) thì sửa 1 chỗ không ăn thua chỗ khác — trùng lặp, mâu thuẫn, không biết bản nào là thật. Thêm dòng tham chiếu tới bản không tồn tại (đặt hàng cho khách không có) cũng không ai chặn.
            - paragraph [ref=f81e772]:
              - generic [ref=f81e773]: Nguồn gốc
              - text: Gắn với mô hình quan hệ của Edgar F. Codd, 1970
            - paragraph [ref=f81e774]:
              - generic [ref=f81e775]: Giải pháp
              - text: PK định danh duy nhất 1 dòng; FK tham chiếu về PK bảng khác và DB chặn ghi có FK trỏ vào chỗ không tồn tại — mối quan hệ được cưỡng chế ở tầng dữ liệu thay vì hy vọng application luôn đúng.
            - paragraph [ref=f81e776]:
