                - /url: "#test-isolation"
          - article [ref=f81e5435]:
            - heading "Specification by example" [level=4] [ref=f81e5436]
            - paragraph [ref=f81e5437]:
              - generic [ref=f81e5438]: Vấn đề
              - text: Khi yêu cầu chỉ mô tả trừu tượng, dễ dẫn đến hiểu sai — cần dùng ví dụ cụ thể để làm rõ kỳ vọng nghiệp vụ.
            - paragraph [ref=f81e5439]:
              - generic [ref=f81e5440]: Nguồn gốc
              - text: Gojko Adzic (Specification by Example, 2011)
            - paragraph [ref=f81e5441]:
              - generic [ref=f81e5442]: Giải pháp
              - text: Dùng các ví dụ cụ thể, có thể kiểm chứng được làm cầu nối giữa yêu cầu nghiệp vụ và test tự động (thường dùng với BDD/Gherkin).
            - paragraph [ref=f81e5443]:
              - text: "Liên quan:"
              - link "BDD" [ref=f81e5444] [cursor=pointer]:
                - /url: "#bdd"
              - text: ","
              - link "Gherkin" [ref=f81e5445] [cursor=pointer]:
                - /url: "#gherkin"
          - article [ref=f81e5446]:
            - heading "State verification" [level=4] [ref=f81e5447]
            - paragraph [ref=f81e5448]:
              - generic [ref=f81e5449]: Vấn đề
              - text: Cần xác minh kết quả cuối cùng của system under test sau khi thực thi (trạng thái trả về, dữ liệu thay đổi) thay vì cách nó đạt được kết quả đó.
            - paragraph [ref=f81e5450]:
              - generic [ref=f81e5451]: Nguồn gốc
              - text: Gerard Meszaros (xUnit Test Patterns)
            - paragraph [ref=f81e5452]:
              - generic [ref=f81e5453]: Giải pháp
              - text: Quan sát trạng thái bên ngoài của SUT sau hành động và so sánh với kỳ vọng, thường dùng với stub/fake.
            - paragraph [ref=f81e5454]:
              - text: "Liên quan:"
              - link "Stub" [ref=f81e5455] [cursor=pointer]:
                - /url: "#stub"
              - text: ","
              - link "Fake" [ref=f81e5456] [cursor=pointer]:
                - /url: "#fake"
              - text: ","
              - link "Behavior verification" [ref=f81e5457] [cursor=pointer]:
                - /url: "#behavior-verification"
          - article [ref=f81e5458]:
            - heading "static analysis" [level=4] [ref=f81e5459]
            - paragraph [ref=f81e5460]: "còn gọi: static code analysis"
            - paragraph [ref=f81e5461]:
              - generic [ref=f81e5462]: Vấn đề
              - text: Nhiều bug (null deref, resource leak) khó phát hiện bằng test chạy, nhưng có thể phát hiện từ mã nguồn không chạy.
            - paragraph [ref=f81e5463]:
              - generic [ref=f81e5464]: Nguồn gốc
              - text: Compiler theory + modern tools
            - paragraph [ref=f81e5465]:
              - generic [ref=f81e5466]: Giải pháp
              - text: Phân tích AST/source mà không thực thi để tìm bug pattern, smell, security issue tiềm ẩn.
            - paragraph [ref=f81e5467]:
              - text: "Liên quan:"
