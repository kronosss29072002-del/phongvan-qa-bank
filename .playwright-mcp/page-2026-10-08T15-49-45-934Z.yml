          - article [ref=f81e2282]:
            - heading "Test suite" [level=4] [ref=f81e2283]
            - paragraph [ref=f81e2284]:
              - generic [ref=f81e2285]: Vấn đề
              - text: Cần tổ chức tập hợp test một cách có cấu trúc để chạy hiệu quả, phân loại và báo cáo kết quả rõ ràng.
            - paragraph [ref=f81e2286]:
              - generic [ref=f81e2287]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e2288]:
              - generic [ref=f81e2289]: Giải pháp
              - text: Tập hợp các test case được nhóm theo module/tầng (unit/integration/e2e) có thể chạy cùng nhau, thường tự động trong CI.
