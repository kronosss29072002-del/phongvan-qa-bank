          - article [ref=f81e2224]:
            - heading "Stub" [level=4] [ref=f81e2225]
            - paragraph [ref=f81e2226]:
              - generic [ref=f81e2227]: Vấn đề
              - text: Khi cần cung cấp dữ liệu trả về cố định cho một phụ thuộc để system under test đi vào nhánh mong muốn, mà không cần quan tâm collaborator có được gọi đúng cách không.
            - paragraph [ref=f81e2228]:
              - generic [ref=f81e2229]: Nguồn gốc
              - text: Gerard Meszaros (xUnit Test Patterns)
            - paragraph [ref=f81e2230]:
              - generic [ref=f81e2231]: Giải pháp
              - text: Cung cấp câu trả lời cứng (hardcoded) cho các lời gọi, giúp kiểm soát luồng chạy mà không thực thi logic thật của phụ thuộc.
            - paragraph [ref=f81e2232]:
              - text: "Liên quan:"
              - link "Test double" [ref=f81e2233] [cursor=pointer]:
                - /url: "#test-double"
              - text: ","
              - link "State verification" [ref=f81e2234] [cursor=pointer]:
