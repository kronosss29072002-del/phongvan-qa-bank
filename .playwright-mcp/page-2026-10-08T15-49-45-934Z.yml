                - /url: "#stub"
          - article [ref=f81e2159]:
            - heading "red-green-refactor" [level=4] [ref=f81e2160]
            - paragraph [ref=f81e2161]: "còn gọi: red-green-refactor cycle"
            - paragraph [ref=f81e2162]:
              - generic [ref=f81e2163]: Vấn đề
              - text: "Khi sửa code mà không có vòng lặp ngắn, dễ mất định hướng: implement thừa hoặc không biết khi nào xong."
            - paragraph [ref=f81e2164]:
              - generic [ref=f81e2165]: Nguồn gốc
              - text: Kent Beck (TDD)
            - paragraph [ref=f81e2166]:
              - generic [ref=f81e2167]: Giải pháp
              - text: "Red: test fail. Green: làm tối thiểu để pass. Refactor: dọn code mà vẫn giữ test pass."
            - paragraph [ref=f81e2168]:
              - text: "Liên quan:"
              - link "TDD" [ref=f81e2169] [cursor=pointer]:
                - /url: "#tdd"
              - text: ","
              - link "refactoring" [ref=f81e2170] [cursor=pointer]:
                - /url: "#refactoring"
          - article [ref=f81e2171]:
            - heading "regression test" [level=4] [ref=f81e2172]
            - paragraph [ref=f81e2173]: "còn gọi: regression testing"
            - paragraph [ref=f81e2174]:
              - generic [ref=f81e2175]: Vấn đề
              - text: Sau khi sửa bug hoặc refactor, chức năng cũ bị hỏng mà không ai phát hiện (regression) vì không có test cho nhánh đó.
            - paragraph [ref=f81e2176]:
              - generic [ref=f81e2177]: Nguồn gốc
              - text: Software engineering practice (Myers)
            - paragraph [ref=f81e2178]:
              - generic [ref=f81e2179]: Giải pháp
              - text: Giữ lại test cho bug đã fix hoặc chức năng quan trọng; chạy lại để đảm bảo không tái xuất hiện.
            - paragraph [ref=f81e2180]:
              - text: "Liên quan:"
              - link "unit test" [ref=f81e2181] [cursor=pointer]:
                - /url: "#unit-test"
              - text: ","
              - link "integration test" [ref=f81e2182] [cursor=pointer]:
                - /url: "#integration-test"
              - text: ","
              - link "smoke test" [ref=f81e2183] [cursor=pointer]:
                - /url: "#smoke-test"
              - text: ","
              - link "TDD" [ref=f81e2184] [cursor=pointer]:
                - /url: "#tdd"
              - text: ","
              - link "Test suite" [ref=f81e2185] [cursor=pointer]:
                - /url: "#test-suite"
              - text: ", CI"
          - article [ref=f81e2186]:
            - heading "smoke test" [level=4] [ref=f81e2187]
            - paragraph [ref=f81e2188]: "còn gọi: sanity test, smoke testing, kiểm thử khói, smoke check, post-deploy check"
            - paragraph [ref=f81e2189]:
              - generic [ref=f81e2190]: Vấn đề
              - text: Sau build/deploy, mất nhiều thời gian chạy full suite. Cần nhanh chóng biết "có lỗi nghiêm trọng không" trước khi chạy sâu hơn.
            - paragraph [ref=f81e2191]:
              - generic [ref=f81e2192]: Nguồn gốc
              - text: Hardware testing origin (circuit smoke) adopted in software
            - paragraph [ref=f81e2193]:
              - generic [ref=f81e2194]: Giải pháp
              - text: Chọn tập nhỏ kịch bản then chốt (login, healthcheck, endpoint quan trọng) chạy trong vài phút.
            - paragraph [ref=f81e2195]:
              - text: "Liên quan:"
