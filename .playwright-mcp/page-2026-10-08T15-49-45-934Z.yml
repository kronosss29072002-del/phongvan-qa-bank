              - link "Exactly-once semantics" [ref=f81e6525] [cursor=pointer]:
                - /url: "#exactly-once-semantics"
              - text: ","
              - link "Event sourcing" [ref=f81e6526] [cursor=pointer]:
                - /url: "#event-sourcing"
          - article [ref=f81e6527]:
            - heading "CQRS" [level=4] [ref=f81e6528]
            - paragraph [ref=f81e6529]: "còn gọi: Command Query Responsibility Segregation, tách đọc-ghi"
            - paragraph [ref=f81e6530]:
              - generic [ref=f81e6531]: Vấn đề
              - text: "Một model kiêm hai việc: command phải validate business rule phức tạp, query dashboard phải đọc triệu dòng (đọc gấp viết 10-100 lần) — chung một table thì indexes/phép tắc phục vụ cả hai và mỗi bên làm yếu bên kia; read replica chỉ tăng sức đọc chứ không tách được model."
            - paragraph [ref=f81e6532]:
              - generic [ref=f81e6533]: Nguồn gốc
              - text: Greg Young đặt thuật ngữ CQRS (Martin Fowler ghi nhận nghe mô tả đầu 2011), kế thừa CQS của Bertrand Meyer
            - paragraph [ref=f81e6534]:
              - generic [ref=f81e6535]: Giải pháp
              - text: Tách model ghi (bảo toàn business rule) và model đọc (denormalize/cache riêng), scale độc lập, đồng bộ qua event — chi phí là eventual consistency và hai codebase model, Fowler cảnh báo chỉ dùng trong Bounded Context hẹp.
            - paragraph [ref=f81e6536]:
              - text: "Liên quan:"
