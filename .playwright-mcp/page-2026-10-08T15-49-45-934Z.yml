          - article [ref=f81e2576]:
            - heading "Keep-alive" [level=4] [ref=f81e2577]
            - paragraph [ref=f81e2578]: "còn gọi: persistent connection, Connection: keep-alive"
            - paragraph [ref=f81e2579]:
              - generic [ref=f81e2580]: Vấn đề
              - text: Với HTTP/1.0, mỗi request tái tạo TCP handshake (3 gói) + TLS handshake (2 round-trip) chỉ để gửi một file nhỏ — latency cộng dồn khiến trang chậm rõ rệt; server cũng tốn tài nguyên accept/đóng kết nối liên tục.
            - paragraph [ref=f81e2581]:
              - generic [ref=f81e2582]: Nguồn gốc
              - text: "Đề xuất như extension 'Connection: Keep-Alive' trong HTTP/1.0, trở thành mặc định trong HTTP/1.1 (RFC 2616, 1999)."
            - paragraph [ref=f81e2583]:
              - generic [ref=f81e2584]: Giải pháp
              - text: Giữ kết nối TCP/TLS mở sau response đầu tiên và tái dùng cho các request tiếp theo (bản thân HTTP không còn rào cản vì mỗi request/response vẫn có Content-Length/ chunked để phân tách); timeout phía server giải phóng kết nối idle.
            - paragraph [ref=f81e2585]:
              - text: "Liên quan:"
              - link "HTTP/1.1" [ref=f81e2586] [cursor=pointer]:
                - /url: "#http-1-1"
