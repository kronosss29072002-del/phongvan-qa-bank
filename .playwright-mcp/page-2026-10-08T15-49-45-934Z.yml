          - article [ref=f81e2480]:
            - heading "CORS" [level=4] [ref=f81e2481]
            - paragraph [ref=f81e2482]: "còn gọi: Cross-Origin Resource Sharing, chính sách cùng nguồn"
            - paragraph [ref=f81e2483]:
              - generic [ref=f81e2484]: Vấn đề
              - text: Same-origin policy (từ Netscape, 1995) chặn Ajax đọc tài nguyên khác domain — site ở foo.com không fetch được api.bar.com, trong khi backend tách frontend/API thành 2 domain là chuyện bình thường. Trick cũ JSONP chỉ chạy GET, embed script, dễ XSS. Cần cơ chế server 'cho phép' cross-origin một cách có kiểm soát.
            - paragraph [ref=f81e2485]:
              - generic [ref=f81e2486]: Nguồn gốc
              - text: Đề xuất ban đầu 3/2004 (Matt Oshry, Brad Porter, Michael Bodell — Tellme Networks); W3C Recommendation 1/2014; hiện sống trong WHATWG Fetch Living Standard.
            - paragraph [ref=f81e2487]:
              - generic [ref=f81e2488]: Giải pháp
              - text: Browser gắn header Origin; server trả Access-Control-Allow-Origin (kèm credentials nếu muốn); request 'phức tạp' (POST/PUT có Content-Type lạ) kích hoạt preflight OPTIONS trước — server xác nhận thì browser mới gửi thật.
            - paragraph [ref=f81e2489]:
              - text: "Liên quan:"
              - link "Cookie vs session token" [ref=f81e2490] [cursor=pointer]:
