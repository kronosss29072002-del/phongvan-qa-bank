            - paragraph [ref=f81e3016]:
              - generic [ref=f81e3017]: Vấn đề
              - text: Index phụ trỏ rời làm tìm theo khóa chính phải lookup ngẫu nhiên sang trang dữ liệu.
            - paragraph [ref=f81e3018]:
              - generic [ref=f81e3019]: Giải pháp
              - text: Dữ liệu chính sắp theo thứ tự index, như InnoDB với khóa chính; bản ghi nằm ngay trong nút lá.
            - paragraph [ref=f81e3020]:
