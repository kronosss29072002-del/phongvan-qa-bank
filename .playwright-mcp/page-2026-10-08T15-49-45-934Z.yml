          - article [ref=f81e4241]:
            - heading "Grafana Loki" [level=4] [ref=f81e4242]
            - paragraph [ref=f81e4243]: "còn gọi: Loki, log aggregation kiểu Prometheus"
            - paragraph [ref=f81e4244]:
              - generic [ref=f81e4245]: Vấn đề
              - text: ELK index full-text rất mạnh nhưng chi phí lưu trữ/cluster Elasticsearch phình khi log chạm hàng TB/ngày; nhiều team chỉ cần tra log theo service/pod trong vài ngày gần, không cần full-text search mọi thứ.
            - paragraph [ref=f81e4246]:
              - generic [ref=f81e4247]: Nguồn gốc
              - text: Grafana Labs (năm ra mắt không verify được)
            - paragraph [ref=f81e4248]:
              - generic [ref=f81e4249]: Giải pháp
              - text: Loki chỉ index metadata (labels) chứ không index nội dung log, giữ log nén thô trong object storage và filter khi query — chi phí thấp hơn đáng kể, mô hình nhãn + query language (LogQL) giống Prometheus.
            - paragraph [ref=f81e4250]:
              - text: "Liên quan:"
              - link "Log aggregation & ELK Stack" [ref=f81e4251] [cursor=pointer]:
                - /url: "#log-aggregation-elk-stack"
              - text: ", Prometheus scrape model,"
              - link "Metric cardinality" [ref=f81e4252] [cursor=pointer]:
                - /url: "#metric-cardinality"
          - article [ref=f81e4253]:
            - heading "Health Check" [level=4] [ref=f81e4254]
            - paragraph [ref=f81e4255]: "còn gọi: health_check, liveness_probe, readiness_probe"
            - paragraph [ref=f81e4256]:
              - generic [ref=f81e4257]: Vấn đề
              - text: Load balancer/orchestrator cần phân biệt service bị treo (hung) vs đang khởi động/chưa sẵn sàng nhận traffic.
            - paragraph [ref=f81e4258]:
              - generic [ref=f81e4259]: Nguồn gốc
              - text: Google SRE Book; Kubernetes probe semantics (common practice)
            - paragraph [ref=f81e4260]:
              - generic [ref=f81e4261]: Giải pháp
              - text: "Shallow/deep health check. Liveness: service còn sống (có thể restart nếu fail). Readiness: sẵn sàng nhận traffic (dependencies ready). Giúp graceful shutdown/drain và tránh route traffic tới instance chưa sẵn sàng."
            - paragraph [ref=f81e4262]: "Liên quan: graceful_shutdown, service_discovery, load_balancing"
          - article [ref=f81e4263]:
            - heading "Incident Management" [level=4] [ref=f81e4264]
            - paragraph [ref=f81e4265]: "còn gọi: incident_response"
            - paragraph [ref=f81e4266]:
              - generic [ref=f81e4267]: Vấn đề
              - text: Cần cơ cấu phối hợp rõ ràng khi sự cố xảy ra để giảm MTTR và tránh hỗn loạn.
            - paragraph [ref=f81e4268]:
              - generic [ref=f81e4269]: Nguồn gốc
              - text: Google SRE Book - Chapter 13/14 (Emergency Response, Managing Incidents)
            - paragraph [ref=f81e4270]:
              - generic [ref=f81e4271]: Giải pháp
              - text: "Quy trình có cấu trúc: declare incident, establish incident commander, comms/updates, mitigation, resolution, post-incident review. Ưu tiên stabilize trước, xác định root sau."
            - paragraph [ref=f81e4272]:
              - text: "Liên quan: on_call,"
              - link "postmortem" [ref=f81e4273] [cursor=pointer]:
                - /url: "#postmortem"
              - text: ", MTTR"
          - article [ref=f81e4274]:
            - heading "Metric cardinality" [level=4] [ref=f81e4275]
            - paragraph [ref=f81e4276]: "còn gọi: high-cardinality label, độ lớn số label"
            - paragraph [ref=f81e4277]:
              - generic [ref=f81e4278]: Vấn đề
              - text: Dev gắn user_id/email làm label cho metric 'HTTP requests' → mỗi user một time series riêng; hệ thống 100k user sinh 100k series cho mỗi metric, Prometheus RAM/disk phình, query chậm, thậm chí OOM. Cardinality không kiểm soát là nguyên nhân kinh điển làm sập monitoring stack.
            - paragraph [ref=f81e4279]:
              - generic [ref=f81e4280]: Nguồn gốc
              - text: không rõ (hướng dẫn thực hành trong tài liệu Prometheus về naming/labels)
            - paragraph [ref=f81e4281]:
              - generic [ref=f81e4282]: Giải pháp
              - text: Chỉ dùng label có tập giá trị hữu hạn và nhỏ (method, status, stage, service); giá trị không biên (user_id, email, request_id) phải để sang log/trace hoặc exemplar — mỗi tổ hợp label = một series mới nên mọi thứ vô hạn đều cấm.
            - paragraph [ref=f81e4283]:
              - text: "Liên quan: Prometheus scrape model,"
              - link "Observability" [ref=f81e4284] [cursor=pointer]:
                - /url: "#observability"
              - text: ","
              - link "Metrics (time-series)" [ref=f81e4285] [cursor=pointer]:
                - /url: "#metrics-time-series"
          - article [ref=f81e4286]:
            - heading "Metric Types" [level=4] [ref=f81e4287]
            - paragraph [ref=f81e4288]: "còn gọi: counter, gauge, histogram, native_histogram"
            - paragraph [ref=f81e4289]:
              - generic [ref=f81e4290]: Vấn đề
              - text: Cần phân loại metric đúng để tránh diễn giải sai (giá trị tăng/giảm, phân phối).
            - paragraph [ref=f81e4291]:
              - generic [ref=f81e4292]: Nguồn gốc
              - text: Prometheus Documentation - Metric Types
            - paragraph [ref=f81e4293]:
              - generic [ref=f81e4294]: Giải pháp
              - text: "Counter: tăng đơn điệu, reset khi restart (requests). Gauge: lên/xuống (memory, concurrent). Histogram: quan sát phân phối theo bucket + sum + count (latency). Native histogram hiệu quả hơn classic."
            - paragraph [ref=f81e4295]: "Liên quan: metrics, Prometheus, histogram"
          - article [ref=f81e4296]:
            - heading "Observability" [level=4] [ref=f81e4297]
            - paragraph [ref=f81e4298]: "còn gọi: tính quan sát được, observability vs monitoring, unknown-unknowns"
            - paragraph [ref=f81e4299]:
              - generic [ref=f81e4300]: Vấn đề
              - text: Microservices + container + polyglot storage tạo ra trạng thái hệ thống chưa từng thấy (unknown-unknowns); dashboard chỉ trả lời câu hỏi đặt sẵn,gặp sự cố lạ dev phải đoán, redeploy thêm log rồi chờ chu kỳ mới — sửa lỗi chậm và mù tịt (developer mất >40% thời gian cho công việc không hiệu quả).
            - paragraph [ref=f81e4301]:
              - generic [ref=f81e4302]: Nguồn gốc
              - text: Charity Majors (Honeycomb), 'Observability is a many-splendored thing' (3/3/2020); gốc từ lý thuyết điều khiển (control theory)
            - paragraph [ref=f81e4303]:
              - generic [ref=f81e4304]: Giải pháp
              - text: Thu thập event giàu ngữ cảnh quanh path của request (mỗi service một event rộng, nhiều dimension) để tự do cắt lát/bắt chước mọi câu hỏi mà không cần đoán trước; metrics/logs/traces chỉ là loại dữ liệu — observability là khả năng trả lời câu hỏi chưa từng đặt ra, cần data high-cardinality/high-dimensionality.
            - paragraph [ref=f81e4305]:
              - text: "Liên quan:"
              - link "Metric cardinality" [ref=f81e4306] [cursor=pointer]:
                - /url: "#metric-cardinality"
              - text: ","
              - link "Monitoring" [ref=f81e4307] [cursor=pointer]:
                - /url: "#monitoring"
              - text: ","
              - link "Structured logging" [ref=f81e4308] [cursor=pointer]:
                - /url: "#structured-logging"
          - article [ref=f81e4309]:
            - heading "On-call" [level=4] [ref=f81e4310]
            - paragraph [ref=f81e4311]: "còn gọi: on_call_rotation"
            - paragraph [ref=f81e4312]:
              - generic [ref=f81e4313]: Vấn đề
              - text: Phản ứng kịp thời khi sự cố xảy ra mà vẫn bảo vệ wellbeing của nhân viên.
            - paragraph [ref=f81e4314]:
              - generic [ref=f81e4315]: Nguồn gốc
              - text: Google SRE Book - Chapter 11 (Being On-Call)
            - paragraph [ref=f81e4316]:
              - generic [ref=f81e4317]: Giải pháp
              - text: Rotation có định nghĩa rõ ràng, paging dựa trên symptom (alert on symptoms) để giảm noise, có ngưỡng alert hợp lý, tránh alert fatigue. Tập trung vào việc can thiệp có ý nghĩa.
            - paragraph [ref=f81e4318]: "Liên quan: alert_fatigue, pager_fatigue, incident_management"
          - article [ref=f81e4319]:
            - heading "OpenTelemetry" [level=4] [ref=f81e4320]
            - paragraph [ref=f81e4321]: "còn gọi: OTel"
            - paragraph [ref=f81e4322]:
              - generic [ref=f81e4323]: Vấn đề
              - text: Thiếu chuẩn mở để thu thập traces/metrics/logs, dẫn đến vendor lock-in.
            - paragraph [ref=f81e4324]:
              - generic [ref=f81e4325]: Nguồn gốc
              - text: OpenTelemetry Project (merger of OpenTracing + OpenCensus)
            - paragraph [ref=f81e4326]:
              - generic [ref=f81e4327]: Giải pháp
              - text: SDK/API chuẩn để instrument, thu thập và xuất (export) signals (traces, metrics, logs) với context propagation mặc định (W3C traceparent).
            - paragraph [ref=f81e4328]:
              - text: "Liên quan:"
              - link "trace" [ref=f81e4329] [cursor=pointer]:
                - /url: "#trace"
              - text: ", metrics, logs,"
              - link "sampling" [ref=f81e4330] [cursor=pointer]:
                - /url: "#sampling"
          - article [ref=f81e4331]:
            - heading "OpenTelemetry (OTel)" [level=4] [ref=f81e4332]
            - paragraph [ref=f81e4333]: "còn gọi: OTel, OTLP, OpenTelemetry SDK"
            - paragraph [ref=f81e4334]:
              - generic [ref=f81e4335]: Vấn đề
              - text: Mỗi vendor (Datadog, Jaeger, Zipkin, New Relic) có API instrumentation riêng; team phải viết lại code mỗi lần đổi công cụ, mỗi ngôn ngữ một kiểu hook, instrumentation rải rác và đủ thứ bị kẹp vào một backend duy nhất (lock-in).
            - paragraph [ref=f81e4336]:
              - generic [ref=f81e4337]: Nguồn gốc
              - text: CNCF — công bố sáp nhập OpenTracing + OpenCensus ngày 21/5/2019
            - paragraph [ref=f81e4338]:
              - generic [ref=f81e4339]: Giải pháp
              - text: "Framework trung gian chuẩn hóa: app instrument một lần theo API/SDK OTel, export qua giao thức OTLP → collector/router chuyển tiếp tới backend bất kỳ; sinh ra từ việc sáp nhập hai dự án cùng giải quyết một vách ngăn chuẩn hóa."
            - paragraph [ref=f81e4340]:
              - text: "Liên quan:"
              - link "Distributed tracing" [ref=f81e4341] [cursor=pointer]:
                - /url: "#distributed-tracing"
              - text: ", Context propagation, OpenTelemetry Collector"
          - article [ref=f81e4342]:
            - heading "Postmortem" [level=4] [ref=f81e4343]
            - paragraph [ref=f81e4344]: "còn gọi: incident_postmortem"
            - paragraph [ref=f81e4345]:
              - generic [ref=f81e4346]: Vấn đề
              - text: Incident xảy ra lại nếu không có quá trình học hỏi có cấu trúc sau sự cố.
            - paragraph [ref=f81e4347]:
              - generic [ref=f81e4348]: Nguồn gốc
              - text: Google SRE Book - Chapter 15 (Postmortem Culture)
            - paragraph [ref=f81e4349]:
              - generic [ref=f81e4350]: Giải pháp
              - text: "Tài liệu sau incident: timeline, impact, root/contributing causes, mitigation, action items, lessons learned. Cần có tiêu chí kích hoạt postmortem rõ ràng trước khi sự cố xảy ra."
            - paragraph [ref=f81e4351]: "Liên quan: blameless_postmortem, incident_management, runbook"
          - article [ref=f81e4352]:
            - heading "Prometheus Pull Model" [level=4] [ref=f81e4353]
            - paragraph [ref=f81e4354]: "còn gọi: pull_model, prometheus_scrape"
            - paragraph [ref=f81e4355]:
              - generic [ref=f81e4356]: Vấn đề
              - text: Cần cơ chế thu thập metric an toàn, dễ discovery, tránh bị flood từ nhiều nguồn.
            - paragraph [ref=f81e4357]:
              - generic [ref=f81e4358]: Nguồn gốc
              - text: Prometheus Project - Overview (SoundCloud 2012, CNCF since 2016)
            - paragraph [ref=f81e4359]:
              - generic [ref=f81e4360]: Giải pháp
              - text: "Prometheus chủ động scrape (pull) metrics từ HTTP endpoints (/metrics). Ưu điểm: dễ kiểm soát, service discovery (static/k8s), autonomous per-server. Push hỗ trợ qua Pushgateway."
            - paragraph [ref=f81e4361]: "Liên quan: metrics, Prometheus, time_series"
          - article [ref=f81e4362]:
            - heading "Prometheus scrape model (pull)" [level=4] [ref=f81e4363]
            - paragraph [ref=f81e4364]: "còn gọi: pull model, scrape, mô hình kéo metrics, endpoint /metrics"
            - paragraph [ref=f81e4365]:
              - generic [ref=f81e4366]: Vấn đề
              - text: Với push, mỗi service phải biết địa chỉ collector và tự gửi metric; service chết thì mất luôn dữ liệu báo nó chết, và kiến trúc dynamic (pod đổi IP liên tục, tự nhân bản) khiến việc cấu hình push target ở khắp nơi thành hỗn loạn.
            - paragraph [ref=f81e4367]:
              - generic [ref=f81e4368]: Nguồn gốc
              - text: SoundCloud, khởi đầu năm 2012; gia nhập CNCF năm 2016 (dự án thứ hai sau Kubernetes)
            - paragraph [ref=f81e4369]:
              - generic [ref=f81e4370]: Giải pháp
              - text: Prometheus chủ động pull (scrape) endpoint /metrics theo danh sách target khám phá được; target chết → series biến mất hoặc up==0 chính là tín hiệu. Metric chỉ là số + label, query qua PromQL, lưu cục bộ từng node nên không phụ thuộc storage tập trung lúc outage.
            - paragraph [ref=f81e4371]:
              - text: "Liên quan:"
              - link "Metrics (time-series)" [ref=f81e4372] [cursor=pointer]:
                - /url: "#metrics-time-series"
              - text: ","
              - link "Metric cardinality" [ref=f81e4373] [cursor=pointer]:
                - /url: "#metric-cardinality"
              - text: ","
              - link "Exemplars" [ref=f81e4374] [cursor=pointer]:
                - /url: "#exemplars"
          - article [ref=f81e4375]:
            - heading "RED Method" [level=4] [ref=f81e4376]
            - paragraph [ref=f81e4377]: "còn gọi: RED, Rate-Errors-Duration, phương pháp RED"
            - paragraph [ref=f81e4378]:
              - generic [ref=f81e4379]: Vấn đề
              - text: Cần triết lý giám sát tập trung cho microservices, dễ áp dụng nhất quán.
            - paragraph [ref=f81e4380]:
              - generic [ref=f81e4381]: Nguồn gốc
              - text: Tom Wilkie (Grafana Labs) - RED Method, 2015
            - paragraph [ref=f81e4382]:
              - generic [ref=f81e4383]: Giải pháp
              - text: Rate (số request/giây), Errors (số request thất bại), Duration (thời gian xử lý phân phối). Tập trung vào trải nghiệm người dùng (request-based).
            - paragraph [ref=f81e4384]:
              - text: "Liên quan: four_golden_signals, USE_method, latency,"
              - link "USE method" [ref=f81e4385] [cursor=pointer]:
                - /url: "#use-method"
              - text: ","
              - link "Four golden signals" [ref=f81e4386] [cursor=pointer]:
                - /url: "#four-golden-signals"
              - text: ","
              - link "SLI / SLO" [ref=f81e4387] [cursor=pointer]:
                - /url: "#sli-slo"
          - article [ref=f81e4388]:
            - heading "RPO" [level=4] [ref=f81e4389]
            - paragraph [ref=f81e4390]: "còn gọi: Recovery Point Objective"
            - paragraph [ref=f81e4391]:
              - generic [ref=f81e4392]: Vấn đề
              - text: Cần xác định mức độ mất dữ liệu có thể chấp nhận được để chọn chiến lược DR phù hợp.
            - paragraph [ref=f81e4393]:
              - generic [ref=f81e4394]: Nguồn gốc
              - text: AWS Disaster Recovery Whitepapers
            - paragraph [ref=f81e4395]:
              - generic [ref=f81e4396]: Giải pháp
              - text: RPO là thời gian tối đa dữ liệu có thể mất (tolerable data loss). Ví dụ RPO 1h nghĩa là có thể mất dữ liệu tối đa 1 giờ. Ảnh hưởng trực tiếp đến tần suất backup/replication.
            - paragraph [ref=f81e4397]:
              - text: "Liên quan:"
              - link "RTO" [ref=f81e4398] [cursor=pointer]:
                - /url: "#rto"
              - text: ", disaster_recovery, backup_restore"
          - article [ref=f81e4399]:
            - heading "RTO" [level=4] [ref=f81e4400]
            - paragraph [ref=f81e4401]: "còn gọi: Recovery Time Objective"
            - paragraph [ref=f81e4402]:
              - generic [ref=f81e4403]: Vấn đề
              - text: Cần xác định thời gian phục hồi tối đa chấp nhận được để cân bằng cost vs resilience.
            - paragraph [ref=f81e4404]:
              - generic [ref=f81e4405]: Nguồn gốc
              - text: AWS Disaster Recovery Whitepapers
            - paragraph [ref=f81e4406]:
              - generic [ref=f81e4407]: Giải pháp
              - text: RTO là thời gian tối đa để phục hồi dịch vụ sau disaster. Xác định chiến lược DR (Backup/Restore -> Pilot Light -> Warm Standby -> Active-Active).
            - paragraph [ref=f81e4408]:
              - text: "Liên quan:"
              - link "RPO" [ref=f81e4409] [cursor=pointer]:
                - /url: "#rpo"
              - text: ", disaster_recovery, pilot_light"
          - article [ref=f81e4410]:
            - heading "Sampling" [level=4] [ref=f81e4411]
            - paragraph [ref=f81e4412]: "còn gọi: trace_sampling"
            - paragraph [ref=f81e4413]:
              - generic [ref=f81e4414]: Vấn đề
              - text: Volume telemetry quá lớn làm tăng chi phí mà vẫn cần giữ tính đại diện (representativeness).
            - paragraph [ref=f81e4415]:
              - generic [ref=f81e4416]: Nguồn gốc
              - text: OpenTelemetry Concepts - Sampling
            - paragraph [ref=f81e4417]:
              - generic [ref=f81e4418]: Giải pháp
              - text: Chọn tập con trace đại diện để xử lý/xuất, giảm chi phí mà vẫn có khả năng phân tích. Cần cân nhắc representativeness, rule domain-specific và ngân sách observability.
            - paragraph [ref=f81e4419]: "Liên quan: head_based_sampling, tail_based_sampling, cardinality"
          - article [ref=f81e4420]:
            - heading "SLI / SLO" [level=4] [ref=f81e4421]
            - paragraph [ref=f81e4422]: "còn gọi: service level indicator, service level objective, mức cam kết dịch vụ"
            - paragraph [ref=f81e4423]:
              - generic [ref=f81e4424]: Vấn đề
              - text: "Không có con số thống nhất cho 'nhanh là bao nhiêu, ổn là bao nhiêu': mỗi lần tranh luận làm feature hay vá độ ổn định chỉ là cảm tính; business hứa 99.99% với khách nhưng kỹ thuật không biết mình đang ở đâu và cái gì quan trọng nhất."
            - paragraph [ref=f81e4425]:
              - generic [ref=f81e4426]: Nguồn gốc
              - text: Google SRE Workbook, chương 2 'Implementing SLOs' (2018)
            - paragraph [ref=f81e4427]:
              - generic [ref=f81e4428]: Giải pháp
              - text: SLI = tỷ số đo được (requests tốt/tổng, latency dưới ngưỡng/tổng), SLO = mục tiêu (99.9% trong 30 ngày) đặt KHÔNG quá sát cam kết với khách, làm thước đo chung cho mọi quyết định ưu tiên.
            - paragraph [ref=f81e4429]:
              - text: "Liên quan:"
              - link "Error budget" [ref=f81e4430] [cursor=pointer]:
                - /url: "#error-budget"
              - text: ", Burn rate multiwindow alerting,"
              - link "RED method" [ref=f81e4431] [cursor=pointer]:
                - /url: "#red-method"
          - article [ref=f81e4432]:
            - heading "Span" [level=4] [ref=f81e4433]
            - paragraph [ref=f81e4434]: "còn gọi: span_id"
            - paragraph [ref=f81e4435]:
              - generic [ref=f81e4436]: Vấn đề
              - text: Cần đơn vị đo lường thời gian và ngữ cảnh cho từng thao tác trong trace.
            - paragraph [ref=f81e4437]:
              - generic [ref=f81e4438]: Nguồn gốc
              - text: OpenTelemetry Project
            - paragraph [ref=f81e4439]:
              - generic [ref=f81e4440]: Giải pháp
              - text: Span là đơn vị công việc trong trace (operation name, start/end time, attributes, events, status). Liên kết parent-child tạo thành cây causal.
            - paragraph [ref=f81e4441]:
              - text: "Liên quan:"
              - link "trace" [ref=f81e4442] [cursor=pointer]:
                - /url: "#trace"
              - text: ","
              - link "traceparent" [ref=f81e4443] [cursor=pointer]:
                - /url: "#traceparent"
              - text: ","
              - link "OpenTelemetry" [ref=f81e4444] [cursor=pointer]:
                - /url: "#opentelemetry"
          - article [ref=f81e4445]:
            - heading "Toil" [level=4] [ref=f81e4446]
            - paragraph [ref=f81e4447]: "còn gọi: công việc vận hành thủ công, toil vận hành"
            - paragraph [ref=f81e4448]:
              - generic [ref=f81e4449]: Vấn đề
              - text: Công việc vận hành lặp lại, thủ công làm tiêu tốn thời gian SRE, giảm khả năng tập trung vào việc bền vững.
            - paragraph [ref=f81e4450]:
              - generic [ref=f81e4451]: Nguồn gốc
              - text: Google SRE Book - Chapter 5 (Eliminating Toil)
            - paragraph [ref=f81e4452]:
              - generic [ref=f81e4453]: Giải pháp
              - text: Toil là công việc vận hành sản xuất mang tính thủ công, lặp lại, có thể tự động hóa, mang tính chiến thuật, không giá trị bền vững và tỷ lệ tuyến tính theo quy mô dịch vụ. Phân biệt với overhead/engineering work có giá trị lâu dài.
            - paragraph [ref=f81e4454]:
              - text: "Liên quan: automation,"
              - link "postmortem" [ref=f81e4455] [cursor=pointer]:
                - /url: "#postmortem"
              - text: ", on_call,"
              - link "On-call rotation" [ref=f81e4456] [cursor=pointer]:
                - /url: "#on-call-rotation"
              - text: ","
              - link "Alert fatigue" [ref=f81e4457] [cursor=pointer]:
                - /url: "#alert-fatigue"
              - text: ","
              - link "Blameless postmortem" [ref=f81e4458] [cursor=pointer]:
                - /url: "#blameless-postmortem"
          - article [ref=f81e4459]:
            - heading "Trace" [level=4] [ref=f81e4460]
            - paragraph [ref=f81e4461]: "còn gọi: distributed_trace"
            - paragraph [ref=f81e4462]:
              - generic [ref=f81e4463]: Vấn đề
              - text: Cần theo dõi yêu cầu xuyên qua nhiều service trong hệ thống phân tán để gỡ lỗi hiệu quả.
            - paragraph [ref=f81e4464]:
              - generic [ref=f81e4465]: Nguồn gốc
              - text: OpenTelemetry Project; W3C Trace Context Working Group
            - paragraph [ref=f81e4466]:
              - generic [ref=f81e4467]: Giải pháp
              - text: Trace là cây các span mô tả hành trình end-to-end của một request xuyên qua các service/process/network boundary, cho phép phân tích nguyên nhân gốc rễ.
            - paragraph [ref=f81e4468]:
              - text: "Liên quan:"
              - link "span" [ref=f81e4469] [cursor=pointer]:
                - /url: "#span"
              - text: ","
              - link "traceparent" [ref=f81e4470] [cursor=pointer]:
                - /url: "#traceparent"
              - text: ","
              - link "OpenTelemetry" [ref=f81e4471] [cursor=pointer]:
                - /url: "#opentelemetry"
          - article [ref=f81e4472]:
            - heading "USE Method" [level=4] [ref=f81e4473]
            - paragraph [ref=f81e4474]: "còn gọi: USE, Utilization-Saturation-Errors, phương pháp USE"
            - paragraph [ref=f81e4475]:
              - generic [ref=f81e4476]: Vấn đề
              - text: Cần checklist để giám sát tài nguyên hệ thống (CPU/memory/disk/network) một cách nhất quán.
            - paragraph [ref=f81e4477]:
              - generic [ref=f81e4478]: Nguồn gốc
              - text: Brendan Gregg - Performance Analysis Methodology (USE Method)
            - paragraph [ref=f81e4479]:
              - generic [ref=f81e4480]: Giải pháp
              - text: Utilization (% thời gian tài nguyên bận), Saturation (mức độ công việc chờ/xử lý, queue), Errors (số sự kiện lỗi tài nguyên). Tập trung vào resource-level.
            - paragraph [ref=f81e4481]:
              - text: "Liên quan: four_golden_signals, RED_method, saturation,"
              - link "RED method" [ref=f81e4482] [cursor=pointer]:
                - /url: "#red-method"
              - text: ","
              - link "Four golden signals" [ref=f81e4483] [cursor=pointer]:
                - /url: "#four-golden-signals"
              - text: ","
              - link "Metrics (time-series)" [ref=f81e4484] [cursor=pointer]:
                - /url: "#metrics-time-series"
        - generic [ref=f81e4485]:
          - heading "Bền vững & Chị tải 21" [level=3] [ref=f81e4486]:
            - text: Bền vững & Chị tải
            - generic [ref=f81e4487]: "21"
          - article [ref=f81e4488]:
            - heading "Bottleneck Analysis" [level=4] [ref=f81e4489]
            - paragraph [ref=f81e4490]: "còn gọi: phát hiện nút thắt, performance bottleneck"
            - paragraph [ref=f81e4491]:
              - generic [ref=f81e4492]: Vấn đề
              - text: "Scale sai chỗ: thêm CPU nhưng vẫn chậm vì I/O/DB/connection."
            - paragraph [ref=f81e4493]:
              - generic [ref=f81e4494]: Giải pháp
              - text: "Tìm resource giới hạn: theo dõi CPU, memory, network, disk I/O, DB query time, connection pool usage, queue depth. Dùng Amdahl's Law, flame graph, tracing (distributed tracing), log correlation. Focus vào resource có utilization cao nhất kèm latency tăng."
            - paragraph [ref=f81e4495]:
              - text: "Liên quan:"
              - link "Capacity Planning" [ref=f81e4496] [cursor=pointer]:
                - /url: "#capacity-planning"
              - text: ","
              - link "Load Testing" [ref=f81e4497] [cursor=pointer]:
                - /url: "#load-testing"
              - text: ","
              - link "Little's Law" [ref=f81e4498] [cursor=pointer]:
                - /url: "#little-s-law"
          - article [ref=f81e4499]:
            - heading "Bulk Sync" [level=4] [ref=f81e4500]
            - paragraph [ref=f81e4501]: "còn gọi: đồng bộ hàng loạt, batch sync, delta sync"
            - paragraph [ref=f81e4502]:
              - generic [ref=f81e4503]: Vấn đề
              - text: Sync từng item 1-1 gây nhiều request nhỏ → quá tải network/DB.
            - paragraph [ref=f81e4504]:
              - generic [ref=f81e4505]: Giải pháp
              - text: Gom nhiều thay đổi vào 1 request (batch) để giảm round-trip. Có thể dùng delta sync (chỉ sync thay đổi từ cursor) thay vì full sync. Cần xử lý partial failure, idempotency, backpressure khi batch quá lớn.
            - paragraph [ref=f81e4506]:
              - text: "Liên quan:"
              - link "Graceful Degradation" [ref=f81e4507] [cursor=pointer]:
                - /url: "#graceful-degradation"
              - text: ","
              - link "Retry" [ref=f81e4508] [cursor=pointer]:
                - /url: "#retry"
              - text: ","
              - link "Queue Backpressure" [ref=f81e4509] [cursor=pointer]:
                - /url: "#queue-backpressure"
          - article [ref=f81e4510]:
            - heading "Bulkhead" [level=4] [ref=f81e4511]
            - paragraph [ref=f81e4512]: "còn gọi: vách kín, bulkhead isolation, cell-based architecture"
            - paragraph [ref=f81e4513]:
              - generic [ref=f81e4514]: Vấn đề
              - text: Một dependency chậm/hỏng ăn hết connection pool hoặc thread pool dùng chung, khiến các service khác khỏe mạnh cũng không gọi được.
            - paragraph [ref=f81e4515]:
              - generic [ref=f81e4516]: Nguồn gốc
              - text: Lấy tên từ vách kín tàu thủy (hull section chỉ ngập phần bị thủng); được tài liệu hóa trong sách 'Release It!' (Michael Nygard) và Azure Architecture Center pattern 'Bulkhead'.
            - paragraph [ref=f81e4517]:
              - generic [ref=f81e4518]: Giải pháp
              - text: "Chia tài nguyên (thread pool, connection pool, container, queue) thành từng nhóm biệt lập cho từng dependency/tenant: dependency A chết chỉ làm pool của A đầy, pool B/C vẫn chạy. Chi phí là ít dùng chung tài nguyên hơn; thường kết hợp với circuit breaker + retry."
            - paragraph [ref=f81e4519]:
              - text: "Liên quan:"
              - link "Circuit Breaker" [ref=f81e4520] [cursor=pointer]:
                - /url: "#circuit-breaker"
              - text: ","
              - link "Connection Pool Sizing" [ref=f81e4521] [cursor=pointer]:
                - /url: "#connection-pool-sizing"
              - text: ","
              - link "Thread Pool Sizing" [ref=f81e4522] [cursor=pointer]:
                - /url: "#thread-pool-sizing"
          - article [ref=f81e4523]:
            - heading "Capacity Planning" [level=4] [ref=f81e4524]
            - paragraph [ref=f81e4525]: "còn gọi: lập kế hoạch dung lượng, capacity forecast"
            - paragraph [ref=f81e4526]:
              - generic [ref=f81e4527]: Vấn đề
              - text: Không dự trù dung lượng → sập giờ cao điểm; over-provision quanh năm → lãng phí.
            - paragraph [ref=f81e4528]:
              - generic [ref=f81e4529]: Giải pháp
              - text: Dự báo traffic → quy đổi resource (CPU, IOPS, connection, bandwidth) → so với capacity hiện tại + headroom; kết hợp load test để đo điểm bão hòa thật.
            - paragraph [ref=f81e4530]:
              - text: "Liên quan:"
              - link "Load Testing" [ref=f81e4531] [cursor=pointer]:
                - /url: "#load-testing"
