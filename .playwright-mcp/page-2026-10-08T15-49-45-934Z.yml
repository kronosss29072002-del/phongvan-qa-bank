                - /url: "#deterministic-test"
          - article [ref=f81e5396]:
            - heading "refactoring" [level=4] [ref=f81e5397]
            - paragraph [ref=f81e5398]: "còn gọi: code refactoring"
            - paragraph [ref=f81e5399]:
              - generic [ref=f81e5400]: Vấn đề
              - text: Code hoạt động nhưng khó đọc/sửa. Nếu sửa mà không có test, nguy cơ regression cao.
            - paragraph [ref=f81e5401]:
              - generic [ref=f81e5402]: Nguồn gốc
              - text: Martin Fowler (Refactoring book)
            - paragraph [ref=f81e5403]:
              - generic [ref=f81e5404]: Giải pháp
              - text: Thay đổi cấu trúc nội bộ mà giữ hành vi ngoài. Luôn có test bảo vệ, refactor nhỏ từng bước.
            - paragraph [ref=f81e5405]:
              - text: "Liên quan:"
              - link "TDD" [ref=f81e5406] [cursor=pointer]:
                - /url: "#tdd"
              - text: ","
              - link "red-green-refactor" [ref=f81e5407] [cursor=pointer]:
                - /url: "#red-green-refactor"
              - text: ","
              - link "technical debt" [ref=f81e5408] [cursor=pointer]:
                - /url: "#technical-debt"
              - text: ","
              - link "regression test" [ref=f81e5409] [cursor=pointer]:
                - /url: "#regression-test"
          - article [ref=f81e5410]:
            - heading "snapshot test" [level=4] [ref=f81e5411]
            - paragraph [ref=f81e5412]: "còn gọi: snapshot testing"
            - paragraph [ref=f81e5413]:
              - generic [ref=f81e5414]: Vấn đề
              - text: Khi output lớn (UI, JSON) thay đổi, khó viết assertion thủ công cho từng field. Cần phát hiện thay đổi không mong muốn nhanh.
            - paragraph [ref=f81e5415]:
              - generic [ref=f81e5416]: Nguồn gốc
              - text: Jest popularized snapshot testing
            - paragraph [ref=f81e5417]:
              - generic [ref=f81e5418]: Giải pháp
              - text: Lưu output mẫu (snapshot) lần đầu, so sánh với output hiện tại. Chỉ update snapshot khi thay đổi có chủ đích.
            - paragraph [ref=f81e5419]:
              - text: "Liên quan:"
              - link "regression test" [ref=f81e5420] [cursor=pointer]:
                - /url: "#regression-test"
              - text: ","
              - link "golden master" [ref=f81e5421] [cursor=pointer]:
                - /url: "#golden-master"
          - article [ref=f81e5422]:
            - heading "SOLID" [level=4] [ref=f81e5423]
            - paragraph [ref=f81e5424]: "còn gọi: SOLID principles"
            - paragraph [ref=f81e5425]:
              - generic [ref=f81e5426]: Vấn đề
              - text: Class/module phụ thuộc chặt chẽ → thay đổi nhỏ gây ripple effect, khó test, khó mở rộng.
            - paragraph [ref=f81e5427]:
              - generic [ref=f81e5428]: Nguồn gốc
              - text: Robert C. Martin (Uncle Bob)
            - paragraph [ref=f81e5429]:
              - generic [ref=f81e5430]: Giải pháp
              - text: "5 nguyên tắc: SRP, OCP, LSP, ISP, DIP giúp giảm coupling, tăng cohesion, dễ test."
            - paragraph [ref=f81e5431]:
              - text: "Liên quan:"
              - link "refactoring" [ref=f81e5432] [cursor=pointer]:
                - /url: "#refactoring"
              - text: ","
              - link "technical debt" [ref=f81e5433] [cursor=pointer]:
