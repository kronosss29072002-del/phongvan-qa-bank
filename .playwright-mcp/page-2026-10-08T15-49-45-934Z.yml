              - text: Tiêu chuẩn SQL-92
            - paragraph [ref=f81e3131]:
              - generic [ref=f81e3132]: Giải pháp
              - text: "Xác định loại nhiễu được phép: Read Uncommitted thấp nhất, Read Committed, Repeatable Read, Serializable cao nhất."
