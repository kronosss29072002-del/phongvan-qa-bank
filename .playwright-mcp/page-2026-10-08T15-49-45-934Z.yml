          - article [ref=f81e5357]:
            - heading "load test" [level=4] [ref=f81e5358]
            - paragraph [ref=f81e5359]: "còn gọi: load testing"
            - paragraph [ref=f81e5360]:
              - generic [ref=f81e5361]: Vấn đề
              - text: Hệ thống chạy tốt với 1 user nhưng chậm/mất phản hồi khi có hàng nghìn user truy cập đồng thời.
            - paragraph [ref=f81e5362]:
              - generic [ref=f81e5363]: Nguồn gốc
              - text: Performance testing practice
            - paragraph [ref=f81e5364]:
              - generic [ref=f81e5365]: Giải pháp
              - text: Mô phỏng tải dự kiến (expected load) để đo throughput, latency, error rate. Xác định ngưỡng ổn định.
            - paragraph [ref=f81e5366]:
              - text: "Liên quan:"
              - link "stress test" [ref=f81e5367] [cursor=pointer]:
                - /url: "#stress-test"
              - text: ","
              - link "soak test" [ref=f81e5368] [cursor=pointer]:
                - /url: "#soak-test"
              - text: ","
              - link "smoke test" [ref=f81e5369] [cursor=pointer]:
                - /url: "#smoke-test"
          - article [ref=f81e5370]:
            - heading "mocking/stub/fake/spy" [level=4] [ref=f81e5371]
            - paragraph [ref=f81e5372]: "còn gọi: mock, stub, fake, spy, test doubles"
            - paragraph [ref=f81e5373]:
              - generic [ref=f81e5374]: Vấn đề
              - text: Muốn test đơn vị nhưng phụ thuộc external (DB, API, time, filesystem) chậm, không ổn định, hoặc khó kiểm soát.
            - paragraph [ref=f81e5375]:
              - generic [ref=f81e5376]: Nguồn gốc
              - text: Gerard Meszaros (Test Doubles)
            - paragraph [ref=f81e5377]:
              - generic [ref=f81e5378]: Giải pháp
              - text: "Stub: cung cấp dữ liệu cứng. Mock: xác minh tương tác. Fake: triển khai đơn giản (in-memory). Spy: ghi lại gọi."
            - paragraph [ref=f81e5379]:
              - text: "Liên quan:"
              - link "unit test" [ref=f81e5380] [cursor=pointer]:
                - /url: "#unit-test"
              - text: ","
              - link "test isolation" [ref=f81e5381] [cursor=pointer]:
                - /url: "#test-isolation"
              - text: ","
              - link "contract test (Pact)" [ref=f81e5382] [cursor=pointer]:
                - /url: "#contract-test-pact"
          - article [ref=f81e5383]:
            - heading "parallel test execution" [level=4] [ref=f81e5384]
            - paragraph [ref=f81e5385]: "còn gọi: parallel testing"
            - paragraph [ref=f81e5386]:
              - generic [ref=f81e5387]: Vấn đề
              - text: Suite test ngày càng lớn → thời gian CI kéo dài, chậm feedback. Cần chạy song song để rút ngắn.
            - paragraph [ref=f81e5388]:
              - generic [ref=f81e5389]: Nguồn gốc
              - text: CI/CD scaling
            - paragraph [ref=f81e5390]:
              - generic [ref=f81e5391]: Giải pháp
              - text: Chia test chạy đồng thời trên nhiều worker. Yêu cầu test hoàn toàn độc lập (no shared state) để tránh race/flaky.
            - paragraph [ref=f81e5392]:
              - text: "Liên quan:"
              - link "test isolation" [ref=f81e5393] [cursor=pointer]:
                - /url: "#test-isolation"
              - text: ","
