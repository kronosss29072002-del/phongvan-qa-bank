                - /url: "#hot-key"
        - generic [ref=f81e6236]:
          - heading "Hiệu năng 14" [level=3] [ref=f81e6237]:
            - text: Hiệu năng
            - generic [ref=f81e6238]: "14"
          - article [ref=f81e6239]:
            - heading "BBR congestion control" [level=4] [ref=f81e6240]
            - paragraph [ref=f81e6241]: "còn gọi: BBR, Bottleneck Bandwidth and RTT, model-based congestion control"
            - paragraph [ref=f81e6242]:
              - generic [ref=f81e6243]: Vấn đề
              - text: "Cubic/Reno đo xung đột bằng packet loss, nhưng mạng modern (WiFi, mobile, đường truyền đầy) mất tín hiệu: buffer đầy 100-500ms mới drop → throughput cao nhưng latency phình kinh khủng (bộ đệm đọng)."
            - paragraph [ref=f81e6244]:
              - generic [ref=f81e6245]: Nguồn gốc
              - text: Nhóm BBR của Google (Neal Cardwell, Yuchung Cheng, Soheil Hassas Yeganeh, Van Jacobson), công bố rộng năm 2016 (ACM Queue + list bbr-dev, github.com/google/bbr)
            - paragraph [ref=f81e6246]:
              - generic [ref=f81e6247]: Giải pháp
              - text: "Ước tính 2 tham số: bottleneck bandwidth (BtlBw) và minimum RTT (RTprop) bằng delivery rate, rồi giữ cwnd ≈ BtlBw × RTprop (BDP) — gửi đủ để lấp ống nhưng không phình buffer. Gồm 4 giai đoạn: Startup (slow start gain), Drain, ProbeBW, ProbeRTT. Ít loss hơn, latency ổn định hơn trong nhiều thực nghiệm Google/Cloudflare."
            - paragraph [ref=f81e6248]:
              - text: "Liên quan: Slow start,"
              - link "Bufferbloat" [ref=f81e6249] [cursor=pointer]:
                - /url: "#bufferbloat"
              - text: ","
              - link "Bandwidth vs latency" [ref=f81e6250] [cursor=pointer]:
                - /url: "#bandwidth-vs-latency"
          - article [ref=f81e6251]:
            - heading "cgroup limits, CPU throttling & noisy neighbor" [level=4] [ref=f81e6252]
            - paragraph [ref=f81e6253]: "còn gọi: CFS throttling, cpu.max, container CPU limit, noisy neighbor, steal time"
            - paragraph [ref=f81e6254]:
              - generic [ref=f81e6255]: Vấn đề
              - text: Container có limit 1 CPU nhưng code dùng hết quota mỗi kỳ scheduler (100ms) rồi bị CFS throttle đến hết kỳ — latency nhảy vọt dù CPU trung bình chỉ 60%, hoặc VM trên cùng host bị 'steal time' do tenant khác.
            - paragraph [ref=f81e6256]:
              - generic [ref=f81e6257]: Nguồn gốc
              - text: CFS bandwidth control (throttle theo quota) do Paul Turner và cộng sự phát triển cho Linux — từ cuối thập niên 2000/2010; 'noisy neighbor' là thuật ngữ cloud phổ biến từ ~2010s
            - paragraph [ref=f81e6258]:
              - generic [ref=f81e6259]: Giải pháp
              - text: "cgroup v2 cpu.max = quota/period; vượt quota → runnable nhưng bị dừng (throttled, cfs_throttled_count tăng). Noisy neighbor: hypervisor/shared storage contention làm steal/latency tăng không do code. Xử lý: period lớn hơn GC spike, tránh limit quá sát, monitor throttled_usec và steal, chọn dedicated/host resources khi cần."
            - paragraph [ref=f81e6260]: "Liên quan: CPU pinning, Performance budget, SLO-driven optimization"
          - article [ref=f81e6261]:
            - heading "Coordinated omission" [level=4] [ref=f81e6262]
            - paragraph [ref=f81e6263]: "còn gọi: omission được điều phối, Gil Tene coordinated omission"
            - paragraph [ref=f81e6264]:
              - generic [ref=f81e6265]: Vấn đề
              - text: Benchmark gửi request theo lịch cố định; khi server kẹt 10 giây, client 'bỏ lỡ' hàng trăm lần gửi, các lần gửi tiếp theo chỉ đo được latency khi hệ thống đã hồi phục — số liệu đẹp hoàn toàn giả.
            - paragraph [ref=f81e6266]:
              - generic [ref=f81e6267]: Nguồn gốc
              - text: Gil Tene (Azul Systems), talk 'How NOT to Measure Latency', QCon San Francisco 2015
            - paragraph [ref=f81e6268]:
              - generic [ref=f81e6269]: Giải pháp
              - text: "Lỗi đo lường: thời gian bị miss không được ghi nhận nên histogram thiếu đúng các mẫu xấu nhất. Cách sửa: bắn request theo lịch trình đều từ thời điểm cố định (open-loop load gen, như wrk2/hdrhistogram ' coordinated omission correction'), hoặc ghi lại cả khoảng trống vào histogram để percentile phản ánh đúng trải nghiệm."
            - paragraph [ref=f81e6270]:
              - text: "Liên quan: HDR Histogram,"
              - link "Tail latency" [ref=f81e6271] [cursor=pointer]:
                - /url: "#tail-latency"
              - text: ", Microbenchmark"
          - article [ref=f81e6272]:
            - heading "False sharing" [level=4] [ref=f81e6273]
            - paragraph [ref=f81e6274]: "còn gọi: chia sẻ ảo, false sharing cache"
            - paragraph [ref=f81e6275]:
              - generic [ref=f81e6276]: Vấn đề
              - text: Bốn thread cộng biến đếm riêng trên cùng một mảng nguyên – mỗi luồng 'chỉ sở hữu' một phần, nhưng hiệu năng tụt 4-10x vì core liên tục giành lại cùng một cache line.
            - paragraph [ref=f81e6277]:
              - generic [ref=f81e6278]: Giải pháp
              - text: "Cache chia sẻ theo cache line (thường 64 byte); hai biến độc lập nằm chung một dòng cache bị invalidate liên tục khi core khác ghi. Fix: pad biên mảng/struct cho đủ cache line, tách biến hot của các thread ra xa, dùng per-thread counter rồi giảm ở cuối."
            - paragraph [ref=f81e6279]:
              - text: "Liên quan:"
              - link "CPU cache line" [ref=f81e6280] [cursor=pointer]:
                - /url: "#cpu-cache-line"
              - text: ", Cache locality, NUMA"
          - article [ref=f81e6281]:
            - heading "fsync cost & SSD vs HDD latency" [level=4] [ref=f81e6282]
            - paragraph [ref=f81e6283]: "còn gọi: fsync, durability, độ trễ ghi bền, SSD latency, fsync fdatasync"
            - paragraph [ref=f81e6284]:
              - generic [ref=f81e6285]: Vấn đề
              - text: "WAL ghi mỗi transaction kèm fsync: HDD tốn ~5-15ms mỗi lần (seek), SSD ~0.05-0.5ms — cùng code, cùng ổ 'đĩa', khác HDD thì throughput chỉ vài trăm ghi/giây."
            - paragraph [ref=f81e6286]:
              - generic [ref=f81e6287]: Giải pháp
              - text: "fsync đảm bảo dữ liệu trong cache trang đã về thiết bị bền (power-loss safe); overhead chủ yếu do seek/commit internal của ổ. Tối ưu: group commit (gộp fsync nhiều transaction), ghi log tuần tự thay vì random, fdatasync khi metadata không đổi, dùng NVMe/PLP SSD cho OLTP. Benchmark phải đo cả mixed workload với QD thực."
            - paragraph [ref=f81e6288]:
              - text: "Liên quan: Disk IOPS,"
              - link "Zero-copy" [ref=f81e6289] [cursor=pointer]:
                - /url: "#zero-copy"
              - text: ", Write amplification"
          - article [ref=f81e6290]:
            - heading "Head-of-line blocking" [level=4] [ref=f81e6291]
            - paragraph [ref=f81e6292]: "còn gọi: HOL blocking, đầu hàng bị chặn, queue head blocking, chặn đầu hàng, chặn hàng đầu, đứng hàng đầu dòng"
            - paragraph [ref=f81e6293]:
              - generic [ref=f81e6294]: Vấn đề
              - text: Một packet mất trên đường truyền khiến request A chưa xong kéo theo B, C (không liên quan) chờ dù chúng hoàn toàn sẵn sàng — HTTP/2 'multiplexing' vẫn chậm sau một loss.
            - paragraph [ref=f81e6295]:
              - generic [ref=f81e6296]: Nguồn gốc
              - text: Hiện tượng đã được mô tả trong networking hàng thập niên; trở nên nổi bật với HOL của HTTP/1.1 pipelining và HOL của HTTP/2-over-TCP
            - paragraph [ref=f81e6297]:
              - generic [ref=f81e6298]: Giải pháp
              - text: "Hàng đợi chỉ dịch chuyển khi phần tử đầu xử lý xong. HTTP/1.1: response đến theo thứ tự nên response chậm chặn response nhanh (giải quyết bằng nhiều connection/pipelining có giới hạn). HTTP/2: gỡ HOL ứng dụng nhưng giữ HOL vận chuyển ở tầng TCP. HTTP/3 (QUIC) tách stream riêng — loss của stream này không chặn stream khác."
            - paragraph [ref=f81e6299]:
              - text: "Liên quan:"
              - link "HTTP/2 multiplexing" [ref=f81e6300] [cursor=pointer]:
                - /url: "#http-2-multiplexing"
              - text: ", Head-of-line, BBR,"
              - link "Queue Backpressure" [ref=f81e6301] [cursor=pointer]:
                - /url: "#queue-backpressure"
              - text: ","
              - link "Thread Pool Sizing" [ref=f81e6302] [cursor=pointer]:
                - /url: "#thread-pool-sizing"
              - text: ","
              - link "Tail Latency" [ref=f81e6303] [cursor=pointer]:
                - /url: "#tail-latency"
              - text: ","
              - link "Bottleneck Analysis" [ref=f81e6304] [cursor=pointer]:
                - /url: "#bottleneck-analysis"
              - text: ","
              - link "TCP" [ref=f81e6305] [cursor=pointer]:
                - /url: "#tcp"
              - text: ","
              - link "HTTP/2" [ref=f81e6306] [cursor=pointer]:
                - /url: "#http-2"
              - text: ","
              - link "HTTP/3 (QUIC)" [ref=f81e6307] [cursor=pointer]:
                - /url: "#http-3-quic"
              - text: ","
              - link "UDP" [ref=f81e6308] [cursor=pointer]:
                - /url: "#udp"
              - text: ", Multiplexing"
          - article [ref=f81e6309]:
            - heading "io_uring" [level=4] [ref=f81e6310]
            - paragraph [ref=f81e6311]: "còn gọi: Linux async I/O, io_uring SQE CQE, async syscall Linux, io_uring SQ/CQ"
            - paragraph [ref=f81e6312]:
              - generic [ref=f81e6313]: Vấn đề
              - text: Mô hình epoll + read/write vẫn tốn syscall cho từng bước (submit, complete), và AIO cổ điển của Linux chỉ hỗ trợ I/O đĩa không làm được socket/nhánh khác — server rất nhanh nhưng bị bottleneck ở chuyển ngữ cảnh.
            - paragraph [ref=f81e6314]:
              - generic [ref=f81e6315]: Nguồn gốc
              - text: Jens Axboe, giới thiệu trong Linux 5.1 (2019) — theo kernelnewbies.org/Linux_5.1
            - paragraph [ref=f81e6316]:
              - generic [ref=f81e6317]: Giải pháp
              - text: "Hai vòng shared memory (submission queue / completion queue) giữa user và kernel: xếp hàng nhiều request I/O (read/write/accept/timeout...) mà không cần syscall mỗi cái, batch submit/batch reap, đăng ký fixed buffer và fd. Giảm syscall + cache-line ping-pong, đạt throughput I/O cao với ít luồng."
            - paragraph [ref=f81e6318]:
              - text: "Liên quan: Syscall batching,"
              - link "Zero-copy" [ref=f81e6319] [cursor=pointer]:
                - /url: "#zero-copy"
              - text: ","
              - link "Event loop" [ref=f81e6320] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ","
              - link "Proactor pattern" [ref=f81e6321] [cursor=pointer]:
                - /url: "#proactor-pattern"
              - text: ","
              - link "Non-blocking I/O" [ref=f81e6322] [cursor=pointer]:
                - /url: "#non-blocking-i-o"
              - text: ","
              - link "epoll" [ref=f81e6323] [cursor=pointer]:
                - /url: "#epoll"
              - text: ","
              - link "Context switch cost" [ref=f81e6324] [cursor=pointer]:
                - /url: "#context-switch-cost"
          - article [ref=f81e6325]:
            - heading "NUMA & CPU pinning" [level=4] [ref=f81e6326]
            - paragraph [ref=f81e6327]: "còn gọi: non-uniform memory access, numactl, CPU affinity, core pinning, isolcpus"
            - paragraph [ref=f81e6328]:
              - generic [ref=f81e6329]: Vấn đề
              - text: "Process ghi dữ liệu từ node 0 nhưng thread chạy ở node 1: mỗi truy cập RAM phải qua QPI/UPI interconnect — hiệu năng tụt 10-30% khó hiểu vì 'cùng một máy'."
            - paragraph [ref=f81e6330]:
              - generic [ref=f81e6331]: Giải pháp
              - text: "NUMA: mỗi socket có RAM cục bộ; truy cập remote node chậm hơn (độ trễ khác nhau — 'không đều'). Tối ưu: numactl --cpunodebind/--membind, thread pool locality theo socket,allocate gần CPU xử lý. CPU pinning (taskset/cgroup cpuset) tránh di chuyển thread → cache ấm, jitter giảm; hữu ích cho hot path và benchmark."
            - paragraph [ref=f81e6332]:
              - text: "Liên quan:"
              - link "False sharing" [ref=f81e6333] [cursor=pointer]:
                - /url: "#false-sharing"
              - text: ","
              - link "Context switch cost" [ref=f81e6334] [cursor=pointer]:
                - /url: "#context-switch-cost"
              - text: ", Huge page"
          - article [ref=f81e6335]:
            - heading "Page fault, swap & OOM killer" [level=4] [ref=f81e6336]
            - paragraph [ref=f81e6337]: "còn gọi: page fault, major/minor fault, swapping, OOM killer, out of memory"
            - paragraph [ref=f81e6338]:
              - generic [ref=f81e6339]: Vấn đề
              - text: "Dịch vụ đột nhiên treo 1-2 giây rồi bị kill (exit 137) khi container chạm limit: trang bị trục xuất ra swap hoặc OOM killer chọn kill process."
            - paragraph [ref=f81e6340]:
              - generic [ref=f81e6341]: Giải pháp
              - text: "Page fault: truy cập trang chưa nạp — minor (cập nhật bảng trang), major (đọc từ disk, hàng ms). Swap/region trục xuất: fault major khi truy cập lại → latency spike. OOM: kernel/cgroup vượt bộ nhớ → kill process (oom_score). Xử lý: bật/đo memory.swap, giới hạn heap rõ ràng, tránh overcommit liều, set memory request/limit hợp lý."
            - paragraph [ref=f81e6342]: "Liên quan: Cgroup limits, NUMA, Stop-the-world"
          - article [ref=f81e6343]:
            - heading "Regression detection trong benchmark & A/B perf testing" [level=4] [ref=f81e6344]
            - paragraph [ref=f81e6345]: "còn gọi: performance regression, perf A/B test, canary benchmark, benchmark CI"
            - paragraph [ref=f81e6346]:
              - generic [ref=f81e6347]: Vấn đề
              - text: Hàng trăm commit mỗi tuần, mỗi commit thêm vài % overhead tích lũy — không ai phát hiện đến khi hệ thống chậm gấp đôi sau 3 tháng.
            - paragraph [ref=f81e6348]:
              - generic [ref=f81e6349]: Giải pháp
              - text: "Chạy benchmark cố định (máy chuyên dụng hoặc container có pin CPU) trên mỗi commit/PR, so sánh với baseline bằng test thống kê (không chỉ so 1 con số), cảnh báo vượt ngưỡng noise. A/B perf: song song 2 version trên cùng traffic/workload, so p50/p99 với CI. Kết hợp canary deploy + synthetic probe production."
            - paragraph [ref=f81e6350]: "Liên quan: Statistical significance in benchmarks, Microbenchmark, Capacity test"
          - article [ref=f81e6351]:
            - heading "Tail latency" [level=4] [ref=f81e6352]
            - paragraph [ref=f81e6353]: "còn gọi: độ trễ đuôi, tail latency at scale, p99 latency, latency tail"
            - paragraph [ref=f81e6354]:
              - generic [ref=f81e6355]: Vấn đề
              - text: "Hệ thống hàng nghìn máy có request phải chờ nhiều service: dù mỗi service chỉ 1% request chậm, fan-out 100 nhánh khiến xác suất ít nhất 1 nhánh chậm là ~63%, user thấy chậm thường xuyên hơn nhiều so với con số p99 từng service."
            - paragraph [ref=f81e6356]:
              - generic [ref=f81e6357]: Nguồn gốc
              - text: Jeff Dean & Luis Barroso, 'The Tail at Scale', ACM CACM tháng 3/2013
            - paragraph [ref=f81e6358]:
              - generic [ref=f81e6359]: Giải pháp
              - text: "Đo và đặt ngân sách cho phần đuôi phân phối (p99/p99.9) thay vì trung bình. Kiến trúc giảm tail: hedged request (gửi bản sao sau ngưỡng trễ), tách cụm riêng cho tenant chậm, ưu tiên request, giảm fan-out. Theo đuôi qua histogram, không qua mean."
            - paragraph [ref=f81e6360]:
              - text: "Liên quan: Phân vị p50/p95/p99, Fan-out, Latency histogram,"
              - link "Head-of-Line Blocking" [ref=f81e6361] [cursor=pointer]:
                - /url: "#head-of-line-blocking"
              - text: ","
              - link "Latency SLO" [ref=f81e6362] [cursor=pointer]:
                - /url: "#latency-slo"
              - text: ","
              - link "Deadline Propagation" [ref=f81e6363] [cursor=pointer]:
                - /url: "#deadline-propagation"
          - article [ref=f81e6364]:
            - heading "TLS handshake cost, session resumption, OCSP stapling" [level=4] [ref=f81e6365]
            - paragraph [ref=f81e6366]: "còn gọi: TLS handshake, session resumption, OCSP stapling, 0-RTT, session ticket"
            - paragraph [ref=f81e6367]:
              - generic [ref=f81e6368]: Vấn đề
              - text: TLS 1.2 full handshake thêm 2 RTT (+ chứng chỉ vài KB) mỗi kết nối mới; OCSP check riêng làm chậm thêm; client ở đường truyền 200ms thấy chậm rõ rệt.
            - paragraph [ref=f81e6369]:
              - generic [ref=f81e6370]: Nguồn gốc
              - text: OCSP stapling mô tả tại RFC 6960 (2013) và RFC 6066 (session ticket, 2011)
            - paragraph [ref=f81e6371]:
              - generic [ref=f81e6372]: Giải pháp
              - text: "Session resumption (session ID/ticket TLS 1.2, PSK TLS 1.3) bỏ đi phần trao đổi chứng chỉ. TLS 1.3 rút handshake còn 1-RTT (0-RTT với replay risk). OCSP stapling: server tự staple phản hồi OCSP tươi (CRL/OCSP check) thay vì browser tự hỏi CA — giảm 1 chu kỳ mạng và lỗi CA-down."
            - paragraph [ref=f81e6373]:
              - text: "Liên quan: TLS handshake cost,"
              - link "Keep-alive" [ref=f81e6374] [cursor=pointer]:
                - /url: "#keep-alive"
              - text: ", Speed of light RTT"
          - article [ref=f81e6375]:
            - heading "Warmup & statistical significance trong benchmark" [level=4] [ref=f81e6376]
            - paragraph [ref=f81e6377]: "còn gọi: warm-up, độ tin cậy thống kê, confidence interval benchmark, noise floor"
            - paragraph [ref=f81e6378]:
              - generic [ref=f81e6379]: Vấn đề
              - text: So sánh 2 commit, bản A nhanh hơn 3% rồi 'merge đi' — chạy lại 10 lần thì khác biệt nằm trong noise, rồi 'performance regression' ảo kéo dài hàng tuần.
            - paragraph [ref=f81e6380]:
              - generic [ref=f81e6381]: Giải pháp
              - text: "Warmup: cho JIT/OS/page cache/branch predictor ổn định trước khi đo (JVM, DB buffer pool). Ý nghĩa thống kê: chạy đủ mẫu (n≥10-30), loại outlier có lý do, tính CI/p-value hoặc ít nhất là overlap của median±IQR; ngưỡng regression phải vượt noise floor đo được (vd >5% và CI không giao)."
            - paragraph [ref=f81e6382]: "Liên quan: Microbenchmark, Regression detection in benchmarks, JIT warmup"
          - article [ref=f81e6383]:
            - 'heading "Zero-copy file: mmap & huge page" [level=4] [ref=f81e6384]'
            - paragraph [ref=f81e6385]: "còn gọi: memory-mapped file, mmap, huge pages, transparent huge pages"
            - paragraph [ref=f81e6386]:
              - generic [ref=f81e6387]: Vấn đề
              - text: Đọc file lớn rồi copy vào buffer user (read+memcpy 2 lần), hoặc cấu trúc dữ liệu khổng lồ bị TLB miss liên tục do trang 4KB thông thường.
            - paragraph [ref=f81e6388]:
              - generic [ref=f81e6389]: Giải pháp
              - text: "mmap: map file vào vùng địa chỉ, page fault nạp trang khi chạm (không copy explicit) — tiện cho random access, nhưng page fault first-touch và writeback bất ngờ có thể gây spike. Huge page (2MB/1GB) giảm số entry TLB và fault overhead; THP Linux cần kiểm tra vì compaction có thể gây pause. Tradeoff: mmap phức tạp với I/O đồng bộ và invalidate."
            - paragraph [ref=f81e6390]:
              - text: "Liên quan: Page fault, NUMA,"
              - link "Zero-copy" [ref=f81e6391] [cursor=pointer]:
                - /url: "#zero-copy"
        - generic [ref=f81e6392]:
          - heading "Phân tán & Đồng thời 9" [level=3] [ref=f81e6393]:
            - text: Phân tán & Đồng thời
            - generic [ref=f81e6394]: "9"
          - article [ref=f81e6395]:
            - heading "Actor model, CSP & goroutine" [level=4] [ref=f81e6396]
            - paragraph [ref=f81e6397]: "còn gọi: actor model, CSP, Communicating Sequential Processes, goroutine, channel, Go scheduler"
            - paragraph [ref=f81e6398]:
              - generic [ref=f81e6399]: Vấn đề
              - text: "Shared-memory concurrency quá dễ sai: mutation ẩn sau mỗi lock, deadlock/starvation khó tìm, khó test. Các hệ thống lớn ( Erlang/OTP, Go, Akka) cần mô hình mà nhiều unit chạy song song nhưng không bao giờ đụng bộ nhớ chung — và spawn một OS thread cho mỗi concurrency thì quá đắt (stack ~MB, context switch nặng)."
            - paragraph [ref=f81e6400]:
              - generic [ref=f81e6401]: Nguồn gốc
              - text: "Actor: Carl Hewitt, Peter Bishop & Richard Steiger, 'A Universal Modular Actor Formalism for Artificial Intelligence', 1973. CSP: Tony Hoare, 1978. Goroutine: ngôn ngữ Go (Google, công bố 2009)."
            - paragraph [ref=f81e6402]:
              - generic [ref=f81e6403]: Giải pháp
              - text: "Actor (Hewitt 1973): mỗi actor có mailbox riêng, chỉ giao tiếp qua message, không share state → cách ly theo thiết kế; CSP (Hoare 1978): process trao đổi qua channel đồng bộ. Goroutine của Go hiện thực hóa hướng CSP theo M:N scheduling — hàng nghìn goroutine nhẹ (stack vài KB, grow on demand) multiplex lên số thread OS nhỏ, runtime lo blocked I/O."
            - paragraph [ref=f81e6404]:
              - text: "Liên quan: Thread,"
              - link "Concurrency vs Parallelism" [ref=f81e6405] [cursor=pointer]:
                - /url: "#concurrency-vs-parallelism"
              - text: ","
              - link "Race condition" [ref=f81e6406] [cursor=pointer]:
                - /url: "#race-condition"
          - article [ref=f81e6407]:
            - heading "Byzantine fault & BFT" [level=4] [ref=f81e6408]
            - paragraph [ref=f81e6409]: "còn gọi: Byzantine fault, fault của Byzantine, BFT, Byzantine Generals Problem, lỗi quân bất lương"
            - paragraph [ref=f81e6410]:
              - generic [ref=f81e6411]: Vấn đề
              - text: "Crash-based consensus giả định node 'chết thì im lặng' — nhưng node hỏng phần mềm hoặc bị tấn công có thể gửi thông tin sai, và sai khác nhau cho từng node khác (nói A cho nhóm này, nói B cho nhóm kia): với 3 node có 1 nói dối, hai nhóm còn lại quyết định trái chiều, cluster kết luận giá trị sai mà không hề crash."
            - paragraph [ref=f81e6412]:
              - generic [ref=f81e6413]: Nguồn gốc
              - text: Robert Shostak (SRI, dự án SIFT) 1978; Marshall Pease tổng quát hóa; Lamport, Pease & Shostak, 'Reaching Agreement in the Presence of Faults', JACM 1980; biểu tượng 'Byzantine Generals Problem' do Lamport đưa ra 1982 — đoạt Dijkstra Prize 2005.
            - paragraph [ref=f81e6414]:
              - generic [ref=f81e6415]: Giải pháp
              - text: BFT cần n > 3f (không chữ ký) hoặc n > f+1 (có chữ ký số) để luôn chọn được giá trị đúng bất kể f node hành xử tùy tiện; broadcast consistency — chỉ chặn được node gửi nội dung khác nhau, không chặn node gửi cùng một giá trị sai cho tất cả.
            - paragraph [ref=f81e6416]:
              - text: "Liên quan:"
              - link "Consensus" [ref=f81e6417] [cursor=pointer]:
                - /url: "#consensus"
              - text: ","
              - link "FLP impossibility" [ref=f81e6418] [cursor=pointer]:
                - /url: "#flp-impossibility"
              - text: ","
              - link "Split brain & quorum" [ref=f81e6419] [cursor=pointer]:
                - /url: "#split-brain-quorum"
          - article [ref=f81e6420]:
            - heading "Consensus" [level=4] [ref=f81e6421]
            - paragraph [ref=f81e6422]: "còn gọi: đồng thuận phân tán, distributed consensus"
            - paragraph [ref=f81e6423]:
              - generic [ref=f81e6424]: Vấn đề
              - text: N nodes đều cần kết luận cùng một giá trị ('giá trị config nào đúng', 'log entry thứ 5 là gì') trong khi tin nhắn đến chậm, mất, hoặc node crash giữa chừng — tự quyết định riêng thì cluster phân mảnh, hai bên ghi log khác nhau và không bao giờ heal được. Bỏ phiếu không quy tắc (ad-hoc) để lại các corner case chết người không được chứng minh.
            - paragraph [ref=f81e6425]:
              - generic [ref=f81e6426]: Nguồn gốc
              - text: không rõ (nền gắn với state machine replication của Lamport; xem Paxos/Raft).
            - paragraph [ref=f81e6427]:
              - generic [ref=f81e6428]: Giải pháp
              - text: "Đề xuất → chấp thuận qua quorum: giá trị chỉ được chọn khi đủ số đông đồng ý, và mọi proposal sau phải tôn trọng giá trị đã chọn (safety); liveness phải chấp nhận đánh đổi vì FLP. Paxos và Raft là hai cách hiện thực hóa; consensus là nền của replicated state machine."
            - paragraph [ref=f81e6429]:
              - text: "Liên quan:"
              - link "Paxos" [ref=f81e6430] [cursor=pointer]:
                - /url: "#paxos"
              - text: ","
              - link "Raft" [ref=f81e6431] [cursor=pointer]:
                - /url: "#raft"
              - text: ","
              - link "FLP impossibility" [ref=f81e6432] [cursor=pointer]:
                - /url: "#flp-impossibility"
          - article [ref=f81e6433]:
            - heading "CRDT" [level=4] [ref=f81e6434]
            - paragraph [ref=f81e6435]: "còn gọi: conflict-free replicated data type, delta CRDT, state-based / op-based CRDT"
            - paragraph [ref=f81e6436]:
              - generic [ref=f81e6437]: Vấn đề
              - text: "Replicas ghi song song không cần coordination (offline app, multi-master, geo-replication) thì divergence là tất yếu: nếu conflict phải phân giải bằng cách hủy update của một bên thì user mất dữ liệu — trong khi chờ 'merge thủ công' thì hệ thống không bao giờ nhất quán được. Ngăn cản ghi đồng thời (như Paxos) thì triệt tiêu luôn lý do phân tán."
            - paragraph [ref=f81e6438]:
              - generic [ref=f81e6439]: Nguồn gốc
              - text: Marc Shapiro, Nuno Preguiça, Carlos Baquero & Marek Zawirski, 'Conflict-Free Replicated Data Types', hội nghị SSS 2011.
            - paragraph [ref=f81e6440]:
              - generic [ref=f81e6441]: Giải pháp
              - text: "Thiết kế cấu trúc dữ liệu sao cho phép ghi độc lập trên từng replica, merge là toán học đảm bảo hội tụ (CRDT counter, G-Counter/PN-Counter, OR-Set, LWW-register): mọi thao tác đồng thời đều được giữ, mâu thuẫn phân giải trong chính datatype — eventual consistency trở thành đảm bảo, không còn hy vọng."
            - paragraph [ref=f81e6442]:
              - text: "Liên quan:"
              - link "Eventual consistency" [ref=f81e6443] [cursor=pointer]:
                - /url: "#eventual-consistency"
              - text: ","
              - link "Lamport timestamp & Vector clock" [ref=f81e6444] [cursor=pointer]:
                - /url: "#lamport-timestamp-vector-clock"
              - text: ","
              - link "Linearizability" [ref=f81e6445] [cursor=pointer]:
                - /url: "#linearizability"
          - article [ref=f81e6446]:
            - heading "FLP impossibility" [level=4] [ref=f81e6447]
            - paragraph [ref=f81e6448]: "còn gọi: FLP, impossibility of distributed consensus, bất khả thi FLP"
            - paragraph [ref=f81e6449]:
              - generic [ref=f81e6450]: Vấn đề
              - text: "Kỹ sư tưởng thuật toán consensus deterministic có thể chống crash hoàn hảo — chạy thế nào cũng kết luận được. FLP chứng minh ngược lại: trong mô hình bất đồng bộ với chỉ một process crash, không thuật toán deterministic nào guarantee termination — giải thích vì sao Paxos có thể stall vô hạn và consensus thực tế luôn phải dựa vào timeout giả định về thời gian."
            - paragraph [ref=f81e6451]:
              - generic [ref=f81e6452]: Nguồn gốc
              - text: Michael Fischer, Nancy Lynch, Michael Paterson, 'Impossibility of distributed consensus with one faulty process', JACM 1985 — đoạt Dijkstra Prize; proof đã được máy kiểm chứng.
            - paragraph [ref=f81e6453]:
              - generic [ref=f81e6454]: Giải pháp
              - text: "Chứng minh: khi một fault mù mờ (không biết crash hay chỉ chậm), scheduler có thể trì hoãn message để mọi bước tiếp theo của algorithm không diễn ra. Thực tế lách bằng randomized algorithm (safety tuyệt đối, liveness với xác suất cao → gần như chắc chắn) hoặc timeout/heuristic phi lý thuyết."
            - paragraph [ref=f81e6455]:
              - text: "Liên quan:"
              - link "Consensus" [ref=f81e6456] [cursor=pointer]:
                - /url: "#consensus"
              - text: ","
              - link "Paxos" [ref=f81e6457] [cursor=pointer]:
                - /url: "#paxos"
              - text: ", Byzantine fault"
          - article [ref=f81e6458]:
            - heading "Lamport timestamp & Vector clock" [level=4] [ref=f81e6459]
            - paragraph [ref=f81e6460]: "còn gọi: Lamport clock, logical clock, vector clock, hệ thống logic, happened-before"
            - paragraph [ref=f81e6461]:
              - generic [ref=f81e6462]: Vấn đề
              - text: "Hệ thống phân tán không có đồng hồ chung: sự kiện ở hai node đến theo thứ tự network khác với thứ tự thật, không biết sự kiện nào 'trước' sự kiện nào để đồng bộ hóa resource. Lamport scalar thì dùng được nhưng đánh đồng cả 'xảy ra trước thật' lẫn 'chỉ tình cờ đến trước' — không phân biệt được causality với coincidence."
            - paragraph [ref=f81e6463]:
              - generic [ref=f81e6464]: Nguồn gốc
              - text: Lamport, 'Time, clocks, and the ordering of events in a distributed system', CACM 1978; vector clock do Colin Fidge và Friedemann Mattern độc lập công bố năm 1988.
            - paragraph [ref=f81e6465]:
              - generic [ref=f81e6466]: Giải pháp
              - text: "Lamport clock (1978): mỗi process tăng counter, gửi kèm message, nhận thì lấy max — được thứ tự nhân quả một chiều nhưng không phát hiện event đồng thời. Vector clock: mỗi process một đồng hồ, VC(a) < VC(b) nghĩa là a xảy ra trước b; hai vector không so sánh được thì là concurrent — cho phép phát hiện xung đột thật sự."
            - paragraph [ref=f81e6467]:
              - text: "Liên quan:"
              - link "Linearizability" [ref=f81e6468] [cursor=pointer]:
                - /url: "#linearizability"
              - text: ","
              - link "CRDT" [ref=f81e6469] [cursor=pointer]:
                - /url: "#crdt"
              - text: ","
              - link "Consensus" [ref=f81e6470] [cursor=pointer]:
                - /url: "#consensus"
          - article [ref=f81e6471]:
            - heading "Linearizability" [level=4] [ref=f81e6472]
            - paragraph [ref=f81e6473]: "còn gọi: tính tuyến tính, atomic consistency, Herlihy-Wing"
            - paragraph [ref=f81e6474]:
              - generic [ref=f81e6475]: Vấn đề
              - text: Đọc một cache/DB trả kết quả xong, ngay sau đó client khác thấy giá trị 'cũ hơn' — hệ thống có vẻ atomic nhưng không tôn trọng thời gian thực; các định nghĩa atomicity cũ mờ hồ về 'operation bắt đầu và kết thúc lúc nào' nên tranh cãi 'đúng hay sai' không có tiêu chí chung, nhất là khi compose nhiều object.
            - paragraph [ref=f81e6476]:
              - generic [ref=f81e6477]: Nguồn gốc
              - text: "Maurice Herlihy & Jeannette Wing — giới thiệu 1987 (POPL, 'Axioms for concurrent objects'), xử lý chặt 1990 (TOPLAS, 'Linearizability: A Correctness Condition for Concurrent Objects')."
            - paragraph [ref=f81e6478]:
              - generic [ref=f81e6479]: Giải pháp
              - text: "Đòi hỏi mỗi operation 'xảy ra tức thì' tại một điểm nào đó giữa invocation và response, và thứ tự thực thời được giữ: A kết thúc trước khi B bắt buộc thì A đứng trước trong mọi linearization — mạnh enough để suy luận về nhiều object, và là tính chất 'atomic' mà programmer thực sự cần."
            - paragraph [ref=f81e6480]:
              - text: "Liên quan:"
              - link "Eventual consistency" [ref=f81e6481] [cursor=pointer]:
                - /url: "#eventual-consistency"
              - text: ","
              - link "Lamport timestamp & Vector clock" [ref=f81e6482] [cursor=pointer]:
                - /url: "#lamport-timestamp-vector-clock"
              - text: ","
              - link "CAP theorem" [ref=f81e6483] [cursor=pointer]:
                - /url: "#cap-theorem"
          - article [ref=f81e6484]:
            - heading "Paxos" [level=4] [ref=f81e6485]
            - paragraph [ref=f81e6486]: "còn gọi: The Part-Time Parliament, Multi-Paxos"
            - paragraph [ref=f81e6487]:
              - generic [ref=f81e6488]: Vấn đề
              - text: "Replicate state machine sang nhiều node để chịu lỗi crash: log thứ tự sai lệch giữa replica thì FSM phân kỳ (một node cộng tiền, node kia không) — cần thuật toán đồng thuận có chứng minh an toàn, thay vì tự nghĩ 'nhờ đa số confirm' rồi để lọt corner case khi acceptor chết giữa chừng."
            - paragraph [ref=f81e6489]:
              - generic [ref=f81e6490]: Nguồn gốc
              - text: Leslie Lamport — nộp 1989, xuất bản 'The Part-Time Parliament', ACM Transactions on Computer Systems, 1998.
            - paragraph [ref=f81e6491]:
              - generic [ref=f81e6492]: Giải pháp
              - text: "Qua hai phase (prepare/accept): đa số acceptor chấp nhận một giá trị cho mỗi slot log; khi một giá trị đã được chọn thì mọi round sau phải re-propose đúng giá trị đó — an toàn dưới mọi kiểu crash, nhưng không guarantee terminate (theo FLP), nên thực tế dựa vào tiến trình mới."
            - paragraph [ref=f81e6493]:
              - text: "Liên quan:"
              - link "Consensus" [ref=f81e6494] [cursor=pointer]:
                - /url: "#consensus"
              - text: ","
              - link "Raft" [ref=f81e6495] [cursor=pointer]:
                - /url: "#raft"
              - text: ","
              - link "FLP impossibility" [ref=f81e6496] [cursor=pointer]:
                - /url: "#flp-impossibility"
          - article [ref=f81e6497]:
            - heading "Raft" [level=4] [ref=f81e6498]
            - paragraph [ref=f81e6499]: "còn gọi: leader-based consensus"
            - paragraph [ref=f81e6500]:
              - generic [ref=f81e6501]: Vấn đề
              - text: "Paxos khó hiểu đến mức không ai implement đúng: nhiều diễn giải/phép chứng minh khác nhau, debug cực xa, đội ngũ không nắm được thì consensus bí ẩn trở thành rủi ro production. Ongaro & Ousterhout muốn thuật toán consensus giảng được, sửa được, vẫn chứng minh được an toàn."
            - paragraph [ref=f81e6502]:
              - generic [ref=f81e6503]: Nguồn gốc
              - text: Diego Ongaro & John Ousterhout (Stanford), 'In Search of an Understandable Consensus Algorithm', 2013.
            - paragraph [ref=f81e6504]:
              - generic [ref=f81e6505]: Giải pháp
              - text: "Tách bài toán thành ba module độc lập — leader election, log replication, safety — chỉ một leader nhận write, replication cần đa số xác nhận, term number cắt leader cũ; thao đổi: chịu được failure model đơn giản hơn so với Paxos đầy đủ nhưng cùng mức an toàn cho use case phổ biến."
            - paragraph [ref=f81e6506]:
              - text: "Liên quan:"
              - link "Consensus" [ref=f81e6507] [cursor=pointer]:
                - /url: "#consensus"
              - text: ","
              - link "Paxos" [ref=f81e6508] [cursor=pointer]:
                - /url: "#paxos"
              - text: ","
              - link "Leader election" [ref=f81e6509] [cursor=pointer]:
                - /url: "#leader-election"
        - generic [ref=f81e6510]:
          - heading "Messaging & Bất đồng bộ 8" [level=3] [ref=f81e6511]:
            - text: Messaging & Bất đồng bộ
            - generic [ref=f81e6512]: "8"
          - article [ref=f81e6513]:
            - heading "Apache Kafka" [level=4] [ref=f81e6514]
            - paragraph [ref=f81e6515]: "còn gọi: Kafka, event log, distributed log"
            - paragraph [ref=f81e6516]:
              - generic [ref=f81e6517]: Vấn đề
              - text: "Queue truyền thống consume xong là xóa tin nhắn: mỗi loại người đọc cần một queue riêng (nhân bản dữ liệu), muốn đọc lại lịch sử hay replay sau bug thì không được — LinkedIn có luồng dữ liệu tỉ event/ngày cần nhiều team đọc cùng một luồng và đọc lại được."
            - paragraph [ref=f81e6518]:
              - generic [ref=f81e6519]: Nguồn gốc
              - text: LinkedIn — Jay Kreps, Neha Narkhede, Jun Rao; open-source đầu 2011, tốt nghiệp Apache Incubator 23/10/2012
            - paragraph [ref=f81e6520]:
              - generic [ref=f81e6521]: Giải pháp
              - text: Log append-only phân tán giữ dữ liệu theo retention; nhiều consumer group đọc độc lập từ offset của riêng mình; throughput cao nhờ ghi tuần tự trên đĩa + zero-copy — queue 'không xóa, chỉ trỏ tới'.
            - paragraph [ref=f81e6522]:
              - text: "Liên quan:"
              - link "Kafka topic / partition / consumer group" [ref=f81e6523] [cursor=pointer]:
                - /url: "#kafka-topic-partition-consumer-group"
