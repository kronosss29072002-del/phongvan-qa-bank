                - /url: "#orm"
          - article [ref=f81e780]:
            - heading "Primary key vs Secondary index" [level=4] [ref=f81e781]
            - paragraph [ref=f81e782]: "còn gọi: khóa chính, index phụ"
            - paragraph [ref=f81e783]:
              - generic [ref=f81e784]: Vấn đề
              - text: Cần phân biệt đường định danh duy nhất của bản ghi với các đường dẫn phụ phục vụ truy vấn.
            - paragraph [ref=f81e785]:
              - generic [ref=f81e786]: Giải pháp
              - text: Primary key bắt buộc duy nhất và không null; secondary index trỏ tới bản ghi nên thêm một bước tìm khi đọc.
            - paragraph [ref=f81e787]:
