            - heading "Deadlock detection" [level=4] [ref=f81e3072]
            - paragraph [ref=f81e3073]: "còn gọi: phát hiện khóa chết"
            - paragraph [ref=f81e3074]:
              - generic [ref=f81e3075]: Vấn đề
              - text: Hai transaction giữ khóa của nhau và chờ vô hạn, không bên nào thoát ra được.
            - paragraph [ref=f81e3076]:
