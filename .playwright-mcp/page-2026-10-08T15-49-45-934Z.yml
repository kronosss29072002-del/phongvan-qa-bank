                - /url: "#autoscaling-horizontal-vertical"
              - text: ","
              - link "Bottleneck Analysis" [ref=f81e4533] [cursor=pointer]:
                - /url: "#bottleneck-analysis"
              - text: ","
              - link "Little's Law" [ref=f81e4534] [cursor=pointer]:
                - /url: "#little-s-law"
          - article [ref=f81e4535]:
            - heading "Connection Pool Sizing" [level=4] [ref=f81e4536]
            - paragraph [ref=f81e4537]: "còn gọi: kích thước connection pool, DB pool"
            - paragraph [ref=f81e4538]:
              - generic [ref=f81e4539]: Vấn đề
              - text: Pool quá nhỏ → thread chờ DB; pool quá lớn → DB quá tải, tạo nhiều connection đồng thời.
            - paragraph [ref=f81e4540]:
              - generic [ref=f81e4541]: Giải pháp
              - text: "Tối ưu dựa trên (DB max connections) và (concurrent queries service cần). Công thức tham khảo: max_pool_size ≈ (threads_per_instance × instances) nhưng giới hạn bởi DB. Theo HikariCP best practice: tránh max pool quá lớn; quan sát wait time. Kết hợp với circuit breaker khi DB chậm."
            - paragraph [ref=f81e4542]:
              - text: "Liên quan:"
              - link "Thread Pool Sizing" [ref=f81e4543] [cursor=pointer]:
                - /url: "#thread-pool-sizing"
              - text: ","
              - link "Bulkhead" [ref=f81e4544] [cursor=pointer]:
                - /url: "#bulkhead"
              - text: ","
              - link "Timeout" [ref=f81e4545] [cursor=pointer]:
                - /url: "#timeout"
          - article [ref=f81e4546]:
            - heading "Cooldown" [level=4] [ref=f81e4547]
            - paragraph [ref=f81e4548]: "còn gọi: scaling cooldown, cooldown period, thời gian làm nguội"
            - paragraph [ref=f81e4549]:
              - generic [ref=f81e4550]: Vấn đề
              - text: Autoscaler phản ứng trước khi effect của lần scale trước kịp hiện ra → thrash liên tục.
            - paragraph [ref=f81e4551]:
              - generic [ref=f81e4552]: Nguồn gốc
              - text: "AWS EC2 Auto Scaling documentation: cooldown period mặc định 300 giây (5 phút); AWS khuyên chuyển sang target tracking/step scaling (dùng instance warmup thay cooldown)."
            - paragraph [ref=f81e4553]:
              - generic [ref=f81e4554]: Giải pháp
              - text: Sau khi launch/terminate instance, autoscaler dừng mọi scaling activity simple-scaling trong khoảng cooldown để cluster ổn định. Scale-in có thể dùng cooldown ngắn hơn; nếu đứng sau ELB thì ELB hoàn tất connection draining trước khi cooldown bắt đầu.
            - paragraph [ref=f81e4555]:
              - text: "Liên quan:"
              - link "Autoscaling (Horizontal/Vertical)" [ref=f81e4556] [cursor=pointer]:
                - /url: "#autoscaling-horizontal-vertical"
              - text: ", Connection Draining,"
              - link "Graceful Shutdown" [ref=f81e4557] [cursor=pointer]:
                - /url: "#graceful-shutdown"
          - article [ref=f81e4558]:
            - heading "Drain Connections" [level=4] [ref=f81e4559]
            - paragraph [ref=f81e4560]: "còn gọi: rút kết nối, connection draining, deregistration"
            - paragraph [ref=f81e4561]:
              - generic [ref=f81e4562]: Vấn đề
              - text: Endpoint bị loại khỏi load balancer ngay nhưng kết nối đã mở vẫn bị client thấy lỗi.
            - paragraph [ref=f81e4563]:
              - generic [ref=f81e4564]: Nguồn gốc
              - text: Kubernetes Services + ELB/ALB thực hành connection draining.
            - paragraph [ref=f81e4565]:
              - generic [ref=f81e4566]: Giải pháp
              - text: "Trước khi dừng process: ngừng accept connection mới (kết nối với LB), hoàn tất request đang xử lý, đóng keep-alive, đợi endpoint propagation. ELB có connection draining timeout (mặc định 300s) để đảm bảo kết nối cũ hoàn tất."
            - paragraph [ref=f81e4567]:
              - text: "Liên quan:"
              - link "Graceful Shutdown" [ref=f81e4568] [cursor=pointer]:
                - /url: "#graceful-shutdown"
              - text: ", Zombe Connection,"
              - link "Cooldown" [ref=f81e4569] [cursor=pointer]:
                - /url: "#cooldown"
          - article [ref=f81e4570]:
            - heading "Fault Injection" [level=4] [ref=f81e4571]
            - paragraph [ref=f81e4572]: "còn gọi: tiêm lỗi, chaos injection"
            - paragraph [ref=f81e4573]:
              - generic [ref=f81e4574]: Vấn đề
              - text: Không chủ động tạo lỗi khó biết phản ứng hệ thống thực tế.
            - paragraph [ref=f81e4575]:
              - generic [ref=f81e4576]: Giải pháp
              - text: Chủ động gây ra lỗi có kiểm soát (kill process, thêm latency, drop packet, auth fail) để xác minh circuit breaker, fallback, retry hoạt động đúng. Thường là công cụ trong chaos engineering.
            - paragraph [ref=f81e4577]:
              - text: "Liên quan:"
              - link "Chaos Engineering" [ref=f81e4578] [cursor=pointer]:
                - /url: "#chaos-engineering"
              - text: ","
              - link "Circuit Breaker" [ref=f81e4579] [cursor=pointer]:
                - /url: "#circuit-breaker"
              - text: ","
              - link "Graceful Shutdown" [ref=f81e4580] [cursor=pointer]:
                - /url: "#graceful-shutdown"
          - article [ref=f81e4581]:
            - heading "Graceful Degradation" [level=4] [ref=f81e4582]
            - paragraph [ref=f81e4583]: "còn gọi: suy giảm duyên dáng, degraded mode, degraded response"
            - paragraph [ref=f81e4584]:
              - generic [ref=f81e4585]: Vấn đề
              - text: Khi một thành phần hỏng, trả nguyên trang lỗi 500 cho user tệ hơn nhiều so với bớt đi một tính năng phụ.
            - paragraph [ref=f81e4586]:
              - generic [ref=f81e4587]: Giải pháp
              - text: "Chủ động bỏ/thay thế các tính năng không cốt lõi khi hệ thống gặp sức ép hoặc dependency hỏng: serve dữ liệu cũ/ít chính xác hơn, tắt recommend, bật trang tĩnh — giữ lõi chức năng chạy được. SRE Book ch.21-22 coi 'serve degraded responses' là công cụ chống quá tải chính."
            - paragraph [ref=f81e4588]:
              - text: "Liên quan:"
              - link "Fallback" [ref=f81e4589] [cursor=pointer]:
                - /url: "#fallback"
              - text: ","
              - link "Circuit Breaker" [ref=f81e4590] [cursor=pointer]:
                - /url: "#circuit-breaker"
              - text: ","
              - link "Load Shedding" [ref=f81e4591] [cursor=pointer]:
                - /url: "#load-shedding"
              - text: ","
              - link "Bulk Sync" [ref=f81e4592] [cursor=pointer]:
                - /url: "#bulk-sync"
          - article [ref=f81e4593]:
            - heading "Graceful Shutdown" [level=4] [ref=f81e4594]
            - paragraph [ref=f81e4595]: "còn gọi: tắt từ từ, graceful stop"
            - paragraph [ref=f81e4596]:
              - generic [ref=f81e4597]: Vấn đề
              - text: Dừng Pod/instance đột ngột làm mất in-flight request, connection bị reset.
            - paragraph [ref=f81e4598]:
              - generic [ref=f81e4599]: Nguồn gốc
              - text: "Kubernetes Pod lifecycle: default terminationGracePeriodSeconds 30s."
            - paragraph [ref=f81e4600]:
              - generic [ref=f81e4601]: Giải pháp
              - text: Pod nhận SIGTERM, chạy preStop hook (thường sleep để endpoint propagation), server ngừng accept request mới, hoàn tất in-flight request, rồi exit. Sau grace period hết mà chưa exit → SIGKILL.
            - paragraph [ref=f81e4602]:
              - text: "Liên quan:"
              - link "Drain Connections" [ref=f81e4603] [cursor=pointer]:
                - /url: "#drain-connections"
              - text: ","
              - link "Cooldown" [ref=f81e4604] [cursor=pointer]:
                - /url: "#cooldown"
              - text: ","
              - link "Deadline Propagation" [ref=f81e4605] [cursor=pointer]:
                - /url: "#deadline-propagation"
          - article [ref=f81e4606]:
            - heading "Latency SLO" [level=4] [ref=f81e4607]
            - paragraph [ref=f81e4608]: "còn gọi: p50/p90/p95/p99 SLO, tail latency SLO"
            - paragraph [ref=f81e4609]:
              - generic [ref=f81e4610]: Vấn đề
              - text: Chỉ đo trung bình latency che giấu trải nghiệm tệ nhất của user.
            - paragraph [ref=f81e4611]:
              - generic [ref=f81e4612]: Nguồn gốc
              - text: Google SRE Book nhấn mạnh đo tail (p90/p99) vì slowest requests thường là user quan trọng nhất.
            - paragraph [ref=f81e4613]:
              - generic [ref=f81e4614]: Giải pháp
              - text: "Xác định SLO theo percentile (VD: 99% < 300ms, 99.9% < 1s) dựa trên user journey. Theo dõi p50/p95/p99/p99.9 và lỗi tỷ lệ vượt SLO."
            - paragraph [ref=f81e4615]:
              - text: "Liên quan:"
              - link "Tail Latency" [ref=f81e4616] [cursor=pointer]:
                - /url: "#tail-latency"
              - text: ","
              - link "SLO/SLI" [ref=f81e4617] [cursor=pointer]:
                - /url: "#slo-sli"
              - text: ","
              - link "Availability Math (Five Nines)" [ref=f81e4618] [cursor=pointer]:
                - /url: "#availability-math-five-nines"
          - article [ref=f81e4619]:
            - heading "Load Shedding" [level=4] [ref=f81e4620]
            - paragraph [ref=f81e4621]: "còn gọi: cắt tải, shed load, reject excess traffic"
            - paragraph [ref=f81e4622]:
              - generic [ref=f81e4623]: Vấn đề
              - text: "Quá tải: nếu nhận hết rồi xếp hàng, độ trễ phình vô hạn, thread chết hết và toàn bộ service sập thay vì chỉ mất phần dư."
            - paragraph [ref=f81e4624]:
              - generic [ref=f81e4625]: Nguồn gốc
              - text: Thuật ngữ gốc từ lưới điện (cắt tải khẩn cấp khi cầu vượt cung — Under-frequency load shedding); Google SRE Book ch.21-22 (2016) áp dụng cho server với criticality levels SHEDDABLE_PLUS/SHEDDABLE.
            - paragraph [ref=f81e4626]:
              - generic [ref=f81e4627]: Giải pháp
              - text: "Khi tín hiệu utilization (CPU, active threads) vượt ngưỡng, server từ chối ngay phần request dư thay vì buffer: drop theo mức ưu tiên thấp nhất trước (sheddable trước critical), trả 429/503 kèm Retry-After. Mục tiêu: throughput ổn định ở mức xử lý được, latency không phình."
            - paragraph [ref=f81e4628]:
              - text: "Liên quan:"
              - link "Overload Protection" [ref=f81e4629] [cursor=pointer]:
                - /url: "#overload-protection"
              - text: ","
              - link "Shed Load vs Queue" [ref=f81e4630] [cursor=pointer]:
                - /url: "#shed-load-vs-queue"
              - text: ","
              - link "Rate Limiting (Adaptive)" [ref=f81e4631] [cursor=pointer]:
                - /url: "#rate-limiting-adaptive"
              - text: ","
              - link "Graceful Degradation" [ref=f81e4632] [cursor=pointer]:
                - /url: "#graceful-degradation"
          - article [ref=f81e4633]:
            - heading "MTTR/MTBF" [level=4] [ref=f81e4634]
            - paragraph [ref=f81e4635]: "còn gọi: mean time to repair, mean time between failures, mean time to detect"
            - paragraph [ref=f81e4636]:
              - generic [ref=f81e4637]: Vấn đề
              - text: "Đo lường độ tin cậy hệ thống: thời gian phục hồi vs thời gian giữa các sự cố."
            - paragraph [ref=f81e4638]:
              - generic [ref=f81e4639]: Nguồn gốc
              - text: Reliability engineering, gắn liền với MIL-HDBK tiêu chuẩn quân sự/hàng không vũ trụ.
            - paragraph [ref=f81e4640]:
              - generic [ref=f81e4641]: Giải pháp
              - text: MTBF = trung bình thời gian giữa hai lần hỏng (càng lớn càng tốt). MTTR = trung bình thời gian phát hiện + sửa để phục hồi (càng nhỏ càng tốt). Availability ≈ MTBF/(MTBF+MTTR). MTTA (time to acknowledge) cũng quan trọng không kém MTTR.
            - paragraph [ref=f81e4642]:
              - text: "Liên quan:"
              - link "Availability Math (Five Nines)" [ref=f81e4643] [cursor=pointer]:
                - /url: "#availability-math-five-nines"
              - text: ","
              - link "Error Budget" [ref=f81e4644] [cursor=pointer]:
                - /url: "#error-budget"
              - text: ","
              - link "SLO/SLI" [ref=f81e4645] [cursor=pointer]:
                - /url: "#slo-sli"
          - article [ref=f81e4646]:
            - heading "Overload Protection" [level=4] [ref=f81e4647]
            - paragraph [ref=f81e4648]: "còn gọi: bảo vệ quá tải, admission control"
            - paragraph [ref=f81e4649]:
              - generic [ref=f81e4650]: Vấn đề
              - text: Không kiểm soát admission → service tiếp nhận nhiều hơn khả năng xử lý → sập hoàn toàn.
            - paragraph [ref=f81e4651]:
              - generic [ref=f81e4652]: Giải pháp
              - text: "Áp dụng admission control: từ chối request sớm tại edge/LB/API gateway dựa trên utilization, queue depth, active requests. Kết hợp rate limiting adaptive, load shedding, circuit breaker. Ưu tiên critical request trước shedable."
            - paragraph [ref=f81e4653]:
              - text: "Liên quan:"
              - link "Load Shedding" [ref=f81e4654] [cursor=pointer]:
                - /url: "#load-shedding"
              - text: ","
              - link "Rate Limiting (Adaptive)" [ref=f81e4655] [cursor=pointer]:
                - /url: "#rate-limiting-adaptive"
              - text: ","
              - link "Circuit Breaker" [ref=f81e4656] [cursor=pointer]:
                - /url: "#circuit-breaker"
              - text: ","
              - link "Retry Budget" [ref=f81e4657] [cursor=pointer]:
                - /url: "#retry-budget"
          - article [ref=f81e4658]:
            - heading "Queue Backpressure" [level=4] [ref=f81e4659]
            - paragraph [ref=f81e4660]: "còn gọi: áp lực ngược hàng đợi, bounded queue, queue-full policy"
            - paragraph [ref=f81e4661]:
              - generic [ref=f81e4662]: Vấn đề
              - text: Hàng đợi không giới hạn luôn nhận thêm message trong khi producer nhanh hơn consumer, đến lúc OOM hoặc latency queue tăng lớn.
            - paragraph [ref=f81e4663]:
              - generic [ref=f81e4664]: Giải pháp
              - text: "Hàng đợi có giới hạn cứng; khi đầy, hành vi tường minh: block producer, drop (mới nhất/cũ nhất), hay trả lỗi — không bao giờ grow vô hạn. Kết hợp tín hiệu từ consumer lên producer để producer tự chậm lại; hàng đợi nhỏ giúp load shed sớm."
            - paragraph [ref=f81e4665]:
              - text: "Liên quan:"
              - link "Backpressure (Reactive)" [ref=f81e4666] [cursor=pointer]:
                - /url: "#backpressure-reactive"
              - text: ","
              - link "Shed Load vs Queue" [ref=f81e4667] [cursor=pointer]:
                - /url: "#shed-load-vs-queue"
              - text: ","
              - link "Head-of-Line Blocking" [ref=f81e4668] [cursor=pointer]:
                - /url: "#head-of-line-blocking"
          - article [ref=f81e4669]:
            - heading "Rate Limiting (Adaptive)" [level=4] [ref=f81e4670]
            - paragraph [ref=f81e4671]: "còn gọi: giới hạn lưu lượng thích nghi, adaptive throttling, client-side throttling, token bucket rate limit"
            - paragraph [ref=f81e4672]:
              - generic [ref=f81e4673]: Vấn đề
              - text: "Rate limit tĩnh (số request/giây) không biết backend đang yếu: giữ nguyên hạn mức trong lúc backend chậm lại thì càng đẩy nó chết thêm."
            - paragraph [ref=f81e4674]:
              - generic [ref=f81e4675]: Nguồn gốc
              - text: "Google SRE Book ch.21 'Handling Overload' (2016): client-side adaptive throttling theo tỷ lệ requests/accepts (hệ số K, hay dùng 2×), cộng per-customer limits và overload priority (CRITICAL/SHEDDABLE)."
            - paragraph [ref=f81e4676]:
              - generic [ref=f81e4677]: Giải pháp
              - text: "Giới hạn dựa trên tín hiệu phản hồi từ hệ thống: client đếm số attempt và số accepted trong cửa sổ trượt; khi attempts vượt K×accepts thì bắt đầu drop probabilistic local (không gửi lên). Mức giới hạn tự nới/thắt theo capacity thật; có thể cộng token bucket giữ rate retry ổn định."
            - paragraph [ref=f81e4678]:
              - text: "Liên quan:"
              - link "Retry Budget" [ref=f81e4679] [cursor=pointer]:
                - /url: "#retry-budget"
              - text: ","
              - link "Load Shedding" [ref=f81e4680] [cursor=pointer]:
                - /url: "#load-shedding"
              - text: ","
              - link "Overload Protection" [ref=f81e4681] [cursor=pointer]:
                - /url: "#overload-protection"
              - text: ","
              - link "Circuit Breaker" [ref=f81e4682] [cursor=pointer]:
                - /url: "#circuit-breaker"
          - article [ref=f81e4683]:
            - heading "Replication Lag Tolerance" [level=4] [ref=f81e4684]
            - paragraph [ref=f81e4685]: "còn gọi: read-after-write consistency, replica lag, eventual consistency"
            - paragraph [ref=f81e4686]:
              - generic [ref=f81e4687]: Vấn đề
              - text: Đọc từ replica có thể thấy dữ liệu cũ sau khi ghi master (replication lag) gây hiển thị sai cho user.
            - paragraph [ref=f81e4688]:
              - generic [ref=f81e4689]: Giải pháp
              - text: "Có nhiều mức nhất quán: strong consistency (đọc luôn mới nhất, tốn độ trễ), read-after-write (user ghi xong đọc lại thấy mới nhất), monotonic reads, eventual consistency (cuối cùng đồng bộ). Cần chọn theo use case (cart/checkout cần mạnh hơn newsfeed)."
            - paragraph [ref=f81e4690]:
              - text: "Liên quan:"
              - link "Quorum Read/Write" [ref=f81e4691] [cursor=pointer]:
                - /url: "#quorum-read-write"
              - text: ","
              - link "Redundancy/N+1 Redundancy" [ref=f81e4692] [cursor=pointer]:
                - /url: "#redundancy-n-1-redundancy"
          - article [ref=f81e4693]:
            - heading "Shed Load vs Queue" [level=4] [ref=f81e4694]
            - paragraph [ref=f81e4695]: "còn gọi: shed vs queue, drop vs buffer"
            - paragraph [ref=f81e4696]:
              - generic [ref=f81e4697]: Vấn đề
              - text: Chọn giữa xếp hàng (buffer) và từ chối ngay (shed) khi quá tải.
            - paragraph [ref=f81e4698]:
              - generic [ref=f81e4699]: Nguồn gốc
              - text: "Google SRE Book ch.22: 'small queues relative to thread counts' giúp reject sớm thay vì buffer lâu."
            - paragraph [ref=f81e4700]:
              - generic [ref=f81e4701]: Giải pháp
              - text: "Buffer phù hợp khi burst ngắn và có thể phục hồi nhanh; shed phù hợp khi overload kéo dài — giữ latency ổn định bằng cách từ chối dư thay vì phình queue. Quy tắc thực tế: queue nhỏ + rejection sớm tốt hơn queue lớn + chờ vô hạn."
            - paragraph [ref=f81e4702]:
              - text: "Liên quan:"
              - link "Load Shedding" [ref=f81e4703] [cursor=pointer]:
                - /url: "#load-shedding"
              - text: ","
              - link "Queue Backpressure" [ref=f81e4704] [cursor=pointer]:
                - /url: "#queue-backpressure"
              - text: ","
              - link "Head-of-Line Blocking" [ref=f81e4705] [cursor=pointer]:
                - /url: "#head-of-line-blocking"
          - article [ref=f81e4706]:
            - heading "Stampeding Herd" [level=4] [ref=f81e4707]
            - paragraph [ref=f81e4708]: "còn gọi: cache stampede, dogpile, hot key stampede"
            - paragraph [ref=f81e4709]:
              - generic [ref=f81e4710]: Vấn đề
              - text: Key hot trong cache hết hạn đúng 1 thời điểm → hàng nghìn request cùng đi đập vào backend tính lại.
            - paragraph [ref=f81e4711]:
              - generic [ref=f81e4712]: Giải pháp
              - text: "Khác với thundering herd: tập trung trên cache/key. Xử lý: jitter expiration, lock/single-flight cho key đang tính, stale-while-revalidate (trả giá trị cũ trong khi refresh), pre-warm trước TTL."
            - paragraph [ref=f81e4713]:
              - text: "Liên quan:"
              - link "Thundering Herd" [ref=f81e4714] [cursor=pointer]:
                - /url: "#thundering-herd"
              - text: ","
              - link "Rate Limiting (Adaptive)" [ref=f81e4715] [cursor=pointer]:
                - /url: "#rate-limiting-adaptive"
          - article [ref=f81e4716]:
            - heading "Thread Pool Sizing" [level=4] [ref=f81e4717]
            - paragraph [ref=f81e4718]: "còn gọi: kích thước thread pool, executor pool"
            - paragraph [ref=f81e4719]:
              - generic [ref=f81e4720]: Vấn đề
              - text: Thread pool quá nhỏ → request xếp hàng lâu; quá lớn → context switch nhiều, memory cao.
            - paragraph [ref=f81e4721]:
              - generic [ref=f81e4722]: Giải pháp
              - text: "Tính theo loại workload: CPU-bound → ~number of cores; I/O-bound → cores × (1 + wait_time/service_time). Dùng queue bounded thay vì unbounded. Theo SRE ch.22: 'small queues relative to thread counts' giúp reject sớm. Monitor queue depth, active threads."
            - paragraph [ref=f81e4723]:
              - text: "Liên quan:"
              - link "Connection Pool Sizing" [ref=f81e4724] [cursor=pointer]:
                - /url: "#connection-pool-sizing"
              - text: ","
              - link "Bulkhead" [ref=f81e4725] [cursor=pointer]:
                - /url: "#bulkhead"
              - text: ","
              - link "Queue Backpressure" [ref=f81e4726] [cursor=pointer]:
                - /url: "#queue-backpressure"
          - article [ref=f81e4727]:
            - heading "Zombie Connection" [level=4] [ref=f81e4728]
            - paragraph [ref=f81e4729]: "còn gọi: kết nối ma, half-closed connection, stuck connection"
            - paragraph [ref=f81e4730]:
              - generic [ref=f81e4731]: Vấn đề
              - text: Client vẫn nghĩ kết nối mở trong khi server đã tắt → timeout/retry lan truyền.
            - paragraph [ref=f81e4732]:
              - generic [ref=f81e4733]: Giải pháp
              - text: "Xảy ra khi server đóng không đúng cách (không gửi FIN, process exit ngay), LB/endpoint cập nhật chậm, hoặc long-lived connection (WebSocket/gRPC) tồn tại sau khi listener đóng. Khắc phục: preStop sleep, server shutdown tuần tự (stop accepting → finish active → close idle), use keepalive + idle timeout."
            - paragraph [ref=f81e4734]:
              - text: "Liên quan:"
              - link "Drain Connections" [ref=f81e4735] [cursor=pointer]:
                - /url: "#drain-connections"
              - text: ","
              - link "Graceful Shutdown" [ref=f81e4736] [cursor=pointer]:
                - /url: "#graceful-shutdown"
              - text: ","
              - link "Timeout" [ref=f81e4737] [cursor=pointer]:
                - /url: "#timeout"
        - generic [ref=f81e4738]:
          - heading "Bảo mật & Xác thực 41" [level=3] [ref=f81e4739]:
            - text: Bảo mật & Xác thực
            - generic [ref=f81e4740]: "41"
          - article [ref=f81e4741]:
            - heading "ABAC" [level=4] [ref=f81e4742]
            - paragraph [ref=f81e4743]: "còn gọi: Attribute-Based Access Control"
            - paragraph [ref=f81e4744]:
              - generic [ref=f81e4745]: Vấn đề
              - text: RBAC cứng khi cần quy tắc phức tạp (thời gian, IP, tài sản cụ thể). Cần đánh giá dựa trên attributes (user/resource/environment).
            - paragraph [ref=f81e4746]:
              - generic [ref=f81e4747]: Nguồn gốc
              - text: NIST ABAC model
            - paragraph [ref=f81e4748]:
              - generic [ref=f81e4749]: Giải pháp
              - text: "Policy đánh giá attributes: user.department==resource.ownerDept AND time in range. Linh hoạt hơn RBAC nhưng phức tạp hơn."
            - paragraph [ref=f81e4750]:
              - text: "Liên quan:"
              - link "RBAC" [ref=f81e4751] [cursor=pointer]:
                - /url: "#rbac"
              - text: ","
              - link "permission model" [ref=f81e4752] [cursor=pointer]:
                - /url: "#permission-model"
          - article [ref=f81e4753]:
            - heading "ABAC (Attribute-Based Access Control)" [level=4] [ref=f81e4754]
            - paragraph [ref=f81e4755]: "còn gọi: phân quyền theo thuộc tính"
            - paragraph [ref=f81e4756]:
              - generic [ref=f81e4757]: Vấn đề
              - text: "RBAC bế tắc khi quyền phụ thuộc ngữ cảnh động: 'chỉ sửa document của phòng mình VÀ đang là draft VÀ trong giờ hành chính VÀ từ IP công ty' — mỗi biến thể thêm một role, cuối cùng role nổ tung (role explosion) và không biểu diễn được điều kiện thời gian/địa điểm/giá trị số."
            - paragraph [ref=f81e4758]:
              - generic [ref=f81e4759]: Nguồn gốc
              - text: Khái niệm cũ nhưng được NIST Systematized qua dự án ABAC (NIST SP 800-162); chuẩn XACML của OASIS
            - paragraph [ref=f81e4760]:
              - generic [ref=f81e4761]: Giải pháp
              - text: Đánh giá policy trên tập thuộc tính của subject, object, action và environment (giờ, IP, mức độ rủi ro) thay vì role cố định — policy động, context-aware, biểu diễn được rule phức tạp mà không tạo role mới.
            - paragraph [ref=f81e4762]:
              - text: "Liên quan:"
              - link "RBAC" [ref=f81e4763] [cursor=pointer]:
                - /url: "#rbac"
              - text: ", Principle of least privilege"
          - article [ref=f81e4764]:
            - heading "API key" [level=4] [ref=f81e4765]
            - paragraph [ref=f81e4766]:
              - generic [ref=f81e4767]: Vấn đề
              - text: Cần đơn giản để gọi API (server-to-server hoặc đơn giản), nhưng nếu chỉ dùng secret cố định trong header, dễ bị rò rỉ (commit code, log). Cần quản lý vòng đời.
            - paragraph [ref=f81e4768]:
              - generic [ref=f81e4769]: Nguồn gốc
              - text: Early web APIs
            - paragraph [ref=f81e4770]:
              - generic [ref=f81e4771]: Giải pháp
              - text: Client gửi API key trong header/query. Đơn giản nhưng thiếu phân quyền chi tiết, khó thu hồi theo user context; nên hạn chế scope, quay vòng key.
            - paragraph [ref=f81e4772]:
              - text: "Liên quan:"
              - link "secrets management" [ref=f81e4773] [cursor=pointer]:
                - /url: "#secrets-management"
              - text: ","
              - link "key rotation" [ref=f81e4774] [cursor=pointer]:
                - /url: "#key-rotation"
          - article [ref=f81e4775]:
            - heading "Argon2" [level=4] [ref=f81e4776]
            - paragraph [ref=f81e4777]: "còn gọi: Argon2id, memory-hard hashing"
            - paragraph [ref=f81e4778]:
              - generic [ref=f81e4779]: Vấn đề
              - text: bcrypt chống được CPU brute-force nhưng là memory-light — GPU/ASIC hàng nghìn core song song đập hash vẫn rẻ hơn mong đợi, vì chúng mạnh về tính toán chứ không về bộ nhớ. Password Hashing Competition 2015 sinh ra để tìm thuật toán khiến phần cứng chuyên dụng (GPU miner) không còn lợi thế.
            - paragraph [ref=f81e4780]:
              - generic [ref=f81e4781]: Nguồn gốc
              - text: Alex Biryukov, Daniel Dinu, Dmitry Khovratovich (ĐH Luxembourg) — thắng Password Hashing Competition 2015, chuẩn hóa RFC 9106 (9/2021)
            - paragraph [ref=f81e4782]:
              - generic [ref=f81e4783]: Giải pháp
              - text: "KDF memory-hard: buộc cấp phát mảng bộ nhớ lớn khi băm, tăng chi phí RAM (không chỉ CPU) nên GPU/ASIC không song song được hàng nghìn hash; 3 variant — Argon2id (lai, RFC 9106 khuyến nghị mặc định) cân bằng side-channel resistance và chống GPU."
            - paragraph [ref=f81e4784]:
              - text: "Liên quan:"
              - link "bcrypt" [ref=f81e4785] [cursor=pointer]:
                - /url: "#bcrypt"
              - text: ","
              - link "Password hashing" [ref=f81e4786] [cursor=pointer]:
                - /url: "#password-hashing"
              - text: ","
              - link "Salt" [ref=f81e4787] [cursor=pointer]:
                - /url: "#salt"
          - article [ref=f81e4788]:
            - heading "authorization code" [level=4] [ref=f81e4789]
            - paragraph [ref=f81e4790]: "còn gọi: authorization code flow"
            - paragraph [ref=f81e4791]:
              - generic [ref=f81e4792]: Vấn đề
              - text: Cần ủy quyền an toàn nhất cho web app/confidential client. Tránh trả access token thẳng về user agent (trình duyệt) để giảm rò rỉ.
            - paragraph [ref=f81e4793]:
              - generic [ref=f81e4794]: Nguồn gốc
              - text: RFC 6749
            - paragraph [ref=f81e4795]:
              - generic [ref=f81e4796]: Giải pháp
              - text: User được redirect tới authorization server xác thực/đồng ý; server trả code về redirect URI. Client (backend) trao đổi code + client secret với token endpoint để lấy access token. Kết hợp PKCE cho public client.
            - paragraph [ref=f81e4797]:
              - text: "Liên quan:"
              - link "OAuth 2.0" [ref=f81e4798] [cursor=pointer]:
                - /url: "#oauth-2-0"
              - text: ","
              - link "PKCE" [ref=f81e4799] [cursor=pointer]:
                - /url: "#pkce"
          - article [ref=f81e4800]:
            - heading "bcrypt/scrypt/argon2" [level=4] [ref=f81e4801]
            - paragraph [ref=f81e4802]:
              - generic [ref=f81e4803]: Vấn đề
              - text: Fast hash (SHA-256/MD5) quá nhanh với GPU/cloud, dễ brute force hàng triệu tỷ lần/giây. Cần password hash chậm, có thể điều chỉnh độ khó.
            - paragraph [ref=f81e4804]:
              - generic [ref=f81e4805]: Nguồn gốc
              - text: bcrypt (Provos–Mazieres 1999), scrypt (Percival 2009), argon2 (Biryukov et al. 2015, PHC winner)
            - paragraph [ref=f81e4806]:
              - generic [ref=f81e4807]: Giải pháp
              - text: bcrypt dùng work factor + Blowfish; scrypt thêm memory hardness chống ASIC/GPU; argon2id cân bằng resistance vs side-channels.
            - paragraph [ref=f81e4808]:
              - text: "Liên quan:"
              - link "password hashing" [ref=f81e4809] [cursor=pointer]:
                - /url: "#password-hashing"
              - text: ","
              - link "salting" [ref=f81e4810] [cursor=pointer]:
                - /url: "#salting"
              - text: ","
              - link "brute force + rate limiting" [ref=f81e4811] [cursor=pointer]:
                - /url: "#brute-force-rate-limiting"
          - article [ref=f81e4812]:
            - heading "brute force + rate limiting" [level=4] [ref=f81e4813]
            - paragraph [ref=f81e4814]:
              - generic [ref=f81e4815]: Vấn đề
              - text: Attacker có thể thử hàng nghìn password/login liên tục. Cần làm chậm hoặc chặn sau nhiều lần thất bại.
            - paragraph [ref=f81e4816]:
              - generic [ref=f81e4817]: Nguồn gốc
              - text: Basic account lockout practices
            - paragraph [ref=f81e4818]:
              - generic [ref=f81e4819]: Giải pháp
              - text: Rate limit theo IP/account (exponential backoff, sliding window), account lockout tạm thời, CAPTCHA, hoặc dùng login failure tracking. Kết hợp với MFA.
            - paragraph [ref=f81e4820]:
              - text: "Liên quan:"
              - link "password hashing" [ref=f81e4821] [cursor=pointer]:
                - /url: "#password-hashing"
              - text: ","
              - link "MFA/TOTP" [ref=f81e4822] [cursor=pointer]:
                - /url: "#mfa-totp"
          - article [ref=f81e4823]:
            - heading "certificate" [level=4] [ref=f81e4824]
            - paragraph [ref=f81e4825]: "còn gọi: X.509 certificate, TLS certificate"
            - paragraph [ref=f81e4826]:
              - generic [ref=f81e4827]: Vấn đề
              - text: Khi dùng asymmetric, làm sao client biết public key nhận được thực sự thuộc về server đúng? Cần chứng chỉ số do CA đáng tin cậy ký.
            - paragraph [ref=f81e4828]:
              - generic [ref=f81e4829]: Nguồn gốc
              - text: X.509 PKI
            - paragraph [ref=f81e4830]:
              - generic [ref=f81e4831]: Giải pháp
              - text: Server có cert chứa public key+domain, ký bởi CA. Client kiểm tra chain of trust tới root CA. Cert hết hạn cần rotation.
            - paragraph [ref=f81e4832]:
              - text: "Liên quan:"
              - link "TLS handshake" [ref=f81e4833] [cursor=pointer]:
                - /url: "#tls-handshake"
              - text: ","
              - link "digital signature" [ref=f81e4834] [cursor=pointer]:
                - /url: "#digital-signature"
              - text: ","
              - link "key rotation" [ref=f81e4835] [cursor=pointer]:
                - /url: "#key-rotation"
          - article [ref=f81e4836]:
            - heading "client credentials" [level=4] [ref=f81e4837]
            - paragraph [ref=f81e4838]:
              - generic [ref=f81e4839]: Vấn đề
              - text: Khi service A cần gọi service B mà không có user context (machine-to-machine), không thể dùng authorization code. Cần flow cho client tự chứng minh để lấy token.
            - paragraph [ref=f81e4840]:
              - generic [ref=f81e4841]: Nguồn gốc
              - text: RFC 6749 Section 4.4
            - paragraph [ref=f81e4842]:
              - generic [ref=f81e4843]: Giải pháp
              - text: Client gửi client_id+client_secret tới token endpoint, nhận access token để gọi resource server.
            - paragraph [ref=f81e4844]:
              - text: "Liên quan:"
              - link "OAuth 2.0" [ref=f81e4845] [cursor=pointer]:
                - /url: "#oauth-2-0"
              - text: ","
              - link "mTLS" [ref=f81e4846] [cursor=pointer]:
                - /url: "#mtls"
          - article [ref=f81e4847]:
            - heading "Command injection" [level=4] [ref=f81e4848]
            - paragraph [ref=f81e4849]: "còn gọi: tiêm lệnh shell, OS command injection, shell injection"
            - paragraph [ref=f81e4850]:
              - generic [ref=f81e4851]: Vấn đề
              - text: "Ứng dựng ghép user input vào chuỗi lệnh hệ điều hành (vd: `ping ` + host`) — input `; rm -rf /` hoặc `$(...)` chạy thêm lệnh tùy ý. Khác SQLi chỉ damage database, command injection cho attacker quyền trên toàn server, pivot sang hệ thống nội bộ khác — thông tin đánh giá ở PortSwigger: 'typically leading to full compromise of the application'."
            - paragraph [ref=f81e4852]:
              - generic [ref=f81e4853]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e4854]:
              - generic [ref=f81e4855]: Giải pháp
              - text: Cách duy nhất an toàn là không gọi shell — dùng API/platform function thay thế; nếu bắt buộc thì whitelist input nghiêm ngặt và không bao giờ dựa vào escape ký tự shell (quá dễ bypass).
            - paragraph [ref=f81e4856]:
              - text: "Liên quan:"
              - link "SQL injection" [ref=f81e4857] [cursor=pointer]:
                - /url: "#sql-injection"
              - text: ", Input validation"
          - article [ref=f81e4858]:
            - heading "digital signature" [level=4] [ref=f81e4859]
            - paragraph [ref=f81e4860]:
              - generic [ref=f81e4861]: Vấn đề
              - text: Với asymmetric, cần chứng minh ai tạo message và message không bị thay đổi, mà không cần chia sẻ secret.
            - paragraph [ref=f81e4862]:
              - generic [ref=f81e4863]: Nguồn gốc
              - text: Diffie–Hellman context; RSA signatures
            - paragraph [ref=f81e4864]:
              - generic [ref=f81e4865]: Giải pháp
              - text: Signer dùng private key ký hash(message); verifier dùng public key xác minh. Dùng trong JWT (RS256/ES256), SAML, certs.
            - paragraph [ref=f81e4866]:
              - text: "Liên quan:"
              - link "HMAC" [ref=f81e4867] [cursor=pointer]:
                - /url: "#hmac"
              - text: ","
              - link "JWT" [ref=f81e4868] [cursor=pointer]:
                - /url: "#jwt"
              - text: ","
              - link "certificate" [ref=f81e4869] [cursor=pointer]:
                - /url: "#certificate"
          - article [ref=f81e4870]:
            - heading "HMAC" [level=4] [ref=f81e4871]
            - paragraph [ref=f81e4872]: "còn gọi: Hash-based Message Authentication Code"
            - paragraph [ref=f81e4873]:
              - generic [ref=f81e4874]: Vấn đề
              - text: Cần đảm bảo tính toàn vẹn và xác thực nguồn gốc của message khi chỉ có shared secret. Hash thuần không đủ vì attacker có thể thay payload+hash nếu biết hash algo.
            - paragraph [ref=f81e4875]:
              - generic [ref=f81e4876]: Nguồn gốc
              - text: RFC 2104 (Krawczyk et al., 1997)
            - paragraph [ref=f81e4877]:
              - generic [ref=f81e4878]: Giải pháp
              - text: HMAC(K,m)=H((K^opad)||H((K^ipad)||m)). Chỉ ai có secret mới tính đúng MAC; dùng để verify webhook, API signature.
            - paragraph [ref=f81e4879]:
              - text: "Liên quan:"
              - link "digital signature" [ref=f81e4880] [cursor=pointer]:
                - /url: "#digital-signature"
              - text: ","
              - link "replay attack" [ref=f81e4881] [cursor=pointer]:
                - /url: "#replay-attack"
          - article [ref=f81e4882]:
            - heading "IDOR" [level=4] [ref=f81e4883]
            - paragraph [ref=f81e4884]: "còn gọi: Insecure Direct Object Reference"
            - paragraph [ref=f81e4885]:
              - generic [ref=f81e4886]: Vấn đề
              - text: App dùng ID từ request (orderId/userId) trực tiếp truy vấn object mà không kiểm tra quyền sở hữu. Chỉ đổi ID là truy cập được dữ liệu người khác.
            - paragraph [ref=f81e4887]:
              - generic [ref=f81e4888]: Nguồn gốc
              - text: OWASP 2007 Top 10
            - paragraph [ref=f81e4889]:
              - generic [ref=f81e4890]: Giải pháp
              - text: "Luôn enforce authorization: kiểm tra current user có quyền truy cập object đó. Dùng indirect references nếu cần."
            - paragraph [ref=f81e4891]:
              - text: "Liên quan:"
              - link "permission model" [ref=f81e4892] [cursor=pointer]:
                - /url: "#permission-model"
              - text: ","
              - link "RBAC" [ref=f81e4893] [cursor=pointer]:
                - /url: "#rbac"
          - article [ref=f81e4894]:
            - heading "JWT" [level=4] [ref=f81e4895]
            - paragraph [ref=f81e4896]: "còn gọi: JSON Web Token"
            - paragraph [ref=f81e4897]:
              - generic [ref=f81e4898]: Vấn đề
              - text: Khi nhiều service cần xác minh quyền truy cập mà không muốn gọi centralized session store mỗi request, cần định dạng token nhỏ gọn, self-contained chứa claims, có thể xác minh tính toàn vẹn.
            - paragraph [ref=f81e4899]:
              - generic [ref=f81e4900]: Nguồn gốc
              - text: RFC 7519 (Jones et al., 2015)
            - paragraph [ref=f81e4901]:
              - generic [ref=f81e4902]: Giải pháp
              - text: "JWT gồm header.payload.signature (compact, URL-safe). Có thể ký (JWS) để đảm bảo toàn vẹn, hoặc mã hóa (JWE). Cần cẩn thận: alg confusion, 'none', key rotation, expiry (exp), jti để chống replay, không nhồi nhét dữ liệu nhạy cảm trừ khi encrypt."
            - paragraph [ref=f81e4903]:
              - text: "Liên quan:"
              - link "token" [ref=f81e4904] [cursor=pointer]:
                - /url: "#token"
              - text: ","
              - link "HMAC" [ref=f81e4905] [cursor=pointer]:
                - /url: "#hmac"
              - text: ","
              - link "digital signature" [ref=f81e4906] [cursor=pointer]:
                - /url: "#digital-signature"
              - text: ","
              - link "refresh token rotation" [ref=f81e4907] [cursor=pointer]:
                - /url: "#refresh-token-rotation"
          - article [ref=f81e4908]:
            - heading "JWT (JSON Web Token)" [level=4] [ref=f81e4909]
            - paragraph [ref=f81e4910]: "còn gọi: JSON Web Token, signed token"
            - paragraph [ref=f81e4911]:
              - generic [ref=f81e4912]: Vấn đề
              - text: Session lưu server-side khiến mỗi request phải tra DB/Redis, và khi phân tán nhiều service thì chia sẻ state session rất khó — service A không biết session do service B tạo. Cần cách mang claims (user id, scope, exp) xuyên services mà không tra store trung tâm.
            - paragraph [ref=f81e4913]:
              - generic [ref=f81e4914]: Nguồn gốc
              - text: IETF RFC 7519
            - paragraph [ref=f81e4915]:
              - generic [ref=f81e4916]: Giải pháp
              - text: "Payload JSON được ký (JWS) hoặc mã hóa (JWE), cấu trúc `header.payload.signature` base64url — receiver xác minh chữ ký là tin được mà không cần query; đánh đổi: không tự revoke được, nên phải quản lý expiry ngắn và xử lý revocation riêng."
            - paragraph [ref=f81e4917]:
              - text: "Liên quan: Opaque token, OIDC,"
              - link "Refresh token rotation" [ref=f81e4918] [cursor=pointer]:
                - /url: "#refresh-token-rotation"
          - article [ref=f81e4919]:
            - heading "key rotation" [level=4] [ref=f81e4920]
            - paragraph [ref=f81e4921]:
              - generic [ref=f81e4922]: Vấn đề
              - text: Nếu secret/key bị lộ mà không thay, attacker có thời gian dài khai thác. Cần quy trình xoay vòng định kỳ và khẩn cấp.
            - paragraph [ref=f81e4923]:
              - generic [ref=f81e4924]: Nguồn gốc
              - text: NIST key management guidance
            - paragraph [ref=f81e4925]:
              - generic [ref=f81e4926]: Giải pháp
              - text: Xoay JWT signing keys, DB credentials, API keys theo lịch. Hỗ trợ multiple active keys (key rollover) để tránh downtime.
            - paragraph [ref=f81e4927]:
              - text: "Liên quan:"
              - link "secrets management" [ref=f81e4928] [cursor=pointer]:
                - /url: "#secrets-management"
              - text: ","
              - link "JWT" [ref=f81e4929] [cursor=pointer]:
                - /url: "#jwt"
          - article [ref=f81e4930]:
            - heading "least privilege" [level=4] [ref=f81e4931]
            - paragraph [ref=f81e4932]:
              - generic [ref=f81e4933]: Vấn đề
              - text: Nếu service/user có quyền quá rộng, một lỗ hổng nhỏ gây thiệt hại lớn. Cần cấp đúng mức quyền cần thiết.
            - paragraph [ref=f81e4934]:
              - generic [ref=f81e4935]: Nguồn gốc
              - text: Saltzer–Schroeder principles (1975)
            - paragraph [ref=f81e4936]:
              - generic [ref=f81e4937]: Giải pháp
              - text: DB user chỉ SELECT/INSERT cần thiết, service chỉ quyền truy cập resource cụ thể, role tối thiểu.
            - paragraph [ref=f81e4938]:
              - text: "Liên quan:"
              - link "RBAC" [ref=f81e4939] [cursor=pointer]:
                - /url: "#rbac"
              - text: ","
              - link "permission model" [ref=f81e4940] [cursor=pointer]:
                - /url: "#permission-model"
              - text: ","
              - link "zero trust" [ref=f81e4941] [cursor=pointer]:
                - /url: "#zero-trust"
          - article [ref=f81e4942]:
            - heading "mass assignment" [level=4] [ref=f81e4943]
            - paragraph [ref=f81e4944]:
              - generic [ref=f81e4945]: Vấn đề
              - text: Framework auto-bind toàn bộ request body vào model object. Attacker có thể gửi field nhạy cảm (isAdmin, role) để tự nâng quyền.
            - paragraph [ref=f81e4946]:
              - generic [ref=f81e4947]: Nguồn gốc
              - text: OWASP; GitHub 2012 incident highlighted risk
            - paragraph [ref=f81e4948]:
              - generic [ref=f81e4949]: Giải pháp
              - text: Dùng DTO/whitelist fields được phép update, không bind trực tiếp model. Enforce server-side validation.
            - paragraph [ref=f81e4950]:
              - text: "Liên quan:"
              - link "permission model" [ref=f81e4951] [cursor=pointer]:
                - /url: "#permission-model"
          - article [ref=f81e4952]:
            - heading "MFA/TOTP" [level=4] [ref=f81e4953]
            - paragraph [ref=f81e4954]: "còn gọi: Multi-Factor Authentication, Time-based One-Time Password"
            - paragraph [ref=f81e4955]:
              - generic [ref=f81e4956]: Vấn đề
              - text: Password đơn lẻ dễ bị rò rỉ (phishing, breach). Cần thêm lớp xác thực thứ hai (factor khác).
            - paragraph [ref=f81e4957]:
              - generic [ref=f81e4958]: Nguồn gốc
              - text: RFC 6238 (M'Raihi et al., 2011) for TOTP
            - paragraph [ref=f81e4959]:
              - generic [ref=f81e4960]: Giải pháp
              - text: TOTP sinh code 6-8 số dựa trên shared secret + thời gian (30s). Authenticator app (Google Authenticator, Authy) hiển thị code; server verify. Kết hợp với password tạo MFA.
            - paragraph [ref=f81e4961]:
              - text: "Liên quan:"
              - link "brute force + rate limiting" [ref=f81e4962] [cursor=pointer]:
                - /url: "#brute-force-rate-limiting"
          - article [ref=f81e4963]:
            - heading "mTLS" [level=4] [ref=f81e4964]
            - paragraph [ref=f81e4965]: "còn gọi: mutual TLS"
            - paragraph [ref=f81e4966]:
              - generic [ref=f81e4967]: Vấn đề
              - text: TLS thông thường chỉ chứng minh server với client. Trong service-to-service hoặc zero trust, cần cả hai bên chứng minh danh tính (client cert) để ngăn truy cập trái phép.
            - paragraph [ref=f81e4968]:
              - generic [ref=f81e4969]: Nguồn gốc
              - text: IETF TLS; widely used in service meshes
            - paragraph [ref=f81e4970]:
              - generic [ref=f81e4971]: Giải pháp
              - text: Client cũng phải gửi certificate trong TLS handshake; server xác minh client cert bằng CA. Tránh dùng shared secrets đơn thuần.
            - paragraph [ref=f81e4972]:
              - text: "Liên quan:"
              - link "TLS handshake" [ref=f81e4973] [cursor=pointer]:
                - /url: "#tls-handshake"
              - text: ","
              - link "certificate" [ref=f81e4974] [cursor=pointer]:
                - /url: "#certificate"
              - text: ","
              - link "zero trust" [ref=f81e4975] [cursor=pointer]:
                - /url: "#zero-trust"
          - article [ref=f81e4976]:
            - heading "nonce" [level=4] [ref=f81e4977]
            - paragraph [ref=f81e4978]:
              - generic [ref=f81e4979]: Vấn đề
              - text: Khi cần đảm bảo request chỉ dùng một lần (login, payment), cần giá trị ngẫu nhiên duy nhất dùng trong phiên đó.
            - paragraph [ref=f81e4980]:
              - generic [ref=f81e4981]: Nguồn gốc
              - text: Cryptographic protocols (Needham–Schroeder)
            - paragraph [ref=f81e4982]:
              - generic [ref=f81e4983]: Giải pháp
              - text: Server phát nonce, client gửi kèm hash/signature; server kiểm tra chưa dùng trước đó.
            - paragraph [ref=f81e4984]:
              - text: "Liên quan:"
              - link "replay attack" [ref=f81e4985] [cursor=pointer]:
                - /url: "#replay-attack"
              - text: ","
              - link "HMAC" [ref=f81e4986] [cursor=pointer]:
                - /url: "#hmac"
          - article [ref=f81e4987]:
            - heading "OAuth 2.0" [level=4] [ref=f81e4988]
            - paragraph [ref=f81e4989]:
              - generic [ref=f81e4990]: Vấn đề
              - text: "Trước đây, app bên thứ ba muốn truy cập tài nguyên user phải xin password user — nguy hiểm (lưu password, không giới hạn quyền, không thu hồi). Cần cơ chế ủy quyền tách rời: user cấp quyền cho client qua authorization server."
            - paragraph [ref=f81e4991]:
              - generic [ref=f81e4992]: Nguồn gốc
              - text: RFC 6749 (Hardt, 2012) replacing OAuth 1.0
            - paragraph [ref=f81e4993]:
              - generic [ref=f81e4994]: Giải pháp
              - text: "Roles: resource owner, client, authorization server, resource server. Flows: authorization code (recommended), implicit (deprecated), resource owner password (discouraged), client credentials (service-to-service)."
            - paragraph [ref=f81e4995]:
              - text: "Liên quan:"
              - link "authorization code" [ref=f81e4996] [cursor=pointer]:
                - /url: "#authorization-code"
              - text: ","
              - link "PKCE" [ref=f81e4997] [cursor=pointer]:
                - /url: "#pkce"
              - text: ","
              - link "OpenID Connect" [ref=f81e4998] [cursor=pointer]:
                - /url: "#openid-connect"
          - article [ref=f81e4999]:
            - heading "OAuth 2.0 (authorization framework)" [level=4] [ref=f81e5000]
            - paragraph [ref=f81e5001]: "còn gọi: OAuth2, authorization code flow"
            - paragraph [ref=f81e5002]:
              - generic [ref=f81e5003]: Vấn đề
              - text: Trước OAuth, app bên thứ ba muốn truy cập dữ liệu người dùng thì buộc user đưa password thật — app lưu password plain-text, user không giới hạn scope/thời hạn, muốn thu hồi một app phải đổi mật khẩu (mất quyền mọi app), một app bị breach là password của mọi thứ chết theo. Đây là đúng chuỗi vấn đề RFC 6749 liệt kê.
            - paragraph [ref=f81e5004]:
              - generic [ref=f81e5005]: Nguồn gốc
              - text: IETF RFC 6749 (thay OAuth 1.0 RFC 5849)
            - paragraph [ref=f81e5006]:
              - generic [ref=f81e5007]: Giải pháp
              - text: "Tách authorization layer: user đồng ý tại authorization server, client nhận access token giới hạn scope/thời hạn thay vì mật khẩu. Authorization code flow: redirect user sang server cấp code ngắn hạn, client đổi code → token tại backend (token không đi qua trình duyệt); implicit flow cũ bị loại dần vì token lộ trong URL."
            - paragraph [ref=f81e5008]:
              - text: "Liên quan:"
              - link "PKCE" [ref=f81e5009] [cursor=pointer]:
                - /url: "#pkce"
              - text: ", OIDC, OAuth 2.1"
          - article [ref=f81e5010]:
            - heading "Opaque token vs JWT (revocation trade-off)" [level=4] [ref=f81e5011]
            - paragraph [ref=f81e5012]: "còn gọi: token đục, token tự xác minh vs token tra cứu"
            - paragraph [ref=f81e5013]:
              - generic [ref=f81e5014]: Vấn đề
              - text: JWT tự xác minh nhưng không thu hồi được khi user logout/đổi quyền — token đánh cắp sống hết hạn (có thể vài giờ/ngày). Ngược lại, opaque token (chuỗi ngẫu nhiên) revocable nhưng mỗi request phải gọi introspection/tra DB, tốn thêm round-trip. Đây là trade-off mọi team phải chọn khi làm auth, sai là gặp sự cố 'đã logout nhưng token vẫn hoạt động'.
            - paragraph [ref=f81e5015]:
              - generic [ref=f81e5016]: Nguồn gốc
              - text: RFC 7662 (token introspection)
            - paragraph [ref=f81e5017]:
              - generic [ref=f81e5018]: Giải pháp
              - text: "Opaque token + endpoint introspection (RFC 7662) để resource server hỏi 'token này còn active không' theo thời gian thực; hoặc JWT ngắn hạn + refresh token rotation/danh sách đen để thu hồi. Lựa chọn theo yêu cầu: cần revocation tức thì → opaque hoặc short-TTL JWT."
            - paragraph [ref=f81e5019]:
              - text: "Liên quan:"
              - link "JWT" [ref=f81e5020] [cursor=pointer]:
                - /url: "#jwt"
              - text: ","
              - link "Refresh token rotation" [ref=f81e5021] [cursor=pointer]:
                - /url: "#refresh-token-rotation"
              - text: ","
              - link "OAuth 2.0" [ref=f81e5022] [cursor=pointer]:
                - /url: "#oauth-2-0"
          - article [ref=f81e5023]:
            - heading "OpenID Connect" [level=4] [ref=f81e5024]
            - paragraph [ref=f81e5025]: "còn gọi: OIDC"
            - paragraph [ref=f81e5026]:
              - generic [ref=f81e5027]: Vấn đề
              - text: OAuth 2.0 chỉ giải quyết ủy quyền, không chuẩn hóa 'ai đang đăng nhập'. Nhiều app cần identity layer chuẩn để SSO an toàn.
            - paragraph [ref=f81e5028]:
              - generic [ref=f81e5029]: Nguồn gốc
              - text: OpenID Foundation (2014, OIDC 1.0 built on OAuth 2.0)
            - paragraph [ref=f81e5030]:
              - generic [ref=f81e5031]: Giải pháp
              - text: OIDC thêm ID Token (JWT chứa claims về user) và UserInfo endpoint. Cho phép xác thực user và lấy thông tin cơ bản theo chuẩn.
            - paragraph [ref=f81e5032]:
              - text: "Liên quan:"
              - link "OAuth 2.0" [ref=f81e5033] [cursor=pointer]:
                - /url: "#oauth-2-0"
              - text: ","
              - link "SSO" [ref=f81e5034] [cursor=pointer]:
                - /url: "#sso"
              - text: ","
              - link "JWT" [ref=f81e5035] [cursor=pointer]:
                - /url: "#jwt"
          - article [ref=f81e5036]:
            - heading "OpenID Connect (OIDC)" [level=4] [ref=f81e5037]
            - paragraph [ref=f81e5038]: "còn gọi: OIDC"
            - paragraph [ref=f81e5039]:
              - generic [ref=f81e5040]: Vấn đề
              - text: OAuth 2.0 thuần chỉ cho mượn quyền truy cập API, hoàn toàn không định nghĩa cách xác thực 'user này là ai' — developer tự bịa (gọi API /me rồi đoán)gây ra mỗi tích hợp login một kiểu, không standard. OAuth giải quyết authorization chứ không phải authentication.
            - paragraph [ref=f81e5041]:
              - generic [ref=f81e5042]: Nguồn gốc
              - text: OpenID Connect Core 1.0 — bản cuối tháng 2/2014, errata set 2 ngày 15/12/2023
            - paragraph [ref=f81e5043]:
              - generic [ref=f81e5044]: Giải pháp
              - text: "Lớp identity trên OAuth 2.0: thêm scope `openid`, authorization server trả ID Token (JWT ký về sự kiện xác thực: issuer, subject, nonce, exp) — client verify ID Token là biết user đã đăng nhập ở đâu, tách bạch với access token dùng cho API."
            - paragraph [ref=f81e5045]:
              - text: "Liên quan:"
              - link "OAuth 2.0" [ref=f81e5046] [cursor=pointer]:
                - /url: "#oauth-2-0"
              - text: ","
              - link "JWT" [ref=f81e5047] [cursor=pointer]:
                - /url: "#jwt"
          - article [ref=f81e5048]:
            - heading "OWASP Top 10" [level=4] [ref=f81e5049]
            - paragraph [ref=f81e5050]:
              - generic [ref=f81e5051]: Vấn đề
              - text: Cần danh sách ưu tiên các lỗ hổng web phổ biến nhất dựa trên dữ liệu thực tế để tập trung fix đúng thứ quan trọng.
            - paragraph [ref=f81e5052]:
              - generic [ref=f81e5053]: Nguồn gốc
              - text: OWASP Top 10 project (first 2003, updated periodically; 2021 edition widely referenced)
            - paragraph [ref=f81e5054]:
              - generic [ref=f81e5055]: Giải pháp
              - text: Liệt kê 10 rủi ro hàng đầu (vd. A01 Broken Access Control, A02 Cryptographic Failures, A03 Injection, A07 Identification/Auth Failures, v.v.) kèm ngữ cảnh/khuyến nghị.
            - paragraph [ref=f81e5056]:
              - text: "Liên quan:"
              - link "SQL injection" [ref=f81e5057] [cursor=pointer]:
                - /url: "#sql-injection"
              - text: ","
              - link "XSS" [ref=f81e5058] [cursor=pointer]:
                - /url: "#xss"
              - text: ","
              - link "IDOR" [ref=f81e5059] [cursor=pointer]:
                - /url: "#idor"
          - article [ref=f81e5060]:
            - heading "permission model" [level=4] [ref=f81e5061]
            - paragraph [ref=f81e5062]:
              - generic [ref=f81e5063]: Vấn đề
              - text: Mỗi module (order, invoice) cần kiểm soát ai đọc/sửa/xóa. Nếu logic rải rác khắp controller dễ sai, khó audit.
            - paragraph [ref=f81e5064]:
              - generic [ref=f81e5065]: Nguồn gốc
              - text: Access control design
            - paragraph [ref=f81e5066]:
              - generic [ref=f81e5067]: Giải pháp
              - text: Thống nhất cách định nghĩa permissions (resource:action) + assignment (RBAC/ABAC) + enforcement (guards/policies).
            - paragraph [ref=f81e5068]:
              - text: "Liên quan:"
              - link "RBAC" [ref=f81e5069] [cursor=pointer]:
                - /url: "#rbac"
              - text: ","
              - link "ABAC" [ref=f81e5070] [cursor=pointer]:
                - /url: "#abac"
              - text: ","
              - link "least privilege" [ref=f81e5071] [cursor=pointer]:
                - /url: "#least-privilege"
          - article [ref=f81e5072]:
            - heading "PKCE" [level=4] [ref=f81e5073]
            - paragraph [ref=f81e5074]: "còn gọi: Proof Key for Code Exchange"
            - paragraph [ref=f81e5075]:
              - generic [ref=f81e5076]: Vấn đề
              - text: Với public client (mobile app/native/spa) không có client secret, authorization code bị chặn giữa app và browser có thể bị ăn cắp để đổi token. Cần cơ chế chứng minh client thật sự là người nhận code.
            - paragraph [ref=f81e5077]:
              - generic [ref=f81e5078]: Nguồn gốc
              - text: RFC 7636 (Sakimura et al., 2015)
            - paragraph [ref=f81e5079]:
              - generic [ref=f81e5080]: Giải pháp
              - text: Client tạo code_verifier ngẫu nhiên, tính code_challenge (SHA256+base64url). Gửi challenge khi authorize, gửi verifier khi exchange code. Server so khớp — attacker không có verifier.
            - paragraph [ref=f81e5081]:
              - text: "Liên quan:"
              - link "authorization code" [ref=f81e5082] [cursor=pointer]:
                - /url: "#authorization-code"
              - text: ","
              - link "OAuth 2.0" [ref=f81e5083] [cursor=pointer]:
                - /url: "#oauth-2-0"
          - article [ref=f81e5084]:
            - heading "PKCE (Proof Key for Code Exchange)" [level=4] [ref=f81e5085]
            - paragraph [ref=f81e5086]: "còn gọi: code_challenge/code_verifier, bằng chứng trao đổi mã"
            - paragraph [ref=f81e5087]:
              - generic [ref=f81e5088]: Vấn đề
              - text: "Native app đăng ký custom URI scheme chung (`myapp://callback`) — app độc hại cũng đăng ký cùng scheme và 'ăn cắp' authorization code từ redirect (authorization code interception attack). Public client không có client_secret để chứng minh mình là người đổi code, nên attacker lấy code là đổi được token ngay."
            - paragraph [ref=f81e5089]:
              - generic [ref=f81e5090]: Nguồn gốc
              - text: IETF RFC 7636
            - paragraph [ref=f81e5091]:
              - generic [ref=f81e5092]: Giải pháp
              - text: "Client tạo random `code_verifier`, gửi bản hash (`code_challenge`) kèm request; đổi code thì gửi lại verifier — attacker intercept code nhưng không có verifier nên không đổi được token. RFC 7636 thiết kế cho public client, OAuth 2.1 bắt buộc cho mọi client."
            - paragraph [ref=f81e5093]:
              - text: "Liên quan:"
              - link "OAuth 2.0" [ref=f81e5094] [cursor=pointer]:
                - /url: "#oauth-2-0"
              - text: ", OAuth 2.1, Authorization code flow"
          - article [ref=f81e5095]:
            - heading "RBAC" [level=4] [ref=f81e5096]
            - paragraph [ref=f81e5097]: "còn gọi: Role-Based Access Control"
            - paragraph [ref=f81e5098]:
              - generic [ref=f81e5099]: Vấn đề
              - text: Gán quyền trực tiếp cho từng user không scale (hàng ngàn user). Cần nhóm quyền theo vai trò.
            - paragraph [ref=f81e5100]:
              - generic [ref=f81e5101]: Nguồn gốc
              - text: Ferraiolo–Kuhn (1992)
            - paragraph [ref=f81e5102]:
              - generic [ref=f81e5103]: Giải pháp
              - text: Gán user vào role (admin/editor/viewer), role có permissions. Kiểm tra role khi truy cập resource.
            - paragraph [ref=f81e5104]:
              - text: "Liên quan:"
              - link "permission model" [ref=f81e5105] [cursor=pointer]:
                - /url: "#permission-model"
              - text: ","
              - link "ABAC" [ref=f81e5106] [cursor=pointer]:
                - /url: "#abac"
              - text: ","
              - link "least privilege" [ref=f81e5107] [cursor=pointer]:
                - /url: "#least-privilege"
          - article [ref=f81e5108]:
            - heading "RBAC (Role-Based Access Control)" [level=4] [ref=f81e5109]
            - paragraph [ref=f81e5110]: "còn gọi: phân quyền theo vai trò"
            - paragraph [ref=f81e5111]:
              - generic [ref=f81e5112]: Vấn đề
              - text: Hàng trăm user, hàng nghìn quyền mà admin cấp từng quyền cho từng người bằng tay — onboard nhân viên mới phải tick 40 checkbox, chuyển phòng ban phải gỡ và gắn lại mọi permission, sót quyền cũ thành lỗ hổng. Đây là nỗi đau khiến RBAC thay ACL trong tổ chức lớn.
            - paragraph [ref=f81e5113]:
              - generic [ref=f81e5114]: Nguồn gốc
              - text: Ferraiolo & Kuhn 1992; Sandhu et al. 1996; chuẩn hóa ANSI/INCITS 359-2004 bởi NIST
            - paragraph [ref=f81e5115]:
              - generic [ref=f81e5116]: Giải pháp
              - text: Gắn permission vào role theo chức năng (editor, admin...), user chỉ được gán role — quản lý quyền thành 'gán/ghé role', hỗ trợ role hierarchy và separation of duties.
            - paragraph [ref=f81e5117]:
              - text: "Liên quan:"
              - link "ABAC" [ref=f81e5118] [cursor=pointer]:
                - /url: "#abac"
              - text: ", Principle of least privilege"
          - article [ref=f81e5119]:
            - heading "refresh token rotation" [level=4] [ref=f81e5120]
            - paragraph [ref=f81e5121]: "còn gọi: Refresh token rotation & revocation, quay refresh token, token thu hồi"
            - paragraph [ref=f81e5122]:
              - generic [ref=f81e5123]: Vấn đề
              - text: "Refresh token dài hạn nếu bị đánh cắp cho phép attacker lấy access token liên tục. Cần giảm thiệt hại: mỗi lần dùng refresh token cũ sẽ bị thu hồi và cấp token mới. Access token sống ngắn thì user phải đăng nhập lại liên tục; sống dài thì bị đánh cắp dùng được lâu. Refresh token giải quyết nhưng bị đánh cắp thì attacker tái tạo access token vô hạn — và nếu refresh token tĩnh (không đổi), server không phát hiện được token đã bị đánh cắp vì vẫn valid."
            - paragraph [ref=f81e5124]:
              - generic [ref=f81e5125]: Nguồn gốc
              - text: OAuth 2.0 Security BCP (RFC 9700)
            - paragraph [ref=f81e5126]:
              - generic [ref=f81e5127]: Giải pháp
              - text: Khi refresh, cấp cặp (access+new refresh), vô hiệu hóa refresh cũ. Nếu phát hiện reuse (refresh cũ bị dùng lại), thu hồi toàn bộ token chain. Mỗi lần dùng refresh token để lấy access token mới, server cấp refresh token mới (rotation) — token cũ bị đánh cắp mà dùng lại sẽ lệch chuỗi, server phát hiện breach và thu hồi cả family; kết hợp binding scope/resource như OAuth Security BCP yêu cầu.
            - paragraph [ref=f81e5128]:
              - text: "Liên quan:"
              - link "JWT" [ref=f81e5129] [cursor=pointer]:
                - /url: "#jwt"
              - text: ","
              - link "OAuth 2.0" [ref=f81e5130] [cursor=pointer]:
                - /url: "#oauth-2-0"
              - text: ", Opaque token"
          - article [ref=f81e5131]:
            - heading "replay attack" [level=4] [ref=f81e5132]
            - paragraph [ref=f81e5133]:
              - generic [ref=f81e5134]: Vấn đề
              - text: Attacker chặn request hợp lệ (token/cookie) và gửi lại sau để lặp lại hành động (vd. thanh toán). Cần ngăn dùng lại credential cũ.
            - paragraph [ref=f81e5135]:
              - generic [ref=f81e5136]: Nguồn gốc
              - text: Network security literature
            - paragraph [ref=f81e5137]:
              - generic [ref=f81e5138]: Giải pháp
              - text: Dùng jti trong JWT, nonce cho requests nhạy cảm, short expiry, TLS, one-time use codes.
            - paragraph [ref=f81e5139]:
              - text: "Liên quan:"
              - link "JWT" [ref=f81e5140] [cursor=pointer]:
                - /url: "#jwt"
              - text: ","
              - link "nonce" [ref=f81e5141] [cursor=pointer]:
                - /url: "#nonce"
              - text: ","
              - link "HMAC" [ref=f81e5142] [cursor=pointer]:
                - /url: "#hmac"
          - article [ref=f81e5143]:
            - heading "SAML" [level=4] [ref=f81e5144]
            - paragraph [ref=f81e5145]: "còn gọi: Security Assertion Markup Language"
            - paragraph [ref=f81e5146]:
              - generic [ref=f81e5147]: Vấn đề
              - text: Cần chuẩn trao đổi thông tin xác thực/ủy quyền giữa IdP và SP, đặc biệt trong enterprise (legacy). XML-based assertions.
            - paragraph [ref=f81e5148]:
              - generic [ref=f81e5149]: Nguồn gốc
              - text: OASIS SAML 1.0 (2002), SAML 2.0 (2005)
            - paragraph [ref=f81e5150]:
              - generic [ref=f81e5151]: Giải pháp
              - text: IdP phát SAML assertion (XML) chứa user identity/attributes, SP xác minh signature và cho phép truy cập.
            - paragraph [ref=f81e5152]:
              - text: "Liên quan:"
              - link "SSO" [ref=f81e5153] [cursor=pointer]:
                - /url: "#sso"
              - text: ","
              - link "digital signature" [ref=f81e5154] [cursor=pointer]:
                - /url: "#digital-signature"
          - article [ref=f81e5155]:
            - heading "secrets management" [level=4] [ref=f81e5156]
            - paragraph [ref=f81e5157]: "còn gọi: Secrets management (Vault-style), quản lý bí mật tập trung, dynamic secrets"
            - paragraph [ref=f81e5158]:
              - generic [ref=f81e5159]: Vấn đề
              - text: API keys, DB passwords, JWT secrets dễ bị rò rỉ nếu commit vào git, log, hoặc hardcode. Cần lưu tập trung, kiểm soát truy cập, xoay vòng. API key/DB password nằm rải rác trong .env, config file, CI variable — xoay (rotate) key phải đổi hàng chục nơi, không ai biết ai đã đọc secret nào, và secret vẫn sống mãi sau khi employee nghỉ việc. Treasury/Security không audit được ai truy cập credential.
            - paragraph [ref=f81e5160]:
              - generic [ref=f81e5161]: Nguồn gốc
              - text: DevSecOps practices
            - paragraph [ref=f81e5162]:
              - generic [ref=f81e5163]: Giải pháp
              - text: "Dùng secret store (Vault, AWS Secrets Manager), inject qua env/CI, scan secrets (gitleaks), tránh log secrets. Centralize secret vào vault riêng (HashiCorp Vault...): static + dynamic secrets (DB credentials tự sinh và tự hết hạn), mã hóa at-rest, audit log mọi truy cập bất kể thành công/thất bại, tích hợp rotation và identity-based auth."
            - paragraph [ref=f81e5164]:
              - text: "Liên quan:"
              - link "key rotation" [ref=f81e5165] [cursor=pointer]:
                - /url: "#key-rotation"
              - text: ","
              - link "API key" [ref=f81e5166] [cursor=pointer]:
                - /url: "#api-key"
              - text: ", Principle of least privilege,"
              - link "mTLS" [ref=f81e5167] [cursor=pointer]:
                - /url: "#mtls"
          - article [ref=f81e5168]:
            - heading "SQL injection" [level=4] [ref=f81e5169]
            - paragraph [ref=f81e5170]: "còn gọi: SQLi"
            - paragraph [ref=f81e5171]:
              - generic [ref=f81e5172]: Vấn đề
              - text: Khi xây query bằng string concatenation với input user, input có thể chứa SQL meta-char làm thay đổi ý nghĩa query (đọc/xóa dữ liệu).
            - paragraph [ref=f81e5173]:
              - generic [ref=f81e5174]: Nguồn gốc
              - text: First public discussions late 1990s; OWASP
            - paragraph [ref=f81e5175]:
              - generic [ref=f81e5176]: Giải pháp
              - text: Parameterized queries/prepared statements là giải pháp chính. Validate allowlist, dùng least privilege DB user.
            - paragraph [ref=f81e5177]:
              - text: "Liên quan:"
              - link "IDOR" [ref=f81e5178] [cursor=pointer]:
                - /url: "#idor"
          - article [ref=f81e5179]:
            - heading "SSO" [level=4] [ref=f81e5180]
            - paragraph [ref=f81e5181]: "còn gọi: Single Sign-On"
            - paragraph [ref=f81e5182]:
              - generic [ref=f81e5183]: Vấn đề
              - text: User phải nhớ/login nhiều hệ thống khác nhau gây phiền phức và tăng nguy cơ dùng password yếu/lặp lại. Cần đăng nhập một lần để truy cập nhiều app.
            - paragraph [ref=f81e5184]:
              - generic [ref=f81e5185]: Nguồn gốc
              - text: Kerberos (MIT, 1988), later SAML/OIDC
            - paragraph [ref=f81e5186]:
              - generic [ref=f81e5187]: Giải pháp
              - text: Central identity provider (IdP) xác thực user, phát token/assertion cho các service provider (SP). User không cần login lại.
            - paragraph [ref=f81e5188]:
              - text: "Liên quan:"
              - link "SAML" [ref=f81e5189] [cursor=pointer]:
                - /url: "#saml"
              - text: ","
              - link "OpenID Connect" [ref=f81e5190] [cursor=pointer]:
                - /url: "#openid-connect"
          - article [ref=f81e5191]:
            - heading "SSRF" [level=4] [ref=f81e5192]
            - paragraph [ref=f81e5193]: "còn gọi: Server-Side Request Forgery"
            - paragraph [ref=f81e5194]:
              - generic [ref=f81e5195]: Vấn đề
              - text: Server được phép gọi HTTP tới internal services (metadata, DB admin). Nếu attacker kiểm soát URL, server có thể gọi internal endpoints người ngoài không thấy, tiết lộ thông tin nhạy cảm.
            - paragraph [ref=f81e5196]:
              - generic [ref=f81e5197]: Nguồn gốc
              - text: OWASP Top 10 awareness; cloud metadata abuse
            - paragraph [ref=f81e5198]:
              - generic [ref=f81e5199]: Giải pháp
              - text: Validate URL allowlist, chặn private IP ranges/loopback, không follow redirect tùy tiện, tách network cho internal calls.
            - paragraph [ref=f81e5200]:
              - text: "Liên quan:"
              - link "zero trust" [ref=f81e5201] [cursor=pointer]:
                - /url: "#zero-trust"
              - text: ","
              - link "least privilege" [ref=f81e5202] [cursor=pointer]:
                - /url: "#least-privilege"
          - article [ref=f81e5203]:
            - heading "TLS handshake" [level=4] [ref=f81e5204]
            - paragraph [ref=f81e5205]:
              - generic [ref=f81e5206]: Vấn đề
              - text: HTTP plaintext bị nghe trộm/thay đổi. Cần thiết lập kênh mã hóa giữa client/server và xác minh server trước khi trao đổi dữ liệu.
            - paragraph [ref=f81e5207]:
              - generic [ref=f81e5208]: Nguồn gốc
              - text: TLS evolved from SSL; TLS 1.3 (RFC 8446) simplified
            - paragraph [ref=f81e5209]:
              - generic [ref=f81e5210]: Giải pháp
              - text: ClientHello -> ServerHello+cert -> key exchange -> encrypted channel. Server chứng minh qua certificate; TLS 1.3 rút ngắn handshake, bỏ cipher yếu.
            - paragraph [ref=f81e5211]:
              - text: "Liên quan:"
              - link "encryption symmetric vs asymmetric" [ref=f81e5212] [cursor=pointer]:
                - /url: "#encryption-symmetric-vs-asymmetric"
              - text: ","
              - link "certificate" [ref=f81e5213] [cursor=pointer]:
                - /url: "#certificate"
              - text: ","
              - link "mTLS" [ref=f81e5214] [cursor=pointer]:
                - /url: "#mtls"
          - article [ref=f81e5215]:
            - heading "XSS" [level=4] [ref=f81e5216]
            - paragraph [ref=f81e5217]: "còn gọi: Cross-Site Scripting"
            - paragraph [ref=f81e5218]:
              - generic [ref=f81e5219]: Vấn đề
              - text: Nếu app nhúng dữ liệu user vào HTML mà không sanitize, attacker có thể chèn JS chạy trong session victim, ăn cắp cookie/token, hành động thay user.
            - paragraph [ref=f81e5220]:
              - generic [ref=f81e5221]: Nguồn gốc
              - text: CERT advisory early 2000s; OWASP
            - paragraph [ref=f81e5222]:
              - generic [ref=f81e5223]: Giải pháp
              - text: "Reflected/stored/DOM-based. Phòng: output encoding, CSP, HttpOnly/Secure cookies, tránh dùng innerHTML với data không tin cậy."
            - paragraph [ref=f81e5224]:
              - text: "Liên quan:"
              - link "CORS vs CSRF" [ref=f81e5225] [cursor=pointer]:
                - /url: "#cors-vs-csrf"
              - text: ","
              - link "secrets management" [ref=f81e5226] [cursor=pointer]:
                - /url: "#secrets-management"
        - generic [ref=f81e5227]:
          - heading "Kiểm thử & Chất lượng 25" [level=3] [ref=f81e5228]:
            - text: Kiểm thử & Chất lượng
            - generic [ref=f81e5229]: "25"
          - article [ref=f81e5230]:
            - heading "A/B test" [level=4] [ref=f81e5231]
            - paragraph [ref=f81e5232]: "còn gọi: split test, A/B testing"
            - paragraph [ref=f81e5233]:
              - generic [ref=f81e5234]: Vấn đề
              - text: Không biết thay đổi UI/logic có thực sự cải thiện metric kinh doanh (conversion, click) hay chỉ ngẫu nhiên.
            - paragraph [ref=f81e5235]:
              - generic [ref=f81e5236]: Nguồn gốc
              - text: Ronald Fisher statistics applied; web A/B popularized
            - paragraph [ref=f81e5237]:
              - generic [ref=f81e5238]: Giải pháp
              - text: Chia user ngẫu nhiên thành A/B, so sánh metric với ý nghĩa thống kê trước khi quyết định roll out.
            - paragraph [ref=f81e5239]:
              - text: "Liên quan:"
              - link "canary analysis" [ref=f81e5240] [cursor=pointer]:
                - /url: "#canary-analysis"
              - text: ","
              - link "feature flag testing" [ref=f81e5241] [cursor=pointer]:
                - /url: "#feature-flag-testing"
          - article [ref=f81e5242]:
            - heading "BDD" [level=4] [ref=f81e5243]
            - paragraph [ref=f81e5244]: "còn gọi: Behavior-Driven Development"
            - paragraph [ref=f81e5245]:
              - generic [ref=f81e5246]: Vấn đề
              - text: Team kỹ thuật và nghiệp vụ nói khác ngôn ngữ, dẫn đến hiểu sai yêu cầu. Cần diễn đạt hành vi bằng ngôn ngữ gần business.
            - paragraph [ref=f81e5247]:
              - generic [ref=f81e5248]: Nguồn gốc
              - text: Dan North
            - paragraph [ref=f81e5249]:
              - generic [ref=f81e5250]: Giải pháp
              - text: Viết kịch bản hành vi Given-When-Then để cả PO/dev/QA cùng hiểu, sau đó mapping sang test code.
            - paragraph [ref=f81e5251]:
              - text: "Liên quan:"
              - link "TDD" [ref=f81e5252] [cursor=pointer]:
                - /url: "#tdd"
              - text: ", acceptance test,"
              - link "contract test (Pact)" [ref=f81e5253] [cursor=pointer]:
                - /url: "#contract-test-pact"
              - text: ","
              - link "Gherkin" [ref=f81e5254] [cursor=pointer]:
                - /url: "#gherkin"
              - text: ","
              - link "Specification by example" [ref=f81e5255] [cursor=pointer]:
                - /url: "#specification-by-example"
          - article [ref=f81e5256]:
            - heading "Behavior verification" [level=4] [ref=f81e5257]
            - paragraph [ref=f81e5258]:
              - generic [ref=f81e5259]: Vấn đề
              - text: "Trong một số trường hợp, trạng thái cuối cùng không đủ để chứng minh SUT đã tương tác đúng (ví dụ: phải gọi đúng service thanh toán đúng số lần), cần kiểm tra các lời gọi đã xảy ra."
            - paragraph [ref=f81e5260]:
              - generic [ref=f81e5261]: Nguồn gốc
              - text: Gerard Meszaros (xUnit Test Patterns)
            - paragraph [ref=f81e5262]:
              - generic [ref=f81e5263]: Giải pháp
              - text: Kiểm tra rằng SUT đã gửi đúng thông điệp/tương tác tới collaborator theo đúng kỳ vọng đã định trước.
            - paragraph [ref=f81e5264]:
              - text: "Liên quan:"
              - link "Mock" [ref=f81e5265] [cursor=pointer]:
                - /url: "#mock"
              - text: ","
              - link "State verification" [ref=f81e5266] [cursor=pointer]:
                - /url: "#state-verification"
          - article [ref=f81e5267]:
            - heading "Branch coverage" [level=4] [ref=f81e5268]
            - paragraph [ref=f81e5269]: "còn gọi: Decision coverage"
            - paragraph [ref=f81e5270]:
              - generic [ref=f81e5271]: Vấn đề
              - text: "Statement coverage có thể bỏ sót: nếu một nhánh if/else không được chạy, lỗi trong nhánh đó vẫn không bị phát hiện dù statement coverage đã cao."
            - paragraph [ref=f81e5272]:
              - generic [ref=f81e5273]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e5274]:
              - generic [ref=f81e5275]: Giải pháp
              - text: Đảm bảo cả hai nhánh true/false của mỗi điều kiện rẽ nhánh đều được thực thi ít nhất một lần.
            - paragraph [ref=f81e5276]:
              - text: "Liên quan:"
              - link "Code coverage" [ref=f81e5277] [cursor=pointer]:
                - /url: "#code-coverage"
              - text: ","
              - link "Statement coverage" [ref=f81e5278] [cursor=pointer]:
                - /url: "#statement-coverage"
          - article [ref=f81e5279]:
            - heading "cyclomatic complexity" [level=4] [ref=f81e5280]
            - paragraph [ref=f81e5281]: "còn gọi: McCabe complexity"
            - paragraph [ref=f81e5282]:
              - generic [ref=f81e5283]: Vấn đề
              - text: Hàm có quá nhiều nhánh if/switch/loop → khó hiểu, khó test đủ nhánh, dễ ẩn lỗi.
            - paragraph [ref=f81e5284]:
              - generic [ref=f81e5285]: Nguồn gốc
              - text: Thomas J. McCabe (1976)
            - paragraph [ref=f81e5286]:
              - generic [ref=f81e5287]: Giải pháp
              - text: Đếm số đường thực thi độc lập. Thường giữ thấp (< 10) để dễ test và maintain.
            - paragraph [ref=f81e5288]:
              - text: "Liên quan:"
              - link "static analysis" [ref=f81e5289] [cursor=pointer]:
                - /url: "#static-analysis"
              - text: ","
              - link "test coverage (line vs branch)" [ref=f81e5290] [cursor=pointer]:
                - /url: "#test-coverage-line-vs-branch"
              - text: ","
              - link "technical debt" [ref=f81e5291] [cursor=pointer]:
                - /url: "#technical-debt"
          - article [ref=f81e5292]:
            - heading "dead code" [level=4] [ref=f81e5293]
            - paragraph [ref=f81e5294]: "còn gọi: unused code"
            - paragraph [ref=f81e5295]:
              - generic [ref=f81e5296]: Vấn đề
              - text: Code không còn dùng vẫn tồn tại → gây nhầm lẫn, tăng độ phức tạp, khó bảo trì, tiềm ẩn rủi ro bảo mật.
            - paragraph [ref=f81e5297]:
              - generic [ref=f81e5298]: Nguồn gốc
              - text: Compiler/linting practice
            - paragraph [ref=f81e5299]:
              - generic [ref=f81e5300]: Giải pháp
              - text: Xác định và xóa code không gọi đến, không khả thi. Cần cẩn trọng với feature flag hoặc dynamic call.
            - paragraph [ref=f81e5301]:
              - text: "Liên quan:"
              - link "technical debt" [ref=f81e5302] [cursor=pointer]:
                - /url: "#technical-debt"
              - text: ","
              - link "static analysis" [ref=f81e5303] [cursor=pointer]:
                - /url: "#static-analysis"
              - text: ","
              - link "lint" [ref=f81e5304] [cursor=pointer]:
                - /url: "#lint"
          - article [ref=f81e5305]:
            - heading "deterministic test" [level=4] [ref=f81e5306]
            - paragraph [ref=f81e5307]: "còn gọi: deterministic"
            - paragraph [ref=f81e5308]:
              - generic [ref=f81e5309]: Vấn đề
              - text: Kết quả test phụ thuộc thời gian, random, order → flaky, không tin cậy.
            - paragraph [ref=f81e5310]:
              - generic [ref=f81e5311]: Nguồn gốc
              - text: Test design principles
            - paragraph [ref=f81e5312]:
              - generic [ref=f81e5313]: Giải pháp
              - text: "Loại bỏ non-determinism: cố định time, seed random, không dùng wall clock, đảm bảo order-independent."
            - paragraph [ref=f81e5314]:
              - text: "Liên quan:"
              - link "flaky test" [ref=f81e5315] [cursor=pointer]:
                - /url: "#flaky-test"
              - text: ","
              - link "test isolation" [ref=f81e5316] [cursor=pointer]:
                - /url: "#test-isolation"
              - text: ","
              - link "hermetic test" [ref=f81e5317] [cursor=pointer]:
                - /url: "#hermetic-test"
          - article [ref=f81e5318]:
            - heading "Example-based testing" [level=4] [ref=f81e5319]
            - paragraph [ref=f81e5320]:
              - generic [ref=f81e5321]: Vấn đề
              - text: "Cần phân biệt với property-based testing: cách viết test truyền thống dựa trên ví dụ cố định."
            - paragraph [ref=f81e5322]:
              - generic [ref=f81e5323]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e5324]:
              - generic [ref=f81e5325]: Giải pháp
              - text: Viết test với input và output cụ thể (vd. assert add(2,3) == 5) thay vì định nghĩa tính chất tổng quát.
            - paragraph [ref=f81e5326]:
              - text: "Liên quan:"
              - link "property-based test" [ref=f81e5327] [cursor=pointer]:
                - /url: "#property-based-test"
          - article [ref=f81e5328]:
            - heading "feature flag testing" [level=4] [ref=f81e5329]
            - paragraph [ref=f81e5330]: "còn gọi: feature toggle testing, feature flag"
            - paragraph [ref=f81e5331]:
              - generic [ref=f81e5332]: Vấn đề
              - text: Muốn release feature dần, test trên production-like mà không expose toàn bộ user. Cần kiểm soát bật/tắt an toàn.
            - paragraph [ref=f81e5333]:
              - generic [ref=f81e5334]: Nguồn gốc
              - text: Martin Fowler (Feature Toggles)
            - paragraph [ref=f81e5335]:
              - generic [ref=f81e5336]: Giải pháp
              - text: Dùng flag để bật/tắt feature. Test cả nhánh on/off, đảm bảo backward compatible khi tắt flag.
            - paragraph [ref=f81e5337]:
              - text: "Liên quan:"
              - link "canary analysis" [ref=f81e5338] [cursor=pointer]:
                - /url: "#canary-analysis"
              - text: ","
              - link "A/B test" [ref=f81e5339] [cursor=pointer]:
                - /url: "#a-b-test"
              - text: ","
              - link "regression test" [ref=f81e5340] [cursor=pointer]:
                - /url: "#regression-test"
          - article [ref=f81e5341]:
            - heading "flaky test" [level=4] [ref=f81e5342]
            - paragraph [ref=f81e5343]: "còn gọi: flaky, non-deterministic test"
            - paragraph [ref=f81e5344]:
              - generic [ref=f81e5345]: Vấn đề
              - text: Test đôi khi pass, đôi khi fail trên cùng code. Gây mất niềm tin vào CI, team dễ bỏ qua fail thật.
            - paragraph [ref=f81e5346]:
              - generic [ref=f81e5347]: Nguồn gốc
              - text: Google Testing Blog (flakiness research)
            - paragraph [ref=f81e5348]:
              - generic [ref=f81e5349]: Giải pháp
              - text: "Xác định nguyên nhân: race condition, timeouts, shared state, order dependency. Cần làm test deterministic (test isolation)."
            - paragraph [ref=f81e5350]:
