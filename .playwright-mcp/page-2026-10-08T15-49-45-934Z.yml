                - /url: "#capacity-planning"
          - article [ref=f81e1746]:
            - heading "Thundering Herd" [level=4] [ref=f81e1747]
            - paragraph [ref=f81e1748]: "còn gọi: đàn thú, thundering herd problem, wake-up storm"
            - paragraph [ref=f81e1749]:
              - generic [ref=f81e1750]: Vấn đề
              - text: Nhiều process cùng thức dậy cho cùng 1 sự kiện, chỉ 1 thắng, còn lại tốn CPU rồi ngủ lại.
            - paragraph [ref=f81e1751]:
              - generic [ref=f81e1752]: Nguồn gốc
              - text: Wikipedia trích nguồn sớm nhất là Jargon File (bản 4.4.7) — gốc slang hacker; Linux thêm EPOLLEXCLUSIVE (kernel 4.5).
            - paragraph [ref=f81e1753]:
              - generic [ref=f81e1754]: Giải pháp
              - text: "Giải pháp: random hóa thời điểm đánh thức (jitter), single-flight/gọi trước (1 coroutine fetch, còn lại đợi), EPOLLEXCLUSIVE, Windows I/O completion port chỉ đánh thức 1 thread."
