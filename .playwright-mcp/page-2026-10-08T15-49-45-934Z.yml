          - article [ref=f81e3240]:
            - heading "Replication (master-slave / read replica)" [level=4] [ref=f81e3241]
            - paragraph [ref=f81e3242]: "còn gọi: sao chép dữ liệu, master-slave, primary-replica, read replica"
            - paragraph [ref=f81e3243]:
              - generic [ref=f81e3244]: Vấn đề
              - text: "Một node DB gánh hết read+write thì giới hạn cứng: đọc nhiều (báo cáo, feed) làm chậm luồng ghi; node chết là toàn hệ thống dừng, không có bản sao nào để chuyển sang."
            - paragraph [ref=f81e3245]:
              - generic [ref=f81e3246]: Nguồn gốc
              - text: Không rõ tác giả — có trong các hệ DB thương mại thập niên 1980-90 (Oracle Data Guard, SQL Server mirroring...)
            - paragraph [ref=f81e3247]:
              - generic [ref=f81e3248]: Giải pháp
              - text: "Master nhận ghi, đồng bộ sang nhiều slave; client đọc từ replica (giảm tải master) và failover khi master chết. Đánh đổi: replication lag (replica trễ), failover cần promote slave, dữ liệu có thể mất trước khi kịp đồng bộ."
            - paragraph [ref=f81e3249]:
              - text: "Liên quan:"
              - link "Multi-master replication" [ref=f81e3250] [cursor=pointer]:
                - /url: "#multi-master-replication"
              - text: ","
              - link "Split brain" [ref=f81e3251] [cursor=pointer]:
                - /url: "#split-brain"
              - text: ","
              - link "CAP theorem" [ref=f81e3252] [cursor=pointer]:
                - /url: "#cap-theorem"
          - article [ref=f81e3253]:
            - heading "Replication (sync/async)" [level=4] [ref=f81e3254]
            - paragraph [ref=f81e3255]: "còn gọi: sao chép dữ liệu, primary-replica"
            - paragraph [ref=f81e3256]:
              - generic [ref=f81e3257]: Vấn đề
              - text: Một node đơn điểm vừa không chịu nổi tải, vừa mất dữ liệu khi hỏng.
            - paragraph [ref=f81e3258]:
              - generic [ref=f81e3259]: Giải pháp
              - text: Sync chờ ít nhất một bản sao nhận nên an toàn hơn nhưng chậm; async trả lời ngay, có nguy cơ mất ghi khi primary chết.
            - paragraph [ref=f81e3260]:
              - text: "Liên quan:"
              - link "Failover" [ref=f81e3261] [cursor=pointer]:
                - /url: "#failover"
              - text: ","
              - link "Split brain" [ref=f81e3262] [cursor=pointer]:
                - /url: "#split-brain"
              - text: ","
              - link "Sharding" [ref=f81e3263] [cursor=pointer]:
                - /url: "#sharding"
          - article [ref=f81e3264]:
            - heading "Row lock vs Table lock" [level=4] [ref=f81e3265]
            - paragraph [ref=f81e3266]: "còn gọi: khóa hàng, khóa bảng"
            - paragraph [ref=f81e3267]:
              - generic [ref=f81e3268]: Vấn đề
              - text: Cần chặn ghi trùng; khóa càng rộng càng ít xung đột nhưng càng kém đồng thời.
            - paragraph [ref=f81e3269]:
              - generic [ref=f81e3270]: Giải pháp
              - text: Row lock chỉ chặn dòng liên quan, đồng thời cao nhưng dễ deadlock; table lock đơn giản nhưng chặn cả bảng.
            - paragraph [ref=f81e3271]:
              - text: "Liên quan:"
              - link "Two-phase locking (2PL)" [ref=f81e3272] [cursor=pointer]:
                - /url: "#two-phase-locking-2pl"
              - text: ","
              - link "Deadlock detection" [ref=f81e3273] [cursor=pointer]:
                - /url: "#deadlock-detection"
              - text: ","
              - link "Transaction" [ref=f81e3274] [cursor=pointer]:
                - /url: "#transaction"
          - article [ref=f81e3275]:
            - heading "Schema migration" [level=4] [ref=f81e3276]
            - paragraph [ref=f81e3277]: "còn gọi: migration"
            - paragraph [ref=f81e3278]:
              - generic [ref=f81e3279]: Vấn đề
              - text: Schema thay đổi theo thời gian nhưng dữ liệu production đang chạy, không thể dừng hệ thống.
            - paragraph [ref=f81e3280]:
              - generic [ref=f81e3281]: Giải pháp
              - text: Mỗi thay đổi là script version hóa, chạy dần trên môi trường thật, có thể review và rollback.
            - paragraph [ref=f81e3282]:
              - text: "Liên quan:"
              - link "Forward engineering" [ref=f81e3283] [cursor=pointer]:
                - /url: "#forward-engineering"
              - text: ","
              - link "Backward compatibility (schema)" [ref=f81e3284] [cursor=pointer]:
                - /url: "#backward-compatibility-schema"
          - article [ref=f81e3285]:
            - heading "WAL (Write-Ahead Log)" [level=4] [ref=f81e3286]
            - paragraph [ref=f81e3287]: "còn gọi: nhật ký ghi trước, redo log, transaction log, WAL (Write-Ahead Logging)"
            - paragraph [ref=f81e3288]:
              - generic [ref=f81e3289]: Vấn đề
              - text: Ghi trực tiếp data page vào disk rồi mất nguồn giữa chừng thì page có thể ghi dở (torn page) — DB không biết phần nào đã ghi, không thể khôi phục, dữ liệu hỏng vĩnh viễn. Ghi toàn bộ data page mỗi thao tác cũng quá chậm.
            - paragraph [ref=f81e3290]:
              - generic [ref=f81e3291]: Nguồn gốc
              - text: Không rõ người/năm đầu tiên; thuật toán ARIES (Mohan, Haderle, Lindsay, IBM, 1992) là chuẩn mực của họ WAL
            - paragraph [ref=f81e3292]:
              - generic [ref=f81e3293]: Giải pháp
              - text: Ghi thay đổi nhỏ vào log append-only TRƯỚC khi chạm data page; crash thì replay log (redo) hoặc undo thao tác chưa commit. Checkpoint định kỳ đổ log ra data file, page chỉ cần ghi nền.
            - paragraph [ref=f81e3294]:
              - text: "Liên quan:"
              - link "Transaction & ACID" [ref=f81e3295] [cursor=pointer]:
                - /url: "#transaction-acid"
