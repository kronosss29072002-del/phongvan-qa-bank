            - paragraph [ref=f81e2985]:
              - generic [ref=f81e2986]: Giải pháp
              - text: Cây đa nhánh cân bằng với mọi lá cùng độ sâu; chèn xẻ nút để giữ cân bằng, tìm kiếm mất O(log n).
