          - article [ref=f81e6930]:
            - heading "Tail-based Sampling" [level=4] [ref=f81e6931]
            - paragraph [ref=f81e6932]: "còn gọi: tail_sampling"
            - paragraph [ref=f81e6933]:
              - generic [ref=f81e6934]: Vấn đề
              - text: Head sampling không thể ưu tiên trace quan trọng (có lỗi, latency cao, thuộc service mới...).
            - paragraph [ref=f81e6935]:
              - generic [ref=f81e6936]: Nguồn gốc
              - text: OpenTelemetry Concepts - Sampling
            - paragraph [ref=f81e6937]:
              - generic [ref=f81e6938]: Giải pháp
              - text: "Quyết định sau khi thu thập hầu hết span trong trace (hoặc xem xét toàn trace). Cho phép rule phức tạp (luôn sample trace có error, dựa trên p95/attributes...). Trade-off: phức tạp hơn, cần buffer."
            - paragraph [ref=f81e6939]:
              - text: "Liên quan:"
              - link "sampling" [ref=f81e6940] [cursor=pointer]:
