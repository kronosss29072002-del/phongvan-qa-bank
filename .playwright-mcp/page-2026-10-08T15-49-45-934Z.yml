            - paragraph [ref=f81e3126]: "còn gọi: mức cô lập, mức cách ly, Read Committed, Repeatable Read, Serializable, dirty read, non-repeatable read, phantom read"
            - paragraph [ref=f81e3127]:
              - generic [ref=f81e3128]: Vấn đề
              - text: Cô lập hoàn toàn giữa các transaction làm chậm hệ thống, nên cần nới lường có kiểm soát.
            - paragraph [ref=f81e3129]:
