                - /url: "#stub"
          - article [ref=f81e2094]:
            - heading "fixture" [level=4] [ref=f81e2095]
            - paragraph [ref=f81e2096]: "còn gọi: test fixture, setup/teardown"
            - paragraph [ref=f81e2097]:
              - generic [ref=f81e2098]: Vấn đề
              - text: Nhiều test cần cùng dữ liệu/state khởi tạo, nếu lặp lại code thì khó maintain và dễ sai lệch.
            - paragraph [ref=f81e2099]:
              - generic [ref=f81e2100]: Nguồn gốc
              - text: xUnit terminology
            - paragraph [ref=f81e2101]:
              - generic [ref=f81e2102]: Giải pháp
              - text: Tập trung khởi tạo state dùng chung (hoặc per-test) trong beforeEach/afterEach hoặc factory để tránh trùng lặp.
            - paragraph [ref=f81e2103]:
