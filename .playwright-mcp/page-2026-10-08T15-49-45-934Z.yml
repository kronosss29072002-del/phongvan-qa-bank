          - article [ref=f81e2293]:
            - heading "type check" [level=4] [ref=f81e2294]
            - paragraph [ref=f81e2295]: "còn gọi: type checking, static typing"
            - paragraph [ref=f81e2296]:
              - generic [ref=f81e2297]: Vấn đề
              - text: Lỗi kiểu dữ liệu (string truyền nhầm number) chỉ phát hiện runtime, gây bug khó debug sau deploy.
            - paragraph [ref=f81e2298]:
              - generic [ref=f81e2299]: Nguồn gốc
              - text: Type theory (Milner) applied to PLs
            - paragraph [ref=f81e2300]:
              - generic [ref=f81e2301]: Giải pháp
              - text: Kiểm tra kiểu tại compile-time (TS, flow) để bắt lỗi trước khi chạy, cải thiện refactor an toàn.
            - paragraph [ref=f81e2302]:
