        - generic [ref=f81e6722]:
          - heading "Độ tin cậy & Quan sát được 21" [level=3] [ref=f81e6723]:
            - text: Độ tin cậy & Quan sát được
            - generic [ref=f81e6724]: "21"
          - article [ref=f81e6725]:
            - heading "Anomaly Detection" [level=4] [ref=f81e6726]
            - paragraph [ref=f81e6727]: "còn gọi: anomaly_detection"
            - paragraph [ref=f81e6728]:
              - generic [ref=f81e6729]: Vấn đề
              - text: Threshold tĩnh khó bắt biến đổi phức tạp (seasonality, traffic spike hợp lý) dẫn đến false positive/negative.
            - paragraph [ref=f81e6730]:
              - generic [ref=f81e6731]: Nguồn gốc
              - text: Google SRE Book - Chapter 6 (Monitoring Distributed Systems)
            - paragraph [ref=f81e6732]:
              - generic [ref=f81e6733]: Giải pháp
              - text: Phát hiện bất thường dựa trên pattern (statistical/time-series) thay vì threshold cứng. Kết hợp với alert on symptoms, dashboard, tránh dựa hoàn toàn vào ML phức tạp không giải thích được.
            - paragraph [ref=f81e6734]: "Liên quan: alert_fatigue, four_golden_signals, burn_rate"
          - article [ref=f81e6735]:
            - heading "Burn Rate" [level=4] [ref=f81e6736]
            - paragraph [ref=f81e6737]: "còn gọi: burn_rate"
            - paragraph [ref=f81e6738]:
              - generic [ref=f81e6739]: Vấn đề
              - text: Cần phát hiện sớm việc tiêu hao error budget dù window lớn (30 ngày) mà không làm nhiễu alert.
            - paragraph [ref=f81e6740]:
              - generic [ref=f81e6741]: Nguồn gốc
              - text: Google SRE Workbook - Alerting on SLOs
            - paragraph [ref=f81e6742]:
              - generic [ref=f81e6743]: Giải pháp
              - text: Burn rate là tốc độ tiêu hao error budget so với SLO (1.0 = tiêu đúng theo kế hoạch đến hết window). Dùng multi-window (ví dụ 1h/6h) để cân bằng giữa detection time và precision.
            - paragraph [ref=f81e6744]:
              - text: "Liên quan: error_budget,"
              - link "SLO" [ref=f81e6745] [cursor=pointer]:
                - /url: "#slo"
              - text: ", alert_fatigue"
          - article [ref=f81e6746]:
            - heading "Burn rate & multiwindow multi-burn-rate alerting" [level=4] [ref=f81e6747]
            - paragraph [ref=f81e6748]: "còn gọi: burn rate, alert đa cửa sổ, fast burn/slow burn"
            - paragraph [ref=f81e6749]:
              - generic [ref=f81e6750]: Vấn đề
              - text: Alert 'error rate > 0.1%' thì quá nhạy — spike vài phút cũng page, on-call thức dậy vì việc hết lỗi ngay; còn alert theo SLO 30 ngày thì quá chậm, phát hiện xong thì error budget đã cạn. Window ngắn thì sau khi recovery alert vẫn kêu thêm hàng giờ (reset time kém).
            - paragraph [ref=f81e6751]:
              - generic [ref=f81e6752]: Nguồn gốc
              - text: Google SRE Workbook, chương 5 'Alerting on SLOs' (2018)
            - paragraph [ref=f81e6753]:
              - generic [ref=f81e6754]: Giải pháp
              - text: "Đo tốc độ tiêu error budget (burn rate), kết hợp nhiều cửa sổ: 1h/5m ở burn 14.4 + 6h/30m ở burn 6 để bắt cháy nhanh; cửa sổ ngắn xác nhận đang cháy nên tắt alert ~5 phút sau khi hết lỗi. Burn rate 1 = tiêu hết budget đúng bằng kỳ SLO."
            - paragraph [ref=f81e6755]:
              - text: "Liên quan:"
              - link "Error budget" [ref=f81e6756] [cursor=pointer]:
                - /url: "#error-budget"
              - text: ","
              - link "SLI / SLO" [ref=f81e6757] [cursor=pointer]:
                - /url: "#sli-slo"
              - text: ","
              - link "Alert fatigue" [ref=f81e6758] [cursor=pointer]:
                - /url: "#alert-fatigue"
          - article [ref=f81e6759]:
            - heading "Cardinality Explosion" [level=4] [ref=f81e6760]
            - paragraph [ref=f81e6761]: "còn gọi: cardinality_explosion, high_cardinality"
            - paragraph [ref=f81e6762]:
              - generic [ref=f81e6763]: Vấn đề
              - text: Dùng label có cardinality cao (user_id, request_id, email...) tạo ra số lượng time series khổng lồ, làm tăng chi phí lưu trữ/queries.
            - paragraph [ref=f81e6764]:
              - generic [ref=f81e6765]: Nguồn gốc
              - text: Prometheus Best Practices - Metric and Label Naming
            - paragraph [ref=f81e6766]:
              - generic [ref=f81e6767]: Giải pháp
              - text: Mỗi tổ hợp (metric_name + label key-values) là 1 time series. Tránh label unbounded; ưu tiên label có số giá trị hữu hạn, ổn định. Giám sát cardinality.
            - paragraph [ref=f81e6768]:
              - text: "Liên quan: metrics, time_series,"
              - link "sampling" [ref=f81e6769] [cursor=pointer]:
                - /url: "#sampling"
          - article [ref=f81e6770]:
            - heading "Cascading Failures" [level=4] [ref=f81e6771]
            - paragraph [ref=f81e6772]: "còn gọi: cascading_failure, cascade"
            - paragraph [ref=f81e6773]:
              - generic [ref=f81e6774]: Vấn đề
              - text: Lỗi tại 1 điểm có thể lan truyền nhanh qua chain dependencies gây outage toàn hệ thống.
            - paragraph [ref=f81e6775]:
              - generic [ref=f81e6776]: Nguồn gốc
              - text: Google SRE Book - Chapter 22 (Addressing Cascading Failures)
            - paragraph [ref=f81e6777]:
              - generic [ref=f81e6778]: Giải pháp
              - text: "Nguyên nhân thường gặp: retry storm, missed deadlines, CPU/memory exhaustion, GC vicious cycle. Giảm thiểu bằng backpressure, timeouts hợp lý, circuit breaker, load shedding, retry budget."
            - paragraph [ref=f81e6779]: "Liên quan: circuit_breaker, retry_budget, retry_storm"
          - article [ref=f81e6780]:
            - heading "Chaos Engineering" [level=4] [ref=f81e6781]
            - paragraph [ref=f81e6782]: "còn gọi: chaos_engineering, kỹ thuật hỗn loạn, chaos experiments"
            - paragraph [ref=f81e6783]:
              - generic [ref=f81e6784]: Vấn đề
              - text: Hệ thống phân tán phức tạp có lỗi tương tác khó lường trước, cần kiểm chứng bằng thực nghiệm.
            - paragraph [ref=f81e6785]:
              - generic [ref=f81e6786]: Nguồn gốc
              - text: Principles of Chaos Engineering (Netflix, 2017+; updated 2019)
            - paragraph [ref=f81e6787]:
              - generic [ref=f81e6788]: Giải pháp
              - text: "Thực hiện experiment có kiểm soát: xác định steady state -> giả thuyết steady state tiếp tục -> inject biến số phản ánh real-world (crash, network partition, latency) -> cố gắng bác bỏ giả thuyết để tìm weakness trước production."
            - paragraph [ref=f81e6789]:
              - text: "Liên quan: game_day, blast_radius, fault_injection,"
              - link "Fault Injection" [ref=f81e6790] [cursor=pointer]:
                - /url: "#fault-injection"
              - text: ","
              - link "Error Budget" [ref=f81e6791] [cursor=pointer]:
                - /url: "#error-budget"
              - text: ","
              - link "Graceful Degradation" [ref=f81e6792] [cursor=pointer]:
                - /url: "#graceful-degradation"
          - article [ref=f81e6793]:
            - heading "Circuit Breaker" [level=4] [ref=f81e6794]
            - paragraph [ref=f81e6795]: "còn gọi: circuit_breaker, circuit_breaking, ngắt mạch, circuit breaker pattern"
            - paragraph [ref=f81e6796]:
              - generic [ref=f81e6797]: Vấn đề
              - text: Lỗi phụ thuộc lan truyền (cascading) khi upstream chậm/trả lỗi liên tục gây cạn tài nguyên.
            - paragraph [ref=f81e6798]:
              - generic [ref=f81e6799]: Nguồn gốc
              - text: Michael T. Nygard - Release It!; Martin Fowler (Bliki) - CircuitBreaker, 2014-03-06
            - paragraph [ref=f81e6800]:
              - generic [ref=f81e6801]: Giải pháp
              - text: Bao bọc remote call bằng state machine (Closed/Open/Half-Open). Khi thất bại đạt ngưỡng -> mở mạch (trả lỗi ngay, không gọi upstream). Sau timeout thử lại Half-Open để phục hồi an toàn.
            - paragraph [ref=f81e6802]:
              - text: "Liên quan: cascading_failures, retry_budget,"
              - link "timeout" [ref=f81e6803] [cursor=pointer]:
                - /url: "#timeout"
              - text: ","
              - link "Bulkhead" [ref=f81e6804] [cursor=pointer]:
                - /url: "#bulkhead"
              - text: ","
              - link "Timeout" [ref=f81e6805] [cursor=pointer]:
                - /url: "#timeout"
              - text: ","
              - link "Fallback" [ref=f81e6806] [cursor=pointer]:
                - /url: "#fallback"
              - text: ","
              - link "Graceful Degradation" [ref=f81e6807] [cursor=pointer]:
                - /url: "#graceful-degradation"
          - article [ref=f81e6808]:
            - heading "Exemplars" [level=4] [ref=f81e6809]
            - paragraph [ref=f81e6810]: "còn gọi: exemplar, mẫu chứng, metric gắn trace"
            - paragraph [ref=f81e6811]:
              - generic [ref=f81e6812]: Vấn đề
              - text: Histogram/metric tổng hợp mất chi tiết trace cụ thể của outlier (p99/p999).
            - paragraph [ref=f81e6813]:
              - generic [ref=f81e6814]: Nguồn gốc
              - text: Grafana/OpenTelemetry - Exemplars concept
            - paragraph [ref=f81e6815]:
              - generic [ref=f81e6816]: Giải pháp
              - text: Exemplar là trace representative của một measurement trong interval, liên kết điểm metric (bucket/value) với 1 trace cụ thể để drill-down từ dashboard metric sang trace.
            - paragraph [ref=f81e6817]:
              - text: "Liên quan: histogram,"
              - link "trace" [ref=f81e6818] [cursor=pointer]:
                - /url: "#trace"
              - text: ", metrics,"
              - link "Distributed tracing" [ref=f81e6819] [cursor=pointer]:
                - /url: "#distributed-tracing"
              - text: ", Prometheus scrape model,"
              - link "Observability" [ref=f81e6820] [cursor=pointer]:
                - /url: "#observability"
          - article [ref=f81e6821]:
            - heading "Head-based Sampling" [level=4] [ref=f81e6822]
            - paragraph [ref=f81e6823]: "còn gọi: head_sampling"
            - paragraph [ref=f81e6824]:
              - generic [ref=f81e6825]: Vấn đề
              - text: Cần giảm volume telemetry sớm mà vẫn có tính đại diện, đặc biệt ở throughput cao.
            - paragraph [ref=f81e6826]:
              - generic [ref=f81e6827]: Nguồn gốc
              - text: OpenTelemetry Concepts - Sampling
            - paragraph [ref=f81e6828]:
              - generic [ref=f81e6829]: Giải pháp
              - text: Quyết định sample/drop ngay khi tạo span (trước khi biết toàn bộ trace). Thường dùng Consistent Probability Sampling. Tiết kiệm tài nguyên, nhưng khó chọn dựa trên kết quả toàn trace.
            - paragraph [ref=f81e6830]:
              - text: "Liên quan:"
              - link "sampling" [ref=f81e6831] [cursor=pointer]:
                - /url: "#sampling"
              - text: ", tail_based_sampling,"
              - link "OpenTelemetry" [ref=f81e6832] [cursor=pointer]:
                - /url: "#opentelemetry"
          - article [ref=f81e6833]:
            - heading "Head-based vs tail-based sampling" [level=4] [ref=f81e6834]
            - paragraph [ref=f81e6835]: "còn gọi: lấy mẫu trace, trace sampling, tail sampling"
            - paragraph [ref=f81e6836]:
              - generic [ref=f81e6837]: Vấn đề
              - text: Ghi full trace ở 10k req/s làm chi phí lưu trữ và băng thông phình (nhiều backend tính tiền theo GB), nhưng sampling mù 1% đầu thì incident hiếm (lỗi 0.01%) lại chính là thứ bị loại bỏ — không có dữ liệu để điều tra.
            - paragraph [ref=f81e6838]:
              - generic [ref=f81e6839]: Nguồn gốc
              - text: không rõ (tài liệu OpenTelemetry mô tả chi tiết)
            - paragraph [ref=f81e6840]:
              - generic [ref=f81e6841]: Giải pháp
              - text: "Head-based: quyết định ngay lúc bắt đầu theo % trace ID (đơn giản, rẻ, nhưng không biết trace có lỗi hay không); tail-based: quyết định sau khi xem đủ span của trace → luôn giữ trace lỗi/chậm, đổi lại cần component trạng thái phức tạp và tốn tài nguyên. Hệ thống lớn thường kết hợp cả hai."
            - paragraph [ref=f81e6842]:
              - text: "Liên quan:"
              - link "Distributed tracing" [ref=f81e6843] [cursor=pointer]:
                - /url: "#distributed-tracing"
              - text: ","
              - link "OpenTelemetry" [ref=f81e6844] [cursor=pointer]:
                - /url: "#opentelemetry"
              - text: ","
              - link "Exemplars" [ref=f81e6845] [cursor=pointer]:
                - /url: "#exemplars"
          - article [ref=f81e6846]:
            - heading "Log sampling & rate limiting" [level=4] [ref=f81e6847]
            - paragraph [ref=f81e6848]: "còn gọi: log sampling, rate limit log, giới hạn tần suất log"
            - paragraph [ref=f81e6849]:
              - generic [ref=f81e6850]: Vấn đề
              - text: "Black Friday traffic ×100 kéo log ×100: full-text index không chịu nổi hoặc chi phí ingest phình đột biến, thậm chí log pipeline tự sập đúng lúc cần nó nhất; nhưng bỏ hết log thì mất dấu vết điều tra."
            - paragraph [ref=f81e6851]:
              - generic [ref=f81e6852]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e6853]:
              - generic [ref=f81e6854]: Giải pháp
              - text: Giữ 100% log mức ERROR/event bất thường, sampling log happy-path (VD 1/100 hoặc 1 dòng/giây/stream), rate limit theo label; ưu tiên giữ cái bất thường, loại cái dự đoán được.
            - paragraph [ref=f81e6855]:
              - text: "Liên quan:"
              - link "Log aggregation & ELK Stack" [ref=f81e6856] [cursor=pointer]:
                - /url: "#log-aggregation-elk-stack"
              - text: ", Loki,"
              - link "Metric cardinality" [ref=f81e6857] [cursor=pointer]:
                - /url: "#metric-cardinality"
          - article [ref=f81e6858]:
            - heading "Metrics, Logs, Traces Correlation" [level=4] [ref=f81e6859]
            - paragraph [ref=f81e6860]: "còn gọi: signals_correlation, telemetry_correlation"
            - paragraph [ref=f81e6861]:
              - generic [ref=f81e6862]: Vấn đề
              - text: Các signal riêng rẽ (metrics/logs/traces) khó kết nối để gỡ lỗi nhanh xuyên service.
            - paragraph [ref=f81e6863]:
              - generic [ref=f81e6864]: Nguồn gốc
              - text: OpenTelemetry Project - Context Propagation
            - paragraph [ref=f81e6865]:
              - generic [ref=f81e6866]: Giải pháp
              - text: "Context propagation (traceparent) cho phép liên kết: trace+span ID có thể inject vào log records, exemplars liên kết metric buckets với trace representative, giúp chuyển từ symptom (metric) -> trace -> logs nhanh hơn."
            - paragraph [ref=f81e6867]:
              - text: "Liên quan:"
              - link "OpenTelemetry" [ref=f81e6868] [cursor=pointer]:
                - /url: "#opentelemetry"
              - text: ","
              - link "traceparent" [ref=f81e6869] [cursor=pointer]:
                - /url: "#traceparent"
              - text: ","
              - link "exemplars" [ref=f81e6870] [cursor=pointer]:
                - /url: "#exemplars"
          - article [ref=f81e6871]:
            - heading "Multi-Region / Active-Active" [level=4] [ref=f81e6872]
            - paragraph [ref=f81e6873]: "còn gọi: active_active, multi_region, multi_site"
            - paragraph [ref=f81e6874]:
              - generic [ref=f81e6875]: Vấn đề
              - text: Cần RPO/RTO gần 0 cho workload mission-critical, chấp nhận chi phí cao hơn.
            - paragraph [ref=f81e6876]:
              - generic [ref=f81e6877]: Nguồn gốc
              - text: AWS Disaster Recovery Options (Well-Architected/Whitepapers)
            - paragraph [ref=f81e6878]:
              - generic [ref=f81e6879]: Giải pháp
              - text: Toàn bộ môi trường chạy đồng thời ở nhiều region, traffic phân bố (active-active). Gần zero RPO/RTO, phức tạp về consistency/split-brain cần xử lý cẩn thận.
            - paragraph [ref=f81e6880]:
              - text: "Liên quan: warm_standby,"
              - link "RPO" [ref=f81e6881] [cursor=pointer]:
                - /url: "#rpo"
              - text: ","
              - link "RTO" [ref=f81e6882] [cursor=pointer]:
                - /url: "#rto"
              - text: ", split_brain"
          - article [ref=f81e6883]:
            - heading "Normalize Load" [level=4] [ref=f81e6884]
            - paragraph [ref=f81e6885]: "còn gọi: load_normalization, return_excess_requests"
            - paragraph [ref=f81e6886]:
              - generic [ref=f81e6887]: Vấn đề
              - text: Khi backend overload, client retry không kiểm soát làm tăng tải nhanh (retry storm).
            - paragraph [ref=f81e6888]:
              - generic [ref=f81e6889]: Nguồn gốc
              - text: Google SRE Book - Chapter 21 (Handling Overload)
            - paragraph [ref=f81e6890]:
              - generic [ref=f81e6891]: Giải pháp
              - text: Trả lỗi overload sớm, client xử lý backpressure (retry có budget), tránh retry đồng loạt. Mục tiêu 'shed load gracefully' thay vì để hệ thống sụp đổ cascading.
            - paragraph [ref=f81e6892]: "Liên quan: retry_budget, circuit_breaker, overload"
          - article [ref=f81e6893]:
            - heading "OpenTelemetry Collector / observability pipeline" [level=4] [ref=f81e6894]
            - paragraph [ref=f81e6895]: "còn gọi: OTel Collector, telemetry gateway, observability pipeline"
            - paragraph [ref=f81e6896]:
              - generic [ref=f81e6897]: Vấn đề
              - text: Để app push thẳng vào từng backend thì đổi backend phải sửa hàng trăm service, mỗi app tự lo retry/batch; spike traffic metric/log đè thẳng vào backend khiến observability stack sập cùng lúc hệ thống đang có sự cố.
            - paragraph [ref=f81e6898]:
              - generic [ref=f81e6899]: Nguồn gốc
              - text: OpenTelemetry (CNCF) — thành phần Collector
            - paragraph [ref=f81e6900]:
              - generic [ref=f81e6901]: Giải pháp
              - text: Đặt agent/gateway tập trung nhận OTLP (push), xử lý batch/filter/redact/enrich/sampling ở giữa pipeline rồi fan-out sang nhiều backend; app chỉ biết một endpoint, backend thay bằng cách đổi config gateway.
            - paragraph [ref=f81e6902]:
              - text: "Liên quan:"
              - link "OpenTelemetry (OTel)" [ref=f81e6903] [cursor=pointer]:
                - /url: "#opentelemetry-otel"
              - text: ","
              - link "Metric cardinality" [ref=f81e6904] [cursor=pointer]:
                - /url: "#metric-cardinality"
              - text: ", Log sampling"
          - article [ref=f81e6905]:
            - heading "Pilot Light" [level=4] [ref=f81e6906]
            - paragraph [ref=f81e6907]: "còn gọi: pilot_light"
            - paragraph [ref=f81e6908]:
              - generic [ref=f81e6909]: Vấn đề
              - text: Cần DR với chi phí hợp lý nhưng vẫn có khả năng phục hồi nhanh (không chỉ backup thuần túy).
            - paragraph [ref=f81e6910]:
              - generic [ref=f81e6911]: Nguồn gốc
              - text: AWS Disaster Recovery Options (Well-Architected/Whitepapers)
            - paragraph [ref=f81e6912]:
              - generic [ref=f81e6913]: Giải pháp
              - text: Core infrastructure luôn chạy ở DR region (ví dụ DB/storage replication), application servers 'tắt' (hoặc không deployed) và được bật/quy mô lại khi failover. RPO/RTO trung bình (phút-giờ).
            - paragraph [ref=f81e6914]:
              - text: "Liên quan:"
              - link "RPO" [ref=f81e6915] [cursor=pointer]:
                - /url: "#rpo"
              - text: ","
              - link "RTO" [ref=f81e6916] [cursor=pointer]:
                - /url: "#rto"
              - text: ", warm_standby, disaster_recovery"
          - article [ref=f81e6917]:
            - heading "Retry Budget" [level=4] [ref=f81e6918]
            - paragraph [ref=f81e6919]: "còn gọi: retry_budget, ngân sách retry, retry ratio limit"
            - paragraph [ref=f81e6920]:
              - generic [ref=f81e6921]: Vấn đề
              - text: Retry không kiểm soát tạo ra retry storm, làm tăng tải và làm trầm trọng thêm tình trạng overload.
            - paragraph [ref=f81e6922]:
              - generic [ref=f81e6923]: Nguồn gốc
              - text: Google SRE Book - Chapter 21 (Handling Overload)
            - paragraph [ref=f81e6924]:
              - generic [ref=f81e6925]: Giải pháp
              - text: "Giới hạn retry: per-request retry budget (ví dụ tối đa 3 lần) và per-client retry budget (tỷ lệ retry < ngưỡng, ví dụ 10%). Ngăn tăng tải nhân đôi/bội số do retry khi cluster đang overload."
            - paragraph [ref=f81e6926]:
              - text: "Liên quan: circuit_breaker, retry_storm, overload,"
              - link "Exponential Backoff" [ref=f81e6927] [cursor=pointer]:
                - /url: "#exponential-backoff"
              - text: ","
              - link "Rate Limiting (Adaptive)" [ref=f81e6928] [cursor=pointer]:
