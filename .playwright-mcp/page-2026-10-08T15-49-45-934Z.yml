            - paragraph [ref=f81e6211]: "còn gọi: tính trước, precompute"
            - paragraph [ref=f81e6212]:
              - generic [ref=f81e6213]: Vấn đề
              - text: Dashboard phải aggregate hàng triệu dòng mỗi lần mở (top seller, feed score) — query 3-5 giây, user chờ không nổi, và mỗi request đều tính lại y hệt kết quả cho dữ liệu gần như không đổi.
