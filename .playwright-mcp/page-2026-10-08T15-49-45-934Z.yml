          - article [ref=f81e3093]:
            - heading "Failover" [level=4] [ref=f81e3094]
            - paragraph [ref=f81e3095]: "còn gọi: chuyển vai trò"
            - paragraph [ref=f81e3096]:
              - generic [ref=f81e3097]: Vấn đề
              - text: Primary chết thì hệ thống dừng nếu không có node thay thế sẵn sàng.
            - paragraph [ref=f81e3098]:
