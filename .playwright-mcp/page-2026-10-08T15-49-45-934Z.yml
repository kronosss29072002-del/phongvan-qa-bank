            - heading "Snapshot isolation" [level=4] [ref=f81e6085]
            - paragraph [ref=f81e6086]: "còn gọi: SI, cô lập snapshot"
            - paragraph [ref=f81e6087]:
              - generic [ref=f81e6088]: Vấn đề
              - text: Serializable quá mạnh làm chặn nhiều, còn Read Committed vẫn cho write skew.
            - paragraph [ref=f81e6089]:
              - generic [ref=f81e6090]: Nguồn gốc
              - text: Berenson, 1995
            - paragraph [ref=f81e6091]:
              - generic [ref=f81e6092]: Giải pháp
              - text: Transaction đọc theo snapshot đầu phiên; ghi trùng version còn sống bị abort, đầu tiên commit thắng.
            - paragraph [ref=f81e6093]:
