              - link "Retry" [ref=f81e1758] [cursor=pointer]:
                - /url: "#retry"
          - article [ref=f81e1759]:
            - heading "Timeout" [level=4] [ref=f81e1760]
            - paragraph [ref=f81e1761]: "còn gọi: hạn chờ, request timeout, connect timeout"
            - paragraph [ref=f81e1762]:
              - generic [ref=f81e1763]: Vấn đề
              - text: Không đặt hạn chờ thì một call treo vô hạn giữ thread và kết nối, request đến sau xếp hàng phía sau.
            - paragraph [ref=f81e1764]:
              - generic [ref=f81e1765]: Giải pháp
              - text: "Đặt giới hạn thời gian cho từng bước (connect, read, tổng request). Chọn giá trị từ độ trễ thật của downstream: AWS Builders Library gợi ý lấy percentile tương ứng mức false-timeout chấp nhận được (VD p99.9 cho tỷ lệ timeout oan 0.1%). Quá cao → lãng phí tài nguyên; quá thấp → retry storm."
