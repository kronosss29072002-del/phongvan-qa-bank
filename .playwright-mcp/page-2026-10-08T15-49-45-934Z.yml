              - text: Bản ghi chèn ngẫu nhiên không theo thứ tự nào nên cần cấu trúc lưu không phân cấp.
            - paragraph [ref=f81e3118]:
              - generic [ref=f81e3119]: Giải pháp
              - text: Danh sách trang không phân cấp chứa bản ghi thêm vào; không có index thì phải quét toàn bộ.
            - paragraph [ref=f81e3120]:
