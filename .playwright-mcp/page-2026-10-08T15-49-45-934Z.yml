        - generic [ref=f81e3301]:
          - heading "Caching & Hiệu năng 9" [level=3] [ref=f81e3302]:
            - text: Caching & Hiệu năng
            - generic [ref=f81e3303]: "9"
          - article [ref=f81e3304]:
            - heading "Batching" [level=4] [ref=f81e3305]
            - paragraph [ref=f81e3306]: "còn gọi: gộp lô, batch write/read"
            - paragraph [ref=f81e3307]:
              - generic [ref=f81e3308]: Vấn đề
              - text: Gửi 1000 message mỗi cái 1 round-trip (network hoặc disk seek) thì latency tích lũy nghìn ms — hệ thống I/O-bound, CPU chờ I/O gần như suốt ngày dù chưa bận thật.
            - paragraph [ref=f81e3309]:
              - generic [ref=f81e3310]: Nguồn gốc
              - text: không rõ (kỹ thuật kinh điển của I/O và network, có từ era mainframe)
            - paragraph [ref=f81e3311]:
              - generic [ref=f81e3312]: Giải pháp
              - text: Gộp nhiều thao tác nhỏ thành 1 lần I/O/1 query (bulk insert, batch API, message batch) — giảm số round-trip theo cấp số nhân, tăng throughput; đánh đổi là latency từng phần tử cao hơn và logic retry phức tạp hơn khi batch fail giữa chừng.
            - paragraph [ref=f81e3313]:
              - text: "Liên quan: Write-behind,"
              - link "Precomputation" [ref=f81e3314] [cursor=pointer]:
                - /url: "#precomputation"
              - text: ","
              - link "latency vs throughput" [ref=f81e3315] [cursor=pointer]:
                - /url: "#latency-vs-throughput"
              - text: ","
              - link "Backpressure" [ref=f81e3316] [cursor=pointer]:
                - /url: "#backpressure"
          - article [ref=f81e3317]:
            - heading "Benchmark" [level=4] [ref=f81e3318]
            - paragraph [ref=f81e3319]: "còn gọi: đo chuẩn, ép thử"
            - paragraph [ref=f81e3320]:
              - generic [ref=f81e3321]: Vấn đề
              - text: Tối ưu code hoặc đổi database mà không đo trước/sau thì chỉ là cảm tính — 'có vẻ nhanh hơn' thực tế có thể chậm hơn, hoặc regression âm thầm khi upgrade version không ai phát hiện.
            - paragraph [ref=f81e3322]:
              - generic [ref=f81e3323]: Nguồn gốc
              - text: không rõ (benchmark là thực hành lâu đời của khoa học máy tính; Node.js/microbenchmark culture phổ biến từ 2010s)
            - paragraph [ref=f81e3324]:
              - generic [ref=f81e3325]: Giải pháp
              - text: Chạy workload chuẩn hoá (wrk, sysbench, k6, JMH) với dữ liệu và cấu hình cố định, so sánh throughput/latency trước và sau — định lượng từng thay đổi, phát hiện regression; phải chạy ở môi trường tương đương production mới có giá trị.
            - paragraph [ref=f81e3326]:
              - text: "Liên quan: QPS,"
              - link "Profiling" [ref=f81e3327] [cursor=pointer]:
                - /url: "#profiling"
              - text: ","
              - link "Hot path" [ref=f81e3328] [cursor=pointer]:
                - /url: "#hot-path"
              - text: ","
              - link "Little's law" [ref=f81e3329] [cursor=pointer]:
                - /url: "#little-s-law"
          - article [ref=f81e3330]:
            - heading "Cache-aside (lazy loading)" [level=4] [ref=f81e3331]
            - paragraph [ref=f81e3332]: "còn gọi: đọc ghi qua cache, lazy loading cache"
            - paragraph [ref=f81e3333]:
              - generic [ref=f81e3334]: Vấn đề
              - text: App tự tô cache ngay cả cho dữ liệu ít người đọc thì lãng phí RAM; còn bỏ cache đi thì mỗi request lại đập thẳng vào database. Cần cách để cache tự nhiên chỉ chứa thứ thực sự được hỏi.
            - paragraph [ref=f81e3335]:
              - generic [ref=f81e3336]: Nguồn gốc
              - text: không rõ (phổ biến qua tài liệu AWS và paper Amazon Dynamo 2007 mô tả lazy loading)
            - paragraph [ref=f81e3337]:
              - generic [ref=f81e3338]: Giải pháp
              - text: "App tự quản lý cache: đọc thì check cache, miss thì đọc DB rồi ghi vào cache; ghi thì ghi DB rồi xóa (hoặc ghi lại) key cache — chỉ dữ liệu thật sự được truy cập mới vào cache, nhưng mỗi miss phát sinh thêm 1 truy vấn DB và cần xử lý invalidation thủ công."
            - paragraph [ref=f81e3339]:
              - text: "Liên quan:"
              - link "Cache" [ref=f81e3340] [cursor=pointer]:
                - /url: "#cache"
              - text: ","
              - link "Cache invalidation" [ref=f81e3341] [cursor=pointer]:
                - /url: "#cache-invalidation"
              - text: ","
              - link "Write-through" [ref=f81e3342] [cursor=pointer]:
                - /url: "#write-through"
              - text: ", Lazy loading"
          - article [ref=f81e3343]:
            - heading "Lazy loading (backend)" [level=4] [ref=f81e3344]
            - paragraph [ref=f81e3345]: "còn gọi: tải trì hoãn, load on demand"
            - paragraph [ref=f81e3346]:
              - generic [ref=f81e3347]: Vấn đề
              - text: Endpoint trả order nhưng eager-load luôn user, products, reviews, coupons... dù 90% response không cần — query N+1 hoặc join khổng lồ, mỗi request tốn hàng chục query cho dữ liệu không ai dùng.
            - paragraph [ref=f81e3348]:
              - generic [ref=f81e3349]: Nguồn gốc
              - text: không rõ (pattern thuộc quen thuộc của ORM/Hibernate và lazy initialization)
            - paragraph [ref=f81e3350]:
              - generic [ref=f81e3351]: Giải pháp
              - text: Chỉ load dữ liệu khi thật sự được truy cập (field resolver trì hoãn, virtual proxy, on-demand cache fill) — giảm chi phí khởi tạo và chỉ trả phần cần thiết; đổi lại code phức tạp hơn và có thể dồn query về cuối request (lazy load burst).
            - paragraph [ref=f81e3352]:
              - text: "Liên quan: Cache-aside,"
              - link "Batching" [ref=f81e3353] [cursor=pointer]:
                - /url: "#batching"
              - text: ", N+1 queries,"
              - link "Memoization" [ref=f81e3354] [cursor=pointer]:
                - /url: "#memoization"
          - article [ref=f81e3355]:
            - heading "Memcached" [level=4] [ref=f81e3356]
            - paragraph [ref=f81e3357]: "còn gọi: mem cache d"
            - paragraph [ref=f81e3358]:
              - generic [ref=f81e3359]: Vấn đề
              - text: "LiveJournal cuối những năm 1990-early 2000s: mỗi request trang nhật ký đọc nhiều row từ MySQL lặp lại y hệt — database chịu hàng nghìn query giống nhau/giây cho dữ liệu gần như tĩnh, CPU disk I/O trở thành bottleneck của toàn site."
            - paragraph [ref=f81e3360]:
              - generic [ref=f81e3361]: Nguồn gốc
              - text: Brad Fitzpatrick tạo cho LiveJournal, phát hành 22/5/2003; viết lại bằng C bởi Anatoly Vorobey
            - paragraph [ref=f81e3362]:
              - generic [ref=f81e3363]: Giải pháp
              - text: "Distributed key-value cache chạy hoàn toàn trong RAM với LRU eviction: app tra cache trước, miss mới quỳ database — đơn giản, slab allocator, không persist, không cấu trúc dữ liệu phức tạp."
            - paragraph [ref=f81e3364]:
              - text: "Liên quan:"
              - link "Redis" [ref=f81e3365] [cursor=pointer]:
                - /url: "#redis"
              - text: ","
              - link "In-memory cache" [ref=f81e3366] [cursor=pointer]:
                - /url: "#in-memory-cache"
              - text: ", Cache-aside,"
              - link "Connection pool" [ref=f81e3367] [cursor=pointer]:
                - /url: "#connection-pool"
          - article [ref=f81e3368]:
            - heading "QPS (Queries Per Second)" [level=4] [ref=f81e3369]
            - paragraph [ref=f81e3370]: "còn gọi: số truy vấn mỗi giây"
            - paragraph [ref=f81e3371]:
              - generic [ref=f81e3372]: Vấn đề
              - text: Không đo được 'hệ thống chịu bao nhiêu' thì không biết khi nào phải scale, không đặt được capacity plan, và mọi so sánh tối ưu đều cảm tính — deploy feature mới không biết có làm sập hệ thống không.
            - paragraph [ref=f81e3373]:
              - generic [ref=f81e3374]: Nguồn gốc
              - text: không rõ (metric vận hành chuẩn của ngành, phổ biến cùng era web scale)
            - paragraph [ref=f81e3375]:
              - generic [ref=f81e3376]: Giải pháp
              - text: "Đếm số request hoàn thành mỗi giây (thường kèm p95/p99 latency) làm đơn vị đo tải và capacity: QPS hiện tại × hệ số an toàn = số máy cần có; so QPS đỉnh với giới hạn của DB/connection pool để dự báo điểm nghẽp."
            - paragraph [ref=f81e3377]:
              - text: "Liên quan:"
              - link "Benchmark" [ref=f81e3378] [cursor=pointer]:
                - /url: "#benchmark"
              - text: ","
              - link "Little's law" [ref=f81e3379] [cursor=pointer]:
                - /url: "#little-s-law"
              - text: ","
              - link "latency vs throughput" [ref=f81e3380] [cursor=pointer]:
                - /url: "#latency-vs-throughput"
              - text: ","
              - link "Connection pool" [ref=f81e3381] [cursor=pointer]:
                - /url: "#connection-pool"
          - article [ref=f81e3382]:
            - heading "Redis" [level=4] [ref=f81e3383]
            - paragraph [ref=f81e3384]: "còn gọi: Remote Dictionary Server"
            - paragraph [ref=f81e3385]:
              - generic [ref=f81e3386]: Vấn đề
              - text: "Memcached chỉ lưu string thuần và không persist — startup của Salvatore Sanfilippo gặp khó khi scale các workload kiểu real-time (log analyzer) mà database quan hệ truyền thống xử lý không nổi: cần đọc/ghi cực nhanh nhưng vẫn phải có cấu trúc dữ liệu và không mất dữ liệu khi restart."
            - paragraph [ref=f81e3387]:
              - generic [ref=f81e3388]: Nguồn gốc
              - text: Salvatore Sanfilippo (antirez) tạo năm 2009 tại Ý; ban đầu viết bằng Tcl rồi chuyển C
            - paragraph [ref=f81e3389]:
              - generic [ref=f81e3390]: Giải pháp
              - text: In-memory key-value store đơn process với nhiều cấu trúc (string, hash, list, set, sorted set), persist tùy chọn ra disk, hỗ trợ pub/sub và Lua — vừa là cache vừa là broker/lock/coordination layer nhanh hơn database hàng chục lần.
            - paragraph [ref=f81e3391]:
              - text: "Liên quan:"
              - link "In-memory cache" [ref=f81e3392] [cursor=pointer]:
                - /url: "#in-memory-cache"
              - text: ","
              - link "Memcached" [ref=f81e3393] [cursor=pointer]:
                - /url: "#memcached"
              - text: ", Cache-aside,"
              - link "Hot key" [ref=f81e3394] [cursor=pointer]:
                - /url: "#hot-key"
          - article [ref=f81e3395]:
            - heading "Write-behind (write-back)" [level=4] [ref=f81e3396]
            - paragraph [ref=f81e3397]: "còn gọi: ghi nền, write-back"
            - paragraph [ref=f81e3398]:
              - generic [ref=f81e3399]: Vấn đề
              - text: Hệ thống ghi hàng nghìn event/giây (giỏ hàng, telemetry) mà mỗi ghi đều đồng bộ xuống DB thì write latency chặn hết throughput, DB bị write hotspot.
            - paragraph [ref=f81e3400]:
              - generic [ref=f81e3401]: Nguồn gốc
              - text: không rõ (write-back là chính sách cache CPU cổ điển; bất đồng bộ xuống storage phổ biến ở tầng ứng dụng)
            - paragraph [ref=f81e3402]:
              - generic [ref=f81e3403]: Giải pháp
              - text: Ghi vào cache trước, flush xuống DB sau (async, theo batch hoặc khi evict) — ghi cực nhanh cho client; đánh đổi là rủi ro mất dữ liệu nếu cache chết trước khi flush, và DB nhận burst ghi định kỳ.
            - paragraph [ref=f81e3404]:
              - text: "Liên quan:"
              - link "Write-through" [ref=f81e3405] [cursor=pointer]:
                - /url: "#write-through"
              - text: ","
              - link "Batching" [ref=f81e3406] [cursor=pointer]:
                - /url: "#batching"
              - text: ","
              - link "Backpressure" [ref=f81e3407] [cursor=pointer]:
                - /url: "#backpressure"
          - article [ref=f81e3408]:
            - heading "Write-through" [level=4] [ref=f81e3409]
            - paragraph [ref=f81e3410]: "còn gọi: ghi xuyên qua cache"
            - paragraph [ref=f81e3411]:
              - generic [ref=f81e3412]: Vấn đề
              - text: Ghi dữ liệu mà cache không được cập nhật thì đọc ngay sau đó trả về bản cũ (read-your-own-writes fail) — user bấm 'đã lưu' mà refresh vẫn thấy giá trị cũ, mất niềm tin vào hệ thống.
            - paragraph [ref=f81e3413]:
              - generic [ref=f81e3414]: Nguồn gốc
              - text: không rõ (chính sách ghi kinh điển của CPU cache, áp dụng xuống tầng ứng dụng)
            - paragraph [ref=f81e3415]:
              - generic [ref=f81e3416]: Giải pháp
              - text: Mọi ghi đi đồng thời vào cache và DB (đồng bộ, ghi thành công cả hai mới trả success) — cache luôn nhất quán với DB, đổi lấy latency ghi cao hơn và DB chịu toàn bộ write load.
            - paragraph [ref=f81e3417]:
              - text: "Liên quan: Cache-aside, Write-behind,"
              - link "Cache invalidation" [ref=f81e3418] [cursor=pointer]:
                - /url: "#cache-invalidation"
        - generic [ref=f81e3419]:
          - heading "Hiệu năng 32" [level=3] [ref=f81e3420]:
            - text: Hiệu năng
            - generic [ref=f81e3421]: "32"
          - article [ref=f81e3422]:
            - heading "Backpressure & rate shaping" [level=4] [ref=f81e3423]
            - paragraph [ref=f81e3424]: "còn gọi: back pressure, áp suất ngược, rate limiting vs rate shaping, throttling"
            - paragraph [ref=f81e3425]:
              - generic [ref=f81e3426]: Vấn đề
              - text: "Service consumer chậm hơn producer: queue trong RAM phình đến OOM rồi crash mất dữ liệu — thà từ chối/chậm lại có kiểm soát còn hơn sập ngẫu nhiên."
            - paragraph [ref=f81e3427]:
              - generic [ref=f81e3428]: Nguồn gốc
              - text: Khái niệm backpressure từ networking/dataflow; được phổ biến trong model reactive/Reactive Streams (2015-2016)
            - paragraph [ref=f81e3429]:
              - generic [ref=f81e3430]: Giải pháp
              - text: "Backpressure: tín hiệu 'chậm lại' truyền ngược từ consumer sang producer (TCP window, bounded queue + discard/block, credit-based flow control trong gRPC/reactive). Rate limiting chặn request đến (429); rate shaping/trạt giữ và phát ra đều hơn để làm mượt đỉnh. Kết hợp bounded queue + drop policy có chủ đích + metric depth."
            - paragraph [ref=f81e3431]:
              - text: "Liên quan:"
              - link "Little's law" [ref=f81e3432] [cursor=pointer]:
                - /url: "#little-s-law"
              - text: ", Queue depth, Fan-out"
          - article [ref=f81e3433]:
            - heading "Branch prediction" [level=4] [ref=f81e3434]
            - paragraph [ref=f81e3435]: "còn gọi: dự đoán nhánh, branch misprediction, pipeline stall"
            - paragraph [ref=f81e3436]:
              - generic [ref=f81e3437]: Vấn đề
              - text: Thứ tự dữ liệu đầu vào làm thay đổi tỉ lệ true/false của một if trong vòng lặp khiến code chạy chậm gấp 2-3 lần mà profiler CPU không chỉ ra dòng nào 'đắt' rõ ràng.
            - paragraph [ref=f81e3438]:
              - generic [ref=f81e3439]: Giải pháp
              - text: "CPU đoán trước nhánh điều khiển để nạp sẵn instruction; đoán sai = flush pipeline, mất hàng chục chu kỳ. Code phân nhánh khó đoán (dữ liệu aleatory) làm giảm IPC. Tối ưu: sort dữ liệu để tăng tính dự đoán được, gom nhánh hot ra ngoài vòng lặp, dùng branchless/CMOV khi hợp lý."
            - paragraph [ref=f81e3440]:
              - text: "Liên quan:"
              - link "Profiling" [ref=f81e3441] [cursor=pointer]:
                - /url: "#profiling"
              - text: ","
              - link "CPU cache line" [ref=f81e3442] [cursor=pointer]:
                - /url: "#cpu-cache-line"
              - text: ","
              - link "Hot path" [ref=f81e3443] [cursor=pointer]:
                - /url: "#hot-path"
          - article [ref=f81e3444]:
            - heading "Bufferbloat" [level=4] [ref=f81e3445]
            - paragraph [ref=f81e3446]: "còn gọi: phình bộ đệm, độ trễ do buffer, smart queue management"
            - paragraph [ref=f81e3447]:
              - generic [ref=f81e3448]: Vấn đề
              - text: Đường truyền 50Mbps nhưng ping luôn 300ms+ vì router consumer giữ buffer hàng trăm MB 'cho đầy' rồi packet delay cả giây — VoIP/gaming lag trong khi throughput test vẫn 'nhanh'.
            - paragraph [ref=f81e3449]:
              - generic [ref=f81e3450]: Nguồn gốc
              - text: Thuật ngữ phổ biến nhờ Jim Gettys (blog 'Bufferbloat', ~2010-2011); giải pháp CoDel của Nichols & Jacobson (2012)
            - paragraph [ref=f81e3451]:
              - generic [ref=f81e3452]: Giải pháp
              - text: "Buffer lớn ở switch/router/home gateway giữ queue đầy → standing queue → RTT tăng (theo Little's law: L = λW, W phình khi queue phình). Xử lý: sqm/fq_codel/cake đặt queue nhỏ + fair queueing, hoặc giảm hẳn buffer — theo BBR: bạn không cần buffer đầy để đạt BtlBw."
            - paragraph [ref=f81e3453]:
              - text: "Liên quan:"
              - link "Little's law" [ref=f81e3454] [cursor=pointer]:
                - /url: "#little-s-law"
              - text: ", BBR,"
              - link "Bandwidth vs latency" [ref=f81e3455] [cursor=pointer]:
                - /url: "#bandwidth-vs-latency"
          - article [ref=f81e3456]:
            - heading "C10K / C10M problem" [level=4] [ref=f81e3457]
            - paragraph [ref=f81e3458]: "còn gọi: c10k, c10m, 10.000 kết nối, millions of connections"
            - paragraph [ref=f81e3459]:
              - generic [ref=f81e3460]: Vấn đề
              - text: Web server 2000 ('một request = một process/thread') sập khi có 10.000 client đồng thời vì mỗi kết nối tốn một process và bộ nhớ, dù CPU hoàn toàn có thể gánh nổi.
            - paragraph [ref=f81e3461]:
              - generic [ref=f81e3462]: Nguồn gốc
              - text: Dan Kegel, trang 'The C10K problem' (kegel.com/c10k.html), khoảng năm 2000; C10M do Robert Graham đề xuất (Black Hat, 2013)
            - paragraph [ref=f81e3463]:
              - generic [ref=f81e3464]: Giải pháp
              - text: "Bài toán phục vụ 10.000 (rồi 10 triệu) kết nối đồng thời: cần event-driven I/O (epoll/kqueue), thread pool, non-blocking sockets, kernel tuning (somaxconn, file descriptor limit, TIME_WAIT), tách accept worker. Trở thành nền của Nginx, Node.js, Netty."
            - paragraph [ref=f81e3465]:
              - text: "Liên quan:"
              - link "epoll vs select vs poll" [ref=f81e3466] [cursor=pointer]:
                - /url: "#epoll-vs-select-vs-poll"
              - text: ","
              - link "Event loop" [ref=f81e3467] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ","
              - link "Non-blocking I/O" [ref=f81e3468] [cursor=pointer]:
                - /url: "#non-blocking-i-o"
          - article [ref=f81e3469]:
            - heading "Cache locality (spatial/temporal)" [level=4] [ref=f81e3470]
            - paragraph [ref=f81e3471]: "còn gọi: tính cục bộ cache, temporal locality, spatial locality"
            - paragraph [ref=f81e3472]:
              - generic [ref=f81e3473]: Vấn đề
              - text: Duyệt mảng AoS tràn lan trên dataset lớn chạy chậm gấp nhiều lần vòng lặp gọn tương đương, dù 'cùng một công việc tính toán' — vì CPU cache miss trả giá hàng chục-đôi trăm chu kỳ.
            - paragraph [ref=f81e3474]:
              - generic [ref=f81e3475]: Giải pháp
              - text: "Temporal locality: dữ liệu vừa dùng sẽ được dùng lại soon (giữ biến vòng lặp trong cache/register). Spatial locality: truy cập dữ liệu kề nhau nên fetch theo block (cache line) sẽ trúng. Tối ưu: duyệt theo thứ tự bộ nhớ, struct-of-arrays cho hot field, tách dữ liệu lạnh ra để dòng cache không bị pollution."
            - paragraph [ref=f81e3476]:
              - text: "Liên quan:"
              - link "CPU cache line" [ref=f81e3477] [cursor=pointer]:
                - /url: "#cpu-cache-line"
              - text: ","
              - link "False sharing" [ref=f81e3478] [cursor=pointer]:
                - /url: "#false-sharing"
              - text: ","
              - link "Prefetch" [ref=f81e3479] [cursor=pointer]:
                - /url: "#prefetch"
          - article [ref=f81e3480]:
            - heading "Cache stampede / thundering herd" [level=4] [ref=f81e3481]
            - paragraph [ref=f81e3482]: "còn gọi: cache stampede, thundering herd, đàn ong, hotspot key expiry"
            - paragraph [ref=f81e3483]:
              - generic [ref=f81e3484]: Vấn đề
              - text: Key cache quan trọng hết TTL đúng lúc; 10.000 request cùng lúc miss và đều đi compute/DB nặng → DB chết thêm lần nữa (đúng cái mà cache sinh ra để tránh).
            - paragraph [ref=f81e3485]:
              - generic [ref=f81e3486]: Nguồn gốc
              - text: "Hiện tượng 'thundering herd' mô tả trong networking/OS hàng thập niên (xem Wikipedia: thundering herd problem); cache stampede là tên gọi cụ thể trong cộng đồng cache"
            - paragraph [ref=f81e3487]:
              - generic [ref=f81e3488]: Giải pháp
              - text: "Cùng một sự kiện đánh thức hàng loạt luồng, chỉ 1 cái làm việc thực. Fix: distributed lock (setnx) chỉ cho 1 request rebuild, các request còn lại serve stale hoặc chờ; jitter TTL ngẫu nhiên; probabilistic early refresh; singleflight trong Go/memoize với mutex."
            - paragraph [ref=f81e3489]:
              - text: "Liên quan:"
              - link "Stale-while-revalidate" [ref=f81e3490] [cursor=pointer]:
                - /url: "#stale-while-revalidate"
              - text: ","
              - link "Hot key" [ref=f81e3491] [cursor=pointer]:
                - /url: "#hot-key"
              - text: ", Negative caching"
          - article [ref=f81e3492]:
            - heading "CPU cache line" [level=4] [ref=f81e3493]
            - paragraph [ref=f81e3494]: "còn gọi: dòng cache, cache line 64 bytes, cacheline"
            - paragraph [ref=f81e3495]:
              - generic [ref=f81e3496]: Vấn đề
              - text: "Không hiểu cache line dẫn tới tối ưu 'đúng logic nhưng sai vật lý': đọc một byte vẫn kéo cả 64 byte, và ghi một byte vẫn invalidate cả dòng trên các core khác."
            - paragraph [ref=f81e3497]:
              - generic [ref=f81e3498]: Giải pháp
              - text: "Đơn vị nhỏ nhất cache(L1/L2/L3) di chuyển và hợp nhất coherence — thường 64 byte. Đọc 1 byte = load cả dòng (lợi nếu truy cập tuần tự, lãng nếu duỗi dọc array-of-struct). Đồ thị directory-based coherence theo dòng: mọi false sharing, race padding đều tính trên đơn vị này."
            - paragraph [ref=f81e3499]:
              - text: "Liên quan:"
              - link "False sharing" [ref=f81e3500] [cursor=pointer]:
                - /url: "#false-sharing"
              - text: ", Cache locality,"
              - link "Prefetch" [ref=f81e3501] [cursor=pointer]:
                - /url: "#prefetch"
          - article [ref=f81e3502]:
            - heading "Disk IOPS, throughput & queue depth" [level=4] [ref=f81e3503]
            - paragraph [ref=f81e3504]: "còn gọi: IOPS, queue depth, disk throughput, io scheduler, fio"
            - paragraph [ref=f81e3505]:
              - generic [ref=f81e3506]: Vấn đề
              - text: "Database report chậm nhưng 'đĩa không bận lắm' — nhìn sai metric: throughput (MB/s) ổn định trong khi IOPS saturation và queue depth (nvme0n1qu_time) đang phình, latency ghi tăng gấp 5."
            - paragraph [ref=f81e3507]:
              - generic [ref=f81e3508]: Giải pháp
              - text: "IOPS = số thao tác mỗi giây (4K random vs 1M sequential khác nhau hàng chục lần); queue depth = số I/O đang chờ trong thiết bị — tăng QD đến một ngưỡng thì throughput bão hòa mà latency tăng tuyến tính (Little's law trên disk). Đo bằng iostat -x (%util, aqu-sz), fio benchmark. SSD: QD nhỏ đã đủ; HDD cần QD lớn."
            - paragraph [ref=f81e3509]:
              - text: "Liên quan: fsync cost & SSD vs HDD,"
              - link "Little's law" [ref=f81e3510] [cursor=pointer]:
                - /url: "#little-s-law"
              - text: ", Queue depth"
          - article [ref=f81e3511]:
            - heading "epoll vs select vs poll" [level=4] [ref=f81e3512]
            - paragraph [ref=f81e3513]: "còn gọi: select poll epoll, I/O multiplexing, scalable event notification"
            - paragraph [ref=f81e3514]:
              - generic [ref=f81e3515]: Vấn đề
              - text: "Server dùng select() với hàng nghìn socket: mỗi lần gọi quét O(n) toàn bộ fd, fd tối đa bị giới hạn (FD_SETSIZE), wake-up báo 'có sự kiện' nhưng không nói cái nào → tự quét lại rồi lãng phí."
            - paragraph [ref=f81e3516]:
              - generic [ref=f81e3517]: Nguồn gốc
              - text: select/poll có từ BSD/System V cổ điển; epoll thêm vào kernel Linux 2.5.45 (tháng 10/2002, Davide Libenzi)
            - paragraph [ref=f81e3518]:
              - generic [ref=f81e3519]: Giải pháp
              - text: "select/poll: O(n) mỗi lần, sao chép toàn bộ bitmap/ mảng fd sang-kernel. epoll: đăng ký interest set một lần, kernel chủ động báo exact fd sẵn sàng (ready list), O(1) trên hot path; có edge/level trigger. Tương đương: kqueue (BSD), IOCP (Windows)."
            - paragraph [ref=f81e3520]:
              - text: "Liên quan:"
              - link "C10K problem" [ref=f81e3521] [cursor=pointer]:
                - /url: "#c10k-problem"
              - text: ","
              - link "Event loop" [ref=f81e3522] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ", Busy polling"
          - article [ref=f81e3523]:
            - heading "Fan-out & amplification factor" [level=4] [ref=f81e3524]
            - paragraph [ref=f81e3525]: "còn gọi: fanout, amplification, read amplification, write amplification, request amplification"
            - paragraph [ref=f81e3526]:
              - generic [ref=f81e3527]: Vấn đề
              - text: 1 request API phía user khiến service gọi 50 service con (fan-out 50), mỗi service con lại fan-out tiếp → bức tranh 'gấp 50 lần' nằm sau một endpointtrông nhẹ; hay WAL ghi 1MB nhưng flash phải ghi 10MB (write amplification) làm SSD mòn và chậm.
            - paragraph [ref=f81e3528]:
              - generic [ref=f81e3529]: Giải pháp
              - text: "Fan-out: số lời gọi nội bộ sinh ra từ 1 request — nhân với tail latency (xem The Tail at Scale) và QPS của downstream. Amplification factor: tỉ lệ bytes/IO thực thực so với bytes hữu ích (read/write amplification trong LSM-tree/SSD, DNS amplification trong networking). Đo để phát hiện: metric per-request downstream calls, write bytes/ingest bytes."
            - paragraph [ref=f81e3530]:
              - text: "Liên quan:"
              - link "Tail latency" [ref=f81e3531] [cursor=pointer]:
                - /url: "#tail-latency"
              - text: ","
              - link "N+1 query" [ref=f81e3532] [cursor=pointer]:
                - /url: "#n-1-query"
              - text: ", Pagination cost"
          - article [ref=f81e3533]:
            - heading "Generational GC" [level=4] [ref=f81e3534]
            - paragraph [ref=f81e3535]: "còn gọi: GC thế hệ, generation scavenging, young/old generation"
            - paragraph [ref=f81e3536]:
              - generic [ref=f81e3537]: Vấn đề
              - text: Trace cả heap vài GB mỗi lần thu dọn thì pause quá dài; thực tế phần lớn object chết rất sớm nên quét cả núi dữ liệu sống là lãng phí.
            - paragraph [ref=f81e3538]:
              - generic [ref=f81e3539]: Nguồn gốc
              - text: David Ungar, 'Generation Scavenging', 1984; thành chuẩn trong JVM/boyer-GC hiện đại
            - paragraph [ref=f81e3540]:
              - generic [ref=f81e3541]: Giải pháp
              - text: "Chia heap theo thế hệ dựa trên giả thuyết 'most objects die young': object mới vào young gen,_minor GC quét nhanh khu nhỏ, object sống qua nhiều vòng được promote lên old gen (quét ít hơn). Viết barrier cho tham chiếu cross-generation. Tradeoff: fragmentation/promotion và major GC thỉnh thoảng vẫn lâu."
            - paragraph [ref=f81e3542]: "Liên quan: Stop-the-world, Memory allocation, Heap profiling"
          - article [ref=f81e3543]:
            - heading "Hot key / hot partition" [level=4] [ref=f81e3544]
            - paragraph [ref=f81e3545]: "còn gọi: hotspot key, hot partition, skewed key, phân vùng nóng"
            - paragraph [ref=f81e3546]:
              - generic [ref=f81e3547]: Vấn đề
              - text: "Một hashtag viral làm 30% toàn bộ traffic dồn vào 1 shard/1 node Redis: node đó CPU 100% trong khi cluster overall chỉ 40% — partitioning 'đều theo hash' không đều theo thực tế."
            - paragraph [ref=f81e3548]:
              - generic [ref=f81e3549]: Giải pháp
              - text: "Phân bố key không đồng đều (zipf). Xử lý: tách hot key ra instance riêng (salting/trie sharding cho hot prefix), replicate hot key sang nhiều node rồi client load-balance, cache L1 tại ứng dụng, giới hạn rate theo key. Đo bằng per-key access counter (sampling) để tìm hotspot."
            - paragraph [ref=f81e3550]:
              - text: "Liên quan: Hot partition, Cache stampede,"
              - link "Hot path" [ref=f81e3551] [cursor=pointer]:
                - /url: "#hot-path"
          - article [ref=f81e3552]:
            - heading "HTTP/2 multiplexing" [level=4] [ref=f81e3553]
            - paragraph [ref=f81e3554]: "còn gọi: đaplex HTTP/2, stream HTTP/2, multiplexing over one connection"
            - paragraph [ref=f81e3555]:
              - generic [ref=f81e3556]: Vấn đề
              - text: HTTP/1.1 giới hạn ~6 kết nối/nền tảng nên trình duyệt phải mở nhiều TCP (hoặc serialize), trang nhiều tài nguyên nhỏ bị head-of-line và chậm tải song song.
            - paragraph [ref=f81e3557]:
              - generic [ref=f81e3558]: Nguồn gốc
              - text: HTTP/2 chuẩn hóa tại RFC 7540 (tháng 5/2015), kế thừa SPDY của Google (2009-2012)
            - paragraph [ref=f81e3559]:
              - generic [ref=f81e3560]: Giải pháp
              - text: "Nhiều stream (request/response) chạy đồng thời trên cùng một TCP connection, mỗi stream có ID, frame tùy ý interleaving + HPACK nén header. Giảm số kết nối, tận dụng một handshake TLS. Nhưng: một packet TCP loss vẫn block toàn connection (xem HOL blocking)."
            - paragraph [ref=f81e3561]:
              - text: "Liên quan:"
              - link "Head-of-line blocking" [ref=f81e3562] [cursor=pointer]:
                - /url: "#head-of-line-blocking"
              - text: ","
              - link "HTTP keep-alive" [ref=f81e3563] [cursor=pointer]:
                - /url: "#http-keep-alive"
              - text: ", TLS handshake cost"
          - article [ref=f81e3564]:
            - heading "JIT compilation & warmup" [level=4] [ref=f81e3565]
            - paragraph [ref=f81e3566]: "còn gọi: just-in-time, JIT warmup, pre-warming JIT, tiered compilation"
            - paragraph [ref=f81e3567]:
              - generic [ref=f81e3568]: Vấn đề
              - text: Service JVM vừa deploy (hoặc vừa scale) cho p99 xấu gấp 3-5 lần vài phút đầu vì mã bytecode chưa được biên dịch thành mã máy tối ưu — benchmark hoặc smoke test ngay sau restart ra kết quả sai.
            - paragraph [ref=f81e3569]:
              - generic [ref=f81e3570]: Nguồn gốc
              - text: JIT như khái niệm xuất hiện từ đầu thập niên 1980 (Smalltalk-80 VM, UCSD p-code); phổ biến rộng rãi bởi JVM/HotSpot từ những năm 1990-2000
            - paragraph [ref=f81e3571]:
              - generic [ref=f81e3572]: Giải pháp
              - text: "Runtime dịch bytecode → machine code khi phát hiện hot method (profiling counters), rồi tái biên dịch cấp cao hơn (C1/C2 tiered, OSR). Warmup = thời gian JIT quan sát + biên dịch + JIT log ổn định. Trong benchmark: warmup đủ vòng, xóa/warm JIT profile nhất quán; trong prod: pre-warm bằng health-check/traffic giả trước khi nhận user thật."
            - paragraph [ref=f81e3573]:
              - text: "Liên quan:"
              - link "Hot path" [ref=f81e3574] [cursor=pointer]:
                - /url: "#hot-path"
              - text: ","
              - link "Benchmark" [ref=f81e3575] [cursor=pointer]:
                - /url: "#benchmark"
              - text: ", Microbenchmark"
          - article [ref=f81e3576]:
            - heading "Latency histogram / HDR Histogram" [level=4] [ref=f81e3577]
            - paragraph [ref=f81e3578]: "còn gọi: HDR Histogram, High Dynamic Range Histogram, histogram độ trễ"
            - paragraph [ref=f81e3579]:
              - generic [ref=f81e3580]: Vấn đề
              - text: Giữ toàn bộ mẫu latency trong mảng để tính percentile thì tốn RAM; lưu log rồi tính offline thì chậm; bucket cố định thô thì mấtđộ chính xác ở đuôi (p99.99).
            - paragraph [ref=f81e3581]:
              - generic [ref=f81e3582]: Nguồn gốc
              - text: HDR Histogram do Gil Tene & Brian Otto phát triển (Azul), công bố ~2014-2015, hdrhistogram.org
            - paragraph [ref=f81e3583]:
              - generic [ref=f81e3584]: Giải pháp
              - text: Chia thang log các bucket theo bậc tin cậy (significant digits), độ trễ 3-6ns mỗi mẫu trên CPU Intel ~2014, bộ nhớ cố định theo khoảng giá trị. Cho phép gộp (add) histogram con thành tổng thể chính xác — nền tảng của benchmark correction (coordinated omission) và monitoring percentile.
            - paragraph [ref=f81e3585]:
              - text: "Liên quan:"
              - link "Coordinated omission" [ref=f81e3586] [cursor=pointer]:
                - /url: "#coordinated-omission"
              - text: ", Phân vị p50/p95/p99,"
              - link "Benchmark" [ref=f81e3587] [cursor=pointer]:
                - /url: "#benchmark"
          - article [ref=f81e3588]:
            - heading "Little's law" [level=4] [ref=f81e3589]
            - paragraph [ref=f81e3590]: "còn gọi: định luật Little, L = λW, L=λW, Little's theorem"
            - paragraph [ref=f81e3591]:
              - generic [ref=f81e3592]: Vấn đề
              - text: "Đặt kích thước thread pool / connection pool / hàng đợi hoàn toàn theo cảm tính: quá nhỏ thì queue phình, quá lớn thì context switch và OOM, không có công thức kiểm chứng."
            - paragraph [ref=f81e3593]:
              - generic [ref=f81e3594]: Nguồn gốc
              - text: John Little (MIT), công thức L = λW, chứng minh năm 1961 (Operations Research)
            - paragraph [ref=f81e3595]:
              - generic [ref=f81e3596]: Giải pháp
              - text: "Số job trung bình trong hệ thống L = tốc độ đến λ × thời gian tồn W, đúng với hầu hết mọi hệ thống (không phụ thuộc phân phối tới hạn/dịch vụ). Dùng để suy ngược: đo throughput và latency → biết có bao nhiêu request đang 'nằm trong hệ thống' → sized pool/queue hợp lý, phát hiện bottleneck."
            - paragraph [ref=f81e3597]:
              - text: "Liên quan:"
              - link "Latency vs throughput" [ref=f81e3598] [cursor=pointer]:
                - /url: "#latency-vs-throughput"
              - text: ","
              - link "Backpressure" [ref=f81e3599] [cursor=pointer]:
                - /url: "#backpressure"
              - text: ","
              - link "Capacity planning" [ref=f81e3600] [cursor=pointer]:
                - /url: "#capacity-planning"
              - text: ","
              - link "Capacity Planning" [ref=f81e3601] [cursor=pointer]:
                - /url: "#capacity-planning"
              - text: ","
              - link "Queueing Theory Basics (M/M/1)" [ref=f81e3602] [cursor=pointer]:
                - /url: "#queueing-theory-basics-m-m-1"
              - text: ","
              - link "Bottleneck Analysis" [ref=f81e3603] [cursor=pointer]:
                - /url: "#bottleneck-analysis"
              - text: ", QPS,"
              - link "Connection pool" [ref=f81e3604] [cursor=pointer]:
                - /url: "#connection-pool"
          - article [ref=f81e3605]:
            - heading "Memory allocation & GC churn" [level=4] [ref=f81e3606]
            - paragraph [ref=f81e3607]: "còn gọi: allocation rate, memory churn, heap allocation, object churn"
            - paragraph [ref=f81e3608]:
              - generic [ref=f81e3609]: Vấn đề
              - text: Hot loop new object hàng triệu lần mỗi giây làm GC chạy liên tục, log GC warning và p99 phình dù algorithm chính xác.
            - paragraph [ref=f81e3610]:
              - generic [ref=f81e3611]: Giải pháp
              - text: "Mỗi allocation = native heap/arena work + later reclamation; rate cao → young GC dày đặc → STW/scan nhiều. Giảm: object pool/arena, reuse buffer (bytes.Buffer), tránh boxing/lambda capture thừa, chọn cấu trúc data gọn (primitive arrays), đo allocation rate qua profiler (async-profiler, go tool pprof -alloc)."
            - paragraph [ref=f81e3612]:
              - text: "Liên quan:"
              - link "Generational GC" [ref=f81e3613] [cursor=pointer]:
                - /url: "#generational-gc"
              - text: ", Stop-the-world, Heap profiling"
          - article [ref=f81e3614]:
            - heading "Microbenchmark & bẫy của nó" [level=4] [ref=f81e3615]
            - paragraph [ref=f81e3616]: "còn gọi: benchmark nhỏ, microbenchmark pitfalls, JMH, benchmark artifacts"
            - paragraph [ref=f81e3617]:
              - generic [ref=f81e3618]: Vấn đề
              - text: Benchmark vòng lặp 10^9 lần hàm 5ns rồi kết luận tối ưu 20% — thực tế JVM đã dead-code elimination, constant fold, CPU boost, branch predictor ấm, và khác hẳn khi chạy thật với data lớn.
            - paragraph [ref=f81e3619]:
              - generic [ref=f81e3620]: Giải pháp
              - text: "Bẫy: dead-code elimination (kết quả không dùng → JIT xóa), store-to-load forwarding/constant folding, warmup thiếu, data set nằm gọn trong L1 (không phản ánh production), turbo clock, run-to-run variance, đồng bộ đo sai (System.nanoTime mỗi iter). Giải pháp: JMH/blackhole, warmup đầy đủ, -prof perf, chạy nhiều lần, báo median + confidence interval."
            - paragraph [ref=f81e3621]: "Liên quan: Warmup, Statistical significance in benchmarks, Regression detection in benchmarks"
          - article [ref=f81e3622]:
            - heading "Nagle's algorithm & delayed ACK" [level=4] [ref=f81e3623]
            - paragraph [ref=f81e3624]: "còn gọi: Nagle algorithm, delayed ACK, RFC 896, tinygram"
            - paragraph [ref=f81e3625]:
              - generic [ref=f81e3626]: Vấn đề
              - text: "Protocol gửi phím gõ / message nhỏ hàng chục byte thấy latency lạ thường (40-200ms) đôi khi — hai thuật toán tối ưu 'chống nhau': một bên gom gói, bên kia chờ trả lời."
            - paragraph [ref=f81e3627]:
              - generic [ref=f81e3628]: Nguồn gốc
              - text: John Nagle (Ford Aerospace), RFC 896 'Congestion Control in IP/TCP Internetworks', 1984; delayed ACK đến từ triển khai TCP cổ điển (~4.2BSD)
            - paragraph [ref=f81e3629]:
              - generic [ref=f81e3630]: Giải pháp
              - text: "Nagle: chỉ gửi segment nhỏ ngay khi không có gói chưa ACK; nếu có thì gom đến khi ACK về hoặc đủ MSS (giảm tinygram). Delayed ACK: receiver chờ ~40ms (hoặc 2 packet đến) mới ACK. Kết quả deadlock nhẹ: Nagle chờ ACK, ACK bị delay → 40ms+. Fix: TCP_NODELAY cho latency-sensitive, gom message ở ứng dụng, hoặc dùng header + payload trong 1 packet."
            - paragraph [ref=f81e3631]:
              - text: "Liên quan: TCP keep-alive, Latency numbers,"
              - link "Bufferbloat" [ref=f81e3632] [cursor=pointer]:
                - /url: "#bufferbloat"
          - article [ref=f81e3633]:
            - heading "Negative caching & cache penetration (null cache)" [level=4] [ref=f81e3634]
            - paragraph [ref=f81e3635]: "còn gọi: null cache, negative cache, cache penetration, không-trúng xuyên thấu"
            - paragraph [ref=f81e3636]:
              - generic [ref=f81e3637]: Vấn đề
              - text: "Bot quét id không tồn tại liên tục: mỗi request đều miss cache → 100% dồn xuống DB (cache penetration), hoặc cache 'không có' TTL quá dài thì item vừa được tạo lại bị che (null cache sai)."
            - paragraph [ref=f81e3638]:
              - generic [ref=f81e3639]: Giải pháp
              - text: "Negative caching: lưu kết quả 'không tồn tại' với TTL ngắn (vd 30-60s) để chặn chuỗi miss lặp. Null cache/không-trúng cache penetration: key lạ không có trong cache luôn đi DB — đối phó: bloom filter phía trước, validate id định dạng, TTL negative ngắn, jitter. Đừng cache null vĩnh viễn (che dữ liệu vừa ghi)."
            - paragraph [ref=f81e3640]:
              - text: "Liên quan:"
              - link "Cache hit ratio" [ref=f81e3641] [cursor=pointer]:
                - /url: "#cache-hit-ratio"
              - text: ","
              - link "Stale-while-revalidate" [ref=f81e3642] [cursor=pointer]:
                - /url: "#stale-while-revalidate"
              - text: ","
              - link "Hot key" [ref=f81e3643] [cursor=pointer]:
                - /url: "#hot-key"
          - article [ref=f81e3644]:
            - heading "Pagination cost & keyset pagination" [level=4] [ref=f81e3645]
            - paragraph [ref=f81e3646]: "còn gọi: offset pagination, LIMIT OFFSET, keyset pagination, seek method, cursor pagination"
            - paragraph [ref=f81e3647]:
              - generic [ref=f81e3648]: Vấn đề
              - text: OFFSET 100.000 khiến DB phải quét và vứt 100.000 dòng trước khi trả 20 dòng — page càng sâu càng chậm, và row chèn/xóa làm lặp/mất item giữa các trang.
            - paragraph [ref=f81e3649]:
              - generic [ref=f81e3650]: Giải pháp
              - text: "Offset: chi phí O(offset), không ổn định với ghi chèn. Keyset/cursor: WHERE (updated_at, id) < (cursor) ORDER BY ... LIMIT n — chi phí O(log n + page), ổn định, cần index dẫn xuất (sort key). Trừ khi user cần 'jump đến trang N' tự do thì offset vẫn hợp lệ cho trang đầu."
            - paragraph [ref=f81e3651]:
              - text: "Liên quan: Pagination,"
              - link "N+1 query" [ref=f81e3652] [cursor=pointer]:
                - /url: "#n-1-query"
              - text: ", Query batching"
          - article [ref=f81e3653]:
            - heading "Prefetch" [level=4] [ref=f81e3654]
            - paragraph [ref=f81e3655]: "còn gọi: hardware prefetch, software prefetch, read-ahead, prefetching"
            - paragraph [ref=f81e3656]:
              - generic [ref=f81e3657]: Vấn đề
              - text: Duyệt con trỏ liên kết (linked list/tree node phân tán) chậm vì mỗi node một cache miss — CPU không đoán được trỏ tiếp theo nên luôn chờ DRAM.
            - paragraph [ref=f81e3658]:
              - generic [ref=f81e3659]: Giải pháp
              - text: "Hardware prefetcher đoán pattern tuần tự/stride và nạp trước dòng cache; software prefetch (__builtin_prefetch/PRF) chủ động nạp ô sẽ dùng sau N vòng lặp. Tối ưu cấu trúc data (array thay vì linked list) thường thắng prefetch thủ công. Cũng áp dụng ở tầng cao: prefetch relation/bản ghi trước khi cần."
            - paragraph [ref=f81e3660]:
              - text: "Liên quan: Cache locality,"
              - link "N+1 query" [ref=f81e3661] [cursor=pointer]:
                - /url: "#n-1-query"
              - text: ", Lazy evaluation"
          - article [ref=f81e3662]:
            - 'heading "Profiling: CPU/heap, flame graph" [level=4] [ref=f81e3663]'
            - paragraph [ref=f81e3664]: "còn gọi: flame graph, CPU profiler, heap profiler, USE method"
            - paragraph [ref=f81e3665]:
              - generic [ref=f81e3666]: Vấn đề
              - text: "'Code chậm' không có chỗ nào chỉ tên: log chỉ nói endpoint mất 2s, không nói hàm nào, dòng nào, đang chờ I/O hay đang đốt CPU."
            - paragraph [ref=f81e3667]:
              - generic [ref=f81e3668]: Nguồn gốc
              - text: Flame graph do Brendan Gregg phát triển năm 2011 (brendangregg.com/flamegraphs); USE method cũng của Gregg
            - paragraph [ref=f81e3669]:
              - generic [ref=f81e3670]: Giải pháp
              - text: "Sampling profiler lấy stack định kỳ (low overhead) → histogram stack; instrument ghi mọi entry (đầy đủ nhưng overhead cao). Flame graph: trục X = % mẫu (không phải thời gian), trục Y = độ sâu stack, width = tỉ trọng CPU — nhìn ngay 'ngọn lửa' nóng. Heap profiler (pprof, async-profiler) xem ai giữ object; kết hợp mutation breakpoint/line-level cho phần code cần sửa."
            - paragraph [ref=f81e3671]:
              - text: "Liên quan:"
              - link "Sampling vs instrumentation" [ref=f81e3672] [cursor=pointer]:
                - /url: "#sampling-vs-instrumentation"
              - text: ","
              - link "Hot path" [ref=f81e3673] [cursor=pointer]:
                - /url: "#hot-path"
              - text: ","
              - link "Benchmark" [ref=f81e3674] [cursor=pointer]:
                - /url: "#benchmark"
          - article [ref=f81e3675]:
            - heading "Sampling vs instrumentation" [level=4] [ref=f81e3676]
            - paragraph [ref=f81e3677]: "còn gọi: sampling profiler, instrumentation overhead, observer effect profiling"
            - paragraph [ref=f81e3678]:
              - generic [ref=f81e3679]: Vấn đề
              - text: Bật profiler instrumentation để đo thì chính nó làm slowdown 2-5x, benchmark bị thay đổi ('hiệu ứng người quan sát'); sampling quá thô thì miss hot path hàng chục μs.
            - paragraph [ref=f81e3680]:
              - generic [ref=f81e3681]: Giải pháp
              - text: "Sampling: đếm stackmỗi N μs hoặc N event (perf, async-profiler wall/cpu) — overhead thấp, số liệu statistical, có thể miss code ngắn. Instrumentation: hook mọi hàm/đoạn (pgo, karhu, eBPF uprobe dày) — chính xác per-call nhưng overhead và skew độ trễ. Chọn theo câu hỏi: 'chỗ nào tốn CPU tổng thể?' → sampling; 'hàm này chạy bao nhiêu lần/bao lâu?' → instrumentation có kiểm soát sampling rate."
            - paragraph [ref=f81e3682]:
              - text: "Liên quan:"
              - link "Profiling" [ref=f81e3683] [cursor=pointer]:
                - /url: "#profiling"
              - text: ","
              - link "Tracing overhead" [ref=f81e3684] [cursor=pointer]:
                - /url: "#tracing-overhead"
              - text: ", Statistical significance in benchmarks"
          - article [ref=f81e3685]:
            - heading "Stale-while-revalidate" [level=4] [ref=f81e3686]
            - paragraph [ref=f81e3687]: "còn gọi: SWR, phục vụ cũ làm mới nền, cache revalidation, phục vụ cũ vừa làm mới, SWR (HTTP), stale-while-revalidate / immutable, phục vụ cũ khi đang làm mới, RFC 5861, immutable asset"
            - paragraph [ref=f81e3688]:
              - generic [ref=f81e3689]: Vấn đề
              - text: Cache hết hạn = mọi request đầu tiên sau đó chịu full latency backend (và nếu đồng loạt thì thành stampede), trong khi dữ liệu cũ vài giây thường vẫn chấp nhận được. Khi cache hết hạn, client bắt buộc chờ revalidation round-trip về origin (thêm 1+ RTT + thời gian origin) dù nội dung 99% vẫn giữ nguyên — user cảm nhận độ trễ đúng vào lúc họ click. Ngược lại, asset đã hash version (?v=abc123) không bao giờ đổi nội dung nhưng client vẫn gửi conditional request vô ích mỗi lần.
            - paragraph [ref=f81e3690]:
              - generic [ref=f81e3691]: Nguồn gốc
              - text: Được chuẩn hóa tại RFC 5861 (M. Nottingham, Yahoo!, tháng 5/2010); cách dùng phổ biến trước đó từ RFC 2616 (HTTP/1.1)
            - paragraph [ref=f81e3692]:
              - generic [ref=f81e3693]: Giải pháp
              - text: "Khi TTL stale: trả ngay bản cũ cho client (latency ~0) và đồng thời trigger refresh nền; response tiếp theo lấy bản mới. Kết hợp với stale-if-error, jitter TTL, soft/hard TTL. Cân bằng giữa freshness và availability — đo xem dữ liệu cũ bao lâu thì vẫn đúng nghiệp vụ. stale-while-revalidate=N: quá max-age, cache vẫn phục vụ bản cũ NGAY cho user và âm thầm revalidate nền — user không thấy độ trễ. immutable: trong suốt thời gian fresh, không cần revalidate (dùng với URL có version hash + max-age dài). Kết hợp pattern: index.html đặt no-cache để luôn lấy HTML mới trỏ tới asset mới, /assets/* đặt immutable caching vĩnh viễn."
            - paragraph [ref=f81e3694]:
              - text: "Liên quan: Cache stampede,"
              - link "CDN edge caching" [ref=f81e3695] [cursor=pointer]:
                - /url: "#cdn-edge-caching"
              - text: ", Negative caching, TTL,"
              - link "CDN" [ref=f81e3696] [cursor=pointer]:
                - /url: "#cdn"
              - text: ","
              - link "Browser cache" [ref=f81e3697] [cursor=pointer]:
                - /url: "#browser-cache"
              - text: ","
              - link "Cache invalidation" [ref=f81e3698] [cursor=pointer]:
                - /url: "#cache-invalidation"
              - text: ", HTTP caching với Cache-Control, ETag / conditional requests,"
              - link "CDN cache key" [ref=f81e3699] [cursor=pointer]:
                - /url: "#cdn-cache-key"
          - article [ref=f81e3700]:
            - heading "Stop-the-world & GC pause" [level=4] [ref=f81e3701]
            - paragraph [ref=f81e3702]: "còn gọi: GC pause, STW, thời gian dừng GC"
            - paragraph [ref=f81e3703]:
              - generic [ref=f81e3704]: Vấn đề
              - text: Service Java/Go p99 thỉnh thoảng nhảy từ 50ms lên 2 giây đúng lúc heap đầy, log không có lỗi gì — đó là garbage collector dừng toàn bộ mutator.
            - paragraph [ref=f81e3705]:
              - generic [ref=f81e3706]: Giải pháp
              - text: "GC cần chặn luồng ứng dụng (stop-the-world) ở các phase như root scanning/compaction để graph đối tượng nhất quán. Pause dài = outlier latency. Giảm: giữ heap và rate tạo object ổn định, GC low-latency (ZGC/Shenandoah), cân nhắc region-based collector, luôn đo GC time trong SLO."
            - paragraph [ref=f81e3707]:
              - text: "Liên quan:"
              - link "Generational GC" [ref=f81e3708] [cursor=pointer]:
                - /url: "#generational-gc"
              - text: ", Memory allocation,"
              - link "Tail latency" [ref=f81e3709] [cursor=pointer]:
                - /url: "#tail-latency"
          - article [ref=f81e3710]:
            - heading "SYN flood & SYN cookies" [level=4] [ref=f81e3711]
            - paragraph [ref=f81e3712]: "còn gọi: SYN flood, SYN cookie, half-open connection"
            - paragraph [ref=f81e3713]:
              - generic [ref=f81e3714]: Vấn đề
              - text: Máy chủ web nhận hàng triệu SYN giả, bảng kết nối half-open đầy thật → không accept nổi kết nối hợp lệ (từ chối dịch vụ cả khách thật).
            - paragraph [ref=f81e3715]:
              - generic [ref=f81e3716]: Nguồn gốc
              - text: Sóng tấn công SYN flood được cảnh báo rộng rãi cuối những năm 1990 (CERT); SYN cookies do Daniel J. Bernstein đề xuất năm 1996
            - paragraph [ref=f81e3717]:
              - generic [ref=f81e3718]: Giải pháp
              - text: Attacker gửi SYN mà không trả lời ACK, mỗi kết nối nửa vời chiếm entry bảng. SYN cookie mã hóa state (timestamp, MSS, secret) vào ISN sequence → server không lưu state cho đến khi ACK hợp lệ về; kèm backlog tuning, syncookies sysctl, rate limit SYN theo nút con.
            - paragraph [ref=f81e3719]:
              - text: "Liên quan: Connection pool vs new connection, Rate shaping,"
              - link "Keep-alive" [ref=f81e3720] [cursor=pointer]:
                - /url: "#keep-alive"
          - article [ref=f81e3721]:
            - heading "Syscall overhead" [level=4] [ref=f81e3722]
            - paragraph [ref=f81e3723]: "còn gọi: chi phí system call, syscall cost, user kernel transition"
            - paragraph [ref=f81e3724]:
              - generic [ref=f81e3725]: Vấn đề
              - text: Hàm đọc file nhỏ gọi open/read/close hàng nghìn lần mỗi request, mỗi lần trả giá chuyển ngữ cảnh user→kernel (~hàng trăm ns đến ~1μs) — tổng lại thành bottleneck CPU không thấy trong code ứng dụng.
            - paragraph [ref=f81e3726]:
              - generic [ref=f81e3727]: Giải pháp
              - text: "Mỗi syscall phải chuyển chế độ kernel, kiểm tra tham số, đối chiếu page table (đặc biệt khi bộ nhớ user bị thay đổi). Reduce: batch syscall (preadv/writev, recvmmsg, io_uring), cache fd/connection (keep-alive), map file thay vì đọc lặp, tránh gettimeofday() trong hot loop."
            - paragraph [ref=f81e3728]:
              - text: "Liên quan: Syscall batching,"
              - link "io_uring" [ref=f81e3729] [cursor=pointer]:
                - /url: "#io-uring"
              - text: ","
              - link "Zero-copy" [ref=f81e3730] [cursor=pointer]:
                - /url: "#zero-copy"
          - article [ref=f81e3731]:
            - heading "TCP slow start" [level=4] [ref=f81e3732]
            - paragraph [ref=f81e3733]: "còn gọi: slow start, khởi động chậm, cwnd growth, cwnd exponential growth"
            - paragraph [ref=f81e3734]:
              - generic [ref=f81e3735]: Vấn đề
              - text: Kết nối mới (hoặc mất kết nối) gửi nhỏ giọt từ ~10 segment, mất nhiều round trip mới đạt băng thông tối đa — request đầu của connection pool 'nóng' bất ngờ chậm.
            - paragraph [ref=f81e3736]:
              - generic [ref=f81e3737]: Nguồn gốc
              - text: Van Jacobson, 'Congestion Avoidance and Control', SIGCOMM 1988
            - paragraph [ref=f81e3738]:
              - generic [ref=f81e3739]: Giải pháp
              - text: "cwnd bắt đầu nhỏ (10 MSS theo RFC 5681) và tăng gấp đôi mỗi RTT (exponential) đến ngưỡng ssthresh/congestion event rồi chuyển sang additive increase. Slow start kết thúc sớm bằng pacing (prr) hoặc BBR Startup. Ảnh hưởng thực tế: kết nối mới luôn chịu 'tax' vài round trip — lại là lý do keep-alive/pool/pre-warm."
            - paragraph [ref=f81e3740]: "Liên quan: BBR, Connection pool vs new connection, TLS handshake cost, TCP congestion control, RTT, BBR / CUBIC"
          - article [ref=f81e3741]:
            - heading "Thread-per-request vs event loop" [level=4] [ref=f81e3742]
            - paragraph [ref=f81e3743]: "còn gọi: một thread mỗi request, reactor pattern, event-driven server"
            - paragraph [ref=f81e3744]:
              - generic [ref=f81e3745]: Vấn đề
              - text: Mỗi request một thread (servlet servlet container cổ điển) khiến 10.000 request đồng thời = 10.000 thread, RAM và context switch phình; ngược lại event loop một thread dễ bị block bởi I/O đồng bộ ngầm.
            - paragraph [ref=f81e3746]:
              - generic [ref=f81e3747]: Giải pháp
              - text: "Thread-per-request: code đồng bộ dễ viết, chi phí thread (~stack MB, context switch) giới hạn C10K. Event loop/reactor: 1 luồng điều phối hàng vạn kết nối, I/O phải non-blocking, callback/coroutine; CPU-bound job phải tách worker pool. Chọn theo workload: I/O-bound→event loop, CPU-bound/đồng bộ legacy→thread pool."
            - paragraph [ref=f81e3748]:
              - text: "Liên quan:"
              - link "C10K problem" [ref=f81e3749] [cursor=pointer]:
                - /url: "#c10k-problem"
              - text: ","
              - link "Non-blocking I/O" [ref=f81e3750] [cursor=pointer]:
                - /url: "#non-blocking-i-o"
              - text: ","
              - link "Context switch cost" [ref=f81e3751] [cursor=pointer]:
                - /url: "#context-switch-cost"
          - article [ref=f81e3752]:
            - heading "Tracing overhead" [level=4] [ref=f81e3753]
            - paragraph [ref=f81e3754]: "còn gọi: overhead distributed tracing, trace sampling, OpenTelemetry overhead"
            - paragraph [ref=f81e3755]:
              - generic [ref=f81e3756]: Vấn đề
              - text: Mở full tracing cho mọi request trên service QPS cao thì CPU và network export phình, latency tăng — 'đo để không làm méo thứ mình đo'.
            - paragraph [ref=f81e3757]:
              - generic [ref=f81e3758]: Giải pháp
              - text: "Mỗi span = object + serialization + export; head sampling (quyết định trace ở entry), tail sampling (giữ trace chậm/lỗi), probabilistic rate. Benchmark so sánh bật/tắt tracing; giới hạn attributes/stack depth; queue+batch exporter. Quy tắc: overhead mục tiêu < ~1-5% CPU, luôn đo baseline."
            - paragraph [ref=f81e3759]:
              - text: "Liên quan:"
              - link "Sampling vs instrumentation" [ref=f81e3760] [cursor=pointer]:
                - /url: "#sampling-vs-instrumentation"
              - text: ", Latency histogram,"
              - link "Observability" [ref=f81e3761] [cursor=pointer]:
                - /url: "#observability"
          - article [ref=f81e3762]:
            - heading "Zero-copy" [level=4] [ref=f81e3763]
            - paragraph [ref=f81e3764]: "còn gọi: không sao chép, sendfile, splice, MSG_ZEROCOPY"
            - paragraph [ref=f81e3765]:
              - generic [ref=f81e3766]: Vấn đề
              - text: Proxy/streaming server đẩy 10Gbps mà CPU 100% chỉ để copy dữ liệu qua lại giữa kernel buffer, user buffer, socket buffer — nội dung không đổi nhưng bị memcpy nhiều lần.
            - paragraph [ref=f81e3767]:
              - generic [ref=f81e3768]: Giải pháp
              - text: "Đưa dữ liệu từ đĩa/network thẳng sang socket (sendfile/splice/io_uring fixed buffers, RDMA/DPDK) không qua vùng đệm user-space. Tránh 2-3 lần memcpy + giảm cache pollution. Tradeoff: khó transform giữa chừng (nếu cần chỉnh byte thì phải copy), API phức tạp hơn."
            - paragraph [ref=f81e3769]:
              - text: "Liên quan:"
              - link "io_uring" [ref=f81e3770] [cursor=pointer]:
                - /url: "#io-uring"
              - text: ", Syscall batching, Compression"
        - generic [ref=f81e3771]:
          - heading "Phân tán & Đồng thời 12" [level=3] [ref=f81e3772]:
            - text: Phân tán & Đồng thời
            - generic [ref=f81e3773]: "12"
          - article [ref=f81e3774]:
            - heading "2PC/3PC & distributed transaction" [level=4] [ref=f81e3775]
            - paragraph [ref=f81e3776]: "còn gọi: two-phase commit, 2PC, three-phase commit, 3PC, distributed transaction"
            - paragraph [ref=f81e3777]:
              - generic [ref=f81e3778]: Vấn đề
              - text: "Transaction trải qua hai database/service (trừ tiền ở DB A, ghi sổ ở DB B): commit riêng lẻ thì A commit xong B fail là tiền biến mất. Cần tất cả cùng quyết định commit hoặc abort — nhưng 2PC blocking: sau khi participant đã vote yes mà coordinator chết, participant giữ lock chờ vô hạn, dòng đó bị khóa cả chục phút."
            - paragraph [ref=f81e3779]:
              - generic [ref=f81e3780]: Nguồn gốc
              - text: không rõ (được Bernstein, Hadzilacos & Goodman, 'Concurrency Control and Recovery in Database Systems' 1987 tài liệu hóa; thường ghi nhận từ công việc của Jim Gray cuối thập niên 1970, chưa verify trực tiếp).
            - paragraph [ref=f81e3781]:
              - generic [ref=f81e3782]: Giải pháp
              - text: "2PC: phase 1 prepare/vote, phase 2 broadcast commit/abort — an toàn nhưng blocking; 3PC thêm phase pre-commit với timeout để participant tự quyết định khi coordinator mất, giảm blocking (vẫn không an toàn tuyệt đối khi network partition)."
            - paragraph [ref=f81e3783]:
              - text: "Liên quan:"
              - link "Saga" [ref=f81e3784] [cursor=pointer]:
                - /url: "#saga"
              - text: ","
              - link "Consensus" [ref=f81e3785] [cursor=pointer]:
                - /url: "#consensus"
              - text: ","
              - link "Paxos" [ref=f81e3786] [cursor=pointer]:
                - /url: "#paxos"
          - article [ref=f81e3787]:
            - heading "Atomic operation & CAS" [level=4] [ref=f81e3788]
            - paragraph [ref=f81e3789]: "còn gọi: atomic, compare-and-swap, CMPXCHG, vận động nguyên tử"
            - paragraph [ref=f81e3790]:
              - generic [ref=f81e3791]: Vấn đề
              - text: "Muốn tăng biến đếm không cần mutex (mutex quá nặng hoặc muốn lock-free): đọc → +1 → ghi ba bước này bị ngắt giữa chừng thì hai thread đọc cùng giá trị cũ rồi ghi đè, mất lần tăng. Cần một thao tác mà CPU đảm bảo đọc-so sánh-ghi là một bước không thể chen ngang."
            - paragraph [ref=f81e3792]:
              - generic [ref=f81e3793]: Nguồn gốc
              - text: Có sẵn trong kiến trúc IBM 370 từ 1970; trên x86 là lệnh CMPXCHG; Maurice Herlihy (1991) chứng minh CAS mạnh hơn read/write/fetch-and-add đơn thuần.
            - paragraph [ref=f81e3794]:
              - generic [ref=f81e3795]: Giải pháp
              - text: CAS đọc giá trị hiện tại, nếu còn bằng giá trị mong đợi thì ghi giá trị mới, ngược lại báo thất bại để thread đọc lại và thử tiếp — mọi thao đổi luôn tính trên dữ liệu 'mới nhất', từ đó dựng được cấu trúc dữ liệu lock-free.
            - paragraph [ref=f81e3796]:
              - text: "Liên quan:"
              - link "Optimistic vs pessimistic locking" [ref=f81e3797] [cursor=pointer]:
                - /url: "#optimistic-vs-pessimistic-locking"
              - text: ","
              - link "Race condition" [ref=f81e3798] [cursor=pointer]:
                - /url: "#race-condition"
          - article [ref=f81e3799]:
            - heading "Distributed lock & fencing token" [level=4] [ref=f81e3800]
            - paragraph [ref=f81e3801]: "còn gọi: distributed lock, fencing token, Redlock, lease"
            - paragraph [ref=f81e3802]:
              - generic [ref=f81e3803]: Vấn đề
              - text: "Lock trong process local vô ích khi có nhiều instance cùng chạy job định kỳ. Đặt distributed lock vẫn chưa đủ: client giữ lock rồi bị GC pause hàng chục giây (trường hợp GitHub thực tế, packet delay ~90s), lease hết hạn, client khác acquire — hai bên cùng tin mình giữ lock và cùng ghi. Kiểm tra lease ngay trước khi ghi cũng vô dụng vì pause có thể xảy ra đúng thời điểm đó."
            - paragraph [ref=f81e3804]:
              - generic [ref=f81e3805]: Nguồn gốc
              - text: Martin Kleppmann, 'How to do distributed locking' (2016); lease phân tán do Cary Gray & David Cheriton đặt tên, paper SOSP 1989 về cache coherence.
            - paragraph [ref=f81e3806]:
              - generic [ref=f81e3807]: Giải pháp
              - text: Lock service cấp fencing token tăng dần theo mỗi lần acquire; storage từ chối mọi ghi có token nhỏ hơn token đã xử lý — client 'đông băng' cũ thức dậy cũng không thể ghi đè. ZooKeeper dùng zxid làm token; Redlock không có cơ chế này nên không an toàn cho critical section.
            - paragraph [ref=f81e3808]:
              - text: "Liên quan:"
              - link "Mutex & Semaphore" [ref=f81e3809] [cursor=pointer]:
                - /url: "#mutex-semaphore"
              - text: ","
              - link "Starvation & livelock" [ref=f81e3810] [cursor=pointer]:
                - /url: "#starvation-livelock"
              - text: ","
              - link "Split brain & quorum" [ref=f81e3811] [cursor=pointer]:
                - /url: "#split-brain-quorum"
          - article [ref=f81e3812]:
            - heading "Eventual consistency" [level=4] [ref=f81e3813]
            - paragraph [ref=f81e3814]: "còn gọi: nhất quán cuối cùng, anti-entropy"
            - paragraph [ref=f81e3815]:
              - generic [ref=f81e3816]: Vấn đề
              - text: "Ghi đa vùng: đồng bộ đồng nghĩa mỗi lần ghi phải chờ đủ replica — replica nào chậm hay partition là unavailable; không đồng bộ thì người ở London đọc được giá cũ mà người ở Tokyo vừa sửa. Giữ cả availability lẫn đồng nhất tại mọi thời điểm là bất khả thi."
            - paragraph [ref=f81e3817]:
              - generic [ref=f81e3818]: Nguồn gốc
              - text: Hệ thống Bayou (Terry et al., 1995) là ví dụ sớm; thuật ngữ được Werner Vogels phổ biến qua 'Eventually Consistent' (ACM Queue 2008 / CACM 2009).
            - paragraph [ref=f81e3819]:
              - generic [ref=f81e3820]: Giải pháp
              - text: Ghi cục bộ rồi lan truyền bất đồng bộ (gossip, anti-entropy, read/write repair), xung đột phân xử bằng last-writer-wins hoặc CRDT — cam kết duy nhất là khi ngừng ghi, mọi replica hội tụ; trong lúc chờ thì đọc được giá trị trung gian.
            - paragraph [ref=f81e3821]:
              - text: "Liên quan:"
              - link "CAP theorem" [ref=f81e3822] [cursor=pointer]:
                - /url: "#cap-theorem"
              - text: ","
              - link "Gossip protocol" [ref=f81e3823] [cursor=pointer]:
                - /url: "#gossip-protocol"
              - text: ","
              - link "CRDT" [ref=f81e3824] [cursor=pointer]:
                - /url: "#crdt"
          - article [ref=f81e3825]:
            - heading "Gossip protocol" [level=4] [ref=f81e3826]
            - paragraph [ref=f81e3827]: "còn gọi: gossip, epidemic protocol, anti-entropy, phân phối lan truyền"
            - paragraph [ref=f81e3828]:
              - generic [ref=f81e3829]: Vấn đề
              - text: "Cluster vài trăm node cần lan truyền membership/tình trạng: mỗi node broadcast O(n) tin nhắn thì tổng O(n²), một node chết làm cả push gãy; còn đặt coordinator trung tâm thì nó thành điểm lỗi đơn (SPOF) và bottleneck."
            - paragraph [ref=f81e3830]:
              - generic [ref=f81e3831]: Nguồn gốc
              - text: Demers, Greene, Hauser, Irish & Larson, 'Epidemic algorithms for replicated database maintenance', PODC 1987.
            - paragraph [ref=f81e3832]:
              - generic [ref=f81e3833]: Giải pháp
              - text: Mỗi vòng, node chọn ngẫu nhiên vài peer để trao đổi/chênh lệch state — thông tin lan như dịch bệnh, đến mọi node trong O(log n) lượt, chấp nhận packet loss và membership thay đổi (AWS S3, Cassandra, Serf).
            - paragraph [ref=f81e3834]:
              - text: "Liên quan:"
              - link "Consistent hashing" [ref=f81e3835] [cursor=pointer]:
                - /url: "#consistent-hashing"
              - text: ","
              - link "Eventual consistency" [ref=f81e3836] [cursor=pointer]:
                - /url: "#eventual-consistency"
              - text: ","
              - link "Leader election" [ref=f81e3837] [cursor=pointer]:
                - /url: "#leader-election"
          - article [ref=f81e3838]:
            - heading "Idempotency & delivery semantics" [level=4] [ref=f81e3839]
            - paragraph [ref=f81e3840]: "còn gọi: idempotency, idempotent, at-least-once, at-most-once, exactly-once, Idempotency-Key"
            - paragraph [ref=f81e3841]:
              - generic [ref=f81e3842]: Vấn đề
              - text: "Client gọi API trừ tiền rồi timeout — không biết server đã xử lý hay chưa nên phải retry; nếu endpoint không idempotent thì retry sinh 2 lần trừ tiền. Tương tự với broker: at-most-once (gửi rồi quên) thì mất event khi crash giữa chừng; at-least-once thì redelivery làm consumer xử lý 2 lần. Mạng không bao giờ cho biết chắc 'gói tin đã đến hay chưa'."
            - paragraph [ref=f81e3843]:
              - generic [ref=f81e3844]: Nguồn gốc
              - text: "Thuật ngữ idempotence do nhà toán học Benjamin Peirce đặt năm 1870; ngữ nghĩa HTTP (GET/PUT/DELETE idempotent, POST không) do RFC 7231 quy định. Delivery semantics: không rõ tác giả đầu tiên."
            - paragraph [ref=f81e3845]:
              - generic [ref=f81e3846]: Giải pháp
              - text: At-least-once + idempotent consumer (dedupe theo message ID hoặc Idempotency-Key ghi lại kết quả cũ) cho praktikal exactly-once; at-most-once chỉ dùng khi mất nhẹ hơn lặp (metrics, log). Thiết kế API theo PUT/DELETE theo ID để lặp vẫn cho cùng kết quả.
            - paragraph [ref=f81e3847]:
              - text: "Liên quan:"
              - link "Saga" [ref=f81e3848] [cursor=pointer]:
                - /url: "#saga"
              - text: ", 2PC/3PC,"
              - link "Optimistic vs pessimistic locking" [ref=f81e3849] [cursor=pointer]:
                - /url: "#optimistic-vs-pessimistic-locking"
          - article [ref=f81e3850]:
            - heading "Leader election" [level=4] [ref=f81e3851]
            - paragraph [ref=f81e3852]: "còn gọi: bầu lãnh đạo, single master"
            - paragraph [ref=f81e3853]:
              - generic [ref=f81e3854]: Vấn đề
              - text: Cluster cần một coordinator duy nhất (ghi log, điều phối job) nhưng không node nào biết leader hiện tại còn sống hay đã chết — nếu hai node cùng tự nhận là leader thì write đi hai hướng, duplication job; không ai nhận thì cluster bất động.
            - paragraph [ref=f81e3855]:
              - generic [ref=f81e3856]: Nguồn gốc
              - text: LeLann chuẩn thức hóa bài toán (mất token trong ring); Chang & Roberts 1979 (ring, highest-ID); GHS (Gallager, Humblet, Spira) 1983 — đoạt Dijkstra Prize.
            - paragraph [ref=f81e3857]:
              - generic [ref=f81e3858]: Giải pháp
              - text: "Thuật toán bầu chọn đảm bảo hai điều kiện: uniqueness (đúng một node tự nhận là leader) và agreement (các node còn lạiđều biết leader là ai) — qua token ring, hay lease-based (ZooKeeper ephemeral node, etcd lease) để leader chết thì lease hết hạn và bầu lại."
            - paragraph [ref=f81e3859]:
              - text: "Liên quan:"
              - link "Consensus" [ref=f81e3860] [cursor=pointer]:
                - /url: "#consensus"
              - text: ","
              - link "Raft" [ref=f81e3861] [cursor=pointer]:
                - /url: "#raft"
              - text: ","
              - link "Distributed lock & fencing token" [ref=f81e3862] [cursor=pointer]:
                - /url: "#distributed-lock-fencing-token"
          - article [ref=f81e3863]:
            - heading "Optimistic vs pessimistic locking" [level=4] [ref=f81e3864]
            - paragraph [ref=f81e3865]: "còn gọi: optimistic locking, pessimistic locking, SELECT FOR UPDATE, version field"
            - paragraph [ref=f81e3866]:
              - generic [ref=f81e3867]: Vấn đề
              - text: "Ghi cùng một bản ghi: pessimistic lock (SELECT FOR UPDATE) giữ lock từ đầu → dưới tải cao, các transaction khác xếp hàng chỉ để đọc, throughput tụt. Optimistic thì cứ đọc-tính-ghi rồi kiểm tra ở commit — nhưng hai bên cùng sửa một dòng thì một bên phải làm lại toàn bộ, client không hiểu vì sao retry."
            - paragraph [ref=f81e3868]:
              - generic [ref=f81e3869]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e3870]:
              - generic [ref=f81e3871]: Giải pháp
              - text: "Pessimistic: khóa trước khi sửa, an toàn nhưng dễ tắc khi xung đột nhiều; optimistic: đọc không khóa, kèm version/ETag, lúc ghi phát hiện version cũ thì reject và retry — phù hợp xung đột hiếm."
            - paragraph [ref=f81e3872]:
              - text: "Liên quan:"
              - link "Atomic operation & CAS" [ref=f81e3873] [cursor=pointer]:
                - /url: "#atomic-operation-cas"
              - text: ","
              - link "Race condition" [ref=f81e3874] [cursor=pointer]:
                - /url: "#race-condition"
              - text: ","
              - link "Idempotency & delivery semantics" [ref=f81e3875] [cursor=pointer]:
                - /url: "#idempotency-delivery-semantics"
          - article [ref=f81e3876]:
            - heading "Saga" [level=4] [ref=f81e3877]
            - paragraph [ref=f81e3878]: "còn gọi: saga pattern, compensating transaction, giao dịch bù trừ, choreography vs orchestration"
            - paragraph [ref=f81e3879]:
              - generic [ref=f81e3880]: Vấn đề
              - text: Microservices mỗi service một database riêng nên không dùng ACID xuyên services; mà giữ lock kiểu 2PC suốt một business flow dài (đặt vé → thanh toán → xuất vé) thì lock giữ hàng giây-phút, block dữ liệu khác, và coordinator chết là cả flow treo chờ.
            - paragraph [ref=f81e3881]:
              - generic [ref=f81e3882]: Nguồn gốc
              - text: Hector Garcia-Molina & Kenneth Salem, 'Sagas', SIGMOD 1987 (Princeton, 1/1987).
            - paragraph [ref=f81e3883]:
              - generic [ref=f81e3884]: Giải pháp
              - text: "Chia transaction thành chuỗi local transaction, bước sau chạy khi bước trước phát event báo thành công; nếu bước nào fail thì chạy compensating transaction (hoàn tiền, hủy chỗ) để bù trừ về trạng thái nhất quán — thay vì rollback. Trao đổi: không có isolation, phải chống xung đột giữa các saga chạy song song."
            - paragraph [ref=f81e3885]:
              - text: "Liên quan: 2PC/3PC,"
              - link "Idempotency & delivery semantics" [ref=f81e3886] [cursor=pointer]:
                - /url: "#idempotency-delivery-semantics"
              - text: ","
              - link "Eventual consistency" [ref=f81e3887] [cursor=pointer]:
                - /url: "#eventual-consistency"
              - text: ","
              - link "Event-driven architecture" [ref=f81e3888] [cursor=pointer]:
                - /url: "#event-driven-architecture"
              - text: ","
              - link "Transactional outbox" [ref=f81e3889] [cursor=pointer]:
                - /url: "#transactional-outbox"
              - text: ","
              - link "Idempotent consumer" [ref=f81e3890] [cursor=pointer]:
                - /url: "#idempotent-consumer"
          - article [ref=f81e3891]:
            - heading "Split brain & quorum" [level=4] [ref=f81e3892]
            - paragraph [ref=f81e3893]: "còn gọi: split-brain, brain split, quorum, majority quorum"
            - paragraph [ref=f81e3894]:
              - generic [ref=f81e3895]: Vấn đề
              - text: "HA cluster mất nhau vì đường heartbeat chết nhưng process vẫn sống: hai node tự cho mình là master, cùng nhận ghi, dữ liệu hai bên lệch nhau — lúc heal là corrupt, phải operator can thiệp tay. Cụm 2 node không có witness thì không ai quyết định được ai là 'đúng'."
            - paragraph [ref=f81e3896]:
              - generic [ref=f81e3897]: Nguồn gốc
              - text: Quorum (weighted voting) do David Gifford đề xuất, 'Weighted voting for replicated data', 1979; thuật ngữ split-brain thuộc vận hành cluster HA, không rõ tác giả đầu tiên.
            - paragraph [ref=f81e3898]:
              - generic [ref=f81e3899]: Giải pháp
              - text: "Quorum: chỉ nhóm giữ đa số phiếu mới được active, nhóm còn lại auto-fence; điều kiện Vw > N/2 khiến hai nhóm 'đa số' không thể cùng tồn tại (MongoDB replica set, Galera). Hy sinh availability của nhóm thiểu số để giữ consistency."
            - paragraph [ref=f81e3900]:
              - text: "Liên quan:"
              - link "CAP theorem" [ref=f81e3901] [cursor=pointer]:
                - /url: "#cap-theorem"
              - text: ","
              - link "Consensus" [ref=f81e3902] [cursor=pointer]:
                - /url: "#consensus"
              - text: ","
              - link "Distributed lock & fencing token" [ref=f81e3903] [cursor=pointer]:
                - /url: "#distributed-lock-fencing-token"
          - article [ref=f81e3904]:
            - heading "Starvation & livelock" [level=4] [ref=f81e3905]
            - paragraph [ref=f81e3906]: "còn gọi: starvation, livelock, đói, treo động"
            - paragraph [ref=f81e3907]:
              - generic [ref=f81e3908]: Vấn đề
              - text: "Lock không fair: thread cũ bị thread mới liên tục giành mất nên không bao giờ được chạy (starvation) — ví dụ worker mãi không nhận được job. Livelock thì ngược lại: hai thread liên tục nhường nhau, cùng thả lock rồi retry cùng lúc, đổi trạng thái mãi nhưng không ai tiến — giống hai người tránh nhau cùng nghiêng cùng hướng."
            - paragraph [ref=f81e3909]:
              - generic [ref=f81e3910]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e3911]:
              - generic [ref=f81e3912]: Giải pháp
              - text: "Starvation: hàng đợi fair/fifo, chia đều tài nguyên, aging ưu tiên dần; livelock: thêm ngẫu nhiên hoặc backoff (exponential + jitter) khi retry để phá nhịp đồng bộ."
            - paragraph [ref=f81e3913]:
              - text: "Liên quan:"
              - link "Deadlock" [ref=f81e3914] [cursor=pointer]:
                - /url: "#deadlock"
              - text: ","
              - link "Race condition" [ref=f81e3915] [cursor=pointer]:
                - /url: "#race-condition"
              - text: ","
              - link "Distributed lock & fencing token" [ref=f81e3916] [cursor=pointer]:
                - /url: "#distributed-lock-fencing-token"
          - article [ref=f81e3917]:
            - heading "Thread pool & pool exhaustion" [level=4] [ref=f81e3918]
            - paragraph [ref=f81e3919]: "còn gọi: thread pool, hàng đợi luồng, pool exhaustion, cạn kiệt thread"
            - paragraph [ref=f81e3920]:
              - generic [ref=f81e3921]: Vấn đề
              - text: "Mỗi request tạo một thread mới: 10k request đồng thời thì RAM cạn vì mỗi thread chiếm stack, kernel tay trắng với context switch. Nhưng set pool quá nhỏ thì request xếp hàng timeout; tệ hơn — pool cạn kiệt khi mọi thread cùng mắc trên I/O chậm (DB treo), không còn thread nào cho request mới, toàn service đứng im dù CPU còn rảnh."
            - paragraph [ref=f81e3922]:
              - generic [ref=f81e3923]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e3924]:
              - generic [ref=f81e3925]: Giải pháp
              - text: Giữ cố định N thread làm việc từ hàng đợi task; hàng đợi có giới hạn (bounded) + backpressure để từ chối/đẩy chậm khi quá tải thay vì nhận vô hạn và OOM.
            - paragraph [ref=f81e3926]:
              - text: "Liên quan:"
              - link "Event loop" [ref=f81e3927] [cursor=pointer]:
                - /url: "#event-loop"
              - text: ","
              - link "Concurrency vs Parallelism" [ref=f81e3928] [cursor=pointer]:
                - /url: "#concurrency-vs-parallelism"
              - text: ","
              - link "Deadlock" [ref=f81e3929] [cursor=pointer]:
                - /url: "#deadlock"
        - generic [ref=f81e3930]:
          - heading "Messaging & Bất đồng bộ 8" [level=3] [ref=f81e3931]:
            - text: Messaging & Bất đồng bộ
            - generic [ref=f81e3932]: "8"
          - article [ref=f81e3933]:
            - heading "Competing consumers" [level=4] [ref=f81e3934]
            - paragraph [ref=f81e3935]: "còn gọi: competing-consumers, visibility timeout, PeekLock"
            - paragraph [ref=f81e3936]:
              - generic [ref=f81e3937]: Vấn đề
              - text: "Một consumer duy nhất bị chặn bởi một máy: đỉnh 500 msg/s trong khi worker xử lý 50/s thì backlog phình; thêm instance thứ hai mà không cơ chế phân phát thì hai đứa cùng lấy cùng một tin nhắn → xử lý trùng."
            - paragraph [ref=f81e3938]:
              - generic [ref=f81e3939]: Giải pháp
              - text: Nhiều consumer cùng pull một queue, broker phân phát mỗi tin nhắn cho đúng một người; SQS dùng visibility timeout (ẩn tin nhắn trong lúc xử lý, hết timeout mà chưa ack thì hiện lại), Service Bus dùng PeekLock.
            - paragraph [ref=f81e3940]:
              - text: "Liên quan:"
              - link "Message queue" [ref=f81e3941] [cursor=pointer]:
                - /url: "#message-queue"
              - text: ","
              - link "Idempotent consumer" [ref=f81e3942] [cursor=pointer]:
                - /url: "#idempotent-consumer"
              - text: ", RabbitMQ"
          - article [ref=f81e3943]:
            - heading "Dead letter queue" [level=4] [ref=f81e3944]
            - paragraph [ref=f81e3945]: "còn gọi: DLQ, dead-letter queue, hàng đợi thư chết"
            - paragraph [ref=f81e3946]:
              - generic [ref=f81e3947]: Vấn đề
              - text: Tin nhắn JSON hỏng bị worker từ chối rồi broker trả lại mãi — nó quay vòng vô hạn, chiếm slot xử lý, log tràn và cảnh báo spam trong khi các tin tốt phía sau không được đụng tới.
            - paragraph [ref=f81e3948]:
              - generic [ref=f81e3949]: Giải pháp
              - text: Đếm số lần nhận thất bại, quá ngưỡng (maxReceiveCount) thì chuyển tin sang DLQ riêng; operator inspect log, chẩn đoán, fix root cause rồi redrive về queue chính.
            - paragraph [ref=f81e3950]:
              - text: "Liên quan:"
              - link "Poison message" [ref=f81e3951] [cursor=pointer]:
                - /url: "#poison-message"
              - text: ","
              - link "Retry với exponential backoff & jitter" [ref=f81e3952] [cursor=pointer]:
                - /url: "#retry-vo-i-exponential-backoff-jitter"
              - text: ","
              - link "Idempotent consumer" [ref=f81e3953] [cursor=pointer]:
                - /url: "#idempotent-consumer"
          - article [ref=f81e3954]:
            - heading "Delayed queue" [level=4] [ref=f81e3955]
            - paragraph [ref=f81e3956]: "còn gọi: scheduled message, delay queue, tin nhắn hẹn giờ"
            - paragraph [ref=f81e3957]:
              - generic [ref=f81e3958]: Vấn đề
              - text: Đơn hết hạn thanh toán sau 30 phút phải tự hủy — worker sleep 30 phút thì chiếm thread và mất job khi crash; poll DB mỗi phút thì tốn query và trễ tùy tần suất.
            - paragraph [ref=f81e3959]:
              - generic [ref=f81e3960]: Giải pháp
              - text: Đặt thời gian available trên tin nhắn (hoặc queue riêng có độ trễ), broker/worker chỉ trả tin về khi tới hạn — không chiếm tài nguyên trong lúc chờ.
            - paragraph [ref=f81e3961]:
              - text: "Liên quan: Cron / Job scheduler,"
              - link "Message queue" [ref=f81e3962] [cursor=pointer]:
                - /url: "#message-queue"
              - text: ","
              - link "Priority queue" [ref=f81e3963] [cursor=pointer]:
                - /url: "#priority-queue"
          - article [ref=f81e3964]:
            - heading "Event-driven architecture" [level=4] [ref=f81e3965]
            - paragraph [ref=f81e3966]: "còn gọi: event, domain event, sự kiện, event-driven, EDA"
            - paragraph [ref=f81e3967]:
              - generic [ref=f81e3968]: Vấn đề
              - text: "Kiến trúc gọi nhau tuần tự A→B→C: thêm bước D phải sửa service A, service B chậm làm timeout cả chuỗi, và mọi service phải biết địa chỉ service khác — coupling tăng theo mỗi bước và khó test."
            - paragraph [ref=f81e3969]:
              - generic [ref=f81e3970]: Nguồn gốc
              - text: Brenda M. Michelson viết tổng quan EDA có ảnh hưởng (2006); Udi Dahan gắn EDA với SOA
            - paragraph [ref=f81e3971]:
              - generic [ref=f81e3972]: Giải pháp
              - text: "Service phát event (điều đã xảy ra, ví dụ 'đơn đã tạo') vào kênh; consumer tự subscribe và phản ứng — thêm consumer mới không sửa producer, thất bại phía consumer không kéo sập phía sinh event; đánh đổi: phức tạp và khó test hơn request/response."
            - paragraph [ref=f81e3973]:
              - text: "Liên quan:"
              - link "Pub/Sub" [ref=f81e3974] [cursor=pointer]:
                - /url: "#pub-sub"
              - text: ","
              - link "Event sourcing" [ref=f81e3975] [cursor=pointer]:
                - /url: "#event-sourcing"
              - text: ","
              - link "Saga" [ref=f81e3976] [cursor=pointer]:
                - /url: "#saga"
              - text: ","
              - link "Transactional outbox" [ref=f81e3977] [cursor=pointer]:
                - /url: "#transactional-outbox"
          - article [ref=f81e3978]:
            - heading "Poison message" [level=4] [ref=f81e3979]
            - paragraph [ref=f81e3980]: "còn gọi: tin nhắn độc, message độc"
            - paragraph [ref=f81e3981]:
              - generic [ref=f81e3982]: Vấn đề
              - text: Một tin sai schema làm worker throw ngay từ dòng parse — mỗi lần redelivery là mỗi lần crash hoặc treo, consumer group không tiến lên vì lặp mãi lỗi y hệt, chặn cả partition/queue phía sau.
            - paragraph [ref=f81e3983]:
              - generic [ref=f81e3984]: Giải pháp
              - text: Đánh dấu poison sau N lần fail, tách hẳn khỏi luồng chính (chuyển DLQ + báo alert), chờ fix dữ liệu hoặc fix code rồi xử lý lại có kiểm soát.
            - paragraph [ref=f81e3985]:
              - text: "Liên quan:"
              - link "Dead letter queue" [ref=f81e3986] [cursor=pointer]:
                - /url: "#dead-letter-queue"
              - text: ","
              - link "Retry với exponential backoff & jitter" [ref=f81e3987] [cursor=pointer]:
                - /url: "#retry-vo-i-exponential-backoff-jitter"
              - text: ","
              - link "Message queue" [ref=f81e3988] [cursor=pointer]:
                - /url: "#message-queue"
          - article [ref=f81e3989]:
            - heading "Priority queue" [level=4] [ref=f81e3990]
            - paragraph [ref=f81e3991]: "còn gọi: hàng đợi ưu tiên"
            - paragraph [ref=f81e3992]:
              - generic [ref=f81e3993]: Vấn đề
              - text: Khi backlog 10 nghìn job, FIFO xử lý log crawl 200MB trước trong khi request thanh toán của khách chờ phía sau — coi mọi job ngang hàng là sai khi chúng không ngang giá trị.
            - paragraph [ref=f81e3994]:
              - generic [ref=f81e3995]: Giải pháp
              - text: Xếp theo mức ưu tiên, dequeue phần tử cao nhất trước (heap); broker thì tách channel ưu tiên cao/thấp hoặc dùng field priority — chấp nhận starve job thấp nếu job cao đến liên tục.
            - paragraph [ref=f81e3996]:
              - text: "Liên quan:"
              - link "Message queue" [ref=f81e3997] [cursor=pointer]:
                - /url: "#message-queue"
              - text: ", Cron / Job scheduler,"
              - link "FIFO / Message ordering" [ref=f81e3998] [cursor=pointer]:
                - /url: "#fifo-message-ordering"
          - article [ref=f81e3999]:
            - heading "RabbitMQ (AMQP)" [level=4] [ref=f81e4000]
            - paragraph [ref=f81e4001]: "còn gọi: RabbitMQ, AMQP"
            - paragraph [ref=f81e4002]:
              - generic [ref=f81e4003]: Vấn đề
              - text: Team cần broker tin cậy tự host với ack rõ ràng, routing linh động, failover khi node chết — nhưng middleware thời trước mỗi hãng một giao thức proprietary, team Java mua MQ của hãng này thì team Go không nối được (lock-in vendor).
            - paragraph [ref=f81e4004]:
              - generic [ref=f81e4005]: Nguồn gốc
              - text: Rabbit Technologies Ltd. (liên doanh LShift + CohesiveFT), 2007, viết bằng Erlang; giao thức AMQP do John O'Hara khởi xướng tại JPMorgan Chase London năm 2003
            - paragraph [ref=f81e4006]:
              - generic [ref=f81e4007]: Giải pháp
              - text: "Broker viết bằng Erlang implement AMQP: exchange route tin theo binding vào queue, consumer ack khi xử lý xong (không ack → redeliver), clustering failover; plugin mở rộng STOMP/MQTT/management."
            - paragraph [ref=f81e4008]:
              - text: "Liên quan:"
              - link "Message broker" [ref=f81e4009] [cursor=pointer]:
                - /url: "#message-broker"
              - text: ","
              - link "Dead letter queue" [ref=f81e4010] [cursor=pointer]:
                - /url: "#dead-letter-queue"
              - text: ","
              - link "Apache Kafka" [ref=f81e4011] [cursor=pointer]:
                - /url: "#apache-kafka"
              - text: ","
              - link "Pub/Sub" [ref=f81e4012] [cursor=pointer]:
                - /url: "#pub-sub"
          - article [ref=f81e4013]:
            - heading "Server-Sent Events (SSE)" [level=4] [ref=f81e4014]
            - paragraph [ref=f81e4015]: "còn gọi: SSE, EventSource, text/event-stream"
            - paragraph [ref=f81e4016]:
              - generic [ref=f81e4017]: Vấn đề
              - text: Server cần đẩy stream một chiều (dashboard giá, log, token LLM) — WebSocket quá nặng vì phải tự viết heartbeat/reconnect/binary framing và dễ bị proxy chặn; polling thì chậm và tốn request.
            - paragraph [ref=f81e4018]:
              - generic [ref=f81e4019]: Giải pháp
              - text: Response HTTP với Content-Type text/event-stream, server ghi event liên tục; EventSource API tự reconnect và gửi header Last-Event-ID để tiếp tục từ chỗ đứt; HTTP/2 cho phép multiplex nhiều stream.
            - paragraph [ref=f81e4020]:
              - text: "Liên quan:"
              - link "Polling" [ref=f81e4021] [cursor=pointer]:
                - /url: "#polling"
              - text: ","
              - link "WebSocket" [ref=f81e4022] [cursor=pointer]:
                - /url: "#websocket"
              - text: ","
              - link "Fan-out / Fan-in" [ref=f81e4023] [cursor=pointer]:
                - /url: "#fan-out-fan-in"
        - generic [ref=f81e4024]:
          - heading "Kiến trúc & Khả năng mở rộng 10" [level=3] [ref=f81e4025]:
            - text: Kiến trúc & Khả năng mở rộng
            - generic [ref=f81e4026]: "10"
          - article [ref=f81e4027]:
            - heading "12-Factor App" [level=4] [ref=f81e4028]
            - paragraph [ref=f81e4029]: "còn gọi: ứng dụng 12 yếu tố"
            - paragraph [ref=f81e4030]:
              - generic [ref=f81e4031]: Vấn đề
              - text: App chạy tốt trên máy dev nhưng fail khi lên production vì phụ thuộc config file local, file system, state lưu trên disk, version khác nhau giữa môi trường dev và prod. 12-factor ra đời như checklist để app chạy được trên mọi cloud PaaS mà không sửa code.
            - paragraph [ref=f81e4032]:
              - generic [ref=f81e4033]: Nguồn gốc
              - text: Adam Wiggins (Heroku/Salesforce) công bố năm 2011, tổng kết từ kinh nghiệm deploy hàng trăm ngàn app trên Heroku; format lấy cảm hứng từ sách của Martin Fowler.
            - paragraph [ref=f81e4034]:
              - generic [ref=f81e4035]: Giải pháp
              - text: "12 nguyên tắc: codebase duy nhất, dependency khai báo rõ, config lưu env, backing service là resource, build/release/run tách biệt, process stateless, port binding, concurrency, disposability, dev/prod parity, logs là event stream, admin process chạy một lần."
            - paragraph [ref=f81e4036]:
              - text: "Liên quan:"
              - link "serverless" [ref=f81e4037] [cursor=pointer]:
                - /url: "#serverless"
              - text: ", container,"
              - link "monolith" [ref=f81e4038] [cursor=pointer]:
                - /url: "#monolith"
          - article [ref=f81e4039]:
            - heading "API Gateway" [level=4] [ref=f81e4040]
            - paragraph [ref=f81e4041]: "còn gọi: cổng API"
            - paragraph [ref=f81e4042]:
              - generic [ref=f81e4043]: Vấn đề
              - text: Mobile client cần gọi 5 microservice để render một màn hình (user, order, product, review, recommendation) — 5 round-trip qua mạng chậm. API gateway ra đời như entry point duy nhất, gom tất cả lời gọi backend thành 1 request cho client, đồng thời lo auth, rate limit, SSL termination.
            - paragraph [ref=f81e4044]:
              - generic [ref=f81e4045]: Nguồn gốc
              - text: Pattern được Chris Richardson mô tả trong microservices.io; Netflix API Gateway (2012-2013) là một trong những triển khai nổi tiếng đầu tiên.
            - paragraph [ref=f81e4046]:
              - generic [ref=f81e4047]: Giải pháp
              - text: "Nhận request từ client, route tới service phù hợp, gom response, trả về client. Cũng là nơi đặt cross-cutting concern: authentication, rate limiting, logging, request validation, TLS termination."
            - paragraph [ref=f81e4048]:
              - text: "Liên quan: BFF, load balancer,"
              - link "microservices" [ref=f81e4049] [cursor=pointer]:
                - /url: "#microservices"
          - article [ref=f81e4050]:
            - heading "Autoscaling" [level=4] [ref=f81e4051]
            - paragraph [ref=f81e4052]: "còn gọi: tự động co giãn"
            - paragraph [ref=f81e4053]:
              - generic [ref=f81e4054]: Vấn đề
              - text: Traffic biến động theo giờ (cao điểm trưa, thấp đêm). Provision cho peak thì lãng phí 70% thời gian; provision cho trung bình thì sập lúc peak. Autoscaling ra đời để tự động thêm/bớt server theo metric (CPU, request rate, queue depth).
            - paragraph [ref=f81e4055]:
              - generic [ref=f81e4056]: Nguồn gốc
              - text: AWS Auto Scaling ra mắt năm 2006 cùng EC2; khái niệm elastic computing phổ biến từ đó.
            - paragraph [ref=f81e4057]:
              - generic [ref=f81e4058]: Giải pháp
              - text: "Đặt policy: khi CPU > 70% trong 5 phút thì thêm instance; khi < 30% thì bớt. Kết hợp health check để chỉ route traffic vào instance đã sẵn sàng, và cooldown để tránh scale oscillation."
            - paragraph [ref=f81e4059]:
              - text: "Liên quan: horizontal scaling, load balancer,"
              - link "serverless" [ref=f81e4060] [cursor=pointer]:
                - /url: "#serverless"
          - article [ref=f81e4061]:
            - heading "Edge Computing" [level=4] [ref=f81e4062]
            - paragraph [ref=f81e4063]: "còn gọi: điện toán biên"
            - paragraph [ref=f81e4064]:
              - generic [ref=f81e4065]: Vấn đề
              - text: Camera giao thông phát hiện tai nạn cần phản ứng trong 50ms, nhưng gửi video lên cloud rồi nhận lệnh về mất 300ms — trễ không chấp nhận được. IoT xả hàng GB data mỗi phút thì băng thông gửi hết về cloud cũng không chịu nổi. Edge computing ra đời để xử lý data ngay tại nơi phát sinh.
            - paragraph [ref=f81e4066]:
              - generic [ref=f81e4067]: Nguồn gốc
              - text: Thuật ngữ xuất hiện từ những năm 1990s để chỉ CDN; được Karim Arabi (Qualcomm) định nghĩa tại keynote IEEE DAC 2014 và seminar MIT 2015.
            - paragraph [ref=f81e4068]:
              - generic [ref=f81e4069]: Giải pháp
              - text: "Đặt compute và storage gần user/device hơn: edge server (Cloudflare Workers, AWS Lambda@Edge), edge gateway (IoT), hoặc on-premise. Giảm latency, tiết kiệm bandwidth, data nhạy cảm không rời khỏi region (privacy)."
            - paragraph [ref=f81e4070]:
              - text: "Liên quan:"
              - link "CDN" [ref=f81e4071] [cursor=pointer]:
                - /url: "#cdn"
              - text: ", latency, IoT"
          - article [ref=f81e4072]:
            - heading "Event Bus" [level=4] [ref=f81e4073]
            - paragraph [ref=f81e4074]: "còn gọi: tuyến sự kiện, message broker"
            - paragraph [ref=f81e4075]:
              - generic [ref=f81e4076]: Vấn đề
              - text: Service A cần báo cho B, C, D biết 'đơn hàng đã thanh toán' — nhưng A không nên biết B/C/D là ai (thêm service E thì A phải sửa code). Event bus ra đời để A chỉ publish sự kiện vào một nơi trung gian, ai quan tâm thì tự subscribe.
            - paragraph [ref=f81e4077]:
              - generic [ref=f81e4078]: Nguồn gốc
              - text: "Khái niệm từ event-driven architecture và pub-sub pattern; implementation phổ biến: RabbitMQ (2007), Kafka (LinkedIn, 2011), AWS SNS/SQS, Azure Event Grid."
            - paragraph [ref=f81e4079]:
              - generic [ref=f81e4080]: Giải pháp
              - text: "Producer publish event vào bus. Bus phân phối cho subscriber đã đăng ký. Subscriber không biết producer và ngược lại. 2 mô hình: pub-sub (fan-out, không lưu) và event streaming (Kafka — log lưu bền, replay được)."
            - paragraph [ref=f81e4081]:
              - text: "Liên quan: event-driven,"
              - link "orchestration vs choreography" [ref=f81e4082] [cursor=pointer]:
                - /url: "#orchestration-vs-choreography"
              - text: ","
              - link "message queue" [ref=f81e4083] [cursor=pointer]:
                - /url: "#message-queue"
          - article [ref=f81e4084]:
            - heading "FaaS (Function as a Service)" [level=4] [ref=f81e4085]
            - paragraph [ref=f81e4086]: "còn gọi: hàm như dịch vụ"
            - paragraph [ref=f81e4087]:
              - generic [ref=f81e4088]: Vấn đề
              - text: Cần chạy logic ngắn (xử lý webhook, transform data, cron job) mà không muốn duy trì một server luôn chạy. FaaS ra đời để mỗi function chạy khi có sự kiện, tự động scale, tắt ngay khi xong.
            - paragraph [ref=f81e4089]:
              - generic [ref=f81e4090]: Nguồn gốc
              - text: AWS Lambda (2014) là sản phẩm FaaS phổ biến đầu tiên; trước đó có Google App Engine (2008) và PiCloud nhưng chưa đúng nghĩa FaaS.
            - paragraph [ref=f81e4091]:
              - generic [ref=f81e4092]: Giải pháp
              - text: Dev viết function với signature nhận event, trả về result. Provider bind function với trigger (HTTP, queue, schedule). Mỗi invocation chạy trong container ephemeral — sinh ra khi có request, chết khi xong (gây cold start).
            - paragraph [ref=f81e4093]:
              - text: "Liên quan:"
              - link "serverless" [ref=f81e4094] [cursor=pointer]:
                - /url: "#serverless"
              - text: ","
              - link "event bus" [ref=f81e4095] [cursor=pointer]:
                - /url: "#event-bus"
              - text: ", cold start"
          - article [ref=f81e4096]:
            - heading "Modular Monolith" [level=4] [ref=f81e4097]
            - paragraph [ref=f81e4098]: "còn gọi: modularized monolith"
            - paragraph [ref=f81e4099]:
              - generic [ref=f81e4100]: Vấn đề
              - text: Team muốn có cấu trúc rõ ràng như microservices nhưng chưa sẵn sàng trả giá vận hành hàng chục service (deploy, monitoring, network latency). Modular monolith ra đời để giữ lợi ích của monolith (deploy đơn giản, debug dễ) nhưng có boundary rõ giữa các module để sau này tách ra dễ.
            - paragraph [ref=f81e4101]:
              - generic [ref=f81e4102]: Nguồn gốc
              - text: Martin Fowler phổ biến khái niệm 'MonolithFirst' (2015); thuật ngữ 'modular monolith' được cộng đồng dùng rộng từ ~2017-2020.
            - paragraph [ref=f81e4103]:
              - generic [ref=f81e4104]: Giải pháp
              - text: Chia codebase thành các module có boundary rõ (interface, dependency rule), chạy chung process và DB, nhưng các module giao tiếp qua API nội bộ thay vì gọi trực tiếp hàm.
            - paragraph [ref=f81e4105]:
              - text: "Liên quan:"
              - link "monolith" [ref=f81e4106] [cursor=pointer]:
                - /url: "#monolith"
              - text: ","
              - link "microservices" [ref=f81e4107] [cursor=pointer]:
                - /url: "#microservices"
              - text: ","
              - link "bounded context" [ref=f81e4108] [cursor=pointer]:
                - /url: "#bounded-context"
          - article [ref=f81e4109]:
            - heading "Multi-Tenancy" [level=4] [ref=f81e4110]
            - paragraph [ref=f81e4111]: "còn gọi: đa khách hàng, multi-tenant"
            - paragraph [ref=f81e4112]:
              - generic [ref=f81e4113]: Vấn đề
              - text: SaaS bán phần mềm cho 1000 công ty, nếu mỗi công ty một instance riêng thì tốn 1000 server, 1000 DB, 1000 lần deploy và nâng cấp. Multi-tenancy ra đời để một instance duy nhất phục vụ nhiều customer, chia sẻ tài nguyên nhưng data vẫn phải cô lập.
            - paragraph [ref=f81e4114]:
              - generic [ref=f81e4115]: Nguồn gốc
              - text: Xuất hiện từ timesharing trên mainframe những năm 1960s; được SaaS (Salesforce, 1999) và cloud computing phổ biến hóa trở lại.
            - paragraph [ref=f81e4116]:
              - generic [ref=f81e4117]: Giải pháp
              - text: "3 mô hình: silo (mỗi tenant một DB/instance — cô lập mạnh, đắt), pool (chung tất cả, phân biệt qua tenant_id — hiệu quả nhất, rủi ro noisy neighbor), bridge (hybrid: component nhạy cảm silo, phần còn lại pool)."
            - paragraph [ref=f81e4118]:
              - text: "Liên quan: cell-based,"
              - link "sharding" [ref=f81e4119] [cursor=pointer]:
                - /url: "#sharding"
              - text: ", SaaS"
          - article [ref=f81e4120]:
            - heading "Serverless" [level=4] [ref=f81e4121]
            - paragraph [ref=f81e4122]: "còn gọi: không máy chủ"
            - paragraph [ref=f81e4123]:
              - generic [ref=f81e4124]: Vấn đề
              - text: "Dev viết một function xử lý ảnh upload, nhưng phải lo luôn: provision server, scale khi 10k ảnh cùng lúc, trả tiền cho server chạy 24/7 dù ban đêm không ai upload. Serverless ra đời để dev chỉ quan tâm code, cloud lo phần còn lại và tính tiền theo thời gian thực chạy."
            - paragraph [ref=f81e4125]:
              - generic [ref=f81e4126]: Nguồn gốc
              - text: Thuật ngữ 'serverless' được Iron.io dùng từ 2012; AWS Lambda ra mắt 13/11/2014 đưa khái niệm vào mainstream.
            - paragraph [ref=f81e4127]:
              - generic [ref=f81e4128]: Giải pháp
              - text: Cloud provider quản lý hoàn toàn infrastructure; dev deploy code (function/service) và provider tự scale từ 0 đến hàng ngàn concurrent execution, tính tiền theo số request và thời gian chạy (đến millisecond).
            - paragraph [ref=f81e4129]:
              - text: "Liên quan: FaaS,"
              - link "autoscaling" [ref=f81e4130] [cursor=pointer]:
                - /url: "#autoscaling"
              - text: ","
              - link "12-factor app" [ref=f81e4131] [cursor=pointer]:
                - /url: "#12-factor-app"
          - article [ref=f81e4132]:
            - heading "Service Discovery" [level=4] [ref=f81e4133]
            - paragraph [ref=f81e4134]: "còn gọi: khám phá dịch vụ, service registry"
            - paragraph [ref=f81e4135]:
              - generic [ref=f81e4136]: Vấn đề
              - text: Trong microservices, hàng trăm instance có IP thay đổi liên tục (autoscaling, restart, deploy). Hard-code IP vào config là không thể bảo trì. Service discovery ra đời để các service tự tìm ra nhau qua registry trung tâm.
            - paragraph [ref=f81e4137]:
              - generic [ref=f81e4138]: Nguồn gốc
              - text: Netflix open-source Eureka năm 2012; các hệ thống trước đó dùng Zookeeper (Yahoo, 2006). Consul (HashiCorp) và etcd (CoreOS) ra đời ~2014. DNS cũ quá chậm (TTL cao) cho môi trường dynamic.
            - paragraph [ref=f81e4139]:
              - generic [ref=f81e4140]: Giải pháp
              - text: Mỗi service khi khởi động đăng ký IP+port vào registry. Client hoặc sidecar query registry để lấy danh sách instance sống, tự cập nhật khi có instance chết/mới, kết hợp health check để tránh route vào instance hỏng.
            - paragraph [ref=f81e4141]:
              - text: "Liên quan: load balancer,"
              - link "sidecar" [ref=f81e4142] [cursor=pointer]:
                - /url: "#sidecar"
              - text: ","
              - link "service mesh" [ref=f81e4143] [cursor=pointer]:
                - /url: "#service-mesh"
        - generic [ref=f81e4144]:
          - heading "Độ tin cậy & Quan sát được 28" [level=3] [ref=f81e4145]:
            - text: Độ tin cậy & Quan sát được
            - generic [ref=f81e4146]: "28"
          - article [ref=f81e4147]:
            - heading "Alert Fatigue" [level=4] [ref=f81e4148]
            - paragraph [ref=f81e4149]: "còn gọi: alert_fatigue, pager_fatigue, mệt mỏi vì cảnh báo, alarm fatigue, cảnh báo nhiễu"
            - paragraph [ref=f81e4150]:
              - generic [ref=f81e4151]: Vấn đề
              - text: Quá nhiều alert nhiễu khiến engineer bỏ qua hoặc trì hoãn phản hồi, làm kéo dài outage.
            - paragraph [ref=f81e4152]:
              - generic [ref=f81e4153]: Nguồn gốc
              - text: Google SRE Book - Chapter 6/10 (Monitoring, Practical Alerting)
            - paragraph [ref=f81e4154]:
              - generic [ref=f81e4155]: Giải pháp
              - text: "Giảm noise: alert trên symptoms (triệu chứng người dùng cảm nhận) thay vì causes, tránh 'something weird', ưu tiên signal-to-noise cao, dashboard cho non-critical, paging chỉ cho vấn đề cần can thiệp ngay."
            - paragraph [ref=f81e4156]:
              - text: "Liên quan: on_call, four_golden_signals, burn_rate,"
              - link "Alerting (threshold alert)" [ref=f81e4157] [cursor=pointer]:
                - /url: "#alerting-threshold-alert"
              - text: ","
              - link "On-call rotation" [ref=f81e4158] [cursor=pointer]:
                - /url: "#on-call-rotation"
              - text: ","
              - link "Four golden signals" [ref=f81e4159] [cursor=pointer]:
                - /url: "#four-golden-signals"
          - article [ref=f81e4160]:
            - heading "APM" [level=4] [ref=f81e4161]
            - paragraph [ref=f81e4162]: "còn gọi: application performance monitoring, giám sát hiệu năng ứng dụng"
            - paragraph [ref=f81e4163]:
              - generic [ref=f81e4164]: Vấn đề
              - text: "Metric host (CPU, RAM) lên 100% không cho biết code nào chậm: team cần nhìn tới từng request lẻ — query SQL nào tốn time, call API ngoài nào treo, dòng code nào chiếm phần lớn latency — điều metric hạ tầng không bao giờ hiện."
            - paragraph [ref=f81e4165]:
              - generic [ref=f81e4166]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e4167]:
              - generic [ref=f81e4168]: Giải pháp
              - text: Instrument ở tầng ứng dụng (DB query, cache, external call, transaction) rồi gom dữ liệu theo transaction để drill-down từ symptom (endpoint chậm) xuống nguyên nhân (query N+1).
            - paragraph [ref=f81e4169]:
              - text: "Liên quan:"
              - link "Distributed tracing" [ref=f81e4170] [cursor=pointer]:
                - /url: "#distributed-tracing"
              - text: ","
              - link "Four golden signals" [ref=f81e4171] [cursor=pointer]:
                - /url: "#four-golden-signals"
              - text: ","
              - link "Metrics (time-series)" [ref=f81e4172] [cursor=pointer]:
                - /url: "#metrics-time-series"
          - article [ref=f81e4173]:
            - heading "Black-box vs white-box monitoring" [level=4] [ref=f81e4174]
            - paragraph [ref=f81e4175]: "còn gọi: giám sát đen hộp, giám sát trắng hộp, synthetic monitoring"
            - paragraph [ref=f81e4176]:
              - generic [ref=f81e4177]: Vấn đề
              - text: Chỉ watch metric nội bộ (white-box) thì không phát hiện được 'service vẫn alive nhưng user không đăng nhập được' vì sai config/response; chỉ probe từ ngoài (black-box) thì không thấy trước được failure sắp xảy ra và không có dữ liệu chẩn đoán.
            - paragraph [ref=f81e4178]:
              - generic [ref=f81e4179]: Nguồn gốc
              - text: Google SRE book, chương 6 (2017)
            - paragraph [ref=f81e4180]:
              - generic [ref=f81e4181]: Giải pháp
              - text: "Dùng cả hai: white-box (metric/log/profile) cho early warning và chẩn đoán; black-box + synthetic probe (đăng nhập/tạo đơn định kỳ như user thật) để đo đúng symptom người dùng cảm nhận."
            - paragraph [ref=f81e4182]:
              - text: "Liên quan:"
              - link "Health check (/health, /ready)" [ref=f81e4183] [cursor=pointer]:
                - /url: "#health-check-health-ready"
              - text: ","
              - link "Four golden signals" [ref=f81e4184] [cursor=pointer]:
                - /url: "#four-golden-signals"
              - text: ", Synthetic monitoring"
          - article [ref=f81e4185]:
            - heading "Blameless Postmortem" [level=4] [ref=f81e4186]
            - paragraph [ref=f81e4187]: "còn gọi: blameless_postmortem, báo cáo sau sự cố không đổ lỗi, postmortem, học hỏi từ sự cố"
            - paragraph [ref=f81e4188]:
              - generic [ref=f81e4189]: Vấn đề
              - text: Văn hóa đổ lỗi (blame) làm người tham gia che giấu sự thật, ngăn chặn học hỏi tổ chức.
            - paragraph [ref=f81e4190]:
              - generic [ref=f81e4191]: Nguồn gốc
              - text: Google SRE Book - Chapter 15 (Postmortem Culture); healthcare/avionics safety culture
            - paragraph [ref=f81e4192]:
              - generic [ref=f81e4193]: Giải pháp
              - text: Tập trung vào contributing causes (nguyên nhân góp phần), không quy tội cá nhân/nhóm. Giả định thiện chí, tập trung vào hệ thống/process/thông tin thiếu để rút ra action items có thể thực thi.
            - paragraph [ref=f81e4194]:
              - text: "Liên quan:"
              - link "postmortem" [ref=f81e4195] [cursor=pointer]:
                - /url: "#postmortem"
              - text: ", incident_management, learning_culture,"
              - link "On-call rotation" [ref=f81e4196] [cursor=pointer]:
                - /url: "#on-call-rotation"
              - text: ","
              - link "Toil" [ref=f81e4197] [cursor=pointer]:
                - /url: "#toil"
              - text: ","
              - link "Alert fatigue" [ref=f81e4198] [cursor=pointer]:
                - /url: "#alert-fatigue"
          - article [ref=f81e4199]:
            - heading "Context propagation & Correlation ID" [level=4] [ref=f81e4200]
            - paragraph [ref=f81e4201]: "còn gọi: trace context, traceparent header, correlation ID, truyền ngữ cảnh"
            - paragraph [ref=f81e4202]:
              - generic [ref=f81e4203]: Vấn đề
              - text: Trace chỉ ghép được nếu service downstream nhận trace_id từ upstream; nếu mỗi service tự sinh ID riêng, hoặc header bị proxy/message queue làm mất, trace đứt thành nhiều mảnh vô dụng — cũng không nối được log của cùng một request qua 8 service.
            - paragraph [ref=f81e4204]:
              - generic [ref=f81e4205]: Nguồn gốc
              - text: không rõ (chuẩn W3C Trace Context; không verify được năm Recommendation)
            - paragraph [ref=f81e4206]:
              - generic [ref=f81e4207]: Giải pháp
              - text: Đính kèm trace_id/parent_id vào HTTP header (chuẩn W3C traceparent) hoặc message property, đọc lại ở cửa vào và kế thừa khi gọi tiếp; correlation ID tương tự để join toàn bộ log của một request.
            - paragraph [ref=f81e4208]:
              - text: "Liên quan:"
              - link "Distributed tracing" [ref=f81e4209] [cursor=pointer]:
                - /url: "#distributed-tracing"
              - text: ","
              - link "Structured logging" [ref=f81e4210] [cursor=pointer]:
                - /url: "#structured-logging"
              - text: ","
              - link "OpenTelemetry" [ref=f81e4211] [cursor=pointer]:
                - /url: "#opentelemetry"
          - article [ref=f81e4212]:
            - heading "Distributed tracing" [level=4] [ref=f81e4213]
            - paragraph [ref=f81e4214]: "còn gọi: trace phân tán, phân bố trace, distributed trace, trace/span"
            - paragraph [ref=f81e4215]:
              - generic [ref=f81e4216]: Vấn đề
              - text: Request từ user đi gateway → auth → order → payment → DB, mỗi service ghi log riêng với clock lệch nhau; khi request chậm 2 giây không ai biết bottleneck ở đâu vì log của từng service không nối được với nhau, log grep không nói được 'cái này gọi cái kia'.
            - paragraph [ref=f81e4217]:
              - generic [ref=f81e4218]: Nguồn gốc
              - text: Google Dapper (Sigelman và cộng sự, 2010)
            - paragraph [ref=f81e4219]:
              - generic [ref=f81e4220]: Giải pháp
              - text: Mỗi service tự tạo span (start/end, metadata) và nối vào chung trace_id; toàn bộ cây gọi + thời gian từng bước được gom lại cho thấy chính xác bước nào tốn thời gian và lỗi xảy ra ở đâu.
            - paragraph [ref=f81e4221]:
              - text: "Liên quan: Context propagation,"
              - link "OpenTelemetry" [ref=f81e4222] [cursor=pointer]:
                - /url: "#opentelemetry"
              - text: ","
              - link "APM" [ref=f81e4223] [cursor=pointer]:
                - /url: "#apm"
          - article [ref=f81e4224]:
            - heading "Error Budget" [level=4] [ref=f81e4225]
            - paragraph [ref=f81e4226]: "còn gọi: error_budget, ngân sách lỗi, error budget policy, ngân sách không ổn định"
            - paragraph [ref=f81e4227]:
              - generic [ref=f81e4228]: Vấn đề
              - text: Xung đột giữa phát triển (tốc độ) và ổn định (độ tin cậy) cần được giải quyết có hệ thống.
            - paragraph [ref=f81e4229]:
              - generic [ref=f81e4230]: Nguồn gốc
              - text: Google SRE Book - Chapter 1 (Introduction)
            - paragraph [ref=f81e4231]:
              - generic [ref=f81e4232]: Giải pháp
              - text: "Error budget = 1 - SLO (ví dụ: SLO 99.9% -> budget 0.1% downtime/failed requests). Khi budget còn nhiều, có thể đổi mới nhanh hơn; khi gần hết, ưu tiên ổn định."
            - paragraph [ref=f81e4233]:
              - text: "Liên quan:"
              - link "SLO" [ref=f81e4234] [cursor=pointer]:
                - /url: "#slo"
              - text: ", burn_rate, availability,"
              - link "SLO/SLI" [ref=f81e4235] [cursor=pointer]:
                - /url: "#slo-sli"
              - text: ","
              - link "Availability Math (Five Nines)" [ref=f81e4236] [cursor=pointer]:
                - /url: "#availability-math-five-nines"
