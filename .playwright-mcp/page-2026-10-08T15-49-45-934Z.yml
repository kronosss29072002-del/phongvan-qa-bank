          - article [ref=f81e2009]:
            - heading "assertion" [level=4] [ref=f81e2010]
            - paragraph [ref=f81e2011]: "còn gọi: assert"
            - paragraph [ref=f81e2012]:
              - generic [ref=f81e2013]: Vấn đề
              - text: Sau khi chạy code, cần xác định "đúng hay sai" một cách tự động. Nếu chỉ in kết quả, dễ bỏ sót.
            - paragraph [ref=f81e2014]:
              - generic [ref=f81e2015]: Nguồn gốc
              - text: xUnit
            - paragraph [ref=f81e2016]:
              - generic [ref=f81e2017]: Giải pháp
              - text: So sánh kết quả kỳ vọng vs thực tế; nếu sai, test fail ngay với thông báo rõ ràng.
            - paragraph [ref=f81e2018]:
              - text: "Liên quan:"
              - link "arrange-act-assert" [ref=f81e2019] [cursor=pointer]:
                - /url: "#arrange-act-assert"
              - text: ","
              - link "unit test" [ref=f81e2020] [cursor=pointer]:
                - /url: "#unit-test"
          - article [ref=f81e2021]:
            - heading "Code coverage" [level=4] [ref=f81e2022]
            - paragraph [ref=f81e2023]: "còn gọi: Test coverage"
            - paragraph [ref=f81e2024]:
              - generic [ref=f81e2025]: Vấn đề
              - text: Cần biết phần nào của code đã được test thực thi, nhưng không đủ chỉ đọc code — cần một thước đo khách quan về vùng code được phủ bởi test.
            - paragraph [ref=f81e2026]:
              - generic [ref=f81e2027]: Nguồn gốc
              - text: Miller & Maloney (CACM, 1963)
            - paragraph [ref=f81e2028]:
              - generic [ref=f81e2029]: Giải pháp
              - text: Đo tỷ lệ dòng/nhánh/điều kiện được thực thi khi chạy test suite. Tuy nhiên, coverage cao không đồng nghĩa với test chất lượng tốt.
            - paragraph [ref=f81e2030]:
              - text: "Liên quan:"
              - link "Mutation testing" [ref=f81e2031] [cursor=pointer]:
                - /url: "#mutation-testing"
              - text: ","
              - link "Statement coverage" [ref=f81e2032] [cursor=pointer]:
                - /url: "#statement-coverage"
              - text: ","
              - link "Branch coverage" [ref=f81e2033] [cursor=pointer]:
                - /url: "#branch-coverage"
          - article [ref=f81e2034]:
            - heading "code review" [level=4] [ref=f81e2035]
            - paragraph [ref=f81e2036]: "còn gọi: peer review, pull request review"
            - paragraph [ref=f81e2037]:
              - generic [ref=f81e2038]: Vấn đề
              - text: Lỗi logic, design kém, hoặc hiểu sai chỉ có 1 người biết trước merge. Thiếu cơ chế bắt lỗi đa góc nhìn.
            - paragraph [ref=f81e2039]:
              - generic [ref=f81e2040]: Nguồn gốc
              - text: Fagan Inspection (Michael Fagan) → modern PR review
            - paragraph [ref=f81e2041]:
              - generic [ref=f81e2042]: Giải pháp
              - text: "Peer review trước merge: kiểm tra logic, readability, test coverage, security, tránh knowledge silo."
            - paragraph [ref=f81e2043]:
              - text: "Liên quan:"
              - link "technical debt" [ref=f81e2044] [cursor=pointer]:
                - /url: "#technical-debt"
              - text: ","
              - link "refactoring" [ref=f81e2045] [cursor=pointer]:
                - /url: "#refactoring"
          - article [ref=f81e2046]:
            - heading "Dummy" [level=4] [ref=f81e2047]
            - paragraph [ref=f81e2048]:
              - generic [ref=f81e2049]: Vấn đề
              - text: Khi signature của phương thức yêu cầu một tham số, nhưng test không hề dùng đến giá trị đó, cần truyền gì đó chỉ để gọi được.
            - paragraph [ref=f81e2050]:
              - generic [ref=f81e2051]: Nguồn gốc
              - text: Gerard Meszaros (xUnit Test Patterns)
            - paragraph [ref=f81e2052]:
              - generic [ref=f81e2053]: Giải pháp
              - text: Truyền một giá trị không sử dụng (null, object rỗng) nhằm thỏa mãn interface mà không ảnh hưởng đến logic test.
            - paragraph [ref=f81e2054]:
              - text: "Liên quan:"
              - link "Test double" [ref=f81e2055] [cursor=pointer]:
                - /url: "#test-double"
          - article [ref=f81e2056]:
            - heading "e2e test" [level=4] [ref=f81e2057]
            - paragraph [ref=f81e2058]: "còn gọi: end-to-end test, end to end testing, E2E"
            - paragraph [ref=f81e2059]:
              - generic [ref=f81e2060]: Vấn đề
              - text: Khi deploy, người dùng gặp lỗi nhưng cả unit + integration đều pass. Lỗi chỉ xuất hiện ở toàn bộ luồng (UI/API/DB/network).
            - paragraph [ref=f81e2061]:
              - generic [ref=f81e2062]: Nguồn gốc
              - text: Agile/acceptance testing practice (Glenford Myers influenced)
            - paragraph [ref=f81e2063]:
              - generic [ref=f81e2064]: Giải pháp
              - text: Mô phỏng người dùng thực chạy toàn bộ hệ thống (thường qua UI hoặc HTTP) để kiểm tra kịch bản hoàn chỉnh.
            - paragraph [ref=f81e2065]:
              - text: "Liên quan:"
              - link "integration test" [ref=f81e2066] [cursor=pointer]:
                - /url: "#integration-test"
              - text: ","
              - link "smoke test" [ref=f81e2067] [cursor=pointer]:
                - /url: "#smoke-test"
              - text: ","
              - link "test pyramid" [ref=f81e2068] [cursor=pointer]:
                - /url: "#test-pyramid"
              - text: ", acceptance test"
          - article [ref=f81e2069]:
            - heading "End-to-end test" [level=4] [ref=f81e2070]
            - paragraph [ref=f81e2071]: "còn gọi: E2E test"
            - paragraph [ref=f81e2072]:
              - generic [ref=f81e2073]: Vấn đề
              - text: Dù các thành phần đã được kiểm tra riêng lẻ, hệ thống vẫn có thể sai ở điểm tích hợp cuối cùng (luồng người dùng thực, giao diện, xác thực) khi chạy trong môi trường thật.
            - paragraph [ref=f81e2074]:
              - generic [ref=f81e2075]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e2076]:
              - generic [ref=f81e2077]: Giải pháp
              - text: Mô phỏng hành động của người dùng trên toàn bộ ứng dụng (frontend + backend + database + API) để xác minh một luồng nghiệp vụ hoàn chỉnh.
            - paragraph [ref=f81e2078]:
              - text: "Liên quan:"
              - link "Test pyramid" [ref=f81e2079] [cursor=pointer]:
                - /url: "#test-pyramid"
