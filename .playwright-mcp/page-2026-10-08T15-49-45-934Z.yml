          - article [ref=f81e6179]:
            - heading "Hot path" [level=4] [ref=f81e6180]
            - paragraph [ref=f81e6181]: "còn gọi: đường nóng, critical path hiệu năng"
            - paragraph [ref=f81e6182]:
              - generic [ref=f81e6183]: Vấn đề
              - text: Một request đi qua 30 lớp (auth, log, validate, 5 service call, serialize) nhưng chỉ 5% thời gian nằm ở đoạn tính toán — tối ưu nhầm đoạncold path vô ích, còn hot path (mỗi request đều đi qua, chiếm phần lớn latency) không ai động tới.
            - paragraph [ref=f81e6184]:
              - generic [ref=f81e6185]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e6186]:
              - generic [ref=f81e6187]: Giải pháp
              - text: "Xác định đoạn code/request path chiếm phần lớn thời gian (qua tracing/profiling) rồi tối ưu tập trung đúng đó: cache kết quả, bỏ I/O thừa, giảm allocation — 80/20 của performance engineering; phần còn lại để nguyên."
