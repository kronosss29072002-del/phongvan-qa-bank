          - article [ref=f81e2519]:
            - heading "gRPC" [level=4] [ref=f81e2520]
            - paragraph [ref=f81e2521]: "còn gọi: Google RPC"
            - paragraph [ref=f81e2522]:
              - generic [ref=f81e2523]: Vấn đề
              - text: Google dùng RPC nội bộ tên Stubby (từ ~2001) nối hàng nghìn microservice, nhưng nó proprietary, JSON/HTTP/1.1 bên ngoài thì phình to (parse text), mỗi request chiếm kết nối TCP riêng, không có streaming hai chiều, và mỗi ngôn ngữ phải viết tay client — không ai ngoài Google dùng được. Microservices ra đời rầm rộ 2010s cần cách gọi RPC chuẩn, nhanh, đa ngôn ngữ.
            - paragraph [ref=f81e2524]:
              - generic [ref=f81e2525]: Nguồn gốc
              - text: Google open-source Stubby thành gRPC, 3/2015 (release 8/2016, Apache 2.0).
            - paragraph [ref=f81e2526]:
              - generic [ref=f81e2527]: Giải pháp
              - text: Định nghĩa service trong .proto (Protocol Buffers — binary compact), codegen client/server đa ngôn ngữ, chạy trên HTTP/2 (multiplex nhiều call trên 1 kết nối), hỗ trợ 4 kiểu streaming (unary/server/client/bidirectional).
