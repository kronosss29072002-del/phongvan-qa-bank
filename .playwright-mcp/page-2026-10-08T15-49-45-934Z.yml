            - heading "unit test" [level=4] [ref=f81e2306]
            - paragraph [ref=f81e2307]: "còn gọi: unit testing, unit test case"
            - paragraph [ref=f81e2308]:
              - generic [ref=f81e2309]: Vấn đề
              - text: Khi sửa một hàm nhỏ, lập trình viên phải mất nhiều thời gian chạy toàn bộ hệ thống thủ công để chắc chắn không ảnh hưởng. Việc đó chậm và dễ bỏ sót.
            - paragraph [ref=f81e2310]:
              - generic [ref=f81e2311]: Nguồn gốc
              - text: Kent Beck (xUnit, Smalltalk)
            - paragraph [ref=f81e2312]:
              - generic [ref=f81e2313]: Giải pháp
              - text: Chạy nhanh, cô lập hàm/class nhỏ bằng cách mock phụ thuộc. Giúp phát hiện lỗi ngay tại chỗ sửa.
