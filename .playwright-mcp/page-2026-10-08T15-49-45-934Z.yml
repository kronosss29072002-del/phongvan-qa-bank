          - article [ref=f81e3141]:
            - heading "JOIN algorithms (nested loop / hash / sort-merge)" [level=4] [ref=f81e3142]
            - paragraph [ref=f81e3143]: "còn gọi: thuật toán join"
            - paragraph [ref=f81e3144]:
              - generic [ref=f81e3145]: Vấn đề
              - text: Join hai bảng có nhiều chiến lược, mỗi kiểu mạnh hay yếu tùy kích thước và thứ tự dữ liệu.
            - paragraph [ref=f81e3146]:
              - generic [ref=f81e3147]: Giải pháp
              - text: Nested loop lặp lồng, hash join gộp bảng nhỏ vào bảng băm, sort-merge sắp rồi trộn; planner chọn theo chi phí.
            - paragraph [ref=f81e3148]:
              - text: "Liên quan:"
              - link "Cost-based optimizer" [ref=f81e3149] [cursor=pointer]:
