                - /url: "#polling"
              - text: ","
              - link "Event-driven architecture" [ref=f81e1367] [cursor=pointer]:
                - /url: "#event-driven-architecture"
              - text: ","
              - link "Idempotency" [ref=f81e1368] [cursor=pointer]:
                - /url: "#idempotency"
        - generic [ref=f81e1369]:
          - heading "Kiến trúc & Khả năng mở rộng 10" [level=3] [ref=f81e1370]:
            - text: Kiến trúc & Khả năng mở rộng
            - generic [ref=f81e1371]: "10"
          - article [ref=f81e1372]:
            - heading "Container vs VM" [level=4] [ref=f81e1373]
            - paragraph [ref=f81e1374]: "còn gọi: thùng chứa vs máy ảo"
            - paragraph [ref=f81e1375]:
              - generic [ref=f81e1376]: Vấn đề
              - text: App cần chạy trên máy dev, staging, production giống hệt nhau. VM giải quyết bằng cách giả lập cả OS — nhưng mỗi VM nặng hàng GB, khởi động mất phút, tốn RAM cho kernel riêng. Container ra đời để đóng gói app + dependency nhưng dùng chung kernel host, nhẹ hơn, khởi động bằng giây.
            - paragraph [ref=f81e1377]:
              - generic [ref=f81e1378]: Nguồn gốc
              - text: chroot (1982), FreeBSD Jail (2000), Solaris Zones (2004), LXC (2008). Docker (2013) phổ biến hóa container trên Linux bằng UX đơn giản và image registry.
            - paragraph [ref=f81e1379]:
              - generic [ref=f81e1380]: Giải pháp
              - text: "VM: hypervisor chạy nhiều guest OS riêng (strong isolation, nặng). Container: engine (Docker/containerd) chạy nhiều user-space isolated trên cùng kernel host qua Linux namespaces (chia view) và cgroups (giới hạn resource)."
            - paragraph [ref=f81e1381]:
              - text: "Liên quan:"
              - link "sidecar" [ref=f81e1382] [cursor=pointer]:
                - /url: "#sidecar"
              - text: ", orchestration,"
              - link "12-factor app" [ref=f81e1383] [cursor=pointer]:
                - /url: "#12-factor-app"
          - article [ref=f81e1384]:
            - heading "Horizontal vs Vertical Scaling" [level=4] [ref=f81e1385]
            - paragraph [ref=f81e1386]: "còn gọi: scale out vs scale up, mở rộng ngang vs dọc"
            - paragraph [ref=f81e1387]:
              - generic [ref=f81e1388]: Vấn đề
              - text: "App chạy chậm vì quá tải. Có 2 cách: mua server mạnh hơn (vertical — đắt, có giới hạn phần cứng, downtime khi nâng) hoặc thêm nhiều server nhỏ chạy song song (horizontal — rẻ hơn theo đơn vị, elastic, nhưng cần app stateless và có load balancer)."
            - paragraph [ref=f81e1389]:
              - generic [ref=f81e1390]: Nguồn gốc
              - text: Khái niệm có từ thời mainframe; trở thành lựa chọn kiến trúc rõ ràng từ khi cloud ra đời (AWS EC2 2006) cho phép thêm/bớt máy theo phút.
            - paragraph [ref=f81e1391]:
              - generic [ref=f81e1392]: Giải pháp
              - text: "Vertical: tăng CPU/RAM của một máy, tới giới hạn phần cứng thì phải dừng. Horizontal: thêm nhiều máy phía sau load balancer, không có ceiling; yêu cầu app stateless, session chuyển sang store trung tâm (Redis/DB)."
            - paragraph [ref=f81e1393]:
              - text: "Liên quan: load balancer,"
              - link "autoscaling" [ref=f81e1394] [cursor=pointer]:
                - /url: "#autoscaling"
              - text: ", stateless"
          - article [ref=f81e1395]:
            - heading "Load Balancer (L4/L7)" [level=4] [ref=f81e1396]
            - paragraph [ref=f81e1397]: "còn gọi: bộ cân bằng tải"
            - paragraph [ref=f81e1398]:
              - generic [ref=f81e1399]: Vấn đề
              - text: Một server không chịu nổi 10k request/giây, nhưng thay vì mua server to hơn, người ta đặt nhiều server nhỏ phía sau và cần một 'người gác cổng' chia request đều cho chúng — đồng thời loại bỏ server chết khỏi vòng xoay để user không bị lỗi.
            - paragraph [ref=f81e1400]:
              - generic [ref=f81e1401]: Nguồn gốc
              - text: Load balancing xuất hiện từ các hệ thống viễn thông và mainframe những năm 1970-80s; DNS round-robin có từ những ngày đầu của DNS (RFC 1035, 1987).
            - paragraph [ref=f81e1402]:
              - generic [ref=f81e1403]: Giải pháp
              - text: L4 (transport) cân bằng theo IP+port, nhanh nhưng không đọc được nội dung HTTP. L7 (application) đọc được header/URL/cookie để route thông minh hơn (ví dụ route /api sang pool API, /static sang pool static) nhưng tốn tài nguyên hơn.
            - paragraph [ref=f81e1404]:
              - text: "Liên quan:"
              - link "round robin" [ref=f81e1405] [cursor=pointer]:
                - /url: "#round-robin"
              - text: ","
              - link "sticky session" [ref=f81e1406] [cursor=pointer]:
                - /url: "#sticky-session"
              - text: ", horizontal scaling"
          - article [ref=f81e1407]:
            - heading "Microservices" [level=4] [ref=f81e1408]
            - paragraph [ref=f81e1409]: "còn gọi: kiến trúc vi dịch vụ"
            - paragraph [ref=f81e1410]:
              - generic [ref=f81e1411]: Vấn đề
              - text: Monolith lớn tới mức một thay đổi nhỏ ở module thanh toán buộc phải redeploy toàn bộ app, team 50+ dev đụng code nhau liên tục, một bug ở feature A kéo sập cả hệ thống. Microservices ra đời để mỗi team sở hữu một service độc lập, deploy riêng, fail riêng.
            - paragraph [ref=f81e1412]:
              - generic [ref=f81e1413]: Nguồn gốc
              - text: Thuật ngữ được Peter Rodgers (HP Labs) dùng năm 2005 tại hội nghị Web Services Edge; phổ biến rộng rãi sau bài viết của Martin Fowler và James Lewis năm 2014, và được Netflix/Amazon/Uber áp dụng từ ~2008-2012.
            - paragraph [ref=f81e1414]:
              - generic [ref=f81e1415]: Giải pháp
              - text: Chia hệ thống thành nhiều service nhỏ, mỗi service có DB riêng, giao tiếp qua network (HTTP/gRPC/message), deploy độc lập, team nào làm service nấy sở hữu.
            - paragraph [ref=f81e1416]:
              - text: "Liên quan: SOA,"
              - link "monolith" [ref=f81e1417] [cursor=pointer]:
                - /url: "#monolith"
              - text: ","
              - link "bounded context" [ref=f81e1418] [cursor=pointer]:
                - /url: "#bounded-context"
              - text: ","
              - link "service mesh" [ref=f81e1419] [cursor=pointer]:
                - /url: "#service-mesh"
          - article [ref=f81e1420]:
            - heading "Monolith" [level=4] [ref=f81e1421]
            - paragraph [ref=f81e1422]: "còn gọi: monolithic architecture, kiến trúc đơn khối"
            - paragraph [ref=f81e1423]:
              - generic [ref=f81e1424]: Vấn đề
              - text: Khi mới xây dựng sản phẩm, đội nhỏ (3-5 dev) cần một codebase duy nhất để deploy nhanh, debug dễ, không ai muốn chia nhỏ hệ thống khi chưa có user. Monolith ra đời vì nhu cầu 'chỉ cần chạy được đã' — mọi module nằm chung process, chung DB, gọi hàm trực tiếp không qua mạng.
            - paragraph [ref=f81e1425]:
              - generic [ref=f81e1426]: Nguồn gốc
              - text: Kiến trúc mặc định của phần mềm từ những năm 1960s; thuật ngữ 'monolith' được dùng phổ biến trong cộng đồng SOA/microservices những năm 2010 để phân biệt với kiến trúc phân tán.
            - paragraph [ref=f81e1427]:
              - generic [ref=f81e1428]: Giải pháp
              - text: Toàn bộ logic (auth, business, DB access) chạy trong một process duy nhất; deploy một artifact duy nhất; scale bằng cách nhân bản instance.
            - paragraph [ref=f81e1429]:
              - text: "Liên quan:"
              - link "microservices" [ref=f81e1430] [cursor=pointer]:
                - /url: "#microservices"
              - text: ","
              - link "modular monolith" [ref=f81e1431] [cursor=pointer]:
                - /url: "#modular-monolith"
              - text: ", SOA"
          - article [ref=f81e1432]:
            - heading "Round Robin" [level=4] [ref=f81e1433]
            - paragraph [ref=f81e1434]: "còn gọi: luân phiên"
            - paragraph [ref=f81e1435]:
              - generic [ref=f81e1436]: Vấn đề
              - text: "Cần chia request đều cho N server mà không muốn giữ state, không muốn tính toán phức tạp. Round robin ra đời như cách đơn giản nhất: phát đều tay, server nào cũng nhận số lượng xấp xỉ như nhau."
            - paragraph [ref=f81e1437]:
              - generic [ref=f81e1438]: Nguồn gốc
              - text: Xuất phát từ lý thuyết xếp hàng (queueing theory) và lập lịch CPU; áp dụng vào DNS round-robin từ cuối những năm 1980s.
            - paragraph [ref=f81e1439]:
              - generic [ref=f81e1440]: Giải pháp
              - text: Danh sách server xếp vòng tròn, mỗi request phát cho server kế tiếp; có biến thể weighted round robin cho server mạnh nhận nhiều request hơn server yếu.
            - paragraph [ref=f81e1441]:
              - text: "Liên quan: load balancer,"
              - link "sticky session" [ref=f81e1442] [cursor=pointer]:
                - /url: "#sticky-session"
              - text: ", least connections"
          - article [ref=f81e1443]:
            - heading "Singleton" [level=4] [ref=f81e1444]
            - paragraph [ref=f81e1445]: "còn gọi: mẫu đơn bản"
            - paragraph [ref=f81e1446]:
              - generic [ref=f81e1447]: Vấn đề
              - text: Cần đảm bảo một class chỉ có đúng một instance trong toàn bộ app (connection pool, config manager, logger) — nếu mỗi chỗ tự new một connection pool thì lãng phí resource và state không nhất quán. Singleton ra đời để enforce điều đó ở mức language.
            - paragraph [ref=f81e1448]:
              - generic [ref=f81e1449]: Nguồn gốc
              - text: "Gang of Four (Gamma, Helm, Johnson, Vlissides) trong cuốn 'Design Patterns: Elements of Reusable Object-Oriented Software' (1994)."
            - paragraph [ref=f81e1450]:
              - generic [ref=f81e1451]: Giải pháp
              - text: "Private constructor, static method trả về instance duy nhất (lazy hoặc eager init). Nhược điểm: tạo global state ẩn, coupling ẩn, khó unit test (khó mock), vi phạm single responsibility. Thư viện hiện đại thường thay bằng DI container với scope singleton."
            - paragraph [ref=f81e1452]: "Liên quan: dependency injection, global state, design patterns"
          - article [ref=f81e1453]:
            - heading "SOA (Service-Oriented Architecture)" [level=4] [ref=f81e1454]
            - paragraph [ref=f81e1455]: "còn gọi: kiến trúc hướng dịch vụ"
            - paragraph [ref=f81e1456]:
              - generic [ref=f81e1457]: Vấn đề
              - text: Trong doanh nghiệp lớn, mỗi phòng ban có một app riêng (ERP, CRM, billing) không nói chuyện được với nhau; tích hợp point-to-point tạo ra 'spaghetti' mỗi lần thêm app mới lại phải viết N connector. SOA sinh ra để các app này tái sử dụng nhau qua service chuẩn.
            - paragraph [ref=f81e1458]:
              - generic [ref=f81e1459]: Nguồn gốc
              - text: Phát triển từ distributed computing và CORBA/DCOM những năm 1990s; thuật ngữ SOA được chuẩn hóa qua các công bố của Gartner và OASIS đầu những năm 2000, phổ biến với SOAP/WSDL.
            - paragraph [ref=f81e1460]:
              - generic [ref=f81e1461]: Giải pháp
              - text: Expose chức năng business dưới dạng service có contract chuẩn (thường SOAP/REST), các app khác gọi lại qua network; thường đi kèm ESB (Enterprise Service Bus).
            - paragraph [ref=f81e1462]:
              - text: "Liên quan:"
              - link "microservices" [ref=f81e1463] [cursor=pointer]:
                - /url: "#microservices"
              - text: ","
              - link "monolith" [ref=f81e1464] [cursor=pointer]:
                - /url: "#monolith"
              - text: ","
              - link "API gateway" [ref=f81e1465] [cursor=pointer]:
                - /url: "#api-gateway"
          - article [ref=f81e1466]:
            - heading "Sticky Session" [level=4] [ref=f81e1467]
            - paragraph [ref=f81e1468]: "còn gọi: session affinity, phiên bám dính"
            - paragraph [ref=f81e1469]:
              - generic [ref=f81e1470]: Vấn đề
              - text: App lưu session trên RAM của server (không dùng Redis/DB chung). Khi load balancer chuyển user từ server A sang server B, user bị logout ngay. Sticky session ra đời để 'ghim' user vào đúng server họ đã login.
            - paragraph [ref=f81e1471]:
              - generic [ref=f81e1472]: Nguồn gốc
              - text: Xuất hiện cùng sự phát triển của web application và session-based authentication những năm 1990s-2000s.
            - paragraph [ref=f81e1473]:
              - generic [ref=f81e1474]: Giải pháp
              - text: "Load balancer đọc cookie (hoặc IP) để luôn route cùng một user về cùng một backend server. Nhược điểm: khi server đó chết, user mất session; phân phối tải không còn đều; khó scale khi user dồn vào một server nóng."
            - paragraph [ref=f81e1475]: "Liên quan: load balancer, session replication, horizontal scaling"
          - article [ref=f81e1476]:
            - heading "Tight vs Loose Coupling" [level=4] [ref=f81e1477]
            - paragraph [ref=f81e1478]: "còn gọi: liên kết chặt vs lỏng"
            - paragraph [ref=f81e1479]:
              - generic [ref=f81e1480]: Vấn đề
              - text: Module A gọi trực tiếp hàm của module B, khi B đổi signature thì A break — phải sửa cả hệ thống mỗi lần thay đổi nhỏ. Loose coupling ra đời để các thành phần ít biết về nhau, thay đổi một bên không kéo theo sửa hàng loạt bên kia.
            - paragraph [ref=f81e1481]:
              - generic [ref=f81e1482]: Nguồn gốc
              - text: Khái niệm coupling/cohesion từ Larry Constantine và Edward Yourdon cuối những năm 1960s-1970s (Structured Design, 1979).
            - paragraph [ref=f81e1483]:
              - generic [ref=f81e1484]: Giải pháp
              - text: "Tight coupling: gọi trực tiếp, shared state, phụ thuộc implementation. Loose coupling: giao tiếp qua interface ổn định, message queue, event, contract rõ ràng. Hệ thống lớn luôn hướng tới loose coupling để đổi một service mà không đụng services khác."
            - paragraph [ref=f81e1485]:
              - text: "Liên quan:"
              - link "microservices" [ref=f81e1486] [cursor=pointer]:
                - /url: "#microservices"
              - text: ","
              - link "event bus" [ref=f81e1487] [cursor=pointer]:
                - /url: "#event-bus"
              - text: ", SOA"
        - generic [ref=f81e1488]:
          - heading "Độ tin cậy & Quan sát được 12" [level=3] [ref=f81e1489]:
            - text: Độ tin cậy & Quan sát được
            - generic [ref=f81e1490]: "12"
          - article [ref=f81e1491]:
            - heading "Alerting (threshold alert)" [level=4] [ref=f81e1492]
            - paragraph [ref=f81e1493]: "còn gọi: cảnh báo theo ngưỡng, threshold alert, paging"
            - paragraph [ref=f81e1494]:
              - generic [ref=f81e1495]: Vấn đề
              - text: Dashboard chỉ có ích khi có người nhìn; incident lúc đêm khuya nếu không có gì đánh thức ai thì downtime kéo dài cho tới sáng. Cần hệ thống tự kết nối 'sai lệch' với 'con người có trách nhiệm'.
            - paragraph [ref=f81e1496]:
              - generic [ref=f81e1497]: Nguồn gốc
              - text: không rõ
            - paragraph [ref=f81e1498]:
              - generic [ref=f81e1499]: Giải pháp
              - text: Rule so sánh metric với ngưỡng (error rate > 5% trong 5 phút...) → gửi notification/pager tới on-call; alertmanager gộp (group) và dedup các alert trùng.
            - paragraph [ref=f81e1500]:
              - text: "Liên quan:"
              - link "On-call rotation" [ref=f81e1501] [cursor=pointer]:
                - /url: "#on-call-rotation"
              - text: ","
              - link "Alert fatigue" [ref=f81e1502] [cursor=pointer]:
                - /url: "#alert-fatigue"
              - text: ","
              - link "Monitoring" [ref=f81e1503] [cursor=pointer]:
