          - article [ref=f81e7329]:
            - heading "Expand-contract (database migration trong deploy)" [level=4] [ref=f81e7330]
            - paragraph [ref=f81e7331]: "còn gọi: expand-contract, parallel change, expand and contract, migration không downtime"
            - paragraph [ref=f81e7332]:
              - generic [ref=f81e7333]: Vấn đề
              - text: "Deploy code mới đổi tên cột users.name → users.full_name: migration chạy trước thì app cũ vỡ, code mới chạy trước thì vỡ vì schema cũ — kẹt cứng vì hai version phải sống song song. Thêm cột NOT NULL trên bảng triệu dòng còn lock bảng hàng phút, user thấy timeout giữa lúc deploy."
            - paragraph [ref=f81e7334]:
              - generic [ref=f81e7335]: Nguồn gốc
              - text: Được gọi là 'parallel change (expand and contract)' trong bliki của Danilo Sato trên martinfowler.com ngày 13/5/2014; kỹ thuật shadow table/online DDL ứng dụng thực tế có pt-online-schema-change của Percona Toolkit.
            - paragraph [ref=f81e7336]:
              - generic [ref=f81e7337]: Giải pháp
              - text: "Chia 3 pha: expand (thêm schema mới song song, code cũ vẫn chạy), migrate (code mới đọc/ghi cả hai và backfill dữ liệu dần, an toàn roll forward), contract (gỡ schema cũ khi không còn client nào dùng). Deployment và schema change không bao giờ phải dừng hệ thống để đi cùng nhau."
            - paragraph [ref=f81e7338]:
              - text: "Liên quan:"
              - link "zero-downtime deploy (rolling deploy)" [ref=f81e7339] [cursor=pointer]:
                - /url: "#zero-downtime-deploy-rolling-deploy"
              - text: ","
              - link "blue-green deploy" [ref=f81e7340] [cursor=pointer]:
                - /url: "#blue-green-deploy"
              - text: ","
              - link "rollback" [ref=f81e7341] [cursor=pointer]:
                - /url: "#rollback"
              - text: ","
              - link "release vs deploy" [ref=f81e7342] [cursor=pointer]:
                - /url: "#release-vs-deploy"
              - text: ", CD (continuous delivery/deployment)"
          - article [ref=f81e7343]:
            - heading "GitOps" [level=4] [ref=f81e7344]
            - paragraph [ref=f81e7345]: "còn gọi: Argo CD, Flux, reconcile từ git, deploy qua pull request"
            - paragraph [ref=f81e7346]:
              - generic [ref=f81e7347]: Vấn đề
              - text: "Đội apply YAML tay từ laptop lên cluster: ai apply cái gì, khi nào, trên cluster nào không ai biết; drift tích tụ vì có người sửa trực tiếp trên cluster, audit bằng... trí nhớ, rollback bằng cách... cố nhớ lại bản cũ. Ops thành điểm nghẽn cho mọi thay đổi hạ tầng."
            - paragraph [ref=f81e7348]:
              - generic [ref=f81e7349]: Nguồn gốc
              - text: Thuật ngữ do Alexis Richardson (CEO Weaveworks) đặt trong bài blog ngày 2/3/2017.
            - paragraph [ref=f81e7350]:
              - generic [ref=f81e7351]: Giải pháp
              - text: "Git là single source of truth: mọi thay đổi hạ tầng/ứng dụng là PR vào git, agent trong cluster (Argo CD, Flux) tự đối chiếu trạng thái thực với trạng thái khai báo và reconcile; rollback = revert commit, mọi thứ có audit sẵn trong git history."
            - paragraph [ref=f81e7352]:
              - text: "Liên quan:"
              - link "Infrastructure as Code (Terraform, Pulumi)" [ref=f81e7353] [cursor=pointer]:
