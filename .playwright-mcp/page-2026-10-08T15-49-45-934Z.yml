          - article [ref=f81e2547]:
            - heading "HTTP/2" [level=4] [ref=f81e2548]
            - paragraph [ref=f81e2549]: "còn gọi: HTTP 2, h2"
            - paragraph [ref=f81e2550]:
              - generic [ref=f81e2551]: Vấn đề
              - text: "HTTP/1.1 text-based + 1 request/lần đợi response khiến trang tài nguyên lớn tải chậm: browser phải mở 6 kết nối song song, header (cookie vài KB) gửi lặp lại mỗi request, không ưu tiên tài nguyên nào quan trọng hơn, không push trước được. Google muốn nhanh mà không đổi semantic HTTP nên làm SPDY (2009) — Chrome tải trang nhanh hơn 50%."
            - paragraph [ref=f81e2552]:
              - generic [ref=f81e2553]: Nguồn gốc
              - text: Google SPDY (2009); IETF chuẩn hóa từ SPDY, RFC 7540 (5/2015), sửa lại RFC 9113 (6/2022).
            - paragraph [ref=f81e2554]:
              - generic [ref=f81e2555]: Giải pháp
              - text: Lớp nhị phân (frames) + multiplex nhiều request song song trên MỘT kết nối TCP (stream có ID), HPACK nén header, priority, server push — method/status code/URI giữ nguyên như HTTP/1.1 nên app không phải viết lại.
