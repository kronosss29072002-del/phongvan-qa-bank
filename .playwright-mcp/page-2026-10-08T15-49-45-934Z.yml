          - article [ref=f81e6955]:
            - heading "Traceparent" [level=4] [ref=f81e6956]
            - paragraph [ref=f81e6957]: "còn gọi: traceparent_header"
            - paragraph [ref=f81e6958]:
              - generic [ref=f81e6959]: Vấn đề
              - text: Cần định dạng header chuẩn để trao đổi trace context giữa các hệ thống khác nhau.
            - paragraph [ref=f81e6960]:
              - generic [ref=f81e6961]: Nguồn gốc
              - text: W3C TraceContext specification
            - paragraph [ref=f81e6962]:
              - generic [ref=f81e6963]: Giải pháp
              - text: Header chuẩn W3C định dạng <version>-<trace-id>-<parent-id>-<trace-flags>, dùng để inject/extract context xuyên service boundaries.
            - paragraph [ref=f81e6964]:
              - text: "Liên quan: trace_context,"
              - link "trace" [ref=f81e6965] [cursor=pointer]:
                - /url: "#trace"
              - text: ","
              - link "span" [ref=f81e6966] [cursor=pointer]:
                - /url: "#span"
          - article [ref=f81e6967]:
            - heading "Warm Standby" [level=4] [ref=f81e6968]
            - paragraph [ref=f81e6969]: "còn gọi: warm_standby"
            - paragraph [ref=f81e6970]:
              - generic [ref=f81e6971]: Vấn đề
              - text: Pilot Light cần thời gian scale-up; cần môi trường DR sẵn sàng hơn để giảm RTO.
            - paragraph [ref=f81e6972]:
              - generic [ref=f81e6973]: Nguồn gốc
              - text: AWS Disaster Recovery Options (Well-Architected/Whitepapers)
            - paragraph [ref=f81e6974]:
              - generic [ref=f81e6975]: Giải pháp
              - text: Bản sao thu nhỏ nhưng đầy đủ chức năng của production chạy liên tục ở DR region (reduced capacity). Khi failover chỉ cần scale up. RTO thấp hơn pilot light.
            - paragraph [ref=f81e6976]:
              - text: "Liên quan: pilot_light, active_active,"
              - link "RTO" [ref=f81e6977] [cursor=pointer]:
                - /url: "#rto"
        - generic [ref=f81e6978]:
          - heading "Bền vững & Chị tải 4" [level=3] [ref=f81e6979]:
            - text: Bền vững & Chị tải
            - generic [ref=f81e6980]: "4"
          - article [ref=f81e6981]:
            - heading "Backpressure (Reactive)" [level=4] [ref=f81e6982]
            - paragraph [ref=f81e6983]: "còn gọi: reactive backpressure, subscriber.request(n), demand-driven flow"
            - paragraph [ref=f81e6984]:
              - generic [ref=f81e6985]: Vấn đề
              - text: Producer nhanh hơn consumer trong reactive streams → buffer vô hạn.
            - paragraph [ref=f81e6986]:
              - generic [ref=f81e6987]: Nguồn gốc
              - text: "Reactive Streams initiative: collaboration giữa Kaazing, Lightbend, Netflix, Pivotal, Red Hat, Twitter và nhiều others; Java API v1.0.4 phát hành 2022-05-26; java.util.concurrent.Flow trong JDK 9 tương đương 1:1."
            - paragraph [ref=f81e6988]:
              - generic [ref=f81e6989]: Giải pháp
              - text: "Demand-driven: Subscriber gọi Subscription.request(n) để yêu cầu n element; Publisher chỉ gửi tối đa n element (onNext) cho đến khi đủ demand. Request cộng dồn; request <= 0 → onError. Tránh stop-and-wait (request 1). Giữ buffer bounded theo demand."
            - paragraph [ref=f81e6990]:
              - text: "Liên quan:"
              - link "Queue Backpressure" [ref=f81e6991] [cursor=pointer]:
                - /url: "#queue-backpressure"
              - text: ", Reactive Streams,"
              - link "Head-of-Line Blocking" [ref=f81e6992] [cursor=pointer]:
                - /url: "#head-of-line-blocking"
          - article [ref=f81e6993]:
            - heading "Deadline Propagation" [level=4] [ref=f81e6994]
            - paragraph [ref=f81e6995]: "còn gọi: truyền hạn chót, cancellation propagation"
            - paragraph [ref=f81e6996]:
              - generic [ref=f81e6997]: Vấn đề
              - text: RPC đi qua nhiều tầng; khi client đã bỏ cuộc, các tầng sau vẫn tiếp tục xử lý và tiêu tốn thread/CPU cho kết quả không ai đọc.
            - paragraph [ref=f81e6998]:
              - generic [ref=f81e6999]: Nguồn gốc
              - text: Được mô tả trong Google SRE Book ch.22 'Addressing Cascading Failures' (2016), thực hành của Google RPC stack.
            - paragraph [ref=f81e7000]:
              - generic [ref=f81e7001]: Giải pháp
              - text: Client đặt một absolute deadline (thời điểm hết hạn tuyệt đối) và truyền theo từng hop; mỗi service kiểm tra thời gian còn lại trước mỗi bước xử lý, nếu đã hết hạn thì fail-fast và hủy (cancel) call xuống tầng con — cắt hẳn chuỗi xử lý vô ích.
            - paragraph [ref=f81e7002]:
              - text: "Liên quan:"
              - link "Timeout" [ref=f81e7003] [cursor=pointer]:
                - /url: "#timeout"
              - text: ","
              - link "Load Shedding" [ref=f81e7004] [cursor=pointer]:
                - /url: "#load-shedding"
              - text: ","
              - link "Graceful Shutdown" [ref=f81e7005] [cursor=pointer]:
                - /url: "#graceful-shutdown"
          - article [ref=f81e7006]:
            - heading "Queueing Theory Basics (M/M/1)" [level=4] [ref=f81e7007]
            - paragraph [ref=f81e7008]: "còn gọi: M/M/1 queue, Kendall notation"
            - paragraph [ref=f81e7009]:
              - generic [ref=f81e7010]: Vấn đề
              - text: Hiểu hành vi queue để dự đoán latency khi utilization cao.
            - paragraph [ref=f81e7011]:
              - generic [ref=f81e7012]: Nguồn gốc
              - text: "D. G. Kendall giới thiệu Kendall's notation năm 1953 ('Stochastic Processes Occurring in the Theory of Queues...', Annals of Mathematical Statistics, 24(3): 338–354). Erlang có công trình trước đó về telephone traffic."
            - paragraph [ref=f81e7013]:
              - generic [ref=f81e7014]: Giải pháp
              - text: "M/M/1: arrivals Poisson (M), service times exponential (M), 1 server. Utilization ρ=λ/μ < 1. Mean response time E[T]=1/(μ-λ), mean wait E[W]=ρ/(μ-λ). ρ tiến gần 1 → latency tăng nhanh (non-linear)."
            - paragraph [ref=f81e7015]:
              - text: "Liên quan:"
              - link "Little's Law" [ref=f81e7016] [cursor=pointer]:
                - /url: "#little-s-law"
              - text: ","
              - link "Head-of-Line Blocking" [ref=f81e7017] [cursor=pointer]:
                - /url: "#head-of-line-blocking"
              - text: ","
              - link "Capacity Planning" [ref=f81e7018] [cursor=pointer]:
                - /url: "#capacity-planning"
          - article [ref=f81e7019]:
            - heading "Quorum Read/Write" [level=4] [ref=f81e7020]
            - paragraph [ref=f81e7021]: "còn gọi: quorum, r+w>n, weighted voting"
            - paragraph [ref=f81e7022]:
              - generic [ref=f81e7023]: Vấn đề
              - text: Cân bằng giữa consistency, availability, partition tolerance khi replica bị lag/lỗi.
            - paragraph [ref=f81e7024]:
              - generic [ref=f81e7025]: Nguồn gốc
              - text: David K. Gifford, 'Weighted voting for replicated data', SOSP '79 (ACM, 1979); Dynamo-style r+w>n phổ biến sau này.
            - paragraph [ref=f81e7026]:
              - generic [ref=f81e7027]: Giải pháp
              - text: "Với n replica: yêu cầu write quorum w, read quorum r với r+w>n → mọi read luôn giao với ít nhất 1 replica có dữ liệu mới nhất. Gifford dùng weighted voting (mỗi copy có số phiếu). Vw > V/2 đảm bảo hai write không xung đột."
            - paragraph [ref=f81e7028]:
              - text: "Liên quan:"
              - link "Replication Lag Tolerance" [ref=f81e7029] [cursor=pointer]:
                - /url: "#replication-lag-tolerance"
              - text: ","
              - link "Redundancy/N+1 Redundancy" [ref=f81e7030] [cursor=pointer]:
                - /url: "#redundancy-n-1-redundancy"
        - generic [ref=f81e7031]:
          - heading "Bảo mật & Xác thực 6" [level=3] [ref=f81e7032]:
            - text: Bảo mật & Xác thực
            - generic [ref=f81e7033]: "6"
          - article [ref=f81e7034]:
            - heading "ACME (Automatic Certificate Management Environment)" [level=4] [ref=f81e7035]
            - paragraph [ref=f81e7036]: "còn gọi: giao thức cấp cert tự động, Let's Encrypt protocol"
            - paragraph [ref=f81e7037]:
              - generic [ref=f81e7038]: Vấn đề
              - text: "Trước ACME, gắn HTTPS là thủ công: generate CSR, paste vào web CA, chứng minh sở hữu domain qua email/HTTP, tải cert về cài tay — người làm web mất 1–3 giờ mỗi cert, và cert expire vì quên gia hạn khiến site sập. Hàng triệu site nhỏ không đủ resources nên web toàn cầu vẫn HTTP plaintext."
            - paragraph [ref=f81e7039]:
              - generic [ref=f81e7040]: Nguồn gốc
              - text: IETF RFC 8555 (3/2019) — R. Barnes (Cisco), J. Hoffman-Andrews (EFF), D. McCarney (Let's Encrypt), J. Kasten (UMich); phát triển qua IETF ACME WG
            - paragraph [ref=f81e7041]:
              - generic [ref=f81e7042]: Giải pháp
              - text: "Giao thức machine-to-machine: client đăng ký account, submit order, chứng minh quyền kiểm soát domain qua challenge (http-01/dns-01), finalize với CSR, tải cert — mọi bước tự động, kèm auto-renew; Let's Encrypt cấp cert miễn phí hàng triệu domain."
            - paragraph [ref=f81e7043]:
              - text: "Liên quan: X.509 & PKI,"
              - link "mTLS" [ref=f81e7044] [cursor=pointer]:
                - /url: "#mtls"
          - article [ref=f81e7045]:
            - heading "capability token" [level=4] [ref=f81e7046]
            - paragraph [ref=f81e7047]: "còn gọi: capability-based token"
            - paragraph [ref=f81e7048]:
              - generic [ref=f81e7049]: Vấn đề
              - text: Access token truyền thống thường đại diện cho identity (who), nhưng để kiểm soát chặt 'có quyền làm gì với resource nào', cần token mang theo quyền hạn (capability) thay vì chỉ identity.
            - paragraph [ref=f81e7050]:
              - generic [ref=f81e7051]: Nguồn gốc
              - text: Capability-based security (Dennis–Van Horn 1966), modern incarnations (macaroons, Biscuit)
            - paragraph [ref=f81e7052]:
              - generic [ref=f81e7053]: Giải pháp
              - text: Token chứa danh sách quyền (capabilities) và có thể bị thu hẹp (attenuation), ký để xác minh. Client chỉ trình token có đúng capability khi gọi API.
            - paragraph [ref=f81e7054]:
              - text: "Liên quan:"
              - link "JWT" [ref=f81e7055] [cursor=pointer]:
                - /url: "#jwt"
              - text: ","
              - link "permission model" [ref=f81e7056] [cursor=pointer]:
                - /url: "#permission-model"
          - article [ref=f81e7057]:
            - heading "mTLS (mutual TLS)" [level=4] [ref=f81e7058]
            - paragraph [ref=f81e7059]: "còn gọi: TLS hai chiều, mutual TLS"
            - paragraph [ref=f81e7060]:
              - generic [ref=f81e7061]: Vấn đề
              - text: TLS một chiều chỉ server chứng minh danh tính với client — service A gọi service B qua HTTPS vẫn không biết ai đang gọi mình; trong service mesh/microservice, endpoint nội bộ không auth thì pod bị compromise là attacker gọi thoải mái mọi API nội bộ ('internal ≠ trusted'). API key header thì gửi plaintext trong header, steal được là dùng được ở máy khác.
            - paragraph [ref=f81e7062]:
              - generic [ref=f81e7063]: Nguồn gốc
              - text: không rõ (kéo dài từ TLS + X.509 client certificate authentication)
            - paragraph [ref=f81e7064]:
              - generic [ref=f81e7065]: Giải pháp
              - text: Client cũng phải presenting X.509 certificate và server verify nó trước khi handshake — cả hai bên xác thực qua PKI, token/cert bound với sender; dùng trong service mesh (Istio/Linkerd), API cấp doanh nghiệp, và trong OAuth làm sender-constrained token.
            - paragraph [ref=f81e7066]:
              - text: "Liên quan: X.509 / PKI, OAuth 2.1,"
              - link "Secrets management" [ref=f81e7067] [cursor=pointer]:
                - /url: "#secrets-management"
          - article [ref=f81e7068]:
            - heading "OAuth 2.1 & Security BCP" [level=4] [ref=f81e7069]
            - paragraph [ref=f81e7070]: "còn gọi: OAuth 2.1, sender-constrained tokens, DPoP"
            - paragraph [ref=f81e7071]:
              - generic [ref=f81e7072]: Vấn đề
              - text: "OAuth 2.0 (RFC 6749, 2012) còn để lại nhiều feature được chứng minh bất an toàn qua thực tế: implicit flow lộ token trong URL, không bắt PKCE (code injection), refresh token tĩnh bị replay. Các lỗ hổng này bị khai thác thật trong tích hợp mobile/SPA nên IETF phải gộp các bản security BCP thành một spec mới."
            - paragraph [ref=f81e7073]:
              - generic [ref=f81e7074]: Nguồn gốc
              - text: draft-ietf-oauth-v2-1 (IETF, thay RFC 6749); RFC 9700 (Security BCP)
            - paragraph [ref=f81e7075]:
              - generic [ref=f81e7076]: Giải pháp
              - text: OAuth 2.1 bỏ implicit + resource-owner-password grant, bắt buộc PKCE, siết redirect URI matching, refresh token rotation; RFC 9700 thêm sender-constrained tokens (DPoP/mTLS bind token vào client cụ thể để token đánh cắp không dùng được ở nơi khác).
            - paragraph [ref=f81e7077]:
              - text: "Liên quan:"
              - link "OAuth 2.0" [ref=f81e7078] [cursor=pointer]:
                - /url: "#oauth-2-0"
              - text: ","
              - link "PKCE" [ref=f81e7079] [cursor=pointer]:
                - /url: "#pkce"
              - text: ","
              - link "mTLS" [ref=f81e7080] [cursor=pointer]:
                - /url: "#mtls"
              - text: ","
              - link "Refresh token rotation" [ref=f81e7081] [cursor=pointer]:
                - /url: "#refresh-token-rotation"
          - article [ref=f81e7082]:
            - heading "X.509 & PKI certificate management" [level=4] [ref=f81e7083]
            - paragraph [ref=f81e7084]: "còn gọi: chứng chỉ số, PKI, certificate chain, CRL/OCSP"
            - paragraph [ref=f81e7085]:
              - generic [ref=f81e7086]: Vấn đề
              - text: Không có cách chuẩn để chứng minh 'public key này thuộc về domain này' — MITM tự sinh key thì attacker đứng giữa mọi kết nối. Và sau khi phát hiện cert bị compromise hoặc domain bị chiếm, cần cơ chế thu hồi trước khi hết hạn (cert 90 ngày mà attacker dùng được 90 ngày = tai nạn).
            - paragraph [ref=f81e7087]:
              - generic [ref=f81e7088]: Nguồn gốc
              - text: ITU-T X.509 (chuẩn format public key certificate); PKIX profile của IETF (RFC 5280 cho CRL)
            - paragraph [ref=f81e7089]:
              - generic [ref=f81e7090]: Giải pháp
              - text: "X.509 bind identity ↔ public key qua chữ ký của CA, xác minh theo chain lên trust anchor; thu hồi qua CRL (danh sách đen ký) hoặc OCSP (hỏi real-time). Quản lý lifecycle: issuance, renewal, rotation, revocation — sai khâu nào cũng mở lỗ hổng."
            - paragraph [ref=f81e7091]:
              - text: "Liên quan:"
              - link "mTLS" [ref=f81e7092] [cursor=pointer]:
                - /url: "#mtls"
              - text: ", ACME, Certificate pinning"
          - article [ref=f81e7093]:
            - heading "zero trust" [level=4] [ref=f81e7094]
            - paragraph [ref=f81e7095]: "còn gọi: Zero Trust Architecture"
            - paragraph [ref=f81e7096]:
              - generic [ref=f81e7097]: Vấn đề
              - text: Mô hình perimeter cũ (trust internal network) không còn phù hợp với cloud, remote work, BYOD. Giả định mạng có thể bị xâm nhập; cần không tin tưởng ngầm, luôn xác minh.
            - paragraph [ref=f81e7098]:
              - generic [ref=f81e7099]: Nguồn gốc
              - text: NIST SP 800-207 (Rose et al., 2020)
            - paragraph [ref=f81e7100]:
              - generic [ref=f81e7101]: Giải pháp
              - text: "Nguyên tắc: never trust, always verify; xác thực+ủy quyền mọi request (user/device/context); micro-segmentation; assume breach; focus on resources thay vì network perimeter."
            - paragraph [ref=f81e7102]:
              - text: "Liên quan:"
              - link "least privilege" [ref=f81e7103] [cursor=pointer]:
                - /url: "#least-privilege"
              - text: ","
              - link "mTLS" [ref=f81e7104] [cursor=pointer]:
                - /url: "#mtls"
              - text: ","
              - link "RBAC" [ref=f81e7105] [cursor=pointer]:
                - /url: "#rbac"
        - generic [ref=f81e7106]:
          - heading "Kiểm thử & Chất lượng 16" [level=3] [ref=f81e7107]:
            - text: Kiểm thử & Chất lượng
            - generic [ref=f81e7108]: "16"
          - article [ref=f81e7109]:
            - heading "canary analysis" [level=4] [ref=f81e7110]
            - paragraph [ref=f81e7111]: "còn gọi: canary testing, canary release"
            - paragraph [ref=f81e7112]:
              - generic [ref=f81e7113]: Vấn đề
              - text: Deploy toàn bộ user cùng lúc gây outage lớn. Cần phát hiện vấn đề sớm với tập nhỏ user trước khi lan rộng.
            - paragraph [ref=f81e7114]:
              - generic [ref=f81e7115]: Nguồn gốc
              - text: Coal mining canary + modern CD (Google/SRE practices)
            - paragraph [ref=f81e7116]:
              - generic [ref=f81e7117]: Giải pháp
              - text: Phát hành version mới cho % nhỏ user (canary), theo dõi metric quan trọng (error rate, latency). Nếu ổn định mới tăng dần.
            - paragraph [ref=f81e7118]:
              - text: "Liên quan:"
              - link "A/B test" [ref=f81e7119] [cursor=pointer]:
                - /url: "#a-b-test"
              - text: ","
              - link "feature flag testing" [ref=f81e7120] [cursor=pointer]:
                - /url: "#feature-flag-testing"
              - text: ","
              - link "chaos test" [ref=f81e7121] [cursor=pointer]:
                - /url: "#chaos-test"
          - article [ref=f81e7122]:
            - heading "chaos test" [level=4] [ref=f81e7123]
            - paragraph [ref=f81e7124]: "còn gọi: chaos engineering, chaos testing"
            - paragraph [ref=f81e7125]:
              - generic [ref=f81e7126]: Vấn đề
              - text: Hệ thống phân tán fail theo cách không lường trước (network partition, pod crash). Production vẫn fail dù dev/test ổn định.
            - paragraph [ref=f81e7127]:
              - generic [ref=f81e7128]: Nguồn gốc
              - text: Netflix (Chaos Monkey)
            - paragraph [ref=f81e7129]:
              - generic [ref=f81e7130]: Giải pháp
              - text: "Thử nghiệm chủ động: gây gián đoạn có kiểm soát (kill instance, delay network) để xác minh hệ thống chịu lỗi và tự phục hồi."
            - paragraph [ref=f81e7131]:
              - text: "Liên quan:"
              - link "stress test" [ref=f81e7132] [cursor=pointer]:
                - /url: "#stress-test"
              - text: ","
              - link "canary analysis" [ref=f81e7133] [cursor=pointer]:
                - /url: "#canary-analysis"
          - article [ref=f81e7134]:
            - heading "Characterization test" [level=4] [ref=f81e7135]
            - paragraph [ref=f81e7136]: "còn gọi: Golden master test"
            - paragraph [ref=f81e7137]:
              - generic [ref=f81e7138]: Vấn đề
              - text: Legacy code không có test, không có tài liệu rõ ràng — không thể biết hành vi hiện tại là đúng hay sai, nhưng cần bảo vệ hành vi đó khi refactor.
            - paragraph [ref=f81e7139]:
              - generic [ref=f81e7140]: Nguồn gốc
              - text: Michael Feathers (Working Effectively with Legacy Code)
            - paragraph [ref=f81e7141]:
              - generic [ref=f81e7142]: Giải pháp
              - text: Quan sát hành vi thực tế của code với input cụ thể, lưu output hiện tại làm "golden master", sau đó viết test so sánh output mới với golden master. Test chỉ phát hiện thay đổi, không khẳng định tính đúng đắn.
            - paragraph [ref=f81e7143]:
              - text: "Liên quan:"
              - link "Regression test" [ref=f81e7144] [cursor=pointer]:
                - /url: "#regression-test"
              - text: ", Legacy code,"
              - link "Golden master" [ref=f81e7145] [cursor=pointer]:
                - /url: "#golden-master"
          - article [ref=f81e7146]:
            - heading "consumer-driven contract" [level=4] [ref=f81e7147]
            - paragraph [ref=f81e7148]: "còn gọi: CDC"
            - paragraph [ref=f81e7149]:
              - generic [ref=f81e7150]: Vấn đề
              - text: Provider không biết consumer cần gì. Việc "đồng thuận contract" thường muộn, gây xung đột khi tích hợp.
            - paragraph [ref=f81e7151]:
              - generic [ref=f81e7152]: Nguồn gốc
              - text: Ian Robinson (Consumer-Driven Contracts)
            - paragraph [ref=f81e7153]:
              - generic [ref=f81e7154]: Giải pháp
              - text: Consumer định nghĩa yêu cầu contract của mình, Provider phải đáp ứng. Ưu tiên nhu cầu thực tế thay vì design một chiều.
            - paragraph [ref=f81e7155]:
              - text: "Liên quan:"
              - link "contract test (Pact)" [ref=f81e7156] [cursor=pointer]:
                - /url: "#contract-test-pact"
              - text: ","
              - link "integration test" [ref=f81e7157] [cursor=pointer]:
                - /url: "#integration-test"
              - text: ","
              - link "Contract testing" [ref=f81e7158] [cursor=pointer]:
                - /url: "#contract-testing"
              - text: ","
              - link "Pact" [ref=f81e7159] [cursor=pointer]:
                - /url: "#pact"
          - article [ref=f81e7160]:
            - heading "contract test (Pact)" [level=4] [ref=f81e7161]
            - paragraph [ref=f81e7162]: "còn gọi: contract testing, Pact"
            - paragraph [ref=f81e7163]:
              - generic [ref=f81e7164]: Vấn đề
              - text: Consumer và Provider (API) triển khai độc lập. Consumer test pass nhưng Provider thay đổi contract → tích hợp fail ở môi trường thật.
            - paragraph [ref=f81e7165]:
              - generic [ref=f81e7166]: Nguồn gốc
              - text: Pact Foundation / Matt Fellows et al.
            - paragraph [ref=f81e7167]:
              - generic [ref=f81e7168]: Giải pháp
              - text: Consumer tạo contract (Pact file), Provider verify contract đó. Giúp phát hiện breaking change sớm trước khi deploy.
            - paragraph [ref=f81e7169]:
              - text: "Liên quan:"
              - link "consumer-driven contract" [ref=f81e7170] [cursor=pointer]:
                - /url: "#consumer-driven-contract"
              - text: ","
              - link "integration test" [ref=f81e7171] [cursor=pointer]:
                - /url: "#integration-test"
              - text: ","
              - link "e2e test" [ref=f81e7172] [cursor=pointer]:
                - /url: "#e2e-test"
          - article [ref=f81e7173]:
            - heading "Contract testing" [level=4] [ref=f81e7174]
            - paragraph [ref=f81e7175]:
              - generic [ref=f81e7176]: Vấn đề
              - text: Trong kiến trúc microservices, service consumer và provider thường được triển khai độc lập — integration test toàn hệ thống chậm, đắt và dễ brittle; cần đảm bảo hợp đồng giao tiếp (API contract) vẫn tương thích.
            - paragraph [ref=f81e7177]:
              - generic [ref=f81e7178]: Nguồn gốc
              - text: Matt Fellows / Pact (Pact.io)
            - paragraph [ref=f81e7179]:
              - generic [ref=f81e7180]: Giải pháp
              - text: Consumer định nghĩa kỳ vọng (contract) dựa trên những gì nó thực sự dùng; provider xác minh (verify) có đáp ứng đúng contract đó. Giúp phát hiện breaking change sớm mà không cần deploy cả hai cùng lúc.
            - paragraph [ref=f81e7181]:
              - text: "Liên quan:"
              - link "Consumer-driven contract" [ref=f81e7182] [cursor=pointer]:
                - /url: "#consumer-driven-contract"
              - text: ","
              - link "Pact" [ref=f81e7183] [cursor=pointer]:
                - /url: "#pact"
              - text: ","
              - link "Integration test" [ref=f81e7184] [cursor=pointer]:
                - /url: "#integration-test"
          - article [ref=f81e7185]:
            - heading "golden master" [level=4] [ref=f81e7186]
            - paragraph [ref=f81e7187]: "còn gọi: characterization test, golden file"
            - paragraph [ref=f81e7188]:
              - generic [ref=f81e7189]: Vấn đề
              - text: Legacy code không có test, khó refactor mà không biết hành vi hiện tại. Cần "bắt" hành vi đúng như đang chạy.
            - paragraph [ref=f81e7190]:
              - generic [ref=f81e7191]: Nguồn gốc
              - text: Michael Feathers (Working Effectively with Legacy Code)
            - paragraph [ref=f81e7192]:
              - generic [ref=f81e7193]: Giải pháp
              - text: Lưu output thực tế làm golden master. Khi refactor, so sánh output mới với golden master để đảm bảo không thay đổi hành vi.
            - paragraph [ref=f81e7194]:
              - text: "Liên quan:"
              - link "snapshot test" [ref=f81e7195] [cursor=pointer]:
                - /url: "#snapshot-test"
              - text: ","
              - link "refactoring" [ref=f81e7196] [cursor=pointer]:
                - /url: "#refactoring"
              - text: ","
              - link "regression test" [ref=f81e7197] [cursor=pointer]:
                - /url: "#regression-test"
              - text: ","
              - link "Characterization test" [ref=f81e7198] [cursor=pointer]:
                - /url: "#characterization-test"
          - article [ref=f81e7199]:
            - heading "hermetic test" [level=4] [ref=f81e7200]
            - paragraph [ref=f81e7201]: "còn gọi: hermetic testing"
            - paragraph [ref=f81e7202]:
              - generic [ref=f81e7203]: Vấn đề
              - text: Test phụ thuộc external (network, service bên ngoài) → không chạy được offline, không ổn định trong CI.
            - paragraph [ref=f81e7204]:
              - generic [ref=f81e7205]: Nguồn gốc
              - text: Google Testing Blog (hermetic servers/tests)
            - paragraph [ref=f81e7206]:
              - generic [ref=f81e7207]: Giải pháp
              - text: "Test chạy hoàn toàn độc lập: dùng fake/in-memory, mock network, không gọi external service. Đảm bảo reproducible."
            - paragraph [ref=f81e7208]:
              - text: "Liên quan:"
              - link "test isolation" [ref=f81e7209] [cursor=pointer]:
                - /url: "#test-isolation"
              - text: ","
              - link "deterministic test" [ref=f81e7210] [cursor=pointer]:
                - /url: "#deterministic-test"
              - text: ","
              - link "mocking/stub/fake/spy" [ref=f81e7211] [cursor=pointer]:
                - /url: "#mocking-stub-fake-spy"
              - text: ","
              - link "Test isolation" [ref=f81e7212] [cursor=pointer]:
                - /url: "#test-isolation"
              - text: ","
              - link "Flaky test" [ref=f81e7213] [cursor=pointer]:
                - /url: "#flaky-test"
          - article [ref=f81e7214]:
            - heading "mutation testing" [level=4] [ref=f81e7215]
            - paragraph [ref=f81e7216]: "còn gọi: mutation analysis"
            - paragraph [ref=f81e7217]:
              - generic [ref=f81e7218]: Vấn đề
              - text: "Test coverage cao nhưng vẫn không bắt lỗi: test có thể pass dù logic đã bị thay đổi sai (mutant sống)."
            - paragraph [ref=f81e7219]:
              - generic [ref=f81e7220]: Nguồn gốc
              - text: Richard Lipton (1971), DeMillo et al.
            - paragraph [ref=f81e7221]:
              - generic [ref=f81e7222]: Giải pháp
              - text: Tạo mutant (thay đổi nhỏ code), chạy test. Nếu tất cả test pass → mutant sống (test yếu). Mục tiêu giết mutant.
            - paragraph [ref=f81e7223]:
              - text: "Liên quan:"
              - link "test coverage (line vs branch)" [ref=f81e7224] [cursor=pointer]:
                - /url: "#test-coverage-line-vs-branch"
              - text: ","
              - link "regression test" [ref=f81e7225] [cursor=pointer]:
                - /url: "#regression-test"
              - text: ","
              - link "Code coverage" [ref=f81e7226] [cursor=pointer]:
                - /url: "#code-coverage"
              - text: ", Test suite quality"
          - article [ref=f81e7227]:
            - heading "Pact" [level=4] [ref=f81e7228]
            - paragraph [ref=f81e7229]:
              - generic [ref=f81e7230]: Vấn đề
              - text: Cần công cụ thực thi consumer-driven contract testing một cách tự động trong CI.
            - paragraph [ref=f81e7231]:
              - generic [ref=f81e7232]: Nguồn gốc
              - text: Matt Fellows và cộng đồng Pact (Pact Foundation)
            - paragraph [ref=f81e7233]:
              - generic [ref=f81e7234]: Giải pháp
              - text: "Framework mã nguồn mở cho contract testing: consumer sinh ra file pact, provider verify file pact đó trong pipeline CI để bắt breaking change."
            - paragraph [ref=f81e7235]:
              - text: "Liên quan:"
              - link "Contract testing" [ref=f81e7236] [cursor=pointer]:
                - /url: "#contract-testing"
              - text: ","
              - link "Consumer-driven contract" [ref=f81e7237] [cursor=pointer]:
                - /url: "#consumer-driven-contract"
          - article [ref=f81e7238]:
            - heading "property-based test" [level=4] [ref=f81e7239]
            - paragraph [ref=f81e7240]: "còn gọi: property-based testing, PBT"
            - paragraph [ref=f81e7241]:
              - generic [ref=f81e7242]: Vấn đề
              - text: Example-based test chỉ kiểm tra vài trường hợp. Dễ bỏ sót edge case (empty, boundary, negative). Ví dụ-based test chỉ kiểm tra một vài trường hợp cụ thể, dễ bỏ sót trường hợp biên ngẫu nhiên gây lỗi; cần kiểm tra tính chất (property) phải đúng với mọi input hợp lệ.
            - paragraph [ref=f81e7243]:
              - generic [ref=f81e7244]: Nguồn gốc
              - text: Koen Claessen & John Hughes (QuickCheck)
            - paragraph [ref=f81e7245]:
              - generic [ref=f81e7246]: Giải pháp
              - text: Định nghĩa thuộc tính (property) phải đúng với mọi input. Tool sinh ngẫu nhiên hàng trăm input để tìm counterexample. Developer định nghĩa thuộc tính phải luôn đúng (vd. reverse(reverse(xs)) == xs), công cụ sinh ngẫu nhiên hàng trăm input để tìm trường hợp vi phạm, sau đó rút gọn (shrinking) về trường hợp đơn giản nhất gây fail.
            - paragraph [ref=f81e7247]:
              - text: "Liên quan:"
              - link "unit test" [ref=f81e7248] [cursor=pointer]:
                - /url: "#unit-test"
              - text: ","
              - link "TDD" [ref=f81e7249] [cursor=pointer]:
                - /url: "#tdd"
              - text: ","
              - link "deterministic test" [ref=f81e7250] [cursor=pointer]:
                - /url: "#deterministic-test"
              - text: ","
              - link "Example-based testing" [ref=f81e7251] [cursor=pointer]:
                - /url: "#example-based-testing"
              - text: ","
              - link "QuickCheck" [ref=f81e7252] [cursor=pointer]:
                - /url: "#quickcheck"
              - text: ","
              - link "Shrinking" [ref=f81e7253] [cursor=pointer]:
                - /url: "#shrinking"
          - article [ref=f81e7254]:
            - heading "Quarantine" [level=4] [ref=f81e7255]
            - paragraph [ref=f81e7256]:
              - generic [ref=f81e7257]: Vấn đề
              - text: Khi một test flaky đã được xác nhận nhưng chưa sửa ngay, nó vẫn có thể chặn toàn bộ pipeline CI — cần cách ngăn nó làm fail build mà vẫn theo dõi được.
            - paragraph [ref=f81e7258]:
              - generic [ref=f81e7259]: Nguồn gốc
              - text: Google (Flaky test handling)
            - paragraph [ref=f81e7260]:
              - generic [ref=f81e7261]: Giải pháp
              - text: Đánh dấu test đã biết là flaky và chạy riêng/quá trình đánh giá tách biệt (không fail CI mặc định) để tránh chặn team, đồng thời theo dõi tần suất fail để ưu tiên sửa.
            - paragraph [ref=f81e7262]:
              - text: "Liên quan:"
              - link "Flaky test" [ref=f81e7263] [cursor=pointer]:
                - /url: "#flaky-test"
          - article [ref=f81e7264]:
            - heading "QuickCheck" [level=4] [ref=f81e7265]
            - paragraph [ref=f81e7266]:
              - generic [ref=f81e7267]: Vấn đề
              - text: Cần công cụ để tự động sinh test case từ property thay vì phải viết thủ công hàng loạt example.
            - paragraph [ref=f81e7268]:
              - generic [ref=f81e7269]: Nguồn gốc
              - text: Koen Claessen & John Hughes (1999), Haskell
            - paragraph [ref=f81e7270]:
              - generic [ref=f81e7271]: Giải pháp
              - text: Thư viện gốc Haskell cho property-based testing, sau này được triển khai lại trên nhiều ngôn ngữ (Hypothesis Python, RapidCheck C++, ScalaCheck...).
            - paragraph [ref=f81e7272]:
              - text: "Liên quan:"
              - link "property-based test" [ref=f81e7273] [cursor=pointer]:
                - /url: "#property-based-test"
              - text: ","
              - link "Shrinking" [ref=f81e7274] [cursor=pointer]:
                - /url: "#shrinking"
          - article [ref=f81e7275]:
            - heading "SAST/DAST" [level=4] [ref=f81e7276]
            - paragraph [ref=f81e7277]: "còn gọi: SAST, DAST, Static Application Security Testing, Dynamic Application Security Testing"
            - paragraph [ref=f81e7278]:
              - generic [ref=f81e7279]: Vấn đề
              - text: Lỗ hổng bảo mật (SQLi, XSS) thường phát hiện muộn. Cần quét cả mã nguồn và ứng dụng đang chạy.
            - paragraph [ref=f81e7280]:
              - generic [ref=f81e7281]: Nguồn gốc
              - text: OWASP-aligned tooling
            - paragraph [ref=f81e7282]:
              - generic [ref=f81e7283]: Giải pháp
              - text: "SAST: quét source không chạy. DAST: quét ứng dụng đang chạy (black-box) để tìm lỗ hổng thực tế."
            - paragraph [ref=f81e7284]:
              - text: "Liên quan:"
              - link "static analysis" [ref=f81e7285] [cursor=pointer]:
                - /url: "#static-analysis"
              - text: ","
              - link "chaos test" [ref=f81e7286] [cursor=pointer]:
                - /url: "#chaos-test"
              - text: ","
              - link "lint" [ref=f81e7287] [cursor=pointer]:
                - /url: "#lint"
          - article [ref=f81e7288]:
            - heading "Shrinking" [level=4] [ref=f81e7289]
            - paragraph [ref=f81e7290]:
              - generic [ref=f81e7291]: Vấn đề
              - text: Khi property-based test tìm thấy input gây fail, input đó thường phức tạp và khó debug; cần tự động đơn giản hóa về dạng tối thiểu nhất.
            - paragraph [ref=f81e7292]:
              - generic [ref=f81e7293]: Nguồn gốc
              - text: Koen Claessen & John Hughes (QuickCheck)
            - paragraph [ref=f81e7294]:
              - generic [ref=f81e7295]: Giải pháp
              - text: Thử loại bỏ hoặc đơn giản hóa từng phần của input thất bại cho đến khi không thể rút gọn thêm mà vẫn gây fail — giúp nhanh chóng xác định nguyên nhân.
            - paragraph [ref=f81e7296]:
              - text: "Liên quan:"
              - link "property-based test" [ref=f81e7297] [cursor=pointer]:
                - /url: "#property-based-test"
              - text: ","
              - link "QuickCheck" [ref=f81e7298] [cursor=pointer]:
                - /url: "#quickcheck"
          - article [ref=f81e7299]:
            - heading "soak test" [level=4] [ref=f81e7300]
            - paragraph [ref=f81e7301]: "còn gọi: endurance test, soak testing"
            - paragraph [ref=f81e7302]:
              - generic [ref=f81e7303]: Vấn đề
              - text: Hệ thống chạy tốt 1 giờ nhưng sau 8-24h xuất hiện memory leak, connection pool exhausted, disk full.
            - paragraph [ref=f81e7304]:
              - generic [ref=f81e7305]: Nguồn gốc
              - text: Performance testing
            - paragraph [ref=f81e7306]:
              - generic [ref=f81e7307]: Giải pháp
              - text: Chạy tải ổn định trong thời gian dài (hours) để phát hiện lỗi tích lũy (resource leak).
            - paragraph [ref=f81e7308]:
              - text: "Liên quan:"
              - link "load test" [ref=f81e7309] [cursor=pointer]:
                - /url: "#load-test"
              - text: ","
              - link "stress test" [ref=f81e7310] [cursor=pointer]:
                - /url: "#stress-test"
        - generic [ref=f81e7311]:
          - heading "DevOps & Triển khai 5" [level=3] [ref=f81e7312]:
            - text: DevOps & Triển khai
            - generic [ref=f81e7313]: "5"
          - article [ref=f81e7314]:
            - heading "Canary deploy" [level=4] [ref=f81e7315]
            - paragraph [ref=f81e7316]: "còn gọi: canary release, canary rollout, phát hành dần, chim hoàng yến"
            - paragraph [ref=f81e7317]:
              - generic [ref=f81e7318]: Vấn đề
              - text: Bug chỉ lộ với 1% traffic thật (dữ liệu thật, khu vực thật, timezone thật); tung toàn bộ rồi phát hiện thì toàn bộ user đã bị ảnh hưởng và rollback cũng đau. Blue-green chỉ test được môi trường trống — vẫn không trả lời được 'bản mới có chịu nổi user thật không'.
            - paragraph [ref=f81e7319]:
              - generic [ref=f81e7320]: Nguồn gốc
              - text: Cái tên lấy từ metaphor 'chim hoàng yến trong mỏ than' (canary in the coal mine) — con nhạy với khí độc hơn người nên chết trước để cảnh báo; kỹ thuật được Google/Facebook dùng rộng và phổ biến qua cộng đồng continuous delivery.
            - paragraph [ref=f81e7321]:
              - generic [ref=f81e7322]: Giải pháp
              - text: Đưa bản mới cho một phần rất nhỏ lưu lượng (1-5% user hoặc một node) trước, quan sát error rate/latency/metrics so với baseline; ổn thì tăng dần tới 100%, bất ổn thì dừng và rollback chỉ phần đó, 99% user không biết chuyện gì xảy ra.
            - paragraph [ref=f81e7323]:
              - text: "Liên quan:"
              - link "blue-green deploy" [ref=f81e7324] [cursor=pointer]:
                - /url: "#blue-green-deploy"
              - text: ","
              - link "feature flag" [ref=f81e7325] [cursor=pointer]:
                - /url: "#feature-flag"
              - text: ","
              - link "zero-downtime deploy (rolling deploy)" [ref=f81e7326] [cursor=pointer]:
                - /url: "#zero-downtime-deploy-rolling-deploy"
              - text: ","
              - link "rollback" [ref=f81e7327] [cursor=pointer]:
                - /url: "#rollback"
              - text: ","
              - link "smoke test" [ref=f81e7328] [cursor=pointer]:
