          - article [ref=f81e6193]:
            - heading "Materialized view" [level=4] [ref=f81e6194]
            - paragraph [ref=f81e6195]: "còn gọi: view vật lý hóa, indexed view, view vật lý, precomputed view, bảng tổng hợp"
            - paragraph [ref=f81e6196]:
              - generic [ref=f81e6197]: Vấn đề
              - text: Báo cáo phải JOIN 5 bảng + GROUP BY triệu row mỗi lần chạy — query nặng lặp lại hàng giờ, BI team chờ mỏi, và view thường thì mỗi lần truy vấn vẫn tính lại toàn bộ.
            - paragraph [ref=f81e6198]:
              - generic [ref=f81e6199]: Nguồn gốc
              - text: Oracle Database là hệ đầu tiên implement (trước đó gọi là snapshots); PostgreSQL native từ 9.3 (2013)
            - paragraph [ref=f81e6200]:
              - generic [ref=f81e6201]: Giải pháp
              - text: Lưu kết quả query thành bảng vật lý thật (có index riêng), refresh định kỳ hoặc CONCURRENTLY — đọc báo cáo gần như tức thì; đánh đổi là data cũ theo chu kỳ refresh và tốn thêm disk. Oracle đi đầu (gọi trước là 'snapshots', query rewrite từ 8i), Postgres hỗ trợ từ 9.3, SQL Server gọi là Indexed Views (2000).
