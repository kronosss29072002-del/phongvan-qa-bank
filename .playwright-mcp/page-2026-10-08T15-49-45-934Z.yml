          - article [ref=f81e5497]:
            - heading "test coverage (line vs branch)" [level=4] [ref=f81e5498]
            - paragraph [ref=f81e5499]: "còn gọi: code coverage, line coverage, branch coverage"
            - paragraph [ref=f81e5500]:
              - generic [ref=f81e5501]: Vấn đề
              - text: "Team muốn biết \"đã test đến đâu\", nhưng chỉ đếm dòng không đủ: nhánh if/else chưa được test vẫn ẩn lỗi."
            - paragraph [ref=f81e5502]:
              - generic [ref=f81e5503]: Nguồn gốc
              - text: Miller/Testing metrics
            - paragraph [ref=f81e5504]:
              - generic [ref=f81e5505]: Giải pháp
              - text: "Line coverage: % dòng thực thi. Branch coverage: % nhánh điều kiện (true/false) được đi qua. Dùng để gợi ý, không phải mục tiêu tuyệt đối."
            - paragraph [ref=f81e5506]:
              - text: "Liên quan:"
