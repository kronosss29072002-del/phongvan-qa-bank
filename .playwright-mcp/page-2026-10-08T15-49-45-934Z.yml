              - text: ", Request timeout budgets"
          - article [ref=f81e1676]:
            - heading "Fallback" [level=4] [ref=f81e1677]
            - paragraph [ref=f81e1678]: "còn gọi: phương án thay thế, fallback path"
            - paragraph [ref=f81e1679]:
              - generic [ref=f81e1680]: Vấn đề
              - text: Dependency chính không sẵn sàng thì request fail toàn bộ thay vì trả kết quả thay thế.
            - paragraph [ref=f81e1681]:
              - generic [ref=f81e1682]: Giải pháp
              - text: "Khi primary fail (thường trigger bởi circuit breaker/timeout), chuyển sang đường thay thế: cache/CDN, service dự phòng, dữ liệu mặc định, trả 'đang xử lý sau'. Fallback phải nhanh (không gọi thêm dependency chậm như primary) và tránh tầng tầng lớp phủ lỗi che bug thật."
            - paragraph [ref=f81e1683]:
              - text: "Liên quan:"
              - link "Circuit Breaker" [ref=f81e1684] [cursor=pointer]:
                - /url: "#circuit-breaker"
              - text: ","
              - link "Graceful Degradation" [ref=f81e1685] [cursor=pointer]:
                - /url: "#graceful-degradation"
              - text: ","
              - link "Timeout" [ref=f81e1686] [cursor=pointer]:
                - /url: "#timeout"
          - article [ref=f81e1687]:
            - heading "Load Testing" [level=4] [ref=f81e1688]
            - paragraph [ref=f81e1689]: "còn gọi: kiểm thử tải, performance testing, kịch bản tải"
            - paragraph [ref=f81e1690]:
              - generic [ref=f81e1691]: Vấn đề
              - text: Không biết hệ thống chịu được bao nhiêu trước khi có khách thật.
            - paragraph [ref=f81e1692]:
              - generic [ref=f81e1693]: Giải pháp
              - text: Mô phỏng lưu lượng gần thực tế (steady state, ramp-up, spike, soak) để tìm throughput tối đa, latency tail, điểm break. Load test nên chạy trước giờ cao điểm, theo kịch bản production-like, quan sát error rate/SLO.
            - paragraph [ref=f81e1694]:
              - text: "Liên quan:"
              - link "Stress Test vs Soak Test" [ref=f81e1695] [cursor=pointer]:
                - /url: "#stress-test-vs-soak-test"
              - text: ","
              - link "Capacity Planning" [ref=f81e1696] [cursor=pointer]:
                - /url: "#capacity-planning"
