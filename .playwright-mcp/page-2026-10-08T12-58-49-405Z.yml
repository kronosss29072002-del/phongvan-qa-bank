      - generic [ref=f73e397]:
        - generic [ref=f73e398]:
          - heading "Metric and label naming" [level=1] [ref=f73e399]
          - generic [ref=f73e400]:
            - paragraph [ref=f73e401]: The metric and label conventions presented in this document are not required for using Prometheus, but can serve as both a style-guide and a collection of best practices. Individual organizations may want to approach some of these practices, e.g. naming conventions, differently.
            - heading "Metric names" [level=2] [ref=f73e402]:
              - text: Metric names
              - link [ref=f73e403] [cursor=pointer]:
                - /url: "#metric-names"
            - paragraph [ref=f73e408]: A metric name...
            - list [ref=f73e409]:
              - listitem [ref=f73e410]:
                - text: ...MUST comply with the
                - link "data model" [ref=f73e411] [cursor=pointer]:
                  - /url: /docs/concepts/data_model/#metric-names-and-labels
                - text: for valid characters.
              - listitem [ref=f73e412]:
                - text: ...SHOULD have a (single-word) application prefix relevant to the domain the metric belongs to. The prefix is sometimes referred to as
                - code [ref=f73e413]: namespace
                - text: "by client libraries. For metrics specific to an application, the prefix is usually the application name itself. Sometimes, however, metrics are more generic, like standardized metrics exported by client libraries. Examples:"
                - list [ref=f73e414]:
                  - listitem [ref=f73e415]:
                    - code [ref=f73e416]: prometheus_notifications_total
                    - text: (specific to the Prometheus server)
                  - listitem [ref=f73e417]:
                    - code [ref=f73e418]: process_cpu_seconds_total
                    - text: (exported by many client libraries)
                  - listitem [ref=f73e419]:
                    - code [ref=f73e420]: http_request_duration_seconds
                    - text: (for all HTTP requests)
              - listitem [ref=f73e421]: ...MUST refer to a single unit (e.g. do not mix seconds with milliseconds) and to a single quantity (e.g. do not mix request size with request duration).
              - listitem [ref=f73e422]:
                - text: ...SHOULD use base units (e.g. seconds, bytes, meters - not milliseconds, megabytes, kilometers). See
                - link "below" [ref=f73e423] [cursor=pointer]:
                  - /url: "#base-units"
                - text: for a list of base units.
              - listitem [ref=f73e424]:
                - text: ...SHOULD have a suffix describing the unit, in plural form. Note that an accumulating count has
                - code [ref=f73e425]: total
                - text: as a suffix, in addition to the unit if applicable. Also note that this applies to units in the narrow sense (like the units in the table below), but not to countable things in general. For example,
                - code [ref=f73e426]: connections
                - text: or
                - code [ref=f73e427]: notifications
                - text: are not considered units for this rule and do not have to be at the end of the metric name. (See also examples in the next paragraph.)
                - list [ref=f73e428]:
                  - listitem [ref=f73e429]:
                    - code [ref=f73e430]: http_request_duration_seconds
                  - listitem [ref=f73e431]:
                    - code [ref=f73e432]: node_memory_usage_bytes
                  - listitem [ref=f73e433]:
                    - code [ref=f73e434]: http_requests_total
                    - text: (for a unit-less accumulating count)
                  - listitem [ref=f73e435]:
                    - code [ref=f73e436]: process_cpu_seconds_total
                    - text: (for an accumulating count with unit)
                  - listitem [ref=f73e437]:
                    - code [ref=f73e438]: foobar_build_info
                    - text: (for a pseudo-metric that provides
                    - link "metadata" [ref=f73e439] [cursor=pointer]:
                      - /url: https://www.robustperception.io/exposing-the-software-version-to-prometheus
                    - text: about the running binary)
                  - listitem [ref=f73e445]:
                    - code [ref=f73e446]: data_pipeline_last_record_processed_timestamp_seconds
                    - text: (for a timestamp that tracks the time of the latest record processed in a data processing pipeline)
              - listitem [ref=f73e447]:
                - text: "...MAY order its name components in a way that leads to convenient grouping when a list of metric names is sorted lexicographically, as long as all the other rules are followed. The following examples have their the common name components first so that all the related metrics are sorted together:"
                - list [ref=f73e448]:
                  - listitem [ref=f73e449]:
                    - code [ref=f73e450]: prometheus_tsdb_head_truncations_closed_total
                  - listitem [ref=f73e451]:
                    - code [ref=f73e452]: prometheus_tsdb_head_truncations_established_total
                  - listitem [ref=f73e453]:
                    - code [ref=f73e454]: prometheus_tsdb_head_truncations_failed_total
                  - listitem [ref=f73e455]:
                    - code [ref=f73e456]: prometheus_tsdb_head_truncations_total
                    - text: The following examples are also valid, but are following a different trade-off. They are easier to read individually, but unrelated metrics like
                    - code [ref=f73e457]: prometheus_tsdb_head_series
                    - text: might get sorted in between.
                  - listitem [ref=f73e458]:
                    - code [ref=f73e459]: prometheus_tsdb_head_closed_truncations_total
                  - listitem [ref=f73e460]:
                    - code [ref=f73e461]: prometheus_tsdb_head_established_truncations_total
                  - listitem [ref=f73e462]:
                    - code [ref=f73e463]: prometheus_tsdb_head_failed_truncations_total
                  - listitem [ref=f73e464]:
                    - code [ref=f73e465]: prometheus_tsdb_head_truncations_total
              - listitem [ref=f73e466]:
                - text: ...SHOULD represent the same logical thing-being-measured across all label dimensions.
                - list [ref=f73e467]:
                  - listitem [ref=f73e468]: request duration
                  - listitem [ref=f73e469]: bytes of data transfer
                  - listitem [ref=f73e470]: instantaneous resource usage as a percentage
            - paragraph [ref=f73e471]:
              - text: As a rule of thumb, either the
              - code [ref=f73e472]: sum()
              - text: or the
              - code [ref=f73e473]: avg()
              - text: over all dimensions of a given metric should be meaningful (though not necessarily useful). If it is not meaningful, split the data up into multiple metrics. For example, having the capacity of various queues in one metric is good, while mixing the capacity of a queue with the current number of elements in the queue is not.
            - heading "Why include unit and type suffixes in metric names?" [level=3] [ref=f73e474]:
              - text: Why include unit and type suffixes in metric names?
              - link [ref=f73e475] [cursor=pointer]:
                - /url: "#why-include-unit-and-type-suffixes-in-metric-names"
            - paragraph [ref=f73e480]: Some metric naming conventions (e.g. OpenTelemetry) do not recommend or even do not allow including information about a metric unit and type in the metric name. A common argument is that those pieces of information are already defined somewhere else (e.g. schema, metadata, other labels, etc.).
            - paragraph [ref=f73e481]: "Prometheus strongly recommends including unit and type in a metric name, even if you store that information elsewhere, because of the following practical reasons:"
            - list [ref=f73e482]:
              - listitem [ref=f73e483]:
                - strong [ref=f73e484]: Metric consumption reliability and UX
                - text: ": When interacting with a modern UI to use such a metric in PromQL, it's possible to display rich information about the metric's type and unit (autocompletion, overlays, pop-ups). Unfortunately, interactive, adhoc querying in a powerful UI is not the only way that users interact with metrics. Metric consumption ecosystem is vast. Majority of the consumption comes in a form of the plain YAML configuration for variety of observability tools like alerting, recording, autoscaling, dashboards, analysis, processing, etc. It's"
                - strong [ref=f73e485]: critical
                - text: ", especially during monitoring/SRE incident practices to look on PromQL expressions in plain YAML and understand the underlying metric type and unit you work with."
              - listitem [ref=f73e486]:
                - strong [ref=f73e487]: Metric collisions
                - text: ": With growing adoption and metric changes over time, there are cases where lack of unit and type information in the metric name will cause certain series to collide (e.g."
                - code [ref=f73e488]: process_cpu
                - text: for seconds and milliseconds).
            - heading "Labels" [level=2] [ref=f73e489]:
              - text: Labels
              - link [ref=f73e490] [cursor=pointer]:
                - /url: "#labels"
            - paragraph [ref=f73e495]: "Use labels to differentiate the characteristics of the thing that is being measured:"
            - list [ref=f73e496]:
              - listitem [ref=f73e497]:
                - code [ref=f73e498]: api_http_requests_total
                - text: "- differentiate request types:"
                - code [ref=f73e499]: operation="create|update|delete"
              - listitem [ref=f73e500]:
                - code [ref=f73e501]: api_request_duration_seconds
                - text: "- differentiate request stages:"
                - code [ref=f73e502]: stage="extract|transform|load"
            - paragraph [ref=f73e503]: Do not put the label names in the metric name, as this introduces redundancy and will cause confusion if the respective labels are aggregated away.
            - blockquote [ref=f73e504]:
              - strong [ref=f73e508]: CAUTION
              - text: ": Remember that every unique combination of key-value label pairs represents a new time series, which can dramatically increase the amount of data stored. Do not use labels to store dimensions with high cardinality (many different label values), such as user IDs, email addresses, or other unbounded sets of values."
            - heading "Base Units" [level=2] [ref=f73e509]:
              - text: Base Units
              - link [ref=f73e510] [cursor=pointer]:
                - /url: "#base-units"
            - paragraph [ref=f73e515]: Prometheus does not have any units hard coded. For better compatibility, base units should be used. The following lists some metrics families with their base unit. The list is not exhaustive.
            - table [ref=f73e516]:
              - rowgroup [ref=f73e517]:
                - row [ref=f73e518]:
                  - columnheader "Family" [ref=f73e519]
                  - columnheader "Base unit" [ref=f73e520]
                  - columnheader "Remark" [ref=f73e521]
              - rowgroup [ref=f73e522]:
                - row [ref=f73e523]:
                  - cell "Time" [ref=f73e524]
                  - cell "seconds" [ref=f73e525]
                  - cell [ref=f73e526]
                - row [ref=f73e527]:
                  - cell "Temperature" [ref=f73e528]
                  - cell "celsius" [ref=f73e529]
                  - cell [ref=f73e530]:
                    - emphasis [ref=f73e531]: celsius
                    - text: is preferred over
                    - emphasis [ref=f73e532]: kelvin
                    - text: for practical reasons.
                    - emphasis [ref=f73e533]: kelvin
                    - text: is acceptable as a base unit in special cases like color temperature or where temperature has to be absolute.
                - row [ref=f73e534]:
                  - cell "Length" [ref=f73e535]
                  - cell "meters" [ref=f73e536]
                  - cell [ref=f73e537]
                - row [ref=f73e538]:
                  - cell "Bytes" [ref=f73e539]
                  - cell "bytes" [ref=f73e540]
                  - cell [ref=f73e541]
                - row [ref=f73e542]:
                  - cell "Bits" [ref=f73e543]
                  - cell "bytes" [ref=f73e544]
                  - cell [ref=f73e545]:
                    - text: To avoid confusion combining different metrics, always use
                    - emphasis [ref=f73e546]: bytes
                    - text: ", even where"
                    - emphasis [ref=f73e547]: bits
                    - text: appear more common.
                - row [ref=f73e548]:
                  - cell "Percent" [ref=f73e549]
                  - cell "ratio" [ref=f73e550]
                  - cell [ref=f73e551]:
                    - text: Values are 0–1 (rather than 0–100).
                    - code [ref=f73e552]: ratio
                    - text: is only used as a suffix for names like
                    - code [ref=f73e553]: disk_usage_ratio
                    - text: . The usual metric name follows the pattern
                    - code [ref=f73e554]: A_per_B
                    - text: .
                - row [ref=f73e555]:
                  - cell "Voltage" [ref=f73e556]
                  - cell "volts" [ref=f73e557]
                  - cell [ref=f73e558]
                - row [ref=f73e559]:
                  - cell "Electric current" [ref=f73e560]
                  - cell "amperes" [ref=f73e561]
                  - cell [ref=f73e562]
                - row [ref=f73e563]:
                  - cell "Energy" [ref=f73e564]
                  - cell "joules" [ref=f73e565]
                  - cell [ref=f73e566]
                - row [ref=f73e567]:
                  - cell "Power" [ref=f73e568]
                  - cell [ref=f73e569]
                  - cell [ref=f73e570]:
                    - text: Prefer exporting a counter of joules, then
                    - code [ref=f73e571]: rate(joules[5m])
                    - text: gives you power in Watts.
                - row [ref=f73e572]:
                  - cell "Mass" [ref=f73e573]
                  - cell "grams" [ref=f73e574]
                  - cell [ref=f73e575]:
                    - emphasis [ref=f73e576]: grams
                    - text: is preferred over
                    - emphasis [ref=f73e577]: kilograms
                    - text: to avoid issues with the
                    - emphasis [ref=f73e578]: kilo
                    - text: prefix.
