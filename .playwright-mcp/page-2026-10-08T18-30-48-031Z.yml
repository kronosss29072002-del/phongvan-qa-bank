                        - listitem [ref=f269e198]:
                          - link "Luật sư tư vấn hướng giải quyết khi chơi hụi bị giật" [ref=f269e199] [cursor=pointer]:
                            - /url: "#ftoc-heading-10"
                    - heading "Pháp luật nói gì về hụi?" [level=2] [ref=f269e201]
                    - paragraph [ref=f269e202]: "Căn cứ quy định tại khoản 1 Điều 471 Bộ luật Dân sự 2015 thì hụi là là hình thức giao dịch về tài sản theo tập quán trên cơ sở thỏa thuận của một nhóm người tập hợp nhau lại cùng định ra số người, thời gian, số tiền hoặc tài sản khác, thể thức góp, lĩnh họ và quyền, nghĩa vụ của các thành viên. Các thỏa thuận cơ bản về hụi bao gồm:"
                    - list [ref=f269e203]:
                      - listitem [ref=f269e204]: Số hụi viên;
                      - listitem [ref=f269e205]: Thời gian chơi hui, kỳ hụi;
                      - listitem [ref=f269e206]: Số tiền hoặc tài sản khác;
                      - listitem [ref=f269e207]: Thể thức góp, lãnh hụi;
                      - listitem [ref=f269e208]: Quyền, nghĩa vụ của các thành viên.
                    - paragraph [ref=f269e209]: Nghiêm cấm việc tổ chức hụi dưới hình thức cho vay nặng lãi. Theo đó việc tổ chức hụi nhằm mục đích tương trợ trong nhân dân được thực hiện theo quy định của pháp luật.
                    - paragraph [ref=f269e210]: "Cơ sở pháp lý: Điều 471 Bộ luật Dân sự 2015"
                    - heading "Nguyên tắc tổ chức hụi" [level=2] [ref=f269e211]
                    - paragraph [ref=f269e212]: "Hụi được tổ chức với nguyên tắc sau:"
                    - list [ref=f269e213]:
                      - listitem [ref=f269e214]: Việc tổ chức phải tuân thủ các nguyên tắc cơ bản của pháp luật dân sự;
                      - listitem [ref=f269e215]: Việc tổ chức chỉ được thực hiện nhằm mục đích tương trợ lẫn nhau giữa những người tham gia quan hệ về họ;
                      - listitem [ref=f269e216]: Không được tổ chức để cho vay lãi nặng, lừa đảo chiếm đoạt tài sản, lạm dụng tín nhiệm chiếm đoạt tài sản, huy động vốn trái pháp luật hoặc các hành vi vi phạm pháp luật khác.
                    - paragraph [ref=f269e217]: "Cơ sở pháp lý: Điều 3 Nghị định 19/2019/NĐ-CP của Chính Phủ, ngày 19 tháng 02 năm 2019 về họ, hụi, biêu, phường."
                    - paragraph [ref=f269e218]:
                      - text: ">> Xem thêm:"
                      - link [ref=f269e219] [cursor=pointer]:
                        - /url: https://luat24h.com.vn/toi-lam-dung-tin-nhiem-chiem-doat-tai-san
                        - strong [ref=f269e220]: Tội lạm dụng tín nhiệm chiếm đoạt tài sản bị xử lý như thế nào
                    - heading "Đối tượng tham gia chơi hụi có thể là ai?" [level=2] [ref=f269e221]
                    - paragraph [ref=f269e222]: "Để tham gia vào dây hụi hụi viên phải đáp ứng các điều kiện quy định tại Điều 5 Nghị định 19/2019/NĐ-CP, cụ thể điều kiện là thành viên như sau:"
                    - list [ref=f269e223]:
                      - listitem [ref=f269e224]: Người từ đủ mười tám tuổi trở lên
                      - listitem [ref=f269e225]: Không thuộc trường hợp mất, hạn chế năng lực hành vi dân sự hoặc có khó khăn trong nhận thức, làm chủ hành vi.
                      - listitem [ref=f269e226]: Người từ đủ mười lăm đến dưới mười tám tuổi nếu có tài sản riêng có thể tham gia chơi hụi. Nếu tài sản riêng đó là bất động sản, động sản phải đăng ký thì phải được người đại diện theo pháp luật đồng ý.
                      - listitem [ref=f269e227]: Những người tham gia chơi hụi có thể thỏa thuận để lập nên những điều kiện khác dành cho thành viên của tổ chức mình.
                    - paragraph [ref=f269e228]: "Đối với chủ hụi thì phải đáp ứng điều kiện quy định tại Điều 6 Nghị định 19/2019/NĐ-CP như sau:"
                    - list [ref=f269e229]:
                      - listitem [ref=f269e230]: Người từ đủ mười tám tuổi trở lên
                      - listitem [ref=f269e231]: Không thuộc trường hợp mất, hạn chế năng lực hành vi dân sự hoặc có khó khăn trong nhận thức, làm chủ hành vi.
                      - listitem [ref=f269e232]: Trường hợp các thành viên tự tổ chức dây họ thì chủ họ là người được hơn một nửa tổng số thành viên bầu, trừ trường hợp các thành viên có thỏa thuận khác.
                    - paragraph [ref=f269e233]: Theo đó đối với chủ hụi thì pháp luật không cho phép người chưa thành niên trở thành chủ hụi mặc dù họ có tài sản riêng.
                    - paragraph [ref=f269e234]:
                      - img "Đối tượng tham gia chơi hụi có thể là ai?" [ref=f269e235]
                    - paragraph [ref=f269e236]: Đối tượng tham gia chơi hụi
                    - heading "Chơi hụi bị giật có kiện được không?" [level=2] [ref=f269e237]
                    - paragraph [ref=f269e238]: Theo quy định tại Điều 25 Nghị định 19/2019/NĐ-CP có nêu đối với trường hợp có tranh chấp về hụi hoặc phát sinh từ hụi thì tranh chấp đó được giải quyết bằng thương lượng, hoà giải hoặc yêu cầu Tòa án giải quyết.
                    - paragraph [ref=f269e239]: Do đó, việc chơi hụi bị giật hoàn toàn có thể khởi kiện tại Tòa án nhân dân có thẩm quyền.
                    - paragraph [ref=f269e240]: "Cơ sở pháp lý: Điều 25 Nghị định 19/2019/NĐ-CP."
