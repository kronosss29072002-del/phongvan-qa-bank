                        - strong [ref=f269e245]: tội lạm dụng tín nhiệm chiếm đoạt tài sản
                      - text: "khi đáp ứng 02 điều kiện:"
                    - paragraph [ref=f269e246]: "Thứ nhất, thực hiện một trong các hành vi sau:"
                    - list [ref=f269e247]:
                      - listitem [ref=f269e248]: Vay, mượn, thuê tài sản của người khác hoặc nhận được tài sản của người khác bằng hình thức hợp đồng rồi dùng thủ đoạn gian dối hoặc bỏ trốn để chiếm đoạt tài sản đó hoặc đến thời hạn trả lại tài sản mặc dù có điều kiện, khả năng nhưng cố tình không trả;
                      - listitem [ref=f269e249]: Vay, mượn, thuê tài sản của người khác hoặc nhận được tài sản của người khác bằng hình thức hợp đồng và đã sử dụng tài sản đó vào mục đích bất hợp pháp dẫn đến không có khả năng trả lại tài sản.
                    - paragraph [ref=f269e250]: "Thứ hai, giá trị tài sản chiếm đoạt thuộc các trường hợp:"
                    - list [ref=f269e251]:
                      - listitem [ref=f269e252]: Từ 4.000.000 đồng trở lên;
                      - listitem [ref=f269e253]: Dưới 4.000.000 đồng nhưng có nhân thân xấu (từng phạm tội về tài sản, chưa được xóa án tích);
                      - listitem [ref=f269e254]: Tài sản là phương tiện kiếm sống chính của người bị hại và gia đình họ.
                    - paragraph [ref=f269e255]: (Điều 175 Bộ luật Hình sự 2015, sửa đổi bổ sung 2017)
                    - heading "Xử lý trách nhiệm hình sự" [level=3] [ref=f269e256]
                    - list [ref=f269e257]:
                      - listitem [ref=f269e258]: Tranh chấp về hụi thông thường được giải quyết theo pháp luật về dân sự, tuy nhiên, trường hợp chủ hụi có hành vi, thủ đoạn gian dối, bỏ trốn để chiếm đoạt tài sản thì có thể cấu thành tội phạm và bị truy cứu trách nhiệm hình sự.
                      - listitem [ref=f269e259]:
                        - text: Như vậy, hành vi giật tiền của chủ hụi hoàn toàn có thể phạm tội Lạm dụng tín nhiệm chiếm đoạt tài sản. Trong trường hợp thỏa mãn các điều kiện cấu thành tội này, người chơi hụi có quyền làm
                        - link [ref=f269e260] [cursor=pointer]:
                          - /url: https://luat24h.com.vn/mau-don-to-cao-lam-dung-tin-nhiem-chiem-doat-tai-san
                          - strong [ref=f269e261]: Đơn tố cáo lạm dụng tín nhiệm chiếm đoạt tài sản
                        - text: đến cơ quan công an để giải quyết.
                      - listitem [ref=f269e262]: Khi đủ yếu tố cấu thành tội phạm, chủ hụi có thể bị phạt cải tạo không giam giữ đến 03 năm hoặc “phạt tù” từ 06 tháng đến 03 năm, thậm chí bị phạt tù nhiều hơn nếu có tình tiết tăng nặng hoặc giá trị tài sản quá lớn.
                    - heading "Thủ tục khởi kiện đòi hụi" [level=2] [ref=f269e263]
                    - paragraph [ref=f269e264]:
                      - strong [ref=f269e265]: "Bước 1:"
                      - text: Nộp hồ sơ khởi kiện đến Tòa án.
                    - paragraph [ref=f269e266]:
                      - strong [ref=f269e267]: "Bước 2:"
                      - text: "Tòa án sẽ cấp ngay cho người khởi kiện giấy xác nhận đã nhận đơn. Trong vòng 03 ngày làm việc sau đó; Chánh án sẽ phân công Thẩm phán xem xét đơn khởi kiện và ra một trong các quyết định:"
                    - list [ref=f269e268]:
                      - listitem [ref=f269e269]:
                        - text: Yêu cầu sửa đổi, bổ sung
                        - strong [ref=f269e270]: đơn khởi kiện dân sự
                        - text: ;
                      - listitem [ref=f269e271]: Chuyển đơn khởi kiện cho Tòa án có thẩm quyền và thông báo cho người khởi kiện;
                      - listitem [ref=f269e272]: Trả lại đơn khởi kiện nếu vụ việc không thuộc thẩm quyền giải quyết của Tòa án.
                      - listitem [ref=f269e273]: Thụ lý vụ án. Thẩm phán phải thông báo ngay cho người khởi kiện để nộp tiền tạm ứng án phí.
                    - paragraph [ref=f269e274]:
                      - strong [ref=f269e275]: "Bước 3:"
                      - text: Người khởi kiện phải nộp tiền tạm ứng án phí và nộp cho Tòa án biên lai trong vòng 07 ngày.
                    - paragraph [ref=f269e276]:
                      - strong [ref=f269e277]: "Bước 4:"
                      - text: Vụ án được thụ lý và giải quyết vụ án theo đúng trình tự pháp luật.
                    - paragraph [ref=f269e278]: "Cơ sở pháp lý: Điều 190, 191, 195 Bộ luật Tố tụng Dân sự 2015."
                    - paragraph [ref=f269e279]:
                      - strong [ref=f269e281]: ">> Xem thêm:"
                      - link [ref=f269e282] [cursor=pointer]:
                        - /url: https://luat24h.com.vn/thu-tuc-khoi-kien-doi-tien-choi-hui
                        - strong [ref=f269e283]: Thủ tục khởi kiện đòi tiền chơi hụi bị chủ hụi giật
                    - paragraph [ref=f269e284]:
                      - img "Thủ tục khởi kiện đòi hụi" [ref=f269e285]
                    - paragraph [ref=f269e286]: Thủ tục khởi kiện đòi hụi
                    - heading "Giật hụi có thể chịu trách nhiệm hình sự không?" [level=2] [ref=f269e287]
                    - paragraph [ref=f269e288]: Điều 25 Nghị định 19/2019/NĐ-CP Về họ, hụi, biêu, phường (Chính Phủ ban hành ngày 19 tháng 02 năm 2019) có đưa ra quy định đối với chủ hụi, thành viên, cá nhân, tổ chức liên quan có quyền đề nghị cơ quan có thẩm quyền xử lý vi phạm hành chính hoặc truy cứu trách nhiệm hình sự đối với người có hành vi cho vay lãi nặng, lừa đảo chiếm đoạt tài sản, lạm dụng tín nhiệm chiếm đoạt tài sản, huy động vốn trái pháp luật hoặc các hành vi vi phạm pháp luật khác khi tham gia quan hệ về hụi.
                    - paragraph [ref=f269e289]: Do đó, việc chơi hụi bị giật cũng có khả năng chịu trách nhiệm hình sự về các tội lừa đảo chiếm đoạt tài sản, lạm dụng tín nhiệm chiếm đoạt tài sản, huy động vốn trái pháp luật hoặc các hành vi vi phạm pháp luật khác.
                    - paragraph [ref=f269e290]: "Cơ sở pháp lý: Điều 25 Nghị định 19/2019/NĐ-CP của Chính Phủ, ngày 19 tháng 02 năm 2019 về họ, hụi, biêu, phường."
                    - heading "Luật sư tư vấn hướng giải quyết khi chơi hụi bị giật" [level=2] [ref=f269e291]
                    - paragraph [ref=f269e292]: "Luật sư giỏi dân sự sẽ tư vấn thủ tục khởi kiện khi bị giật hụi để bảo vệ quyền lợi khách hàng:"
                    - list [ref=f269e293]:
                      - listitem [ref=f269e294]: Giải đáp thắc mắc liên quan đến vấn đề chơi hụi bị giật;
                      - listitem [ref=f269e295]: Hướng dẫn khách hàng hướng xử lý khi bị giật hụi;
                      - listitem [ref=f269e296]: Thương lượng, đàm phán với bên giật hụi trong trường hợp có yêu cầu;
                      - listitem [ref=f269e297]: Soạn thảo đơn từ khởi kiện và nộp cho cơ quan có thẩm quyền;
                      - listitem [ref=f269e298]: Luật sư đại diện khách hàng tham gia tố tụng tại Tòa án để bảo vệ khách hàng.
