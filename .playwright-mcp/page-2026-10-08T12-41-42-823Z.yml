              - listitem [ref=f28e610]:
                - link "Ruby" [ref=f28e611] [cursor=pointer]:
                  - /url: https://github.com/prometheus/client_ruby#histogram
              - listitem [ref=f28e617]:
                - link ".Net" [ref=f28e618] [cursor=pointer]:
                  - /url: https://github.com/prometheus-net/prometheus-net#histogram
              - listitem [ref=f28e624]:
                - link "Rust" [ref=f28e625] [cursor=pointer]:
                  - /url: https://docs.rs/prometheus-client/latest/prometheus_client/metrics/histogram/index.html
            - heading "Summary" [level=2] [ref=f28e631]:
              - text: Summary
              - link [ref=f28e632] [cursor=pointer]:
                - /url: "#summary"
            - paragraph [ref=f28e637]:
              - text: Similar to a
              - emphasis [ref=f28e638]: histogram
              - text: ", a"
              - emphasis [ref=f28e639]: summary
              - text: samples observations (usually things like request durations and response sizes). While it also provides a total count of observations and a sum of all observed values, it calculates configurable quantiles over a sliding time window.
            - paragraph [ref=f28e640]:
              - text: A summary with a base metric name of
              - code [ref=f28e641]: <basename>
              - text: "exposes multiple time series during a scrape:"
            - list [ref=f28e642]:
              - listitem [ref=f28e643]:
                - text: streaming
                - strong [ref=f28e644]: φ-quantiles
                - text: (0 ≤ φ ≤ 1) of observed events, exposed as
                - code [ref=f28e645]: "<basename>{quantile=\"<φ>\"}"
              - listitem [ref=f28e646]:
                - text: the
                - strong [ref=f28e647]: total sum
                - text: of all observed values, exposed as
