              - listitem [ref=f28e649]:
                - text: the
                - strong [ref=f28e650]: count
                - text: of events that have been observed, exposed as
                - code [ref=f28e651]: <basename>_count
            - paragraph [ref=f28e652]:
              - text: See
              - link "histograms and summaries" [ref=f28e653] [cursor=pointer]:
                - /url: /docs/practices/histograms/
              - text: for detailed explanations of φ-quantiles, summary usage, and differences to
              - link "histograms" [ref=f28e654] [cursor=pointer]:
