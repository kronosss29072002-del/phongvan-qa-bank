      - generic [ref=f28e397]:
        - generic [ref=f28e398]:
          - heading "Metric types" [level=1] [ref=f28e399]
          - generic [ref=f28e400]:
            - paragraph [ref=f28e401]:
              - text: The Prometheus instrumentation libraries offer four core metric types. With the exception of native histograms, these are currently only differentiated in the API of instrumentation libraries and in the exposition protocols. The Prometheus server does not yet make use of the type information and flattens all types except native histograms into untyped time series of floating point values. Native histograms, however, are ingested as time series of special composite histogram samples. In the future, Prometheus might handle other metric types as
              - link "composite types" [ref=f28e402] [cursor=pointer]:
                - /url: /blog/2026/02/14/modernizing-prometheus-composite-samples/
              - text: ", too. There is also ongoing work to persist the type information of the simple float samples."
            - heading "Counter" [level=2] [ref=f28e403]:
              - text: Counter
              - link [ref=f28e404] [cursor=pointer]:
                - /url: "#counter"
            - paragraph [ref=f28e409]:
              - text: A
              - emphasis [ref=f28e410]: counter
              - text: is a cumulative metric that represents a single
              - link "monotonically increasing counter" [ref=f28e411] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Monotonic_function
              - text: whose value can only increase or be reset to zero on restart. For example, you can use a counter to represent the number of requests served, tasks completed, or errors.
            - paragraph [ref=f28e417]: Do not use a counter to expose a value that can decrease. For example, do not use a counter for the number of currently running processes; instead use a gauge.
            - paragraph [ref=f28e418]: "Instrumentation library usage documentation for counters:"
            - list [ref=f28e419]:
              - listitem [ref=f28e420]:
                - link "Go" [ref=f28e421] [cursor=pointer]:
                  - /url: http://godoc.org/github.com/prometheus/client_golang/prometheus#Counter
              - listitem [ref=f28e427]:
                - link "Java" [ref=f28e428] [cursor=pointer]:
                  - /url: https://prometheus.github.io/client_java/getting-started/metric-types/#counter
              - listitem [ref=f28e434]:
                - link "Python" [ref=f28e435] [cursor=pointer]:
                  - /url: https://prometheus.github.io/client_python/instrumenting/counter/
              - listitem [ref=f28e441]:
                - link "Ruby" [ref=f28e442] [cursor=pointer]:
                  - /url: https://github.com/prometheus/client_ruby#counter
              - listitem [ref=f28e448]:
                - link ".Net" [ref=f28e449] [cursor=pointer]:
                  - /url: https://github.com/prometheus-net/prometheus-net#counters
              - listitem [ref=f28e455]:
                - link "Rust" [ref=f28e456] [cursor=pointer]:
                  - /url: https://docs.rs/prometheus-client/latest/prometheus_client/metrics/counter/index.html
            - heading "Gauge" [level=2] [ref=f28e462]:
              - text: Gauge
              - link [ref=f28e463] [cursor=pointer]:
                - /url: "#gauge"
            - paragraph [ref=f28e468]:
              - text: A
              - emphasis [ref=f28e469]: gauge
              - text: is a metric that represents a single numerical value that can arbitrarily go up and down.
            - paragraph [ref=f28e470]: Gauges are typically used for measured values like temperatures or current memory usage, but also "counts" that can go up and down, like the number of concurrent requests.
            - paragraph [ref=f28e471]: "Instrumentation library usage documentation for gauges:"
            - list [ref=f28e472]:
              - listitem [ref=f28e473]:
                - link "Go" [ref=f28e474] [cursor=pointer]:
                  - /url: http://godoc.org/github.com/prometheus/client_golang/prometheus#Gauge
              - listitem [ref=f28e480]:
                - link "Java" [ref=f28e481] [cursor=pointer]:
                  - /url: https://prometheus.github.io/client_java/getting-started/metric-types/#gauge
              - listitem [ref=f28e487]:
                - link "Python" [ref=f28e488] [cursor=pointer]:
                  - /url: https://prometheus.github.io/client_python/instrumenting/gauge/
              - listitem [ref=f28e494]:
                - link "Ruby" [ref=f28e495] [cursor=pointer]:
                  - /url: https://github.com/prometheus/client_ruby#gauge
              - listitem [ref=f28e501]:
                - link ".Net" [ref=f28e502] [cursor=pointer]:
                  - /url: https://github.com/prometheus-net/prometheus-net#gauges
              - listitem [ref=f28e508]:
                - link "Rust" [ref=f28e509] [cursor=pointer]:
                  - /url: https://docs.rs/prometheus-client/latest/prometheus_client/metrics/gauge/index.html
            - heading "Histogram" [level=2] [ref=f28e515]:
              - text: Histogram
              - link [ref=f28e516] [cursor=pointer]:
                - /url: "#histogram"
            - paragraph [ref=f28e521]:
              - text: A
              - emphasis [ref=f28e522]: histogram
              - text: records observations (usually things like request durations or response sizes) by counting them in configurable buckets. It also provides a sum of all observed values. As such, a histogram is essentially a bucketed counter. However, a histogram can also represent the current state of a distribution, in which case it is called a
              - emphasis [ref=f28e523]: gauge histogram
              - text: . In contrast to the usual counter-like histograms, gauge histograms are rarely directly exposed by instrumented programs and are thus not (yet) usable in instrumentation libraries, but they are represented in newer versions of the protobuf exposition format and in
              - link "OpenMetrics" [ref=f28e524] [cursor=pointer]:
                - /url: https://openmetrics.io/
              - text: . They are also created regularly by PromQL expressions. For example, the outcome of applying the
              - code [ref=f28e530]: rate
              - text: function to a counter histogram is a gauge histogram, in the same way as the outcome of applying the
              - code [ref=f28e531]: rate
              - text: function to a counter is a gauge.
            - paragraph [ref=f28e532]:
              - text: "Histograms exists in two fundamentally different versions: The more recent"
              - emphasis [ref=f28e533]: native histograms
              - text: and the older
              - emphasis [ref=f28e534]: classic histograms
              - text: .
            - paragraph [ref=f28e535]: A native histogram is exposed and ingested as composite samples, where each sample represents the count and sum of observations together with a dynamic set of buckets.
            - paragraph [ref=f28e536]:
              - text: A classic histogram, however, consists of multiple time series of simple float samples. A classic histogram with a base metric name of
              - code [ref=f28e537]: <basename>
              - text: "results in the following time series:"
            - list [ref=f28e538]:
              - listitem [ref=f28e539]:
                - text: cumulative counters for the observation buckets, exposed as
                - code [ref=f28e540]: "<basename>_bucket{le=\"<upper inclusive bound>\"}"
              - listitem [ref=f28e541]:
                - text: the
                - strong [ref=f28e542]: total sum
                - text: of all observed values, exposed as
                - code [ref=f28e543]: <basename>_sum
              - listitem [ref=f28e544]:
                - text: the
                - strong [ref=f28e545]: count
                - text: of events that have been observed, exposed as
                - code [ref=f28e546]: <basename>_count
                - text: (identical to
                - code [ref=f28e547]: "<basename>_bucket{le=\"+Inf\"}"
                - text: above)
            - paragraph [ref=f28e548]:
              - text: Native histograms are generally much more efficient than classic histograms, allow much higher resolution, do not require explicit configuration of bucket boundaries during instrumentation, and provide atomicity when transferred over the network (e.g. via the Prometheus remote write procol, where classic histograms suffer from possible partial transfer because their constituent time series are transferred independently). Their bucketing schema ensures that they are always aggregatable with each other, even if the resolution might have changed, while classic histograms with different bucket boundaries are not generally aggregatable. If the instrumentation library you are using supports native histograms (currently this is the case for Go and Java), you should probably
              - link "prefer native histograms over classic histograms" [ref=f28e549] [cursor=pointer]:
                - /url: /docs/practices/histograms/
              - text: .
            - paragraph [ref=f28e550]: "If you are stuck with classic histograms for whatever reason, there is a way to get at least some of the benefits of native histograms: You can configure Prometheus to ingest classic histograms into a special form of native histograms, called Native Histograms with Custom Bucket boundaries (NHCB). NHCBs are stored as the same composite samples as usual native histograms, providing increased efficiency and atomic network transfers, similar to regular native histgorms. However, the buckets of NHCBs still have the same layout as in their classic counterparts, statically configured during instrumentation, with the same limited resolution and range and the same problems of aggregatability upon changing the bucket boundaries."
            - paragraph [ref=f28e551]:
              - text: Use the
              - link [ref=f28e552] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/functions/#histogram_quantile
                - code [ref=f28e553]: histogram_quantile()
                - text: function
              - text: to calculate quantiles from histograms or even aggregations of histograms. It works for both classic and native histograms, using a slightly different syntax. Histograms are also suitable to calculate an
              - link "Apdex score" [ref=f28e554] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Apdex
              - text: .
            - paragraph [ref=f28e560]:
              - text: You can operate directly on the buckets of a classic histogram, as they are represented as individual series (called
              - code [ref=f28e561]: "<basename>_bucket{le=\"<upper inclusive bound>\"}"
              - text: as described above). Remember, however, that these buckets are
              - link "cumulative" [ref=f28e562] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Histogram#Cumulative_histogram
              - text: ", i.e. every bucket counts all observations less than or equal to the upper boundary provided as a label. With native histograms, you can look at observations within given boundaries with the"
              - link [ref=f28e568] [cursor=pointer]:
                - /url: /docs/prometheus/latest/querying/functions/#histogram_fraction
                - code [ref=f28e569]: histogram_fraction()
                - text: function
              - text: (to calculate fractions of observations) and the
              - link "trim operators" [ref=f28e570] [cursor=pointer]:
                - /url: ""
              - text: (to filter for the desired band of observations).
            - paragraph [ref=f28e571]:
              - text: See
              - link "histograms and summaries" [ref=f28e572] [cursor=pointer]:
                - /url: /docs/practices/histograms/
              - text: for details of histogram usage and differences to
              - link "summaries" [ref=f28e573] [cursor=pointer]:
                - /url: "#summary"
              - text: .
            - blockquote [ref=f28e574]:
              - strong [ref=f28e579]: NOTE
              - text: ": Beginning with Prometheus v3.0, the values of the"
              - code [ref=f28e580]: le
              - text: label of classic histograms are normalized during ingestion to follow the format of
              - link "OpenMetrics Canonical Numbers" [ref=f28e581] [cursor=pointer]:
                - /url: https://github.com/prometheus/OpenMetrics/blob/main/specification/OpenMetrics.md#considerations-canonical-numbers
              - text: .
            - paragraph [ref=f28e587]: "Instrumentation library usage documentation for histograms:"
            - list [ref=f28e588]:
              - listitem [ref=f28e589]:
                - link "Go" [ref=f28e590] [cursor=pointer]:
                  - /url: http://godoc.org/github.com/prometheus/client_golang/prometheus#Histogram
              - listitem [ref=f28e596]:
