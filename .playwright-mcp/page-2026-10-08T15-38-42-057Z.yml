    - region [ref=f47e33]:
      - heading "Tóm tắt 20 dự án" [level=2] [ref=f47e34]
      - paragraph [ref=f47e35]: Bấm tên dự án để nhảy tới thẻ chi tiết. Bộ lọc phía trên tác động cả bảng này lẫn danh sách chi tiết.
