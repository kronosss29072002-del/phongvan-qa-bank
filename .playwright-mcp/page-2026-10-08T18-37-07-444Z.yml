                      - paragraph [ref=f295e839]: "Controlling for: parent age, race/ethnicity, language, country of birth, socioeconomic status, education, health literacy; child age, child chronic disease; site; in addition to counseling strategy"
                  - paragraph [ref=f295e840]: "Exploratory subgroup analyses by literacy level revealed that receipt of advanced counseling in combination with instrument provision was statistically significantly associated with fewer errors for those with adequate (AOR 0.2; 95% CI 0.1–0.6), but not low literacy (AOR 0.3; 95% CI 0.1–1.4). Exploratory subgroup analyses by language revealed that receipt of advanced counseling in combination with instrument provision was statistically significantly associated with fewer errors for English speakers (AOR 0.2; 95% CI 0.07–0.9), but not for Spanish speakers (AOR 0.4; 95% CI: 0.1–1.2). No statistically significant interaction between health literacy and language was found."
                  - paragraph [ref=f295e841]: Inclusion of language concordance in the model did not substantively alter study findings. Exploratory subgroup analyses by concordance revealed that there was a similar magnitude of association between counseling strategies and dosing errors in the language concordant group compared to the overall group; analyses for the discordant group were limited due to small sample size.
              - generic [ref=f295e842]:
                - heading "DISCUSSION" [level=2] [ref=f295e843]
                - paragraph [ref=f295e844]: To our knowledge, this is the first study to examine existing pediatric provider medication counseling practices related to the use of advanced communication strategies with and without dosing instrument provision, and their association with parent liquid medication dosing errors. While a prior intervention-based study we performed revealed that use of advanced counseling strategies, which incorporated provision of a dosing instrument, was associated with reduced dosing errors, the current analyses assess real-world practices. We found that >40% of parents misdosed the liquid medication prescribed to their children. Only one in three parents in our study reported receipt of advanced counseling strategies from their ED provider. Use of advanced counseling strategies in concert with provision of a dosing instrument may be especially effective in reducing errors, compared to advanced counseling or instrument provision alone.
                - paragraph [ref=f295e845]:
                  - text: The prevalence of dosing errors in our study indicates that a significant level of parent confusion regarding medication instructions exists, consistent with prior studies.
                  - superscript [ref=f295e846]:
                    - link "1" [ref=f295e847] [cursor=pointer]:
                      - /url: "#R1"
                    - text: –
                    - link "3" [ref=f295e848] [cursor=pointer]:
                      - /url: "#R3"
                    - text: ","
                    - link "10" [ref=f295e849] [cursor=pointer]:
                      - /url: "#R10"
                  - text: This high rate of error is concerning; >50% of US children are exposed to one or more medications in a given week.
                  - superscript [ref=f295e850]:
                    - link "33" [ref=f295e851] [cursor=pointer]:
                      - /url: "#R33"
                  - text: Medication administration errors place children at risk for adverse events, may contribute to therapeutic failure, and can result in avoidable health care costs.
                  - superscript [ref=f295e852]:
                    - link "34" [ref=f295e853] [cursor=pointer]:
                      - /url: "#R34"
                    - text: ","
                    - link "35" [ref=f295e854] [cursor=pointer]:
                      - /url: "#R35"
                - paragraph [ref=f295e855]:
                  - text: Despite evidence to support the use of advanced counseling strategies such as dose demonstration, teachback/showback, and the use of pictograms,
                  - superscript [ref=f295e856]:
                    - link "16" [ref=f295e857] [cursor=pointer]:
                      - /url: "#R16"
                    - text: –
                    - link "18" [ref=f295e858] [cursor=pointer]:
                      - /url: "#R18"
                    - text: ","
                    - link "36" [ref=f295e859] [cursor=pointer]:
                      - /url: "#R36"
                    - text: –
                    - link "38" [ref=f295e860] [cursor=pointer]:
                      - /url: "#R38"
                  - text: and support for the use of more effective counseling strategies by the American Medical Association,
                  - superscript [ref=f295e861]:
                    - link "14" [ref=f295e862] [cursor=pointer]:
                      - /url: "#R14"
                  - text: we found that only 1 in 3 parents reported use of these strategies by their provider in the pediatric ED. Prior studies have similarly found low rates; an American Academy of Pediatrics survey found that use of enhanced communication techniques like teachback was uncommon, with only 1 in 4 describing use of teachback most or all of the time.
                  - superscript [ref=f295e863]:
                    - link "20" [ref=f295e864] [cursor=pointer]:
                      - /url: "#R20"
                  - text: Use of advanced counseling strategies is considered to be more effective than standard recommended counseling practices, such as plain, or simple, language, repetition, and limitation of concepts to 2–3 key points.
                  - superscript [ref=f295e865]:
                    - link "20" [ref=f295e866] [cursor=pointer]:
                      - /url: "#R20"
                  - text: In the context of medication counseling, advanced counseling can be provided by physicians, nurses, and other providers at the time of discharge. Instructions can be further reinforced at the time a medication is dispensed in the pharmacy.
                - paragraph [ref=f295e867]:
                  - text: Provision of a standardized instrument, recognized as another effective strategy for reducing parent dosing errors, varied in our study. Only 1 in 5 parents reported receiving an instrument from the ED, while a little over half reported receiving one from the pharmacy. Those who did not receive an instrument were 6 times more likely to use a nonstandard spoon. Interestingly, ED instrument provision was statistically significantly associated with fewer errors, but pharmacy provision was not; further study to explore this issue is indicated. One possible issue that may contribute to this difference is that oral syringes were most commonly distributed in the ED, while instruments distributed from the pharmacy were more heterogeneous. Several studies have recently found that parent dosing accuracy varies by instrument type, with dosing cups, in particular, associated with overdoses.
                  - superscript [ref=f295e868]:
                    - link "6" [ref=f295e869] [cursor=pointer]:
                      - /url: "#R6"
                    - text: ","
                    - link "22" [ref=f295e870] [cursor=pointer]:
                      - /url: "#R22"
                  - text: Oral syringes are generally considered to be the most accurate.
                  - superscript [ref=f295e871]:
                    - link "6" [ref=f295e872] [cursor=pointer]:
                      - /url: "#R6"
                    - text: ","
                    - link "9" [ref=f295e873] [cursor=pointer]:
                      - /url: "#R9"
                  - text: Unfortunately, sample size limited our ability to examine errors by instrument type.
                - paragraph [ref=f295e874]: It is not clear why some parents reported receipt of counseling or dosing instruments, while others did not. There was no variability by diagnosis, or by provider type. Further study is needed to further explore other potential factors related to rates of counseling and dosing instrument provision, such differences by literacy level and English proficiency.
                - paragraph [ref=f295e875]: Interestingly, in adjusted analyses, use of advanced counseling strategies in the ED alone was not associated with decreased error rates, while ED advanced counseling with provision of a standardized instrument was associated with a 3-fold decrease in dosing errors. Unfortunately, as the majority of parents who received an instrument also received advanced counseling, it was difficult for us to examine the impact of instrument alone with no associated provider advanced counseling.
                - paragraph [ref=f295e876]: Notably, rates of error was significant across counseling approaches, suggesting that additional strategies are likely to be needed to ensure parent understanding of medication instructions, or that the quality of the advanced counseling strategies used by providers could be further improved through a standardized training approach.
                - paragraph [ref=f295e877]: While we found in exploratory analyses that the association between counseling strategies and dosing errors was statistically significant among those with adequate literacy and English speakers, but not among those with low literacy and those who spoke Spanish, our analyses were limited by sample size. Additional studies are needed to examine whether other approaches are needed to reduce the likelihood of dosing error in these at-risk groups.
                - paragraph [ref=f295e878]:
                  - text: Our study has several limitations. This was a cross-sectional study in which we examined the association between dosing errors and health communication strategies; no conclusions regarding causation can be drawn. We relied on parent self-report of receipt of advanced counseling and instruments, which may not have reflected what actually occurred during provider-parent encounters. We conducted assessments by phone, which prevented us from clarifying our questions about dosing instruments with visual aids, although we did give examples of instruments verbally. Future study to validate questions on counseling strategies and instrument provision would be beneficial, including examining audio- or videotaped provider-parent encounters. While we did collect information regarding the language the ED visit was conducted in, we did not collect detailed information regarding the language used for counseling about medication instructions specifically, or the quality of the verbal or written Spanish language used. Dosing accuracy was assessed as part of an in-person hospital-based encounter within 8 weeks of the projected end date of their prescribed medication, and may not have reflected how the parent dosed at home during the prescribed medication course; our dosing error findings may be subject to recall bias. In addition, we did not have the power to examine the relationship between individual types of advanced counseling or instruments and dosing errors, or the role of instrument provision without advanced counseling. Advanced counseling strategies within the pharmacy setting was also not assessed, which deserves further study, however it is unlikely that advanced counseling strategies are frequently used in the pharmacy.
                  - superscript [ref=f295e879]:
                    - link "21" [ref=f295e880] [cursor=pointer]:
                      - /url: "#R21"
                  - text: Further study of multidisciplinary approaches to medication counseling is needed, including examining the benefits of having medication instructions reinforced by different members of the care team (e.g. nurse, physician, pharmacist), as well as the potential for increased confusion when inconsistent instructions are provided. Finally, the majority of our participants were Hispanic mothers from low SES backgrounds, recruited from an urban setting, which may limit our ability to generalize our findings to other populations.
                - paragraph [ref=f295e881]: In summary, we found that use of advanced counseling strategies along with provision of a standardized dosing instrument is associated with decreased dosing errors. Additional research is needed to determine how to best incorporate advanced counseling strategies into routine practice, including experimental studies to identify which advanced counseling strategies are most effective, and how to best encourage adoption of these strategies by clinicians and pharmacists. Policy and regulatory approaches may be needed to maximize the adoption of best practices in provider counseling in order to promote the safe use of pediatric medications.
              - generic [ref=f295e883]:
                - heading "WHAT’S NEW." [level=2] [ref=f295e884]
                - paragraph [ref=f295e885]: Provider use of advanced counseling strategies (teachback, drawings/pictures, dose demonstration, showback) in combination with provision of a dosing instrument, may be more effective in reducing parent liquid medication dosing errors than advanced counseling or instrument provision alone.
