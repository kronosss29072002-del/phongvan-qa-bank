                - generic [ref=f295e780]:
                  - heading "Provision of a Standardized Dosing Instrument and Dosing Errors" [level=3] [ref=f295e781]
                  - paragraph [ref=f295e782]:
                    - text: Nearly three quarters (74.6%) reported receipt of a dosing instrument (19.2% ED; 64.8% pharmacy) (
                    - link "Table 2" [ref=f295e783] [cursor=pointer]:
                      - /url: "#T2"
                    - text: ). Those who received an instrument were less likely to use a nonstandard spoon (7.5% vs. 43.8%; p<0.001). ED instruments were primarily oral syringes (85.5%). Pharmacy instruments included oral syringes (34.4%), droppers (27.4%), and dosing cups (24.7%). While receipt of a dosing instrument in the pharmacy was not statistically significantly related to dosing error (p=0.5), parents who reported receiving an instrument in the ED made fewer dosing errors (21.8% vs. 45.7%; p=0.001).
                - generic [ref=f295e784]:
                  - 'heading "Advanced Counseling Strategies with and without Provision of a Standardized Dosing Instrument (ED only): Associations with Dosing Error" [level=3] [ref=f295e785]'
                  - paragraph [ref=f295e786]:
                    - text: Fifteen percent of parents reported receiving advanced counseling along with an instrument (4.2% instrument only, 18.1% advanced counseling only; 62.7% neither) (
                    - link "Table 2" [ref=f295e787] [cursor=pointer]:
                      - /url: "#T2"
                    - text: ). Those who received both advanced counseling and an instrument made fewer errors than those who received neither (20.9% vs. 47.8%; p=0.002); there was no statistically significant difference in error rate between those who received advanced counseling only and those who received neither (p=0.3), or instrument only and those who received neither (p=0.15) (
                    - link "Table 3" [ref=f295e788] [cursor=pointer]:
                      - /url: "#T3"
                    - text: ).
                - generic [ref=f295e789]:
                  - 'heading "Adjusted Analyses Predicting Parent Dosing Errors: Role of Advanced Counseling Strategies with and without Provision of a Standardized Dosing Instrument" [level=3] [ref=f295e790]'
                  - paragraph [ref=f295e791]:
                    - text: In adjusted analyses, report of advanced counseling strategies in combination with an instrument was associated with a decreased odds of error compared to receiving neither (AOR 0.3; 95% CI 0.1–0.7); advanced counseling only and instrument only were not associated with decreased odds of error (
                    - link "Table 4" [ref=f295e792] [cursor=pointer]:
                      - /url: "#T4"
                    - text: ).
