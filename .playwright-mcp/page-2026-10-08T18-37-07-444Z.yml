          - region "Article content" [ref=f295e94]:
            - generic [ref=f295e95]:
              - generic [ref=f295e96]:
                - heading "Abstract" [level=2] [ref=f295e97]
                - generic [ref=f295e98]:
                  - heading "Objective" [level=3] [ref=f295e99]
                  - paragraph [ref=f295e100]: To examine the degree to which recommended provider counseling strategies, including advanced communication techniques and dosing instrument provision, are associated with reductions in parent liquid medication dosing errors.
                - generic [ref=f295e101]:
                  - heading "Methods" [level=3] [ref=f295e102]
                  - paragraph [ref=f295e103]: "Cross-sectional analysis of baseline data on provider communication and dosing instrument provision from a study of a health literacy intervention to reduce medication errors. Parents whose children (<9 years) were seen in two urban public hospital pediatric emergency departments (EDs) and were prescribed daily dose liquid medications self-reported whether they received counseling about their child’s medication, including advanced strategies (teachback, drawings/pictures, demonstration, showback) and receipt of a dosing instrument. Primary dependent variable: observed dosing error (>20% deviation from prescribed). Multivariate logistic regression analyses performed, controlling for: parent age, language, country, ethnicity, socioeconomic status, education, health literacy (Short Test of Functional Health Literacy in Adults); child age, chronic disease status; site."
                - generic [ref=f295e104]:
                  - heading "Results" [level=3] [ref=f295e105]
                  - paragraph [ref=f295e106]: Of 287 parents, 41.1% made dosing errors. Advanced counseling and instrument provision in the ED were reported by 33.1% and 19.2%, respectively; 15.0% reported both. Advanced counseling and instrument provision in the ED were associated with decreased errors (30.5 vs. 46.4%, p=0.01; 21.8 vs. 45.7%, p=0.001). In adjusted analyses, ED advanced counseling in combination with instrument provision was associated with a decreased odds of error compared to receiving neither (AOR 0.3; 95% CI 0.1–0.7); advanced counseling alone and instrument alone were not significantly associated with odds of error.
                - generic [ref=f295e107]:
                  - heading "Conclusion" [level=3] [ref=f295e108]
                  - paragraph [ref=f295e109]: Provider use of advanced counseling strategies and dosing instrument provision may be especially effective in reducing errors when used together.
                - paragraph [ref=f295e111]:
                  - strong [ref=f295e112]: "Keywords:"
                  - text: medication error, adherence, health literacy, patient education, parents, ambulatory care, patient communication
              - generic [ref=f295e113]:
                - heading "INTRODUCTION" [level=2] [ref=f295e114]
                - paragraph [ref=f295e115]:
                  - text: Studies suggest that parents frequently misunderstand instructions regarding how to administer medication to their children correctly, with over 40% of caregivers making errors in dosing liquid medications;
                  - superscript [ref=f295e116]:
                    - link "1" [ref=f295e117] [cursor=pointer]:
                      - /url: "#R1"
                    - text: –
                    - link "4" [ref=f295e118] [cursor=pointer]:
                      - /url: "#R4"
                  - text: those with low health literacy, as well as those with limited English proficiency, are at particular risk for medication administration errors.
                  - superscript [ref=f295e119]:
                    - link "5" [ref=f295e120] [cursor=pointer]:
                      - /url: "#R5"
                    - text: ","
                    - link "6" [ref=f295e121] [cursor=pointer]:
                      - /url: "#R6"
                    - text: ","
                    - link "7" [ref=f295e122] [cursor=pointer]:
                      - /url: "#R7"
                  - text: Potential strategies to reduce errors include the use of a health literacy-informed approach to improving provider communication of medication instructions to parents through a)the use of advanced counseling strategies, and b)the provision of standardized dosing instruments.
                  - superscript [ref=f295e123]:
                    - link "3" [ref=f295e124] [cursor=pointer]:
                      - /url: "#R3"
                    - text: ","
                    - link "8" [ref=f295e125] [cursor=pointer]:
                      - /url: "#R8"
                - paragraph [ref=f295e126]:
                  - text: Parent administration of medications to young children can be complex. Oral liquid formulations are typically prescribed to young children, and many parents find that accurate measurement is challenging.
                  - superscript [ref=f295e127]:
                    - link "9" [ref=f295e128] [cursor=pointer]:
                      - /url: "#R9"
                    - text: ","
                    - link "10" [ref=f295e129] [cursor=pointer]:
                      - /url: "#R10"
                  - text: The ability to understand the importance and correct use of standardized dosing instruments (eg. oral syringe, dropper, dosing cup), as well as the ability to interpret measurement units (eg. milliliter, teaspoon, tablespoon), are among the key skills that help parents avoid making errors.
                  - superscript [ref=f295e130]:
                    - link "6" [ref=f295e131] [cursor=pointer]:
                      - /url: "#R6"
                    - text: ","
                    - link "11" [ref=f295e132] [cursor=pointer]:
                      - /url: "#R11"
                    - text: ","
                    - link "12" [ref=f295e133] [cursor=pointer]:
                      - /url: "#R12"
                - paragraph [ref=f295e134]:
                  - text: Provider use of health literacy-informed communication strategies is generally recommended as part of a universal precautions approach, and may be especially helpful for medication counseling.
                  - superscript [ref=f295e135]:
                    - link "13" [ref=f295e136] [cursor=pointer]:
                      - /url: "#R13"
                  - text: Advanced counseling strategies, including the use of verbal teachback, where patients are asked to describe in their own words what they learned, provider demonstration, patient “showback”, and provider use of pictures or drawings, have been recommended,
                  - superscript [ref=f295e137]:
                    - link "10" [ref=f295e138] [cursor=pointer]:
                      - /url: "#R10"
                    - text: ","
                    - link "13" [ref=f295e139] [cursor=pointer]:
                      - /url: "#R13"
                    - text: –
                    - link "19" [ref=f295e140] [cursor=pointer]:
                      - /url: "#R19"
                  - text: but are underutilized.
                  - superscript [ref=f295e141]:
                    - link "20" [ref=f295e142] [cursor=pointer]:
                      - /url: "#R20"
                    - text: ","
                    - link "21" [ref=f295e143] [cursor=pointer]:
                      - /url: "#R21"
                  - text: To date, there is limited study of the use of advanced counseling strategies for the reduction of pediatric medication dosing errors.
                - paragraph [ref=f295e144]:
                  - text: Provider provision of a standardized dosing instrument is also thought to be effective in reducing errors. Despite recommendations that standardized instruments be used, many parents continue to use kitchen spoons,
                  - superscript [ref=f295e145]:
                    - link "9" [ref=f295e146] [cursor=pointer]:
                      - /url: "#R9"
                    - text: ","
                    - link "10" [ref=f295e147] [cursor=pointer]:
                      - /url: "#R10"
                    - text: ","
                    - link "22" [ref=f295e148] [cursor=pointer]:
                      - /url: "#R22"
                  - text: and standardized instruments are not universally distributed in EDs or pharmacies.
                  - superscript [ref=f295e149]:
                    - link "3" [ref=f295e150] [cursor=pointer]:
                      - /url: "#R3"
                    - text: ","
                    - link "23" [ref=f295e151] [cursor=pointer]:
                      - /url: "#R23"
                  - text: Incorporating standardized instruments as part of the demonstration and teachback portions of advanced counseling, in concert with providing instruments for parents to take home, may be especially effective.
                  - superscript [ref=f295e152]:
                    - link "3" [ref=f295e153] [cursor=pointer]:
                      - /url: "#R3"
                    - text: ","
                    - link "10" [ref=f295e154] [cursor=pointer]:
                      - /url: "#R10"
                - paragraph [ref=f295e155]: Overall, few studies have examined health literacy-informed medication counseling strategies, and the value of provision of a dosing instrument as part of counseling. We have previously shown in the context of an intervention, that advanced counseling strategies which incorporated use of a standardized dosing instrument, is associated with a reduction in dosing errors. To date, there has been limited study of this issue in the setting of routine medication counseling, including the role of advanced counseling with and without provision of a dosing instrument. We therefore sought to assess the association between health provider counseling approach and dosing errors.
              - generic [ref=f295e156]:
                - heading "METHODS" [level=2] [ref=f295e157]
                - generic [ref=f295e158]:
                  - heading "Participants and Setting" [level=3] [ref=f295e159]
                  - paragraph [ref=f295e160]: This was a cross-sectional analysis of data collected from parents of children seen in the pediatric ED of two urban public hospitals in New York City (Bellevue Hospital Center, Woodhull Medical Center), between May 31, 2010 and September 10, 2011. The EDs of both hospitals serve predominantly low SES, immigrant families, including a large percentage of Latino families. Data from this study was collected as part of baseline assessments performed within a pre/post-implementation study of a low literacy intervention to reduce parent medication administration errors, which includes the institution of a program to train health providers in low literacy medication counseling strategies. At the time the baseline data was collected, neither ED site had a standard approach or policy with respect to the use of advanced counseling strategies or the provision of dosing instruments, even though dosing instruments were available at each site. In addition, as families were recruited by phone, few providers were aware that a study on baseline medication counseling practices was being conducted.
                  - paragraph [ref=f295e161]: "Research assistants systematically assessed families to determine eligibility. Chart reviews were performed to assess initial eligibility; families were then screened for additional criteria by telephone. Inclusion criteria was primary caregiver of a child <9 years who was prescribed a daily dose short course (≤14 day) liquid medication in the pediatric ED. Exclusion criteria at initial chart review were: caregiver not legal guardian of child, caregiver not English or Spanish-speaking, residency outside of NYC, hospital admission, child with psychiatric or child protection-related issue, no listed phone number. Exclusion criteria at telephone screening included verification of initial exclusion criteria and additional assessment of the following exclusion criteria: person reached by phone not the person counseled in the ED, no eligible medication prescribed."
                  - paragraph [ref=f295e162]:
                    - text: For the purposes of this paper, we refer to both parents and caregivers/legal guardians as parents. At Bellevue, consecutive eligible parents were contacted by phone starting 4 days after the end date of the prescribed medication, with a plan to reach parents within 2 weeks of the end date. While consecutive parents were initially assessed for eligibility at Woodhull, given the higher number of patients at this site, every 4
                    - superscript [ref=f295e163]: th
                    - text: parent was systematically contacted beginning in October 2010.
                  - paragraph [ref=f295e164]: Assessments were completed by phone; an in-person follow-up time was also arranged to occur within 8 weeks of the end date of the prescribed medication to allow for the in-person assessment of dosing as well as performance of the health literacy assessment.
                  - paragraph [ref=f295e165]: Verbal and written informed consent was obtained from participants. Study information was provided in English or Spanish, based on parent preference. Trained bilingual English/ Spanish research assistants performed Spanish-language assessments. A modest incentive was provided to parents for their participation ($20 gift card). This study was approved by NYU School of Medicine’s Institutional Review Board, and the Bellevue and Woodhull Facility Research Review Committees.
                - generic [ref=f295e166]:
                  - heading "Measures" [level=3] [ref=f295e167]
                  - paragraph [ref=f295e168]: Data included both interview and observational measures. The primary outcome variable was observed dosing error. The primary predictor variables were provider counseling strategies and provider dosing instrument provision.
                  - generic [ref=f295e169]:
                    - heading "Dosing error" [level=4] [ref=f295e170]
                    - paragraph [ref=f295e171]:
                      - text: Parent dosing error was assessed by direct observation. The primary criterion used was whether the amount measured was within 20% of the prescribed dose.
                      - superscript [ref=f295e172]:
                        - link "3" [ref=f295e173] [cursor=pointer]:
                          - /url: "#R3"
                        - text: ","
                        - link "24" [ref=f295e174] [cursor=pointer]:
                          - /url: "#R24"
                        - text: ","
                        - link "25" [ref=f295e175] [cursor=pointer]:
                          - /url: "#R25"
                      - text: The dose prescribed by the provider was obtained by chart review. Raters who determined whether or not an error had occurred were blinded to health literacy results.
                    - paragraph [ref=f295e176]:
                      - text: To assess dosing accuracy via direct observation, a structured interview was conducted using a previously established protocol, with each parent demonstrating the dose of medication using a standard medication bottle containing over-the-counter Tylenol.
                      - superscript [ref=f295e177]:
                        - link "3" [ref=f295e178] [cursor=pointer]:
                          - /url: "#R3"
                      - text: Interrater reliability, measured by having 2 raters assess accuracy using the 20% criterion for a subsample of 150 parents, was high (kappa>0.9). For the limited number of patients who received more than 1 daily dose medication (7 patients), only the first documented medication was included in analyses. For patients who received a medication prescription involving tapered dosing, the most frequently administered dose was used for analyses.
                  - generic [ref=f295e179]:
                    - heading "Provider Counseling Strategies" [level=4] [ref=f295e180]
                    - paragraph [ref=f295e181]: Any provider counseling was assessed by asking parents to report whether they had spoken to anyone about how to give the prescribed medication(s) in the ED and/or pharmacy.
                    - paragraph [ref=f295e182]:
                      - text: "Advanced counseling strategies were assessed for the ED only. Verbal teachback and provider use of pictures/drawings was assessed with the questions: “Did your doctor or nurse ask you to describe to him/her how you were going to follow the medication instructions?” and “Did your doctor or nurse use pictures or drawings to help you understand how to give your child’s medicine correctly?” These questions were adapted from the Agency for Healthcare Research and Quality’s (AHRQ) Consumer Assessment of Healthcare Providers and Systems surveys (CAHPS)."
                      - superscript [ref=f295e183]:
                        - link "26" [ref=f295e184] [cursor=pointer]:
                          - /url: "#R26"
                    - paragraph [ref=f295e185]: "Demonstration and showback were assessed by first asking parents if anyone had shown them how to give the correct dose of medicine (“Did anyone show you how to give the correct dose of medicine?”). If they responded affirmatively, they were asked who showed them (eg. doctor, nurse), and the following questions: “When the [PROVIDER TYPE] showed you how to dose, did he/she demonstrate the dose using a dosing instrument?” and “Did you use a dosing instrument to show the [PROVIDER TYPE] the dose you planned to give your child?” Prior to this question, parents had been asked about which dosing instrument they had used. Parents who did not understand the term “dosing instrument” were provided with a brief verbal explanation which included naming examples of dosing instruments (eg. dosing cup, oral syringe)."
                    - paragraph [ref=f295e186]: Advanced counseling strategies in the pharmacy was not assessed, as this was a cross-sectional analysis of baseline data on provider communication and dosing instrument provision from an ED-focused pre-/post-implementation study of a health literacy intervention to reduce medication errors.
                    - paragraph [ref=f295e187]: Parents were also asked about the language used in the ED encounter. Language concordance was determined based on whether or not the parent language of preference matched the language used in the ED encounter.
                  - generic [ref=f295e188]:
                    - heading "Provision of a Standardized Dosing Instrument" [level=4] [ref=f295e189]
                    - paragraph [ref=f295e190]: Parents were asked to report whether they received a dosing instrument from the pediatric ED and/or pharmacy, as well as the type(s) of instrument (eg. oral syringe, dosing cup, dosing spoon, measuring spoon) they received.
                  - generic [ref=f295e191]:
                    - heading "Advanced Counseling Strategies with and without Provision of a Standardized Dosing Instrument (ED only)" [level=4] [ref=f295e192]
                    - paragraph [ref=f295e193]: "Medication counseling which employs advanced communication strategies, such as demonstration and showback, often involve the use of a dosing instrument, which increases the likelihood that a dosing instrument will also be provided for a parent to take home. In order to examine the combined and separate effects of each strategy, parents were categorized into 4 groups based on receipt of the following in the ED: 1) advanced counseling only, 2) instrument only, 3) advanced counseling with instrument, and 4) neither."
                  - generic [ref=f295e194]:
                    - heading "Sociodemographic Data, Parent Health Literacy, and Child Health Status" [level=4] [ref=f295e195]
                    - paragraph [ref=f295e196]:
                      - text: Sociodemographic data, obtained using a structured questionnaire, included child’s age and gender, as well as parent age and gender, relationship to the child, preferred language, ethnicity, country of birth, socioeconomic status (SES), and level of education. Relationship to the child was categorized as mother or other. Language was characterized based on the language of the interview (English or Spanish). Ethnicity was categorized as Latino or non-Latino. Latinos represent the majority of families in our sample and no other ethnic group was large enough to allow us to define a separate category. Country of origin was categorized as US-born or not. SES was dichotomized as Hollingshead Index of 4 or 5 (lowest resource levels) versus all others.
                      - superscript [ref=f295e197]:
                        - link "27" [ref=f295e198] [cursor=pointer]:
                          - /url: "#R27"
                      - text: Level of education was categorized based on graduation from high school. Parent health literacy level was assessed as part of the in-person assessment (after dosing assessment) using the Short Test of Functional Health Literacy (S-TOFHLA).
                      - superscript [ref=f295e199]:
                        - link "28" [ref=f295e200] [cursor=pointer]:
                          - /url: "#R28"
                      - text: Parents who were categorized as having inadequate or marginal health literacy were combined into one low literacy category, and compared to those with adequate literacy.
                      - superscript [ref=f295e201]:
                        - link "29" [ref=f295e202] [cursor=pointer]:
                          - /url: "#R29"
                        - text: ","
                        - link "30" [ref=f295e203] [cursor=pointer]:
                          - /url: "#R30"
                        - text: ","
                        - link "31" [ref=f295e204] [cursor=pointer]:
                          - /url: "#R31"
                      - text: Child chronic disease status was assessed using the Children with Special Health Care Needs screener.
                      - superscript [ref=f295e205]:
                        - link "32" [ref=f295e206] [cursor=pointer]:
                          - /url: "#R32"
                - generic [ref=f295e207]:
                  - heading "Statistical Analyses" [level=3] [ref=f295e208]
                  - paragraph [ref=f295e209]:
                    - text: Data was analyzed using SPSS 20.0 (SPSS Inc., Chicago, IL). For all analyses, a 2 tailed pvalue <0.05 was considered to be statistically significant. We assessed unadjusted associations between dosing error and independent variables of interest (provider counseling, dosing instrument provision) using bivariate analyses (χ
                    - superscript [ref=f295e210]: "2"
                    - text: or Fisher’s Exact test). Those independent variables (i.e. advanced counseling in the ED, instrument provision in the ED) found to be significantly related to dosing errors in bivariate analyses were examined in adjusted analyses (multiple logistic regression analyses), with a priori inclusion of potential confounders, including parent age, race/ethnicity, language, country of birth, SES, education, health literacy, as well as child age and chronic disease status, and site. To examine health literacy and language as potential moderators of the relationship between provider counseling strategies and dosing errors, we performed exploratory subgroup analyses by health literacy and language. We also tested whether there was an interaction between health literacy and language. To explore the role of language concordance, additional analyses were performed which included this variable in the model; exploratory subgroup analyses by language concordance was also conducted.
              - generic [ref=f295e211]:
                - heading "RESULTS" [level=2] [ref=f295e212]
                - paragraph [ref=f295e213]:
                  - text: Enrollment took place from June 23, 2010 through September 26, 2011, during the patient recruitment periods at each of the 2 ED sites (
                  - link "Figure 1" [ref=f295e214] [cursor=pointer]:
                    - /url: "#F1"
                  - text: ). Of eligible parents reached by telephone, 400 (70.4%) were enrolled by phone, while 168 (29.6%) refused to participate. There were no statistically significant differences between parents who did and did not enroll with respect to child’s age and sex. There was no difference in the rate of refusal to participate by site. Of 400 enrolled parents (200 per site), 113 did not return for in-person follow-up (28.3%). Therefore, 287 parents comprised the sample included in these analyses. There was no difference in those who did and did not follow-up by parent characteristics or site.
                - figure [ref=f295e215]:
                  - heading "Figure 1." [level=3] [ref=f295e216]
                  - paragraph [ref=f295e217]:
                    - link [ref=f295e218] [cursor=pointer]:
                      - /url: https://www.ncbi.nlm.nih.gov/core/lw/2.0/html/tileshop_pmc/tileshop_pmc_inline.html?title=Click%20on%20image%20to%20zoom&p=PMC3&id=4034520_nihms554626f1.jpg
                      - img "Figure 1" [ref=f295e219]
                      - text: 🔍
                  - link "Open in a new tab" [ref=f295e221] [cursor=pointer]:
                    - /url: figure/F1/
                  - generic [ref=f295e222]:
                    - paragraph [ref=f295e223]: Study Enrollment
                    - paragraph [ref=f295e224]:
                      - superscript [ref=f295e225]: a
                      - text: While eligibility was initially assessed for all patients at both sites, given the higher number of patients at one site, a plan was subsequently made to contact every 4
                      - superscript [ref=f295e226]: th
                      - text: patient at that site
                - paragraph [ref=f295e227]:
                  - text: Study subjects were primarily mothers (90.2%), from low SES backgrounds (82.6%) (
                  - link "Table 1" [ref=f295e228] [cursor=pointer]:
                    - /url: "#T1"
                  - text: "). Of medications prescribed, the majority were antibiotics (80.5%) and corticosteroids (17.4%). The most common diagnoses were: otitis media (36.9%), skin infection (13.9%), reactive airway disease (13.9%)."
                - generic [ref=f295e229]:
                  - heading "TABLE 1." [level=3] [ref=f295e230]
                  - paragraph [ref=f295e232]:
                    - text: Characteristics of study population (n=287)
                    - link [ref=f295e233] [cursor=pointer]:
                      - /url: "#TFN2"
