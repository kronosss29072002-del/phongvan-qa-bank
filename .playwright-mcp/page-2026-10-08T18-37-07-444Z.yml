                - generic [ref=f295e549]:
                  - heading "Provider Counseling Strategies and Dosing Errors" [level=3] [ref=f295e550]
                  - paragraph [ref=f295e551]:
                    - text: Almost all parents (97.6%) reported receiving any counseling in the ED or pharmacy (
                    - link "Table 2" [ref=f295e552] [cursor=pointer]:
                      - /url: "#T2"
                    - text: ). One-third (33.1%) reported receipt of advanced counseling in the ED. The majority of ED encounters had language concordance (78.7%) (73.5% visits conducted in English, 24.4% Spanish, 2.1% combination). Receipt of any counseling provider counseling was not statistically significantly related to dosing error (
                    - link "Table 3" [ref=f295e553] [cursor=pointer]:
                      - /url: "#T3"
                    - text: ). Parents who reported that they received at least 1 advanced counseling strategy in the ED were less likely to make a dosing error compared to those who did not report receiving advanced counseling (30.5% vs. 46.4%; p=0.01).
