# ============================================================
# nginx vhost 2 — subdomain IELTS (ielts.caphesuachua.blog)
# ------------------------------------------------------------
# CÀI ĐẶT (cần sudo):
#   1. Thêm block server này vào /etc/nginx/sites-available/medium-clone
#      (sau server block hiện tại blog.caphesuachua.blog).
#   2. sudo nginx -t  &&  sudo systemctl reload nginx
#
# Cùng 1 dist (frontend build), cùng 1 backend NestJS :3000.
# Frontend tự detect hostname → brand/theme/scope IELTS.
# ============================================================

server {
    listen 127.0.0.1:80;
    server_name ielts.caphesuachua.blog;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /home/kronosss2002/project/medium-clone/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location = /rss.xml { proxy_pass http://127.0.0.1:3000; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:3000; }
    location = /robots.txt { proxy_pass http://127.0.0.1:3000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
